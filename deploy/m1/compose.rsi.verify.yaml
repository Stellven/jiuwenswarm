# Explicit test observer overlay after compose.rsi.yaml. Existing production
# targets/endpoints remain separate; role-owned mounts and identities persist.
x-rsi-test-observer: &rsi-test-observer
  image: ${AI4R_VERIFY_IMAGE:?Supply the qualified verification image identity}
  build: !reset null
  entrypoint: !override [python]
  command: !override [-m, pytest, --help]
  working_dir: /workspace
  environment:
    PYTHONPATH: /opt/ai4r
    PYTHONDONTWRITEBYTECODE: '1'
    PYTEST_ADDOPTS: --no-cov
    JIUWENSWARM_M1_PROFILE: '0'
  volumes:
    - type: bind
      source: ../../jiuwenswarm
      target: /opt/ai4r/jiuwenswarm
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ../../tests
      target: /workspace/tests
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ../../pytest.ini
      target: /workspace/pytest.ini
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${AI4R_EVIDENCE_DIR:?Supply the existing role-owned evidence directory}
      target: /evidence
      bind: {create_host_path: false}

services:
  rsi-workbench:
    <<: *rsi-test-observer
  rsi-custodian:
    <<: *rsi-test-observer
