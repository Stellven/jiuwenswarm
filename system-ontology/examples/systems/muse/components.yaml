kind: component
id: comp/muse/expert-router
system: sys/muse-on-spark
parent: comp/muse/token-path
title: Expert router
role: kernel_set
responsibility: For each token in each layer, turn the feed-forward input into 256 logits and choose 8 experts with their
  weights.
runs:
- per_layer
performs:
- expert_router
needs_resources:
- resource: fast_memory
  purpose: logits, ids and weights per token
verification:
- method: parity_with_reference
  checks: The 8 experts chosen per token per layer equal the reference's on a fixed prompt set.
  against: the baseline the target names
equivalence:
- level: bit_exact
  relative_to: the reference router contract
  holds_when: by design; to be shown by this component's parity check against the reference
derived_from:
- component: comp/strata/expert-router
  carried_as: adapted
  adaptation: The router of this model picks 8 of 256 experts per token per layer, where the source's picks 10 of 512. The
    source's choice of kernel, its recorded graph and its two optional routing biases, which read the residency table, belong
    to that implementation and are not carried.
sources:
- ref: comp/strata/expert-router
  basis: proposal
---
kind: component
id: comp/muse/kv-store
system: sys/muse-on-spark
parent: comp/muse/token-path
title: Key and value store
role: state_manager
responsibility: Hold the attention keys and values of every position up to the configured context length, and truncate them
  to a given position when asked.
runs:
- startup
- per_request
- per_layer
state:
  owns:
  - attention_kv
needs_resources:
- resource: fast_memory
  purpose: keys and values for the configured context
- resource: accelerator
  purpose: attention reads them in place
verification:
- method: unit_test
  checks: After truncating to a position and continuing, the state equals that of a run that never went past the position.
derived_from:
- component: comp/strata/kv-store
  carried_as: adapted
  adaptation: 'Only attention keys and values. The model allows a context of about one million tokens, which cannot be held
    beside the weights and the cache; the configured context length is bounded by the memory budget. 46 of the model''s
    62 layers attend only to the last 2,048 tokens: whether the store drops older state for those layers is an open choice
    of this design. Moving old keys and values out of memory is not part of the first version.'
sources:
- ref: comp/strata/kv-store
  basis: proposal
---
kind: component
id: comp/muse/output-head
system: sys/muse-on-spark
parent: comp/muse/token-path
title: Output head
role: kernel_set
responsibility: Turn the residual after the last layer into one row of vocabulary logits per position.
runs:
- per_step
performs:
- output_projection
needs_resources:
- resource: accelerator
  purpose: the vocabulary projection
- resource: fast_memory
  purpose: one logits row of vocabulary size per position
verification:
- method: parity_with_reference
  checks: Logits on recorded final activations match the reference within a stated tolerance.
  against: the baseline the target names
derived_from:
- component: comp/strata/output-head
  carried_as: adapted
  adaptation: The source's choice between two head kernels by weight file format belongs to that implementation and is not
    carried. One row of logits per position, where the source has one per row of a window. The model description names only
    the projection to the vocabulary.
sources:
- ref: comp/strata/output-head
  basis: proposal
---
kind: component
id: comp/muse/sampler
system: sys/muse-on-spark
parent: comp/muse/token-path
title: Sampler
role: sampler
responsibility: 'Turn the logits of the position being generated into one token id by a fixed chain: logit bias, penalties,
  top-k, top-p, min-p, temperature, pick.'
runs:
- per_step
implements_stages:
- decode
needs_resources:
- resource: accelerator
  purpose: the pick over the vocabulary
- resource: fast_memory
  purpose: scratch for the pick
verification:
- method: unit_test
  checks: With a fixed seed and fixed logits, the chain returns the same token as a plain implementation of each step.
derived_from:
- component: comp/strata/sampler
  carried_as: adapted
  adaptation: 'No drafting in the first version: the stage that checks drafted tokens, the choices about drafted rows and
    the equivalence cases that depend on how drafts are accepted are not carried. The source''s alternative sampler kernels
    are not carried.'
sources:
- ref: comp/strata/sampler
  basis: proposal
---
kind: component
id: comp/muse/serving
system: sys/muse-on-spark
title: Serving
role: subsystem
responsibility: Turn each client request into prompt token ids for one resident engine process, and turn that process's
  token lines back into a response.
parts:
- comp/muse/http-front
- comp/muse/prompt-builder
- comp/muse/request-runner
- comp/muse/engine-client
- comp/muse/engine-command-loop
runs:
- startup
- per_request
- per_step
- background
- on_demand
derived_from:
- component: comp/strata/serving
  carried_as: adapted
  adaptation: One conversation is generated at a time; no slot scheduler and no replica router.
sources:
- ref: comp/strata/serving
  basis: proposal
---
kind: component
id: comp/muse/http-front
system: sys/muse-on-spark
parent: comp/muse/serving
title: HTTP front and admission bound
role: api_server
responsibility: Accept client requests over HTTP, bound how many inference calls are pending, answer every failure class
  with a defined status code, and cancel a request whose client has hung up.
runs:
- per_request
- background
state:
  owns:
  - admission_counters
needs_resources:
- resource: cpu
  purpose: Connection handling and watching for a client that hangs up
derived_from:
- component: comp/strata/http-front
  carried_as: adapted
  adaptation: 'One conversation at a time: what the source says about its slot scheduler is not carried. Which request dialects
    the front offers is open until the form of the engine is decided.'
sources:
- ref: comp/strata/http-front
  basis: proposal
---
kind: component
id: comp/muse/prompt-builder
system: sys/muse-on-spark
parent: comp/muse/serving
title: Prompt builder
role: tokenizer
responsibility: Produce the exact prompt token ids and the token limit for a request from its messages, or refuse the request.
runs:
- startup
- per_request
state:
  owns:
  - prompt_encode_cache
needs_resources:
- resource: cpu
  purpose: Template rendering, encoding with the published tokenizer and incremental decoding, in the server process
- resource: fast_memory
  purpose: The tokenizer's tables and the few most recent rendered prompts with their ids, in the one memory pool of this
    machine
decisions:
- id: tokenizer-implementation
  text: The tokenizer used; it must reproduce the reference tokenizer exactly.
  resolved_at: design
- id: chat-template
  text: The template that turns messages into one prompt.
  resolved_at: design
- id: fit-max-tokens
  text: 'What happens when prompt plus requested output exceed the configured context: refuse, or shorten the output limit.'
  resolved_at: design
verification:
- method: parity_with_reference
  checks: Token ids for a fixed set of conversations equal the reference tokenizer's.
  against: the tokenizer published with the model
derived_from:
- component: comp/strata/prompt-builder
  carried_as: adapted
  adaptation: Muse's vocabulary of 202,048 tokens and its chat template. Text only in the first version. The kind of tokenizer
    is the published one's, not the source model's.
sources:
- ref: comp/strata/prompt-builder
  basis: proposal
---
kind: component
id: comp/muse/request-runner
system: sys/muse-on-spark
parent: comp/muse/serving
title: Request runner
role: api_server
responsibility: Drive one API request through one or more engine generations and turn the token ids into content events
  with a final finish record.
runs:
- per_request
- per_step
needs_resources:
- resource: cpu
  purpose: Per-token detokenizing and output parsing on the request's thread
derived_from:
- component: comp/strata/request-runner
  carried_as: adapted
  adaptation: 'One conversation at a time: what concerns several conversations generated at the same time is not carried.
    The model description names no reasoning or tool-call format, so the events are content events.'
sources:
- ref: comp/strata/request-runner
  basis: proposal
---
kind: component
id: comp/muse/engine-client
system: sys/muse-on-spark
parent: comp/muse/serving
title: Engine process client and supervisor
role: supervisor
responsibility: 'Keep one engine child process resident and in step with the server: send each generation as one text command,
  deliver its token lines to the caller, and end and restart a process that is dead, silent, frozen or fatally broken.'
runs:
- startup
- per_request
- per_step
- background
- on_demand
state:
  owns:
  - engine_process_state
derived_from:
- component: comp/strata/engine-client
  carried_as: adapted
  adaptation: The source's command-line transport flag, its second start without a draft model and its query for free memory
    on a separate GPU memory are not carried.
sources:
- ref: comp/strata/engine-client
  basis: proposal
---
kind: component
id: comp/muse/engine-command-loop
system: sys/muse-on-spark
parent: comp/muse/serving
title: Engine command loop
role: scheduler
responsibility: Inside the engine process, read one command at a time, run one prompt read and one generation at a time,
  and report each generation's tokens and end figures as text lines.
runs:
- startup
- per_request
- per_step
implements_stages:
- prefill
- decode
state:
  owns:
  - live_conversation_record
  reads:
  - parked_conversations
needs_resources:
- resource: cpu
  purpose: The command loop thread and one thread reading standard input
derived_from:
- component: comp/strata/engine-command-loop
  carried_as: adapted
  adaptation: 'No batch slots: one prompt read or one generation at a time.'
sources:
- ref: comp/strata/engine-command-loop
  basis: proposal
---
kind: component
id: comp/muse/conversation-reuse
system: sys/muse-on-spark
title: Conversation reuse
role: subsystem
responsibility: Let a request that continues a conversation the engine has seen start from stored state instead of reading
  its whole prompt again.
parts:
- comp/muse/resume-decision
- comp/muse/parked-conversations
- comp/muse/session-files
runs:
- startup
- per_request
- on_demand
derived_from:
- component: comp/strata/conversation-reuse
  carried_as: adapted
  adaptation: 'A stored conversation is matched by token ids only: this engine serves text, and the source''s image keys
    and steering flag do not exist here.'
sources:
- ref: comp/strata/conversation-reuse
  basis: proposal
---
kind: component
id: comp/muse/resume-decision
system: sys/muse-on-spark
parent: comp/muse/conversation-reuse
title: Resume decision
role: policy_runner
responsibility: For each request, choose the stored state that shares the longest valid prefix with the prompt, make the
  session hold exactly that state by truncating or restoring, and report the prefix length.
runs:
- per_request
implements_stages:
- prefill
state:
  reads:
  - parked_conversations
  writes:
  - live_conversation_record
  - parked_conversations
needs_resources:
- resource: cpu
  purpose: Comparing token ids; linear in the prefix length
policies:
- conversation-resume
verification:
- method: parity_with_reference
  checks: Output after resuming from a shared prefix equals output after reading the whole prompt.
  against: the same engine without reuse
derived_from:
- component: comp/strata/resume-decision
  carried_as: adapted
  adaptation: With attention state only, going back to an earlier point is a truncation of keys and values; no chain of
    checkpoints is needed.
sources:
- ref: comp/strata/resume-decision
  basis: proposal
---
kind: component
id: comp/muse/parked-conversations
system: sys/muse-on-spark
parent: comp/muse/conversation-reuse
title: Parked conversation cache
role: conversation_store
responsibility: Hold images of other conversations' attention state within a budget, find the one with the longest valid
  prefix for a prompt, and evict.
runs:
- startup
- per_request
- on_demand
state:
  owns:
  - parked_conversations
  reads:
  - attention_kv
  writes:
  - attention_kv
needs_resources:
- resource: fast_memory
  purpose: parked images; this memory is taken from the expert cache
policies:
- parked-eviction
derived_from:
- component: comp/strata/parked-conversations
  carried_as: adapted
  adaptation: An image is keys and values only. On one memory pool a parked image takes memory directly from the expert
    cache, so the budget is a trade against cache size, not a separate host memory budget.
sources:
- ref: comp/strata/parked-conversations
  basis: proposal
---
kind: component
id: comp/muse/session-files
system: sys/muse-on-spark
parent: comp/muse/conversation-reuse
title: Session files
role: conversation_store
responsibility: On an explicit command, write the session's current conversation to one file or read one back, refusing
  any file that does not belong to this model, configuration and engine version before any state changes.
runs:
- on_demand
state:
  reads:
  - live_conversation_record
  - attention_kv
  writes:
  - live_conversation_record
  - attention_kv
needs_resources:
- resource: storage
  purpose: 'One file per saved session: the conversation''s token record and its attention keys and values'
- resource: fast_memory
  purpose: A write buffer on a save; about the payload plus a buffer on a read. This machine has one memory pool, so the
    buffer is taken from the same memory as the expert cache
derived_from:
- component: comp/strata/session-files
  carried_as: adapted
  adaptation: A session file holds this model's state only, the attention keys and values. The source's other kinds of state
    and its checkpoints do not exist here, and what concerns several conversations generated at the same time is not carried.
sources:
- ref: comp/strata/session-files
  basis: proposal
---
kind: component
id: comp/muse/telemetry
system: sys/muse-on-spark
title: Telemetry
role: subsystem
responsibility: Record what a run chose and what each request cost, and make it readable from outside without changing any
  token.
not_responsible_for:
- Liveness watchdogs. They are with the engine client.
parts:
- comp/muse/engine-diagnostics
- comp/muse/server-metrics
runs:
- startup
- per_request
- per_step
- background
- on_demand
derived_from:
- component: comp/strata/telemetry
  carried_as: adapted
  adaptation: The work the source does once per window is done once per step here. The source's note about a failed GPU
    allocation is not carried.
sources:
- ref: comp/strata/telemetry
  basis: proposal
---
kind: component
id: comp/muse/engine-diagnostics
system: sys/muse-on-spark
parent: comp/muse/telemetry
title: Engine diagnostics
role: telemetry
responsibility: Inside the engine process, record what the run selected at start, count cache hits and storage reads per
  layer, and record how often each expert is routed, writing each when asked.
runs:
- startup
- per_step
- on_demand
state:
  owns:
  - dispatch_counts
  - run_manifest_record
  - expert_usage_profile
needs_resources:
- resource: storage
  purpose: A JSON report at exit and a JSON manifest, each only when a path is given
verification:
- method: unit_test
  checks: The recorded usage counts sum to 8 times 62 times the number of tokens processed.
observation_points:
- cache_hit_count
- cache_miss_count
- expert_usage_profile
- run_manifest
derived_from:
- component: comp/strata/engine-diagnostics
  carried_as: adapted
  adaptation: It must also record how often each expert of each layer is routed. That distribution is the quantity the speed
    of this engine depends on most, and it has not been measured for this model.
sources:
- ref: comp/strata/engine-diagnostics
  basis: proposal
---
kind: component
id: comp/muse/server-metrics
system: sys/muse-on-spark
parent: comp/muse/telemetry
title: Request accounting and metric exporters
role: telemetry
responsibility: In the server process, turn the engine's end-of-request figures and the server's own clocks into per-request
  records, running totals and a live rate, fill the usage and timings of each response, sample the machine at intervals,
  and render all of it for outside monitors.
runs:
- per_request
- per_step
- background
- on_demand
state:
  owns:
  - request_history
needs_resources:
- resource: cpu
  purpose: Work per finished request, per reading of the machine and per request from a monitor
- resource: fast_memory
  purpose: Bounded histories of finished requests, transition events and hardware samples, in the one memory pool of this
    machine
derived_from:
- component: comp/strata/server-metrics
  carried_as: adapted
  adaptation: No drafting in the first version, so the counts of drafted tokens are not carried. The sizes of its histories
    are open choices.
sources:
- ref: comp/strata/server-metrics
  basis: proposal
