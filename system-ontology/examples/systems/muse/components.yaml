kind: component
id: comp/muse/prompt-path
system: sys/muse-on-spark
title: Prompt path
role: prompt_reader
responsibility: Read the prompt in chunks, one layer at a time, reading each routed expert that is not cached once per chunk,
  and leave behind the attention state that generation continues from.
runs:
- per_request
implements_stages:
- prefill
state:
  writes:
  - attention_kv
  reads:
  - residency_table
needs_resources:
- resource: accelerator
  purpose: batched computation of a chunk, one layer at a time
- resource: fast_memory
  purpose: chunk buffers and the experts of the layer being read
decisions:
- id: chunk-size
  text: Tokens per chunk. Larger chunks amortise each expert read over more tokens but need more experts in memory at once.
  resolved_at: startup
- id: borrow-cache
  text: Whether the prompt path may use cache slots for a layer's experts while it reads, and whether it restores the cache
    afterwards.
  resolved_at: startup
- id: feeds-usage
  text: Whether the experts a prompt routes count toward the usage that decides the cache's contents for generation.
  resolved_at: design
verification:
- method: parity_with_reference
  checks: The attention state after reading a prompt in chunks matches reading it one token at a time, within a stated numeric
    tolerance.
  against: the decode loop fed the same prompt
- method: measurement
  checks: Seconds per chunk and bytes read from storage per chunk, by chunk size.
equivalence:
- level: numeric
  holds_when: compared with reading the same prompt one token at a time
  note: Batched kernels may round differently; to be measured.
derived_from:
- component: comp/strata/prompt-path
  carried_as: adapted
  adaptation: 'No CPU share: there is no second copy of the experts for the CPU to read. The chunk size becomes the main
    choice, because the tokens of a large chunk together route to most of a layer''s 256 experts, which is up to 3.3 GB
    read from storage per layer.'
- component: comp/ds4/prefill-driver
  carried_as: adapted
  adaptation: Reading a prompt chunk by chunk, one layer at a time.
sources:
- ref: comp/strata/prompt-path
  basis: proposal
- ref: comp/ds4/prefill-driver
  basis: proposal
