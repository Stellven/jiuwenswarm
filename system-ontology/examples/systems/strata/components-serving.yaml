needs_resources:
  - resource: cpu
    purpose: Comparing token ids; linear in the prefix length
policies:
  - conversation-resume
decisions:
  - id: prompt-cache-on
    text: Reuse of any kind needs a checkpoint capacity above zero.
    value:
      value: 6
      note: The capacity; 0 turns all reuse off.
    resolved_at: startup
    source: src/program/generate.cpp lines 927 and 16198
  - id: candidate-precedence
    text: 'Which stored state wins: the live session and its checkpoints, longest first; then an idle batch slot or its checkpoints if strictly
      longer (text-only requests); then the best parked conversation if strictly longer than both.'
    value: live and own checkpoints > idle slot > parked
    resolved_at: design
    source: src/program/generate.cpp lines 16199 to 16204, 16237 to 16257 and 16292 to 16302
  - id: take-or-borrow
    text: A match on a parked conversation's live state or deepest checkpoint moves the whole entry into the session; a match on a shallower checkpoint
      copies only the K/V up to that point and leaves the entry parked. No borrow with a layer split or past a pinned checkpoint.
    value: take at the deepest point, borrow at a shallower one
    resolved_at: runtime
    source: include/strata/core/conversation_cache.hpp lines 343 to 359; src/program/generate.cpp lines 16536 to 16563
  - id: copy-stream-reserve
    text: A card that would have to create its copy stream and has less than this much VRAM free gets no restore; the prompt is read again.
    value:
      value: 64
      unit: MiB
      unit_basis: binary
    resolved_at: design
    source: src/program/generate.cpp lines 16327 to 16367
invariants:
  - id: inv/last-token-never-reused
    text: A reused prefix is at least 1 and at most n-1 tokens of an n-token prompt; the last prompt token always starts the first verify window.
  - id: inv/reuse-needs-tokens-images-steering
    text: A stored prefix is reused only when every token id equals the prompt's, the image keys below it are equal, and the steering flag matches.
  - id: inv/prefix-ends-at-stored-point
    text: 'Reading resumes only at a stored point: the live end or a checkpoint, never at an arbitrary common prefix.'
  - id: inv/park-before-rewind
    text: Before any restore or rewind, the outgoing conversation is parked.
  - id: inv/validate-before-touch
    text: A parked image is validated before the outgoing state is touched; a restore that fails after validation ends the engine rather than
