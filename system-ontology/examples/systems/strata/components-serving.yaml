    basis: code
  - ref: setup.py lines 7432 to 7503 (hardware key, saved calibration)
    basis: code
  - ref: strata_control/calibration.py lines 37 to 38, 162 to 243 and 275 to 276
    basis: code
  - ref: strata_control/autotune.py lines 57 to 75, 161 to 176 and 244 to 268
    basis: code
  - ref: strata_control/tune_knobs.py lines 85 to 190 and 344 to 346
    basis: code
  - ref: strata_control/tune_session.py lines 49 to 56 and 345 to 426
    basis: code
  - ref: strata_control/presets.py lines 128 to 204 and 432 to 512
    basis: code
  - ref: strata_control/tuning.py lines 92 to 123 (third tuning path, dimension table only)
    basis: header_comment
not_read: strata_control/tuning.py, tune_engine.py, tune_api.py, tune_apply.py, tune_history.py and calibration_jobs.py beyond headers; autotune.py
  after line 333.
