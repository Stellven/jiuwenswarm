kind: component
id: comp/strata/http-front
title: HTTP front and admission bound
system: sys/strata
parent: comp/strata/serving
role: api_server
responsibility: Accept OpenAI- and Anthropic-shaped HTTP requests, bound how many inference calls are pending, answer every failure class with
  a defined status code, and cancel a request whose client has hung up.
not_responsible_for:
  - Rendering or tokenizing the prompt (prompt builder)
  - Ordering requests onto the engine; it only counts and refuses (slot scheduler and the request runner's turn lock)
  - The content of metrics endpoints (server metrics)
runs:
  - per_request
  - background
state:
  owns:
    - admission_counters
needs_resources:
  - resource: cpu
    purpose: One thread per connection and one watcher thread per inference request
decisions:
  - id: max-queue
    text: How many inference calls may wait beyond those the engine can run at once. Unset means no bound.
    value:
      value: UNSET
      note: No default; the limit applies only when the flag or config key is given. Range 0 to 4096.
    resolved_at: startup
    source: serve/server.py lines 9985 to 9987 and 10204
  - id: admission-limit
    text: The number of reserved inference calls above which a new one is refused with 429.
    value: max(1, engine batch slots) + max_queue
    resolved_at: startup
    source: serve/server.py lines 4866 to 4869
  - id: queue-timeout
    text: How long a request may wait for the engine before it is answered 429.
    value:
      value: UNSET
      note: No default.
    resolved_at: startup
    source: serve/server.py line 10205
  - id: stream-write-timeout
    text: How long a streaming write may make no progress before the request ends as a disconnect.
    value:
      value: 60
      unit: s
    resolved_at: startup
    source: serve/server.py line 320 (environment variable STRATA_STREAM_WRITE_TIMEOUT_S)
  - id: disconnect-poll
    text: How often the watcher checks whether the client closed its socket.
    value:
      value: 0.5
      unit: s
    resolved_at: design
    source: serve/server.py line 7659
invariants:
  - id: inv/admission-before-headers
    text: An inference call is counted against the admission limit before any response header is written.
  - id: inv/draining-refuses
    text: While the server is draining, every new inference request is answered 503 and none is admitted.
  - id: inv/never-truncate-prompt
    text: A prompt that does not fit the context is refused with 400 and is never shortened.
calls:
  - name: POST /v1/chat/completions, /v1/messages, /v1/responses
    takes: A JSON body with messages, tools, sampling fields and max tokens
    returns: A server-sent event stream, or one JSON body
    does: Runs one generation and answers in the caller's dialect.
  - name: reserve_inference / release_inference
    returns: true, false (limit reached) or none (draining)
    does: Counts one pending inference call; refuses when the limit is reached or the server is draining.
  - name: note_client_disconnect
    takes: The request's cancel event
    does: Sets the request's cancel event once and counts the disconnect only if the request was still queued or running.
  - name: begin_drain / wait_for_drain / cancel_owned_requests
    takes: A timeout
    returns: The number of calls still in flight
    does: Stops admission, waits for reserved calls to finish, and cancels the requests this server admitted.
verification:
  - method: unit_test
    checks: HTTP behaviour against a scripted mock engine. Named from the file name. The test body was not read, so what it asserts is not confirmed.
    source: serve/test_server.py, test_request_hardening.py, test_chunked_body.py, test_security.py, test_queue_keepalive.py, test_quiet_cancel.py,
      test_lifecycle.py
observation_points:
  - admission_reserved
  - admission_rejected
  - queue_timeouts
  - client_disconnect_cancels
equivalence:
  level: bit_exact
  relative_to: The token ids the engine produced for the request
  note: It can refuse a request or end one early. It does not alter tokens.
sources:
  - ref: serve/server.py lines 4866 to 4959 (admission, drain, disconnect)
    basis: code
  - ref: serve/server.py lines 7646 to 7672 (client watcher)
    basis: code
  - ref: serve/server.py lines 8132 to 8310 (POST routing, admission block and error mapping)
    basis: code
  - ref: serve/server.py lines 7750 to 8130 (GET routes; route list only)
    basis: code
  - ref: serve/server.py lines 8887 (server class)
    basis: code
not_read: Most route handler bodies, the event-stream framing (openai_chunks, anthropic_events), serve/responses.py and serve/structured.py.
