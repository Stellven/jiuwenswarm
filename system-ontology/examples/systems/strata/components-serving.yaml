  - method: unit_test
    checks: The HTTP endpoint and the policing of the exchange. Named from the file name. The test body was not read, so what it asserts is not
      confirmed.
    invariants:
      - inv/lost-step-kills-engine
    source: serve/test_slots.py, serve/test_session_save_retry.py
equivalence:
  level: bit_exact
  relative_to: The state that was saved
  note: A restored session has fewer rewind points than the saved one because one checkpoint is written. The model fingerprint does not detect
    an edit in the middle of a model file.
