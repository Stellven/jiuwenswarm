kind: component
id: comp/strata/engine-client
title: Engine process client and supervisor
system: sys/strata
parent: comp/strata/serving
role: supervisor
responsibility: 'Keep one engine child process resident and in step with the server: send each generation as one text command, deliver its token
  lines to the caller, and end and restart a process that is dead, silent, frozen or fatally broken.'
not_responsible_for:
  - Interpreting tokens (request runner)
  - Serialising requests when batch slots are off. The request runner's turn lock does that.
  - Building the engine's argument list (launch argument resolver)
runs:
  - startup
  - per_request
  - per_window
  - background
  - on_demand
state:
  owns:
    - engine_process_state
needs_resources:
  - resource: cpu
    purpose: One reader thread per engine process; a watchdog thread inside the engine process
decisions:
  - id: transport
    text: 'How the server talks to the engine: a child process started with --serve, text lines on its standard input and output, standard error
      to a log file.'
    value: stdin/stdout pipes, line buffered
    resolved_at: design
    source: serve/server.py lines 1209 to 1211
  - id: ready-timeout
    text: How long the engine may take to report READY.
    value:
      value: 900
      unit: s
    resolved_at: startup
    source: serve/server.py line 388 (STRATA_ENGINE_READY_S; 0 waits for ever)
  - id: start-retries
    text: How often a start that exits before READY for a transient reason is tried again, after 2, 4 and 8 s.
    value: 3
    resolved_at: startup
    source: serve/server.py lines 692 and 1260 to 1276
  - id: start-second-attempts
    text: One more start with no drafter when a card ran out of memory; one more start with the MTP drafter when an automatically chosen DFlash2
      drafter did not start.
    value: one retry each
    resolved_at: design
    source: serve/server.py lines 1277 to 1302
  - id: silence-limit
    text: How long a running request's engine may print nothing before it is killed. A first prompt chunk adds min(prompt, 32768)/50 s; after
      a progress line the allowance is 3 times the last chunk's time.
    value:
      value: 300
      unit: s
    resolved_at: startup
    source: serve/server.py lines 314, 328 to 330, 2792 to 2806 and 2856 to 2859 (config key engine_silence_s; 0 waits for ever)
  - id: frozen-limit
    text: An engine that prints nothing for this long and also used at most 0.5 CPU seconds and 1 MiB of I/O in that time, while the GPU is not
      busy, is killed.
    value:
      value: 90
      unit: s
    resolved_at: startup
    source: serve/server.py lines 349, 376 to 383 and 2942 to 2966 (STRATA_ENGINE_STALL_S; needs psutil)
  - id: in-engine-watchdog
    text: Inside the engine, a thread aborts the process when a busy request records no progress beat for this long.
    value:
      value: 60
      unit: s
    resolved_at: startup
    source: src/program/generate.cpp lines 14027 to 14078 (STRATA_WATCHDOG_S; 0 off)
  - id: restart-tries
    text: How often a dead engine is started again at the next request, 15 s apart.
    value: 3
    resolved_at: design
    source: serve/server.py lines 1512 and 1530 to 1563
  - id: fatal-gpu-limit
    text: After this many engine deaths from a fatal GPU error within ten minutes the engine is not started again until the window has passed.
    value:
      value: 3
      note: Window 600 s; one death counts once per process.
    resolved_at: design
    source: serve/server.py lines 5215 to 5241
  - id: idle-unload
    text: Unload the engine after this many idle seconds. Off by default.
    value:
      value: 0
      unit: s
    resolved_at: startup
    source: serve/server.py lines 5467 to 5478
  - id: top-k-clamp
    text: A top_k outside 1 to 64 is sent as 64, the most candidates the engine's sampled path keeps.
    value: 64
    resolved_at: design
    source: serve/server.py lines 1656 to 1659
invariants:
  - id: inv/one-stdout-reader
    text: 'Exactly one thread reads the engine''s output at a time: a helper up to READY, then the reader thread.'
  - id: inv/request-bound-to-process
    text: A request notes the engine process it was sent to and never sends to or reads from the process that replaced it.
  - id: inv/not-alive-until-ready
    text: An engine counts as alive only between its READY line and its end; a restarting engine is not alive.
  - id: inv/fatal-line-ends-engine
    text: After a verifier-timeout line or a fatal GPU error line the process takes no further request, and its trailing end line is never delivered.
  - id: inv/early-leave-drains
    text: A caller that leaves early causes STOP to be sent and the lines read to the end line within a time allowance; if the allowance passes
      the engine is killed.
calls:
  - name: generate
    takes: prompt token ids, output limit, sampling settings, cancel event
    returns: token ids and heartbeats; the end-line figures in last
    does: Sends one generation and yields its token ids as they arrive, with a heartbeat every 10 s of quiet; leaves the engine at a command boundary
      or ended.
  - name: alive / restart / unload
    returns: true or false; nothing
    does: Reports whether the process is usable; starts the same command again; ends the process and keeps the command for a later start.
  - name: vram
    takes: a reserve in MiB, or none for the starting reserve
    returns: the engine's figures (expert slots, cache size, free VRAM)
    does: Asks the engine between requests to keep a given amount of VRAM free by shrinking or growing its expert cache.
  - name: session_file
    takes: action and path
    returns: tokens, bytes and milliseconds
    does: Relays a session save or restore between requests and kills the engine if the reply is outside the allowed set.
verification:
  - method: unit_test
    checks: Start, restart, fatal GPU handling, drain and cancel behaviour against stub engines. Named from the file name. The test body was not
      read, so what it asserts is not confirmed.
    invariants:
      - inv/request-bound-to-process
      - inv/fatal-line-ends-engine
    source: serve/test_fatal_gpu_restart.py, test_fatal_recovery.py, test_restart_waiters.py, test_ready_timeout.py, test_reader_follows_engine.py,
      test_abort_sync.py, test_control_cancel.py, test_stream_ownership.py, test_leftover_engines.py
  - method: none_found
    checks: The in-engine progress watchdog.
    source: src/program/generate.cpp lines 14022 to 14082
observation_points:
  - engine_info
  - prompt_progress
  - reused_tokens
  - last_done_figures
  - death_note
equivalence:
  level: bit_exact
  relative_to: The engine's token lines
  note: It forwards sampling settings unchanged except the top_k clamp to 64 and a default penalty window of 64 tokens. A restart drops cached
    conversation state, which changes what is re-read, not what is asked.
sources:
  - ref: serve/server.py lines 1101 to 1563 (start, READY read, reader thread, restart)
    basis: code
  - ref: serve/server.py lines 1565 to 1768 (end-line parser, sampling keys, send)
    basis: code
  - ref: serve/server.py lines 2742 to 2981 (generate, stall check, silent end)
    basis: code
  - ref: serve/server.py lines 298 to 388 (timeouts) and 970 to 976 (fatal prefixes)
    basis: code
  - ref: serve/server.py lines 5215 to 5328 (fatal GPU limit and ensure_loaded)
    basis: code
  - ref: serve/server.py lines 5441 to 5478 (unload and idle unload)
    basis: code
  - ref: src/program/generate.cpp lines 14022 to 14082 (in-engine progress watchdog)
    basis: code
  - ref: include/strata/core/progress.hpp lines 17 to 68
    basis: code
not_read: close(), the body of the session-file exchange, the Vision class, and the stall report the in-engine watchdog prints.
