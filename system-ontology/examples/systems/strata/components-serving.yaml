# Strata, serving area: serving, conversation reuse, setup and telemetry.
# Written from engines/strata-notes/serving.md (Strata commit 504b143, CUDA path, Qwen3.8-Flash-Next).
# Generated by a script so that every text value is validly quoted; edit the facts, not the quoting.
kind: component
id: comp/strata/serving
title: Serving
system: sys/strata
role: subsystem
responsibility: Turn each client request into prompt token ids for one resident engine process, and turn that process's token lines back into
  a response.
parts:
  - comp/strata/http-front
  - comp/strata/prompt-builder
  - comp/strata/request-runner
  - comp/strata/engine-client
  - comp/strata/engine-command-loop
  - comp/strata/slot-scheduler
  - comp/strata/replica-router
not_responsible_for:
  - Computing anything on the GPU. The Python server holds no model state.
  - Deciding whether stored conversation state is reused. The engine process decides that from the token ids (conversation reuse).
runs:
  - startup
  - per_request
  - per_window
  - background
  - on_demand
sources:
  - ref: serve/server.py lines 1 to 26 (module docstring)
    basis: header_comment
  - ref: serve/server.py lines 1101 to 3140 (StrataEngine) and 4723 to 6715 (Service)
    basis: code
not_read: Vision, image generation, MCP tools, the Responses API module, split serving and the web application were out of scope or not read.
