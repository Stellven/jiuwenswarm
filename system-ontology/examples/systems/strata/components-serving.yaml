kind: component
id: comp/strata/engine-command-loop
title: Engine command loop and batch slots
system: sys/strata
parent: comp/strata/serving
role: scheduler
responsibility: Inside the engine process, read one command at a time, run one prompt read at a time, advance every active batch slot one window
  at a time between commands, and report each generation's tokens and end figures as text lines.
not_responsible_for:
  - Choosing which slot a request goes to or the order of admissions. The Python server decides and names the slot (slot scheduler).
  - The forward pass, verification and sampling inside a window (token path, speculation)
  - Deciding from which stored state a prompt read starts (resume decision)
runs:
  - startup
  - per_request
  - per_window
implements_stages:
  - prefill
  - verify
state:
  owns:
    - live_conversation_record
    - batch_slot_table
  reads:
    - conversation_checkpoints
    - parked_conversations
needs_resources:
  - resource: fast_memory
    purpose: One session state per batch slot on every stage, allocated at start before the expert cache is sized
    note: Only with batch slots on. The memory is taken from what the expert cache would hold.
  - resource: accelerator
    purpose: Batch windows
  - resource: cpu
    purpose: The command loop thread and one thread reading standard input
policies:
  - batch-window-composition
decisions:
  - id: batch-slots
    text: How many sequences the engine keeps open. Zero means one request at a time.
    value: 0
    resolved_at: startup
    source: serve/server.py lines 3874 to 3921 (config key parallel, flags --batch and --slots)
  - id: slots-that-fit
    text: The engine runs as many slot sessions as it can allocate on every stage; fewer than two turns batching off. It reports the number it
      runs.
    value: min(asked, fit, window rows)
    resolved_at: startup
    source: src/program/generate.cpp lines 6996 to 7030
  - id: window-rows
    text: The most rows one batch window holds.
    value:
      value: 8
      note: Build option STRATA_VERIFY_MAX_T, 8 or 16.
    resolved_at: design
    source: include/strata/kernels/window_limits.hpp lines 14 to 23
  - id: rows-with-slot-drafts
    text: With the opt-in slot drafts a slot takes two rows, so at most four slots are in one window and more take turns.
