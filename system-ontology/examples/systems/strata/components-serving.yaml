kind: component
id: comp/strata/request-runner
title: Request runner
system: sys/strata
parent: comp/strata/serving
role: api_server
responsibility: Drive one API request through one or more engine generations and turn the token ids into reasoning, content and tool-call events
  with a final finish record.
not_responsible_for:
  - Choosing a batch slot or the order of admissions (slot scheduler)
  - HTTP framing (HTTP front)
  - Sampling. It forwards sampling settings; the engine's sampler applies them.
runs:
  - per_request
  - per_window
needs_resources:
  - resource: cpu
    purpose: Per-token detokenizing and output parsing on the request's thread
decisions:
  - id: sampling-default-order
    text: Which sampling value wins when several sources give one.
    value: request field > shared chat settings > config sampling block > model-card defaults
    resolved_at: runtime
    source: serve/server.py lines 6159 to 6162
  - id: single-turn-lock
    text: Without batch slots, one request at a time holds the engine. The turn is a plain lock polled with a timeout; arrival order is not enforced.
    value: threading.Lock, polled every 10 s with a keep-alive
    resolved_at: design
    source: serve/server.py lines 4743 and 6274 to 6296
  - id: answer-room
    text: With thinking on and no budget given, close the thinking early enough that the answer keeps a share of the output limit.
    value: answer keeps min(max(reserve minimum, limit/4), limit/2) tokens
    resolved_at: runtime
    source: serve/server.py lines 6165 to 6173
  - id: repeat-stop
    text: End the reply as length when one token repeats this many times in a row.
    value:
      value: UNSET
      note: Constant REPEAT_STOP_TOKENS; its value was not read. 0 turns it off.
    resolved_at: startup
    source: serve/server.py lines 4821 and 6381 to 6384
  - id: nonfinite-retry
    text: When the engine reports non-finite logits before any token was sent, send the same request once more.
    value:
      value: 1
      unit: retries
    resolved_at: design
    source: serve/server.py lines 6457 to 6480
  - id: reasoning-loop-recovery
    text: 'Opt-in: when the thinking repeats whole passages, either end the reply or continue from a rewritten prompt with temperature at least
      1.0 and presence penalty at least 1.5.'
    value: false
    resolved_at: startup
    source: serve/server.py lines 6405 to 6416 and 6481 to 6499
  - id: keep-alive
    text: A ping is sent when nothing has gone out for this long.
    value:
      value: 10
      unit: s
    resolved_at: design
    source: serve/server.py lines 288 to 289
invariants:
  - id: inv/drain-before-release
    text: A generation is stopped and read to its end line while the request still holds the engine, so the next request cannot read its leftovers.
  - id: inv/own-done-only
    text: Only end-of-generation records that belong to this request are counted as its figures.
  - id: inv/continuation-extends-prefix
    text: A continuation's prompt is the previous prompt plus the tokens generated plus the injected text, so the engine continues from the prefix
      it already holds.
calls:
  - name: run
    takes: prompt token ids, thinking flag, tools, output limit, sampling settings, cancel event, forced call
    returns: events (reasoning, content, tool call), pings, then a record with finish reason, completion tokens, reused tokens and timings
    does: Yields the request's events in order and always ends with one finish record, also when the client leaves or the engine fails.
verification:
  - method: unit_test
    checks: Stop strings, budgets, recovery passes and accounting against a scripted mock engine. Named from the file name. The test body was
      not read, so what it asserts is not confirmed.
    source: serve/test_stop_holdback.py, test_reasoning_loop_recovery.py, test_reasoning_rescue.py, test_reasoning_tools.py, test_drafting_retry.py,
      test_request_accounting.py, test_serve_robustness.py
observation_points:
  - queued
  - admitted
  - reading
  - first_token
  - finished
  - cancelled
  - disconnected
  - timeout
  - error
equivalence:
  - level: bit_exact
    relative_to: The engine's token stream for the prompt
    holds_when: No thinking budget, forced call, recovery pass, stop string or repeat stop fires
  - level: approximate
    relative_to: The model's unconstrained continuation
    holds_when: A thinking budget or forced tool call injects tokens, a recovery pass raises temperature and presence penalty, or the reply is
      cut at a stop string
    note: These changes are deliberate and set by the request or the config.
sources:
  - ref: serve/server.py lines 6143 to 6715 (Service.run and _run)
    basis: code
  - ref: serve/server.py lines 288 to 293 (keep-alive constants)
    basis: code
  - ref: serve/server.py lines 4528 to 4545 (end token ids)
    basis: code
not_read: The output parser (serve/frontend.py OutputParser) and tool-call recovery; MCP tool rounds (run_with_mcp).
