    basis: code
  - ref: serve/server.py lines 4761 to 4795 (state) and 5521 to 5740 (rates, metrics, prometheus, status)
    basis: code
  - ref: serve/server.py lines 6577 to 6628 (settle block) and 6718 to 6815 (figures)
    basis: code
  - ref: serve/prometheus.py lines 10 to 90
    basis: code
  - ref: serve/telemetry.py lines 1 to 108 and 543 to 677
    basis: code
  - ref: src/program/generate.cpp lines 16073, 18101, 18202 and 19446 (where the two engine durations start and end)
    basis: code
