kind: component
id: comp/strata/resume-decision
title: Resume decision
system: sys/strata
parent: comp/strata/conversation-reuse
role: policy_runner
responsibility: For each request, choose the stored state that shares the longest valid prefix with the prompt, make the session hold exactly
  that state, and report the prefix length.
not_responsible_for:
  - Reading prompt tokens (prompt path)
  - Creating checkpoints (checkpoint chain)
  - Copying state between device and host (parked conversations, checkpoint chain)
runs:
  - per_request
implements_stages:
  - prefill
state:
  reads:
    - conversation_checkpoints
    - parked_conversations
    - batch_slot_table
  writes:
    - live_conversation_record
    - conversation_checkpoints
