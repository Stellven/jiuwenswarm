kind: component
id: comp/strata/session-files
title: Session files
system: sys/strata
parent: comp/strata/conversation-reuse
role: conversation_store
responsibility: On an explicit command, write the session's current conversation to one file or read one back, refusing any file that does not
  belong to this model, configuration and engine version before any state changes.
not_responsible_for:
  - Saving automatically. Nothing is written unless a SAVE command arrives.
  - Persisting parked conversations
  - Authenticating a file. The hashes detect corruption only.
runs:
  - on_demand
state:
  reads:
    - live_conversation_record
    - conversation_checkpoints
    - attention_kv
    - indexer_keys
    - gdn_state
    - ple_history
  writes:
    - live_conversation_record
    - conversation_checkpoints
    - attention_kv
    - indexer_keys
    - gdn_state
    - ple_history
needs_resources:
  - resource: storage
    purpose: 'One file per saved session: the conversation''s K/V plus running state'
  - resource: slow_memory
    purpose: On a save, two copies of the kept checkpoint, the live state and a 16 MiB write buffer; on a read, about the payload plus a 16 MiB
      buffer
  - resource: accelerator
    purpose: Streaming K/V from the device on a save and writing state on a restore
decisions:
  - id: checkpoints-written
    text: 'Exactly one checkpoint is written: the deepest, or the deepest pinned one.'
    value: 1
    resolved_at: design
    source: src/core/conversation_file.cpp lines 1120 to 1136
  - id: free-disk-floor
    text: Disk space that must remain after a save.
    value:
      value: 4096
      unit: MiB
      unit_basis: binary
    resolved_at: startup
    source: src/program/generate.cpp lines 944 and 15692
  - id: save-reclaim
    text: 'Opt-in: a save short of memory first drops retained K/V, then evicts parked conversations oldest first, then erases checkpoints other
      than the one to be written and pinned ones.'
    value: false
    resolved_at: startup
    source: src/program/generate.cpp lines 945 and 15650 to 15661; include/strata/core/session_save_reclaim.hpp lines 17 to 53
  - id: refused-configurations
    text: Session files are refused with a layer split, a peer device, batch slots, a checkpoint capacity of zero, or no complete live session.
    value: refused
    resolved_at: design
    source: src/program/generate.cpp lines 15601 to 15605 and 15624
  - id: config-fingerprint
    text: 'What binds a file to a configuration: engine version, backend, KV format, context length, resident K/V, draft window, K/V rotation,
      position-encoding parameters, the control-vector digest and 23 arithmetic switches. Sampling, seeds, draft tuning, expert tier and prompt
      chunk are excluded.'
    value: one engine version per file
    resolved_at: design
    source: include/strata/core/conversation_file.hpp lines 69 to 83
  - id: model-fingerprint
    text: 'What binds a file to a model: for each loaded model input, its size and its first and last MiB. An edit in the middle of a file is
      not detected.'
    value: size plus first and last MiB per input
    resolved_at: design
    source: include/strata/core/conversation_file.hpp lines 86 to 99
  - id: server-save-retry
    text: With the reclaim option, the server retries a save refused for memory up to 3 times, waiting up to 30 s for memory.
    value: 3
    resolved_at: design
    source: serve/session_save_retry.py lines 12 to 14 and 35 to 84
invariants:
  - id: inv/file-validated-before-device-write
    text: A file is checked in order (regular single-link file, size bounds, header hash, magic, version, model and configuration identity, memory,
      bounded parse, payload hash, full snapshot validation) and only then is device state written.
  - id: inv/atomic-save
    text: A save writes a temporary file beside the target and renames it; a failure before the rename leaves the old file.
  - id: inv/failed-restore-ends-engine
    text: A transfer failure after device writes began ends the engine.
  - id: inv/lost-step-kills-engine
    text: Any reply line outside the allowed set during a save or restore means the two sides lost step, and the server kills the engine.
calls:
  - name: SAVE <path> / RESTORE <path>
    takes: a path
    returns: SAVED or RESTORED <tokens> <bytes> <ms>; SERR <kind> <published 0|1> <reason>; FATAL <reason>; progress lines
    does: Writes or reads one session file between requests.
  - name: POST /slots/0?action=save|restore
    takes: a file name
    returns: status 200, or 400, 507, 503, 500 or 501 by refusal kind
    does: Exposes the two commands over HTTP when a save directory is configured; only slot 0, only a plain file name, not with batch slots.
verification:
  - method: unit_test
    checks: File format, validation and the reclaim order. Named from the file name. The test body was not read, so what it asserts is not confirmed.
    invariants:
      - inv/file-validated-before-device-write
