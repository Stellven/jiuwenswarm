kind: component
id: comp/strata/prompt-builder
title: Prompt builder
system: sys/strata
parent: comp/strata/serving
role: tokenizer
responsibility: Produce the exact prompt token ids and the token limit for a request from its messages, or refuse the request.
not_responsible_for:
  - Tokenizing inside the engine. The engine process receives and returns integers only.
  - Deciding how much of the prompt the engine re-reads (resume decision)
runs:
  - startup
  - per_request
state:
  owns:
    - prompt_encode_cache
needs_resources:
  - resource: cpu
    purpose: Template rendering, byte-level BPE encoding and incremental decoding, in the server process
  - resource: slow_memory
    purpose: Vocabulary, merge table and the few most recent rendered prompts with their ids
decisions:
  - id: tokenizer-implementation
    text: Which tokenizer runs. It is the project's own byte-level BPE in Python, built from the pack's tokenizer directory (vocab.json, merges.txt,
      token_type.json, tokenizer.json).
    value: tools/strata_tokenizer.py, pre-tokenizer qwen35
    resolved_at: startup
    source: serve/server.py lines 10041 to 10063
  - id: chat-template
    text: Which chat template renders the messages. The pack's own Jinja template is used if present, else the shipped one. It runs in a sandboxed
      immutable Jinja2 environment.
    value: tokenizer/chat_template.jinja of the pack, else serve/chat_template.jinja
    resolved_at: startup
    source: serve/server.py lines 10184 to 10191; serve/frontend.py line 50
  - id: context-slack
    text: Tokens kept free between prompt plus output and the context length. The engine applies the same margin.
    value:
      value: 8
      unit: tokens
    resolved_at: design
    source: serve/server.py line 293
  - id: fit-max-tokens
    text: When prompt plus requested output exceeds the context, shorten the output limit to the room left instead of refusing.
    value: true
    resolved_at: startup
    source: serve/server.py lines 5939 to 5950 and 10194
  - id: unset-max-tokens
    text: An absent, zero or negative output limit means the rest of the context.
    value: context - 8 - prompt length
    resolved_at: runtime
    source: serve/server.py lines 5930 to 5938
  - id: encode-cache-entries
    text: How many recent prompts are kept so that a new prompt re-encodes only what follows the last special token it shares with one of them.
    value:
      value: 4
      note: The engine's conversation cache slot count when the engine reports one, else 4.
    resolved_at: startup
    source: serve/server.py lines 4832 to 4842; tools/strata_tokenizer.py line 441
  - id: effort-position
    text: Whether a non-default reasoning effort is written in a short system turn before the answer, so the cached prompt start stays the same.
      Off by default.
    value: false
    resolved_at: startup
    source: serve/server.py lines 4745 to 4747 and 5745 to 5761
invariants:
  - id: inv/never-truncate-prompt
    text: A prompt that does not fit the context is refused with 400 and is never shortened.
  - id: inv/incremental-encode-equals-full
    text: Reusing ids up to a shared special-token boundary gives the same ids as encoding the whole prompt.
  - id: inv/message-text-is-not-control
    text: Control-token text written inside a message is encoded as plain text; only the template's own control tokens become control tokens.
calls:
  - name: prepare
    takes: messages, tools, template arguments, requested output limit, forced tool call
    returns: prompt token ids, whether thinking is on, the output limit
    does: Renders, encodes and fits the request to the context; raises a context-overflow error instead of truncating.
  - name: encode_prompt
    takes: messages, tools, template arguments
    returns: token ids
    does: Renders the template and returns its token ids, reusing kept prompts.
  - name: Detokenizer.push
    takes: one token id
    returns: text, possibly empty
    does: Returns the complete characters one more token adds; holds a character split across tokens until it is complete.
verification:
  - method: parity_with_reference
    checks: decode(encode(s)) equals s over a corpus of boundary cases, per the module's header. Named from the file name. The test body was not
      read, so what it asserts is not confirmed.
    against: The round trip, and llama.cpp's qwen35 pre-tokenizer per the header comment
    source: tools/test_strata_tokenizer.py, tools/test_tokenizer_plain_spans.py
  - method: unit_test
    checks: Incremental prompt encoding and context-overflow handling. Named from the file name. The test body was not read, so what it asserts
      is not confirmed.
    invariants:
      - inv/incremental-encode-equals-full
      - inv/never-truncate-prompt
    source: serve/test_prompt_encoder.py, serve/test_context_overflow.py, serve/test_detok.py, serve/test_frontend.py
equivalence:
  level: bit_exact
  relative_to: A full encode of the rendered prompt
  note: The component defines the prompt, so the template, effort placement and the output limit it chooses all decide what the model is asked.
costs:
  - text: Running BPE over a whole 100K-token prompt costs hundreds of milliseconds, which the kept-prompt reuse avoids.
    status: reported
    source: tools/strata_tokenizer.py lines 419 to 421 (comment)
sources:
  - ref: serve/server.py lines 5745 to 5778 (render and encode)
    basis: code
  - ref: 'serve/server.py lines 5833 to 5973 (prepare: context fit)'
    basis: code
  - ref: serve/server.py lines 10041 to 10063 and 10184 to 10191 (tokenizer and template loaded at start)
    basis: code
  - ref: tools/strata_tokenizer.py lines 115 to 380 (Tokenizer; outline) and 416 to 486 (PromptEncoder)
    basis: code
  - ref: serve/frontend.py lines 28 to 66 (ChatTemplate)
    basis: code
  - ref: serve/server.py lines 4548 to 4570 (Detokenizer)
    basis: code
not_read: The BPE merge loop and the pre-tokenizer pattern in detail; message conversion and the output parser in serve/frontend.py; the image
  path of prepare.
