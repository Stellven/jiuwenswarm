kind: component
id: comp/strata/speed-calibration
title: Speed calibration and tuning presets
system: sys/strata
parent: comp/strata/setup
role: configuration
responsibility: Measure on this machine, with the real engine and on demand, which of a bounded set of settings is faster, keep a non-default
  value only when it beats the default by more than measurement noise, and store the result for later starts.
not_responsible_for:
  - Measuring answer quality. It measures speed only.
  - Running during serving. It needs the machine to itself.
  - Changing the run configuration in the preset path; presets are applied over it at start.
runs:
  - offline
state:
  owns:
    - calibration_record
    - tuning_presets
needs_resources:
  - resource: accelerator
    purpose: The whole machine while measuring; the model is loaded and the engine restarted per candidate
  - resource: storage
    purpose: Calibration results per hardware key, preset files, an active index and a history of trials
decisions:
  - id: calibration-metric
    text: 'What the calibration measures: decode tokens per second from the engine''s own decode time, over 3 fixed prompts of 128 new tokens
      at temperature 0. On a layer split it also measures prompt read speed for the chunk-pipelining option.'
    value: generated tokens / decode_ms
    resolved_at: design
    source: tools/calibrate.py lines 49 to 62, 160 to 165 and 210 to 216
  - id: calibration-candidates
    text: 'What the calibration sweeps: the share of routed experts read over the link, the speculation confidence floor (both per request, without
      a restart), then the CPU worker count and adaptive-tier settings (one engine restart each).'
    value: pcie-frac in 0 to 1.0; spec-min-p in 0.3, 0.5, 0.7; worker counts; three adaptive-tier variants
    resolved_at: design
    source: tools/calibrate.py lines 303 to 437
  - id: minimum-gain
    text: A non-default value is kept only if it beats the default by more than this in an interleaved confirmation.
    value:
      value: 0.03
      note: 3% of tokens per second.
    resolved_at: design
    source: tools/calibrate.py lines 49 and 186 to 192
  - id: calibration-trigger
    text: 'When the calibration runs: only on request (setup --calibrate, an offer at the end of a first install on NVIDIA, or the engine calibrate
      command).'
    value: on demand
    resolved_at: design
    source: setup.py lines 10382 to 10396 and 11167 to 11170
  - id: autotune-threshold
    text: The auto-tuner changes one setting at a time and accepts a change when the median per-round ratio exceeds 1 + max(0.03, twice the measured
      noise, twice the drift), every round is faster, and prompt speed loses at most 2%.
    value: 1 + max(0.03, 2 x noise, 2 x drift)
    resolved_at: runtime
    source: strata_control/autotune.py lines 60 and 161 to 176
  - id: autotune-budget
    text: The auto-tuner's time budget.
    value:
      value: 20
      unit: min
      note: Quick mode; 2 hours in thorough mode.
    resolved_at: design
    source: strata_control/autotune.py line 73
  - id: answer-class-gate
    text: Only settings the project labels as leaving answers identical are chosen automatically; settings labelled as changing placement or as
      not repeatable need an explicit opt-in.
    value: exact only, by default
    resolved_at: design
    source: strata_control/autotune.py lines 57 to 58; strata_control/tune_knobs.py lines 344 to 346
  - id: preset-staleness
    text: A preset is not applied when the GPU, CPU, RAM (by more than 10%), link, model digest or backend changed; it is applied with a re-check
      offered when the engine's tuning epoch, the driver or its age changed.
    value: hard and soft identity checks
    resolved_at: startup
    source: strata_control/presets.py lines 158 to 197
invariants:
  - id: inv/unchosen-setting-reset
    text: A setting the calibration did not choose is reset to the product default when a calibration is applied, so an old calibration does not
      linger.
  - id: inv/calibration-exact-hardware
    text: A saved calibration is used only for the exact hardware key it was measured on.
  - id: inv/never-list-not-applied
    text: A preset that contains a setting on the never list is not applied.
  - id: inv/preset-overlay-never-fails-start
    text: An unreadable preset store means no preset; it never stops a start.
calls:
  - name: calibrate.run
    takes: the run configuration, a function that starts the engine
    returns: settings, environment entries and a report
    does: Measures the candidates and returns the settings worth keeping with a report.
  - name: calibrate.apply
    takes: an argument list and settings
    returns: an argument list
    does: Writes the kept settings into an argument list and resets the others to defaults.
  - name: Tuner.run
    takes: a session, base arguments and options
    returns: a tuning result
    does: Runs the auto-tuner over HTTP against the server and returns the accepted changes.
  - name: presets.overlay
    takes: the configuration
    returns: the configuration and what was applied
    does: Returns the configuration with the active preset applied, if it is still valid for this machine.
verification:
  - method: unit_test
    checks: The calibration with a stand-in engine. Named from the file name. The test body was not read, so what it asserts is not confirmed.
    source: tools/test_calibrate.py, tests/terminal/test_calibration.py
  - method: unit_test
    checks: The auto-tuner and preset store with a stub engine and stub session. Named from the file name. The test body was not read, so what
      it asserts is not confirmed.
    source: tests/tuning/test_autotune.py, test_presets.py, test_preset_persistence.py, test_session.py
  - method: measurement
    checks: 'The component is itself a measurement: tokens per second per candidate on the machine at hand.'
    source: tools/calibrate.py lines 303 to 437
equivalence:
  - level: bit_exact
    relative_to: The configuration before tuning
    holds_when: Only settings the project labels exact are chosen (speculation confidence floor, worker count)
    note: The label is the project's; not verified in the engine.
  - level: numeric
    relative_to: The configuration before tuning
    holds_when: A setting the project labels placement is chosen (share read over the link, adaptive-tier settings), which the calibration does
      sweep
    note: By the project's own classification a near-tied token may differ. The calibration checks speed only.
sources:
