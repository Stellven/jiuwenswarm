kind: component
id: comp/strata/server-metrics
title: Request accounting and metric exporters
system: sys/strata
parent: comp/strata/telemetry
role: telemetry
responsibility: In the server process, turn the engine's end-of-request figures and the server's own clocks into per-request records, running
  totals and a live rate, fill the usage and timings of each response, sample the machine once a second, and render all of it for outside monitors.
not_responsible_for:
  - Measuring inside the engine. Both request durations come from the engine's own clock.
  - Per-token timestamps. A token line carries none.
runs:
  - per_request
  - per_window
  - background
  - on_demand
state:
  owns:
    - request_history
needs_resources:
  - resource: cpu
    purpose: One sampler thread; work per scrape and per finished request
  - resource: slow_memory
    purpose: 'Bounded histories: 500 request rows, 128 transition events, 60 samples per hardware series'
decisions:
  - id: decode-rate-definition
    text: Tokens per second of a finished request is the engine's generated count divided by the engine's decode time, which runs from the end
      of the prompt read to the last token and so includes the first window. Not reported for fewer than 2 tokens.
    value: generated / decode_ms, engine steady clock
    resolved_at: design
    source: serve/server.py lines 6751 to 6787; src/program/generate.cpp lines 18202 and 19446
  - id: prompt-rate-definition
    text: Prompt tokens per second is tokens read divided by the engine's prompt time, which starts after the request line is parsed and includes
      restoring stored conversation state.
    value: tokens read / prompt_ms, engine steady clock
    resolved_at: design
    source: src/program/generate.cpp lines 16073 and 18101
  - id: live-rate-window
    text: The live rate is the token count gained over the last 2 s of samples; before 0.25 s of span it is the mean so far.
    value:
      value: 2.0
      unit: s
    resolved_at: design
    source: serve/server.py lines 311 to 312 and 5535 to 5556
  - id: first-token-time
    text: Time to first token is not in any API response. It is a histogram (from passing the queue and loading to the first engine token, server
      wall clock) and a history field (from entering the queue to the first engine token).
    value: histogram and history field only
    resolved_at: design
    source: serve/server.py lines 6241, 6325 to 6326, 6360 to 6361 and 6622 to 6624
  - id: inter-token-histogram
    text: The inter-token latency histogram records each finished request's mean gap, once per gap; it has no spread within a request.
    value: decode seconds / (n - 1), observed n - 1 times
    resolved_at: design
    source: serve/prometheus.py lines 45 to 50
  - id: hardware-sample-period
    text: How often GPU, CPU, RAM and disk readings are taken, and how many are kept per series.
    value:
      value: 1
      unit: s
      note: 60 samples kept.
    resolved_at: design
    source: serve/telemetry.py lines 25 and 672
  - id: history-sizes
    text: How many finished requests and transition events are kept.
    value:
      value: 500
      note: Plus 128 transition events.
    resolved_at: design
    source: serve/server.py lines 4769 and 4785
invariants:
  - id: inv/settle-before-release
    text: A request's history row, totals and latency observations are settled before the engine is released to the next request.
  - id: inv/own-done-only
    text: Only end-of-generation records that belong to this request are counted as its figures.
  - id: inv/refused-admission-not-counted
    text: A request the batch engine refused to admit gets an error row but no part in totals or latency histograms.
  - id: inv/sampler-never-stops-server
    text: A reading that cannot be taken is recorded as absent; a failing sample does not end the sampler or the server.
  - id: inv/events-carry-no-content
    text: Request transition events hold only an id, a time and a state; no prompt or answer text.
calls:
  - name: usage and timings of a response
    returns: usage with cached tokens set to the engine's reused count; a timings object in llama.cpp's field names
    does: Reports prompt, completion and cached token counts, and the engine's prompt and decode durations and rates.
  - name: GET /metrics
    takes: an Accept header or a format query
    returns: JSON or Prometheus text
    does: Returns engine facts, live state, slots, recent requests, totals and hardware readings as JSON, or as Prometheus text in vLLM's metric
      names when asked.
  - name: GET /metrics/prometheus
    returns: Prometheus text
    does: Returns totals and two rates averaged since the previous scrape, in llama.cpp's metric names.
  - name: GET /v1/status, /status, /health, /slots, /v1/telemetry
    returns: JSON
    does: Return a status summary, the live state, a liveness record, per-slot state and a versioned snapshot with the last transition events.
  - name: Telemetry.snapshot
    returns: now, history and static
    does: Returns the latest hardware readings, their short history and static machine facts.
verification:
  - method: unit_test
    checks: The Prometheus rendering and histograms. Named from the file name. The test body was not read, so what it asserts is not confirmed.
    source: serve/test_prometheus.py
  - method: unit_test
    checks: Request accounting, speed figures and the monitor view. Named from the file name. The test body was not read, so what it asserts is
      not confirmed.
    invariants:
      - inv/own-done-only
      - inv/refused-admission-not-counted
    source: serve/test_request_accounting.py, serve/test_answer_speed.py, serve/test_speed_average.py, serve/test_monitor.py
  - method: none_found
    checks: The engine side of the line formats the accounting depends on.
observation_points:
  - usage.prompt_tokens_details.cached_tokens
  - timings.predicted_per_second
  - timings.prompt_per_second
  - vllm:time_to_first_token_seconds
  - vllm:inter_token_latency_seconds
  - vllm:e2e_request_latency_seconds
  - llamacpp:predicted_tokens_seconds
  - first_engine_token_s
  - live.tok_s
  - hit_rate
  - pcie_share
  - drafts_offered
  - drafts_accepted
  - gpu utilisation, memory, temperature and power
equivalence:
  level: bit_exact
  relative_to: The same run without scraping
  note: 'It runs after tokens are produced. One indirect effect: its GPU utilisation reading (10% or more counts as busy) keeps the engine client
    from declaring a quiet engine frozen.'
sources:
