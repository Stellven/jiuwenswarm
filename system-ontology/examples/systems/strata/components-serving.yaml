kind: component
id: comp/strata/slot-scheduler
title: Server-side slot scheduler
system: sys/strata
parent: comp/strata/serving
role: scheduler
responsibility: With batch slots on, decide for each request whether it runs alone or in a slot, which slot, and in what order requests get the
  single prompt-reading channel, and keep the server's record of slots consistent with the engine's.
not_responsible_for:
  - Composing a batch window from the active slots (engine command loop)
  - Copying state into or out of a slot (engine)
  - Deciding reuse. The engine checks the real prefix; the scheduler only steers a conversation back to the slot it believes holds it.
runs:
  - per_request
  - per_window
  - background
state:
  owns:
    - slot_ledger
needs_resources:
  - resource: cpu
    purpose: One thread per running request plus short-lived threads that wait for a slot's end line
  - resource: slow_memory
    purpose: Per slot, the list of token ids the server believes the slot holds, up to the context length
policies:
  - slot-admission
decisions:
  - id: slot-cap
    text: The most slots asked of the engine without a layer split.
    value: 8
    resolved_at: design
    source: serve/server.py line 3861
  - id: yields-max
    text: How often one request's prompt read gives way to a waiting request whose prompt is at most half as long.
    value: 2
    resolved_at: design
    source: serve/server.py lines 2072 and 2224 to 2227
  - id: solo-again
    text: How often a request left alone in a slot returns to the solo path, and the fewest tokens it must still be allowed.
    value:
      value: 2
      note: At least 32 tokens left; needs the engine's slot cache; off with STRATA_PARALLEL_SOLO=0.
    resolved_at: design
    source: serve/server.py lines 2211 to 2222
  - id: short-first
    text: 'Opt-in: new requests with at most N prompt tokens take the prompt-reading channel before longer ones; a longer one that waited 30 s
      counts as short.'
    value:
      value: 0
      unit: tokens
      note: 0 is off.
    resolved_at: startup
    source: serve/server.py lines 351 to 359 and 2199 to 2209
  - id: coalesce-prefill
    text: 'Opt-in: the request holding the channel also sends up to N-1 waiting prompts so the engine reads them in one pass.'
    value:
      value: 0
      note: 0 is off.
    resolved_at: startup
    source: serve/server.py lines 360 to 374 and 2155 to 2197
  - id: refusal-retries
    text: How often a request tries another slot after the engine refused one, and how long a refused slot is kept out of the picks.
    value:
      value: 6
      note: Refused slot parked 2 s; after 6 refusals the request gets 503 with Retry-After 5.
    resolved_at: design
    source: serve/server.py lines 2027 to 2028 and 2466 to 2484
  - id: quarantine
    text: How long the control lines or a slot stay held for an engine that owes an end line and says nothing, before the engine is ended.
    value:
      value: 600
      unit: s
      note: After a 300 s drain timeout.
    resolved_at: design
    source: serve/server.py lines 1120 to 1122
  - id: hand-copied-constants
    text: The turn token id, the 8192-token branch boundary and the 512-token minimum prefix used by the slot choice repeat engine defaults by
      hand; no code links them.
    value: turn token 248045; 8192; 512
    resolved_at: design
    source: serve/server.py lines 2644 to 2646
invariants:
  - id: inv/slot-freed-at-bdone
    text: A slot is given to another request only after the engine's end line for it; if that line does not come within the quarantine the engine
      is ended.
  - id: inv/control-lines-one-exchange
    text: The control lines carry one exchange at a time; a request, a VRAM command or a session-file command takes them before sending or reading.
  - id: inv/no-wait-holding-control
    text: A request waiting for a free slot does not hold the control lines, because a read that gave way needs them to continue.
  - id: inv/stale-frame-dropped
    text: A slot line for a slot no request has claimed is dropped and never read by the next request on that slot.
  - id: inv/orphan-slot-reclaimed
    text: A slot marked busy with no owner for 3 s is freed.
calls:
