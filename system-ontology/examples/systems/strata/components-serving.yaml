kind: component
id: comp/strata/parked-conversations
title: Parked conversation cache
system: sys/strata
parent: comp/strata/conversation-reuse
role: conversation_store
responsibility: Hold whole images of other conversations, including their attention K/V, within a host memory budget, find the one with the longest
  valid prefix for a prompt, and evict.
not_responsible_for:
  - The current conversation's rewind points (checkpoint chain)
  - Persisting anything. The parked cache is never written to disk.
  - Reserving memory. The host memory check is a measurement, not a reservation.
runs:
  - startup
  - per_request
  - on_demand
state:
  owns:
    - parked_conversations
  reads:
    - attention_kv
    - indexer_keys
    - gdn_state
    - ple_history
  writes:
    - attention_kv
    - indexer_keys
    - gdn_state
    - ple_history
needs_resources:
  - resource: slow_memory
    purpose: Host images of parked conversations, in separately allocated 16 MiB segments so eviction returns memory at once
  - resource: accelerator
    purpose: Device-to-host and host-to-device copies at a park and a restore
policies:
  - parked-eviction
decisions:
  - id: budget
    text: 'The host memory the cache may take. Given by flag, else computed once at start: 40% of available memory above the floor, capped at
      8192 MiB, rounded down to 256 MiB, zero below 1024 MiB or when memory cannot be read.'
    value:
      value: UNSET
      note: Computed at start from free memory after the model is loaded.
    resolved_at: startup
    source: include/strata/core/conversation_memory.hpp lines 70 to 78; src/program/generate.cpp lines 12020 to 12047 (--conversation-cache-mib)
  - id: entries
    text: The most conversations parked at once.
    value: 4
    resolved_at: startup
    source: src/program/generate.cpp line 929 (--conversation-cache-slots)
  - id: memory-floor
    text: Host memory that must stay available after a park, a session save or a restore.
    value:
      value: 2560
      unit: MiB
      unit_basis: binary
    resolved_at: startup
    source: src/program/generate.cpp line 930 (--conversation-cache-min-free-mib)
  - id: park-trigger
    text: A conversation is parked only on a switch or a rewind, not on each continuing request, and before a batch slot is overwritten.
    value: switch or rewind
    resolved_at: design
    source: src/program/generate.cpp lines 12139 and 16434
  - id: memory-admit-rule
    text: An allocation is admitted when available memory is at least the floor and the allocation fits above it. Available is the least of the
      system's figure, the room under each control-group limit and an operator cap. An unreadable figure refuses.
    value: available >= floor and allocation <= available - floor
    resolved_at: runtime
    source: include/strata/core/conversation_memory.hpp lines 12 to 29 and 82 to 85
  - id: partial-recopy
    text: When the same conversation is parked again, only K/V pages after the first rewritten token are copied again.
    value: retained K/V up to the earliest rewrite
    resolved_at: runtime
    source: src/core/conversation_snapshot.cpp lines 298 to 320
invariants:
  - id: inv/reuse-needs-tokens-images-steering
    text: A stored prefix is reused only when every token id equals the prompt's, the image keys below it are equal, and the steering flag matches.
  - id: inv/retained-kv-bounded-by-rewrites
    text: Retained K/V is reused only for the prefix shared with the conversation it was captured from and only up to the earliest rewrite since
      it was restored; equal token ids alone are not enough.
  - id: inv/pinned-and-donor-not-evicted
    text: An entry holding a pinned checkpoint, and the entry a borrow is copying from, are never evicted.
  - id: inv/park-never-fatal
    text: A park that does not fit the budget, the host memory floor or an allocation is skipped; it never fails the request.
  - id: inv/image-matches-runtime
    text: An image is accepted only if its geometry key, layer range, checkpoint prefixes and every K/V layer's format and sizes equal the running
      engine's, checked before any device write.
calls:
  - name: best
    takes: prompt token ids, image keys, steering flag
    returns: entry index, matched tokens and whether the match is at the entry's live end
    does: Returns the entry with the longest valid prefix for the prompt; ties go to the most recently parked.
  - name: put / take
    takes: an image; an index
    returns: whether it was stored; the image
    does: Stores an image after dropping entries it supersedes and making room; removes and returns an entry.
  - name: conversation_snapshot_save / restore / restore_prefix
    takes: the session, geometry, draft-layer state and an image
    returns: restored, invalid or transfer_failed
    does: Copies one conversation's complete state between the device and a host image; the prefix form restores only the K/V of the first tokens
      for a borrow.
  - name: conversation_memory_admit
    takes: available bytes, allocation, floor
    returns: true or false
    does: Answers whether an allocation may be made now.
verification:
  - method: unit_test
    checks: Matching, supersede and eviction rules. Named from the file name. The test body was not read, so what it asserts is not confirmed.
    invariants:
      - inv/pinned-and-donor-not-evicted
      - inv/retained-kv-bounded-by-rewrites
    source: src/core/conversation_cache_test.cpp, src/core/conversation_split_failure_test.cpp
  - method: unit_test
    checks: Capture, validation and restore on a device. Named from the file name. The test body was not read, so what it asserts is not confirmed.
    invariants:
      - inv/image-matches-runtime
    source: src/core/conversation_snapshot_test.cpp, src/core/conversation_validation_test.cpp, src/core/conversation_copy_streams_test.cpp
  - method: unit_test
    checks: The host memory reading and admit rule. Named from the file name. The test body was not read, so what it asserts is not confirmed.
    source: src/core/conversation_memory_test.cpp
equivalence:
  level: bit_exact
  relative_to: The state that was parked
  note: It stores and returns byte images. After a prefix restore, cells past the restored point hold the donor's later tokens until the request
    overwrites them, which the code relies on. Its effect on results is the resume decision's.
costs:
  - text: A long conversation's image is about 1 GB; four 100K-token conversations were parked in 8 GiB.
    status: reported
    source: include/strata/core/conversation_buffer.hpp lines 147 to 148 and conversation_memory.hpp lines 68 to 69 (comments)
