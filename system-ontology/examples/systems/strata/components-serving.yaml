kind: component
id: comp/strata/engine-diagnostics
title: Engine diagnostics
system: sys/strata
parent: comp/strata/telemetry
role: telemetry
responsibility: Inside the engine process, count which kernel variants and window graphs were chosen, record what the run selected at start, and
  sample batch windows, writing each only when asked by an environment variable.
not_responsible_for:
  - Anything a client sees by default. All of its outputs are off unless an environment variable is set.
  - Timing requests (server metrics, from the engine's end lines)
runs:
  - startup
  - per_window
  - on_demand
state:
  owns:
    - dispatch_counts
    - run_manifest_record
needs_resources:
  - resource: cpu
    purpose: One hash lookup under a lock per counted choice; one atomic increment per launched window
  - resource: slow_memory
    purpose: One map entry per distinct choice; grows with distinct keys, not with tokens
  - resource: storage
    purpose: A JSON report at exit and a JSON manifest, each only when a path is given
decisions:
  - id: dispatch-counting
    text: Whether choices are counted. On by default.
    value: true
    resolved_at: startup
    source: include/strata/core/dispatch_stats.hpp lines 116 to 117 (STRATA_DISPATCH_STATS=0 turns it off)
  - id: dispatch-report
    text: Whether the counts are written as a file at process exit. Off unless a path is given.
    value: false
    resolved_at: startup
    source: include/strata/core/dispatch_stats.hpp lines 108 to 109 (STRATA_DISPATCH_REPORT)
  - id: run-manifest
    text: Whether a record of the engine choice, budgets, fast paths taken or declined and tensor formats is written. Off unless a file is named.
      Written before READY and again after a request that changed something.
    value: false
    resolved_at: startup
    source: include/strata/core/run_manifest.hpp lines 187 to 193 (STRATA_MANIFEST); src/program/generate.cpp lines 14086 and 15419
  - id: batch-samples
    text: Whether batch windows and per-stage in-flight time are sampled, at most once a second, as BSTAT and PSTAT lines. Off by default.
    value: false
    resolved_at: startup
    source: src/program/generate.cpp lines 14326 to 14328 (STRATA_BATCH_TELEMETRY=1)
  - id: parallelism-counters
    text: Whether research counters of the batch loop are printed to the log when it goes idle. Off by default.
    value: false
    resolved_at: startup
    source: include/strata/program/par_counters.hpp line 29 (STRATA_PAR_COUNTERS=1)
invariants:
  - id: inv/no-device-readback-in-counting
    text: Counting touches host maps only. This holds by construction (the header uses no device types); no check asserts it.
  - id: inv/manifest-deterministic
    text: The manifest has sorted keys and no timestamps, process ids or addresses, and is written by write-then-rename.
  - id: inv/batch-sample-valid
    text: A batch window sample with fewer than one processed row, fewer than one active row, more active than processed rows or a negative span
      is rejected.
calls:
  - name: dispatch::kernel / note / Scope / graph_launch
    takes: category, variant, tensor type and shape, or a note; window width and kind
    does: Counts one choice at the point it is made.
  - name: manifest engine / budget / path / tensors / flush_if_dirty
    takes: a key and a value; a stage name
    does: Records one fact; rewrites the file only if something changed.
  - name: BatchWindowSampler.complete
    takes: processed rows, active rows, idle flag, start time
    returns: a sample or nothing
    does: Adds one finished window and returns a sample at most once a second.
verification:
  - method: unit_test
    checks: The manifest's content and write behaviour. Named from the file name. The test body was not read, so what it asserts is not confirmed.
    invariants:
      - inv/manifest-deterministic
    source: tests/core/run_manifest_test.cpp
  - method: unit_test
    checks: The batch window sampler. Named from the file name. The test body was not read, so what it asserts is not confirmed.
    invariants:
      - inv/batch-sample-valid
    source: src/core/batch_telemetry_test.cpp
  - method: none_found
    checks: 'Dispatch counters and parallelism counters: no test file refers to them.'
observation_points:
  - dispatch counts per kernel variant
  - window graph launches per width and kind
  - run manifest
  - BSTAT
  - PSTAT
equivalence:
  level: bit_exact
  relative_to: The same run with diagnostics off
  note: Write-only; no engine path reads the counters or the manifest back.
sources:
  - ref: include/strata/core/dispatch_stats.hpp lines 1 to 154
    basis: code
  - ref: include/strata/core/run_manifest.hpp lines 1 to 195
    basis: code
  - ref: include/strata/core/batch_telemetry.hpp lines 29 to 107
    basis: code
  - ref: include/strata/program/par_counters.hpp lines 29 to 74
    basis: code
  - ref: src/program/generate.cpp lines 13991 to 14021, 14086, 14326 to 14346, 15373 to 15381 and 15419
    basis: code
  - ref: src/core/verify.cpp lines 1396 to 1399 and 3220 (call sites)
    basis: code
not_read: include/strata/program/pipe_probe.hpp; whether cumulative counters are reset between requests.
