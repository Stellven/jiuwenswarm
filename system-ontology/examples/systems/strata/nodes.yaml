# The node level of Strata under the generic node types. Written by
# `tools/so_nodetypes.py example strata` from validation/ (the parts inventory, the assignment of parts to
# types, and the match of each recorded decision to a choice). Each node names its type and how this engine
# settles the choices that type leaves open, in the words of the engine's inventory. `own_decisions` counts
# the decisions recorded for the part that are not a choice of the type. Call interfaces, source lines and
# the full list of parameters stay in the full description (`described_in`).
engine: strata
node_types: ontology/node-types.draft.yaml, draft 0.9
nodes:
- component: speed-calibration
  title: Speed calibration and tuning presets
  described_in: comp/strata/speed-calibration
  type: calibration
  does: Measure on this machine, with the real engine and on demand, which of a bounded set of settings is faster, keep
    a non-default value only when it beats the default by more than measurement noise, and store the result for later starts.
  settles:
  - choice: what is measured and on which prompts
    how:
    - 'What the calibration measures: decode tokens per second from the engine''s own decode time, over 3 fixed prompts
      of 128 new tokens at temperature 0. On a layer split it also measures prompt read speed for the chunk-pipelining option.'
  - choice: 'the rule that accepts or rejects a measured result: the noise tolerated and the least gain it must predict'
    how:
    - A non-default value is kept only if it beats the default by more than this in an interleaved confirmation.
    - The auto-tuner changes one setting at a time and accepts a change when the median per-round ratio exceeds 1 + max(0.03,
      twice the measured noise, twice the drift), every round is faster, and prompt speed loses at most 2%.
  own_decisions: 5
- component: model-file-reader
  title: Model file reader and architecture guard
  described_in: comp/strata/model-file-reader
  type: model-loading
  does: Map a GGUF v3 shard read-only, expose its metadata, tensor directory and tensor bytes unchanged, and refuse a file
    whose declared shape the compiled kernels cannot run.
  own_decisions: 6
- component: expert-layout
  title: Expert layout table
  described_in: comp/strata/expert-layout
  type: model-loading
  does: Read the pack's native_experts.txt once and answer, for the whole process, how many bytes each layer's expert blob
    has, where it starts, and where each layer's gate, up and down tensors lie in the GGUF shards.
  settles:
  - choice: what is done when a file is the wrong version, incomplete or of an unsupported shape
    how:
    - A native_experts.txt newer than the engine reads is refused.
  own_decisions: 2
- component: weight-loader
  title: Pack weight loader
  described_in: comp/strata/weight-loader
  type: model-loading
  does: Copy every tensor the pack index lists, except those in a skip set, into one device memory range at its recorded
    offset, applying the byte transform the index names for each plane, and return a table from tensor name to location.
  settles:
  - choice: staging buffers and reader threads used while loading
    how:
    - Source bytes read and uploaded per round.
  - choice: whether weights are re-encoded at load and how
    how:
    - 'One of four transforms per plane, named by the index row: copy; keep the high 16 bits of a BF16 value stored as 32
      bits; convert an F16 value stored as 32 bits back to 16; widen an fp16 scale plane to 32 bits.'
    - 'STRATA_HC_REQ8=1 on one GPU: the hyper-connection projections are requantized to int8 with one scale per 32 values
      instead of being loaded as BF16. Off by default.'
  - choice: which stored encoding of a tensor is loaded when the files carry more than one, and which kernels accept it
    how:
    - Tensors another loader serves are not read; their rows keep metadata and no bytes. --keep-canonical loads both forms.
- component: native-weight-loader
  title: Native-form weight loaders
  described_in: comp/strata/native-weight-loader
  type: model-loading
  does: Upload selected tensors in their unchanged GGUF block form (per-layer projections, output head, token embedding)
    and attach them to the matching entries of the weight table, so that the pack copy of each can be skipped.
  settles:
  - choice: which stored encoding of a tensor is loaded when the files carry more than one, and which kernels accept it
    how:
    - 'Which per-layer tensors are served natively: attn_qkv, attn_gate, ssm_out, attn_q, attn_k, attn_v, attn_output, and
      the three shared-expert matrices; plus the PLE key in four types.'
  - choice: which tensors go to which memory or device
    how:
    - The token embedding stays in page-locked host memory by default; STRATA_EMBED_VRAM=1 puts it on the card.
    - The output head is on the card unless the startup sizing moves it to page-locked host memory as its last resort.
  own_decisions: 2
- component: startup-memory-sizing
  title: Startup memory sizing
  described_in: comp/strata/startup-memory-sizing
  type: memory-planning
  does: Give the expert cache the device memory that remains after weights, session, drafter and output head, minus a reserve
    and minus later allocations priced in advance; and when that is too little, step down through fixed last resort before
    ending the start.
  settles:
  - choice: the reserve left free
    how:
    - Device memory left free once everything is loaded.
  - choice: the least a cache may be and still work
    how:
    - 'Least working cache: slots for a 256-token prompt chunk''s buffers plus the slots a loan leaves behind, or 1 without
      a borrowing prompt path.'
  - choice: the order in which things are given up when memory is short, and when starting is refused
    how:
    - 'When the automatic cache is below the minimum on one discrete GPU and the reserve was not given by hand: keep 16
      slots behind a loan; lower the reserve to the floor; give the prompt path its own buffers at 1024, 512 or 256 tokens;
      move the output head to host memory; then report what is short. STRATA_SPILL_OFF=1 and STRATA_HEAD_HOST_OFF=1 disable
      steps.'
  - choice: an operator's explicit size against the computed one
    how:
    - --expert-cache N is kept as asked; 0 and auto both mean the automatic rule.
  own_decisions: 9
- component: host-memory-admission
  title: Host memory admission and page-locked headroom
  described_in: comp/strata/host-memory-admission
  type: memory-planning
  also: [resource-governing]
  does: Decide at startup, from host memory readings taken before the allocations, whether the n-gram table is locked in
    RAM and whether the expert arena is loaded or replaced by the file source, and hold back page-locked memory while the
    arena registers so that later small page-locked buffers succeed.
  settles:
  - type: memory-planning
    choice: the reserve left free
    how:
    - '--ram-keep-gib W (or STRATA_RAM_KEEP_GIB): RAM that must stay available after the arena; added to the arena''s need.'
  own_decisions: 8
- component: window-graphs
  title: Recorded graphs
  described_in: comp/strata/window-graphs
  type: graph-capture
  does: Record the fixed sequence of device work once and keep the recorded graphs available for replay, freeing and re-recording
    them when fast memory for a new one runs out.
  own_decisions: 3
- component: layer-kernels
  title: Layer kernels and their order
  described_in: comp/strata/layer-kernels
  type: layer-compute
  also: [recurrent-state-store, positional-state-store]
  does: Compute the part of each layer every token needs, in a fixed order, and keep the per-sequence state those kernels
    read and write at fixed device addresses.
  settles:
  - type: layer-compute
    choice: which operations are fused
    how:
    - The residual read folds in the previous half's pending write. On only with the native projection contract and no dump
      or stage timing.
  - type: layer-compute
    choice: working space a kernel may hold, allocated ahead or during steps
    how:
    - The session arena is sized once from the context length, the layer range and the key and value storage plan; nothing
      is allocated on the token path.
  own_decisions: 3
- component: expert-router
  title: Expert router
  described_in: comp/strata/expert-router
  type: layer-compute
  does: For each token in each layer, turn the feed-forward input into 512 logits and choose 10 experts with renormalised
    weights, on the device inside the recorded graph.
  own_decisions: 3
- component: output-head
  title: Output head
  described_in: comp/strata/output-head
  type: layer-compute
  does: 'Turn the residual after the last layer into one row of vocabulary logits per position: a final residual read, then
    the vocabulary projection.'
  own_decisions: 2
- component: cpu-expert-pool
  title: CPU expert pool
  described_in: comp/strata/cpu-expert-pool
  type: secondary-compute
  does: Compute a batch of expert evaluations on CPU cores, reading each expert's bytes in place, and return only when every
    job is done and every worker is parked again.
  settles:
  - choice: how work is cut into jobs, and their size
    how:
    - Row ranges a phase is cut into (--pool-tasks, 0 to 4096).
    - 'Single-token path: one job per missed expert, whole or split by rows across threads. Window path: one job per distinct
      missed expert carrying every token routed to it, in two row phases (gate and up rows, then down rows) with a quantisation
      between.'
  - choice: how idle workers wait
    how:
    - A parked worker spins this long, then sleeps on a condition variable (STRATA_POOL_SPIN_US).
  - choice: what is done when it hangs or falls behind
    how:
    - A wait that sees no progress this long stops the process after releasing the GPU's waits.
  own_decisions: 3
- component: window-loop
  title: Window loop
  described_in: comp/strata/window-loop
  type: step-execution
  does: Run one window of 1 to max_t tokens through the layers and the output head as a single replayed graph, and serve
    each layer's host-side expert work when the GPU signals that the layer's routing is known.
  own_decisions: 6
- component: session-loop
  title: Session loop
  described_in: comp/strata/session-loop
  type: step-execution
  does: For one token on a canonical Q2_0 pack, launch the layers in order and place the CPU's expert rows between each
    layer's routing and its combine, so that a layer's experts meet that layer's router weights.
  settles:
  - choice: which kinds of step are replayed from a recorded graph and which are launched directly
    how:
    - 'Three forms: one graph per token with a device-side wait per layer (default when it can be captured); two graphs
      per layer with a host poll per layer (--no-token-graph, dumps, or a hit path the token graph cannot hold); direct
      kernel launches (--no-capture).'
  own_decisions: 2
- component: prompt-path
  title: Prompt path
  described_in: comp/strata/prompt-path
  type: prompt-reading
  does: Read the prompt in large chunks, layer by layer, and leave behind the model state that generation continues from.
  settles:
  - choice: chunk size
    how:
    - Tokens per prompt chunk.
  own_decisions: 3
- component: expert-source
  title: Expert source
  described_in: comp/strata/expert-source
  type: expert-source
  does: Make the bytes of every routed expert of every layer addressable in host memory for the whole run, either as one
    arena filled at startup or as mappings of the files that hold them, and say for each expert whether the GPU can read
    it in place.
  settles:
  - choice: how much of the full set is made directly readable by a device, and which part first
    how:
    - Register the whole arena with the GPU driver; if refused or capped, register layer by layer from the start until refusal
      or cap; keep the unregistered rest resident with an operating-system lock; large pages take no lock. STRATA_ARENA_PIN_GIB
      sets a cap, none, or auto; STRATA_ARENA_LOCK=0 disables the lock.
    - 'STRATA_PIN_BY_NEED=1: register chosen byte ranges (the hottest experts the GPU cache will not hold first) instead
      of a prefix. Off by default.'
  own_decisions: 9
- component: expert-cache
  title: Expert cache
  described_in: comp/strata/expert-cache
  type: expert-cache
  does: Hold a fixed number of experts in fast memory and answer, for any expert, whether it is there and in which slot.
  own_decisions: 1
- component: adaptive-tier
  title: Adaptive tier
  described_in: comp/strata/adaptive-tier
  type: residency-policy
  does: Keep the expert cache filled with the experts the current conversation uses most, by swapping a bounded number of
    them at fixed intervals.
  settles:
  - choice: how use counts age, so that recent use outweighs old use
    how:
    - After each run every usage count is multiplied by this.
  own_decisions: 4
- component: host-to-device-transfer
  title: Host-to-device transfer
  described_in: comp/strata/host-to-device-transfer
  type: expert-fetch
  does: Copy expert bytes from slow memory to fast memory in an order the accelerator work that follows can rely on.
  settles:
  - choice: copies made one by one or batched
    how:
    - Whether the adaptive tier's copies are issued one by one or as one batched copy.
  own_decisions: 1
- component: expert-dispatch
  title: Expert dispatch
  described_in: comp/strata/expert-dispatch
  type: expert-dispatch
  does: For one layer of one window, decide for every routed expert which path computes it, and publish the accelerator's
    share before the CPU's share starts.
  settles:
  - choice: the share of misses fetched now against left to another device
    how:
    - How many of a layer's missed experts are fetched for this window instead of being left to the CPU. A fixed share,
      or a count from measured CPU and accelerator costs when that option is on.
  own_decisions: 2
- component: ngram-reader
  title: N-gram hash and table reader
  described_in: comp/strata/ngram-reader
  type: row-source
  does: For each token, compute its 16 row numbers from the token and its two predecessors and deliver those 16 rows of
    the n-gram table as 2560 floats before layer 1 needs them.
  settles:
  - choice: row cache
    how:
    - Rows kept after being read, 8-way set-associative with round-robin replacement (--ple-row-cache, 0 disables).
  - choice: warming the table in the background and when to stop
    how:
    - 'Direct mode with the worker: after this long without a read, read one random page of the table, until 60 s after
      the last request for rows (STRATA_SSD_KEEPALIVE, 0 off).'
  own_decisions: 4
- component: kv-store
  title: Key and value store
  described_in: comp/strata/kv-store
  type: positional-state-store
  also: [state-tiering]
  does: Hold the attention keys and values of every position of each attention layer in the configured format, reachable
    through a page table, and when streaming is on make every block a selection names resident in fast memory before the
    attention reads it.
  settles:
  - type: positional-state-store
    choice: precision and layout of stored state
    how:
    - 'Storage format, with bytes per position per attention layer: fp16 2048, int8 with one scale per 64 values 1056, rotated
      4-bit 576, 8-bit keys with rotated 4-bit values 816.'
  own_decisions: 5
- component: resume-decision
  title: Resume decision
  described_in: comp/strata/resume-decision
  type: prefix-reuse
  does: For each request, choose the stored state that shares the longest valid prefix with the prompt, make the session
    hold exactly that state, and report the prefix length.
  settles:
  - choice: which store is used when several hold a match
    how:
    - 'Which stored state wins: the live session and its checkpoints, longest first; then an idle batch slot or its checkpoints
      if strictly longer (text-only requests); then the best parked conversation if strictly longer than both.'
  - choice: when restoring is refused in favour of reading again
    how:
    - A card that would have to create its copy stream and has less than this much VRAM free gets no restore; the prompt
      is read again.
  own_decisions: 2
- component: checkpoint-chain
  title: Checkpoint chain
  described_in: comp/strata/checkpoint-chain
  type: prefix-reuse
  does: Keep a bounded set of snapshots of the running state at chosen token positions of the conversation the session currently
    holds, so a later request on the same history can rewind to one.
  settles:
  - choice: how many stored states are kept, and what is evicted first
    how:
    - How many checkpoints the chain keeps.
    - 'Opt-in: drop the checkpoint whose removal leaves the smallest relative gap instead of the least recently used.'
  - choice: when state is stored for later reuse, and where restore points exist when state cannot be truncated
    how:
    - A checkpoint is cut at the last turn token after the resume point, unless the request says ckpt=0.
    - When reading from token 0, a checkpoint is cut at the first turn token if it is at or beyond this position. Taken
      even with ckpt=0.
    - A checkpoint is cut every this many freshly read tokens, at a chunk end.
    - 'Opt-in, one GPU: an extra cut at the previous turn token if it is at or beyond 8192 tokens and within 1024 tokens
      of the turn cut.'
    - 'Opt-in, one GPU: one extra checkpoint at the last chunk boundary before the prompt''s end.'
  own_decisions: 1
- component: parked-conversations
  title: Parked conversation cache
  described_in: comp/strata/parked-conversations
  type: prefix-reuse
  does: Hold whole images of other conversations, including their attention K/V, within a host memory budget, find the one
    with the longest valid prefix for a prompt, and evict.
  settles:
  - choice: how many stored states are kept, and what is evicted first
    how:
    - The most conversations parked at once.
  - choice: when state is stored for later reuse, and where restore points exist when state cannot be truncated
    how:
    - A conversation is parked only on a switch or a rewind, not on each continuing request, and before a batch slot is
      overwritten.
  own_decisions: 4
- component: session-files
  title: Session files
  described_in: comp/strata/session-files
  type: session-persistence
  does: On an explicit command, write the session's current conversation to one file or read one back, refusing any file
    that does not belong to this model, configuration and engine version before any state changes.
  own_decisions: 7
- component: mtp-drafter
  title: MTP drafter
  described_in: comp/strata/mtp-drafter
  type: draft-proposal
  does: From the verify window's final hidden rows and the tokens that followed them, produce draft tokens with a probability
    each, and keep the draft layer's own attention K/V complete for every accepted position.
  settles:
  - choice: how many per round
    how:
    - 'Most drafts in one round: the smallest of rows minus 1, the configured cap, and the cells left in the context.'
    - Configured cap on drafts per round.
  - choice: when a chain of proposals stops
    how:
    - 'When the draft chain stops before the cap: at the first draft whose probability is below --spec-min-p, or when the
      draft policy''s cost rule says so.'
  - choice: the set of tokens proposals are restricted to, and whether a cheaper reduced output head is used
    how:
    - The token subset the draft head covers. Drafts can only be tokens in the subset.
  - choice: greedy or sampled proposals
    how:
    - Whether drafts are sampled with the request's sampler chain instead of taken as the argmax.
  own_decisions: 4
- component: dflash2-drafter
  title: DFlash2 block drafter
  described_in: comp/strata/dflash2-drafter
  type: draft-proposal
  does: Produce 7 draft tokens in one forward pass of a separate 5-layer drafter model that reads the target model's hidden
    states at five layers, and keep its context ring to committed rows only.
  settles:
  - choice: how many per round
    how:
    - 'Widest verify window for this drafter by card class: 8 for unified-memory cards, 8 for compute capability 12.0 with
      at least 48 GB, 6 for other capability 12, no cap otherwise.'
  - choice: when a chain of proposals stops
    how:
    - The window ends where the product of the selector's probabilities falls below --draft-conf.
  own_decisions: 2
- component: lookup-drafter
  title: Lookup (suffix) drafter
  described_in: comp/strata/lookup-drafter
  type: draft-proposal
  does: Propose the tokens that followed the longest earlier occurrence of the text's current ending, with the match length,
    using no model weights.
  settles:
  - choice: 'how a lookup source matches earlier text: how far back it searches, the shortest match it extends on, and how
      many tokens it may append'
    how:
    - Tokens a lookup may append after the neural drafts in the same window, and the shortest match it extends on.
  own_decisions: 4
- component: draft-policy
  title: Draft policy
  described_in: comp/strata/draft-policy
  type: draft-policy
  does: Choose, for each round, where the verify window's drafts come from and how wide the window is, so that committed
    tokens per measured millisecond is highest; and under automatic drafter selection, which neural drafter a request uses.
  own_decisions: 6
- component: draft-verifier
  title: Draft verifier
  described_in: comp/strata/draft-verifier
  type: draft-verification
  does: Given the full model's target token for every row of a window, accept the longest prefix of drafts that agree, and
    make exactly that prefix permanent in indexer keys, recurrent state, convolution history and n-gram history.
  settles:
  - choice: the acceptance rule under sampling
    how:
    - 'How a draft is judged. Greedy: equal to the row''s argmax. Sampled, default: equal to the row''s sample drawn from
      a random stream keyed by seed and position. Sampled with STRATA_SPEC_PROB=1: accepted with probability min(1, p/q),
      else replaced by a sample from the positive part of p minus q.'
  own_decisions: 5
- component: sampler
  title: Sampler
  described_in: comp/strata/sampler
  type: sampling
  does: 'Turn each position''s logits into one token id by a fixed chain: logit bias, penalties, top-k, top-p, min-p, temperature,
    pick.'
  settles:
  - choice: the default values of the settings
    how:
    - A request without settings is greedy in the window loop. The parameter defaults are top-k 20, top-p 0.95, min-p 0,
      temperature 1.0, penalties off.
  - choice: the kernel used for the sampling arithmetic, and how it changes with the number of rows
    how:
    - 'Three implementations of the sampled chain that pick the same token: split top-k (default), one block per row (STRATA_SAMPLER_ONE_BLOCK,
      and where the split cannot run), the older kernel (STRATA_OLD_SAMPLER).'
  own_decisions: 3
- component: request-runner
  title: Request runner
  described_in: comp/strata/request-runner
  type: output-interpretation
  does: Drive one API request through one or more engine generations and turn the token ids into reasoning, content and
    tool-call events with a final finish record.
  settles:
  - choice: a budget on the reasoning part, and what is done when it is reached
    how:
    - With thinking on and no budget given, close the thinking early enough that the answer keeps a share of the output
      limit.
  own_decisions: 6
- component: http-front
  title: HTTP front and admission bound
  described_in: comp/strata/http-front
  type: request-front
  does: Accept OpenAI- and Anthropic-shaped HTTP requests, bound how many inference calls are pending, answer every failure
    class with a defined status code, and cancel a request whose client has hung up.
  settles:
  - choice: limits on connections, body size and queue
    how:
    - How many inference calls may wait beyond those the engine can run at once. Unset means no bound.
    - The number of reserved inference calls above which a new one is refused with 429.
  own_decisions: 3
- component: prompt-builder
  title: Prompt builder
  described_in: comp/strata/prompt-builder
  type: prompt-preparation
  does: Produce the exact prompt token ids and the token limit for a request from its messages, or refuse the request.
  settles:
  - choice: the template used and how it is corrected
    how:
    - Which chat template renders the messages. The pack's own Jinja template is used if present, else the shipped one.
      It runs in a sandboxed immutable Jinja2 environment.
  - choice: whether the prompt is tokenized whole or in pieces joined at a reuse boundary
    how:
    - How many recent prompts are kept so that a new prompt re-encodes only what follows the last special token it shares
      with one of them.
  - choice: keeping the start of the prompt stable so that stored state can be reused
    how:
    - Whether a non-default reasoning effort is written in a short system turn before the answer, so the cached prompt start
      stays the same. Off by default.
  own_decisions: 4
- component: engine-command-loop
  title: Engine command loop and batch slots
  described_in: comp/strata/engine-command-loop
  type: step-scheduler
  also: [sequence-lifecycle, engine-supervision]
  does: Inside the engine process, read one command at a time, run one prompt read at a time, advance every active batch
    slot one window at a time between commands, and report each generation's tokens and end figures as text lines.
  settles:
  - type: step-scheduler
    choice: sequences and rows per step
    how:
    - The most rows one batch window holds.
  - type: step-scheduler
    choice: how a long prompt yields to generation in progress
    how:
    - While a prompt is read beside decoding slots, after each prompt chunk the slots decode for this fraction of the time
      the chunk took.
  own_decisions: 4
- component: slot-scheduler
  title: Server-side slot scheduler
  described_in: comp/strata/slot-scheduler
  type: sequence-lifecycle
  does: With batch slots on, decide for each request whether it runs alone or in a slot, which slot, and in what order requests
    get the single prompt-reading channel, and keep the server's record of slots consistent with the engine's.
  own_decisions: 8
- component: replica-router
  title: Replica router
  described_in: comp/strata/replica-router
  type: replica-routing
  does: Present several independent engine processes, each on its own group of cards, as one engine, and choose a process
    for each generation.
  own_decisions: 5
- component: engine-client
  title: Engine process client and supervisor
  described_in: comp/strata/engine-client
  type: engine-supervision
  does: 'Keep one engine child process resident and in step with the server: send each generation as one text command, deliver
    its token lines to the caller, and end and restart a process that is dead, silent, frozen or fatally broken.'
  settles:
  - choice: the stages of a start and what is retried
    how:
    - How often a start that exits before READY for a transient reason is tried again, after 2, 4 and 8 s.
  - choice: when the engine counts as stalled or failed
    how:
    - How long a running request's engine may print nothing before it is killed. A first prompt chunk adds min(prompt, 32768)/50
      s; after a progress line the allowance is 3 times the last chunk's time.
    - An engine that prints nothing for this long and also used at most 0.5 CPU seconds and 1 MiB of I/O in that time, while
      the GPU is not busy, is killed.
  - choice: after how many failures in what time the engine is not started again, and the wait between restarts
    how:
    - How often a dead engine is started again at the next request, 15 s apart.
    - After this many engine deaths from a fatal GPU error within ten minutes the engine is not started again until the
      window has passed.
  - choice: when an idle engine is unloaded
    how:
    - Unload the engine after this many idle seconds. Off by default.
  own_decisions: 5
- component: run-config-generator
  title: Run configuration generator and store
  described_in: comp/strata/run-config-generator
  type: configuration
  does: Produce a complete run configuration file for one model on this machine from machine facts and the person's answers,
    and rewrite it without losing what the person added by hand.
  settles:
  - choice: operator values, presets, measured values and defaults
    how:
    - Which value wins when the file is written.
  - choice: rules that derive a setting's default from other settings and machine facts
    how:
    - 'The K/V precision: 16-bit float at a context of 8192 or less, else 8-bit integer, or the person''s choice.'
    - Keep only a 32768-token window of K/V in fast memory when the context is 65536 or more and host memory suffices.
    - Hold the n-gram table in host memory when memory covers the model plus the table plus 16 GB (4 GB on a rotational
      disk).
    - On a CPU with more efficiency cores than performance cores, and only without a calibration, the worker count is P
      - 1 + E/2, at most 32.
  own_decisions: 6
- component: launch-argument-resolver
  title: Launch and start-time argument resolver
  described_in: comp/strata/launch-argument-resolver
  type: configuration
  does: Turn the stored run configuration into the argument list and environment the engine process actually receives, at
    every launch and every engine start, so that standing choices kept outside the list cannot be undone by whoever last
    rewrote it.
  settles:
  - choice: operator values, presets, measured values and defaults
    how:
    - Which value an engine option takes at a launch.
    - 'The order of changes at every engine start: the active tuning preset, then the person''s options again, then the
      drafter choice, then the fast-memory fit, then draft-layer, vision, layer-split, elastic and parallel additions.'
  - choice: which of the machine's devices the engine may use, and how they are identified to it
    how:
    - The engine's environment names the cards by bus order and restricts it to the configured cards; library folders come
      first on the search path.
  own_decisions: 3
- component: engine-diagnostics
  title: Engine diagnostics
  described_in: comp/strata/engine-diagnostics
  type: telemetry
  does: Inside the engine process, count which kernel variants and window graphs were chosen, record what the run selected
    at start, and sample batch windows, writing each only when asked by an environment variable.
  settles:
  - choice: what is recorded by default and what on request
    how:
    - Whether choices are counted. On by default.
    - Whether the counts are written as a file at process exit. Off unless a path is given.
    - Whether a record of the engine choice, budgets, fast paths taken or declined and tensor formats is written. Off unless
      a file is named. Written before READY and again after a request that changed something.
    - Whether batch windows and per-stage in-flight time are sampled, at most once a second, as BSTAT and PSTAT lines. Off
      by default.
    - Whether research counters of the batch loop are printed to the log when it goes idle. Off by default.
- component: server-metrics
  title: Request accounting and metric exporters
  described_in: comp/strata/server-metrics
  type: telemetry
  does: In the server process, turn the engine's end-of-request figures and the server's own clocks into per-request records,
    running totals and a live rate, fill the usage and timings of each response, sample the machine once a second, and render
    all of it for outside monitors.
  own_decisions: 7
types_without_a_part:
- type: model-conversion
  needed_when: The engine does not read the published files as they are, or it needs pieces derived from them.
- type: device-backend
- type: model-edit
  needed_when: The engine offers run-time changes to the model's behaviour.
- type: media-preparation
  needed_when: The engine serves input other than text.
- type: modality-encoding
  needed_when: The model accepts input other than text and the engine serves it.
- type: storage-reader
  needed_when: Several kinds of data are read from the same storage while the engine runs.
- type: state-pool
  needed_when: Several sequences are in the engine at once and share one backing memory for state.
- type: output-constraint
  needed_when: The service offers constrained output, or a format that must be enforced.
- type: scoring
  needed_when: The service offers scoring.
- type: model-partitioning
  needed_when: The model is spread over more than one device or machine.
- type: device-communication
  needed_when: The model is spread over more than one device or machine.
