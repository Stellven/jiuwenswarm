kind: component
id: comp/strata/draft-policy
system: sys/strata
parent: comp/strata/speculation
title: "Draft policy"
role: speculation_controller
responsibility: "Choose, for each round, where the verify window's drafts come from and how wide the window is, so that committed tokens per measured millisecond is highest; and under automatic drafter selection, which neural drafter a request uses."
not_responsible_for:
  - "Accepting or rejecting tokens"
  - "Comparing against decoding without drafts: its baseline is the neural drafter's window"
  - "Producing drafts"
runs: [startup, per_request, per_window]
state:
  owns: [draft_estimates, drafter_choice_stats]
needs_resources:
  - {resource: cpu, purpose: "a few arithmetic comparisons per round on the main host thread"}
policies: [draft-window, draft-source, drafter-choice]
decisions:
  - id: margin
    text: "How much better a lookup or chained window must be than the neural drafter's window to be taken. The cost-aware window uses a third of it."
    value: {value: 0.03, status: reported, source: "include/strata/spec/draft_policy.hpp:35; src/spec/draft_policy.cpp:153,263"}
    resolved_at: design
  - id: cost-aware-window
    text: "Whether the MTP window width is chosen step by step from each draft's probability and the measured cost of each width."
    value: {value: false, status: reported, source: "src/program/generate.cpp:14109; src/core/nv_defaults.cpp:77-80", note: "STRATA_SPEC_COST=1. A per-card default table sets it unless the user did; which cards was not read."}
    resolved_at: startup
  - id: allowed-window-sizes
    text: "Which window sizes a lookup or chained window may use. A size whose window graph finds no GPU memory is dropped for the rest of the process."
    value: {value: "all sizes up to the widest window, narrowed by flags", status: reported, source: "src/program/generate.cpp:1315-1335,14119-14139"}
    resolved_at: runtime
  - id: lookup-needs-agreement
    text: "When a neural drafter is loaded, a lookup window is considered only if its first token equals the neural drafter's first draft. Not required in probabilistic mode."
    value: {value: true, status: reported, source: "src/program/generate.cpp:18996"}
    resolved_at: design
  - id: probability-floor
    text: "Without the cost-aware window, the MTP window ends before the first draft whose probability is below --spec-min-p."
    value: {value: 0.0, status: reported, source: "include/strata/spec/window_rule.hpp:61-64; src/program/generate.cpp:904"}
    resolved_at: startup
  - id: drafter-rule
    text: "Under --draft auto, the drafter of a request that names none: df2, mtp or learn."
    value: {value: "df2", status: reported, source: "src/program/generate.cpp:1009,15927-15942"}
    resolved_at: startup
invariants:
  - id: inv/window-size-allowed
    text: "A chosen window size is never outside the allowed set or above the widest window; size 1 is always allowed."
  - id: inv/no-choice-from-own-draws
    text: "In gated probabilistic mode, a request's source choice uses only committed outcomes and round times whose random draws are all committed; it never looks at the current draw or its width."
calls:
  - {name: choose, takes: "the neural window size, the lookup proposal length, its match length", returns: "lookup or not, and the window size", does: "Takes the lookup window only when its expected tokens per millisecond beats the neural window by the margin, or to probe an unmeasured or stale size for a confident match."}
  - {name: chain, takes: "the neural window size, the probability that all its drafts hold, chained tokens available, match length", returns: "how many chained tokens to append", does: "Keeps the chained tokens that pay at the measured window costs."}
  - {name: keep_draft, takes: "chain state, draft index, its probability, the widest window", returns: "whether to compute another draft; the best width so far is left in the chain state", does: "Cost-aware window: tracks the width with the best expected tokens per millisecond."}
  - {name: observe, takes: "source, window size, accepted count, match length, round time", does: "Updates the cost of that size and the acceptance estimates. Variants exist for chained rounds, draft probabilities and gated mode."}
  - {name: set_context, takes: "the position of the next round", does: "Selects the cost table of that context length."}
  - {name: choose_window, takes: "the active source, the cost rule's kept width, the draft probabilities, the caps", returns: "the window size before any lookup choice", does: "Applies the rule of the source that drew this round's candidates."}
verification:
  - {method: unit_test, checks: "Learning from accepted and rejected lookups, probing unmeasured sizes, stale re-probing, chaining, gated copies, size masks.", source: "src/spec/draft_policy_test.cpp (cmake/backends/cpu.cmake:60)", invariants: [inv/window-size-allowed]}
  - {method: unit_test, checks: "Which rule picks the window and whose distributions judge it, by active draft source.", source: "src/spec/window_rule_test.cpp"}
  - {method: unit_test, checks: "DFlash2 window cap by card class; draft vocabulary resolution; loop start position.", source: "src/core/draft_cap_test.cpp; src/spec/draft_vocab_test.cpp; src/spec/spec_start_test.cpp"}
  - {method: none_found, checks: "No test of the cost-aware step rule (keep_draft) was seen in the check list read; not confirmed absent."}
  - {method: none_found, checks: "No test of the per-request drafter choice (the learn rule) was found."}
observation_points: [drafts_offered, drafts_accepted, round_time_ms, cost_table_text]
equivalence:
  - level: bit_exact
    relative_to: "the output with any other choice of source and window width"
    holds_when: "the verifier's result for a token does not depend on which window it was verified in"
    note: "Header claim: the output is unchanged (include/strata/spec/draft_policy.hpp:15,95)."
  - level: numeric
    relative_to: "the output with any other choice of source and window width"
    holds_when: "the verifier's arithmetic depends on window width; the policy's choices use wall-clock times and are not reproducible run to run"
  - level: distribution_exact
    relative_to: "the target model's sampling distribution"
    holds_when: "STRATA_SPEC_PROB=1 with the gated rule usable: timing and current draws are kept out of the request's choices"
    note: "src/program/generate.cpp:3152-3176,18131-18133."
claims:
  - {text: "The cost-aware window gave decode +4.7% on DGX Spark.", status: reported, source: "docs/DGX_SPARK_LINUX.md:125"}
mechanisms: [mech/draft-then-verify]
sources:
  - {ref: "src/spec/draft_policy.cpp:1-332", basis: code}
  - {ref: "include/strata/spec/draft_policy.hpp:1-135", basis: code}
  - {ref: "include/strata/spec/window_rule.hpp:1-75", basis: code}
  - {ref: "include/strata/core/draft_cap.hpp:1-30", basis: code}
  - {ref: "src/program/generate.cpp:14091-14139,15904-15945,18962-19040,19414-19453", basis: code}
not_read: "src/core/nv_defaults.cpp selection logic; the test bodies beyond their check messages; STRATA_SPEC_T_CYCLE."
---
kind: component
id: comp/strata/draft-verifier
system: sys/strata
parent: comp/strata/speculation
title: "Draft verifier"
role: draft_verifier
responsibility: "Given the full model's target token for every row of a window, accept the longest prefix of drafts that agree, and make exactly that prefix permanent in indexer keys, recurrent state, convolution history and n-gram history."
not_responsible_for:
  - "Running the window through the layers and producing logits (token path)"
  - "The attention K/V: the commit does nothing to it"
  - "The MTP drafter's own K/V: the drafter catches itself up"
  - "Choosing the window (draft policy)"
runs: [per_window]
implements_stages: [verify, commit]
state:
  owns: [commit_stores]
  reads: [attention_kv]
  writes: [indexer_keys, gdn_state, ple_history]
needs_resources:
  - {resource: fast_memory, purpose: "per-window stores the commit replays from: the indexer tail snapshot and raw keys, the recurrent layers' stored inputs, the n-gram history snapshot per row; the captured commit graph; a small buffer for draft distributions"}
  - {resource: accelerator, purpose: "the commit graph on the verifier's stream; the acceptance kernels for sampled requests"}
  - {resource: cpu, purpose: "the accept loop and the host-side previous-token update"}
decisions:
  - id: accept-rule
    text: "How a draft is judged. Greedy: equal to the row's argmax. Sampled, default: equal to the row's sample drawn from a random stream keyed by seed and position. Sampled with STRATA_SPEC_PROB=1: accepted with probability min(1, p/q), else replaced by a sample from the positive part of p minus q."
    value: {value: "exact match", status: reported, source: "src/program/generate.cpp:19258-19259; src/core/verify.cpp:3594-3642; include/strata/core/spec_prob.hpp:127-158"}
    resolved_at: runtime
  - id: probabilistic-gate
    text: "Under STRATA_SPEC_PROB=1, which confidence gate: pick (masked, not renormalised draft measure with a no-candidate tail) or top (gate on the largest probability before the draw)."
    value: {value: "pick", status: reported, source: "include/strata/core/spec_prob.hpp:45-51; include/strata/core/gated_proposal.hpp:70-127"}
    resolved_at: startup
  - id: gated-rule-usable
    text: "The pick gate's exact rule is used only with serial decode on one device, no lookup chain, no adaptive swaps, no PCIe share, no cost-aware window, no DFlash2, a window of at most 8 rows. Otherwise the older rule runs and the engine warns that its distribution is off when the gate fails."
    value: {value: "checked per request", status: reported, source: "src/program/generate.cpp:3156-3176,17894-17897"}
    resolved_at: runtime
  - id: one-token-self-commit
    text: "A one-row window advances the state inside the window graph and no commit graph is launched."
    value: {value: true, status: reported, source: "src/core/verify.cpp:495-508,1359,3886-3888", note: "STRATA_ONE_TOKEN_COMMIT; on for CUDA."}
    resolved_at: startup
  - id: async-commit
    text: "The commit graph is launched without waiting; anything that reads the session from elsewhere waits for it first."
    value: {value: true, status: reported, source: "src/core/verify.cpp:3911-3925; src/program/generate.cpp:5682", note: "On for single-GPU sessions; STRATA_COMMIT_SYNC forces the wait."}
    resolved_at: startup
  - id: batched-commit
    text: "All recurrent layers commit in two launches and all attention layers' indexer restore and re-append in one."
    value: {value: true, status: reported, source: "src/core/verify.cpp:2938-2990", note: "STRATA_COMMIT_BATCH."}
    resolved_at: startup
invariants:
  - id: inv/commit-same-prefix
    text: "Every kind of main-session state is committed to the same accepted prefix."
  - id: inv/no-read-rejected
    text: "Attention K/V written for a rejected position is never read as history; it is overwritten when that position is processed again."
  - id: inv/accept-iff-target-agrees
    text: "In exact-match mode a draft is accepted exactly when it equals the target token the full model produced for the row before it, given the accepted tokens before it."
  - id: inv/commit-count-in-range
    text: "The number of rows kept is at least 1 and at most the rows of the last window."
  - id: inv/session-read-after-commit
    text: "No reader on another stream or the host sees the session before the last commit graph has finished."
  - id: inv/gated-errors-never-fall-back
    text: "An invalid gated proposal or an empty residual fails the window; it never falls back to an ordinary sample."
calls:
  - {name: commit, takes: "the number of rows to keep", returns: "success or an error text", does: "Makes the first rows of the last window permanent in every committed state and advances the previous-token pair."}
  - {name: wait_commit, returns: "success or an error text", does: "Waits for the last commit graph when commit did not."}
  - {name: set_spec_q, takes: "the drafter's distribution rows and how many rows have one", does: "For the next window only, judges those drafts by rejection sampling instead of exact match."}
  - {name: set_spec_proposal, takes: "the gated measure rows and their count", does: "For the next window only, judges offers against the gated measure; a count equal to the window size marks a no-candidate tail."}
verification:
  - {method: parity_with_reference, checks: "Window and commit kernels against the single-token kernels, bitwise, on random inputs including special values.", against: "single-token kernels", source: "src/kernels/verify_parity.cpp (cmake/strata_gpu_engine.cmake:1081-1084)"}
  - {method: parity_with_reference, checks: "Batched recurrent-state commit equals the per-layer commit, bitwise.", against: "per-layer commit", source: "src/kernels/gdn_parity.cpp:559-618", invariants: [inv/commit-same-prefix]}
  - {method: parity_with_reference, checks: "Batched indexer key append and the layered tail restore plus append equal the single append.", against: "single-key append", source: "src/kernels/qsa_parity.cpp:1431-1496"}
  - {method: parity_with_reference, checks: "GPU acceptance kernels against the host reference, token for token, for the rejection rule and the gated rule.", against: "include/strata/core/spec_prob.hpp host functions", source: "src/kernels/spec_verify_parity.cpp; src/kernels/spec_proposal_parity.cpp"}
  - {method: unit_test, checks: "Exact enumeration of the acceptance rule over a two-token vocabulary for each gate; the gated packet builder; the host rejection rule.", source: "src/core/spec_admission_test.cpp; src/core/gated_proposal_test.cpp; src/core/spec_prob_test.cpp"}
  - {method: end_to_end_only, checks: "Exactness run with drafts from a token file or with every Nth draft corrupted (--spec-oracle, --spec-corrupt). No registered test uses them.", source: "src/program/generate.cpp:848-849"}
observation_points: [drafts_accepted, commit_time, spec_windows]
equivalence:
  - level: bit_exact
    relative_to: "token-by-token greedy decoding"
    holds_when: "greedy request; all of a row's arithmetic is independent of window width and of where each expert was computed"
    note: "Header claim (include/strata/core/verify.hpp:4-8); the GPU kernels are parity-tested bitwise."
  - level: numeric
    relative_to: "token-by-token greedy decoding"
    holds_when: "default mode with a native IQ pack and experts computed on the CPU (grouped kernels round differently by window width), or adaptive-tier swaps changing where an expert runs"
    note: "docs/DETAILS.md:603-605; src/program/generate.cpp:19054-19056,19230. The CPU pool kernels were not read."
  - level: bit_exact
    relative_to: "token-by-token sampled decoding with the same seed"
    holds_when: "sampled request in the default exact-match mode or with coupled drafting, under the same arithmetic conditions as the greedy case"
    note: "The target sample is keyed by seed and position (src/core/verify.cpp:3594-3605). docs/DETAILS.md:572 says sampled output is not reproducible run to run with the default adaptive tier."
  - level: distribution_exact
    relative_to: "the target model's post-chain sampling distribution"
    holds_when: "STRATA_SPEC_PROB=1, sampled request, and either the gated rule is usable or STRATA_SPEC_PROB_GATE=top"
    note: "Not the same tokens as non-speculative sampling with that seed. No model-level distribution run is published (docs/DETAILS.md:601)."
  - level: approximate
    relative_to: "the target model's post-chain sampling distribution"
    holds_when: "STRATA_SPEC_PROB=1 with the pick gate where the gated rule is not usable"
    note: "The engine prints that the older rule's distribution is off when the gate fails (src/program/generate.cpp:3172-3173)."
costs:
  - {text: "A window of T tokens reads the dense weights once; the experts the CPU must compute are the union over the window, 1.75, 2.4 and 3.05 times one token's for T of 2, 3 and 4.", status: reported, source: "include/strata/core/verify.hpp:10-11"}
mechanisms: [mech/draft-then-verify]
sources:
  - {ref: "src/core/verify.cpp:2918-3054,3876-3948", basis: code}
  - {ref: "src/core/verify.cpp:1540-1590,1660-1790,1869-1898,3594-3650", basis: code}
  - {ref: "src/kernels/cuda/native_qsa_indexer.cu:49-147", basis: code}
  - {ref: "src/kernels/cuda/verify_kernels.cu:81-96,638-644", basis: code}
  - {ref: "include/strata/core/spec_prob.hpp:1-160", basis: code}
  - {ref: "include/strata/core/gated_proposal.hpp:1-128", basis: code}
  - {ref: "src/program/generate.cpp:3152-3233,19225-19335", basis: code}
  - {ref: "include/strata/core/verify.hpp:1-21,147-230", basis: header_comment}
not_read: "Batch, pipelined and deferred commit paths; the window graph beyond the cited lines, including the order of indexer append and block selection; the CPU pool functions; the GPU acceptance kernels beyond their header comments; STRATA_SPEC_GUMBEL."
