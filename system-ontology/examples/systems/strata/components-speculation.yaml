kind: component
id: comp/strata/dflash2-drafter
system: sys/strata
parent: comp/strata/speculation
title: "DFlash2 block drafter"
role: drafter
responsibility: "Produce 7 draft tokens in one forward pass of a separate 5-layer drafter model that reads the target model's hidden states at five layers, and keep its context ring to committed rows only."
not_responsible_for:
  - "Deciding any emitted token"
  - "Choosing whether a request uses it or the MTP drafter (draft policy)"
runs: [startup, per_window]
implements_stages: [draft]
performs: [dflash2_draft]
state:
  owns: [dflash2_context]
needs_resources:
  - {resource: fast_memory, purpose: "drafter pack, context ring of 2064 K/V slots per layer, buffers and graphs", note: "about 0.8 GB (include/strata/core/dflash2.hpp:49)"}
  - {resource: accelerator, purpose: "one block forward pass per round"}
  - {resource: storage, purpose: "the drafter pack read once at startup"}
decisions:
  - id: enabled
    text: "Whether this drafter is loaded."
    value: {value: false, status: reported, source: "src/program/generate.cpp:997-1001,7188-7197", note: "Opt-in: --draft dflash2 --draft-model PACK. Needs a native pack, --spec at least 2 and a draft vocabulary; not with pipelined windows."}
    resolved_at: startup
  - id: window-cap
    text: "Widest verify window for this drafter by card class: 8 for unified-memory cards, 8 for compute capability 12.0 with at least 48 GB, 6 for other capability 12, no cap otherwise."
    value: {value: "8, 8, 6 or none", status: reported, source: "include/strata/core/draft_cap.hpp:8-24"}
    resolved_at: startup
  - id: confidence-cut
    text: "The window ends where the product of the selector's probabilities falls below --draft-conf."
    value: {value: 0.0, status: reported, source: "src/program/generate.cpp:1006; include/strata/spec/window_rule.hpp:65-69", note: "0.0 means off."}
    resolved_at: startup
  - id: skip-draft-for-long-lookup
    text: "Skip the draft round when the lookup match is at least this many tokens."
    value: {value: 0, unit: tokens, status: reported, source: "include/strata/spec/window_rule.hpp:41-55", note: "STRATA_DF2_LOOKUP_SKIP; 0 means off on non-Metal builds."}
    resolved_at: startup
invariants:
  - id: inv/dflash2-ring-committed-only
    text: "The context ring holds only committed rows, so a rejected draft leaves nothing to roll back."
calls:
  - {name: load, takes: "pack path, device", returns: "success or an error text", does: "Reads the pack and allocates the ring and buffers."}
  - {name: draft, takes: "the hidden-state taps of the committed rows, their count and position, the anchor token", returns: "7 draft tokens and their probabilities", does: "Adds the committed rows to the ring and drafts one block."}
  - {name: context, takes: "the taps of committed rows, their count and position", does: "Adds committed rows to the ring without drafting."}
verification:
  - {method: parity_with_reference, checks: "Named dflash2_parity and dflash2_q4_parity; contents not read.", source: "cmake/strata_gpu_engine.cmake:452-455"}
  - {method: unit_test, checks: "The ring log and rebuild against an uninterrupted update sequence.", source: "cmake/strata_gpu_engine.cmake:458 (src/core/dflash2_ring_test.cpp, not read)"}
equivalence:
  - level: bit_exact
    relative_to: "the output without this drafter"
    holds_when: "the verifier's result for a token does not depend on which window it was verified in"
  - level: numeric
    relative_to: "the output without this drafter"
    holds_when: "the verifier's arithmetic depends on window width"
    note: "include/strata/core/draft_cap.hpp:17 records a greedy output that differs by window width on one unified-memory pack (a HIP card)."
mechanisms: [mech/draft-then-verify]
sources:
  - {ref: "include/strata/core/dflash2.hpp:1-80", basis: header_comment}
  - {ref: "src/program/generate.cpp:7188-7197,18945-18960,19316-19330,19357-19364", basis: code}
  - {ref: "cmake/strata_gpu_engine.cmake:12-13", basis: code}
not_read: "src/core/dflash2.cpp, its kernels and its tests. Only the header and the call sites were read."
