kind: component
id: comp/strata/mtp-drafter
system: sys/strata
parent: comp/strata/speculation
title: "MTP drafter"
role: drafter
responsibility: "From the verify window's final hidden rows and the tokens that followed them, produce draft tokens with a probability each, and keep the draft layer's own attention K/V complete for every accepted position."
not_responsible_for:
  - "Deciding any emitted token"
  - "The main session's K/V, indexer keys, recurrent state or n-gram history"
  - "Choosing the verify window width (draft policy)"
runs: [startup, per_request, per_window]
implements_stages: [draft]
performs: [mtp_draft]
state:
  owns: [mtp_kv]
  reads: [ple_history]
needs_resources:
  - {resource: fast_memory, purpose: "draft-layer dense weights, its 512 routed experts, its own K/V, the draft-head subset of the main output head, draft logits, scratch buffers and captured graphs"}
  - {resource: slow_memory, purpose: "pinned host copy of the draft K/V when it is kept as a ring; pinned snapshot of the experts while they are lent to the prompt path"}
  - {resource: accelerator, purpose: "catch-up rows and one draft-layer pass per drafted token, on its own stream"}
  - {resource: cpu, purpose: "one host thread spin-waits on mapped memory for each draft token and prefetches n-gram rows", note: "src/core/mtp.cpp:1788-1800"}
  - {resource: storage, purpose: "draft-layer files read once at startup: dense.txt, dense.bin, experts.bin, draft_vocab.bin"}
decisions:
  - id: max-rows
    text: "Rows the drafter's graphs hold."
    value: {value: "min(--spec, 8)", status: reported, source: "src/program/generate.cpp:7184; src/core/mtp.cpp:285"}
    resolved_at: startup
  - id: drafts-per-round
    text: "Most drafts in one round: the smallest of rows minus 1, the configured cap, and the cells left in the context."
    value: {value: "min(max_t - 1, max_drafts, max_cells - (p + a))", status: reported, source: "src/core/mtp.cpp:1731", note: "Hard ceiling 7. With --spec 4 it is 3."}
    resolved_at: runtime
  - id: max-drafts
    text: "Configured cap on drafts per round."
    value: {value: "S_mtp - 1", status: reported, source: "src/program/generate.cpp:14097-14099", note: "S_mtp is --mtp-max-t or the --spec the user gave. Lowered temporarily near the context end in gated mode (generate.cpp:3181-3198)."}
    resolved_at: startup
  - id: chain-early-stop
    text: "When the draft chain stops before the cap: at the first draft whose probability is below --spec-min-p, or when the draft policy's cost rule says so."
    value: {value: 0.0, status: reported, source: "src/program/generate.cpp:904; src/core/mtp.cpp:1842", note: "0.0 means never stop early."}
    resolved_at: startup
  - id: attention-window
    text: "How many of the latest cells the draft layer attends to."
    value: {value: 32768, unit: cells, status: reported, source: "src/program/generate.cpp:878"}
    resolved_at: startup
  - id: catch-up-scope
    text: "Which rows of the verified window get their draft K/V written: accepted rows only, or all rows (STRATA_MTP_CATCHUP_ALL=1)."
    value: {value: "accepted rows only", status: reported, source: "src/core/mtp.cpp:70-77,1726"}
    resolved_at: startup
  - id: draft-vocabulary
    text: "The token subset the draft head covers. Drafts can only be tokens in the subset."
    value: {value: "<mtp dir>/draft_vocab.bin", status: reported, source: "src/core/mtp.cpp:796-798", note: "--mtp-draft-vocab FILE overrides; STRATA_MTP_FULL_HEAD=1 uses the whole head."}
    resolved_at: startup
  - id: kv-as-ring
    text: "Whether the draft K/V is a ring of window + 4 x rows + 64 cells over a pinned host copy, or fully resident when pinned memory is short."
    value: {value: "ring when the window is smaller than the context", status: reported, source: "src/core/mtp.cpp:384-403"}
    resolved_at: startup
  - id: sampled-drafting
    text: "Whether drafts are sampled with the request's sampler chain instead of taken as the argmax."
    value: {value: false, status: reported, source: "include/strata/core/coupled_draft.hpp:57-79; src/core/mtp.cpp:712-717", note: "STRATA_SPEC_COUPLED or STRATA_SPEC_PROB; per request it also needs temperature above 0 and at least STRATA_SPEC_MIN_TEMP."}
    resolved_at: runtime
invariants:
  - id: inv/draft-kv-accepted-complete
    text: "Before a draft is made at a cell, the draft K/V of every accepted cell before it has been written from real hidden rows and real tokens."
  - id: inv/draft-kv-write-before-read
    text: "A draft K/V cell written by a draft step or for a rejected row is never rolled back; it is rewritten before any later read reaches it."
  - id: inv/no-draft-while-experts-lent
    text: "No draft or catch-up pass runs while the draft layer's experts are lent to the prompt path."
calls:
  - {name: load, takes: "draft-layer directory, model geometry, session, row count, attention window", returns: "success or an error text", does: "Reads the draft-layer weights and allocates its K/V and buffers."}
  - {name: bind, takes: "main weight table, main output head, the verifier's final-row buffer", returns: "success or an error text", does: "Attaches the main embedding and head and gathers the draft-head subset."}
  - {name: prefill, takes: "hidden rows, the tokens after them, count, first cell", returns: "success or an error text", does: "Writes draft K/V for those cells without drafting."}
  - {name: draft, takes: "window size, the verifier's target tokens, window position, last accepted row, probability floor", returns: "draft tokens, their probabilities, how many, and the budget used", does: "Catches the draft K/V up over the accepted rows, then drafts from the last accepted row."}
  - {name: draft_first, takes: "one hidden row, one token, its cell", returns: "draft tokens and probabilities", does: "Drafts the first round from a single cell."}
  - {name: set_chain_rule, takes: "a callback given each draft's index and probability", does: "Lets the caller stop the chain after any step."}
verification:
  - {method: none_found, checks: "No parity or unit test executable for the draft layer was found in the CMake files searched.", source: "cmake/strata_gpu_engine.cmake; cmake/backends/cpu.cmake"}
  - {method: measurement, checks: "Offline probe of greedy draft acceptance at steps 1 to 3.", source: "include/strata/core/mtp.hpp:3-4 (cites tools/mtp_probe.py; the script was not read)"}
  - {method: unit_test, checks: "Counter and history arithmetic of coupled draft sampling.", source: "src/core/coupled_draft_test.cpp (name and CMake entry only)"}
observation_points: [drafts_offered, draft_time_ms, draft_rounds]
equivalence:
  - level: bit_exact
    relative_to: "the output without this drafter"
    holds_when: "the verifier's result for a token does not depend on which window it was verified in, and STRATA_ROUTE_RESIDENT_MTP is off"
    note: "A drafter only proposes (include/strata/core/mtp.hpp:13-14)."
  - level: numeric
    relative_to: "the output without this drafter"
    holds_when: "the verifier's arithmetic depends on window width (see comp/strata/draft-verifier), since the number of drafts sets the width"
  - level: distribution_exact
    relative_to: "the target model's sampling distribution"
    holds_when: "STRATA_SPEC_PROB=1 on a sampled request: the draft is one of the random draws that fix the token"
claims:
  - {text: "Greedy drafts are accepted at rates 0.89, 0.86 and 0.85 at draft steps 1 to 3.", status: reported, source: "include/strata/core/mtp.hpp:3-4"}
costs:
  - {text: "About 0.9 GB of GPU memory in total; the 512 draft-layer experts are 708 MB of it.", status: reported, source: "include/strata/core/mtp.hpp:19,47"}
mechanisms: [mech/draft-then-verify]
sources:
  - {ref: "src/core/mtp.cpp:267-475,629-863,1023-1144,1432-1494,1702-1914", basis: code}
  - {ref: "include/strata/core/mtp.hpp:1-377", basis: header_comment}
  - {ref: "src/program/generate.cpp:7184-7185,14097-14118,19367-19369", basis: code}
not_read: "record_rest (attention, experts, head, top probability), prefill body, chain_launch and chain_poll for pipelined windows, experts_lend and experts_reclaim, the 4-bit copies, tools/mtp_probe.py and tools/mtp_rt.py."
