kind: component
id: comp/strata/lookup-drafter
system: sys/strata
parent: comp/strata/speculation
title: "Lookup (suffix) drafter"
role: drafter
responsibility: "Propose the tokens that followed the longest earlier occurrence of the text's current ending, with the match length, using no model weights."
not_responsible_for:
  - "Judging whether the proposal is worth verifying (draft policy)"
  - "Deciding any emitted token"
runs: [per_request, per_window]
implements_stages: [draft]
state:
  owns: [lookup_history]
needs_resources:
  - {resource: slow_memory, purpose: "token history and a fixed-size hash table of trigram end positions, allocated up front for the whole context"}
  - {resource: cpu, purpose: "index update per emitted token and one proposal per round, on the main host thread"}
decisions:
  - id: min-match
    text: "Shortest match that produces a proposal."
    value: {value: 3, unit: tokens, status: reported, source: "src/spec/suffix_drafter.cpp:19; src/program/generate.cpp:976", note: "max(3, --suffix-draft). --suffix-draft 0 turns the drafter off."}
    resolved_at: startup
  - id: max-match
    text: "Longest match length counted."
    value: {value: 64, unit: tokens, status: reported, source: "src/program/generate.cpp:14100"}
    resolved_at: startup
  - id: candidates-per-trigram
    text: "Most recent end positions kept per trigram."
    value: {value: 4, status: reported, source: "include/strata/spec/suffix_drafter.hpp:21"}
    resolved_at: design
  - id: table-capacity
    text: "History tokens the index is sized for."
    value: {value: "max_context + 4096", unit: tokens, status: reported, source: "src/program/generate.cpp:14100"}
    resolved_at: startup
  - id: lookup-chain
    text: "Tokens a lookup may append after the neural drafts in the same window, and the shortest match it extends on."
    value: {value: 0, status: reported, source: "src/program/generate.cpp:982-983,3650-3651", note: "--lookup-chain 0..7, 0 means off; --lookup-chain-min default 3."}
    resolved_at: startup
invariants:
  - id: inv/lookup-match-verified-by-tokens
    text: "A candidate's match length is computed by comparing actual tokens, so a hash collision cannot produce a false match."
  - id: inv/lookup-history-committed-only
    text: "The indexed history holds only the prompt and emitted tokens; unverified drafts used for a chained proposal are removed after the proposal."
calls:
  - {name: reset, does: "Clears the history and the index for a new request."}
  - {name: append, takes: "tokens", does: "Adds tokens to the history and indexes their trigrams."}
  - {name: propose, takes: "the most tokens wanted", returns: "the proposed tokens, their count and the match length", does: "Returns nothing when no match reaches the minimum length."}
  - {name: propose_after, takes: "unverified draft tokens and the most tokens wanted", returns: "the proposed tokens and their count", does: "Proposes what follows the history extended by the drafts, leaving the history unchanged."}
  - {name: propose_from_sources, takes: "the context tail, how many of its tokens are unverified, the most tokens wanted, the minimum match", returns: "the proposal with the longest match and which source gave it", does: "Asks the request's own text and then every registered extra source; ties keep the earlier source."}
verification:
  - {method: unit_test, checks: "The suffix drafter's calls.", source: "src/spec/suffix_drafter_test.cpp (cmake/backends/cpu.cmake:54)"}
  - {method: none_found, checks: "No dedicated test of the draft-source registry was found."}
equivalence:
  - level: bit_exact
    relative_to: "the output without this drafter"
    holds_when: "the verifier's result for a token does not depend on which window it was verified in"
  - level: numeric
    relative_to: "the output without this drafter"
    holds_when: "the verifier's arithmetic depends on window width; lookup windows are the widest (up to 12 rows)"
costs:
  - {text: "At least 64 bytes of table plus 4 bytes of history per token of capacity, allocated at construction.", status: derived, source: "include/strata/spec/suffix_drafter.hpp:44-48; src/spec/suffix_drafter.cpp:18-25", conditions: {note: "Slot size of 32 bytes inferred from the struct layout. The header comment says about 20 bytes per token."}}
mechanisms: [mech/draft-then-verify]
sources:
  - {ref: "src/spec/suffix_drafter.cpp:1-98", basis: code}
  - {ref: "src/spec/draft_source.cpp:1-36", basis: code}
  - {ref: "include/strata/spec/suffix_drafter.hpp:1-59", basis: code}
  - {ref: "include/strata/spec/draft_source.hpp:1-62", basis: code}
  - {ref: "src/program/generate.cpp:18122-18125,18985-18999,19021-19037,19344", basis: code}
not_read: "Whether suffix_drafter_test.cpp covers propose_after."
