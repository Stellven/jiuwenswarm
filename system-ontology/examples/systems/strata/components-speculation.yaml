# Strata, speculation area. Written from engines/strata-notes/speculation.md (commit 504b143, CUDA path,
# Qwen3.8-Flash-Next). File references are relative to the Strata checkout.
kind: component
id: comp/strata/speculation
system: sys/strata
title: "Speculation"
role: subsystem
parts:
  - comp/strata/mtp-drafter
  - comp/strata/dflash2-drafter
  - comp/strata/lookup-drafter
  - comp/strata/draft-policy
  - comp/strata/draft-verifier
responsibility: "Propose several next tokens cheaply, have the full model check them in one window, and make exactly the accepted prefix permanent."
not_responsible_for:
  - "Running the verify window through the 48 layers (token path)"
  - "Sampling a target token from logits when no draft is judged (sampler)"
runs: [startup, per_request, per_window]
implements_stages: [draft, verify, commit]
decisions:
  - id: speculation-on
    text: "Whether speculative decoding runs at all, and the widest verify window."
    value: {value: 0, status: reported, source: "src/program/generate.cpp:853", note: "--spec N; 0 means plain decode on non-Metal builds. What setup or the launcher passes was not read."}
    resolved_at: startup
  - id: lookup-window-bump
    text: "With the lookup drafter on and --spec at least 2, the neural drafter keeps the given --spec as its widest window and lookup windows may be 2 rows wider, up to 8; in serve on one GPU with the 8-row build and no batch, DFlash2 or lookup chain, lookup windows may reach 12 rows."
    value: {value: 12, status: reported, source: "src/program/generate.cpp:4324-4349; include/strata/core/lookup_default.hpp:23-28"}
    resolved_at: startup
invariants:
  - id: inv/commit-same-prefix
    text: "Every kind of main-session state is committed to the same accepted prefix."
mechanisms: [mech/draft-then-verify]
equivalence:
  - level: bit_exact
    relative_to: "token-by-token greedy decoding"
    holds_when: "greedy request, and every row's logits do not depend on the window width or on where an expert was computed"
    note: "Header claim (include/strata/core/verify.hpp:4-8). See comp/strata/draft-verifier for the documented exceptions."
  - level: numeric
    relative_to: "token-by-token greedy decoding"
    holds_when: "native IQ pack with experts computed on the CPU in the default mode, or adaptive-tier swaps landing during decode"
    note: "docs/DETAILS.md:603-605 and src/program/generate.cpp:19054-19056. The CPU pool kernels were not read."
  - level: distribution_exact
    relative_to: "the target model's post-chain sampling distribution"
    holds_when: "STRATA_SPEC_PROB=1 on a sampled request and the gated rule is usable, or STRATA_SPEC_PROB_GATE=top"
    note: "Claimed by include/strata/core/spec_prob.hpp:8-9. docs/DETAILS.md:601 says no model-level distribution run is published."
sources:
  - {ref: "src/program/generate.cpp:18937-19444", basis: code}
  - {ref: "include/strata/core/verify.hpp:1-21", basis: header_comment}
not_read: "The CLI loop (src/program/generate.cpp:20784-21225) except a few lines; the pipelined and batch serve paths."
