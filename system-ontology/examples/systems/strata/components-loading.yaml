kind: component
id: comp/strata/weight-loader
system: sys/strata
parent: comp/strata/loading
title: "Pack weight loader"
role: weight_loader
responsibility: "Copy every tensor the pack index lists, except those in a skip set, into one device memory range at its recorded offset, applying the byte transform the index names for each plane, and return a table from tensor name to location."
not_responsible_for:
  - "Reading the GGUF shards (native weight loader)"
  - "Allocating the device range (the caller sizes it with pool_bytes and allocates it)"
  - "Knowing what a tensor means, or deciding its transform (decided offline by the tool that writes the index)"
  - "The routed experts held in host memory (expert source)"
runs: [startup]
implements_stages: [load]
needs_resources:
  - {resource: fast_memory, purpose: "one range holding the kept tensors in engine form", note: "Size is the pool number of the index header, or with a skip set the sum of kept destination sizes rounded up to the index alignment (256 B when none is given)."}
  - {resource: slow_memory, purpose: "two page-locked staging buffers of 8 MiB and 16 MiB, freed before the call returns"}
  - {resource: storage, purpose: "index.txt, dense.bin, embd.bin, experts.bin, extra.bin of the pack"}
  - {resource: cpu, purpose: "byte conversion on the calling thread"}
  - {resource: accelerator, purpose: "destination of synchronous host-to-device copies"}
decisions:
  - {id: staging-chunk, text: "Source bytes read and uploaded per round.", value: {value: 8, unit: MiB}, resolved_at: design, source: "src/core/weights.cpp:27"}
  - {id: transform-per-plane, text: "One of four transforms per plane, named by the index row: copy; keep the high 16 bits of a BF16 value stored as 32 bits; convert an F16 value stored as 32 bits back to 16; widen an fp16 scale plane to 32 bits.", resolved_at: design, source: "src/core/weights.cpp:47-52, 410-459"}
  - {id: skip-set, text: "Tensors another loader serves are not read; their rows keep metadata and no bytes. --keep-canonical loads both forms.", resolved_at: startup, source: "src/program/generate.cpp:5013-5033; src/core/weights.cpp:224-236"}
  - {id: hc-requantize, text: "STRATA_HC_REQ8=1 on one GPU: the hyper-connection projections are requantized to int8 with one scale per 32 values instead of being loaded as BF16. Off by default.", value: false, resolved_at: startup, source: "src/program/generate.cpp:5180-5188, 5245-5249; src/core/weights.cpp:525-599"}
invariants:
  - {id: inv/index-row-complete, text: "A row of the index that does not parse to exactly 19 fields refuses the whole load; no partially parsed index is used."}
  - {id: inv/range-holds-pool, text: "Nothing is written unless the supplied device range is at least as large as the index requires."}
  - {id: inv/segments-match-index, text: "The plane layout the loader builds for a tensor must sum to the source and destination byte counts the index records, or the load is refused."}
  - {id: inv/no-split-element, text: "A widened or narrowed plane is never cut inside an element: odd fp16 byte counts are refused and a chunk never ends on half an element."}
  - {id: inv/convert-on-host, text: "Converted bytes are written to a host buffer and cross to the device once; host code never writes through a device address."}
calls:
  - {name: pool_bytes, takes: "pack directory, optional skip set", returns: "bytes of the device range the load needs", does: "Reads the index only; lets the caller size and allocate before committing to a load."}
  - {name: load, takes: "pack directory, device range and its size, optional skip set", returns: "success or an error text", does: "Fills the range and the name table, or refuses on any of the invariants."}
  - {name: find, takes: "a tensor name", returns: "device pointer, bytes, shape, quantization attributes, plane sizes, source location; or nothing", does: "Looks up the table; a skipped tensor has no pointer and is marked not resident."}
  - {name: index_code_bits, takes: "pack directory and tensor name", returns: "the row's code bits, or that there is no such row", does: "Reads the index only."}
  - {name: read_bf16_host, takes: "name of a skipped BF16 tensor", returns: "its 16-bit values", does: "Reads them back from the pack file."}
verification:
  - {method: none_found, checks: "No test exercises the load in isolation; the table records each tensor's source offset and file so that a test could compare the device range with the pack bytes.", source: "include/strata/core/weights.hpp:71-74"}
equivalence:
  - {level: bit_exact, relative_to: "the values stored in the pack", holds_when: "copy, BF16 high half and fp16 widening; and the F16 conversion when the pack's 32-bit word really holds an F16 value (not checked by the code)"}
  - {level: approximate, relative_to: "the pack's BF16 projections", holds_when: "STRATA_HC_REQ8=1", note: "generate.cpp calls this opt-in and says it changes the output."}
costs:
  - {text: "Pack form 5.305 GiB dense plus 0.444 GiB embedding; engine form 4.067 GiB dense plus 0.444 GiB embedding plus 10.88 MiB of widened scales, 4.522 GiB in all.", status: reported, source: "include/strata/core/weights.hpp:17-18 (comment)"}
  - {text: "With --native about 2.7 GB of the canonical tensors are not loaded because they are served in GGUF form.", status: reported, source: "src/program/generate.cpp:5011-5012 (comment)"}
sources:
  - {ref: "include/strata/core/weights.hpp:1-158", basis: code}
  - {ref: "src/core/weights.cpp:1-602", basis: code}
  - {ref: "src/program/generate.cpp:5013-5033, 5180-5254", basis: code}
not_read: "tools/pack_index.py and tools/pack_budget.py; whether a real index lists expert rows."
