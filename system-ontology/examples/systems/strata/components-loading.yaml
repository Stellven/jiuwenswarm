kind: component
id: comp/strata/native-weight-loader
system: sys/strata
parent: comp/strata/loading
title: "Native-form weight loaders"
role: weight_loader
responsibility: "Upload selected tensors in their unchanged GGUF block form (per-layer projections, output head, token embedding) and attach them to the matching entries of the weight table, so that the pack copy of each can be skipped."
not_responsible_for:
  - "Tensors the native kernels have no type for; those keep the pack path"
  - "Computing with the weights (layer kernels, output head)"
runs: [startup, on_demand]
implements_stages: [load]
needs_resources:
  - {resource: fast_memory, purpose: "one allocation per projection matrix and the output head", note: "The driver backs each allocation with 2 MiB granules; the loader accounts for that."}
  - {resource: slow_memory, purpose: "the token embedding in page-locked host memory the GPU reads one row at a time; the output head when it is moved off the card"}
  - {resource: storage, purpose: "the GGUF shards, through the model file reader's mapping"}
  - {resource: accelerator, purpose: "destination of the uploads"}
  - {resource: cpu, purpose: "optional conversion of BF16 projections to Q8_0"}
decisions:
  - {id: native-preset, text: "--native turns on native projections, native head and native embedding together; --native-head-gguf and --native-dense-gguf choose other files.", resolved_at: startup, source: "src/program/generate.cpp:3478-3480, 4411-4430"}
  - {id: eligible-projections, text: "Which per-layer tensors are served natively: attn_qkv, attn_gate, ssm_out, attn_q, attn_k, attn_v, attn_output, and the three shared-expert matrices; plus the PLE key in four types.", resolved_at: design, source: "src/core/native_dense.cpp:160-171"}
  - {id: hc-q8-default, text: "STRATA_HC_Q8 is turned on by default on CUDA when the shards carry the hyper-connection projections as Q8_0; a value the user set is kept.", resolved_at: startup, source: "src/program/generate.cpp:4431-4442"}
  - {id: embedding-placement, text: "The token embedding stays in page-locked host memory by default; STRATA_EMBED_VRAM=1 puts it on the card.", resolved_at: startup, source: "include/strata/core/native_head.hpp:49-53"}
  - {id: head-placement, text: "The output head is on the card unless the startup sizing moves it to page-locked host memory as its last resort.", resolved_at: startup, source: "include/strata/core/native_head.hpp:22-25; src/program/generate.cpp:8128-8152"}
invariants:
  - {id: inv/native-matches-table, text: "A projection is uploaded natively only if the weight table's row for it is quantized and has the same two dimensions; otherwise the load is refused."}
calls:
  - {name: served_names, takes: "shard paths", returns: "the tensor names the native load would serve", does: "Reads GGUF headers only, so the pack loader's skip set can be built before anything is allocated."}
  - {name: load_projections, takes: "shard paths and the weight table", returns: "success or an error text", does: "Uploads each eligible matrix and attaches it to its table entry."}
  - {name: load_head, takes: "shard paths, input width, vocabulary size", returns: "success or an error text", does: "Uploads output.weight in GGUF form."}
  - {name: head_to_host, takes: "nothing", returns: "whether it moved", does: "Moves the head's weights from the card to mapped page-locked host memory."}
  - {name: load_embedding, takes: "shard paths, width, vocabulary size", returns: "success or an error text", does: "Places token_embd.weight where the GPU can read a row per token."}
  - {name: weight_bytes, takes: "nothing", returns: "bytes uploaded and bytes the device lost to them", does: "Reports for the sizing that follows."}
verification:
  - {method: unit_test, checks: "The rule that keeps an unquantized PLE key in the pack path.", source: "tests/core/native_dense_ple_key_test.cpp (header comment only)"}
  - {method: none_found, checks: "No isolated test of the projection, head or embedding upload was identified in the files read."}
equivalence:
  - {level: bit_exact, relative_to: "the GGUF file's bytes", holds_when: "a tensor uploaded unchanged"}
  - {level: numeric, relative_to: "the canonical pack path for the same tensor", holds_when: "native head or native projections in use; the header keeps the canonical head for numerical comparison (inferred that the two are not bit-identical)"}
  - {level: approximate, relative_to: "the BF16 values", holds_when: "a BF16 projection is converted to Q8_0 at load (inferred from the conversion routine)"}
sources:
  - {ref: "include/strata/core/native_dense.hpp:1-70", basis: code}
  - {ref: "src/core/native_dense.cpp:140-171, 296-312, 395-412", basis: code}
  - {ref: "include/strata/core/native_head.hpp:1-80", basis: header_comment}
  - {ref: "src/program/generate.cpp:4411-4442, 4988-5033, 5256-5264, 7313-7321", basis: code}
not_read: "src/core/native_head.cpp entirely; src/core/native_dense.cpp outside the cited lines."
