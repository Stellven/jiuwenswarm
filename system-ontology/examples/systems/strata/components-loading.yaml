kind: component
id: comp/strata/model-file-reader
system: sys/strata
parent: comp/strata/loading
title: "Model file reader and architecture guard"
role: file_reader
responsibility: "Map a GGUF v3 shard read-only, expose its metadata, tensor directory and tensor bytes unchanged, and refuse a file whose declared shape the compiled kernels cannot run."
not_responsible_for:
  - "Reading the pack directory (weight loader, expert layout)"
  - "Converting or copying tensor bytes"
  - "Filling the expert arena (the expert source opens the shards with its own file handles)"
  - "Checksums of tensor contents"
runs: [startup, on_demand]
needs_resources:
  - {resource: storage, purpose: "the GGUF shards"}
  - {resource: slow_memory, purpose: "one whole-file read-only mapping per open, reclaimable", note: "In generate.cpp every instance is a block-scoped local, so no mapping of this component outlives startup (inferred)."}
  - {resource: cpu, purpose: "header parsing"}
decisions:
  - {id: gguf-version, text: "Only GGUF version 3 is read.", value: 3, resolved_at: design, source: "include/strata/artifact/gguf_reader.hpp:481-484"}
  - {id: data-alignment, text: "Tensor data alignment: general.alignment when non-zero, else the default.", value: {value: 32, unit: B}, resolved_at: startup, source: "include/strata/artifact/gguf_reader.hpp:510-514"}
  - {id: array-sample, text: "Only the first items of a metadata array are kept; the count is kept in full.", value: 64, resolved_at: design, source: "include/strata/artifact/gguf_reader.hpp:384-388"}
  - {id: required-keys, text: "Six metadata keys are required (block_count, embedding_length, expert_count, expert_used_count, attention.head_count, attention.head_count_kv); any other key the file lacks keeps the compiled value.", resolved_at: design, source: "include/strata/artifact/gguf_reader.hpp:707-728"}
  - {id: free-dimensions, text: "Only the expert count, the experts per token and the vocabulary size may differ from the compiled geometry; every other shape must match.", resolved_at: design, source: "include/strata/artifact/gguf_reader.hpp:802-835"}
  - {id: experts-per-token-cap, text: "Upper limit on experts used per token.", value: 64, resolved_at: design, source: "include/strata/artifact/gguf_reader.hpp:760-762"}
invariants:
  - {id: inv/header-bounds-checked, text: "Every read of the header is bounds-checked, so a truncated or corrupt file is an error message and never an out-of-range read."}
  - {id: inv/unique-tensor-names, text: "A tensor name resolves to exactly one tensor: a duplicate name in one file, or the same name in two shards, is refused at open."}
  - {id: inv/complete-split, text: "A split model is opened only when every shard is present, declares the same split count and tensor total, and the shards' directories add up to that total."}
  - {id: inv/compiled-shape-match, text: "The engine runs a file only if its architecture is qwen4exp and every pinned shape equals the shape the kernels were compiled for."}
calls:
  - {name: open_file, takes: "a shard path", returns: "a handle with metadata map, tensor directory, data start and file size", does: "Maps the file and parses the whole header; throws with a precise message on bad magic, wrong version, truncation, duplicate names, bad rank or a data section past the end."}
  - {name: open_model, takes: "the path of any shard", returns: "all shards opened together with one name index", does: "Resolves the shard paths from the split suffix, throws when a shard is missing or the split keys disagree."}
  - {name: find, takes: "a tensor name", returns: "name, shape, type, offset and shard, or nothing", does: "Looks the tensor up across all shards."}
  - {name: tensor_data, takes: "a tensor record", returns: "a pointer into the mapping", does: "Returns the file's bytes for that tensor without copying."}
  - {name: check_architecture, takes: "the metadata shard", returns: "empty text, or the first key that does not fit", does: "Reads the geometry from the metadata and compares it with the compiled geometry."}
  - {name: read_geometry, takes: "the metadata shard", returns: "the run-time geometry and the experts per token", does: "Fills layer count, widths, expert count and experts per token from the file; refuses impossible or self-contradicting values."}
verification:
  - {method: unit_test, checks: "Synthetic files: two distinct names open; a duplicate name is refused naming tensor and file; a header-only shard opens with a clamped data start; a truncated file with a tensor is refused.", invariants: [inv/unique-tensor-names, inv/header-bounds-checked], source: "src/artifact/gguf_reader_test.cpp"}
  - {method: unit_test, checks: "Split models on synthetic shards: missing shard, shard of another model, tensor in two shards, directory total mismatch, truncated shard, first shard opened alone.", invariants: [inv/complete-split, inv/unique-tensor-names], source: "tests/core/gguf_split_test.cpp"}
  - {method: unit_test, checks: "Geometry from metadata: the full key set, the six required keys only, a pruned expert count, keys that describe one thing twice and disagree, a shape the kernels are not compiled for.", invariants: [inv/compiled-shape-match], source: "tests/core/gguf_geometry_test.cpp"}
  - {method: parity_with_reference, checks: "The --check mode recomputes each tensor's byte size from its block geometry and requires it to fit the gap to the next tensor's offset.", against: "tools/gguf_reader.py, which the header names as the reference", source: "src/artifact/gguf_reader.cpp:20-58"}
equivalence: {level: bit_exact, relative_to: "the file's bytes", holds_when: "always; the class has no transformation (inferred from the code)", note: "The geometry it reads selects the expert count and experts per token used by the router."}
sources:
  - {ref: "include/strata/artifact/gguf_reader.hpp:279-866", basis: code}
  - {ref: "include/strata/artifact/gguf_split.hpp:18-50", basis: code}
  - {ref: "include/strata/artifact/model_family.hpp:15-63", basis: code}
  - {ref: "src/artifact/gguf_reader.cpp:1-67", basis: code}
  - {ref: "src/program/generate.cpp:4380-4405, 4868-4914", basis: code}
  - {ref: "include/strata/core/family_layout.hpp:1-60", basis: code}
not_read: "family_layout.hpp after line 60 (compiled_geometry_mismatch, the tensor layout tables, check_gguf_layout); geometry.hpp; the test files beyond their header comments."
