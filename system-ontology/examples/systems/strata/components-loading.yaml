kind: component
id: comp/strata/expert-layout
system: sys/strata
parent: comp/strata/loading
title: "Expert layout table"
role: file_reader
responsibility: "Read the pack's native_experts.txt once and answer, for the whole process, how many bytes each layer's expert blob has, where it starts, and where each layer's gate, up and down tensors lie in the GGUF shards."
not_responsible_for:
  - "Holding expert bytes (expert source)"
  - "Checking the recorded GGUF offsets against the shards (done by the expert source before it reads)"
runs: [startup, on_demand]
needs_resources:
  - {resource: storage, purpose: "native_experts.txt in the pack directory"}
  - {resource: cpu, purpose: "parsing"}
decisions:
  - {id: canonical-blob, text: "Bytes of one expert blob in the canonical (non-native) layout.", value: {value: 1382400, unit: B}, resolved_at: design, source: "include/strata/core/expert_source.hpp:18; include/strata/plan/plan.hpp:63"}
  - {id: layout-kind, text: "Native layout (per-layer blob sizes and formats, GGUF spans) when native_experts.txt exists, else the canonical layout with one blob size.", resolved_at: startup, source: "include/strata/kernels/cpu/expert_layout.hpp:102-106"}
  - {id: layout-version, text: "A native_experts.txt newer than the engine reads is refused.", resolved_at: design, source: "include/strata/kernels/cpu/expert_layout.hpp:105-110"}
invariants:
  - {id: inv/one-expert-address-rule, text: "Blob (layer, expert) starts at the layer's offset plus the expert index times that layer's blob size; every consumer derives addresses from this one table."}
calls:
  - {name: load, takes: "pack directory, layer count, expert count", returns: "success or an error text", does: "Fills the process-wide table; the engine exits when it fails."}
  - {name: blob_bytes, takes: "layer", returns: "bytes of one expert of that layer", does: "Answers from the table."}
  - {name: blob_offset, takes: "layer and expert", returns: "offset in the packed expert image", does: "Answers from the table."}
  - {name: gguf_span, takes: "layer and role (gate, up, down)", returns: "file name beside the model shard and absolute offset", does: "Answers from the table; empty file name means the model shard itself."}
verification:
  - {method: parity_with_reference, checks: "Copies of real packs' native_experts.txt parse to the same fields and totals as the earlier reader's rules; the v4 shard column; refusal of malformed columns and of a newer version.", against: "a re-parse with the pre-v4 reader's rules inside the test", source: "tests/core/expert_layout_test.cpp"}
equivalence: {level: bit_exact, relative_to: "the file's bytes", holds_when: "the table matches the shards; the expert source verifies that before reading"}
sources:
  - {ref: "include/strata/kernels/cpu/expert_layout.hpp:1-110", basis: header_comment}
  - {ref: "src/program/generate.cpp:4627-4636", basis: code}
not_read: "src/kernels/cpu/expert_layout.cpp (the parser)."
