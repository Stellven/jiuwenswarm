# Strata, area "loading": component descriptions (System Ontology 0.6.1).
# Written from engines/strata-notes/loading.md (engine commit 504b143, CUDA build, Qwen3.8-Flash-Next).
# Machine-specific amounts are in _parts/loading.yaml.
kind: component
id: comp/strata/loading
system: sys/strata
title: "Loading"
role: subsystem
responsibility: "Turn the pack directory and the GGUF shards into weights in memory, and size every memory consumer before the first token from what the machine reports free at that moment."
not_responsible_for:
  - "Writing the pack directory (offline Python tools, not read)"
  - "Sizing the session's K/V and recurrent state (one allocation of session_bytes from the context length, made by the session code)"
  - "Changing sizes after READY"
parts:
  - comp/strata/model-file-reader
  - comp/strata/expert-layout
  - comp/strata/weight-loader
  - comp/strata/native-weight-loader
  - comp/strata/startup-memory-sizing
  - comp/strata/host-memory-admission
runs: [startup, on_demand]
implements_stages: [load]
needs_resources:
  - {resource: storage, purpose: "the pack directory and the GGUF shards"}
  - {resource: fast_memory, purpose: "dense weights in engine form and in GGUF form"}
  - {resource: slow_memory, purpose: "file mappings, staging buffers, held-back page-locked memory"}
  - {resource: cpu, purpose: "parsing, byte conversion, sizing arithmetic"}
  - {resource: accelerator, purpose: "destination of the weight uploads"}
decisions:
  - id: two-artifacts
    text: "The model reaches the engine through two artifacts: a pack directory written offline (index.txt, dense.bin, embd.bin, optional experts.bin, native_experts.txt) and the published GGUF shards. Which loader reads which is fixed by design."
    resolved_at: design
    source: "src/program/generate.cpp:603, 4380-4442, 5013-5033"
  - id: startup-order
    text: "Allocation order at startup: weight range, pack weights, native projections, n-gram table, session, drafter, output head, host expert source, CPU pool, expert cache. Each size is taken from the free memory left by the ones before it."
    resolved_at: design
    source: "src/program/generate.cpp:5189-5264, 5412-5492, 6764-6771, 7186, 7313-7321, 7496-7831, 7894-8419"
invariants:
  - {id: inv/weights-before-caches, text: "The dense weight range is allocated before the K/V state and the expert cache, and the expert cache is sized only after weights, session, drafter and output head are in place."}
verification:
  - {method: end_to_end_only, checks: "The startup sequence as a whole has no isolated test in the files read; its parts are tested separately."}
equivalence:
  - {level: bit_exact, relative_to: "the bytes of the pack and GGUF files", holds_when: "tensors copied unchanged or through the exact transforms of the pack loader"}
  - {level: numeric, relative_to: "a run that computes the same experts on the CPU", holds_when: "the sizing puts a different set of experts in the GPU cache; the engine's startup message says the GPU rounds differently from the CPU"}
  - {level: approximate, relative_to: "the pack's BF16 projections", holds_when: "STRATA_HC_REQ8=1, or a BF16 projection converted to Q8_0 by the native loader"}
sources:
  - {ref: "src/program/generate.cpp:4380-4442, 4633, 4868-5033, 5189-5264, 5412-5492, 7496-8419, 14085-14087", basis: code}
not_read: "generate.cpp outside the cited ranges; the multi-GPU layer-split sizing; the Python tools that write the pack."
