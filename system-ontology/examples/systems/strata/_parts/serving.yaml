model_additions:
- data:
    id: tokenizer_vocabulary
    kind: weight
    note: The model's byte-level BPE vocabulary (248,320 tokens), merge table, token types and Jinja chat template,
      carried in the model file's metadata and extracted into the pack's tokenizer directory. The prompt builder
      reads it; the model description has no entry for it. It does not change while the model runs, so the nearest
      kind is weight, which is not a good fit (see notes).
  note: 'Needed by comp/strata/prompt-builder. Source: tools/strata_tokenizer.py lines 1 to 16 (header comment).'
- data:
    id: draft_layer_kv
    kind: model_state
    note: The draft layer's own attention K/V. A parked conversation image and a session file both include it, but
      the model description lists no state for the draft operation.
  note: 'Needed by comp/strata/parked-conversations and comp/strata/session-files. Source: include/strata/core/conversation_cache.hpp
    line 181.'
uncatalogued_mechanisms:
- family: prefix-state-checkpoints
  summary: Keep host copies of the small running state at turn boundaries and fixed intervals of the current conversation,
    relying on the positional K/V staying in place, so a later request that shares a prefix rewinds instead of re-reading.
- family: parked-conversation-cache
  summary: When the session switches conversation, copy the outgoing conversation's whole state including K/V to
    host memory within a budget tied to free memory, and restore or borrow from it when a prompt matches by tokens,
    pictures and steering flag.
- family: multi-sequence-batch-windows
  summary: Keep several sequences open in one engine, each with its own session state, and carry one row of each
    through the same window so shared weights are read once per window; a lone request stays on the single-sequence
    path with drafts and is moved into a slot when a second arrives.
- family: cooperative-prompt-read-preemption
  summary: A long prompt read gives way at a chunk boundary to a waiting request with a much shorter prompt; the
    part read waits in a slot and continues afterwards with the same chunks, and decoding slots get a share of time
    between a prompt's chunks.
- family: cache-affinity-request-routing
  summary: Send a request to the slot or engine process that already holds the longest start of its prompt, weighed
    against load, so a conversation's next turn returns to where its state is.
- family: incremental-prompt-tokenization
  summary: Reuse the token ids of an earlier prompt up to the last special-token boundary both texts share and encode
    only the rest, which is exact because encoding never crosses a special-token match.
- family: measured-per-machine-settings
  summary: On demand, time a bounded set of engine settings on the machine at hand with the real engine, keep a
    value only if it beats the default by more than noise, and bind the result to a hardware identity so it is not
    applied elsewhere.
- family: engine-process-supervision
  summary: Run the engine as a child process on a line protocol, detect silence, a frozen process and fatal device
    errors with separate limits, and restart it between requests with a cap on repeated fatal errors.
notes:
- 'Dropped id: comp/strata/engine-supervisor. Supervision (READY timeout, start retries, silence and frozen-engine
  limits, fatal GPU handling, restart) and the pipe protocol are one class with one invariant, keeping server and
  engine in step, so they are written as one component, comp/strata/engine-client, with role supervisor. A flow
  that another area addressed to engine-supervisor should name engine-client.'
- 'Folded: the engine''s batch slots and batch windows (BSlot, batch_step, batch_rows.hpp, batch_groups.hpp) are
  inside comp/strata/engine-command-loop. They could be split out as their own leaf if the token-path area describes
  window execution for several sequences.'
- 'Folded: snapshot capture and restore and the host-memory guard are inside comp/strata/parked-conversations; the
  Python slot chooser is inside comp/strata/slot-scheduler; the save and restore HTTP relay is inside comp/strata/session-files;
  the hardware sampler and all HTTP metric endpoints are inside comp/strata/server-metrics; the launch-time layering
  and the server''s start-time argument building are one component, comp/strata/launch-argument-resolver; the calibration,
  the auto-tuner with its preset store and a third tuning path (strata_control/tuning.py, read by header only) are
  one component, comp/strata/speed-calibration.'
- 'Not made a component: serving profiles and the owner runtime (strata_control/profiles.py, runtime.py). They keep
  operator overrides outside the setup file and run one server per profile under a supervising process. They sit
  above the server and were read only at their start path.'
- 'Not made a component: serve/cache_drop.py. After the engine has exited it asks the operating system to drop the
  model files'' page cache, opt-in by an environment variable. It is not conversation reuse.'
- 'Not made a component: include/strata/program/gpu_report.hpp. It explains a failed GPU allocation at start by
  asking the vendor library which processes hold memory. It belongs with loading, not telemetry.'
- 'Unsupported claim in source: the header of dispatch_stats.hpp says the --stats option prints the dispatch report;
  no call that would do so exists at this revision. The only output is the file named by STRATA_DISPATCH_REPORT.'
- 'Flows whose sender is in another area and which therefore are not declared here, but which this area receives:
  running state into the checkpoint chain at a save (from the session loop: gdn_state, ple_history, indexer_keys);
  K/V and running state into a parked image at a park (from the K/V store and session loop); kernel and window-graph
  choices into the engine diagnostics (from layer kernels, the window graphs and the prompt path); hit, draft and
  reuse counters into the engine''s DONE line (from expert dispatch, the expert source and the draft policy).'
- 'The model states gdn_state, ple_history, indexer_keys and attention_kv are owned by other areas. Their checkpoint
  rules are described here on the engine states conversation_checkpoints and parked_conversations. If the format
  expects the checkpoint field on the model states themselves, the values are: interval and identity as written
  on those two states, stored in host memory.'
- No conversation identity exists. The earlier description had a flow 'conversation identity for reuse' from serving
  to the conversation store; the engine matches token ids, image keys and the steering flag itself, and the server
  sends only ckpt=0, pin=N, img_keys= and cvec= on the request line.
- Bit-exactness is not established for conversation reuse or for batch slots. The equivalence cases say under which
  condition each level is claimed and by whom.
- The default queue is a lock, not an ordered queue; arrival order is not enforced on the default path.
- 'Format: no role fits a component whose job is to carry a request across a process boundary on a private protocol.
  engine-client is written as supervisor (which also fits its restart duty); request-runner is written as api_server
  although it speaks no external protocol itself.'
- 'Format: a policy ''controls'' either binding or execution. Admission and routing policies (slot-admission, replica-routing)
  decide which requests run together and where; they are written as execution/stages with a ''work'' text, which
  is a loose fit. The field reference says request lifecycle, concurrency and scheduling are not defined.'
- 'Format: ''timing'' has no value for ''once per engine restart'' or ''once per launch''; startup is used for both.
  Calibration and setup use offline.'
- 'Format: the commit rules on_accept and on_reject do not apply to server-side bookkeeping states; they are left
  out for those states.'
- 'Format: model data kinds are weight and model_state only. The tokenizer vocabulary and chat template are neither;
  they are proposed as weight in model_additions for want of a better kind.'
- 'Format: a component whose effect on output is ''none by itself, but it selects among values that do'' (the launch
  argument resolver, the resume decision) has no exact equivalence level. The nearest level is given with the condition
  in holds_when or note.'
- 'Format: ''equivalence'' relative_to differs per component (the engine''s token stream, the saved state, a cold
  read). The level alone is not comparable across components without reading relative_to.'
- 'Amounts not established from code: the size of a checkpoint (about 118 MB) and of a parked image (about 1 GB
  for a long conversation) come from comments; the per-slot session size (0.56 GiB at 32K) from a document.'
- 'pc target, policy checkpoint-retention: Checkpoints are ordinary host allocations; at most 6, about 118 MB each
  per code comments.'
- 'pc target, policy parked-eviction: The budget is computed at start from the host memory still available after
  the model is loaded: 40% above a 2560 MiB floor, at most 8192 MiB. No figure for this target was established.'
- 'pc target, policy conversation-resume: No pool. A restore needs 64 MiB free on a card that would have to create
  its copy stream.'
- 'spark target, policy checkpoint-retention: Checkpoints are ordinary host allocations; at most 6, about 118 MB
  each per code comments.'
- 'spark target, policy parked-eviction: The budget is computed at start from the host memory still available after
  the model is loaded: 40% above a 2560 MiB floor, at most 8192 MiB. No figure for this target was established.'
- 'spark target, policy conversation-resume: No pool. A restore needs 64 MiB free on a card that would have to create
  its copy stream.'
