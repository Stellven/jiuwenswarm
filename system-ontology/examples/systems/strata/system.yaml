  carries:
    content: control
  timing: per_request
  description: 'With batch slots on: the generation handed to the scheduler, which decides solo or slot'
- id: engine-commands
  sender: comp/strata/engine-client
  receiver: comp/strata/engine-command-loop
  carries:
    content: control
  timing: per_request
  description: 'Text lines on the engine''s standard input: GEN with keys and prompt ids, STOP, VRAM, SAVE and RESTORE'
- id: slot-commands
  sender: comp/strata/slot-scheduler
  receiver: comp/strata/engine-command-loop
  carries:
    content: control
  timing: per_request
  description: 'Text lines naming a slot: BGEN with the prompt ids, BSTOP, BYIELD and the opt-in BCO'
- id: engine-token-lines
  sender: comp/strata/engine-command-loop
  receiver: comp/strata/engine-client
  carries:
    content: tokens
  timing: per_window
  description: T <id> lines on the solo path, several per verify window when drafts are accepted
- id: slot-token-lines
  sender: comp/strata/engine-command-loop
  receiver: comp/strata/slot-scheduler
  carries:
    content: tokens
  timing: per_window
  description: BT <slot> <id> lines, routed to the slot's own queue, then BDONE; BADM and YIELDED on the control lines
- id: engine-stat-lines
  sender: comp/strata/engine-command-loop
  receiver: comp/strata/server-metrics
  carries:
    content: metrics
  timing: per_request
  description: INFO at start; per request PP progress, RESUME and a DONE line with counts, prompt and decode milliseconds,
    drafts, reused tokens and expert cache hits
- id: tokens-to-runner
  sender: comp/strata/engine-client
  receiver: comp/strata/request-runner
  carries:
    content: tokens
  timing: per_window
  description: Token ids as they arrive, with a heartbeat every 10 s of quiet
- id: response-events
  sender: comp/strata/request-runner
  receiver: comp/strata/http-front
  carries:
    content: response
  timing: per_window
  description: Reasoning, content and tool-call events, pings and one finish record
- id: prompt-to-read
  sender: comp/strata/engine-command-loop
  receiver: comp/strata/prompt-path
  carries:
    content: tokens
  timing: per_request
  description: The prompt token ids of one GEN or BGEN, to be read from the resume point
- id: resume-point
  sender: comp/strata/resume-decision
  receiver: comp/strata/prompt-path
  carries:
    content: plan
  timing: per_request
  description: How many prompt tokens the session already holds, so reading starts there
- id: rewind-to-checkpoint
  sender: comp/strata/resume-decision
  receiver: comp/strata/checkpoint-chain
  carries:
    content: control
  timing: per_request
  description: Restore the chosen checkpoint and drop the ones past it
- id: take-or-park
  sender: comp/strata/resume-decision
  receiver: comp/strata/parked-conversations
  carries:
    content: control
  timing: per_request
  description: Park the outgoing conversation; take or borrow from the chosen parked entry
- id: checkpoint-restore
  sender: comp/strata/checkpoint-chain
  receiver: comp/strata/session-loop
  carries:
    content: model_state
    refs:
    - gdn_state
    - ple_history
    - indexer_keys
  timing: on_demand
  description: Running state copied back to the device at a rewind
- id: parked-restore
  sender: comp/strata/parked-conversations
  receiver: comp/strata/kv-store
  carries:
    content: model_state
    refs:
    - attention_kv
    - indexer_keys
    - gdn_state
    - ple_history
  timing: on_demand
  description: A parked conversation's K/V, indexer rows and running state copied back to the device
- id: session-file-out
  sender: comp/strata/session-files
  receiver: external
  carries:
    content: model_state
    refs:
    - attention_kv
    - indexer_keys
    - gdn_state
    - ple_history
  timing: on_demand
  description: 'One session file on storage: live running state, one checkpoint, every attention layer''s K/V and the draft
    layer''s K/V'
- id: session-file-in
  sender: external
  receiver: comp/strata/session-files
  carries:
    content: model_state
    refs:
    - attention_kv
    - indexer_keys
    - gdn_state
    - ple_history
  timing: on_demand
  description: A session file read back and validated before any device write
- id: operator-choices
  sender: external
  receiver: comp/strata/run-config-generator
  carries:
    content: control
  timing: offline
  description: 'The person''s setup answers and options: model, context length, KV format, cards, reserve'
- id: run-config
  sender: comp/strata/run-config-generator
  receiver: comp/strata/launch-argument-resolver
  carries:
    content: plan
  timing: startup
  description: 'The run configuration file: engine path, argument list, environment, the person''s own options and server
    keys'
- id: measured-settings
  sender: comp/strata/speed-calibration
  receiver: comp/strata/run-config-generator
  carries:
    content: plan
  timing: offline
  description: Settings a calibration kept for this hardware key, written into the argument list
- id: preset-overlay
  sender: comp/strata/speed-calibration
  receiver: comp/strata/launch-argument-resolver
  carries:
    content: plan
  timing: startup
  description: The active tuning preset's arguments, environment and per-request values, applied over the configuration
    if still valid
- id: calibration-generations
  sender: comp/strata/speed-calibration
  receiver: comp/strata/engine-client
  carries:
    content: control
  timing: offline
  description: Engine starts and generations made by the calibration to time candidates
- id: engine-argv
  sender: comp/strata/launch-argument-resolver
  receiver: comp/strata/engine-client
  carries:
    content: plan
  timing: startup
  description: The engine process's argument list and environment
- id: memory-options
  sender: comp/strata/launch-argument-resolver
  receiver: comp/strata/startup-memory-sizing
  carries:
    content: plan
  timing: startup
  description: Context length, KV format and resident window, VRAM reserve, resident budget, expert cache request and batch
    slot count, as engine arguments
- id: drafter-options
  sender: comp/strata/launch-argument-resolver
  receiver: comp/strata/draft-policy
  carries:
    content: plan
  timing: startup
  description: The drafter chosen for the run, the speculative window and the confidence floor, as engine arguments
- id: request-figures
  sender: comp/strata/server-metrics
  receiver: comp/strata/http-front
  carries:
    content: metrics
  timing: per_request
  description: Usage with cached tokens and the timings object placed in the response
- id: metrics-out
  sender: comp/strata/server-metrics
  receiver: external
  carries:
    content: metrics
  timing: on_demand
  description: JSON and Prometheus text on the metrics and status endpoints
- id: hardware-readings
  sender: external
  receiver: comp/strata/server-metrics
  carries:
    content: signal
  timing: background
  description: GPU utilisation, memory, temperature and power from the vendor library, and CPU, RAM and disk readings from
    the operating system, once a second
- id: gpu-busy
  sender: comp/strata/server-metrics
  receiver: comp/strata/engine-client
  carries:
    content: signal
  timing: background
  description: Whether the GPU is working (utilisation of 10% or more), read by the frozen-engine check
- id: diagnostic-files
  sender: comp/strata/engine-diagnostics
  receiver: external
  carries:
    content: metrics
  timing: on_demand
  description: The dispatch count report at exit and the run manifest, each only when an environment variable names a file
- id: batch-samples
  sender: comp/strata/engine-diagnostics
  receiver: comp/strata/server-metrics
  carries:
    content: metrics
  timing: background
  description: BSTAT and PSTAT lines, at most one a second, when batch telemetry is on
uncatalogued_mechanisms:
- family: degrade-before-refuse-startup-sizing
  summary: Each memory consumer is sized in a fixed order from the free memory actually left, and a shortage walks a fixed
    ladder (smaller loan, lower reserve, own smaller prompt buffers, output head moved to host memory, cache reopened smaller)
    before the start is ended.
- family: touch-then-recheck-reserve
  summary: After a large device allocation its memory is written, free memory is read again, and the allocation is shrunk
    until the intended reserve is really left, because the free figure read before the allocation can be too high.
- family: gpu-readable-host-weights
  summary: Weights kept in host memory are registered with the GPU driver before they are written, so the GPU can read a
    selected piece in place over the bus without a staging copy; what cannot be registered is kept resident by an operating-system
    lock.
- family: page-locked-headroom
  summary: A small amount of page-locked memory is held back while a large region registers and released afterwards, so
    later small page-locked buffers do not fail on a platform with a ceiling on such memory.
- family: serve-weights-in-file-encoding
  summary: Tensors are uploaded in the block encoding the model file already uses and computed on by kernels for that encoding,
    and the engine-form copy of the same tensor is not loaded.
- family: lossless-load-time-reencoding
  summary: A tensor stored in a wider container than its values need is narrowed at load by an exact transform, and a plane
    the kernels want wider is widened exactly, so the on-disk form and the in-memory form can differ without changing any
    value.
- family: fall-back-to-file-source-when-ram-short
  summary: When host memory cannot hold all expert weights after a bounded wait, the engine reads them from their files
    through the page cache, with a copy of the hottest ones in the RAM that is available, instead of refusing or loading
    into a shortage.
- family: recorded-graph-replay
  summary: Record the fixed device work of a layer, a token or a whole window once and replay it with one driver call, passing
    everything that changes per token through fixed-address buffers; the stated gain is removed launch overhead.
- family: in-graph-host-handoff
  summary: A kernel inside the recorded graph publishes a layer's activations and routed ids to mapped host memory and a
    later kernel waits on a flag the host writes, so the CPU computes its experts while the GPU continues and the host makes
    no driver call per layer.
- family: kv-streaming
  summary: Keep the authoritative attention keys and values in page-locked host memory and only a window of pages in fast
    memory; before each attention step a device kernel makes the selected blocks resident with a clock sweep. Frees fast
    memory for more experts.
- family: table-residency-by-startup-rule
  summary: Hold a large lookup table locked in host memory only when it fits beside everything still to be allocated plus
    a headroom; otherwise read a few rows per token directly from storage, hidden behind other work.
- family: residency-biased-routing
  summary: 'Opt-in: bias the expert selection towards experts already resident in fast memory. Changes the output.'
- family: lookup-drafting
  summary: Draft the tokens that followed the longest earlier occurrence of the current ending of prompt plus output, found
    through a trigram index, optionally chained after the neural drafts in the same window.
- family: cost-aware-draft-window
  summary: Choose the verify window width step by step from each draft's calibrated chance of holding and the measured wall
    time of each window width, maximising expected committed tokens per millisecond.
- family: speculative-rejection-sampling
  summary: For sampled requests, sample the draft from the drafter's distribution q and accept it with probability min(1,
    p/q), else resample from the positive part of p minus q, so each output token keeps the target distribution p; with
    a confidence gate handled as a masked proposal measure.
- family: coupled-draft-sampling
  summary: Sample the draft with the target's own sampler chain and the same position-keyed uniform, so an exact-match check
    accepts it more often without changing the text.
- family: block-drafter-from-hidden-taps
  summary: A small separate model reads the target's hidden states at a few layers for committed rows and drafts a block
    of tokens in one pass.
- family: prefix-state-checkpoints
  summary: Keep host copies of the small running state at turn boundaries and fixed intervals of the current conversation,
    relying on the positional K/V staying in place, so a later request that shares a prefix rewinds instead of re-reading.
- family: parked-conversation-cache
  summary: When the session switches conversation, copy the outgoing conversation's whole state including K/V to host memory
    within a budget tied to free memory, and restore or borrow from it when a prompt matches by tokens, pictures and steering
    flag.
- family: multi-sequence-batch-windows
  summary: Keep several sequences open in one engine, each with its own session state, and carry one row of each through
    the same window so shared weights are read once per window; a lone request stays on the single-sequence path with drafts
    and is moved into a slot when a second arrives.
- family: cooperative-prompt-read-preemption
  summary: A long prompt read gives way at a chunk boundary to a waiting request with a much shorter prompt; the part read
    waits in a slot and continues afterwards with the same chunks, and decoding slots get a share of time between a prompt's
    chunks.
- family: cache-affinity-request-routing
  summary: Send a request to the slot or engine process that already holds the longest start of its prompt, weighed against
    load, so a conversation's next turn returns to where its state is.
- family: incremental-prompt-tokenization
  summary: Reuse the token ids of an earlier prompt up to the last special-token boundary both texts share and encode only
    the rest, which is exact because encoding never crosses a special-token match.
- family: measured-per-machine-settings
  summary: On demand, time a bounded set of engine settings on the machine at hand with the real engine, keep a value only
    if it beats the default by more than noise, and bind the result to a hardware identity so it is not applied elsewhere.
- family: engine-process-supervision
  summary: Run the engine as a child process on a line protocol, detect silence, a frozen process and fatal device errors
    with separate limits, and restart it between requests with a cap on repeated fatal errors.
coverage: 'Written from the source at the revision above and from the project''s own documents; nothing was built or run.
  Each component states what was read in code, what only in a header comment or a document, and what was not read. Covered:
  the CUDA path for Qwen3.8-Flash-Next and the Python serving layer. Not covered: the HIP, SYCL and Metal backends, the
  other model engines in the same repository, kernel numerics, and vision input. Facts with file and line are in engines/strata-notes/.'
