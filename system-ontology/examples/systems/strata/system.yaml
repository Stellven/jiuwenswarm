kind: system
id: sys/strata
title: Strata
summary: Strata is an engine written for one mixture-of-experts model whose expert weights do not fit the fast memory of
  a consumer machine. Each token uses 10 of 512 experts in each of 48 layers. The engine keeps the weights every token needs
  and the most used experts in fast memory, keeps every expert in slow memory where the CPU computes the ones that are not
  in fast memory, moves experts between the two as usage changes, reads a lookup table from storage a few rows per token,
  and has the full model check several drafted tokens in one pass. A serving layer in front of the engine process holds
  conversations so that a continued conversation is not read again.
