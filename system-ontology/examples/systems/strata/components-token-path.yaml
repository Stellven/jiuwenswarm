kind: component
id: comp/strata/expert-router
system: sys/strata
parent: comp/strata/token-path
title: "Expert router"
role: kernel_set
responsibility: "For each token in each layer, turn the feed-forward input into 512 logits and choose 10 experts with renormalised weights, on the device inside the recorded graph."
not_responsible_for:
  - "Deciding which device computes a chosen expert (expert dispatch)"
  - "Publishing the choice to the host (the loops' doorbell)"
runs: [per_layer]
performs: [expert_router]
state:
  reads: [residency_table]
needs_resources:
  - {resource: accelerator, purpose: "one projection with the router weight and one top-10 per token per layer"}
  - {resource: fast_memory, purpose: "logits, ids and weights per window row"}
decisions:
  - id: router-kernel
    text: "Which top-10 kernel runs. Without the --native preset: the generic kernel (router_top10.cu). With it, for 512 experts and 10 picks: the fused native kernel (native_router.cu), in its multi-row form for a window of more than one row. The window loop requires the preset, so native packs use the native kernel."
    resolved_at: startup
    source: "src/core/layer.cpp:420-423; src/core/verify.cpp:2202-2227; src/program/generate.cpp:4414, 5316"
  - id: residency-biased-pick
    text: "STRATA_ROUTE_PRIOR=lambda: pick the 10 again with a logit bonus for experts resident in fast memory; the weights stay the router's own."
    value: {value: 0, status: reported, source: "src/core/verify.cpp:281-291, 2233-2235", note: "off unless the variable is set"}
    resolved_at: startup
  - id: resident-tail-swap
    text: "STRATA_ROUTE_RESIDENT: swap a non-resident expert at a tail rank for a resident one within a logit margin."
    value: {value: "off", status: reported, source: "src/core/verify.cpp:2236-2243"}
    resolved_at: startup
invariants:
  - {id: inv/deterministic-ties, text: "Equal probabilities select the lower expert index."}
  - {id: inv/route-independent-of-window, text: "A token's routing does not depend on how many tokens share its window."}
calls:
  - {name: moe_route, takes: "layer index, the feed-forward input of one token", returns: "10 ids and 10 weights in device memory", does: "Projects, selects, and when a doorbell is given publishes the input, ids and weights and raises the layer signal last."}
  - {name: moe_route_window, takes: "layer index, the inputs of n tokens", returns: "n x 10 ids and weights", does: "Routes the rows in two launches; each row equals the single-token call bit for bit."}
verification:
  - {method: parity_with_reference, checks: "Ids exactly and weights to a tolerance on several logit distributions, ties and near-ties included.", against: "a host re-implementation of ref/moe.py router; not llama.cpp itself", invariants: [inv/deterministic-ties], source: "src/kernels/router_top10_parity.cpp"}
  - {method: parity_with_reference, checks: "The batched window routing equals the per-token calls bit for bit.", against: "the per-token kernels", invariants: [inv/route-independent-of-window], source: "src/kernels/route_window_parity.cpp"}
  - {method: unit_test, checks: "The resident tail swap.", source: "src/kernels/route_resident_parity.cu"}
equivalence:
  - {level: bit_exact, relative_to: "the reference router contract", holds_when: "default; intended by the contract comments and covered only by the parity tests named above"}
  - {level: approximate, relative_to: "the reference router contract", holds_when: "STRATA_ROUTE_PRIOR or STRATA_ROUTE_RESIDENT is set"}
sources:
