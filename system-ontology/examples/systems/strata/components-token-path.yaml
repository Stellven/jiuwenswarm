kind: component
id: comp/strata/session-loop
system: sys/strata
parent: comp/strata/token-path
title: "Session loop"
role: host_loop
responsibility: "For one token on a canonical Q2_0 pack, launch the layers in order and place the CPU's expert rows between each layer's routing and its combine, so that a layer's experts meet that layer's router weights."
not_responsible_for:
  - "Any token of a native pack (window loop)"
  - "The n-gram read, the embedding, the output head and the sampler, which the generate driver calls around it"
  - "Deciding which device computes an expert (inside the pool and hit callbacks)"
runs: [per_step, per_layer]
implements_stages: [decode]
state:
  writes: [attention_kv, indexer_keys, gdn_state, ple_history]
needs_resources:
  - {resource: cpu, purpose: "one host thread pinned to the core the CPU pool leaves free, spinning on the layer signal"}
  - {resource: slow_memory, purpose: "page-locked mapped staging for the CPU's expert rows (k x n_embd floats) and the doorbell words"}
  - {resource: fast_memory, purpose: "the device copy of the expert rows"}
  - {resource: accelerator, purpose: "two graphs per layer, or one graph per token"}
decisions:
  - id: loop-form
    text: "Three forms: one graph per token with a device-side wait per layer (default when it can be captured); two graphs per layer with a host poll per layer (--no-token-graph, dumps, or a hit path the token graph cannot hold); direct kernel launches (--no-capture)."
    resolved_at: startup
    source: "src/program/generate.cpp:9714, 20277-20295"
  - id: late-signal-flush
    text: "Token graph: how long a late layer signal waits before one driver call (STRATA_TG_FLUSH_US)."
    value: {value: 2000, unit: us, status: reported, source: "src/core/session.cpp:934-937"}
    resolved_at: startup
  - id: layer-timeout
    text: "Token graph: time after which a silent layer is an error."
    value: {value: 20, unit: s, status: reported, source: "src/core/session.cpp:962"}
    resolved_at: design
invariants:
  - {id: inv/position-staged-before-replay, text: "The per-token position and step counts are written to their fixed pinned buffers before every replay, because the graphs captured the source address and not the value."}
  - {id: inv/no-sync-in-layer-loop, text: "The layer loop makes no blocking synchronization; it waits by querying."}
  - {id: inv/post-before-next-pre, text: "A layer's combine half is launched before the next layer's first half, because the next layer's residual read overwrites the buffers the combine reads."}
  - {id: inv/experts-of-this-layer, text: "The expert rows combined in a layer are the ones that layer's own router selected."}
  - {id: inv/payload-before-signal, text: "The layer signal is the last write in stream order, so a host that sees it may read the published activation, ids and weights."}
calls:
  - {name: session_loop, takes: "position, session state, per-layer graphs, pool callback, hit callback, scratch", returns: "success or an error", does: "Per layer: wait for the signal, start the GPU's own experts, run the pool, copy its rows to the device, launch the combine half, launch the next layer's first half. One synchronization at the end of the token."}
  - {name: session_run_token, takes: "position, session state, token graph, pool callback, the captured staging buffer", returns: "success or an error", does: "One launch per token; per layer the host only waits for the signal, runs the pool and writes the flag the device waits on."}
  - {name: session_token, takes: "position, session state, expert rows prepared by the caller", returns: "success or an error", does: "Runs the 48 layers by direct launches; a debug option synchronizes after every layer."}
verification:
  - {method: none_found, checks: "No test source in the checkout calls session_loop, session_run_token or session_token. The built-in oracle is a per-layer residual dump compared with a reference outside the engine."}
observation_points: [rings_mid_graph, ms_to_ring, ms_host, calls_total, token_graph_ms_wait, token_graph_ms_pool, token_graph_flushes]
equivalence: {level: bit_exact, relative_to: "the same kernels launched directly in order", holds_when: "stated by comments (same kernels in the same order per layer); not tested in the checkout"}
sources:
  - {ref: "src/core/session.cpp:191-198, 533-585, 587-843, 923-984", basis: code}
  - {ref: "src/program/generate.cpp:20218-20438", basis: code}
  - {ref: "include/strata/core/session.hpp:309-434", basis: header_comment}
