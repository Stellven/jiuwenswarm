kind: component
id: comp/strata/ngram-reader
system: sys/strata
parent: comp/strata/token-path
title: "N-gram hash and table reader"
role: table_reader
responsibility: "For each token, compute its 16 row numbers from the token and its two predecessors and deliver those 16 rows of the n-gram table as 2560 floats before layer 1 needs them."
not_responsible_for:
  - "The layer-1 block that consumes the rows and its convolution history (layer kernels)"
  - "Advancing the two-token window, which the driver and the window commit do"
runs: [startup, per_window, per_step, background, on_demand]
performs: [ngram_lookup]
needs_resources:
  - {resource: storage, purpose: "the table: direct reads of one 4096-byte page per row (8192 when a row straddles two), rows on the same page sharing a read"}
  - {resource: slow_memory, purpose: "direct mode: a read slab and a bounded row cache; resident mode: the whole table mapped and locked; mapped mode: the table's pages in the file cache"}
  - {resource: cpu, purpose: "the hash on the calling thread, one I/O worker thread, row dequantisation"}
decisions:
  - id: table-residency
    text: "How rows are read. Unless --ple-io is given: the table is held locked in memory when available memory is at least the table plus the expert arena still to be filled plus 8 GiB, measured before either is allocated; otherwise unbuffered direct reads. Unknown figures admit nothing. STRATA_PLE_AUTO_RAM=0 keeps direct reads. A third mode maps the table without locking."
    resolved_at: startup
    source: "src/program/generate.cpp:5413-5492; include/strata/core/ple_residency.hpp:25-37"
  - id: reads-in-flight
    text: "Outstanding storage reads (--ple-inflight, 1 to 1024)."
    value: {value: 256, status: reported, source: "src/program/generate.cpp:667"}
    resolved_at: startup
  - id: row-cache
    text: "Rows kept after being read, 8-way set-associative with round-robin replacement (--ple-row-cache, 0 disables)."
    value: {value: 1048576, unit: rows, status: reported, source: "src/program/generate.cpp:666"}
    resolved_at: startup
  - id: ssd-keepalive
    text: "Direct mode with the worker: after this long without a read, read one random page of the table, until 60 s after the last request for rows (STRATA_SSD_KEEPALIVE, 0 off)."
    value: {value: 100, unit: ms, status: reported, source: "src/program/generate.cpp:5424-5430"}
    resolved_at: startup
  - id: slow-direct-probe
    text: "Direct reads are probed at start; below 15000 rows per second the engine warns and switches to mapped reads only when STRATA_PLE_AUTO_MMAP=1."
    resolved_at: startup
    source: "src/program/generate.cpp:5495-5527"
  - id: hash
    text: "Row number = (XOR over the n-gram of token id times a per-position multiplier) modulo the head's vocabulary size plus the head's offset; 8 bigram heads and 8 trigram heads; a missing or end-of-sequence predecessor cuts all older context."
    resolved_at: design
    source: "src/kernels/ngram.cpp:100-126"
invariants:
  - {id: inv/rows-before-layer-1, text: "A token's rows are collected before layer 1 reads them. Session loop: before the layer loop starts. Window loop: before the flag layer 1 waits on is raised."}
  - {id: inv/one-token-in-flight, text: "At most one single-token request is in flight per table; a batch gather is refused while one is."}
  - {id: inv/table-fits-file, text: "The table's rows times row bytes fit the file at the offset a validated header parse gives, and fill it exactly when the table is alone in its file."}
  - {id: inv/no-mapping-while-direct, text: "The table file is not kept mapped while it is read direct; a live mapping serialises the unbuffered reads."}
  - {id: inv/failed-reader-stays-failed, text: "After a failed read every later request returns the error at once until the table is reopened."}
calls:
  - {name: ngram_rows, takes: "token ids, two predecessors each (oldest first, -1 for none), the hash constants", returns: "16 row numbers per token", does: "Pure host hash."}
  - {name: issue, takes: "16 row numbers", returns: "accepted, or refused when a token is already in flight", does: "Starts the reads and returns at once."}
  - {name: collect, takes: "a host buffer of 2560 floats", returns: "success or an I/O error", does: "Blocks until the issued rows have arrived and writes them dequantised."}
  - {name: prefetch_rows, takes: "16 row numbers", returns: "nothing", does: "Starts the reads without a waiter; a later batch gather of the same rows uses them."}
  - {name: gather_batch, takes: "16 row numbers for each of n tokens, a host buffer", returns: "success or an I/O error", does: "Reads all rows as one request with pages deduplicated and sorted by offset."}
verification:
  - {method: parity_with_reference, checks: "The direct reader on a synthetic table whose rows encode their own index (wrong offset, page straddle, dedup mix-up), and direct against mapped bytes on the real table.", against: "ground truth rows; the mapped read", source: "src/ngram/ple_reader_test.cpp; src/ngram/ple_reader_stress_test.cpp"}
  - {method: parity_with_reference, checks: "The hash with the file's own constants, the row dequantisation, and the layer-1 block; stated by header comments.", against: "ref/ngram.py, numpy over the original file, ggml's graph", source: "src/kernels/ple_parity.cpp"}
  - {method: unit_test, checks: "The residency admission rule.", source: "src/core/ple_residency_test.cpp"}
  - {method: measurement, checks: "Issue latency.", source: "tests/ngram/ple_issue_bench.cpp"}
observation_points: [reader_requests, reader_cache_hits, reader_dedup_rows, reader_reads, reader_bytes, reader_wait_us, reader_read_latency, keepalive_reads]
equivalence: {level: bit_exact, relative_to: "the rows as stored in the table file", holds_when: "any of the three read modes; the table's own encoding (for example IQ4_NL against FP8) is a property of the model file, not of the reader"}
