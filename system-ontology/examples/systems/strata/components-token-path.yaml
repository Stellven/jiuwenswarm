kind: component
id: comp/strata/window-loop
system: sys/strata
parent: comp/strata/token-path
title: "Window loop"
role: host_loop
responsibility: "Run one window of 1 to max_t tokens through the layers and the output head as a single replayed graph, and serve each layer's host-side expert work when the GPU signals that the layer's routing is known."
not_responsible_for:
  - "Drafting tokens or choosing the window size (speculation)"
  - "Deciding which accepted prefix to keep and making it permanent (draft verifier)"
  - "Deciding which device computes an expert (expert dispatch, called through the pool callback)"
  - "Recording the graph (window graphs)"
runs: [per_window, per_layer]
implements_stages: [decode, verify]
state:
  reads: [residency_table]
  writes: [attention_kv, indexer_keys, ple_history]
needs_resources:
  - {resource: cpu, purpose: "one host thread that spins on the layer signal and then runs the pool callback"}
  - {resource: slow_memory, purpose: "page-locked, device-mapped staging: window tokens, positions, n-gram rows, the layer's activations and routed ids, the CPU's expert rows, the picks, the signal and flag words"}
  - {resource: fast_memory, purpose: "one arena sized for max_t rows: the window's own residual, per-layer mixer inputs kept for commit, router logits, expert rows, head logits, a 16-expert staging area"}
  - {resource: accelerator, purpose: "the window graph"}
decisions:
  - id: graph-variant
    text: "Per window: the zero-doorbell graph when the host residency table shows every expert of the stage in fast memory, otherwise the doorbell graph. Checked before each window."
    resolved_at: runtime
    source: "src/core/verify.cpp:2736-2750"
  - id: batched-rows
    text: "Whether the window's rows go through multi-row kernels (STRATA_DEC_BATCH)."
    value: {value: "on", status: reported, source: "src/core/verify.cpp:1360"}
    resolved_at: startup
  - id: token-groups
    text: "Whether the window is split into two token groups whose CPU and GPU work are pipelined (--spec-split)."
    value: {value: "off", status: reported, source: "include/strata/core/verify.hpp:733"}
    resolved_at: startup
  - id: late-signal-flush
    text: "How long the host waits for a layer signal before it enters the driver once to flush and check for a fault."
    value: {value: 2000, unit: us, status: reported, source: "src/core/verify.cpp:3445"}
    resolved_at: design
  - id: layer-timeout
    text: "How long a layer may stay silent before the window is abandoned and the GPU's waits are force-released."
    value: {value: 20, unit: s, status: reported, source: "src/core/verify.cpp:3460-3475"}
    resolved_at: design
  - id: ngram-gather-point
    text: "When the window's n-gram rows are gathered. Doorbell graph: after layer 0's CPU experts are served and before the layer-0 flag is raised. Zero-doorbell graph: right after the launch, or before it when STRATA_VERIFY_EARLY_PLE_FLAG says so (0 on CUDA)."
    resolved_at: startup
    source: "src/core/verify.cpp:377-387, 3308-3318, 3419-3431, 3521-3531"
invariants:
  - {id: inv/window-inside-context, text: "A window's last position is inside the context the session was sized for."}
  - {id: inv/payload-before-signal, text: "The layer signal is the last write in stream order, so a host that sees it may read the published activations and routed ids."}
  - {id: inv/cpu-rows-before-flag, text: "The host raises a layer's flag only after the CPU's expert rows for that layer are in the mapped buffer."}
  - {id: inv/ngram-rows-before-layer-1, text: "The window's n-gram rows are in mapped memory before the flag that layer 1 waits on is raised."}
  - {id: inv/no-window-after-forced-release, text: "After the GPU's waits were force-released, no further window is run on that verifier."}
calls:
  - {name: run, takes: "window size T, T token ids, first position, pool callback", returns: "one pick per row", does: "Launches the T-token graph, serves every layer that signals, waits for the graph to finish, and returns the picks."}
  - {name: prepare, takes: "window size T", returns: "done, or that fast memory was insufficient", does: "Has the T-token graph recorded ahead of first use without changing anything else."}
  - {name: set_sampling, takes: "sampling settings of the request", returns: "nothing", does: "Makes the next windows re-sample outside the graph with these settings."}
verification:
  - {method: none_found, checks: "No isolated test of the window host loop was found. The multi-row kernels it launches are tested (route_window_parity, kv_window_parity, kv_steps_parity)."}
observation_points: [ms_wait, ms_pool, ms_host, windows, verify_trace]
equivalence:
  - {level: bit_exact, relative_to: "token-by-token greedy decoding", holds_when: "default configuration; stated by the header comment, not checked here"}
  - {level: approximate, relative_to: "token-by-token greedy decoding", holds_when: "STRATA_ROUTE_PRIOR or STRATA_ROUTE_RESIDENT is set, or a route tail skip rank is set"}
sources:
  - {ref: "src/core/verify.cpp:3229-3702", basis: code}
  - {ref: "src/core/verify.cpp:1420-1604, 2190-2645", basis: code}
  - {ref: "src/core/verify.cpp:1020-1118", basis: code}
  - {ref: "include/strata/core/verify.hpp:1-21", basis: header_comment}
not_read: "Verifier::commit, the batch and pipelined windows, stage_inputs, and the mixer section of record_window (only its call order was extracted)."
