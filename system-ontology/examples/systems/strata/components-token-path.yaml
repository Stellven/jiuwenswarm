  - {ref: "src/core/verify.cpp:2195-2271", basis: code}
  - {ref: "src/kernels/cuda/router_top10.cu:395-497", basis: code}
  - {ref: "src/kernels/cuda/native_router.cu:205-222", basis: code}
  - {ref: "include/strata/kernels/router_top10.hpp; include/strata/kernels/native_router.hpp; include/strata/kernels/route_prior.hpp", basis: header_comment}
not_read: "The kernel bodies of both routers and of the two opt-in re-pick kernels."
