kind: component
id: comp/strata/window-graphs
system: sys/strata
parent: comp/strata/token-path
title: "Recorded graphs"
role: graph_runner
responsibility: "Record the fixed sequence of device work once and keep the recorded graphs available for replay, freeing and re-recording them when fast memory for a new one runs out."
not_responsible_for:
  - "Owning or checking the buffers a graph touches; fixed addresses are the caller's obligation"
  - "Launching a graph and serving it (the two loops)"
runs: [startup, on_demand]
state:
  owns: [captured_graphs]
needs_resources:
  - {resource: fast_memory, purpose: "driver memory held by each instantiated graph", note: "The code does not compute the amount; a comment gives 20 to 30 MiB per batch-layout pair on one card."}
  - {resource: accelerator, purpose: "recording and upload"}
decisions:
  - id: graph-unit
    text: "Window loop: one graph per window size, holding all layers and the head, in two variants (zero-doorbell and doorbell), recorded on first use or ahead of it, plus one commit graph. Session loop: one graph per token, or a first-half and a combine-half graph per layer."
    resolved_at: design
    source: "src/core/verify.cpp:2752-2916; src/core/session.cpp:200-285, 849-921"
  - id: eviction-on-out-of-memory
    text: "When instantiating a graph reports out of memory: first free the least recently used batch-layout graphs; then, for a single-request window, free the graph of the largest other window size that is neither the one being recorded nor one already launched ahead. A freed size is recorded again when next used."
    resolved_at: runtime
    source: "src/core/verify.cpp:4409-4427, 4525-4570; include/strata/core/window_evict.hpp:11-17"
  - id: batch-graph-limit
    text: "Upper bound on recorded batch layouts (0 means unbounded)."
    resolved_at: startup
    source: "include/strata/core/verify.hpp:258-259"
invariants:
  - {id: inv/fixed-addresses, text: "A recorded graph reads and writes buffers at the addresses it was recorded with."}
  - {id: inv/per-token-values-are-data, text: "Anything that changes per token (position, step counts, token id) reaches a graph through a fixed-address buffer, never as a kernel argument."}
  - {id: inv/switches-before-capture, text: "Every kernel-set switch is set before the first recording."}
  - {id: inv/no-capture-while-in-flight, text: "No graph is recorded or freed while a window is in flight on the same stream; the stream is synchronised first."}
calls:
  - {name: capture, takes: "window size T", returns: "a graph handle, or out of memory", does: "Records the T-token window once; a second call for the same size and variant does nothing."}
  - {name: session_capture, takes: "session, the device address of the expert rows", returns: "two graph handles per layer", does: "Records every layer's two halves once."}
  - {name: session_capture_token, takes: "session, device and host addresses of the expert rows", returns: "one graph handle", does: "Records all 48 layers with a device-side wait and a copy from mapped memory between each layer's halves."}
  - {name: pick_window_victim, takes: "which sizes have a graph, the size to keep, the size launched ahead", returns: "the size to free, or none", does: "Names the largest other size."}
verification:
  - {method: unit_test, checks: "The victim rule: largest first, never the kept size, never the launched-ahead size.", source: "src/core/window_evict_test.cpp"}
  - {method: none_found, checks: "No test of recording or replay itself was found."}
equivalence: {level: bit_exact, relative_to: "the same kernels launched directly", holds_when: "stated by comments; the documented failure is a stale recorded value replayed for every token"}
sources:
  - {ref: "src/core/verify.cpp:2752-2916, 4405-4427, 4525-4589", basis: code}
  - {ref: "src/core/session.cpp:200-285, 496-531, 849-921", basis: code}
  - {ref: "include/strata/core/window_evict.hpp", basis: code}
not_read: "The batch-layout and commit graph recording."
