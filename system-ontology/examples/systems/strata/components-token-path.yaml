kind: component
id: comp/strata/layer-kernels
system: sys/strata
parent: comp/strata/token-path
title: "Layer kernels and their order"
role: kernel_set
responsibility: "Compute the part of each layer every token needs, in a fixed order, and keep the per-sequence state those kernels read and write at fixed device addresses."
not_responsible_for:
  - "Choosing the routed experts (expert router) or computing them (expert dispatch, CPU expert pool)"
  - "Hashing a token to n-gram rows or reading the table (n-gram reader); both are host work and must stay outside any recorded graph"
  - "The vocabulary projection (output head)"
runs: [startup, per_request, per_layer]
performs: [shared_blocks]
state:
  owns: [gdn_state, indexer_keys, ple_history]
  reads: [attention_kv]
  writes: [attention_kv]
needs_resources:
  - {resource: accelerator, purpose: "residual read and write, recurrent mixer, attention mixer, shared expert, combine of expert rows, layer-1 n-gram block, token embedding"}
  - {resource: fast_memory, purpose: "the session arena: residual stack, one recurrent state per recurrent layer, per attention layer the indexer keys and position tables, shared scratch, n-gram convolution history"}
decisions:
  - id: order-in-a-layer
    text: "Residual read (attention half), mixer (attention on 12 layers, recurrent on 36), residual write, residual read (feed-forward half), router and publish, shared expert, then after the host or the GPU has supplied the expert rows the combine and the residual write. On layer 1 the n-gram block updates the residual first."
    resolved_at: design
    source: "src/core/layer.cpp:1473-1650; src/core/verify.cpp:2511-2517"
  - id: order-in-an-attention-mixer
    text: "Norm, key and value projections, append to the key and value store, append to the indexer, query projection, block scores, block top-k, make the selected blocks resident, attention, gate, output projection."
    resolved_at: design
    source: "src/core/layer.cpp:1144-1320 (call order)"
  - id: shared-expert-early
    text: "The shared expert runs right after the layer signal so that the GPU computes it while the host runs the CPU experts."
    value: {value: "on", status: reported, source: "include/strata/core/layer.hpp:194-199; src/core/layer.cpp:1587"}
    resolved_at: startup
  - id: fused-residual-read
    text: "The residual read folds in the previous half's pending write. On only with the native projection contract and no dump or stage timing."
    resolved_at: startup
    source: "src/program/generate.cpp:5304-5309"
  - id: session-size
    text: "The session arena is sized once from the context length, the layer range and the key and value storage plan; nothing is allocated on the token path."
    resolved_at: startup
    source: "src/core/session.cpp:51-126"
invariants:
  - {id: inv/fixed-addresses, text: "Every buffer a recorded graph touches keeps its address from session set-up until the graphs are freed."}
  - {id: inv/halves-share-buffers, text: "The mixed activation and the injection a layer's first half leaves are untouched until its combine half has read them."}
  - {id: inv/experts-of-this-layer, text: "The expert rows combined in a layer are the ones that layer's own router selected."}
  - {id: inv/host-work-outside-graphs, text: "Host operations (the n-gram hash and the table gather) are never inside a recorded function, or they would run once at recording time and replay the same rows for every token."}
  - {id: inv/router-activation-format, text: "The router reads the activation in the format its weight was stored for; another format moves the logits enough to change a selection."}
calls:
  - {name: block_layer_pre, takes: "layer index, session buffers, doorbell, n-gram run", returns: "success or an error", does: "Launches a layer from its first residual read through the router, the publish and the shared expert."}
  - {name: block_layer_post, takes: "layer index, session buffers, the layer's expert rows", returns: "success or an error", does: "Launches the combine and the residual write of a layer."}
  - {name: session_zero, takes: "session, initial residual", returns: "nothing", does: "Returns every layer's state and the n-gram history and token window to the start of a sequence."}
  - {name: layer_verify_compatible, takes: "nothing", returns: "yes, or the first switch that is off", does: "Says whether the current kernel set is the one the window graph reproduces."}
verification:
  - {method: parity_with_reference, checks: "Each kernel alone against its reference, stated by the header comment; the parity sources were not read.", against: "ref/ reference implementations", source: "include/strata/core/layer.hpp:3-6"}
  - {method: end_to_end_only, checks: "The order of kernels in a layer: per-layer and per-half residual dumps compared with a reference outside the engine.", source: "include/strata/core/layer.hpp:467-475; include/strata/core/session.hpp:345-353"}
equivalence:
  - {level: bit_exact, relative_to: "the single-token kernels", holds_when: "multi-row window kernels, default configuration; stated by comments"}
  - {level: numeric, relative_to: "the reference implementation", holds_when: "not established here; several selectable kernel sets exist and kernel numerics were not read", note: "UNSET in substance"}
sources:
  - {ref: "src/core/layer.cpp:405-561, 1473-1650", basis: code}
  - {ref: "src/core/layer.cpp:251-384, 1144-1320", basis: code}
  - {ref: "src/core/session.cpp:51-198", basis: code}
  - {ref: "src/core/verify.cpp:1420-1604, 2280-2332, 2341-2509", basis: code}
  - {ref: "include/strata/core/verify.hpp:13-18", basis: header_comment}
not_read: "All kernel bodies. For the two mixers only the order of calls was extracted. The commit rules in the states file come from a header comment."
