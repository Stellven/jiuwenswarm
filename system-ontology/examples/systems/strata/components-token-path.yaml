kind: component
id: comp/strata/sampler
system: sys/strata
parent: comp/strata/token-path
title: "Sampler"
role: sampler
responsibility: "Turn each position's logits into one token id by a fixed chain: logit bias, penalties, top-k, top-p, min-p, temperature, pick."
not_responsible_for:
  - "Computing the logits (output head)"
  - "Deciding whether a drafted token is accepted (draft verifier)"
runs: [per_window, per_step]
implements_stages: [decode, verify]
needs_resources:
  - {resource: accelerator, purpose: "the pick: one block per row for greedy; for a sampled request a split top-k over the vocabulary and one warp per row"}
  - {resource: fast_memory, purpose: "scratch for the split top-k, grown on demand outside any recording"}
decisions:
  - id: where-it-runs
    text: "Greedy: inside the window graph, at no extra launch or synchronisation. A sampled, penalised or biased request: again outside the graph after the window has finished, with the request's own settings, followed by a synchronisation. Session loop: once per token after the head."
    resolved_at: runtime
    source: "src/core/verify.cpp:2628-2638, 3602-3642; src/program/generate.cpp:20382-20390"
  - id: default-settings
    text: "A request without settings is greedy in the window loop. The parameter defaults are top-k 20, top-p 0.95, min-p 0, temperature 1.0, penalties off."
    resolved_at: runtime
    source: "include/strata/core/verify.hpp:553-558; include/strata/kernels/sampler.hpp:15-30"
  - id: draw-key
    text: "The random draw of a row is a counter-based generator keyed by the seed and the row's absolute position."
    resolved_at: design
    source: "src/core/verify.cpp:3594-3605; src/program/generate.cpp:20380-20382"
  - id: sampled-implementation
    text: "Three implementations of the sampled chain that pick the same token: split top-k (default), one block per row (STRATA_SAMPLER_ONE_BLOCK, and where the split cannot run), the older kernel (STRATA_OLD_SAMPLER)."
    resolved_at: startup
    source: "src/kernels/cuda/sampler.cu:1123-1139, 1285-1312"
  - id: penalty-window
    text: "Penalties count only the current reply unless STRATA_PENALTY_PROMPT=1; each window row gets its own history ending with the drafts before it."
    resolved_at: startup
    source: "include/strata/kernels/sampler.hpp:94-122"
invariants:
  - {id: inv/sampler-order, text: "The chain order is logit bias, penalties, top-k, top-p, min-p, temperature, pick."}
  - {id: inv/draw-tied-to-position, text: "A seed gives the same text however the output was cut into windows, because a row's draw depends only on the seed and the position."}
  - {id: inv/sampling-outside-graph, text: "Request-specific sampling is never part of a recorded graph, which would replay the same settings and draws."}
calls:
