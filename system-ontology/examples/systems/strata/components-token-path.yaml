# Strata, token-path area. Written from engines/strata-notes/token-path.md (commit 504b143, CUDA path,
# Qwen3.8-Flash-Next). One document per component.
kind: component
id: comp/strata/token-path
system: sys/strata
title: "Token path"
role: subsystem
responsibility: "Take one token, or one window of tokens, through all 48 layers and the output head and produce a token choice for each position."
not_responsible_for:
  - "Computing or placing the routed experts (expert subsystem)"
  - "Deciding how many tokens to draft and which drafts to keep (speculation)"
  - "Reading the prompt in chunks (prompt path)"
parts:
  - comp/strata/window-loop
  - comp/strata/session-loop
  - comp/strata/layer-kernels
  - comp/strata/expert-router
  - comp/strata/window-graphs
  - comp/strata/kv-store
  - comp/strata/ngram-reader
  - comp/strata/output-head
  - comp/strata/sampler
runs: [startup, per_request, per_window, per_step, per_layer, background, on_demand]
decisions:
  - id: which-per-token-path
    text: "Which of the two host loops runs. A pack whose folder holds native_experts.txt (the IQ2_XS, IQ3_XXS, IQ3_S, NVFP4 and Unsloth packs) runs the window loop only, with a window of one token for plain decoding. A pack without that file (the canonical Q2_0 pack) runs the session loop for the prompt tail and the first generated token, and hands over to the window loop from the second generated token when a draft window is configured."
    resolved_at: startup
    source: "src/program/generate.cpp:4680, 9196, 9714, 20220, 20437; src/kernels/cpu/expert_layout.cpp:456-458"
  - id: dense-kernel-set
    text: "Which dense kernel set the layers use. The --native preset turns on the native kernels (projections, recurrent mixer, router, attention, indexer, rope). The window loop refuses to run without them. Every switch is fixed before the first graph is captured."
    resolved_at: startup
    source: "src/program/generate.cpp:4380-4416, 5300-5320; src/core/layer.cpp:537-547"
sources:
  - {ref: "src/program/generate.cpp:4680, 9196, 9714, 20218-20437", basis: code}
  - {ref: "src/core/session.cpp:51-984", basis: code}
  - {ref: "src/core/verify.cpp:3229-3702", basis: code}
not_read: "Kernel numerics. Most of src/core/verify.cpp and src/program/generate.cpp outside the cited ranges."
