  - {ref: "src/kernels/ngram.cpp:96-145, 248-747", basis: code}
  - {ref: "src/program/generate.cpp:5405-5550, 20236-20255", basis: code}
  - {ref: "src/core/verify.cpp:3291-3318, 3419-3431, 3521-3531", basis: code}
