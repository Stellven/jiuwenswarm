kind: component
id: comp/strata/kv-store
system: sys/strata
parent: comp/strata/token-path
title: "Key and value store"
role: state_manager
responsibility: "Hold the attention keys and values of every position of each attention layer in the configured format, reachable through a page table, and when streaming is on make every block a selection names resident in fast memory before the attention reads it."
not_responsible_for:
  - "Choosing which positions are attended (the indexer and block top-k in the layer kernels)"
  - "Choosing the format or the resident window (start-up flags written by setup)"
runs: [startup, per_request, per_layer]
state:
  owns: [attention_kv, kv_residency_map]
needs_resources:
