kind: component
id: comp/strata/cpu-expert-pool
system: sys/strata
parent: comp/strata/expert-subsystem
title: "CPU expert pool"
role: executor
responsibility: "Compute a batch of expert evaluations on CPU cores, reading each expert's bytes in place, and return only when every job is done and every worker is parked again."
not_responsible_for:
  - "Choosing which experts it is given (expert dispatch)"
  - "Applying the router weights or summing; it returns unweighted rows and a GPU kernel does the weighted sum"
  - "Holding the expert bytes (expert source)"
runs: [startup, per_layer, background]
performs: [expert_ffn]
needs_resources:
  - {resource: cpu, purpose: "one pinned worker per physical core used, plus the host thread, which also takes jobs"}
  - {resource: slow_memory, purpose: "per-thread scratch and the split buffers, allocated once; it reads expert bytes from wherever the expert source holds them and writes rows into the loop's page-locked mapped buffer"}
decisions:
  - id: worker-count
    text: "Default: physical cores on the host thread's socket minus one for the host; one more kept free when that is 16 or more; on a hybrid CPU with more efficiency than performance cores at most performance cores minus one plus half the efficiency cores; at most a container's CPU quota minus one; never above 32. A configured count runs as given with a warning."
    resolved_at: startup
    source: "include/strata/kernels/cpu/pool_plan.hpp:27-123; src/kernels/cpu/pool.cpp:802-818"
  - id: host-thread-works
    text: "The host thread claims jobs itself during a batch."
    value: {value: "on", status: reported, source: "src/program/generate.cpp:7850; src/kernels/cpu/pool.cpp:1430-1440"}
    resolved_at: startup
  - id: tasks-per-phase
    text: "Row ranges a phase is cut into (--pool-tasks, 0 to 4096)."
    value: {value: "3 per participating thread", status: reported, source: "src/kernels/cpu/pool.cpp:1322-1324"}
    resolved_at: startup
  - id: park-spin
    text: "A parked worker spins this long, then sleeps on a condition variable (STRATA_POOL_SPIN_US)."
    value: {value: 20, unit: ms, status: reported, source: "include/strata/kernels/cpu/pool.hpp:282"}
    resolved_at: design
  - id: stall-limit
    text: "A wait that sees no progress this long stops the process after releasing the GPU's waits."
    value: {value: 60, unit: s, status: reported, source: "include/strata/kernels/cpu/pool.hpp:285; src/kernels/cpu/pool.cpp:1138-1172"}
    resolved_at: design
  - id: job-shape
    text: "Single-token path: one job per missed expert, whole or split by rows across threads. Window path: one job per distinct missed expert carrying every token routed to it, in two row phases (gate and up rows, then down rows) with a quantisation between."
    resolved_at: design
    source: "src/core/expert_source.cpp:4841-4851, 5279-5331; src/kernels/cpu/pool.cpp:1306-1395"
  - id: numa-split
    text: "With two or more memory nodes the row phases are split one slice per node when that can run (STRATA_NUMA_POOL=0 turns it off)."
    resolved_at: startup
    source: "src/kernels/cpu/pool.cpp:753-760, 819-911"
invariants:
  - {id: inv/claim-carries-batch, text: "A claim succeeds only for the batch the thread woke for, so a late worker can never take or count a job of the next batch."}
  - {id: inv/batch-is-a-barrier, text: "A batch is published only when every worker is parked, and the call returns only when every job is done and every worker is parked again."}
  - {id: inv/one-writer-per-row, text: "Each output row is written by exactly one thread."}
  - {id: inv/hit-rows-zeroed, text: "A row that belongs to the GPU is written as zeros by the host or the device, never left with the previous layer's content."}
  - {id: inv/no-token-path-allocation, text: "Nothing is allocated while a batch runs."}
calls:
  - {name: run, takes: "n jobs, each an expert's bytes, a shared quantised activation and an output row", returns: "when all rows are written", does: "Whole experts, one claim per job."}
  - {name: run_split, takes: "up to 16 single-token jobs", returns: "when all rows are written", does: "Every expert split by rows across all threads; bitwise the same rows as run."}
  - {name: run_split_multi_native, takes: "the layer's format, jobs each with up to a window's tokens", returns: "when all rows are written", does: "The same for a native pack's layer, reading each expert's rows once for all its tokens, in batches of 96 experts."}
  - {name: diag, takes: "an output file", returns: "nothing", does: "Prints the batch, the counters and every thread's state for the stall watchdog."}
verification:
  - {method: parity_with_reference, checks: "Every job's output is bit-identical to running that expert serially; every job runs exactly once; repeated batches; batches larger and smaller than the worker count.", against: "serial execution", invariants: [inv/claim-carries-batch, inv/one-writer-per-row], source: "src/kernels/cpu/pool_test.cpp"}
  - {method: invariant_test, checks: "Stress of the park and claim protocol.", invariants: [inv/claim-carries-batch, inv/batch-is-a-barrier], source: "src/kernels/cpu/pool_stress.cpp"}
