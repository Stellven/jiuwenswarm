# Strata, expert subsystem and prompt path. Written from the implementation at revision 504b143.
# Source paths are relative to the Strata repository.
kind: component
id: comp/strata/expert-subsystem
system: sys/strata
title: "Expert subsystem"
role: subsystem
responsibility: "For every layer of every window, get each routed expert computed by whichever path can produce it soonest, and keep the fast memory filled with the experts in most use."
parts:
  - comp/strata/expert-source
  - comp/strata/expert-cache
  - comp/strata/expert-dispatch
  - comp/strata/cpu-expert-pool
  - comp/strata/adaptive-tier
  - comp/strata/host-to-device-transfer
runs: [startup, per_layer, background, on_demand]
mechanisms: [mech/hot-expert-residency, mech/route-tail-skip]
sources:
  - {ref: "src/core/expert_source.cpp:4925-5079", basis: code}
  - {ref: "src/program/generate.cpp:13142-13314", basis: code}
---
kind: component
id: comp/strata/expert-cache
system: sys/strata
parent: comp/strata/expert-subsystem
title: "Expert cache"
role: cache
responsibility: "Hold a fixed number of experts in fast memory and answer, for any expert, whether it is there and in which slot."
not_responsible_for:
  - "Choosing which experts to hold; the adaptive tier does that"
  - "Evicting on its own; its basic admit operation never evicts"
  - "Deciding its own size; startup memory sizing does that"
runs: [startup, on_demand]
state:
  owns: [residency_table]
needs_resources:
  - {resource: fast_memory, purpose: "one slot per cached expert", note: "takes what remains after dense weights, session state and the drafter"}
decisions:
  - id: slot-count
    text: "How many slots the cache has. The automatic value is the free fast memory minus a reserve, divided by the largest expert; after opening, free memory is read again and the cache is shrunk if the reserve was not really left."
    resolved_at: startup
    source: "engines/strata-notes/loading.md, startup sizing"
invariants:
  - {id: inv/read-ready, text: "A slot is reported as holding an expert only after that expert's bytes have fully arrived."}
  - {id: inv/no-overwrite-while-read, text: "A slot is not written while any launched computation may still read it."}
calls:
  - {name: lookup, takes: "layer and expert number", returns: "slot number, or absent", does: "Reads the residency table; never reports an expert whose copy is still in flight."}
  - {name: admit, takes: "layer, expert number and a free slot", returns: "nothing", does: "Records the expert as resident in that slot. Does not evict."}
  - {name: device_slot, takes: "slot number", returns: "the address of the slot in fast memory", does: "Gives the destination for an upload."}
verification:
  - {method: none_found, checks: "No isolated test of the cache was identified in the code read."}
equivalence:
  - {level: bit_exact, holds_when: "the GPU and CPU expert kernels round identically", note: "The cache itself does not change arithmetic. The project's own text is inconsistent on whether GPU-computed and CPU-computed experts are bit-identical; see engines/strata-notes/loading.md."}
costs:
  - {text: "Without the cache the CPU reads 663.6 MB of expert bytes per token at about 40 GB/s, 16.2 ms of a token of about 53 ms", status: reported, source: "include/strata/core/expert_cache.hpp (header comment)"}
claims:
  - {text: "Each extra GB of fast memory holds about 700 more experts", status: reported, source: "docs/HOW_IT_WORKS.md:25"}
mechanisms: [mech/hot-expert-residency]
sources:
  - {ref: "src/program/generate.cpp:13204-13263", basis: code}
  - {ref: "include/strata/core/expert_cache.hpp", basis: header_comment}
not_read: "The cache's own implementation file. Its behaviour here is taken from how the dispatch and the adaptive tier use it."
---
kind: component
id: comp/strata/expert-dispatch
system: sys/strata
parent: comp/strata/expert-subsystem
title: "Expert dispatch"
role: assigner
responsibility: "For one layer of one window, decide for every routed expert which path computes it, and publish the accelerator's share before the CPU's share starts."
not_responsible_for:
  - "Changing what the cache holds; the adaptive tier does that"
  - "Summing the experts' outputs; a combine kernel on the accelerator does that"
runs: [per_layer]
performs: [expert_ffn]
state:
  reads: [residency_table]
  writes: [expert_heat]
needs_resources:
  - {resource: accelerator, purpose: "experts found in the cache and experts fetched for this window"}
  - {resource: fast_memory, purpose: "a staging area for experts fetched for this window only"}
decisions:
  - id: path-order
    text: "The order in which paths are tried for a routed expert: cached in fast memory; omitted because it ranks low for every token of the window; held by a second accelerator; fetched for this window only; computed by the CPU."
    resolved_at: design
    source: "src/core/expert_source.cpp:5032-5070"
  - id: tail-skip-rank
    text: "A missed expert that every token of the window routes only at this rank or lower is neither fetched nor computed."
    value: {value: 7, status: reported, source: "src/core/expert_source.cpp:4964"}
    resolved_at: design
  - id: fetch-share
    text: "How many of a layer's missed experts are fetched for this window instead of being left to the CPU. A fixed share, or a count from measured CPU and accelerator costs when that option is on."
    resolved_at: runtime
    source: "src/core/expert_source.cpp:5002-5009"
invariants:
  - {id: inv/always-served, text: "Every routed expert that is not omitted is computed by exactly one path."}
  - {id: inv/gpu-first, text: "The accelerator's share is decided and published before the CPU's share starts, so the two overlap."}
calls:
  - {name: dispatch_window, takes: "for one layer, the routed expert numbers and weights of every token in the window, and the normed activations", returns: "per routed entry, the path chosen", does: "Counts usage, classifies every distinct routed expert, publishes the accelerator plan, then starts CPU work."}
verification:
  - {method: none_found, checks: "No isolated test of the classification was identified. A route dump option writes one line per layer and window for replaying placement policies offline.", source: "src/core/expert_source.cpp:4987-5001"}
observation_points: [cache_hit_count, cache_miss_count, tail_skipped_count, route_dump]
equivalence:
  - {level: approximate, holds_when: "the tail skip is on, which is the default on the CUDA serving path", note: "The code comment states it changes the output; other experts' weights are not renormalised."}
  - {level: bit_exact, holds_when: "the tail skip is off"}
mechanisms: [mech/hot-expert-residency, mech/route-tail-skip]
sources:
  - {ref: "src/core/expert_source.cpp:4925-5079", basis: code}
