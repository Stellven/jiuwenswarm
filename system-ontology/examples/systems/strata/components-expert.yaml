kind: component
id: comp/strata/host-to-device-transfer
system: sys/strata
parent: comp/strata/expert-subsystem
title: "Host-to-device transfer"
role: data_mover
responsibility: "Copy expert bytes from slow memory to fast memory in an order the accelerator work that follows can rely on."
runs: [on_demand]
state:
  owns: [staged_experts]
needs_resources:
  - {resource: slow_memory, purpose: "page-locked bounce slots for uploads whose source memory is pageable"}
  - {resource: fast_memory, purpose: "the destination slots and the staging area"}
decisions:
  - {id: batch-mode, text: "Whether the adaptive tier's copies are issued one by one or as one batched copy.", resolved_at: startup, source: "src/program/generate.cpp:13219-13287"}
  - {id: staging-limit, text: "The most experts that can be fetched for one window, bounded by the staging area and by 64.", resolved_at: startup, source: "src/core/expert_source.cpp:5056"}
invariants:
  - {id: inv/ordered-upload, text: "An upload is ordered before the accelerator work that reads its destination."}
  - {id: inv/pinned-source, text: "Only an expert whose source bytes are page-locked is fetched for a window; otherwise it stays with the CPU."}
verification:
  - {method: none_found, checks: "No isolated test was identified in the code read."}
equivalence: bit_exact
sources:
  - {ref: "src/program/generate.cpp:13219-13287", basis: code}
  - {ref: "src/core/expert_source.cpp:5052-5066", basis: code}
  - {ref: "include/strata/core/pinned_ring.hpp", basis: header_comment}
not_read: "The pinned ring's implementation."
