kind: component
id: comp/strata/prompt-path
system: sys/strata
title: "Prompt path"
role: prompt_reader
responsibility: "Read the prompt in large chunks, layer by layer, and leave behind the model state that generation continues from."
not_responsible_for:
  - "Producing output tokens"
  - "Reusing an earlier conversation; conversation reuse decides where reading starts"
runs: [per_request]
implements_stages: [prefill]
state:
  writes: [attention_kv, indexer_keys, gdn_state, ple_history]
needs_resources:
  - {resource: accelerator, purpose: "batched computation of a chunk, one layer at a time"}
  - {resource: fast_memory, purpose: "chunk buffers; it may borrow expert cache slots for the duration of the prompt"}
  - {resource: cpu, purpose: "experts that few of the chunk's tokens route to, when the CPU share is armed"}
policies: [prefill-cpu-share]
decisions:
  - {id: chunk-size, text: "Tokens per prompt chunk.", value: {value: 8192, status: reported, source: "docs/HOW_IT_WORKS.md:50"}, resolved_at: startup}
  - {id: cpu-share-bounds, text: "The CPU's share of the experts not in fast memory is the accelerator's time per expert over the sum of both times, as running averages, kept between these bounds.", value: {value: "0.05 to 0.9", status: reported, source: "src/prefill/prefill.cpp:4954"}, resolved_at: runtime}
  - {id: cpu-share-gate, text: "Sharing is switched off for following layers when the measured time with sharing is not lower than without.", resolved_at: runtime, source: "src/prefill/prefill.cpp:4957-4980"}
  - {id: cpu-candidates, text: "An expert may go to the CPU only if it is routed in this chunk, is not in fast memory, is not taken by a second accelerator, is routed by no more tokens than the CPU kernel's batch limit, and its weights can be read from slow memory without assembling a short-lived buffer. Candidates are taken in order of fewest tokens first.", resolved_at: runtime, source: "src/prefill/prefill.cpp:5008-5041"}
invariants:
  - {id: inv/stable-source, text: "An expert handed to the CPU must have weights in slow memory that stay readable for the duration of its computation; the pointers are taken before the CPU thread starts."}
verification:
  - {method: none_found, checks: "Not established; most of the prompt path was not read."}
observation_points: [per_object_time_cpu, per_object_time_gpu, tokens_per_object]
equivalence:
  - {level: numeric, holds_when: "the CPU share is armed", note: "The project's documents say the output changes in the last bits."}
  - {level: approximate, holds_when: "the optional approximate late-layer read is on; it is off by default"}
  - {level: bit_exact, holds_when: "neither is on", note: "Stated relative to the same engine's own chunked reading, not to token-by-token decoding."}
mechanisms: [mech/work-based-prefill-split]
claims:
  - {text: "In a streamed chunk, 47 percent of streamed experts at 1,045 tokens, 35 percent at 2K and 15 percent at 8,192 tokens are experts no token routes to", status: reported, source: "include/strata/prefill/routed_stream.hpp (header comment)", conditions: {hardware: "RTX 3090", model: "IQ3_XXS"}}
sources:
  - {ref: "src/prefill/prefill.cpp:4946-5041", basis: code}
  - {ref: "include/strata/prefill/share_rules.hpp", basis: header_comment}
  - {ref: "include/strata/prefill/routed_stream.hpp", basis: header_comment}
  - {ref: "include/strata/program/prefill_plan.hpp", basis: header_comment}
not_read: "Most of src/prefill/ (about 28,000 lines). Read in code: the per-expert token count, the CPU candidate selection, the share formula and the gate."
