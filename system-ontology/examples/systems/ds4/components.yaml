    - indexer_rows
    - compressor_pending
    - kv_row_counters
needs_resources:
  - resource: fast_memory
    purpose: "Append-only cache rows and the compressor's pending group"
decisions:
  - id: raw_window
    text: "Each layer keeps the raw rows of the most recent positions."
    value: 128
    resolved_at: design
    source: "ds4.c lines 1461 to 1475. A property of the model."
  - id: compression_by_layer
    text: "Layers 0 and 1 have no compressed history. From layer 2 on, even layers compress every 4 tokens into one row and an indexer picks at most 512 rows once there are more than 512. Odd layers compress every 128 tokens into one row."
    resolved_at: design
    source: "ds4.c lines 1461 to 1475 and MODEL_CARD.md lines 25 to 59. Stated for V4 Flash."
  - id: rejected_rows_left_in_place
    text: "Rows written for rejected positions stay where they are and are made invisible by the row counters. They are overwritten the next time those positions are written."
    resolved_at: design
    source: "ds4.c lines 65081 to 65200. Read for V4 Flash."
calls:
  - name: snapshot_frontier
    returns: "The compressor's pending group state and the per layer row counters"
    does: "Gives everything that must be saved before a verify pass. Append-only rows are not copied."
  - name: restore_frontier
    takes: "A snapshot for one prefix length"
    does: "Sets the pending group state and row counters to those of the accepted prefix."
sources:
  - ref: "ds4.c lines 1461 to 1475"
    basis: code
  - ref: "ds4.c lines 65081 to 65200"
    basis: code
