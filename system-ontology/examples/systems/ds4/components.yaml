kind: component
id: comp/ds4/engram-row-reader
title: "Engram table row reader"
system: sys/ds4
role: table_reader
responsibility: "Delivers the table rows a token needs, read directly from SSD by row, without keeping the table in memory."
not_responsible_for:
  - "Warming the table into the page cache"
runs:
  - per_step
  - per_request
performs:
  - engram_lookup
state:
  owns:
    - engram_history
needs_resources:
  - resource: storage
    purpose: "The Engram tables, 189 GiB for V4.1 Flash"
  - resource: cpu
    purpose: "Hashing and concurrent read threads"
decisions:
  - id: row_hash
    text: "For each new token, a multiplicative hash of its compressed vocabulary id and those of the 3 tokens before it, taken modulo a set of primes, gives 24 row numbers per table."
    resolved_at: design
    source: "ds4_engram.c lines 49 to 135"
  - id: uncached_descriptor
    text: "Rows are read through a separate file descriptor that bypasses the page cache. F_NOCACHE with read-ahead off on macOS and POSIX_FADV_RANDOM on Linux. Rows are scattered, so read-ahead would bring in useless pages and take memory the model needs."
    resolved_at: design
    source: "ds4_engram.c lines 109 to 115"
  - id: prefill_batch
    text: "During prefill the row numbers of a batch of at most 2048 tokens are sorted and then read by a fixed number of concurrent read threads."
    value: 2048
    resolved_at: design
    source: "ds4_engram.c lines 281 to 300"
calls:
  - name: start_row_read
    takes: "The new token and the 3 token history"
    returns: "A handle the forward pass waits on when layer 1 needs the rows"
    does: "Computes the row numbers and starts reading the rows."
  - name: snapshot_history
    returns: "A copy of the 3 token history"
    does: "Gives a complete snapshot of this component's state, since the history is a small structure of 3 integers."
requires_capabilities:
  - "Fast random reads from local NVMe. An external USB disk reads about 6K rows per second according to a source comment."
equivalence:
  level: bit_exact
  note: "The same bytes are read whichever way they are read, so logits do not change."
sources:
  - ref: "ds4_engram.h (whole file)"
    basis: code
  - ref: "ds4_engram.c lines 49 to 135 and 281 to 300"
    basis: code
  - ref: "ds4.c lines 41265 to 41266 and 43322 to 43331"
    basis: code
