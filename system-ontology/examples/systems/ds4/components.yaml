kind: component
id: comp/ds4/kv-state
title: "Compressed attention state"
system: sys/ds4
role: state_manager
responsibility: "Keeps the attention state of a session as recent raw rows plus compressed rows of older history, with row counters that say which rows are valid."
not_responsible_for:
  - "Deciding how many drafted positions are accepted"
  - "Storing state on disk"
runs:
  - per_step
  - per_window
state:
  owns:
    - raw_kv
