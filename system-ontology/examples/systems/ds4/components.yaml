kind: component
id: comp/ds4/draft-verify-commit
title: "Draft check and prefix commit"
system: sys/ds4
parent: comp/ds4/speculation-subsystem
role: draft_verifier
responsibility: "Checks the drafted tokens in one pass of the full model and leaves the session state exactly as that of the accepted prefix."
not_responsible_for:
  - "Deciding whether a round drafts at all"
runs:
  - per_window
implements_stages:
  - verify
  - commit
state:
  owns:
    - speculation_snapshots
  reads:
    - raw_kv
    - compressed_kv
    - indexer_rows
  writes:
    - compressor_pending
    - kv_row_counters
    - engram_history
    - dspark_window
needs_resources:
  - resource: accelerator
    purpose: "One batched pass over at most 6 rows"
  - resource: fast_memory
    purpose: "One saved copy of the compressor frontier per possible prefix length, and the logits from before the check"
decisions:
  - id: verify_rows
    text: "The last committed token plus the drafts are checked together."
    value: 6
    resolved_at: design
    source: "ds4.c lines 88302 to 88433"
  - id: greedy_accept_rule
    text: "In greedy mode a draft is accepted when the full model's most probable token at position k equals draft k plus 1. Checking stops at the first difference."
    resolved_at: design
    source: "ds4.c lines 88302 to 88433"
  - id: opportunistic_sampling
    text: "With temperature above 0 by default, a draft equal to the full model's greedy result is accepted directly and sampling at the set temperature happens only otherwise. Deliberately more deterministic than ordinary sampling."
    resolved_at: runtime
    source: "ds4.c lines 88383 to 88384 and docs/SPECULATIVE_DECODING.md lines 153 to 157"
  - id: exact_sampling
    text: "With --mtp-exact-sampling a draft is accepted with probability target probability divided by draft probability, and on rejection a token is resampled from the remaining probability mass."
    resolved_at: startup
    source: "ds4.c lines 88385 to 88394 and 84752 to 84770"
  - id: max_saved_prefixes
    text: "Most prefix lengths for which a copy of the compressor frontier is kept during a check."
    value: 5
    resolved_at: design
    source: "ds4.c line 3013. Read for V4 Flash."
  - id: logits_restored_on_empty_prefix
    text: "The logits from before the check are saved and restored unchanged when no draft is accepted."
    resolved_at: design
    source: "ds4.c lines 65081 to 65200. Read for V4 Flash."
invariants:
  - id: only_accepted_prefix_state_visible
    text: "After a round, only state belonging to the accepted prefix is visible. Rows written for rejected positions are hidden by the row counters."
equivalence:
  level: numeric
  relative_to: "Ordinary token by token decoding with the full model"
  holds_when: "Temperature 0. With temperature above 0 the default opportunistic mode changes the distribution and is approximate. With exact sampling the distribution is kept but the sampling path differs."
  note: "At temperature 0 the kept state is the one computed by the batched check, whose floating point summation order differs from token by token decoding. Long continuations are not guaranteed byte identical."
mechanisms:
  - mech/draft-then-verify
sources:
  - ref: "ds4.c lines 88302 to 88433"
    basis: code
  - ref: "ds4.c lines 65081 to 65200"
    basis: code
  - ref: "ds4.c lines 84752 to 84770"
    basis: code
  - ref: "docs/SPECULATIVE_DECODING.md lines 153 to 176"
    basis: docs
not_read: "The V4 Flash DSpark main loop. The snapshot and commit code that was read is the V4 Flash one. For V4.1 the notes add only that the Engram history is copied with the snapshot."
