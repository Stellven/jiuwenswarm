kind: component
id: comp/ds4/dspark-scheduler
title: "DSpark scheduler"
system: sys/ds4
parent: comp/ds4/speculation-subsystem
role: speculation_controller
responsibility: "Decides for each round whether drafting is attempted, pausing it for some rounds when recent acceptance shows it does not pay."
not_responsible_for:
  - "Deciding when the drafter stops within a round. That is the confidence threshold of the drafter."
runs:
  - per_window
state:
  owns:
    - dspark_scheduler_window
policies:
  - dspark_pause
decisions:
  - id: window_rounds
    text: "A judgement is made each time this many rounds are complete."
    value: 4
    resolved_at: design
    source: "ds4.c lines 63216 to 63500. 16 for two Sparks and one ROCm path."
  - id: min_mean_accepted
    text: "Below this mean number of accepted drafts per round, drafting pauses."
    value: 1.5
    resolved_at: design
    source: "ds4.c lines 63216 to 63500. 1.0 for two Sparks, 4.0 on the ROCm fast path."
  - id: pause_rounds
    text: "How many rounds a pause lasts. Ordinary decoding is used meanwhile."
    value: 2
    resolved_at: design
    source: "ds4.c lines 63216 to 63500. Platform variants of 4, 8 and 32."
  - id: pause_when_no_draft
    text: "When the drafter gave no draft at all, pause at least 3 rounds. 4 if only short acceptances came before. 7 if nothing was ever accepted and the first confidence was not above 0.5."
    resolved_at: design
    source: "ds4.c lines 63216 to 63500"
  - id: pause_when_half_empty
    text: "When more than half the rounds of a window gave no draft, pause at least 4 rounds."
    resolved_at: design
    source: "ds4.c lines 63216 to 63500"
  - id: counts_not_time
    text: "Judgements use counts only and never elapsed time, so that which path advanced a token does not vary with machine load and greedy output stays repeatable. The time based option is off by default."
    value: counts
    resolved_at: design
    source: "ds4.c lines 63302 to 63307 (comment)"
sources:
  - ref: "ds4.c lines 63216 to 63500"
    basis: code
