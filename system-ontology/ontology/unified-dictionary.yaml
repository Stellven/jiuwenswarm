    as: field
    meaning: Behavior with no declaration.
- name: undeclared_notes
  side: factory
  factory:
  - where: capsule-declaration.coverage
    as: field
    meaning: What the declaration deliberately leaves out, and why. A missing claim is never read as a promise. The verifier reads it.
- name: undo
  side: factory
  factory:
  - where: common.Effect
    as: field
- name: UNEVALUATED_CANDIDATE
  side: factory
  factory:
  - where: rsi-session-result.outcome
    as: value
- name: Unicode code points
  side: factory
  factory:
  - where: qualified-intake.offset_basis
    as: value
- name: unified_ram
  side: engine
  engine:
    definition: A single memory pool used directly by both CPU and GPU.
    part: given
    zh: 统一内存
- name: unit
  side: factory
  factory:
  - where: research-brief.constraints
    as: field
  - where: research-brief.target_metrics
    as: field
  - where: type BenchmarkMetric
    as: field
    meaning: Unit of every repeat, value and delta of this metric, copied from the blueprint. The runner does not convert units.
  - where: type MetricDeclaration
    as: field
    meaning: Unit of the aggregate, for example `ms` or `fraction`. Thresholds (`offset`) are in this unit. The report copies it as a label.
- name: unit_basis
  side: engine
  engine:
    definition: Whether a byte unit is decimal (10^9) or binary (2^30). The two differ by about 7 percent, so memory quantities must say which. With unit_basis binary,
      a unit written GB means GiB.
    part: meta
    zh: 字节单位的进制
- name: unit_test
  side: engine
  engine:
    definition: 'Verification method: a test of the component''s calls.'
    part: component
    zh: 单元测试
- name: unlisted_network_requests
  side: factory
  factory:
  - where: provisioning-receipt
    as: field
    meaning: Count of requests to hosts outside the allowlist. All were blocked. Must be 0 for `succeeded`.
- name: unmeasured
  side: factory
  factory:
  - where: type MetricVerdictFinding.rule_applied
    as: value
- name: unmeasured_reason
  side: factory
  factory:
  - where: type MetricSide
    as: field
    meaning: 'Why no value exists. Null when `value` exists. Descriptive only: it is a measurement fact, not a pass or fail judgement. Every metric side has a value
      or a reason, never both and never neither.'
- name: unpack_bundle
  side: factory
  factory:
  - where: type ProvisioningEffect.op
    as: value
- name: unresolved_items
  side: factory
  factory:
  - where: research-brief
    as: field
- name: UNSET
  side: engine
  engine:
    definition: Written where a value is needed but no source has provided it. The checker turns every UNSET into a gap with an owner.
    part: meta
    zh: 未给出
    not: Not the same as open. UNSET means someone outside the factory must supply it; open means the factory may choose.
    example: The first use case's quality threshold is UNSET.
- name: unused
  side: factory
  factory:
  - where: type ConformanceItem.status
    as: value
- name: unused_count
  side: factory
  factory:
  - where: contract-conformance
    as: field
    meaning: Declarations never used.
- name: upload_refs
  side: factory
  factory:
  - where: qualified-intake
    as: field
    meaning: The uploads this intake used. Intake qualifies only uploaded files, so every entry of `source_refs` and `resource_refs` traces to one of them. Empty
      when the user uploaded nothing.
- name: uploaded
  side: factory
  factory:
  - where: client-upload.status
    as: value
- name: uploaded_at
  side: factory
  factory:
  - where: client-upload
    as: field
    meaning: Time the file was stored.
- name: upstream_input
  side: factory
  factory:
  - where: rsi-opportunity.attribution
    as: value
- name: usage
  side: factory
  factory:
  - where: invocation-observation
    as: field
    meaning: Token and cost telemetry, with explicit nulls and reasons.
  - where: model-call
    as: field
    meaning: Telemetry that the provider or bridge could observe. An unknown figure stays null and must never be read as zero or as complete cost.
- name: use
  side: factory
  factory:
  - where: type ResourceNeed.mode
    as: value
- name: used
  side: factory
  factory:
  - where: type ConnectorOutcome.status
    as: value
- name: user
  side: factory
  factory:
  - where: common.RequirementStatement.origin
    as: value
  - where: research-brief.constraints.origin
    as: value
  - where: research-brief.target_metrics.origin
    as: value
- name: user_id
  side: factory
  factory:
  - where: qualified-intake
    as: field
    meaning: Authenticated product account that submitted the request.
  - where: client-upload
    as: field
    meaning: Authenticated user who uploaded the file. Only that user lists or deletes it.
  - where: route-request
    as: field
    meaning: Authenticated session identity
- name: user_request
  side: factory
  factory:
  - where: research-brief.confirmation.basis
    as: value
- name: user_targets
  side: factory
  factory:
  - where: intent-ir
    as: field
- name: uses
  side: engine
  engine:
    definition: 'In composition: what a component occupies on this target besides the residency entries it manages, such as working buffers and processor time.'
    part: engine
    zh: 占用
- name: valid_max
  side: factory
  factory:
  - where: type MetricDeclaration
    as: field
    meaning: Highest value one repeat can physically take, in the metric unit, for example 1 for a fraction. Null means no upper bound. Enforced like `valid_min`.
- name: valid_min
  side: factory
  factory:
  - where: type MetricDeclaration
    as: field
    meaning: Lowest value one repeat can physically take, in the metric unit, for example 0 for a time or a fraction. Null means no lower bound. The host check `measurement_within_declared_range`
      of Research Benchmark enforces it. A value outside the range is rejected there, so the Benchmark node stops and Evaluation never sees it.
- name: valid_until
  side: factory
  factory:
  - where: model-route
    as: field
    meaning: UTC time `YYYY-MM-DDTHH:MM:SSZ` after which a decision whose call has not started is expired. An expired decision cannot be executed and is not rewritten.
- name: validate_by
  side: engine
  engine:
    definition: How to find out whether a mechanism delivered what was expected of it.
    part: knowledge
    zh: 验证方法
- name: validation_data
  side: factory
  factory:
  - where: research-brief.input_bindings.role
    as: value
  - where: client-upload.resource_type
    as: value
- name: validation_resource_ref
  side: factory
  factory:
  - where: hypothesis-blueprint
    as: field
    meaning: The fixed validation data, copied from the `validation_resource` input. The CC may not invent, fetch or swap data.
- name: value
  side: both
  engine:
    definition: The content of a field. May be written bare, or as an object carrying unit, status and source.
    part: meta
    zh: 值
  factory:
  - where: capsule-declaration.needs.when.check
    as: field
  - where: research-brief.target_metrics.comparison
    as: field
  - where: type MetricSide
    as: field
    meaning: The registered aggregate of `repeats`, in the metric unit. Null when the side is unmeasured, and then `unmeasured_reason` says why. Null is not zero
      and not a failure verdict.
  verdict: same
- name: value_conflict
  side: engine
  engine:
    definition: 'Checker result: two statements of the same standing disagree, or one requirement has several undecided values.'
    part: meta
    zh: 数值冲突
- name: variants
  side: engine
  engine:
    definition: The different ways engines implement one mechanism family. Each has the condition under which it is chosen and a spec fragment to merge.
    part: knowledge
    zh: 做法（变体）
- name: vendor_stated
  side: engine
  engine:
    definition: Stated officially by the maker of the hardware or the publisher of the model.
    part: meta
    zh: 厂商声明
- name: venv_path
  side: factory
  factory:
  - where: provisioning-receipt
    as: field
    meaning: Where the environment lives.
- name: verdict
  side: factory
  factory:
  - where: gate-decision
    as: field
  - where: verifier-assessment
    as: field
  - where: type DeliveryFile.role
    as: value
  - where: type BundleGateDecision
    as: field
    meaning: Gate verdict, copied verbatim.
- name: verdict_counts
  side: factory
  factory:
  - where: capsule-scorecard
    as: field
    meaning: Gate verdicts of the executions that reached the gate.
- name: verdict_ref
  side: factory
  factory:
  - where: delivery-manifest
    as: field
    meaning: Saved verdict this delivery reports. Copied from the `evaluation_verdict` input. The report agrees with that verdict and never changes it.
- name: verification
  side: engine
  engine:
    definition: 'How a component can be checked on its own: by what method, against what reference, and which invariants the check covers.'
    part: component
    zh: 单独验证
- name: verification_plan
  side: factory
  factory:
  - where: hypothesis-blueprint
    as: field
    meaning: Ordered, checkable steps that show the experiment was fair and complete. Written by the CC for human and verifier review (`scope_bounded`). No rule or
      gate reads it as a number.
- name: verifier
  side: factory
  factory:
  - where: model-call.call_function
    as: value
  - where: rsi-opportunity.attribution
    as: value
- name: verifier_assessment_ref
  side: factory
  factory:
  - where: invocation-observation
    as: field
    meaning: Verifier assessment of this invocation's output.
- name: verifier_cc_ref
  side: factory
  factory:
  - where: evaluation-profile
    as: field
    meaning: Verifier version every verifier subnode must bind.
- name: verifier_owner
  side: factory
  factory:
  - where: check-bundle.owner_role
    as: value
  - where: checking-profile.owner_role
    as: value
- name: verifier_reserved
  side: factory
  factory:
  - where: type RoutingBudgetSnapshot
    as: field
    meaning: Reserved independent checking; no borrowing
- name: verifies
  side: engine
  engine:
    definition: The contract requirements a piece of evidence speaks to.
    part: knowledge
    zh: 支持的要求
- name: version
  side: factory
  factory:
  - where: capsule-declaration.identity.remote
    as: field
  - where: subnode-execution-contract.inputs
    as: field
  - where: subnode-execution-contract.outputs
    as: field
  - where: type BoundNodeInput
    as: field
    meaning: Supported contract version
  - where: type BoundNodeOutput
    as: field
    meaning: Supported contract version
  - where: type Dependency
    as: field
    meaning: One exact version. No range, wildcard, URL or marker. In `requirements.txt` the line is `name==version`.
  - where: check-bundle
    as: field
    meaning: Bundle version. A change needs a new version.
  - where: checking-profile
    as: field
    meaning: Profile version.
- name: version_label
  side: factory
  factory:
  - where: capsule-declaration.identity
    as: field
    meaning: 'Implementation label, a display value only: it never identifies content (the exact identity is `declaration_sha256`, see the hashing profile). A changed
      body needs a new label. The workbench packager sets it for an RSI child.'
- name: violation_refs
  side: factory
  factory:
  - where: security-clearance
    as: field
    meaning: Protected incident evidence.
- name: violations
  side: factory
  factory:
  - where: rsi-attempt
    as: field
    meaning: Violations the mutation check observed, as short descriptions. The mutation check writes them, never the proposer. A non-empty list ends the session
      at this attempt.
  - where: rsi-referee-evidence
    as: field
    meaning: Protected security results.
  - where: rsi-evidence-export
    as: field
    meaning: Allowed security outcomes.
- name: visible_evidence_refs
  side: factory
  factory:
  - where: rsi-attempt
    as: field
    meaning: Visible test results the proposer saw.
- name: wall_s
  side: factory
  factory:
  - where: capsule-declaration.budget.per_call
    as: field
  - where: capsule-declaration.budget.enforcement
    as: value
  - where: type RsiSessionLimits
    as: field
    meaning: Wall time for the whole search, in seconds.
- name: wall_s_limit
  side: factory
  factory:
  - where: type ProvisioningLimits
    as: field
    meaning: Install time limit, in seconds.
- name: wall_s_used
  side: factory
  factory:
  - where: type ProvisioningLimits
    as: field
    meaning: Install time actually used, in seconds.
- name: wall_time_s
  side: factory
  factory:
  - where: type RunRecord
    as: field
    meaning: Elapsed wall-clock time of the run, in seconds.
- name: warmup_batches
  side: factory
  factory:
  - where: type RSIScore
    as: field
    meaning: Warm-up batches run before timing. Fixed at 5.
  - where: type RsiQualificationPolicy
    as: field
    meaning: Warm-up batches the referee runs before timing.
  - where: type TimingComparison
    as: field
    meaning: Warm-up batches before timing.
- name: weight
  side: engine
  engine:
    definition: 'Data that does not change while the model runs: parameters and lookup tables.'
    part: given
    zh: 权重
- name: weight_loader
  side: engine
  engine:
    definition: 'Role: turns stored tensors into the engine''s in-memory form. Where one component also reads the files and serves the data, choose the role that
      matches its responsibility sentence.'
    part: component
    zh: 权重装载
- name: weights
  side: engine
  engine:
    definition: 'Content of a flow: model weights or table rows.'
    part: component
    zh: 权重
- name: when
  side: both
  engine:
    definition: 'The condition under which an assignment applies, from a fixed set: a ready copy in a pool, a transient fetch, held by another unit, or ranked low
      everywhere in the window.'
    part: engine
    zh: 生效条件
  factory:
  - where: capsule-declaration.needs
    as: field
    meaning: Preconditions as predicates.
  - where: capsule-declaration.guarantees.failure_modes
    as: field
  verdict: same
- name: why
  side: engine
  engine:
    definition: 'Why a component was not carried over: does_not_apply or postponed.'
    part: meta
    zh: 未带入的原因类别
- name: window
  side: factory
  factory:
  - where: capsule-declaration.guarantees.quality
    as: field
- name: wiring
  side: factory
  factory:
  - where: capsule-declaration
    as: field
    meaning: Port connections of a composite.
- name: work
  side: engine
  engine:
    definition: 'How much an operation actually has to process in a given step: how many tokens, rows or objects.'
    part: given
    zh: 工作量
    not: Not the size of the data. The same expert may process 2 tokens in one chunk and 400 in the next.
- name: worker
  side: factory
  factory:
  - where: model-call.call_function
    as: value
- name: workflow_id
  side: factory
  factory:
  - where: route-request
    as: field
    meaning: Explicit local correlation, not assumed equal to run_id
- name: workflow_stage
  side: factory
  factory:
  - where: route-request
    as: field
    meaning: Fixed research stage name, or the verifier assignment. Envelope metadata, not a declaration field
- name: workload
  side: engine
  engine:
    definition: 'The fixed pattern of use on which requirements are judged: what is asked, how long, how many at once.'
    part: engine
    zh: 负载
- name: workload_profile
  side: engine
  engine:
    definition: Data about a model or engine gathered from a workload, with its source and status. It can satisfy a mechanism's precondition or seed a policy.
    part: knowledge
    zh: 负载画像
    example: How unevenly a model's experts are used on coding prompts.
- name: workspace
  side: factory
  factory:
  - where: type ResourceItem.kind
    as: value
- name: workspace_id
  side: factory
  factory:
  - where: client-submission
    as: field
    meaning: 'Scope of the run: the workspace whose uploaded inputs intake may read. The control plane checks that the session token is authorized for it, and rejects
      the submission otherwise.'
- name: workspace_ref
  side: factory
  factory:
  - where: qualified-intake
    as: field
    meaning: Workspace the run may write to.
- name: write
  side: factory
  factory:
  - where: capsule-declaration.needs.resources.mode
    as: value
  - where: type ResourceNeed.mode
    as: value
- name: write_roots
  side: factory
  factory:
  - where: subnode-execution-contract.bindings.effective_authority
    as: field
  - where: type AuthorityCeiling
    as: field
    meaning: Maximum paths the node may write under. A ceiling, never a grant.
- name: writes
  side: engine
  engine:
    definition: 'X writes Y: X produces or changes the content of Y. Used for an operation and its data, and for a component and a state it does not own. Every written
      state must have an owner.'
    part: given
    zh: 写入
- name: written_before_body
  side: factory
  factory:
  - where: capsule-declaration.guarantees.checks
    as: field
- name: zip
  side: factory
  factory:
  - where: poc-artifact-bundle.archive_format
    as: value
