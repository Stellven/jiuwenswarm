  - where: type NodeDispatchTime
    as: field
    meaning: Dispatch start.
  - where: invocation-observation
    as: field
    meaning: Observed start.
  - where: model-call
    as: field
    meaning: When the call started, as observed by the bridge. UTC, to the second.
  - where: dispatch-record
    as: field
    meaning: Dispatch start time, set by the scheduler. UTC, to the second.
