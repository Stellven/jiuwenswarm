  - where: client-error
    as: field
    meaning: Request this error answers, when known. Null otherwise.
  - where: route-request
    as: field
    meaning: Immutable request identity
- name: request_ref
  side: factory
  factory:
  - where: intent-ir
    as: field
  - where: qualified-intake
    as: field
    meaning: Exact original request text. The Intent CC cites spans in these bytes.
  - where: model-route
    as: field
    meaning: Exact request identity
- name: requested
  side: factory
  factory:
  - where: type ModelIdentity
    as: field
    meaning: Model ID the call asked for. It equals the route record `model_id`.
- name: requested_result
  side: factory
  factory:
  - where: intent-ir.interpretation
    as: field
- name: required
  side: both
  engine:
    definition: 'Resolution of a field: fixed by the requester. The factory must satisfy it and may not change it.'
    part: meta
    zh: 要求
    not: Not the flag on a mechanism precondition; that is essential.
  factory:
  - where: common.Port
    as: field
  - where: subnode-execution-contract.inputs
    as: field
  - where: subnode-execution-contract.outputs
    as: field
  - where: type PlanInput
    as: field
    meaning: Whether the node needs this input. Copied from the library port. The Planner cannot mark a required library port optional.
  - where: type PlanOutput
    as: field
    meaning: Whether the node must produce this output.
  - where: type BoundNodeInput
    as: field
    meaning: True means the node is not dispatched without a bound ref for this port.
  - where: type BoundNodeOutput
    as: field
    meaning: True means the node gate does not release the node without this output.
  - where: type NodeSubnodeAssignment
    as: field
    meaning: True means node completion needs this subnode.
  - where: type PortSpec
    as: field
    meaning: True when the CC cannot run without this input, or must produce this output.
  verdict: minor
  difference: 'Ours is a value of `resolution`: the requester fixed this field.'
- name: required_correction
  side: factory
  factory:
  - where: verifier-assessment
    as: field
- name: required_outputs
  side: factory
  factory:
