    meaning: Limits of this result, for example synthetic data or unavailable telemetry. For the reader. They do not change `outcome`.
- name: limits
  side: factory
  factory:
  - where: subnode-execution-contract.bindings
    as: field
  - where: type PlanNode
    as: field
    meaning: Time, model-call and memory ceiling for one attempt of this node, in the units of the shared Limits type. The Planner proposes it. The library `max_limits`
      of the chosen CC cap it.
  - where: type RunPlanNode
    as: field
    meaning: 'Time, model-call and memory ceiling for one attempt of this node: `time_s` in seconds, `model_calls` as a count, `memory_mb` in MiB. The scheduler copies
      them into the node contract `node_limits`.'
  - where: rsi-target-profile
    as: field
    meaning: 'Frozen bounds for every child run: `time_s` in seconds, `model_calls` as a count, `memory_mb` in MiB. Every value must be above zero here, stricter
      than the shared `Limits` type, because a child run with a zero bound cannot run. The target owner sets them. A candidate cannot change them.'
  - where: model-route
    as: field
    meaning: CC execution ceilings; separate routing overhead
  - where: provisioning-receipt
    as: field
    meaning: Install time limit and time used.
  - where: plan-proposal
    as: field
    meaning: 'Aggregate ceiling for the whole plan. Constraint: time and calls at least the sum of node limits, memory at least the largest node limit, all at most
      the policy aggregate limits.'
  - where: static-template
    as: field
    meaning: 'Aggregate ceiling for the whole plan: `time_s` in seconds, `model_calls` as a count, `memory_mb` in MiB. The binder rejects limits above the plan policy
      `aggregate_limits` (`budget_ceilings`).'
  - where: run-plan
    as: field
    meaning: 'Aggregate ceiling for the whole plan. Constraint: same rule as a plan proposal.'
  - where: rsi-session
    as: field
    meaning: Search budget of the session. The proposer sees these limits and nothing else of this record.
- name: lineage
  side: factory
  factory:
  - where: capsule-declaration.identity
    as: field
    meaning: Parent version and how this version was built. For an RSI child the workbench packager writes it once, and the RSI proposer never writes it.
- name: linked_attempt_id
  side: factory
  factory:
  - where: plan-outcome
    as: field
    meaning: ID of the new Intention Compiler attempt that the host started from this outcome.
- name: live_plans
  side: factory
  factory:
  - where: activation-record.effect_scope
    as: value
- name: load_mode
  side: factory
  factory:
  - where: capsule-declaration.identity
    as: field
    meaning: How the runner loads the CC.
- name: local_document_refs
  side: factory
  factory:
  - where: search-scope
    as: field
    meaning: The user's local documents Search may read. Refs set by the binder. Empty when `local_documents` is not a connector.
- name: local_documents
  side: factory
  factory:
  - where: type Citation.connector
    as: value
  - where: type ConnectorOutcome.connector
    as: value
- name: locator
  side: factory
  factory:
  - where: type Citation
    as: field
    meaning: Human-readable origin and position, for example a URL or file name plus a sentence number. Display only. The `source_ref` is the exact identity.
- name: locked_version
  side: factory
  factory:
  - where: type InstalledPackage
    as: field
    meaning: Version the lock pins.
- name: lockfile
  side: factory
  factory:
  - where: capsule-declaration.needs.external
    as: field
- name: loss_units
  side: factory
  factory:
  - where: type QualificationStatistics
    as: field
    meaning: Units the parent passed and the child failed (l). Any value above 0 is a protected regression.
- name: low
  side: factory
  factory:
  - where: common.Effect.risk.severity
    as: value
- name: lower_better
  side: factory
  factory:
  - where: type MetricDeclaration.direction
    as: value
- name: lt
  side: factory
  factory:
  - where: research-brief.constraints.operator
    as: value
  - where: research-brief.target_metrics.comparison.comparator
    as: value
  - where: type ComparisonRule.comparator
    as: value
- name: m1_conjunctive_v1
  side: factory
  factory:
  - where: evaluation-verdict.aggregation_rule
    as: value
- name: main_source
  side: engine
  engine:
    definition: 'Marks an existing engine as the main source of a derivation: every one of its leaf components must be either carried over or listed as not carried.'
    part: meta
    zh: 主要来源
- name: manages
  side: engine
  engine:
    definition: 'In composition: the residency entries of the binding a component is responsible for on this target.'
    part: engine
    zh: 负责的驻留项
- name: mandatory_checks
  side: factory
  factory:
  - where: node-execution-contract.evidence_obligations
    as: value
- name: mandatory_deterministic
  side: factory
  factory:
  - where: bound-check-plan
    as: field
    meaning: 'Check IDs that must each appear once in the deterministic result: every blocking check of the pinned bundle, plus contract, profile and policy checks,
      plus adopted `extra_check_ids`.'
  - where: node-finalization-profile
    as: field
    meaning: Node check IDs that must each pass once before the node gate decision. M1 lists `internal_acceptance`, `external_output` and `aggregate_limits`.
- name: mandatory_parent_tests_passed
  side: factory
  factory:
  - where: rsi-referee-evidence
    as: field
    meaning: Whether the child passed every mandatory parent test.
- name: mandatory_requirements
  side: factory
  factory:
  - where: research-brief
    as: field
- name: mandatory_semantic
  side: factory
  factory:
  - where: bound-check-plan
    as: field
    meaning: Criterion IDs every verifier assessment must cover once. Empty for a static plan gate, where no verifier runs.
- name: manifest_ref
  side: factory
  factory:
  - where: build-receipt
    as: field
    meaning: The manifest this receipt covers. The host writes the receipt, never the worker.
- name: match_terms
  side: factory
  factory:
  - where: type ForbiddenDependency
    as: field
    meaning: Lowercase phrases that always trigger the flag. The host lowercases idea `title`, `summary`, `assumptions` and `risks` and flags the idea when any phrase
      occurs as a plain substring. No word boundaries, stemming or model judgment. The model does not decide matches.
- name: matched
  side: factory
  factory:
  - where: type ConformanceItem.status
    as: value
- name: max
  side: factory
  factory:
  - where: type BenchmarkMetric.aggregation
    as: value
  - where: type MetricDeclaration.aggregation
    as: value
- name: max_age_s
  side: factory
  factory:
  - where: capsule-declaration.needs.when
    as: field
- name: max_attempts
  side: factory
  factory:
  - where: type RunPlanNode
    as: field
    meaning: Attempts the scheduler may start for this node. Each attempt is a new dispatch record. M1 allows no automatic repair, so the value is 1.
  - where: type RsiSessionLimits
    as: field
    meaning: Proposal attempts in the session, including malformed proposals and visible-test rejects.
- name: max_attempts_per_node
  side: factory
  factory:
  - where: plan-policy
    as: field
    meaning: Ceiling for `max_attempts` of any node, as a count of attempts. The M1 value is 1.
- name: max_hits_per_query
  side: factory
  factory:
  - where: search-scope
    as: field
    meaning: Most distinct sources one external connector may contribute per query. A count. A hard bound set by the binder (`hit_limit`).
- name: max_limits
  side: factory
  factory:
  - where: type LibraryEntry
    as: field
    meaning: 'Per-node ceiling, copied by the protected library and never taken from a plan. `time_s` is in seconds and is the declaration budget `wall_s`. `model_calls`
      is a count: the budget `invocations` when the declaration injects the model bridge, otherwise 0. `memory_mb` is in MiB and comes from the admission record,
      because a declaration carries no memory budget. A node may ask for less, never more.'
- name: max_no_progress
  side: factory
  factory:
  - where: type RsiSessionLimits
    as: field
    meaning: Consecutive attempts without a stronger selection tuple. Search stops when this many pass.
- name: max_nodes
  side: factory
  factory:
  - where: plan-policy
    as: field
    meaning: Most nodes a plan may hold, as a count. It counts the nodes of the plan only, not the pre-plan Intention Compiler and Planner nodes.
- name: max_patch_files
  side: factory
  factory:
  - where: type ImplementationScope
    as: field
    meaning: Largest number of files the patch may touch. M1 allows one patch file.
- name: max_queries
  side: factory
  factory:
  - where: search-scope
    as: field
    meaning: Most queries Search may write and run. A count. A hard bound set by the binder. Search may use fewer.
- name: may_change
  side: factory
  factory:
  - where: capsule-declaration.evolution
    as: field
    meaning: The only parts an RSI child may change. Missing or empty means RSI may change nothing, whatever `evolution.rsi` says.
- name: mcp
  side: factory
  factory:
  - where: capsule-declaration.identity.kind
    as: value
- name: mean
  side: factory
  factory:
  - where: type BenchmarkMetric.aggregation
    as: value
  - where: type MetricDeclaration.aggregation
    as: value
- name: mean_declaration_coverage
  side: factory
  factory:
  - where: capsule-scorecard
    as: field
    meaning: Mean `coverage` of the scored conformance records.
- name: measure
  side: engine
  engine:
    definition: How to obtain the measurement a precondition is waiting for.
    part: knowledge
    zh: 测量方法
- name: measured
  side: engine
  engine:
    definition: Observed by us in an experiment whose conditions were recorded.
    part: meta
    zh: 实测
- name: measured_under
  side: engine
  engine:
    definition: The model, hardware, environment and measurement definitions in force when evidence was taken.
    part: knowledge
    zh: 测量条件
- name: measurement
  side: both
  engine:
    definition: 'Verification method: a timing or memory measurement of the component.'
    part: component
    zh: 测量
  factory:
  - where: type MetricDeclaration
    as: field
    meaning: Deterministic definition of how one repeat value is extracted. Text written by the CC before any run. It uses no judgement by a model. Benchmark measures
      as it says.
  verdict: same
- name: measurement_status
  side: factory
  factory:
  - where: invocation-observation
    as: field
    meaning: Whether the time, call and outcome values were measured.
- name: mechanism
  side: both
  engine:
    definition: 'A way of making an engine more efficient, written as a checkable optimization hypothesis: under these preconditions, doing this is expected to improve
      that, at this cost, and must uphold these rules. One file per mechanism family.'
    part: knowledge
    zh: 机制族
    not: Not a fact and not an instruction. It becomes a candidate only when its preconditions hold for the given model and hardware. Not the factory's research hypothesis;
      see the factory vocabulary table.
  factory:
  - where: hypothesis-blueprint
    as: field
    meaning: The causal reason the intervention should work. Explanation for readers and the verifier. No check or rule reads it as a number.
  verdict: minor
  difference: 'Ours is a file kind: a reusable, checkable way of making an engine efficient. Related idea, different object.'
- name: mechanisms
  side: engine
  engine:
    definition: The mechanisms a system or component implements, or that a resolved engine spec adopted. Each entry is the id of an existing mechanism file (mech/...);
      a mechanism with no file yet goes under `uncatalogued_mechanisms`.
    part: component
    zh: 用到的机制族
- name: media_type
  side: factory
  factory:
  - where: type NamedFile
    as: field
    meaning: Format of the file, readable or binary, for example `text/plain`.
  - where: type DeliveryFile
    as: field
    meaning: Format of the file, from the fixed list. The Delivery CC picks the type that matches the file bytes. No role-to-type mapping is enforced in M1. Readers
      use it to display the file, never to decide trust.
  - where: artifact-envelope
    as: field
    meaning: Readable descriptive format of the body, for example `text/plain`. It does not prove the body matches `contract_id`.
- name: median
  side: factory
  factory:
  - where: type BenchmarkMetric.aggregation
    as: value
  - where: type MetricDeclaration.aggregation
    as: value
- name: median_attempts
  side: factory
  factory:
  - where: capsule-scorecard
    as: field
    meaning: 'Median, over this CC''s node executions in the window, of the attempt count per node execution (1 means first attempt). Null when the window has no
      execution. Off the hot path: no gate reads it.'
- name: median_duration_s
  side: factory
  factory:
  - where: capsule-scorecard
    as: field
    meaning: Typical duration of one execution, in seconds. Null means no execution has a measured duration, and null is not 0.
- name: median_of_n
  side: engine
  engine:
    definition: The median of several runs.
    part: knowledge
    zh: 多次中位数
- name: median_total_tokens
  side: factory
  factory:
  - where: capsule-scorecard
    as: field
    meaning: Typical token use of one execution, as a count of input plus output tokens. Null means no execution has token counts, and null is not 0.
- name: members
  side: factory
  factory:
  - where: capsule-declaration
    as: field
    meaning: Pinned member CCs of a composite. See [composition](#composition-reserved).
- name: memory_budget
  side: engine
  engine:
    definition: The upper limit of memory the engine may use in a named pool, under a named accounting boundary. A requirement.
    part: inference
    zh: 内存预算
    not: Not capacity (what the machine has) and not peak memory (what the engine used).
- name: memory_governor
  side: engine
  engine:
    definition: 'Role: adjusts memory use while the engine runs, for example by releasing or reclaiming.'
    part: component
    zh: 运行时内存管理
- name: memory_mb
  side: factory
  factory:
  - where: subnode-execution-contract.bindings.limits
    as: field
  - where: subnode-execution-contract.subnode_limits
    as: field
  - where: type Limits
    as: field
    meaning: Memory cap in mebibytes (1 MiB = 1,048,576 bytes), the unit Docker memory limits use. Positive.
  - where: type RoutingBudgetBalance
    as: field
    meaning: Positive effective resource ceiling; not additive spend
  - where: library-admission
    as: field
    meaning: Memory ceiling in MiB for one node attempt of this CC version. The person who runs the admission command sets it, because a declaration carries no memory
      budget. It must not exceed the plan policy `aggregate_limits.memory_mb`. An RSI child copies its parent value. The library snapshot copies it into `max_limits.memory_mb`.
- name: memory_planner
  side: engine
  engine:
    definition: 'Role: decides when the engine starts how much of each memory pool each consumer gets, for the machine actually present. It typically owns nothing
      and is recognised by the plan flows it sends.'
    part: component
    zh: 内存规划
- name: memory_pool
  side: engine
  engine:
    definition: A storage space with one capacity limit. Two things share a pool if using more of one leaves less for the other.
    part: given
    zh: 内存池
    not: Not a device. A unified-memory machine has one pool for CPU and GPU; a discrete-GPU machine has two.
    example: 'DGX Spark: mem0 (unified) and ssd0. A PC: vram, ram and ssd0.'
- name: message
  side: factory
  factory:
  - where: common.Reason
    as: field
  - where: client-error
    as: field
    meaning: Actionable explanation for the user. Display only. Never holds credentials or hidden fixtures.
- name: metric
  side: factory
  factory:
  - where: capsule-declaration.guarantees.evals
    as: field
  - where: intent-ir.user_targets
    as: field
  - where: research-brief.target_metrics
    as: field
- name: metric_id
  side: factory
  factory:
  - where: type BenchmarkMetric
    as: field
    meaning: The registered metric.
  - where: type MetricVerdictFinding
    as: field
    meaning: The metric judged. Copied from the blueprint as the exact string.
  - where: type MetricDeclaration
    as: field
    meaning: Name used everywhere downstream. The CC chooses it. `outcome_rules`, `dependent_variables`, Benchmark values and verdict findings all refer to it by
      this exact string.
  - where: type OutcomeRule
    as: field
    meaning: The metric the rule decides.
- name: metric_not_emitted
  side: factory
  factory:
  - where: type MetricSide.unmeasured_reason
    as: value
- name: metrics
  side: both
  engine:
    definition: 'Content of a flow: measurements made available outside the engine.'
    part: component
    zh: 度量
  factory:
  - where: type EmpiricalRun
    as: field
    meaning: The values the run printed in the output log format, as a map of `metric_id` to number. A run that printed no valid line has no entry, and the payload
      records `metric_not_emitted`. Values are never estimated or filled.
  - where: benchmark-payload
    as: field
    meaning: Every registered measurement.
  - where: hypothesis-blueprint
    as: field
    meaning: 'Declares every metric once: what it is, how it is measured, and which way is better. The CC writes it before any run. Benchmark and Evaluation read
      it and cannot change it.'
  verdict: same
- name: metrics_key_found
  side: factory
  factory:
  - where: type OutputFormatCheck
    as: field
    meaning: True when the argument of that call is a dict display with the string key `metrics`.
- name: middle
  side: factory
  factory:
  - where: type MetricVerdictFinding.rule_applied
    as: value
  - where: type OutcomeRule
    as: field
    meaning: Classification for results in neither region. `INCONCLUSIVE` is the PRD default. Choose `CONDITIONALLY_ACCEPTABLE` only together with a `conditional_rule`.
- name: migrated_from
  side: factory
  factory:
  - where: capsule-declaration.identity.lineage.relation
    as: value
- name: min
  side: factory
  factory:
  - where: type BenchmarkMetric.aggregation
    as: value
  - where: type MetricDeclaration.aggregation
    as: value
- name: min_context
  side: factory
  factory:
  - where: capsule-declaration.needs.model
    as: field
  - where: type RoutingRequirements
    as: field
    meaning: Minimum context window the model must offer, in tokens, in addition to the default floor. Optional. Absent means no extra requirement.
- name: min_observations
  side: factory
  factory:
  - where: capsule-declaration.guarantees.quality
    as: field
- name: min_pass_rate_gain
  side: factory
  factory:
  - where: type RsiQualificationPolicy
    as: field
    meaning: Smallest absolute final pass-rate gain that can qualify a child with more passes, as a fraction of fixture units (0.05 means 5 points).
- name: min_quantity
  side: factory
  factory:
  - where: type ResourceNeed
    as: field
    meaning: Smallest quantity needed (for example one GPU). Null when the resource is not countable.
- name: min_relative_gain
  side: factory
  factory:
  - where: type RSIScore
    as: field
    meaning: Smallest relative timing gain, as a fraction, that can qualify a child on timing. Frozen.
  - where: type TimingComparison
    as: field
    meaning: Smallest qualifying relative gain.
- name: min_timing_gain
  side: factory
  factory:
  - where: type RsiQualificationPolicy
    as: field
    meaning: Smallest relative timing gain that can qualify a child with equal passes, as a fraction (0.1 means 10 percent faster).
- name: mismatched
  side: factory
  factory:
  - where: type ConformanceItem.status
    as: value
- name: missing
  side: factory
  factory:
  - where: common.Uncertainty.kind
    as: value
  - where: route-record.router_failure
    as: value
- name: missing_evidence
  side: factory
  factory:
  - where: run-bundle
    as: field
    meaning: Items not produced or unavailable, with reasons.
  - where: delivery-manifest
    as: field
    meaning: Omissions and redactions. Lists each artifact that is unavailable or withheld, with a reason and a `blocking` flag. An empty list means nothing is missing.
      A `blocking` item halts the Delivery node and blocks release.
- name: missing_metric_ids
  side: factory
  factory:
  - where: type OutputFormatCheck
    as: field
    meaning: Blueprint `metric_id` values that appear nowhere as a string constant in the file.
- name: modalities
  side: factory
  factory:
  - where: capsule-declaration.needs.model
    as: field
  - where: type RoutingRequirements
    as: field
    meaning: Additional required modalities (optional)
  - where: rsi-completion-report
    as: field
    meaning: Modalities the sessions covered. `text` appears only when the bounded headless text path ran.
- name: mode
  side: factory
  factory:
  - where: capsule-declaration.needs.network
    as: field
  - where: capsule-declaration.needs.resources
    as: field
  - where: type ResourceNeed
    as: field
    meaning: How the CC uses the resource. `exclusive` means no other node may use it during the attempt, for example one GPU.
- name: model
  side: both
  engine:
    definition: 'The description of the computation to be run: its operations and the data they read and write.'
    part: given
    zh: 模型描述
    not: Not the weight files themselves and not the engine. It says what must be computed, not how.
  factory:
  - where: capsule-declaration.needs
    as: field
    meaning: What the model must support. It never names a model.
  - where: type ResourceItem.kind
    as: value
  verdict: decide
  difference: Ours is the model being served by the engine. The factory's is the model a CC runs on.
- name: model_allowlist
  side: factory
  factory:
  - where: type RoutingRequirements
    as: field
    meaning: Optional narrowing; explicit empty list denies all (optional)
- name: model_call_limit
  side: factory
  factory:
  - where: checking-profile
    as: field
    meaning: Most verifier model calls per review. M1 uses 1.
- name: model_call_refs
  side: factory
  factory:
  - where: run-bundle
    as: field
    meaning: Model-call records of the run.
- name: model_calls
  side: factory
  factory:
  - where: subnode-execution-contract.bindings.limits
    as: field
  - where: subnode-execution-contract.subnode_limits
    as: field
  - where: type Limits
    as: field
    meaning: Cap on model calls. 0 or more. 0 allows no model call.
  - where: type SelectionAllowance
    as: field
    meaning: Zero when disabled; at most one when enabled
  - where: type RoutingBudgetBalance
    as: field
    meaning: Nonnegative available/reserved model calls
  - where: invocation-observation
    as: field
    meaning: Observed model calls of the CC.
  - where: rsi-attempt
    as: field
    meaning: Observed proposal model calls, as a count. Null means unavailable, and null is never zero.
- name: model_calls_used
  side: factory
  factory:
  - where: dispatch-record
    as: field
    meaning: Count of model calls the work subnode made through the model bridge during the attempt, set by the scheduler from bridge records. Verifier calls are
      counted on their own verifier subnode. M1 makes no routing selection call (`bounded_llm_ablation` is not built). Null means unobserved, never zero.
- name: model_checkpoint
  side: engine
  engine:
    definition: Which published set of model weights the engine uses.
    part: engine
    zh: 模型 checkpoint
    not: Not a state checkpoint. See checkpoint.
- name: model_files
  side: engine
  engine:
    definition: 'End of a flow: the model''s files on storage, including files prepared offline.'
    part: component
    zh: 模型文件
- name: model_id
  side: factory
  factory:
  - where: type ModelExclusion
    as: field
    meaning: Excluded deployment
  - where: route-record
    as: field
    meaning: The one model fixed for this whole call. It never changes after the call starts.
- name: model_identity
  side: factory
  factory:
  - where: invocation-observation
    as: field
    meaning: Requested and effective model, and how the effective one was known.
- name: model_preparer
  side: engine
  engine:
    definition: 'Role: produces model files before the engine runs, such as re-quantized or re-laid-out weights.'
    part: component
    zh: 离线模型准备
- name: model_route
  side: factory
  factory:
  - where: evaluation-profile
    as: field
    meaning: Route kept apart from the model identifier.
- name: model_selection_profile_ref
  side: factory
  factory:
  - where: route-request
    as: field
    meaning: Protected immutable profile alongside the binding
  - where: model-route
    as: field
    meaning: Selection policy, distinct from checking profile
  - where: model-call
    as: field
    meaning: Protected call authorization
- name: model_state
  side: engine
  engine:
    definition: Data that changes as tokens are generated and must be carried from one step to the next.
    part: given
    zh: 模型状态
    not: Not the engine's own bookkeeping such as cache heat; that is engine state and is declared in the engine spec.
    example: Attention keys and values; recurrent state.
- name: must
  side: engine
  engine:
    definition: 'Strength of a rule of a node type: kept by every engine examined, in every mode whose output is meant to be used.'
    part: component
    zh: 必须
- name: must_not_change
  side: factory
  factory:
  - where: type ImplementationScope
    as: field
    meaning: What stays immutable. The Builder must not touch these. The CC may add items but may not remove the four required ones.
- name: mutable_paths
  side: factory
  factory:
  - where: rsi-target-profile
    as: field
    meaning: The only body paths the proposer may change. The target owner sets them inside what the CC author allowed in `may_change`, never the RSI operator or
      the proposer. A touched path outside this list is a security violation.
- name: mutable_paths_touched
  side: factory
  factory:
  - where: candidate-package
    as: field
    meaning: Body paths the change touched. The packager derives them from the diff. Admission checks each against the target profile `mutable_paths`, and a path
      outside it is a security halt.
- name: name
  side: factory
  factory:
