      and `planner` nodes.
  - where: type GateDecisionEntry
    as: field
    meaning: The node whose attempt was accepted. A node ID of the frozen run plan.
  - where: type BundleGateDecision
    as: field
    meaning: Node the decision belongs to.
  - where: type NodeDispatchTime
    as: field
    meaning: Node dispatched.
  - where: type ExportEntry
    as: field
    meaning: Node of the execution.
  - where: type NodeStatus
    as: field
    meaning: Node of the run plan, or `intention_compiler` or `planner` before the plan exists
  - where: artifact-envelope
    as: field
    meaning: Trusted node scope. The trusted runner attaches it. A mismatch blocks.
  - where: invocation-observation
    as: field
    meaning: Node the invocation belongs to.
  - where: accepted-output
    as: field
    meaning: Node scope
  - where: node-execution-contract
    as: field
    meaning: Node this contract governs.
  - where: route-record
    as: field
    meaning: Protected node ID, copied by the bridge from the runtime identities. Attribution only.
  - where: dispatch-record
    as: field
    meaning: Node dispatched.
  - where: contract-conformance
    as: field
    meaning: Node of the execution.
