    as: value
  - where: client-submission.plan_source
    as: value
  - where: operator-config.cc.plan_source
    as: value
  - where: static-template.plan_source
    as: value
  - where: run-plan.plan_source
    as: value
  - where: evaluation-profile.plan_source
    as: value
