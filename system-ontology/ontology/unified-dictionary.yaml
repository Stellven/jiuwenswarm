  - where: rsi-attempt
    as: field
    meaning: 'Why the session ended at this attempt, in plain words for the human reviewer. Written by the RSI controller. Null while the session continues. Must
      be set when `violations` is not empty. No check parses it: the outcome comes from the structured fields.'
  - where: rsi-session-result
    as: field
    meaning: Why search stopped, in plain words, for the human reviewer. The outcome comes from `outcome`, not from this text.
