    part: engine
    zh: 阶段
    example: load, prefill, draft, verify, commit.
  factory:
  - where: client-status
    as: field
    meaning: The `node_id` of the node running now, or of the last node that finished; `intention_compiler` or `planner` before the plan exists. Display only. Per-node
      state is in `node_statuses`.
  verdict: minor
  difference: Ours is a request-level execution step of the engine (load, prefill, ...).
