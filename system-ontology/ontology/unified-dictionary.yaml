    as: field
    meaning: Counts and statistics the rule was applied to.
- name: status
  side: both
  engine:
    definition: 'How a fact is known: assumed, simulated, proposed, reported, vendor_stated or measured.'
    part: meta
    zh: 身份或可信度
    not: Not who fixes a field of a spec; that is resolution.
  factory:
  - where: intent-ir.readiness
    as: field
  - where: type Prerequisite
    as: field
    meaning: '`ready`, `unavailable` or `failed`. A mandatory prerequisite must be `ready` for the report `ready` to be true.'
  - where: type PrerequisiteReadiness
    as: field
    meaning: pass or deferred; unavailable/unknown mandatory checks block
  - where: type CompletenessReview
    as: field
    meaning: incomplete exactly when a metric side is unmeasured
  - where: type PlausibilityReview
    as: field
    meaning: implausible flags an execution anomaly
  - where: type ConnectorOutcome
    as: field
    meaning: '`used` means it answered. `unavailable` means it could not be reached or returned an error. Search records what happened and never hides a failure.
      A citation may come only from a `used` connector.'
  - where: type RsiRequirementStatus
    as: field
    meaning: Result against the criterion. `BLOCKED` and `INCOMPLETE` are never `PASS`.
  - where: type ConformanceItem
    as: field
    meaning: How the two compare.
  - where: run-bundle
    as: field
    meaning: Run state at export. `partial` is a finished run in which a node failed and its dependents were skipped (D49).
  - where: client-status
    as: field
    meaning: 'Run state, with the run bundle `status` values: `in_progress`, `completed`, `partial`, `halted`, `paused`. A cancelled run reports `halted` and its
      `reasons` say so. A client decides from this field, never from `reasons`.'
  - where: client-cancellation
    as: field
    meaning: 'Progress of the cancellation, set by the protected controller. `requested`: recorded, and no new node is dispatched from now on. `acknowledged`: the
      scheduler is containing the active work. `terminal`: no work is running and the run is `halted`.'
  - where: client-upload
    as: field
    meaning: Whether the bytes are still stored.
  - where: library-admission
    as: field
    meaning: Disposition.
  - where: provisioning-receipt
    as: field
    meaning: Outcome of the install. `failed` ends the node and no payload is produced.
  verdict: decide
  difference: Ours says how a fact is known (assumed, reported, measured). The factory's says what state something is in. Both are on almost every record of their
    side.
- name: stderr_ref
  side: factory
  factory:
  - where: type RunRecord
    as: field
    meaning: Captured standard error, kept as raw evidence. Metric values come from `empirical_results`, not from this file.
- name: stdout_ref
  side: factory
  factory:
  - where: type RunRecord
    as: field
    meaning: Captured standard output, kept as raw evidence. Metric values come from `empirical_results`, not from this file.
- name: stop_reason
  side: factory
