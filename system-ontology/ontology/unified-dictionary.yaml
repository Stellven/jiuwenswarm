- name: audience
  side: factory
  factory:
  - where: type NamedFile
    as: field
    meaning: One of `researcher` (the requesting user) or `reviewer` (the requesting user plus authorized reviewers), the same values as the Delivery file audience.
      Retrieval withholds the file from anyone outside it.
  - where: type DeliveryFile
    as: field
    meaning: Who may read it. `researcher` is the requesting user. `reviewer` adds authorized reviewers. Files for neither audience are not exported. The CC sets
      it as the contract allows and never widens it.
  - where: artifact-envelope
    as: field
    meaning: One of `researcher` (the requesting user) or `reviewer` (the requesting user plus authorized reviewers), the same values as the Delivery file audience.
      Export and retrieval filter by it. Never widen it.
  - where: client-retrieval
    as: field
    meaning: One of `researcher` (the requesting user) or `reviewer` (the requesting user plus authorized reviewers), the same values as the Delivery file audience.
      Content outside it is withheld and listed in `redactions`.
