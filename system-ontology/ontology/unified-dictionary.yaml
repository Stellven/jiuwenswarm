    as: field
    meaning: 'CCs that every plan holds, static or planned. Each named CC must have an eligible entry in the library snapshot the binder uses, or binding fails. Each
      runs in exactly one node. In M1: `research.search`, `research.screening` and `research.hypothesis`.'
- name: required_test_refs
  side: factory
  factory:
  - where: rsi-target-profile
    as: field
    meaning: Mandatory parent tests. The child must pass all of them.
- name: requirement
  side: factory
  factory:
  - where: type CoverageEntry.item_kind
    as: value
- name: requirement_coverage
  side: factory
  factory:
  - where: rsi-completion-report
    as: field
    meaning: Status of each RSI build criterion.
- name: requirement_id
  side: factory
  factory:
  - where: type RsiRequirementStatus
    as: field
    meaning: Requirement this row reports.
- name: requirement_ids
  side: factory
  factory:
  - where: research-brief.target_metrics
    as: field
  - where: research-brief.acceptance_expectations
    as: field
  - where: research-brief.evidence_obligations
    as: field
  - where: subnode-execution-contract
    as: field
  - where: type PlanNode
    as: field
    meaning: Mandatory Brief requirements this node helps satisfy. These are tags. `coverage` must mirror them exactly.
  - where: type RunPlanNode
    as: field
    meaning: Mandatory Brief requirements this node helps satisfy. An empty list is allowed when `deliverable_ids` is not empty. A static template may use one selector
      instead of IDs, and the binder replaces it with concrete IDs.
  - where: node-execution-contract
    as: field
    meaning: Obligations this node must cover.
- name: requirements
  side: both
  engine:
    definition: The individual conditions the engine is judged against.
    part: engine
    zh: 要求列表
  factory:
  - where: route-request
    as: field
    meaning: Narrowing hard constraints
  verdict: same
- name: requirements_ref
  side: factory
  factory:
  - where: environment-lock
    as: field
    meaning: Complete pinned declaration of direct and transitive packages. A file with only comments means no third-party package.
- name: requirements_txt
  side: factory
  factory:
  - where: poc-artifact-bundle
    as: field
    meaning: Content of the entry `requirements.txt`.
- name: RequirementStatement
  side: factory
  factory:
  - where: common
    as: field
- name: requires
  side: engine
  engine:
    definition: Mechanisms that must be adopted together with this one.
    part: knowledge
    zh: 依赖
    not: Not capabilities. What a component needs from its surroundings is requires_capabilities.
- name: requires_capabilities
  side: engine
  engine:
    definition: What the component needs its surroundings to provide, such as an instruction set or a device feature.
    part: component
    zh: 需要的能力
- name: research_run
  side: factory
  factory:
  - where: research-brief.constraints.scope
    as: value
- name: researcher
  side: factory
  factory:
  - where: type DeliveryFile.audience
    as: value
