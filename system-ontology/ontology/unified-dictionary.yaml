  side: engine
  engine:
    definition: 'A kind of engine part, described independently of any engine and any machine: its one job, what it takes and gives, the state it owns, the rules
      it guarantees and how far its work can change the output. A component of an engine is an instance of a node type. The node types are listed in `node-types.draft.yaml`.'
    part: component
    zh: 节点类型
    not: Not a CC of the factory. A CC reads node types; a node type never becomes one. Not a component either, which is one part of one engine.
    example: '`expert-cache`: hold as many selectively used weights in fast memory as the budget allows, and answer for any of them whether it is there.'
