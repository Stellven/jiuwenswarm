engine: "HyperQwen"
revision: "3d6c9543292efc17372b824071ef8d9f33366b21 (patch series cut against vLLM 0.33.0, pinned in docker/requirements.txt)"
basis: "Read in code: PATCHES.md and patches/series in full; the preamble and touched-file list of every one of the 65 patches in patches/ and the 4 in kvarn/; the added lines of dflash2-lookup-drafting (whole lookup.py, fuse and point-mass kernels, verify-length controller, runner and cudagraph hooks), hybrid-kv-groups-v2-cudagraph, async-mamba-kv-sizing, mamba-align-checkpoint-order, qwen3_5-mtp-draft-vocab, qwen3_5-embed-uva, sampler-small-topk-fast-softmax (comments and signatures), spec-decode-attn (gate, qmax, buffer setup), dflash2-ngram-chains (comments and signatures), dflash2-z-adaptive-emitted, dflash2-prewarm, dflash-context-capacity, gdn-multi-prefill-checkpoints (comments and signatures), hybrid-sw-block-promote (comments), prefill-attn-int8 (gate), vision-tower-cpu-offload, engine-stall-sentinel, memory-profile-after-warmup, the rejection-sampler backports; kvarn/files/.../kvarn_attn.py module docstring, builder state (lines 450-650) and _flush_tail (2039-2080); prepare/ (atomic_publish.py, quant_schema.py head, quant_embed.py, quant_mtp.py, build_draft_vocab.py head, harden/translate_chat_template.py heads, README.md); drafter/ docstrings of every script and README.md head; single-user/start_qwen.sh lines 400-520 and 755-1062; launcher_common.sh header and the vision, offload and prefix-cache functions; docker/prepare.sh head; xgrammar/README.md and install.sh; scripts/ headers. Read only in documents: fa2/README.md, pthfa/README.md, lsa/README.md, docs/multi-gpu.md head, earlier notes for numbers. Upstream vLLM 0.33.0 itself was not read: the scheduler, block pool, engine core, API server, rejection sampler, GDN kernels, DFlash2 model and tensor parallelism are described from what the patches carry as context and what the documents say."
concurrency: batched
models: "Qwen3.8-27B (and same-architecture third-party checkpoints such as Arete-27B and an uncensored build), a dense hybrid of 64 layers: 48 Gated DeltaNet linear-attention layers with a fixed-size recurrent state (SSM state plus convolution history) and 16 full-attention layers (24 query heads, 4 KV heads, head dim 256). Untied 248,320-row input embedding and output head. Shipped as W4A16 compressed-tensors. Carries its own one-layer MTP draft module; an external 5-layer DFlash2 block drafter (sliding-window attention, reads target hidden states of 5 layers, candidate selector, grouped convolutions) is optional, as is a DSpark drafter. Optional Qwen3-VL vision tower. No experts."
parts:
  - id: "model-dir-publisher"
    engine_name: "prepare/atomic_publish.py, quant_schema.py load_config, docker/prepare.sh state()"
    does: "Commits every offline rewrite of the model directory crash-safely and refuses a checkpoint the rewrites cannot extend, so a killed or wrong preparation never leaves a half-written model."
    not: "It does not compute any weights; the requantizers and vocabulary builder do."
    runs: [offline]
    takes:
      - {from: "outside: model_files", what: "config.json quantization_config, safetensors index, shards"}
      - {from: "offline-weight-requantizer", what: "new shards, config groups and index entries to publish"}
      - {from: "draft-vocab-builder", what: "draft-head shard, id map file and index entries"}
      - {from: "chat-template-rewriter", what: "rewritten chat_template.jinja"}
    gives:
      - {to: "outside: storage", what: "files replaced by temp-file-and-rename with fsync; pristine backups kept once"}
      - {to: "weight-loader", what: "a model directory whose index is the commit point of each step"}
    owns_state: ["which preparation steps are done, read only from the safetensors index", "the first (pristine) backup of every rewritten file", "a lock beside the model directory serialising concurrent preparations"]
    exists_because: "Preparation rewrites a 20 GB model in place and runs on every container start under set -e, so a partial write would stop every later start."
    output_effect: none
    decisions:
      - "Order of writes: shards, then config.json, then the index last as the commit point"
      - "Whether a checkpoint is an extendable compressed-tensors pack-quantized schema, checked before any read"
      - "Backup suffix per step so two steps sharing a shard do not overwrite each other's pristine copy"
    when_things_go_wrong: ["unsupported schema: exits with one line and an untouched directory", "killed mid-step: the step stays pending and the next run completes it", "truncated config, index or shard: treated as a download", "another preparation holds the lock: waits, then refuses after a timeout"]
    must_never: ["leave a reader seeing part of a file", "back up a modified file over the original", "point the index at a draft head whose id list is not yet on disk"]
    evidence: ["prepare/atomic_publish.py:1-74", "prepare/quant_schema.py:1-80", "docker/prepare.sh:1-40", "prepare/README.md"]
    read: code

  - id: "offline-weight-requantizer"
    engine_name: "prepare/quant_lm_head.py, quant_embed.py, quant_mtp.py, quant_heads_stream.py"
    does: "Requantizes the tensors the published quant left in bf16 (output head, input embedding, MTP draft module) to symmetric group-128 int8 (MTP optionally int4) by round-to-nearest, with an error bound."
    not: "Not calibrated quantization; GPTQ is gptq-requantizer. Not the load-time sign folding of the body weights."
    runs: [offline]
    takes:
      - {from: "outside: model_files", what: "bf16 lm_head, embed_tokens and mtp.* tensors"}
    gives:
      - {to: "model-dir-publisher", what: "packed int tensors and scales, a cloned config group per target, index entries"}
    owns_state: []
    exists_because: "Two 2.5 GB untied vocabulary matrices and an 850 MB draft module do not leave room for the state pool on a 24 GB card; the head is read whole every decode step, so halving it also speeds memory-bound decode."
    output_effect: changes_output
    output_effect_when: "Always for head and embedding (int8 round trip error about 0.6 percent) compared with the bf16 checkpoint; the MTP module's precision changes only acceptance, not output."
    decisions:
      - "Bit width per tensor group and group size"
      - "Whether mtp.fc is kept in bf16"
      - "Read whole shards or stream a single huge shard"
    when_things_go_wrong: ["round-trip relative error at or above the bound: aborts before writing", "MTP weights spread over several shards: refuses"]
    must_never: ["write a group that declares a zero point when the tensors written are symmetric"]
    evidence: ["prepare/quant_embed.py:1-78", "prepare/quant_mtp.py:1-82", "prepare/quant_schema.py:41-48", "prepare/README.md"]
    read: code

  - id: "draft-vocab-builder"
    engine_name: "prepare/build_draft_vocab.py (mtp.draft_lm_head, mtp_draft_vocab_ids.pt)"
    does: "Chooses the token ids the MTP drafter may propose and slices those rows out of the already-quantized output head into a separate draft head."
    not: "Not a tokenizer change; the target still scores the full vocabulary."
    runs: [offline]
    takes:
      - {from: "outside: model_files", what: "tokenizer.json and the quantized lm_head"}
      - {from: "outside: storage", what: "a shipped id list or a text corpus to count, ideally the model's own outputs"}
      - {from: "calibration-data-capture", what: "self-generated outputs used to count the shipped list"}
    gives:
      - {to: "model-dir-publisher", what: "draft-head rows, the id map, index entries"}
    owns_state: ["the draft id list"]
    exists_because: "The model emits only about 54k distinct tokens of a 248k vocabulary, and the MTP drafter would otherwise read the whole head once per draft token."
    output_effect: none
    decisions:
      - "Number of rows kept"
      - "Which corpus the counts come from"
      - "Which extra scripts (CJK, Cyrillic) are appended and under what row budget"
      - "Only whole-UTF-8 rows are eligible"
    when_things_go_wrong: ["a token outside the list is never drafted, so that position is always rejected and ends the chain"]
    must_never: ["slice from a head other than the one the target uses after quantization"]
    evidence: ["prepare/build_draft_vocab.py:1-140", "drafter/README.md 'What actually mattered' item 1"]
    read: code

  - id: "calibration-data-capture"
    engine_name: "drafter/collect_prompts.py, gen_data.py, capture.py, capture_dflash2.py"
    does: "Runs the served model offline over a prompt mix to produce self-distillation outputs, target hidden states and per-layer Hessians of the drafters' own inputs."
    not: "Does not change weights itself."
    runs: [offline]
    takes:
      - {from: "outside: storage", what: "public prompt datasets"}
      - {from: "outside: model_files", what: "the target and the bf16 DFlash2 drafter"}
    gives:
      - {to: "gptq-requantizer", what: "captured final hidden states and fp32 Hessians per module"}
      - {to: "draft-vocab-builder", what: "the model's own generated tokens"}
    owns_state: ["resumable generation output with an OS lock against a second generator"]
    exists_because: "Calibrated int4 of the head and drafters needs activations of this model on realistic traffic, and the draft vocabulary is best counted over the model's own outputs."
    output_effect: none
    decisions:
      - "Prompt mix and thinking on/off share"
      - "Number of calibration rows"
      - "Run eagerly so module hooks see inputs (graphs bypass hooks)"
    when_things_go_wrong: ["interrupted final record is removed on resume; corruption earlier stops the run"]
    must_never: ["delete the lock sidecar while it is in use"]
    evidence: ["drafter/capture.py:1-12", "drafter/capture_dflash2.py:1-16", "drafter/gen_data.py:1-8", "drafter/README.md:1-45"]
    read: docs

  - id: "gptq-requantizer"
    engine_name: "drafter/gptq_lm_head.py, requant_mtp_gptq.py, quant_dflash2.py, gptq_utils.py (the 'fast variant')"
    does: "Quantizes the output head, the MTP module and the DFlash2 drafter to int4 group-128 with GPTQ using captured Hessians, writing a new model-directory variant."
    not: "Not the round-to-nearest int8 path of offline-weight-requantizer."
    runs: [offline]
    takes:
      - {from: "calibration-data-capture", what: "hidden states and Hessians"}
      - {from: "outside: model_files", what: "bf16 or int8 source tensors"}
    gives:
      - {to: "outside: model_files", what: "a variant directory with hardlinked shards and int4 head and drafters (fetched prebuilt by prepare/fetch_fast_variant.py and fetch_dflash2.py)"}
    owns_state: []
    exists_because: "Round-to-nearest int4 on the head costs measurable perplexity and acceptance; GPTQ halves that, and the 3.85 GB bf16 DFlash2 drafter would not fit beside the pool."
    output_effect: changes_output
    output_effect_when: "int4 GPTQ head changes logits (reported perplexity +0.6 percent) compared with the int8 head; drafter quantization changes only acceptance."
    decisions:
      - "Bits and group size; no act-order so Marlin needs no index"
      - "Which drafter modules stay bf16 (convolution projections, selector, norms)"
      - "Width of the DFlash2 fc projection"
    when_things_go_wrong: []
    must_never: []
    evidence: ["drafter/quant_dflash2.py:1-22", "drafter/gptq_lm_head.py:1-7", "drafter/requant_mtp_gptq.py:1-6", "drafter/README.md items 2"]
    read: docs

  - id: "chat-template-rewriter"
    engine_name: "prepare/harden_chat_template.py, translate_chat_template.py"
    does: "Rewrites the model's chat template so array-shaped tool arguments and unknown reasoning-effort names no longer fail rendering."
    not: "Not run per request; prompt-renderer applies the rewritten template."
    runs: [offline]
    takes:
      - {from: "outside: model_files", what: "chat_template.jinja"}
    gives:
      - {to: "model-dir-publisher", what: "the rewritten template (idempotent, marked)"}
    owns_state: []
    exists_because: "Clients send tool arguments as arrays and effort levels the template does not know, which made the template raise and the server answer 400."
    output_effect: changes_output
    output_effect_when: "For requests carrying array tool arguments or unknown effort names, compared with the stock template (which rejected them)."
    decisions:
      - "Which effort names map to which template level; unknown ones fall through to no instruction"
    when_things_go_wrong: ["a template whose effort block matches no known shape is left alone with a warning"]
    must_never: ["fail preparation over a ready model directory", "silently rewrite an effort to a stronger level"]
    evidence: ["prepare/harden_chat_template.py:1-30", "prepare/translate_chat_template.py:1-30"]
    read: code

  - id: "launch-profile-resolver"
    engine_name: "single-user/start_qwen.sh, batch/start_qwen.sh, single-user/alternative.sh, launcher_common.sh, resolve_config.sh"
    does: "Turns the operator's profile choices and the detected GPU, platform and parallel size into the vLLM flags and environment knobs of one engine instance, and predicts how many requests the pool will hold."
    not: "Does not size the pool itself (memory-budget-planner does); the feature refusals for correctness are correctness-pins."
    runs: [startup]
    takes:
      - {from: "outside: operator", what: ".env mode, SPEC, CTX, KV format, INT8_ACT, PREFIX_CACHE, KV_OFFLOAD_GB, VISION, EMBED_UVA, DFLASH_TOKENS, EXTRA_ARGS"}
      - {from: "outside: os", what: "compute capability, WSL detection, installed plugins"}
    gives:
      - {to: "memory-budget-planner", what: "pinned pool bytes (KV_MEM) or a utilisation fraction, batched-token budget"}
      - {to: "request-scheduler", what: "max-num-seqs, max-num-batched-tokens 2048, async scheduling on or off"}
      - {to: "attention-kv-store", what: "KV cache dtype and attention backend"}
      - {to: "recurrent-state-store", what: "SSM state dtype float16"}
      - {to: "graph-capture", what: "largest capture size and capture mode"}
      - {to: "compile-and-warmup", what: "env knobs that enter the compile cache key"}
      - {to: "verify-length-controller", what: "lookup and adaptive switches, verify block length"}
      - {to: "access-guard", what: "API key and bind host"}
      - {to: "telemetry", what: "a predicted resident-request count"}
    owns_state: ["the effective configuration of one boot"]
    exists_because: "The engine's speed and fit depend on many interacting flags whose right values differ by card, platform, context length and single-user versus batch use."
    output_effect: changes_output
    output_effect_when: "Choices of KV format, int8 activations and drafting differ from the bf16 reference; recorded per part."
    decisions:
      - "Profile (batch or single-user) and context class (fast, long, huge)"
      - "KV format and attention backend from context class and compute capability"
      - "Drafter kind and number of draft tokens"
      - "Pin the pool by bytes or by utilisation; skip the pin under tensor parallelism"
      - "Which layers run int8 activations"
      - "Allocator mode (expandable segments off under WSL2, KV connector, or TP>1)"
      - "Prefix caching on with align-mode Mamba state, and the snapshot retention interval"
    when_things_go_wrong: ["a boolean knob not 0 or 1: refuses to boot", "a shadowed flag in EXTRA_ARGS: refuses or warns", "a too-small /dev/shm for the offload tier: warns"]
    must_never: ["export an empty string for a knob vLLM validates by choice list", "print the API key"]
    evidence: ["launcher_common.sh:1-100", "launcher_common.sh:150-230", "single-user/start_qwen.sh:215-275", "single-user/start_qwen.sh:400-520", "single-user/start_qwen.sh:755-811", "single-user/start_qwen.sh:984-1062", "batch/start_qwen.sh:109-153,263-279"]
    read: code

  - id: "correctness-pins"
    engine_name: "launcher guards and patch defaults"
    does: "Turns off, at boot, feature combinations measured to corrupt output, and refuses combinations the kernels do not support."
    not: "Not a runtime monitor; nothing checks output while serving."
    runs: [startup]
    takes:
      - {from: "launch-profile-resolver", what: "the requested combination of drafter, verify length, KV format, prefix caching, dtype and capture mode"}
    gives:
      - {to: "verify-length-controller", what: "adaptive verify length pinned off under KVarN plus prefix caching with a long block; STICKY limited to a single request"}
      - {to: "graph-capture", what: "PIECEWISE capture forced for the huge-context profile with MTP"}
      - {to: "sampler", what: "FlashInfer sampler off (VLLM_USE_FLASHINFER_SAMPLER=0)"}
      - {to: "drafter-free-chains", what: "greedy-only gate"}
    owns_state: []
    exists_because: "Several combinations are individually correct but together corrupt output with no error (adaptive block length with KVarN and a prefix hit; FULL capture with a prefix hit at one prompt length in 128), and some kernels are bf16-only."
    output_effect: none
    decisions:
      - "Which combinations are pinned and to what"
      - "Whether an explicit operator override is honoured"
    when_things_go_wrong: ["fp16 dtype with a speculator: refuses to boot unless overridden", "FA2_FP8KV on a launcher without that arm: refuses"]
    must_never: ["let the adaptive verify length run on KVarN with prefix caching and a block over 8 unless explicitly asked", "capture FULL graphs for MTP at the huge-context profile"]
    evidence: ["single-user/start_qwen.sh:437-477", "single-user/start_qwen.sh:812-898", "single-user/start_qwen.sh:954-982", "patches/dflash2-lookup-drafting.patch:921-1000", "patches/dflash2-ngram-chains.patch (greedy-only gate comment)"]
    read: code

  - id: "compile-and-warmup"
    engine_name: "torch.compile, Triton JIT warmups, kernel_warmup(), envs.py compile_factors()"
    does: "Compiles the model graph and every Triton kernel variant the deployment can reach before the first request, keyed so a cached compile is reused only for the same knob settings."
    not: "Does not capture CUDA graphs (graph-capture does)."
    runs: [startup]
    takes:
      - {from: "launch-profile-resolver", what: "registered env knobs that change compiled code"}
      - {from: "outside: storage", what: "the compile cache volume"}
    gives:
      - {to: "graph-capture", what: "compiled graph and warmed kernels"}
      - {to: "memory-budget-planner", what: "compiler scratch that must be released before measuring"}
    owns_state: ["the compile cache key: every registered knob except the runtime-only ones"]
    exists_because: "Triton and torch.compile otherwise compile inside the first request that reaches a new shape (rejection sampler, sampler, DFlash2 input rungs), costing seconds of latency and, on WSL2, wedges."
    output_effect: none
    decisions:
      - "Which knobs enter the cache key and which are excluded as runtime-only"
      - "Which kernel rungs and spec-shaped dummy verifies to run at boot"
      - "Which Triton kernels must not specialise on batch size"
    when_things_go_wrong: ["a knob outside the key replays a stale compiled graph and crashes (KeyError, size assert)", "a cold cache adds about 70 s of warmup once per volume"]
    must_never: ["read a code-changing knob without registering it in envs.py"]
    evidence: ["patches/speed-knobs-envs.patch", "patches/compile-key-runtime-knobs.patch", "patches/spec-sampler-prewarm.patch", "patches/sampler-warmup-cuda.patch", "patches/dflash2-prewarm.patch", "patches/vllm-pr64137-logits-stats-no-specialize.patch", "patches/vllm-pr66026-gather-draft-sampled-no-specialize.patch", "PATCHES.md:17-18"]
    read: code

  - id: "graph-capture"
    engine_name: "CUDA graph capture (cudagraph_utils.py, FULL / PIECEWISE modes)"
    does: "Captures CUDA graphs for each batch size up to the capture limit and for each verify-block length the drafting path can schedule, fixing buffer addresses for replay."
    not: "Does not decide block lengths; it fixes which ones can run captured."
    runs: [startup]
    takes:
      - {from: "compile-and-warmup", what: "compiled model"}
      - {from: "launch-profile-resolver", what: "capture size limit and mode"}
      - {from: "correctness-pins", what: "forced PIECEWISE where FULL corrupts output"}
      - {from: "verify-length-controller", what: "the second (drafter's own) query length to capture"}
    gives:
      - {to: "model-runner", what: "replayable graphs per (batch shape, query length)"}
      - {to: "memory-budget-planner", what: "graph pool size measured from the allocator's reserved bytes"}
    owns_state: ["captured graphs and the addresses they hold"]
    exists_because: "Small decode and verify steps are launch-bound; replaying a captured graph removes per-kernel launch cost, but freezes addresses and host-side Python."
    output_effect: changes_output
    output_effect_when: "FULL capture of the verify step with a prefix-cache hit corrupted one prompt length in 128 on the huge-context profile, compared with PIECEWISE; otherwise none."
    decisions:
      - "FULL, PIECEWISE or FULL_AND_PIECEWISE per profile"
      - "Capture both verify lengths when the lookup can lengthen the block"
      - "Largest captured batch size"
    when_things_go_wrong: ["an uncaptured shape runs piecewise or eager, slower", "a buffer reallocated after capture leaves the graph reading freed memory"]
    must_never: ["reallocate a buffer whose address a graph holds", "run decision logic inside a captured region expecting it to execute each step"]
    evidence: ["patches/dflash2-lookup-drafting.patch:106-146", "patches/cudagraph-memory-from-allocator.patch", "patches/spec-decode-attn.patch preamble", "patches/flashinfer-sm75-spec-graphs.patch", "single-user/start_qwen.sh:837-898"]
