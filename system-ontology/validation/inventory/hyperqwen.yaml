      - {from: "engine-core-loop", what: "time of the last completed step; live request counts read directly"}
    gives:
      - {to: "outside: operator", what: "one warning line per stall episode"}
    owns_state: ["time of last completed step", "whether this episode was logged"]
    exists_because: "A core can stop stepping with requests held and print nothing; keying on completed steps avoids false alarms on long chunked prefills."
    output_effect: none
    decisions:
      - "Threshold (off by default)"
      - "No lock shared with the main loop"
    when_things_go_wrong: ["count read fails: skips the tick, never dies"]
    must_never: ["take a lock the stalled loop might hold"]
    evidence: ["patches/engine-stall-sentinel.patch"]
    read: code

