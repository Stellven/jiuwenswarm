  - id: "pool-layout-planner"
    engine_name: "v1/core/kv_cache_planning.py (KV cache groups, unify page size, block sizes)"
    does: "Splits the pool into equal-size pages shared by attention KV, recurrent state and drafter window layers, choosing group size, per-kind block size and padding, and computes how many requests can be admitted and resident."
    not: "Does not hand pages to requests at run time."
    runs: [startup]
