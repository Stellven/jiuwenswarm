  - {job: "computation on the CPU", why: "Nothing is computed in place on the host; host-resident data (embedding table, vision tower, offloaded KV) is read or copied by the GPU."}
  - {job: "audio or video input", why: "Only the Qwen3-VL image path exists, one image per prompt; audio appears only in the benchmark client."}
  - {job: "spanning machines", why: "Parallelism is within one host (TP/PP over local GPUs); no multi-node or disaggregated prefill/decode. The KV connector is used only for the local host-memory tier."}
  - {job: "per-request adapters (LoRA)", why: "Not configured by any launcher; one patch only keeps an upstream LoRA path intact."}
  - {job: "runtime output-quality monitoring", why: "Correctness is defended by boot-time pins and offline sweeps (bench/), not checked while serving."}
