  - id: "memory-budget-planner"
    engine_name: "gpu_worker determine_available_memory, profile_run, kv_cache_memory_bytes (KV_MEM)"
    does: "Decides at startup how many bytes the state pool gets, from a profiling forward pass or from an operator-pinned byte count, after charging weights, activation peak, graph memory and fixed scratch."
    not: "Does not decide page geometry (pool-layout-planner) or which request gets pages (paged-block-pool)."
    runs: [startup]
    takes:
      - {from: "launch-profile-resolver", what: "utilisation fraction or pinned byte count"}
      - {from: "weight-loader", what: "weight bytes"}
      - {from: "graph-capture", what: "measured graph pool"}
      - {from: "compile-and-warmup", what: "compiler scratch to release first"}
      - {from: "verify-attention", what: "split-KV scratch allocated at model load inside the profile window"}
      - {from: "outside: os", what: "device free memory"}
    gives:
      - {to: "pool-layout-planner", what: "pool bytes"}
    owns_state: []
    exists_because: "On a 24 GB card the pool is what is left after weights; the profiled activation peak swings by about 1 GiB between boots and cold compile scratch inflates it, so the residual must be measured or pinned."
    output_effect: none
    decisions:
      - "Measure after an uncounted warm profile pass, and empty the allocator cache before allocating the pool"
      - "Measure graph memory by allocator reserved bytes, not the driver's free-memory delta"
      - "Pin by bytes for fixed-context profiles"
    when_things_go_wrong: ["pool too small for max_model_len: refuses to boot", "pool pinned too full: first real batch OOMs on Linux, or silently spills to system RAM and slows 3-28x under WSL2"]
    must_never: ["allocate scratch outside the measured window without saying so"]
    evidence: ["patches/memory-profile-after-warmup.patch", "patches/pinned-kv-empty-cache.patch", "patches/cudagraph-memory-from-allocator.patch", "patches/spec-decode-scratch-within-budget.patch", "patches/hybrid-kv-groups-v2-cudagraph.patch preamble", "single-user/start_qwen.sh:506-520"]
