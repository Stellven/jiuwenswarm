surprises:
  - "The engine is a pinned upstream server plus 69 patches and three kernel extensions; most parts are upstream code whose behaviour is set by patches, launch flags and env knobs, and each patch carries its own retirement condition tied to an upstream version."
  - "One pool of equal-size pages is shared by three state kinds with different growth laws (growing attention KV, fixed recurrent state with per-draft-position slots, drafter sliding-window KV), and pages change owner between kinds; the worst bug class was one kind writing late into a page another kind had taken (KVarN tile into GDN state: output '!!!!')."
  - "Recurrent state cannot be truncated: rollback after rejected drafts needs one state slot per draft position, and prefix reuse needs stored snapshots at aligned boundaries, so admission (max-num-seqs) and residency differ several-fold."
  - "Correctness is a property of combinations: adaptive verify length, KVarN and a prefix hit are each fine but together corrupt the second turn; FULL graph capture plus a prefix hit broke exactly one prompt length in 128. The engine answers with boot-time pins, not runtime checks."
  - "Drafts come from three sources fused per position (MTP head, a block drafter, and a lookup in the request's own token history), and correctness rests on the draft distribution q: point masses where the lookup filled, minus infinity outside the truncated draft vocabulary."
  - "The decision about next step's verify length must live outside the captured CUDA graph, reads its signal one step stale on purpose, needs batch-wide unanimity, and requires turning async scheduling off; the graph set must contain both lengths."
  - "Offline preparation is lossy and workload-statistical: requantising untied vocabulary matrices, choosing a draft vocabulary from the model's own outputs, GPTQ with captured Hessians; the draft head must be sliced from the same quantised head the target uses."
  - "Memory planning is measured, not computed, and environment-dependent: the profiled activation peak drifts by 1 GiB, cold compile scratch inflates it, and WSL2 overcommits silently into system RAM instead of failing, so the pool is pinned by bytes."
  - "Speculation preserves the distribution but not tokens: greedy text depends on block length, batch composition and cache hits through rounding, so equivalence must be stated as distributional."
not_read: "Upstream vLLM 0.33.0 source (scheduler, block pool, coordinator, engine core, API server, parsers, rejection sampler, GDN/FLA kernels, DFlash2 and MTP model code, tensor parallelism), which is described only through patch context and documents; the full bodies of gdn-multi-prefill-checkpoints, gdn-sm75-cuda-prefill, spec-decode-scratch-*, int4-kv-per-token-head, triton-spec-attn-fp8-kv, prefill-attn-int8 kernel body, flashinfer-sm75-spec-graphs, sampler kernels and dflash2-ngram-chains code beyond comments; KVarN Triton decode, store and Sinkhorn kernels and most of kvarn_attn.py beyond lines 1-35, 450-650 and 2039-2080; CUDA sources of fa2/ and pthfa/ and the lsa/ Python package; drafter/ script bodies beyond docstrings; prepare/quant_lm_head.py, quant_heads_stream.py, fetch_*.py bodies; resolve_config.sh and batch/start_qwen.sh beyond the flag lines; docs/ beyond the cited heads; bench/ and opt-170hx/."
