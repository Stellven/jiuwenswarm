  - id: "weight-loader"
    engine_name: "vLLM model loader, Marlin process_weights_after_loading"
    does: "Loads target and drafter weights from the model directory onto the GPU and re-encodes them for the kernels that will run them."
    not: "Not offline requantization; it only re-lays out and re-signs codes already in the checkpoint."
    runs: [startup]
    takes:
      - {from: "outside: model_files", what: "compressed-tensors shards, config, draft head and id map"}
      - {from: "model-dir-publisher", what: "a committed model directory"}
    gives:
      - {to: "linear-gemm", what: "Marlin-repacked int4 weights, sign of negative scales folded into codes, int8-activation selection per layer"}
      - {to: "token-embedding", what: "packed int8 embedding table routed through the quantized-embedding path"}
      - {to: "output-head", what: "int8 or int4 head"}
      - {to: "mtp-drafter", what: "MTP module and truncated draft head"}
      - {to: "dflash2-drafter", what: "W4A16 drafter, with K/V rows unpacked to a dense matrix for its fused context projection"}
      - {to: "memory-budget-planner", what: "bytes taken by weights and any repack staging buffer"}
    owns_state: ["resident weights"]
    exists_because: "every engine needs it"
    output_effect: numeric
    output_effect_when: "Sign folding of negative group scales turns the rare code -8 into -7 (one step) in flipped groups, compared with the checkpoint's values."
    decisions:
      - "Fold the sign of negative AutoRound scales into int4 codes for the int8-activation kernel"
      - "Accept asymmetric zero-point int4 weights on the int8-activation path"
      - "Stage repack transients through one grow-only buffer (opt-in)"
      - "Load a bf16 drafter beside a quantized target"
    when_things_go_wrong: ["MTP module without the embedding quant hunk: crashes on a missing parameter", "8-bit weights on the int8-activation path: refused"]
    must_never: ["run the int8-activation Marlin kernel on unfolded negative scales (output is garbage while benchmarks look fine)"]
    evidence: ["patches/marlin-int8-negative-scales.patch", "patches/marlin-int8-asym-zp.patch", "patches/marlin-repack-staged-sm80.patch", "patches/qwen3_5-embed-quant.patch", "patches/dspark-draft-quant-config.patch", "patches/dflash2-lookup-drafting.patch:20-81"]
