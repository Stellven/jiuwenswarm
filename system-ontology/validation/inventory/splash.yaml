surprises:
  - "Recurrent state commit is deferred: verify never advances the GDN cell; acceptance only records pending rows and swaps cell parity, and the next step folds the taped rows in. The live state is cell + tape + pending count, and a prefix hit needs a composite state (GDN cells plus the draft's context window) at that exact block, not just KV."
  - "Memory is governed at run time by one admission over a host estimate built from Mach page counts and macOS pressure, plus a ledger that reclaims across unlike holders (prefix KV, states, expert chunks, image embeddings, staging, the next lane's buffers) in a fixed seven-stage order by claim class and rank; context length and weights' presence (idle release) are both outcomes of this, not inputs."
  - "Verified row count for MoE is chosen jointly across the batch's lanes by a GPU kernel from an online-learned acceptance model and a wall-clock cost fit, which makes greedy output run-to-run nonreproducible; kernel split choice depends on batch width and GPU class, so greedy output depends on co-batched requests."
  - "A second compute unit (the Neural Engine) takes a calibrated channel share of dense FFN layers during prefill with its own lower precision (W8A8), through a private framework, with a per-process circuit breaker and a calibration persisted per Mac, model, OS and build."
  - "Residency is declared per encoder through GPU address tables, not per queue: buffers that only the cache holds cost commands nothing, and a heartbeat keeps a residency set wired outside the queue."
  - "Grammar masks are computed off-engine in the server for the anchor and each drafted token while the GPU runs the target verify, so the constraint interacts with speculation and has its own timeout."
  - "Expert slots use ARC, not LRU, because decode loops over layers and a prefill chunk is a scan; the next block's routes are predicted by applying its router to the current block's input."
  - "The SSD cache can persist across processes, keyed by model, layouts and RoPE scaling, and empties itself after repeated failed starts within probation (a cached state that crashes the engine)."
