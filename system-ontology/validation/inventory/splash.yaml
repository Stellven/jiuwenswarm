  - {job: "audio input", why: "no served family has an audio tower"}
  - {job: "offline weight conversion to disk", why: "conversion into kernel layout happens at every load into memory; the 1.1 prepared-weight cache was dropped (LegacyWeightCache.hpp only reports leftovers)"}
  - {job: "runtime kernel autotuning on the user's machine", why: "kernels are precompiled per shape and selection uses a shipped per-GPU-class table; only the ANE split is calibrated on the machine"}
  - {job: "draft source choice (n-gram, MTP head, no draft)", why: "always one DFlash2 draft per family proposing seven tokens; only the verified row count adapts"}
  - {job: "CPU computation of model layers", why: "all model compute is on the GPU, plus the ANE share of dense prefill FFN; the CPU only reads SSD, computes grammar masks and orchestrates"}
  - {job: "thermal throttling control", why: "thermal state is reported only; heat is not a resource the engine frees"}
