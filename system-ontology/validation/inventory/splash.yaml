engine: "Splash"
revision: "9124ff2 (Serving benchmark, pressure release gate and architecture rules #694)"
basis: "Implementation read in code: runtime/engine/MemoryGovernor.hpp+.cpp (whole), MemoryLedger.hpp (whole) and MemoryLedger.cpp reclaim order (lines 300-540), ReclaimClass.hpp, MemoryPlan.hpp (whole), StreamedMemoryPlan.hpp (whole), Engine.hpp (lines 1-400 and 920-1160), Scheduler.hpp (whole), WeightResidency.hpp; runtime/model/Runtime.cpp decode path (lines 276-580, 2083-2700: draft graph, verify forward, acceptance, commits, finalizeDecode, ConstrainedDecodeTicket), VerifyBudget.hpp, QwenState.hpp (lines 1-140), ExpertStore.hpp (whole design comment and API), DFlashDraft.hpp (1-80); runtime/ops/KernelSelection.hpp+.cpp (lines 40-180), KernelCalibration.hpp (1-120), ExecutionPlans.hpp, PagedKv.hpp (extent constants); runtime/metal/kernels/decode/sampling.metal (residual draw 680-780, draft_verify_rows 1396-1448, acceptance 1460-1510, greedy argmax); runtime/engine/RuntimeResources.mm (ANE calibration key 1520-1540), AneFfnStartup.cpp (remember/recall); runtime/Supervision.hpp; server/constraints.py, tokenization.py, supervision.py (whole). Read as header/design comments and declarations only (not function bodies): the remaining runtime/engine headers (Cache, KvCache, StateCache, KvPool, KvPageTier, KvTier, WriteBehind, CacheDirectory, DiskSpace, Capture, PassCommand, MemoryControl, MemoryAudit, ReleasableMemory, ThermalState, Bootstrap, NativeRuntime, Protocol, FdTransport, NativeArguments, Status), runtime/model headers (GgufImage, GgufPreparation, WeightImages, WeightSource, SafetensorsImage, ModelFactory, ModelSizing, ModelDescriptor, SparseRowStore, SlotRecycler, SsdReaders, KvBlockCache, SpilledKvReads, KvHistoryStream, DraftCheckpoint, RuntimeArenas, SlotFile, StateTransfer, QwenVision, VisionPreparation, RopeScaling, CommandCost, Flint, QwenTarget), runtime/ane and runtime/ops headers (Program, Handoff, AneFfn, AneFfnCalibration, AneFfnMeasurement, Vision, NgramEmbedding, BlockIndexer, HyperConnection, MoE, GDN, DraftSelector, Sampling, StopTokens, PageStorage, KvSlotFormat, Embedding), runtime/metal headers (MetalBackend, CommandGraph, Residency, CommandWatchdog, DeviceCapabilities, Allocation); module docstrings and public names of every server/*.py and server/dialects/*.py and install/*.py. The earlier notes (engines/splash.md) and earlier list (validation/splash.yaml) were used as a starting point and checked against the above. Nothing built, run or measured. In parts, read: code means function bodies, kernels or detailed declarations were read; read: docs means the part was confirmed only from the design comments and declarations in its source headers (or module docstrings), not from docs/*.md."
concurrency: batched
models: "Five families on one Apple-Silicon GPU: Qwen3.8-27B (dense FFN), Qwen3.6-35B-A3B and Qwen3.5-122B-A10B (MoE, 256 experts, top 8), Qwen3.8-Flash-Next (MoE 512 experts top 10, four hyper-connected residual streams, block-sparse attention with a block indexer, a per-layer n-gram embedding table of about 29 GB that stays on SSD), and Flint (all-attention MoE with a sigmoid router, learned attention sinks and sliding-window layers). The Qwen families are hybrids: three of every four layers are GDN linear attention with fixed-size recurrent state, one in four is full attention with KV. Every target is paired with its own separately trained DFlash2 draft (a few non-causal layers that read chosen target layer outputs, share the target's vocabulary projection and propose seven tokens in one forward). Image input through a Qwen vision tower; PDF pages arrive as text plus images. No audio."
parts:
  - id: "model-installer"
    engine_name: "install/ (assembly, upstream, families, hub, gguf, local)"
    does: "Offline, selects a target repository and the DFlash2 draft trained for its family, derives config and tokenizer metadata from a GGUF header, pins the Hub snapshots and publishes an immutable assembly directory of links plus a model.json naming every file's digest."
    not: "It converts no weights and writes no prepared weight copy; conversion into kernel layout happens in weight-image-loader at every start."
    runs: [offline]
    takes:
      - {from: "outside: operator", what: "model selection (repository, revision, draft, language-only)"}
      - {from: "outside: storage", what: "Hugging Face cache snapshots or local GGUF/safetensors files"}
      - {from: "model-inspection", what: "the engine's model rules applied to configs and GGUF headers before any download (check_model)"}
    gives:
      - {to: "model-inspection", what: "assembly directory and model.json record of source digests"}
      - {to: "configuration", what: "per-family option report the launcher and app read"}
    owns_state: ["assemblies under models/.resolved and selection links", "derived GGUF metadata keyed by adapter hash"]
    exists_because: "each target needs its matching trained draft and a tokenizer/chat template, and GGUF files carry those only as metadata"
    output_effect: none
    decisions:
      - "which draft goes with which target family (by config, never by repository name)"
      - "whether to include the vision tower (--language-only)"
      - "when to follow the Hub versus use pinned snapshots"
    when_things_go_wrong: ["a repository of no served family installs nothing", "unreferenced assemblies are collected"]
    must_never: ["change an assembly once published", "identify a family by repository name"]
    evidence: ["install/assembly.py (docstring)", "install/upstream.py (docstring)", "install/families.py", "install/gguf.py", "install/local.py"]
    read: docs

  - id: "model-inspection"
    engine_name: "ModelDescriptor / inspectModelRoot"
    does: "At each start, finds the family whose rules the target configuration fits, validates target, draft and vision sources against the assembly record's digests, and fixes the model's capabilities (window, YaRN, stop tokens, sparse KV shape)."
    runs: [startup]
    takes:
      - {from: "model-installer", what: "assembly and model.json"}
      - {from: "outside: model_files", what: "config.json, GGUF headers, draft config"}
    gives:
      - {to: "weight-layout-planner", what: "validated descriptor and family layout"}
      - {to: "memory-plan", what: "served context window and model capabilities"}
      - {to: "prefix-block-cache", what: "source identity that enters cache keys"}
    owns_state: ["the model descriptor: family, sources, rope scaling, capabilities"]
    exists_because: "kernels are compiled for fixed shapes, so only known families with exact shapes can be served"
    output_effect: none
    decisions:
      - "which family a configuration describes"
      - "whether to stretch context with YaRN (static factor for all requests)"
    when_things_go_wrong: ["refuses a model of no family or with mismatched shapes before loading weights (permanent start failure)"]
    must_never: ["serve a shape the kernels were not built for"]
    evidence: ["runtime/model/ModelDescriptor.hpp (comments)", "runtime/model/RopeScaling.hpp", "runtime/engine/NativeArguments.hpp", "runtime/model/Qwen4Exp.hpp static_asserts (per notes)"]
    read: docs

  - id: "device-probe"
    engine_name: "DeviceCapabilities"
    does: "Reads the GPU family, core count, macOS version, unified memory and the recommended working set, classifies the GPU as Apple9 or Apple10, and refuses unsupported Macs."
    runs: [startup]
    takes: [{from: "outside: os", what: "Metal device properties, IORegistry core count"}]
    gives:
      - {to: "kernel-selector", what: "GPU class and planned core count"}
      - {to: "memory-plan", what: "recommended working set and physical memory"}
    owns_state: ["device capability record"]
    exists_because: "kernel choice and the memory budget depend on the GPU class and size"
    output_effect: none
    decisions: ["which GPU class a family number maps to", "what core count to assume when none is reported"]
    when_things_go_wrong: ["refuses family below 9, old macOS, or non-unified memory (permanent start failure)"]
    must_never: ["branch kernel policy on anything outside this class and core count"]
    evidence: ["runtime/metal/DeviceCapabilities.hpp", "runtime/metal/DeviceCapabilities.cpp"]
    read: code

  - id: "weight-layout-planner"
    engine_name: "gguf::Image planning (GgufImage, SafetensorsImage, DraftCheckpoint, VisionPreparation, ModelSizing)"
    does: "From file metadata alone, plans each weight image: section offsets, row order (GDN value heads regrouped by key head), which tensors become GPU-repacked planes, which are copied, and which parts (routed experts, PLE table) are left out to stream."
    not: "It reads no tensor data; the bytes are moved by weight-image-loader."
    runs: [startup]
    takes:
      - {from: "model-inspection", what: "descriptor and layout"}
      - {from: "outside: model_files", what: "GGUF metadata or safetensors headers (MLX, Model Optimizer, compressed-tensors)"}
      - {from: "streamed-parts-planner", what: "which parts stream instead of loading"}
    gives:
      - {to: "weight-image-loader", what: "image plans naming source rows per section"}
      - {to: "streamed-parts-planner", what: "sizes of what loads, and of each streamable part whole and at its smallest store"}
    owns_state: ["image plans (immutable once made)"]
    exists_because: "kernels read a fixed block layout (MDGG) directly from quantized codes, which differs from every source format"
    output_effect: none
    decisions:
      - "which formats are accepted and kept native versus converted"
      - "which tensors are widened or recast (norms as F32 1+w, GDN decay, shared-expert gate to F32)"
      - "which parts are left out of the image to stream"
    when_things_go_wrong: ["refuses unsupported formats and whole-model BF16/F16"]
    must_never: ["plan a section whose rows the kernels cannot read"]
    evidence: ["runtime/model/GgufImage.hpp", "runtime/model/SafetensorsImage.hpp", "runtime/model/ModelSizing.hpp", "runtime/model/DraftCheckpoint.hpp", "runtime/model/VisionPreparation.hpp"]
    read: docs

  - id: "weight-image-loader"
    engine_name: "writeGgufImage / WeightImages / WeightSource"
    does: "Writes every planned image into its own Metal buffer by reading source rows with F_NOCACHE and having the GPU repack them into planes, quantizes the BF16 draft into 4-bit af4g64 planes, and checks afterwards that no source was written meanwhile."
    not: "It keeps no prepared copy on disk; a restore after idle release reruns the same write."
    runs: [startup, on_demand]
    takes:
      - {from: "weight-layout-planner", what: "image plans"}
      - {from: "outside: model_files", what: "tensor bytes"}
      - {from: "memory-governor", what: "admission for each image buffer"}
    gives:
      - {to: "target-forward", what: "weight planes and tables in GPU memory"}
      - {to: "draft-proposer", what: "4-bit draft weights"}
      - {to: "vision-encoder", what: "BF16 vision tower image"}
      - {to: "prefix-block-cache", what: "content identity of each image (enters cache keys)"}
    owns_state: ["the weight images and their open source files"]
    exists_because: "unified memory holds one copy only; avoiding the page cache keeps the weights from being held twice"
    output_effect: numeric
    output_effect_when: "draft projections are quantized from BF16 at load, which changes draft proposals (not greedy target output); some tensors are recast (F32 norms, decay), last bits versus the source"
    decisions: ["bypass the page cache for reads", "repack on GPU through a fixed staging buffer", "quantize the draft at load rather than ship it quantized"]
    when_things_go_wrong: ["a source changed since it was opened fails the load", "an allocation refused at start is retried within a bounded window (bootstrap-sequencer)"]
    must_never: ["mix old and new bytes of a source that was rewritten", "write a converted copy to disk"]
    evidence: ["runtime/model/GgufPreparation.hpp", "runtime/model/WeightImages.hpp", "runtime/model/WeightSource.hpp", "runtime/model/WeightSource.cpp:47 (F_NOCACHE, per notes)"]
    read: docs

  - id: "weight-residency"
    engine_name: "WeightResidency / ReleasableMemory"
    does: "After an idle period with no request, releases the weight images, the expert store's chunks and staging, and the ANE program; on the next request restores them one part per engine tick before any request runs."
    runs: [background, on_demand]
    takes:
      - {from: "lane-admission", what: "engine idle or a request arriving"}
      - {from: "memory-governor", what: "admission for each restored part (Floor while a request waits, Start otherwise)"}
    gives:
      - {to: "weight-image-loader", what: "restore an image (rewrite from source)"}
      - {to: "expert-store", what: "release and restore of floor chunks and staging"}
      - {to: "ane-ffn-split", what: "unload and reload of its ANE program"}
      - {to: "telemetry", what: "released/restoring flags, restore counts and failures"}
    owns_state: ["held / released / restoring status and the idle clock"]
    exists_because: "the engine shares one memory pool with every other application on the Mac and its weights are its largest holding"
    output_effect: none
    decisions: ["how long idle before release (--idle-release, or off)", "restore one part per tick so frames and timed checks still run", "abandon a restore when no request waits and memory is refused"]
    when_things_go_wrong: ["a refused restore makes waiting requests wait; each fails retryably at its wait limit and the weights are released again"]
    must_never: ["run a request before every part is back", "let a command read a released buffer (the command fails instead)"]
    evidence: ["runtime/engine/WeightResidency.hpp", "runtime/engine/ReleasableMemory.hpp", "runtime/engine/Engine.hpp:267-311"]
    read: code

  - id: "streamed-parts-planner"
    engine_name: "planStreamedMemory"
    does: "Before the model loads, decides from the engine budget whether MoE routed experts and the PLE table load whole or stream from SSD, sizes their stores and floors, and sizes the floors of KV spill for a sparse-attention target."
    not: "It does not decide the KV/context budget; memory-plan does that after loading."
    runs: [startup]
    takes:
      - {from: "memory-plan", what: "hard budget and fixed bytes"}
      - {from: "weight-layout-planner", what: "sizes of each streamable part"}
      - {from: "configuration", what: "--expert-memory, --ple-memory, --max-context, --sparse-kv-memory"}
      - {from: "ssd-cache-tier", what: "whether the tier takes writes and its active-KV room"}
    gives:
      - {to: "expert-store", what: "cap, floor bytes and floor share"}
      - {to: "ple-row-store", what: "row cache bytes"}
      - {to: "kv-spill-controller", what: "spill plan: dense, window and group pages, reader floors"}
      - {to: "weight-layout-planner", what: "which parts stream"}
    owns_state: ["the streamed plan"]
    exists_because: "MoE experts and the PLE table can exceed memory on small Macs while only a few rows are needed per step"
    output_effect: none
    decisions:
      - "KV allowance first (64K tokens or --max-context), then experts whole, then PLE table, then the rest"
      - "expert floor share: all slots when KV can spill, else a fixed share"
      - "replan with fewer streamed parts when that streams more"
    when_things_go_wrong: ["floors beyond the budget or a size below a part's minimum are refused at start"]
    must_never: ["rest any size on the host's free memory; only the engine limit counts"]
    evidence: ["runtime/engine/StreamedMemoryPlan.hpp"]
    read: code

  - id: "memory-plan"
    engine_name: "EngineMemoryPlan / EngineMemoryPolicy"
    does: "Computes the engine's hard Metal budget (recommended working set less a margin, optionally lowered by --max-memory), the host reserves, the fixed floors, the KV page and extent geometry, and the longest context one request may take, which is a result of the plan."
    runs: [startup]
    takes:
      - {from: "device-probe", what: "recommended working set, physical memory"}
      - {from: "model-inspection", what: "served window"}
      - {from: "weight-image-loader", what: "measured target, draft and vision weight bytes"}
      - {from: "streamed-parts-planner", what: "store sizes and spill plan"}
      - {from: "ane-ffn-calibrator", what: "ANE split bytes"}
    gives:
      - {to: "memory-governor", what: "hard budget, untracked reserve, host reserves, host-held bytes"}
      - {to: "kv-page-pool", what: "page and extent geometry, page count"}
      - {to: "lane-admission", what: "maximum context and spill geometry"}
      - {to: "telemetry", what: "the plan as /status memory_plan"}
      - {to: "streamed-parts-planner", what: "hard budget and fixed bytes"}
    owns_state: ["the budget breakdown and context bounds"]
    exists_because: "unified memory is one pool shared with other applications; context length is whatever the plan leaves"
    output_effect: none
    decisions: ["working-set margin rule", "host available and spare reserves as shares of physical memory", "context bound by model window, resident memory, or spill and disk"]
    when_things_go_wrong: ["KvPoolDoesNotFit or WorkingSetTooSmall refuses the start with the shortfall"]
    must_never: ["let --max-memory raise the budget above the automatic ceiling", "preallocate lanes' state or KV (they grow from the dynamic budget)"]
    evidence: ["runtime/engine/MemoryPlan.hpp:176-305"]
    read: code

  - id: "memory-governor"
    engine_name: "MemoryGovernor"
    does: "Is the sole admission for every Metal allocation: grants a short-lived byte reservation inside a claim's scope if it fits under the engine limit (less what higher-ranked waiting claims hold) and the host rule admits it for the claim's class, else refuses with the cause."
    not: "It does not choose what to evict; memory-ledger does."
    runs: [per_step, background]
    takes:
      - {from: "memory-plan", what: "limit, reserves"}
      - {from: "outside: os", what: "Mach VM page counts, kern.memorystatus_vm_pressure_level, task footprint"}
      - {from: "metal-command-backend", what: "allocated bytes and device current allocation"}
      - {from: "memory-ledger", what: "held bytes of higher-ranked waiting claims, host-refused bytes, lane demand"}
    gives:
      - {to: "kv-page-pool", what: "allocation admission (grant or EngineBudget/HostPressure refusal)"}
      - {to: "gdn-state-cells", what: "allocation admission"}
      - {to: "expert-store", what: "allocation admission for chunk growth"}
      - {to: "weight-residency", what: "allocation admission for restores"}
      - {to: "memory-ledger", what: "control pass: host claim of the deficit, then pool growth"}
      - {to: "telemetry", what: "governor snapshot with host telemetry"}
    owns_state: ["reserved bytes", "host band state with hysteresis and waiver", "unseen-growth correction", "denied count"]
    exists_because: "the GPU shares physical memory with every other process and macOS only offers estimates and pressure levels"
    output_effect: none
    decisions:
      - "estimate of host available and spare memory, counting a capped compression credit unless pressure is critical"
      - "per-class host rule: floor work always, in-service work keeps the margin at normal pressure, elective work also needs to be outside the band"
      - "critical pressure refuses everything and triggers a host claim each settle period"
      - "pool growth admitted on its net change when cache funds it"
    when_things_go_wrong: ["refuses with HostPressure or EngineBudget and records what the claim lacks", "a driver refusal after admission is passed back as its own cause", "missing telemetry holds elective work back but forces no release"]
    must_never: ["allow an allocation outside a claim scope (logic error)", "count a /status read as a sample that moves admission"]
    evidence: ["runtime/engine/MemoryGovernor.hpp", "runtime/engine/MemoryGovernor.cpp:22-496"]
    read: code

  - id: "memory-ledger"
    engine_name: "MemoryLedger (claims, ClaimRank, TakeRights, VictimSource, ElasticPool accounts)"
    does: "Keeps every open memory claim with its rank and class, decides what each claim may take, and frees what it lacks from heterogeneous holders in one fixed order, and grows elastic pools toward their caps when quiet."
    not: "It never allocates; and it does not decide admission (memory-governor)."
    runs: [per_step, background]
    takes:
      - {from: "lane-admission", what: "claims with class, rank, reach, timing, lane-needs; lanes' projected growth"}
      - {from: "prefix-block-cache", what: "victim units (KV blocks, extents) and what transfers will return"}
      - {from: "composite-state-cache", what: "victim units (states, checkpoints)"}
      - {from: "expert-store", what: "elastic pool state and release of top chunk"}
      - {from: "image-embedding-cache", what: "rebuild-only pool units"}
      - {from: "spilled-kv-reader", what: "hot-block and staging pool units"}
      - {from: "memory-governor", what: "room, critical flag, host growth admission"}
    gives:
      - {to: "prefix-block-cache", what: "take: evict, demote to SSD, or compact"}
      - {to: "composite-state-cache", what: "take: evict or write a state"}
      - {to: "expert-store", what: "release or regrow a chunk"}
      - {to: "lane-admission", what: "free result: met, pending (memory on its way back) or short"}
      - {to: "write-behind", what: "copy demand (claims recently reached cache that a copy would free at once)"}
      - {to: "telemetry", what: "accounts, owed bytes, waiting claims, decision log"}
    owns_state: ["open claims and their waits", "pool accounts and grow/shrink counts", "quiet and copy-demand clocks"]
    exists_because: "many unrelated holders (prefix KV, recurrent states, expert chunks, staging, embeddings, next lane's buffers) compete for one budget and differ in what losing them costs"
    output_effect: none
    decisions:
      - "reclaim order: free-now cache, rebuild-only pools, cache needing a write, own conversion to spill or the paused command, expert chunks above floor, units in use, next lane's start buffers"
      - "take rights per claim class, timing and priority (no pool unit below a higher-priority lane in service)"
      - "claim rank: priority, decoding before prefill, completed tokens, earlier submission"
      - "wait a quiet period before regrowing pools"
    when_things_go_wrong: ["a claim short of everything its rights reach is reported Short and its request waits or fails at its limit", "a pending free leaves the claim waiting for landings"]
    must_never: ["take what a claim's rights exclude", "give a Floor claim anything (logic error)", "grow pools while a request's claim waits"]
    evidence: ["runtime/engine/MemoryLedger.hpp", "runtime/engine/MemoryLedger.cpp:300-540", "runtime/engine/ReclaimClass.hpp"]
    read: code

  - id: "bootstrap-sequencer"
    engine_name: "RuntimeBootstrap / RuntimeResources::create"
    does: "Runs the start in fixed stages (configuration, backend, capability check, model loading, memory planning, storage allocation, maximum-prefill and decode warmup, composite state restore from a persistent tier, memory audit) and reports Ready or a classified start failure."
    runs: [startup]
    takes:
      - {from: "configuration", what: "native command line"}
      - {from: "memory-plan", what: "plan"}
      - {from: "ssd-cache-tier", what: "states and KV blocks a persistent tier holds from an earlier process"}
    gives:
      - {to: "native-loop", what: "Ready report or start failure with stage and shortfall"}
      - {to: "telemetry", what: "warmup report and memory audit"}
    owns_state: ["start stage and the retry window for temporary allocation failures"]
    exists_because: "every engine needs it; here warmup must run on a reserved KV runway and failures must be classed for the server's relaunch policy"
    output_effect: none
    decisions: ["retry temporary host or driver allocation failures within a window that opens at the first failure", "warm up on the runway pages without allocating KV"]
    when_things_go_wrong: ["a warmup lane with a non-finite row fails the start", "memory or context shortfall is reported as a memory-class failure that the server retries"]
    must_never: ["report Ready before warmup and audit pass"]
    evidence: ["runtime/engine/Bootstrap.hpp", "runtime/engine/RuntimeResources.hpp:40-64", "runtime/model/Runtime.cpp:3421-3445"]
    read: docs

  - id: "ane-ffn-calibrator"
    engine_name: "AneFfnStartup / ane_ffn::Calibration"
    does: "At start, for a dense target only, times the FFN split at two ANE shares and the GPU alone on a few layers, fits T(s) = max(A(s), G(s) + u A(s)), and picks the ANE's channel share and least chunk rows, or none; persists the result keyed by layer shapes, device, macOS version, build and allowed units."
    runs: [startup]
    takes:
      - {from: "ane-ffn-split", what: "measurements of split and GPU-alone layers"}
      - {from: "memory-plan", what: "most ANE units the plan allows"}
      - {from: "outside: storage", what: "remembered calibration in the per-user splash-ane cache"}
    gives:
      - {to: "ane-ffn-split", what: "ANE unit count and minimum rows"}
      - {to: "memory-plan", what: "split's Metal bytes"}
      - {to: "outside: storage", what: "remembered calibration"}
    owns_state: ["the remembered calibration per key"]
    exists_because: "the ANE's gain depends on the Mac (M5 Max gives it far fewer channels than M6) and is only knowable by measuring"
    output_effect: none
    decisions: ["the minimum predicted gain to enable the split", "the chunk-noise tolerance for the least rows", "remember a no-gain result too"]
    when_things_go_wrong: ["timings not finite and positive are refused", "no gain: the GPU alone serves"]
    must_never: ["calibrate a MoE target"]
    evidence: ["runtime/engine/AneFfnStartup.hpp", "runtime/engine/AneFfnStartup.cpp:146-239", "runtime/engine/RuntimeResources.mm:1520-1540", "runtime/ops/AneFfnCalibration.hpp", "runtime/ops/AneFfnMeasurement.hpp"]
    read: code

  - id: "ane-ffn-split"
    engine_name: "ops::AneFfn / ane::Program / ane::Handoff"
    does: "During a dense target's prefill, runs the leading intermediate channels of each FFN layer on the GPU and the rest as a W8A8 program on the Neural Engine (int8 weights requantized by the GPU one layer ahead into shared IOSurfaces), ordered by a shared event, and adds the ANE's partial down projection to the GPU's."
    not: "It is not expert offload and not a decode path; MoE targets and decode never use it."
    runs: [per_layer]
    takes:
      - {from: "prefill-runner", what: "chunk rows and FFN inputs"}
      - {from: "ane-ffn-calibrator", what: "share and minimum rows"}
      - {from: "weight-image-loader", what: "projection planes to requantize"}
    gives:
      - {to: "target-forward", what: "summed FFN output"}
      - {to: "telemetry", what: "split state and breaker trips"}
    owns_state: ["the loaded ANE program (memory held by the ANE service process, outside the Metal budget)", "the breaker state, permanent for the process"]
    exists_because: "the Neural Engine is a third compute unit that sits idle during GPU prefill, and dense FFN channels are independent so the work splits by channel"
    output_effect: changes_output
    output_effect_when: "when the split runs (27B prefill with --ane on and a calibrated gain): the ANE part is int8 weights and Hadamard-rotated int8 activations computed in fp16, versus the GPU-alone prefill (docs report logits KL around 1e-4 to 7e-4)"
    decisions: ["which program function size a chunk uses", "stop the split on any ANE failure, timeout or non-finite value", "stop it when a window of commands shows no gain"]
    when_things_go_wrong: ["any ANE failure retires the handoff (event raised to its top so GPU waits pass), the command's results are discarded and the chunk reruns on the GPU alone, as every later chunk does"]
    must_never: ["let a job exceed the GPU's event wait limit", "use a discarded command's results"]
