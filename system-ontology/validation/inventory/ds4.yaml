  - id: "memory-admission-guard"
    engine_name: "ds4_context_memory_estimate_with_prefill_mode, glm_graph_memory_guard, ds41_session_bytes admission, ds4_rocm_allocation_fits"
    does: "Estimates context, scratch and model bytes for the requested context and session count and refuses to start (or refuses an allocation) when they exceed the machine's budget minus a reserve."
    not: "Does not size the expert cache; that is the SSD cache planner."
    runs: [startup, on_demand]
    takes:
      - {from: "outside: os", what: "Recommended GPU working set, physical and non-movable memory, wired limit"}
      - {from: "outside: operator", what: "Context size, session count, prefill chunk"}
    gives:
      - {to: "session-timeline", what: "Admission of each session's full-context allocation"}
      - {to: "ssd-cache-planner", what: "Context-aware cap on model-plus-cache bytes"}
    owns_state: []
    exists_because: "Models are sized to just fit 96-128 GB unified-memory machines; overcommitting there triggers the OS OOM killer instead of a clean error."
    output_effect: none
    decisions:
      - "Budget fraction and fixed reserve per machine class and family"
      - "Whether an explicitly raised wired limit overrides the heuristics"
      - "OS reserve kept back for every ROCm allocation on integrated GPUs"
    when_things_go_wrong: ["Refuses with a message before allocation; ROCm returns out-of-memory for the single allocation"]
    must_never: ["Admit a configuration whose estimated bytes exceed the guarded budget"]
    evidence: ["ds4.c 47210-47264", "ds4.c 40552-40643 (delegated)", "ds4.c 76344-76351 (delegated)", "ds4_rocm_memory.h 20-60"]
    read: code
  - id: "ssd-cache-planner"
    engine_name: "ds4_engine_configure_streaming_auto_cache, ds4_ssd_auto_cache_plan"
    does: "Computes at startup how many routed experts the expert cache may hold, from the recommended working set times a percentage, capped by a context-aware limit, minus non-routed weight bytes, divided by one expert's bytes."
    runs: [startup]
    takes:
      - {from: "outside: os", what: "Recommended working set size"}
      - {from: "weight-binder", what: "Non-routed bytes, bytes per expert, number of cacheable experts"}
      - {from: "memory-admission-guard", what: "Context-aware cap (Apple) and guard cap (ROCm GLM)"}
      - {from: "outside: operator", what: "Optional explicit slot count or byte size; DS4_SSD_AUTO_CACHE_PCT"}
    gives:
      - {to: "routed-expert-cache", what: "Slot budget and expert size"}
    owns_state: []
    exists_because: "When the model does not fit, the cache must use what is left after fixed weights without starving them."
    output_effect: none
    decisions:
      - "Default percentage (80, or 86 on Apple for non-GLM), override range 50 to 95"
      - "At least one slot, at most the model's expert count"
      - "A user-given size is a target, not a guarantee"
    when_things_go_wrong: ["Fails startup when the working set or expert size cannot be measured", "A layer slice without routed experts disables the cache"]
    must_never: []
    evidence: ["ds4_ssd.c 80-140", "ds4.c 71028-71207"]
    read: code
  - id: "multi-gpu-placer"
    engine_name: "engine_classify_multi_tier, ds4_compute_layer_placement (ds4_layer_pack.c), engine_compute_cuda_ep_placement"
    does: "On one CUDA machine with several GPUs, assigns embedding, each layer and the output head to GPUs in order within per-GPU budgets, or pairs GPUs so each holds half of every layer's routed experts."
    runs: [startup]
    takes:
      - {from: "outside: operator", what: "Per-GPU budgets, context hint, session count hint, --cuda-tensor-parallel"}
      - {from: "model-loader", what: "Per-layer byte sizes"}
    gives:
      - {to: "weight-binder", what: "Device of each layer and expert half; vocab-row shards of the output head"}
      - {to: "cross-gpu-transfer", what: "Device boundaries the graph must cross"}
    owns_state: ["Placement table"]
    exists_because: "Discrete GPUs have separate memories smaller than the model."
    output_effect: none
    decisions:
      - "Greedy contiguous packing in layer order"
      - "Expert split only for DeepSeek V4 with an even GPU count"
      - "Refuse any layout that would place layers on the CPU"
      - "Refuse multi-GPU together with SSD streaming"
    when_things_go_wrong: ["Prints the layout and refuses to start when anything spills to CPU or a budget is zero"]
    must_never: ["Execute a layer on the CPU in production"]
    evidence: ["ds4_layer_pack.c 14-45", "ds4.c 72209-72713", "ds4.c 74380-74440 (delegated)"]
    read: code
  - id: "routed-expert-cache"
    engine_name: "stream expert cache (g_stream_expert_cache on Metal, g_stream_expert_slots on CUDA)"
    does: "Holds a bounded set of routed experts (gate, up and down blocks) in separately allocated GPU-visible buffers and answers which slot holds a selected expert of a layer."
    not: "Does not choose victims (expert-eviction-policy) or read from disk (expert-ssd-reader); there is no path that computes a missing expert on the CPU or skips it."
    runs: [per_layer, startup]
    takes:
      - {from: "ssd-cache-planner", what: "Slot budget"}
      - {from: "expert-router", what: "Selected expert ids of the layer"}
      - {from: "expert-ssd-reader", what: "Expert blocks read into a slot"}
      - {from: "expert-eviction-policy", what: "Slot to reuse"}
    gives:
      - {to: "routed-expert-ffn", what: "Slot remap of the selected experts"}
    owns_state: ["Map from (layer, expert) or file offset to slot, with in-flight marks and last-use stamps"]
    exists_because: "Only in SSD streaming mode: the model does not fit, and only ~2% of experts are used per token."
    output_effect: none
    output_effect_when: "Release checklist requires identical logits across cache policies and capacities for the same prefill chunking (docs, not run)."
    decisions:
      - "Metal: buffers locked with mlock; lock failure lowers the effective limit"
      - "CUDA: capacity backs off by a quarter until allocation succeeds, keeping 8 GiB system headroom; single GPU only"
      - "A hit requires matching file offsets of all three blocks"
    when_things_go_wrong: ["If the selected experts of one layer cannot all be staged, the step fails rather than using stale data", "CUDA refuses when fewer slots than unique selected experts fit"]
    must_never: ["Reclaim a slot that a submitted GPU command still reads", "Let experts selected for the current layer evict each other"]
    evidence: ["ds4_metal.m 15796-15870, 16695-16828 (per notes), 14188-14245 (per notes)", "ds4_cuda.cu 29015-29214, 35793-35851"]
    read: code
  - id: "expert-eviction-policy"
    engine_name: "route hotness (Metal), used stamp (CUDA)"
    does: "Chooses which cached expert gives up its slot: on Metal the lowest decaying selection count then oldest use; on CUDA simply the oldest use stamp after all hits of the step are protected."
    runs: [per_layer]
    takes:
      - {from: "expert-router", what: "Selected ids (counted on hits and misses alike)"}
      - {from: "routed-expert-cache", what: "Entries with in-flight and protection marks"}
    gives:
      - {to: "routed-expert-cache", what: "Victim slot"}
    owns_state: ["Metal: per-(layer, expert) heat counter and decay clock"]
    exists_because: "Cache slots are far fewer than experts; which ones stay decides SSD traffic."
    output_effect: none
    decisions:
      - "Heat increments on every selection, not only hits"
      - "Heat halves every 16 decoded tokens; prefill does not advance the clock; a fresh prefill resets heat"
      - "On Metal, wait once for in-flight commands and retry when only in-flight entries remain"
      - "CUDA keeps no heat (reset is a no-op)"
    when_things_go_wrong: ["No victim found leads to step failure"]
    must_never: ["Pick an in-flight or currently protected entry"]
    evidence: ["ds4_metal.m 14697-14803, 15796-15870", "ds4_cuda.cu 29105-29165, 35817-35818"]
    read: code
  - id: "expert-ssd-reader"
    engine_name: "stream expert load (pread threads), cuda_model_copy_to_device_streamed"
    does: "Copies a missing expert's three blocks from the model file into its cache slot with several reader threads, starting as soon as the selected ids are known."
    runs: [per_layer, on_demand]
    takes:
      - {from: "outside: storage", what: "Model file on local SSD"}
      - {from: "routed-expert-cache", what: "Destination slot and file offsets"}
    gives:
      - {to: "routed-expert-cache", what: "Filled slot"}
    owns_state: []
    exists_because: "Experts beyond the cache live only on SSD."
    output_effect: none
    decisions:
      - "Start reads while the GPU computes the shared expert"
      - "CUDA batched prefill: sort misses by file offset and merge adjacent reads"
    when_things_go_wrong: ["A failed read fails the step; the cache never publishes a partially read slot"]
    must_never: ["Advertise a slot as a hit before all its copies complete"]
    evidence: ["ds4_cuda.cu 29123-29214", "ds4.c 27055-27080 (per notes)", "ds4_metal.m 16695-16828 (per notes)"]
    read: code
  - id: "resident-missing-split"
    engine_name: "stream expert split"
    does: "When three or more selected experts of a layer are missing, computes the resident ones first while the missing ones are read, then the late ones, and does the down projection and sum once at the end."
    runs: [per_layer]
    takes:
      - {from: "routed-expert-cache", what: "Which selected experts are resident"}
    gives:
      - {to: "routed-expert-ffn", what: "Two-stage submission order for the layer"}
    owns_state: []
    exists_because: "Hides SSD read time behind computation of experts already in memory."
    output_effect: none
    output_effect_when: "Summation order is fixed regardless of split, so output is unchanged."
    decisions:
      - "Split threshold on missing experts per layer"
      - "Enable only after a few decoded tokens and once the cache holds enough entries"
    when_things_go_wrong: ["Second stage waits for the first stage's commands before reusing its staging area"]
    must_never: ["Change the final accumulation order"]
    evidence: ["ds4_metal.m 14674-14695", "ds4_metal.m 13520-13531, 44190-44345 (per notes)"]
    read: code
  - id: "expert-cache-preloader"
    engine_name: "streaming hotlist preload (ds4_streaming_hotlist.inc)"
    does: "Fills the expert cache at startup from a built-in list of frequently used experts gathered offline, up to a cap, so the first tokens do not cause thousands of reads."
    runs: [startup]
    takes:
      - {from: "expert-locality-profiler", what: "Hot-expert lists (compiled in, or a hotlist file)"}
    gives:
      - {to: "expert-ssd-reader", what: "Experts to read at startup"}
    owns_state: []
    exists_because: "Cold-start misses are expensive and routing popularity is stable enough to profile offline."
    output_effect: none
    decisions:
      - "Preload cap in automatic mode"
      - "Not used for Qwen and off by default for GLM 5.2"
    when_things_go_wrong: []
    must_never: []
    evidence: ["ds4_streaming_hotlist.inc", "ds4.c 23054-23087 (per notes)", "ds4.c 73900-73907"]
    read: code
  - id: "prefill-layer-pagein"
    engine_name: "metal_graph_stream_prefill_layer_pagein (pread, madvise, readahead variants)"
    does: "During wide prefills in streaming mode, touches the next layer's routed-weight pages of the mapped file from helper threads so they are in the page cache when that layer runs."
    not: "Does not fill the expert cache; it warms the file mapping."
    runs: [per_layer]
    takes:
      - {from: "outside: storage", what: "Model file pages"}
      - {from: "prompt-prefill-driver", what: "Which layer comes next"}
    gives:
      - {to: "routed-expert-ffn", what: "Resident mapped pages for the next layer"}
    owns_state: []
    exists_because: "Layer-major prefill needs each layer's experts once for a whole chunk, so reading the next layer during the current one hides latency."
    output_effect: none
    decisions:
      - "Which variant runs: pread is on by default; madvise, page-in and readahead are opt-in by environment"
      - "Only routed matrices when non-routed weights are already wired (GLM)"
    when_things_go_wrong: ["Failure marks the job not ok; inference still reads the pages on demand (inferred)"]
    must_never: []
    evidence: ["ds4.c 19862-20118", "ds4.c 21248-21330"]
    read: code
  - id: "engram-row-reader"
    engine_name: "ds4_engram (table, reader, read_batch)"
    does: "For V4.1, hashes each new token with the 3 previous ones into 24 row numbers per table and reads those rows directly from the file with an uncached descriptor, decoding E4M3 to BF16."
    runs: [per_step, per_request]
    takes:
      - {from: "outside: storage", what: "Engram tables inside the GGUF"}
      - {from: "decode-step", what: "New token id"}
      - {from: "prompt-prefill-driver", what: "Batch of prompt tokens"}
    gives:
      - {to: "engram-lookup-compute", what: "Rows for layers 1 and 14"}
    owns_state: ["3-token history (not serialised; rebuilt from the last tokens on load)"]
    exists_because: "The tables are far larger than memory but each token needs only 48 fixed-size rows, whose numbers are known before any layer runs."
    output_effect: none
    decisions:
      - "Bypass the page cache (F_NOCACHE on macOS, POSIX_FADV_RANDOM on Linux)"
      - "Decode: start reads before layer 0, wait at layer 1"
      - "Prefill: sort rows of up to 2048 tokens, reuse duplicate rows, read in parallel"
    when_things_go_wrong: ["Short read becomes EIO and the step fails", "Out-of-range row is rejected"]
    must_never: ["Read through a descriptor that would read ahead and push model pages out"]
    evidence: ["ds4_engram.c 23-135, 175-332, 562-668", "ds4.c 43719-43760", "ds4.c 65337-65338 (delegated)"]
    read: code
  - id: "engram-prewarm"
    engine_name: "ds41_engram_warm, ds4_engram_warm_start"
    does: "When memory clearly allows, reads the Engram tables sequentially in background threads to fill the page cache, stopping under OS memory pressure."
    runs: [startup, background]
    takes:
      - {from: "outside: os", what: "Physical memory size, memory pressure level"}
      - {from: "outside: storage", what: "Engram tables"}
    gives:
      - {to: "outside: os", what: "Page cache pages (a hint, reclaimable)"}
