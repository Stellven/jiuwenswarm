  - {name: "ds4 CLI (ds4_cli.c, linenoise)", what: "Interactive REPL client embedding the engine"}
  - {name: "ds4-agent (ds4_agent.c, ds4_web.c)", what: "Terminal coding agent embedding the engine with its own checkpoint policy, bash tools and web search"}
  - {name: "ds4-bench, ds4-eval, speed-bench/", what: "Benchmarks and quality evaluation against reference cases"}
  - {name: "tests/", what: "Unit, kernel parity and live server tests"}
  - {name: "download_model.sh", what: "Downloader, shard merger and checksum verifier"}
  - {name: "dir-steering/tools", what: "Builds steering direction files from paired prompts"}
  - {name: "QA_BEFORE_RELEASES.md, misc/", what: "Release checklist and planning notes"}
  - {name: "Makefile, ds4_gpu_args.c, ds4_help.c", what: "Build and command-line plumbing"}
surprises:
  - "The expert cache policy differs by backend for the same job: Metal evicts by a decaying selection count that also counts misses, CUDA by plain least-recent use with no heat, and CUDA streaming works only on one GPU."
  - "Two kinds of disk-resident model data are read by row on every token (V4.1 Engram, Qwen n-grams), with row numbers known from token ids before any layer runs; the first DeepSeek layers also route experts by token-id lookup."
  - "DeepSeek session state cannot be rewound by truncation because of the compressor frontier: any rewind outside the last verify block invalidates the session and forces re-prefill or a disk checkpoint."
  - "One model family per process through a global shape table; feature support is a matrix of family x backend x mode, enforced by refusals at startup."
  - "Disk checkpoints are keyed by a hash of rendered text, not tokens, are reused across quantizations by default, and the store rescans the directory on every lookup."
  - "Default speculative sampling at temperature above 0 deliberately changes the output distribution; exact sampling is opt-in."
  - "The server's scheduler gives decode strict priority and never fuses prefill with decode, although the engine has an API for it."
  - "A client stop-sequence hit throws away the live session state."
  - "The CPU backend exists only as a reference; production refuses any CPU placement."
not_read: "Kernel sources under metal/, cuda/, rocm/ and the bulk of ds4_metal.m, ds4_cuda.cu and ds4_rocm*.cu (only the expert cache, TP and memory pieces); most of ds4.c's per-family graph builders (attention, KDA, GDN, HC, vision encoders) beyond shapes and entry points; the tokenizer implementation; GLM MTP and V4 Flash DSpark main loops; gguf-tools sources; ds4_agent.c, ds4_cli.c, ds4_web.c, ds4_eval.c beyond identity; most docs (SERVER.md, SSD_STREAMING.md, SPECULATIVE_DECODING.md, DISTRIBUTED.md, DGX_SPARK.md, PERFORMANCE.md) were not re-read; tests. Server, kvstore, TP, pipeline and multi-GPU placement were read by delegated readers and not re-checked line by line. Nothing was built or run."
