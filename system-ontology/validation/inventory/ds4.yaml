absent:
  - {job: "Computing cold experts on the CPU", why: "Missing experts are always read into the cache and computed on the GPU; layouts needing CPU execution are refused."}
  - {job: "Paged or block KV allocator", why: "Each session allocates full-context state at creation; there is no shared block pool (except Qwen recurrent state slots on Metal)."}
  - {job: "Grammar or JSON-schema constrained decoding", why: "Only a greedy-on-structure sampling switch; tool_choice other than none and response_format are ignored."}
  - {job: "Mixed prefill and decode in one step (continuous batching)", why: "The engine API exists but the server never calls it; decode strictly preempts prefill."}
  - {job: "Request preemption or swapping of running sessions", why: "Busy slots are never evicted; idle slots are saved to disk before reuse."}
  - {job: "Overload admission (queue cap, 429)", why: "Unbounded queue and thread per connection."}
  - {job: "Audio input", why: "No supported model has audio."}
  - {job: "Adapters or LoRA", why: "Not implemented; directional steering is the only run-time weight-free edit."}
  - {job: "Quantization at load time", why: "Files must come pre-converted by the project's tools."}
  - {job: "Metrics or health endpoint", why: "Logging only."}
