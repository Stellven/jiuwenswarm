engine: "ds4 (DwarfStar)"
revision: "b3f50180ec2c7324892be1f50bc83555ccb8d5e7 (2026-11-03)"
basis: "Read in code, directly: ds4.h (public API and options), ds4_ssd.c (whole), ds4_engram.c (structure, reader, batch reader, warmer), ds4.c regions for shape tables (602-950), model_open (2951-3001), engine open (73752-74087), expert profiler (1714-2058), power throttle (17955-17994), prefill layer page-in (20030-20118, 21248-21330), SSD auto cache (71028-71207), GLM memory guard (47210-47264), DSpark scheduler (63216-63335), sampling (46892-46962, 80136-80188), session batch dispatch (82834-82923, 83233-83292, 83943-84015, 88033-88092), V4.1 DSpark round (88302-88433), Qwen sync path (78807-78916); ds4_metal.m expert eviction and heat (14674-14803, 15796-15870); ds4_cuda.cu SSD expert cache (29015-29214, 35570-35851); ds4_rocm.cu head, ds4_rocm_memory.h. Read in code by delegated readers whose reports carry file:line evidence (not re-read line by line by me): ds4_server.c (HTTP boundary, rendering, slots, scheduler, kvstore policy), ds4_kvstore.c, session payload save/load/rewind/invalidate in ds4.c (63008-63120, 65243-66823, 89460-89679), ds4_tp.c/.h, ds4_distributed.c, multi-GPU placement in ds4.c (72209-72713, 74380-74440), ds4_layer_pack.c, ds4_prompt_prefix.c, ds4_agent.c (identity only). Read only in documents: docs/MODELS.md, docs/STRIX_HALO.md, dir-steering/README.md, AGENT.md, parts of docs/QWEN38_FLASH_NEXT.md; gguf-tools/ only its file list and README headings. Earlier notes (engines/ds4.md) were used as a guide and their Metal expert-cache and Engram claims spot-checked."
concurrency: batched
models: "One model family per process, chosen at load from GGUF metadata into a global shape table (ds4.c 602-950, macros 922-950): DeepSeek V4 Flash and V4 PRO, DeepSeek V4.1 Flash, GLM 5.2, GLM 5.3 Flash (and full GLM 5.3), Qwen3.8 Flash Next (internally 'qwen4'). All are large mixture-of-experts models (256 to 512 routed experts per layer, 6 to 10 used, one shared expert). Unusual: DeepSeek V4 keeps a 128-row raw window plus compressed history rows with a learned compressor and an indexer that selects up to 512 compressed rows; the first 3 DeepSeek layers route experts by a token-id hash table, not a learned router; DeepSeek, GLM 5.3 and Qwen use hyper-connections (several residual streams mixed by Sinkhorn-normalised matrices). V4.1 adds two disk-resident Engram lookup tables (189 GiB) indexed by a hash of the last 4 tokens; Qwen adds a 95 GiB BF16 n-gram (per-layer embedding) table also read from disk. GLM 5.3 and Qwen mix in linear-attention layers with recurrent state (KDA, GDN). Draft heads: external DSpark support files for DeepSeek V4/V4.1 (block drafter with a Markov head and a confidence head), built-in MTP blocks for GLM and Qwen. Image input for GLM 5.3, Qwen3.8, V4.1 Flash and the DeepSeek V4 Flash Vision-Exp checkpoint, each with its own encoder file. No audio."
parts:
  - id: "offline-converter-quantizer"
    engine_name: "gguf-tools (deepseek4-quantize.c, deepseek41_quantize.py, glm53_quantize.py, qwen4_pack.py, merge_deepseek41_shards.py)"
    does: "Builds the project's own GGUF files from source checkpoints, with low-bit formats spent on routed experts, layout padding the kernels expect, page-aligned disk tables and separate draft and vision files."
    not: "Not a general GGUF accepter; the engine refuses files whose layout or metadata do not match its shape tables."
    runs: [offline]
    takes:
      - {from: "outside: model_files", what: "Original checkpoints (safetensors, HF n-gram shards, DSpark checkpoints)"}
      - {from: "imatrix-collector", what: "Importance matrix per routed expert tensor"}
    gives:
      - {to: "outside: storage", what: "GGUF main model, DSpark support GGUF, vision encoder GGUF"}
    owns_state: []
    exists_because: "The kernels read tensors in place from the mapped file, so the file layout must already be the execution layout; routed experts dominate size and tolerate aggressive quantization."
    output_effect: changes_output
    output_effect_when: "Always, compared with the original-precision model: quantization is an approximation calibrated by imatrix."
    decisions:
      - "Which tensor format each tensor class gets (routed gate/up, routed down, attention, shared expert, output)"
      - "Whether some layers' routed experts get a higher-precision format (mixed Q2/Q4 recipe)"
      - "Padding of expert input width to a kernel-friendly size (Qwen 640 to 768)"
      - "Alignment of disk-only tables inside the file (Engram 16 KiB)"
    when_things_go_wrong: ["Merge script verifies shard sizes and checksums and keeps the previous default model if verification fails (per docs)"]
    must_never: ["Produce a file whose tensor layout differs from what the engine's shape table expects"]
    evidence: ["gguf-tools/ file list and README headings", "docs/MODELS.md 33-42, 99-108, 145-151"]
    read: docs
  - id: "imatrix-collector"
    engine_name: "imatrix collector (ds4_engine_collect_imatrix)"
    does: "Runs the engine over a calibration text set and accumulates per-expert activation statistics for the gate/up and down matrices, then writes them as an importance matrix."
    runs: [on_demand]
    takes:
      - {from: "outside: operator", what: "Calibration dataset path and token cap"}
      - {from: "routed-expert-ffn", what: "Activations entering each routed expert"}
    gives:
      - {to: "offline-converter-quantizer", what: "Importance matrix file with per-tensor coverage"}
    owns_state: ["Per-layer, per-expert accumulated squared activations and sample counts"]
    exists_because: "Low-bit quantization of routed experts needs to know which input channels matter."
    output_effect: none
    decisions:
      - "Minimum samples per expert before an entry counts as covered"
    when_things_go_wrong: ["Reports coverage of experts that received too few samples"]
    must_never: ["Change inference output while collecting"]
    evidence: ["ds4.c 37488-37716", "ds4.h 343"]
    read: code
  - id: "expert-locality-profiler"
    engine_name: "Metal expert locality profiler (DS4_EXPERT_PROFILE, DS4_EXPERT_HOTLIST)"
    does: "Records every routing decision during a run, simulates per-layer LRU caches of several sizes, and writes a profile and a hot-expert list that can seed the expert cache."
    not: "Not the runtime cache policy; it only observes and writes files."
    runs: [per_layer]
    takes:
      - {from: "expert-router", what: "Selected expert ids and weights per layer and position, and whether the layer is hash-routed"}
      - {from: "outside: operator", what: "Profile and hotlist output paths"}
    gives:
      - {to: "outside: storage", what: "Profile JSON with simulated hit rates per cache size; hotlist file ordered by hits"}
    owns_state: ["Simulated LRU contents, hits and weighted hits per cache capacity and layer"]
    exists_because: "The built-in hotlists that seed SSD streaming were gathered offline from observed routing."
    output_effect: none
    decisions:
      - "Set of simulated cache capacities"
      - "Metal only; ignored with a warning on other backends"
    when_things_go_wrong: []
    must_never: []
    evidence: ["ds4.c 1714-2058", "ds4.c 74040-74054", "ds4.c 24028, 50663"]
    read: code
  - id: "engine-option-validator"
    engine_name: "ds4_engine_open_internal option checks, ds4_acquire_instance_lock"
    does: "At startup refuses option combinations the chosen model family and backend do not support, and takes a machine-wide lock so only one huge model process runs at a time."
    runs: [startup]
    takes:
      - {from: "outside: operator", what: "Command-line options (backend, ssd streaming, TP role, layers, dspark, mtp, vision, power, steering)"}
      - {from: "model-loader", what: "Selected model family and shape"}
    gives:
      - {to: "weight-binder", what: "Accepted configuration"}
    owns_state: ["Instance lock"]
    exists_because: "Each family has a different, partially implemented feature matrix; a wrong combination would fail late or silently mis-execute."
    output_effect: none
    decisions:
      - "Which features each family allows (e.g. Qwen refuses TP, pipeline, multi-GPU, DSpark, external MTP, power below 100)"
      - "Default draft count, MTP margin and DSpark confidence threshold per backend"
      - "Whether vision needs a GPU backend and one GPU"
    when_things_go_wrong: ["Prints the reason and returns failure before allocating"]
    must_never: ["Start with a feature combination the family's graph does not implement"]
    evidence: ["ds4.c 73752-73947", "ds4.c 74026-74039", "AGENT.md 26-29"]
    read: code
  - id: "model-loader"
    engine_name: "model_open, parse_metadata, parse_tensors, config_validate_model"
    does: "Maps the GGUF file read-only, parses metadata and tensor directory, selects the model family shape, and unmaps the regions of disk-only tables so they never count as mapped."
    not: "Does not copy or place weights on a device."
    runs: [startup]
    takes:
      - {from: "outside: model_files", what: "GGUF v3 main model, optional DSpark/MTP and vision GGUFs"}
    gives:
      - {to: "weight-binder", what: "Tensor directory with file offsets and types"}
      - {to: "engine-option-validator", what: "Model family and shape"}
      - {to: "engram-row-reader", what: "Engram table offsets inside the file"}
      - {to: "ngram-row-reader", what: "Qwen n-gram tensor offset"}
    owns_state: ["The file mapping and descriptor", "The global model shape (one family per process)"]
    exists_because: "Every engine needs it; here the shape is a global, so a process serves exactly one family."
    output_effect: none
    decisions:
      - "Shared mapping for GPU backends, private mapping for the CPU backend (to avoid a macOS VM failure)"
      - "Only GGUF version 3; unknown layouts are fatal"
    when_things_go_wrong: ["Dies with a message on open, stat, mmap or metadata failure"]
    must_never: ["Accept a file whose metadata does not match a known shape"]
    evidence: ["ds4.c 2951-3001", "ds4.c 880-950", "ds4.c 73886-73894"]
    read: code
  - id: "weight-binder"
    engine_name: "weights_bind, model_warm_weights, Metal no-copy buffers, CUDA host registration"
    does: "Makes the mapped weights readable by the GPU without a second copy (or copies them when asked), binding only a layer slice or one expert half when the process owns only part of the model."
