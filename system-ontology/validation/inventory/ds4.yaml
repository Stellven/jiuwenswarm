      - {from: "multi-gpu-placer", what: "Which device each layer goes to"}
      - {from: "network-tensor-parallel", what: "Which routed-expert half this rank owns"}
    gives:
      - {to: "gpu-backend", what: "Device-visible views of every bound tensor"}
    owns_state: ["Per-tensor device views and registrations", "Locked non-routed weights in SSD streaming mode"]
    exists_because: "Primary targets are unified-memory machines, where the GPU can read the CPU's mapped pages directly, so one copy suffices."
    output_effect: none
    decisions:
      - "Register the mapping, copy it to device memory, or register only an owned expert range"
      - "Whether to pre-fault (warm) the whole model or only the owned shard"
      - "Whether non-routed weights are wired so streaming cannot evict them"
    when_things_go_wrong: ["Startup fails when a required tensor is missing (e.g. V4.1 vision router biases)"]
    must_never: ["Eagerly copy the whole GGUF in the default Metal path"]
    evidence: ["ds4.c 74055-74087", "ds4.c 71958-71985", "ds4_metal.m 2340-2354 (per notes)", "ds4_cuda.cu 4020-4055, 4152-4187 (per notes)", "AGENT.md 11"]
