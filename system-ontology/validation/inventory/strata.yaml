- id: prompt-path
  engine_name: Prompt path
  does: Read the prompt in large chunks, layer by layer, and leave behind the model state that generation continues from.
  runs:
  - per_request
  takes:
  - from: startup-memory-sizing
    what: Whether the prompt path borrows cache slots or keeps its own buffers, its chunk size, and how many slots a loan
      leaves in the cache.
  - from: engine-command-loop
    what: The prompt token ids of one GEN or BGEN, to be read from the resume point
  - from: resume-decision
    what: How many prompt tokens the session already holds, so reading starts there
  gives:
  - to: kv-store
    what: The model state left by reading the prompt, from which generation continues
  - to: cpu-expert-pool
    what: Experts of a prompt chunk that few tokens route to, handed to the CPU when sharing is armed
  owns_state: []
  exists_because: not recorded in the full description
  output_effect: changes_output
  decisions:
  - Tokens per prompt chunk.
  - The CPU's share of the experts not in fast memory is the accelerator's time per expert over the sum of both times, as
    running averages, kept between these bounds.
  - Sharing is switched off for following layers when the measured time with sharing is not lower than without.
  - An expert may go to the CPU only if it is routed in this chunk, is not in fast memory, is not taken by a second accelerator,
    is routed by no more tokens than the CPU kernel's batch limit, and its weights can be read from slow memory without
    assembling a short-lived buffer. Candidates are taken in order of fewest tokens first.
  when_things_go_wrong: []
  must_never:
