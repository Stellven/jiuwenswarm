- id: expert-cache
  engine_name: Expert cache
  does: Hold a fixed number of experts in fast memory and answer, for any expert, whether it is there and in which slot.
  runs:
  - startup
  - on_demand
  takes:
  - from: startup-memory-sizing
    what: Number of slots, and for a native pack the byte size of each slot in profile order.
  - from: adaptive-tier
    what: A leaving expert is marked absent before its slot is overwritten; an entering expert is marked resident after
      its copy lands
  - from: host-to-device-transfer
    what: Expert bytes copied from slow memory into a cache slot or the staging area
  gives:
  - to: expert-dispatch
    what: For each routed expert, the fast-memory slot holding it or that it is absent
  owns_state:
  - residency_table
  exists_because: not recorded in the full description
  output_effect: none
  decisions:
  - How many slots the cache has. The automatic value is the free fast memory minus a reserve, divided by the largest expert;
    after opening, free memory is read again and the cache is shrunk if the reserve was not really left.
  when_things_go_wrong: []
  must_never:
  - A slot is reported as holding an expert only after that expert's bytes have fully arrived.
  - A slot is not written while any launched computation may still read it.
  evidence:
  - src/program/generate.cpp:13204-13263
  - include/strata/core/expert_cache.hpp
  read: code
  not: Choosing which experts to hold; the adaptive tier does that; Evicting on its own; its basic admit operation never
    evicts; Deciding its own size; startup memory sizing does that
  output_effect_when: bit_exact when the GPU and CPU expert kernels round identically
- id: expert-dispatch
