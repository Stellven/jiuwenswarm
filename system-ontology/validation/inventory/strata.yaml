  takes:
  - from: expert-source
    what: For an expert or a layer, whether its bytes are registered with the GPU driver and at which address the GPU reads
      them in place.
  - from: expert-cache
    what: For each routed expert, the fast-memory slot holding it or that it is absent
  - from: window-loop
    what: 'When a layer signals: the feed-forward input of each row and its routed ids from mapped memory, with the buffer
      the unweighted expert rows are to be written into. Only in the doorbell graph; in the zero-doorbell graph the device
      plans from the residency table and the host is not asked.'
  - from: session-loop
    what: 'Canonical pack only: one token''s feed-forward input, routed ids and weights from the doorbell, with the page-locked
      buffer for the expert rows.'
  gives:
  - to: layer-kernels
    what: Which routed experts the accelerator computes this layer, from cache slots or from the staging area; published
      before CPU work starts
  - to: cpu-expert-pool
    what: The routed experts left to the CPU for this layer of this window
  - to: host-to-device-transfer
    what: Missed experts to copy into the staging area for this window only
  - to: adaptive-tier
    what: How many tokens of the window routed each expert
  owns_state: []
  exists_because: not recorded in the full description
  output_effect: changes_output
  decisions:
  - 'The order in which paths are tried for a routed expert: cached in fast memory; omitted because it ranks low for every
    token of the window; held by a second accelerator; fetched for this window only; computed by the CPU.'
  - A missed expert that every token of the window routes only at this rank or lower is neither fetched nor computed.
  - How many of a layer's missed experts are fetched for this window instead of being left to the CPU. A fixed share, or
    a count from measured CPU and accelerator costs when that option is on.
  when_things_go_wrong: []
  must_never:
  - Every routed expert that is not omitted is computed by exactly one path.
  - The accelerator's share is decided and published before the CPU's share starts, so the two overlap.
  evidence:
