  exists_because: not recorded in the full description
  output_effect: none
  decisions:
  - 'How rows are read. Unless --ple-io is given: the table is held locked in memory when available memory is at least the
    table plus the expert arena still to be filled plus 8 GiB, measured before either is allocated; otherwise unbuffered
    direct reads. Unknown figures admit nothing. STRATA_PLE_AUTO_RAM=0 keeps direct reads. A third mode maps the table without
    locking.'
  - Outstanding storage reads (--ple-inflight, 1 to 1024).
  - Rows kept after being read, 8-way set-associative with round-robin replacement (--ple-row-cache, 0 disables).
  - 'Direct mode with the worker: after this long without a read, read one random page of the table, until 60 s after the
    last request for rows (STRATA_SSD_KEEPALIVE, 0 off).'
  - Direct reads are probed at start; below 15000 rows per second the engine warns and switches to mapped reads only when
    STRATA_PLE_AUTO_MMAP=1.
