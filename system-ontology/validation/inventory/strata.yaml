- id: model-file-reader
  engine_name: Model file reader and architecture guard
  does: Map a GGUF v3 shard read-only, expose its metadata, tensor directory and tensor bytes unchanged, and refuse a file
    whose declared shape the compiled kernels cannot run.
  runs:
  - startup
  - on_demand
  takes:
  - from: model_files
    what: 'The GGUF shards, mapped read-only: header, metadata, tensor directory and tensor bytes.'
  gives:
  - to: startup-memory-sizing
    what: Layer count, widths, expert count and experts per token read from the metadata shard and checked against the compiled
      shapes; every later size is computed from it. The same record is passed to the session, the expert source and the
      expert cache.
  - to: native-weight-loader
    what: Pointers into the mapping for the projections, the output head and the token embedding, uploaded unchanged.
  owns_state: []
  exists_because: not recorded in the full description
  output_effect: none
  decisions:
  - Only GGUF version 3 is read.
  - 'Tensor data alignment: general.alignment when non-zero, else the default.'
  - Only the first items of a metadata array are kept; the count is kept in full.
  - Six metadata keys are required (block_count, embedding_length, expert_count, expert_used_count, attention.head_count,
    attention.head_count_kv); any other key the file lacks keeps the compiled value.
  - Only the expert count, the experts per token and the vocabulary size may differ from the compiled geometry; every other
    shape must match.
  - Upper limit on experts used per token.
  when_things_go_wrong: []
  must_never:
  - Every read of the header is bounds-checked, so a truncated or corrupt file is an error message and never an out-of-range
    read.
  - 'A tensor name resolves to exactly one tensor: a duplicate name in one file, or the same name in two shards, is refused
    at open.'
  - A split model is opened only when every shard is present, declares the same split count and tensor total, and the shards'
    directories add up to that total.
  - The engine runs a file only if its architecture is qwen4exp and every pinned shape equals the shape the kernels were
    compiled for.
  evidence:
  - include/strata/artifact/gguf_reader.hpp:279-866
  - include/strata/artifact/gguf_split.hpp:18-50
  - include/strata/artifact/model_family.hpp:15-63
  - src/artifact/gguf_reader.cpp:1-67
  - src/program/generate.cpp:4380-4405, 4868-4914
  - include/strata/core/family_layout.hpp:1-60
  read: code
  not: Reading the pack directory (weight loader, expert layout); Converting or copying tensor bytes; Filling the expert
    arena (the expert source opens the shards with its own file handles); Checksums of tensor contents
  output_effect_when: bit_exact when always; the class has no transformation (inferred from the code)
