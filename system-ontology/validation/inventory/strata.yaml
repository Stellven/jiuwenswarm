- id: adaptive-tier
  engine_name: Adaptive tier
  does: Keep the expert cache filled with the experts the current conversation uses most, by swapping a bounded number of
    them at fixed intervals.
  runs:
  - background
  takes:
  - from: expert-dispatch
    what: How many tokens of the window routed each expert
  gives:
  - to: host-to-device-transfer
    what: Experts to copy into the slots of experts that are leaving the cache
  - to: expert-cache
    what: A leaving expert is marked absent before its slot is overwritten; an entering expert is marked resident after
      its copy lands
  owns_state:
  - expert_heat
  - pending_swaps
  exists_because: not recorded in the full description
  output_effect: none
  decisions:
  - Run once every this many verify windows.
  - At most this many swaps per run, taken in order of gain across all layers.
  - After each run every usage count is multiplied by this.
  - A swap is made only if the entering expert's count exceeds the leaving expert's by at least this.
  - An expert is a candidate to enter only if its count is at least this.
  when_things_go_wrong: []
  must_never:
  - An entering expert is marked resident only after its copy has landed.
  - A leaving expert is marked absent first; the copy into its slot waits until all work launched before that has completed.
  - A run does nothing while the previous run's copies are still in flight.
  - An expert is only swapped with another expert of the same layer.
  evidence:
  - src/program/generate.cpp:13142-13314
  - src/program/generate.cpp:885-923
  read: code
  not: The size of the cache; Where a missed expert is computed in the current window
  output_effect_when: bit_exact when the GPU and CPU expert kernels round identically
