      measure built from it. Only with STRATA_SPEC_PROB=1 on a sampled request
  gives:
  - to: draft-policy
    what: How many drafts were accepted in the window; the policy pairs it with the round's wall time
  - to: mtp-drafter
    what: The window's target tokens, its position and the last accepted row, from which the drafter catches up its own
      K/V and drafts again
  - to: dflash2-drafter
    what: The committed rows and their position, so the drafter's context ring holds committed rows only
  - to: lookup-drafter
    what: Emitted tokens appended to the lookup history. In the code the host loop makes the call, not the verifier class
  - to: session-loop
    what: The accepted prefix plus the one target token after it; the last one becomes the next window's first row
  - to: window-graphs
    what: Launch the commit graph with the number of rows to keep and their positions (rejected rows carry position -1).
      Not sent after a one-row window, which commits itself
  owns_state:
  - commit_stores
  exists_because: not recorded in the full description
  output_effect: changes_output
  decisions:
  - 'How a draft is judged. Greedy: equal to the row''s argmax. Sampled, default: equal to the row''s sample drawn from
    a random stream keyed by seed and position. Sampled with STRATA_SPEC_PROB=1: accepted with probability min(1, p/q),
    else replaced by a sample from the positive part of p minus q.'
  - 'Under STRATA_SPEC_PROB=1, which confidence gate: pick (masked, not renormalised draft measure with a no-candidate tail)
    or top (gate on the largest probability before the draw).'
  - The pick gate's exact rule is used only with serial decode on one device, no lookup chain, no adaptive swaps, no PCIe
    share, no cost-aware window, no DFlash2, a window of at most 8 rows. Otherwise the older rule runs and the engine warns
    that its distribution is off when the gate fails.
  - A one-row window advances the state inside the window graph and no commit graph is launched.
  - The commit graph is launched without waiting; anything that reads the session from elsewhere waits for it first.
  - All recurrent layers commit in two launches and all attention layers' indexer restore and re-append in one.
