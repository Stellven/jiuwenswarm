    what: Pointers to the blobs of the experts the CPU computes.
  - from: expert-dispatch
    what: The routed experts left to the CPU for this layer of this window
  - from: prompt-path
    what: Experts of a prompt chunk that few tokens route to, handed to the CPU when sharing is armed
  gives:
  - to: layer-kernels
    what: Unweighted expert outputs, one row of n_embd floats per token and rank, in page-locked mapped host memory; rows
      that belong to the GPU are zero. The device copies them, adds its own rows and the combine kernel applies the router
      weights.
  owns_state: []
  exists_because: not recorded in the full description
  output_effect: numeric
  decisions:
  - 'Default: physical cores on the host thread''s socket minus one for the host; one more kept free when that is 16 or
    more; on a hybrid CPU with more efficiency than performance cores at most performance cores minus one plus half the
    efficiency cores; at most a container''s CPU quota minus one; never above 32. A configured count runs as given with
    a warning.'
  - The host thread claims jobs itself during a batch.
  - Row ranges a phase is cut into (--pool-tasks, 0 to 4096).
  - A parked worker spins this long, then sleeps on a condition variable (STRATA_POOL_SPIN_US).
  - A wait that sees no progress this long stops the process after releasing the GPU's waits.
  - 'Single-token path: one job per missed expert, whole or split by rows across threads. Window path: one job per distinct
    missed expert carrying every token routed to it, in two row phases (gate and up rows, then down rows) with a quantisation
    between.'
  - With two or more memory nodes the row phases are split one slice per node when that can run (STRATA_NUMA_POOL=0 turns
    it off).
  when_things_go_wrong: []
  must_never:
  - A claim succeeds only for the batch the thread woke for, so a late worker can never take or count a job of the next
    batch.
  - A batch is published only when every worker is parked, and the call returns only when every job is done and every worker
    is parked again.
  - Each output row is written by exactly one thread.
  - A row that belongs to the GPU is written as zeros by the host or the device, never left with the previous layer's content.
  - Nothing is allocated while a batch runs.
