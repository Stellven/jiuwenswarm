- id: startup-memory-sizing
  engine_name: Startup memory sizing
  does: Give the expert cache the device memory that remains after weights, session, drafter and output head, minus a reserve
    and minus later allocations priced in advance; and when that is too little, step down through fixed last resort before
    ending the start.
  runs:
  - startup
  takes:
  - from: model-file-reader
    what: Layer count, widths, expert count and experts per token read from the metadata shard and checked against the compiled
      shapes; every later size is computed from it. The same record is passed to the session, the expert source and the
      expert cache.
  - from: expert-layout
    what: The largest blob and each layer's blob size, the unit the expert cache's slots are counted in.
  - from: external
    what: 'Command-line flags and environment: context length, expert cache size or auto, reserve, prompt chunk, pipeline
      windows.'
  - from: external
    what: Free device memory as the driver reports it, read before the cache is sized and again after its slots are written.
  - from: launch-argument-resolver
    what: Context length, KV format and resident window, VRAM reserve, resident budget, expert cache request and batch slot
      count, as engine arguments
  gives:
  - to: expert-cache
    what: Number of slots, and for a native pack the byte size of each slot in profile order.
  - to: prompt-path
    what: Whether the prompt path borrows cache slots or keeps its own buffers, its chunk size, and how many slots a loan
      leaves in the cache.
  - to: native-weight-loader
    what: 'Last resort when the cache has no slot: move the output head from the card to page-locked host memory.'
  owns_state: []
  exists_because: not recorded in the full description
  output_effect: numeric
  decisions:
  - Device memory left free once everything is loaded.
  - Device memory the load allocates after the cache that no setting prices; left out of the cache unless that would take
    it below the minimum slot count. Zero under STRATA_DEFAULTS=026.
  - slots = (free - reserve - late) / largest slot when that is at least the minimum and positive, else (free - reserve)
    / largest slot; reserve = vram-reserve + prompt buffers + draft head bind size + pipeline windows; capped by the number
    of ranked pairs in the expert profile.
  - 'Price of the prompt path''s own buffers when it does not borrow cache slots: 160 + chunk * 680 / 1024 MiB; STRATA_OWNED_PRICE=exact
    prices the real allocation plus 64 MiB.'
  - 'Least working cache: slots for a 256-token prompt chunk''s buffers plus the slots a loan leaves behind, or 1 without
    a borrowing prompt path.'
  - Slots a loan to the prompt path leaves in the cache.
  - Lowest value the reserve is lowered to so that the minimum cache fits.
  - Extra kept free when the prompt path is given its own small buffers.
  - For a native pack with a profile the uniform slot count becomes a byte budget, and slots of each layer's own blob size
    are taken in profile order until it is used, so the final count can exceed the uniform one.
  - After the cache is opened its slots are zeroed and free memory is read again; while more than 64 MiB short of the reserve
    the cache is reopened smaller.
  - When an automatic cache cannot be allocated it is retried at three quarters of its size.
  - 'When the automatic cache is below the minimum on one discrete GPU and the reserve was not given by hand: keep 16 slots
    behind a loan; lower the reserve to the floor; give the prompt path its own buffers at 1024, 512 or 256 tokens; move
    the output head to host memory; then report what is short. STRATA_SPILL_OFF=1 and STRATA_HEAD_HOST_OFF=1 disable steps.'
  - --expert-cache N is kept as asked; 0 and auto both mean the automatic rule.
  when_things_go_wrong: []
  must_never:
  - The dense weight range is allocated before the K/V state and the expert cache, and the expert cache is sized only after
    weights, session, drafter and output head are in place.
  - With an automatic cache, the reserve is checked against free memory read after the cache's slots have been written,
    not before.
  - The start ends with a message when the weight range, the session state, or an explicitly sized expert cache cannot be
    allocated; it is never continued with a smaller explicit size silently.
  evidence:
  - src/program/generate.cpp:5189-5232, 6764-6771, 7890-8192, 8199-8251, 8320-8440
  - include/strata/core/auto_cache.hpp:1-47
  - include/strata/core/uma_cache.hpp:1-45
  read: code
  not: 'A plan record: there is none; each number goes straight into an allocator call or an option; The standalone calculator
    in plan.hpp (not called by the engine); The session size (allocated from the context length by the session code); Host
    memory decisions (host memory admission); The integrated-GPU rule of uma_cache.hpp (compiled only for HIP builds)'
  output_effect_when: bit_exact when the sizing only moves where bytes are read from (output head on host, smaller prompt
    chunks); inferred; numeric when the slot count changes which experts the GPU computes
- id: host-memory-admission
  engine_name: Host memory admission and page-locked headroom
  does: Decide at startup, from host memory readings taken before the allocations, whether the n-gram table is locked in
    RAM and whether the expert arena is loaded or replaced by the file source, and hold back page-locked memory while the
    arena registers so that later small page-locked buffers succeed.
  runs:
  - startup
  - on_demand
  takes:
  - from: expert-layout
    what: Total bytes of all routed experts, the arena size the n-gram table is priced against.
  - from: external
    what: Available RAM, the tightest cgroup limit, and the operator's --ram-keep-gib and --ple-io settings.
  - from: expert-source
    what: Whether RAM was short, and how many bytes of the arena the GPU driver registered (used for the page-locked reserve's
      release and its hint).
  gives:
  - to: ngram-reader
    what: Whether the n-gram table is mapped and locked in RAM or read directly from storage; and later, an instruction
      to give the lock back when the arena or the conversation cache needs the RAM.
  - to: expert-source
    what: Whether reading from the file source instead is allowed, the RAM to keep free, the headroom under a hard limit,
      and the budget of the reduced RAM copy.
  owns_state: []
  exists_because: not recorded in the full description
  output_effect: none
  decisions:
  - The n-gram table is locked in RAM only if available RAM holds the table, the whole expert arena still to be filled,
    and a headroom; unknown availability, table size or expert size admits nothing. Considered only when --ple-io was not
    given and STRATA_PLE_AUTO_RAM is not 0.
  - Load when the arena's need fits; when a hard memory limit or the available RAM is below the need, fall back to the file
    source if allowed, else refuse (hard limit) or warn and load (available RAM).
  - The engine may swap the arena for the file source on its own unless --ple-io ram was given by hand, a shared arena file
    is named, or STRATA_ARENA_RAM_FALLBACK=0.
