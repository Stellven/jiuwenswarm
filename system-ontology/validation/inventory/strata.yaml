- id: weight-loader
  engine_name: Pack weight loader
  does: Copy every tensor the pack index lists, except those in a skip set, into one device memory range at its recorded
    offset, applying the byte transform the index names for each plane, and return a table from tensor name to location.
  runs:
  - startup
  takes:
  - from: model_files
    what: The pack's index.txt and data files (dense.bin, embd.bin, extra.bin), read in 8 MiB chunks.
  - from: native-weight-loader
    what: The names of the tensors the native loaders will serve, so the pack loader skips them and its device range is
      sized without them.
  gives:
  - to: native-weight-loader
    what: The name-to-location table; the native loader checks each projection against its row and attaches the GGUF-form
      pointer to it.
  - to: layer-kernels
    what: Device locations of the dense tensors in engine form, by name.
  owns_state: []
  exists_because: not recorded in the full description
  output_effect: changes_output
  decisions:
  - Source bytes read and uploaded per round.
  - 'One of four transforms per plane, named by the index row: copy; keep the high 16 bits of a BF16 value stored as 32
    bits; convert an F16 value stored as 32 bits back to 16; widen an fp16 scale plane to 32 bits.'
  - Tensors another loader serves are not read; their rows keep metadata and no bytes. --keep-canonical loads both forms.
  - 'STRATA_HC_REQ8=1 on one GPU: the hyper-connection projections are requantized to int8 with one scale per 32 values
    instead of being loaded as BF16. Off by default.'
  when_things_go_wrong: []
  must_never:
  - A row of the index that does not parse to exactly 19 fields refuses the whole load; no partially parsed index is used.
  - Nothing is written unless the supplied device range is at least as large as the index requires.
  - The plane layout the loader builds for a tensor must sum to the source and destination byte counts the index records,
    or the load is refused.
  - 'A widened or narrowed plane is never cut inside an element: odd fp16 byte counts are refused and a chunk never ends
    on half an element.'
  - Converted bytes are written to a host buffer and cross to the device once; host code never writes through a device address.
  evidence:
