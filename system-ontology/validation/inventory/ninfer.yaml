surprises:
  - "The engine binary is compiled for one machine class (NINFER_TARGET_SPARK or RTX 5090) and kernels register fixed shape profiles per model (e.g. fold geometry 48 layers x 16/48 heads); support is a property of model x machine, not a generic dispatch."
  - "Speculative commit is a separate multi-store transaction after acceptance and after frontend trimming: recurrent state is replayed from compact transition records into a destination record, the draft layer's history is rebuilt from real backbone features, and its bitwise reference is the same verify block, not plain decoding."
  - "The reusable part of the GPU expert cache changes role with batch size: extra resident experts when few tokens, two per-layer streaming windows when many; what is resident is fixed from an offline calibrated table, never from run-time use."
  - "MoE layers can be split between GPU and a pinned CPU thread team computing directly on encoded host weights, with the split decided per layer from a snapshot of ready experts; outputs depend numerically on cache readiness."
  - "Recurrent state can only be restored at saved checkpoints, so prefix reuse is a cost-ranked choice among device, host, peer-rank checkpoints and recomputation, using calibrated per-machine cost presets."
  - "Prefill and decode never share a batch; each control cycle submits at most one forced-control span, one decode round and one prefill chunk."
  - "A per-layer embedding table larger than device memory is read row by row from the model file on disk with io_uring each step, keyed by token n-gram hashes."
  - "Two-machine collectives default to a hand-written RDMA verbs backend, not NCCL, on two-rank Spark."
  - "Sampling top-k is capped at 20 candidates, and randomness is keyed by (seed, logical position, purpose), independent of batch row."
  - "Memory planning measures CUDA graph capture growth by capturing, releasing and re-capturing before sizing the context pool, and keeps three different headroom notions."
not_read: "Most kernel bodies under src/ops (only CPU NVFP4 MoE launch and the GDN fold access header were opened); all GLM5Next model code (KDA, Kpool MLA, mHC) beyond its document; Qwen3.5 programs other than draft.cpp; src/models/common/context/directory.cpp, context_pool.cpp and resource_manager.h body (relied on earlier notes' line-checked claims for resource_manager.h, placement_policy.cpp, offload resources.cpp and execution.cpp, qwen4_exp parallel plan.cpp, storage.cpp); distributed_executor.h and wire protocol bodies; tokenizer, Jinja and tool parser code; vision tower math; dashboard; tests; docs/designs, docs/serving.md, docs/weight-conversion.md beyond grep, build-system.md."
