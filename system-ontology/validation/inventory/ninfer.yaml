basis: "Read in code: tools/convert (pipeline.py, proposal.py, official_recipes.py qwen3_8_flash_next, methods.py and methods_csf.py outlines, quantization/ outlines); bench/context_cost/context_cost_bench.cpp (calibration report and preset writing); src/runtime/engine (scheduler.h whole, engine_schedule.inl begin_cycle/advance_cycle/worker_loop/try_admit_one/reclaim/pause_resident, engine_execution.inl commit_pending, generation_budget.h, startup_memory.h, context_capacity.cpp comments, context_cache/capture_policy.cpp, context_cost_defaults.cpp); src/runtime/executor (contract.h, executor.h, local_executor.h outline); src/core (decode_graph.h, expert_cache.h and expert_cache.cpp checks, context_pool.h, gdn_replay_records.h, cpu/executor.h, io/read_queue.h); src/models/common (graph_preparation.cpp, moe/offload/plan.cpp, context/directory.h, transfer.h, snapshot.h, recovery.h, checkpoint_store.h comments); src/models/qwen4_exp (program/device_graphs.cpp whole, program/commit.cpp whole, program/mtp.cpp draft_forward, program/planning.cpp options, parallel/expert_priority.cpp header, ple/disk/row_reader.h, ple/disk/prepare.h, ple/upload.h, ple/hash.h); src/models/qwen3_5/execution/draft.cpp outline (DFlash/DFlash2); src/distributed (communication.h, communication/selection.cpp, communication/native/rdma.h and protocol.h, bootstrap.h, transport.h comments); kernels: src/ops/moe/kernels/cpu/nvfp4/launch.cpp, src/ops/linear_attention/gated_delta_net/replay/fold_io.cuh opening, directory listings of src/ops families and linear/nvfp4 kernels; include/ninfer/ops speculative_accept.h and sampling.h contracts; src/text/grammar.h; src/models/common/frontend/output_session.h; src/serve (http_server.cpp routes, generation_service.h, openai_responses_store.h, openai_responses_state.cpp opening, metrics.cpp); src/product/media_acquire/acquire.h; src/media/decode/decode.h limits. Read in documents only (all of each): docs/maintainer engine-architecture, expert-weight-cache, context-management, speculative-decoding, distributed-execution, weights-and-loading, frontend, observability, qwen4_exp-model, op-development (first half), glm5next-model (first half). Earlier notes engines/ninfer.md used as a guide; their code-checked claims for offload resources.cpp, execution.cpp, resource_manager.h, placement_policy.cpp, qwen4_exp/parallel/plan.cpp and storage.cpp were relied on with their line numbers, not all re-read. Not read: most kernel bodies, GLM5Next code, Qwen3.5 programs other than draft.cpp, directory.cpp, context_pool.cpp, resource_manager.h body, distributed_executor.h body, tokenizer/jinja code, vision tower code, dashboard."
concurrency: batched
models: "Qwen3.5 dense (Qwen3.6-27B, Qwen3.8-27B) and Qwen3.5 MoE (Qwen3.6-35B-A3B), Qwen4Exp (Qwen3.8-Flash-Next) and GLM5Next (GLM-5.3-Flash). One engine instance serves one model, up to 8 concurrent requests. Unusual: hybrid recurrent plus attention layers (GDN or KDA linear attention with large fixed-size recurrent state, plus QSA sparse attention or Kpool sparse MLA that compress index keys every 4 tokens and pick top-K blocks); mixture of experts with 512 experts and top-10 routing (Flash Next); a per-layer embedding (PLE) lookup table of about 2.5 million rows per shard x 128 shards addressed by hashes of 2- and 3-token n-grams; four-stream gated residual (HC / mHC) mixing; a built-in MTP draft layer with its own attention and MoE; external block draft models (DFlash, DFlash2) for the 27B and GLM; vision tower (images and video). Weights are stored per role in NVFP4, block FP8, 8-bit, NF4 or BF16 and consumed encoded."
parts:
  - id: "checkpoint-converter"
    engine_name: "tools/convert (Model, Recipe, official recipes, ArtifactWriter)"
    does: "Turns a published checkpoint (or several, e.g. a base BF16 checkpoint plus an NVIDIA NVFP4 one) into a .ninfer v3 artifact: maps source tensors to logical roles, picks a storage format and encoding method per role, merges and orders parent matrices, records per-use activation permits and auxiliary divisors, and writes framed object files plus a conversion report."
    not: "Not a loader and not a runtime quantizer; the engine never re-encodes weights at load except value-preserving scale-block refinement."
    runs: [offline]
    takes:
      - {from: "outside:model_files", what: "source safetensors checkpoints (BF16 base, NVIDIA ModelOpt NVFP4 / FP8 block, compressed-tensors), config, tokenizer and template resources"}
      - {from: "outside:operator", what: "recipe name, output path, device, chunk size, source cache size"}
    gives:
      - {to: "outside:storage", what: ".ninfer artifact (entry file plus continuation volumes) with objects, bindings, uses, resources, provenance; and a .conversion.json report"}
    owns_state: ["the mapping from source tensor names to logical parameters and object layouts for one conversion"]
    exists_because: "the engine's kernels read only its own encoded formats and layouts, and the published checkpoints are in other formats and orders"
    output_effect: changes_output
    output_effect_when: "against the source BF16 model: every quantized role (NVFP4 experts, Q8 projections, block FP8 MTP experts, NF4 PLE table) changes values; imported NVFP4 keeps codes but rounds 1/multiplier to an FP32 divisor"
    decisions:
      - "which storage format and encoding method each logical role gets (import encoded, grouped absmax, row/block FP8 maxabs, stored-scale MSE search for NF4, direct cast)"
      - "which source checkpoint supplies each role when several are given"
      - "how parent matrices are merged and ordered so that history-only computation can borrow a contiguous prefix (K, V, index-K first)"
      - "which activation permit (A16Only, AllowA8, AllowA4) each use of a weight carries"
      - "how convolution weights are re-laid out (tap outside, channel contiguous)"
      - "which architecture constants must match before a recipe applies"
    when_things_go_wrong: ["refuses to overwrite an existing output or report", "raises with the parameter, method and format named when a job fails", "rejects a source whose expert tensors are incomplete or whose activation multipliers differ within a layer", "rejects a recipe when the config does not match its expected geometry"]
    must_never: ["change token-ID row order of the vocabulary", "silently drop a source tensor that the recipe claims to cover"]
    evidence: ["tools/convert/pipeline.py 29-156", "tools/convert/official_recipes.py 189-392", "tools/convert/methods.py (method list 205-471)", "tools/convert/quantization/", "tools/artifact/writer.py", "docs/maintainer/weights-and-loading.md 6-63"]
    read: code

  - id: "draft-head-builder"
    engine_name: "proposal head (tools/convert/proposal.py), optimized draft head"
    does: "Generates an extra 4-bit (q4_g64) copy of the main output head for draft use only, either over the full vocabulary or over a shortlist of the most frequent tokens chosen from an offline token-frequency ranking, storing the shortlist's token-ID map."
    not: "Not the verification head; the target always verifies with the main head."
    runs: [offline]
    takes:
      - {from: "outside:model_files", what: "main output head source"}
      - {from: "outside:storage", what: "token frequency counts (tools/freq_corpus/fixtures/ranking/ranking.train.counts.i64)"}
    gives:
      - {to: "checkpoint-converter", what: "proposal/head parameter (and proposal/token_ids for the indexed domain) added to the recipe"}
    owns_state: []
    exists_because: "drafting multiplies by the full vocabulary head every draft step; a cheaper head speeds drafting while verification keeps the target exact"
    output_effect: none
    output_effect_when: "changes only the acceptance rate; the target distribution and committed output rule are unchanged"
    decisions:
      - "full vocabulary or frequency-indexed shortlist, and how many rows"
      - "which special tokens are forced into the shortlist"
      - "which storage format the draft head uses"
    when_things_go_wrong: ["rejects a ranking file that is not whole int64 vocabulary rows", "rejects a second proposal head", "requires an explicit source when the main head is split across sources"]
    must_never: ["change the target vocabulary or the main head"]
    evidence: ["tools/convert/proposal.py 14-121", "docs/maintainer/weights-and-loading.md 35-36", "src/models/qwen3_5/execution/draft.cpp 473-488 (remap_ids_inplace for indexed proposals)"]
    read: code

  - id: "context-cost-calibrator"
    engine_name: "ninfer_context_cost_bench (bench/context_cost)"
    does: "Measures device-to-host, host-to-device and device-to-device context copy times and prefill recomputation times on the actual machine and model, fits the cost model, accepts or rejects the fit on held-out error and ordering, and writes a machine/model cost preset JSON."
    not: "Not a benchmark of serving throughput; its output is a policy input to restore-source choice."
    runs: [offline]
    takes:
      - {from: "outside:operator", what: "artifact path, corpus, repetitions, chunk size"}
      - {from: "outside:os", what: "GPU identity, driver and runtime versions"}
    gives:
      - {to: "outside:storage", what: "calibration report and an upserted preset keyed by hardware class and model prefill signature"}
      - {to: "context-resource-manager", what: "transfer and recompute cost coefficients (via the preset file named in configuration, or compiled-in defaults copied from earlier runs)"}
    owns_state: []
    exists_because: "the right restore source (copy a checkpoint or recompute) depends on this machine's copy bandwidth and this model's prefill speed"
    output_effect: none
    output_effect_when: ""
    decisions:
      - "cost model form: max(batch + copies x per-copy, bytes x per-byte) for transfers; chunk, token, attention-pair, vision-item and patch terms for recompute"
      - "acceptance limits on p95 relative error and ordering significance"
      - "how a preset is keyed (hardware class string, prefill signature hash)"
    when_things_go_wrong: ["exits non-zero and writes no preset when the fit is rejected"]
    must_never: ["overwrite a preset with a rejected fit"]
    evidence: ["bench/context_cost/context_cost_bench.cpp 360-505", "src/runtime/engine/context_cache/context_cost_defaults.cpp 1-86"]
    read: code

  - id: "expert-priority-table"
    engine_name: "kFlashNextExpertPriority, default_expert_priority (and Qwen3.6-35B-A3B moe_priority.cpp)"
    does: "Supplies, compiled into the binary, a per-layer ranking of all experts from highest to lowest cache priority, derived from an offline routing-count calibration over 128 tasks in nine domains, with a geometry check that decides whether the table applies."
    not: "Not a run-time usage counter; nothing updates it while serving. The program that produced it is not in the repository."
    runs: [startup]
    takes:
      - {from: "outside:operator", what: "optional explicit priority override in options"}
    gives:
      - {to: "expert-residency-planner", what: "per-layer expert order for fixed and extra cache contents"}
      - {to: "partition-planner", what: "per-layer expert order whose even/odd ranks split experts between two ranks under EP2"}
    owns_state: ["the static ranking tables"]
    exists_because: "expert use is skewed and stable across requests, so one offline ranking predicts which experts are worth keeping on the GPU"
    output_effect: none
    output_effect_when: ""
    decisions:
      - "which estimator turned routing counts into ranks"
      - "the geometry (hidden size, layers, experts, top-k) under which the default table applies; otherwise identity order"
    when_things_go_wrong: ["rejects an override that does not cover every layer or is not a permutation"]
    must_never: ["change routing; it only chooses copies and placement"]
    evidence: ["src/models/qwen4_exp/parallel/expert_priority.cpp 8-12 and table", "src/models/qwen4_exp/program/planning.cpp 30-52", "src/models/common/moe/offload/plan.cpp 228-234", "src/models/qwen3_5/program/planning/moe_priority.cpp 8"]
    read: code

  - id: "configuration"
    engine_name: "product/config (TOML schema, CLI options, EngineOptions)"
    does: "Turns the TOML file, command-line options and environment variables into one validated set of startup options (model, max concurrency, max context, prefill chunk, KV encoding, speculative backend and draft count, proposal head, CUDA graph on/off, context cache sizes and cost presets, vision, sampling defaults, server and logging)."
    not: "Does not interpret parallel strategy or storage formats; model preparation validates what its model supports."
    runs: [startup]
    takes:
      - {from: "outside:operator", what: "ninfer.toml sections [model] [engine] [context_cache] [speculative] [vision] [media] [generation] [server] [logging] [observability], CLI flags, NINFER_* environment variables (VRAM budget, CUDA sync mode, expert offload, indexer precision)"}
    gives:
      - {to: "startup-memory-planner", what: "budgets and capacity requests"}
      - {to: "model-definition-loader", what: "artifact path and selected components"}
      - {to: "rank-program", what: "max concurrency, max context, prefill chunk, draft count, KV encoding, graph mode"}
      - {to: "context-resource-manager", what: "host cache size, cost preset path"}
      - {to: "http-api", what: "server address, responses store limits"}
    owns_state: ["the normalized startup option set"]
    exists_because: "every engine needs it"
    output_effect: changes_output
    output_effect_when: "KV encoding, sampling defaults and draft head choice change outputs compared with the defaults"
    decisions:
      - "which options a model accepts (e.g. Qwen4Exp MTP draft count 1 to 5, chunk a multiple of 128, scoring requires one lane)"
      - "defaults per model (prefill chunk 4096 for Qwen4Exp, GLM and offload, else 1024)"
    when_things_go_wrong: ["rejects options the selected model does not support before loading"]
    must_never: ["let a later layer reinterpret a default differently from the engine's normalized value"]
    evidence: ["src/product/config/", "ninfer.example.toml", "src/models/qwen4_exp/program/planning.cpp 55-77", "docs/startup-configuration.md"]
    read: code

  - id: "model-definition-loader"
    engine_name: "artifact Reader, Binder, ModelDefinition"
    does: "Opens the artifact's directory and files, checks framing, reads resources (tokenizer, template, PLE hash controls), and binds logical parameters with their shapes, uses and activation permits for the selected components into a device-free model definition."
    not: "Does not read weight payloads or place anything on a device."
    runs: [startup]
    takes:
      - {from: "outside:model_files", what: ".ninfer entry and continuation files"}
      - {from: "configuration", what: "artifact path and selected optional components (MTP, vision, proposal head)"}
    gives:
      - {to: "partition-planner", what: "global config and bindings"}
      - {to: "shard-materializer", what: "object ranges and codec descriptions"}
      - {to: "prompt-preparer", what: "tokenizer, template, generation and processor resources"}
    owns_state: ["the cold artifact directory and lazily opened file handles"]
    exists_because: "the artifact stores encoded objects and bindings, not an executable graph; the native model code needs logical parameters"
    output_effect: none
    output_effect_when: ""
    decisions:
      - "which optional components and resources are bound"
    when_things_go_wrong: ["rejects framing or length mismatches against the directory", "reports missing bindings for a selected component"]
    must_never: ["let checkpoint names or quantization metadata choose the execution architecture"]
    evidence: ["src/artifact/reader.h 21-46", "src/artifact/binder.h 28-29", "docs/maintainer/weights-and-loading.md 6-40"]
    read: code

  - id: "partition-planner"
    engine_name: "ParallelPlan (models/*/parallel/plan.cpp, models/common/parallel*.cpp)"
    does: "Derives from the global config and bindings how one model is split across ranks: which heads, intermediate columns, experts and vocabulary rows each rank holds, what is replicated (router, indexer, embedding, residual mixing), where results must be reduced or gathered, and a 64-bit topology identity."
    not: "Not request placement and not data parallelism; there is one model copy split across ranks."
    runs: [startup]
    takes:
      - {from: "model-definition-loader", what: "global config and bindings"}
      - {from: "expert-priority-table", what: "expert order for EP2 parity split"}
      - {from: "configuration", what: "rank count, TP and EP degree"}
    gives:
      - {to: "shard-materializer", what: "per-rank rectangular selections of each logical parameter"}
      - {to: "collective-communication", what: "communication roles and required collective shapes"}
      - {to: "layer-compute", what: "local geometry (local heads, local vocabulary, local experts)"}
      - {to: "context-directory", what: "per-rank state placement"}
    owns_state: ["the immutable partition plan and its topology hash"]
    exists_because: "GLM (178 GiB) and Flash Next (101 GiB) do not fit one DGX Spark, so one model must be split across two machines"
    output_effect: numeric
    output_effect_when: "compared with one rank: reductions split sums into halves and add them in a different order"
    decisions:
      - "TP only, or TP2 with EP1 (each expert's intermediate halved) or EP2 (whole experts alternate by priority rank)"
      - "which parts are replicated instead of communicated"
      - "how the output head is split (by vocabulary)"
      - "where the PLE table lives (device shards on two Sparks, disk otherwise)"
    when_things_go_wrong: ["rejects any combination other than one rank or TP2 with EP1/EP2 for Qwen4Exp"]
    must_never: ["renormalize routing coefficients over a local expert subset", "cut a merged parent in half instead of slicing by role", "let replicated discrete decisions (router, indexer top-K) differ between ranks"]
    evidence: ["src/models/qwen4_exp/parallel/plan.cpp 8-182 (per earlier notes)", "docs/maintainer/distributed-execution.md 15-25", "docs/maintainer/qwen4_exp-model.md 71-91"]
    read: code

  - id: "shard-materializer"
    engine_name: "Materializer, EncodedSlice, Placement, FileBacking, ModelShard"
    does: "Reads exactly this rank's encoded rectangles of each parameter from the artifact files through bounded staging and builds stable backing on the device, in ordinary host memory, in CUDA-registered host memory, or left as file backing, then holds them as the rank's immutable weights."
    not: "Does not re-quantize; refining block-FP8 scale blocks repeats scale words and keeps represented values."
    runs: [startup]
    takes:
      - {from: "outside:model_files", what: "encoded object bytes"}
      - {from: "model-definition-loader", what: "object ranges and codecs"}
      - {from: "partition-planner", what: "per-rank selections"}
      - {from: "startup-memory-planner", what: "device and host budgets"}
    gives:
      - {to: "layer-compute", what: "parameter views of resident weights"}
      - {to: "host-expert-store", what: "main routed experts in registered host memory (RTX 5090 offload)"}
      - {to: "ple-row-source", what: "PLE table as file backing (disk path) or device shards (two Sparks)"}
    owns_state: ["the rank's weight backings and their registration lifetimes"]
    exists_because: "each rank needs only its slice, and the full model does not fit one device"
    output_effect: none
    output_effect_when: ""
    decisions:
      - "which location each parent goes to (device, registered host, ordinary host, file)"
      - "how reads are aligned and deduplicated when several destinations share a source"
      - "whether a slice can be expressed value-preservingly, else the format rejects it"
    when_things_go_wrong: ["rejects a slice its format cannot express exactly", "reports metadata and binding errors from the owning module"]
    must_never: ["load the full model onto a device and cut it afterwards", "release a backing before its consumers and registration end"]
    evidence: ["src/artifact/materializer.h", "src/artifact/encoded_slice.h 18-50", "src/artifact/placement.h 18-76", "src/artifact/backing.h 9-39", "docs/maintainer/weights-and-loading.md 65-91"]
    read: code

  - id: "startup-memory-planner"
    engine_name: "StartupMemoryBudget, context capacity solver, graph calibration"
    does: "Prices fixed weights, workspace, transition records, vision window, communication and allocator metadata per rank, measures graph capture growth by capturing, releasing and recapturing, and sizes the shared context backing from what remains, keeping planning headroom, a mandatory host reservation and a final whole-instance check apart."
    not: "Does not size the expert cache; the expert residency planner uses what is left after it."
    runs: [startup]
    takes:
      - {from: "configuration", what: "VRAM budget, explicit capacities, host reservation"}
      - {from: "rank-program", what: "record layouts, required working set, execution resource needs"}
      - {from: "execution-graphs", what: "measured capture and rebuild memory growth"}
      - {from: "outside:os", what: "device memory snapshots"}
    gives:
      - {to: "context-pool", what: "context backing capacity per rank and domain"}
      - {to: "expert-residency-planner", what: "remaining device bytes"}
    owns_state: ["initial memory snapshot, limit, headroom and host reservation"]
    exists_because: "the engine must prove at startup that the minimum legal working set of a request fits, on machines where host and device may share one physical memory"
    output_effect: none
    output_effect_when: ""
    decisions:
      - "how much headroom planning may consume versus what must stay free after initialization"
      - "separate device and host accounting on discrete GPUs; one physical budget on shared-memory Spark"
      - "per-rank capacity; never use the sum over machines"
      - "bounded correction of automatic capacity after an over-budget preparation; explicit capacity kept"
    when_things_go_wrong: ["fails startup with the owning module's reason when the minimum working set does not fit", "tightens the runtime limit and retries automatic capacity once over budget"]
    must_never: ["double-charge memory retained by the driver after graph release", "count the same bytes twice (expert ready bytes, registered host ranges, vision sub-windows are parts of their parents)"]
    evidence: ["src/runtime/engine/startup_memory.h 8-37", "src/runtime/engine/context_capacity.cpp 158-159", "src/models/common/graph_preparation.cpp 24-46", "docs/maintainer/engine-architecture.md 42-69"]
    read: code

  - id: "expert-residency-planner"
    engine_name: "moe::offload resolve_plan / plan_cache"
    does: "At startup jointly solves, from the remaining device bytes, the per-layer fixed expert set, the reusable region, whether it holds two streaming windows or one, the small-T extra-cache target, the CPU worker count and the CPU/GPU split threshold per layer; refuses to run if no solution exists."
    not: "Does not change cache contents while serving."
    runs: [startup]
    takes:
      - {from: "startup-memory-planner", what: "available device bytes"}
      - {from: "expert-priority-table", what: "per-layer expert order"}
      - {from: "outside:os", what: "CPU topology"}
      - {from: "configuration", what: "requested CPU workers, expert offload switch"}
    gives:
      - {to: "expert-cache", what: "capacity, fixed bytes, fixed layout, extra layout, window regions, upload slot count"}
      - {to: "offload-mode-switch", what: "per-layer fixed, cache and stream layouts and window count"}
      - {to: "hybrid-moe-dispatch", what: "per-layer token threshold (64 x workers / 15, clamped 1 to 64)"}
      - {to: "cpu-expert-team", what: "worker CPUs and the caller CPU left free"}
    owns_state: ["the offload plan"]
    exists_because: "the routed experts of Flash Next (about 63 GiB) do not fit a 32 GiB RTX 5090 while only 10 of 512 experts per layer are used per token"
    output_effect: numeric
    output_effect_when: "which experts are resident decides which run on GPU versus CPU in small-T steps, and the two paths round differently"
    decisions:
      - "balanced per-layer byte share for the fixed region, largest that still leaves each window room for the worst layer's missing experts"
      - "two windows first, one window if two do not fit"
      - "CPU workers min(16, cores - 1) unless given"
      - "upload slots at least 3, enough for two largest banks in 96 MiB batches"
    when_things_go_wrong: ["returns no plan, so startup fails, when even one window cannot fit"]
    must_never: ["move fixed entries after startup"]
    evidence: ["src/models/common/moe/offload/plan.cpp 10-16, 120-283", "docs/maintainer/expert-weight-cache.md 21-40"]
    read: code

  - id: "execution-graphs"
    engine_name: "DecodeGraphDefinition / Executable / Section, DeviceGraphs, GraphPreparation"
    does: "Captures at startup one outer CUDA graph per batch size and round type (plain decode, draft plus verify), separate decision graphs and commit graphs, and per-context-length-bucket child graphs for the sparse attention layers and draft steps; at run time swaps child nodes when the visible length crosses a bucket, toggles the head and draft-readback sections, and replays."
    not: "Not a different computation: eager and graph runs call the same body; prefill, replay and the vision encoder never use graphs."
    runs: [startup, per_step]
    takes:
      - {from: "rank-program", what: "stable buffers, frames, execution tables and the step body"}
      - {from: "configuration", what: "graph on/off, max concurrency, max context, draft count"}
    gives:
      - {to: "rank-program", what: "graph launches for a decode or verify round"}
      - {to: "startup-memory-planner", what: "warmup, capture and rebuild memory growth"}
    owns_state: ["instantiated graphs, installed child bucket per round, enabled sections"]
    exists_because: "a decode step launches thousands of small kernels; host launch cost dominates without a recorded graph"
    output_effect: none
    output_effect_when: "same math composition as eager; the project does not claim bitwise equality in words"
    decisions:
      - "which variants to capture (batch size 1..max concurrency, with or without verify)"
      - "context buckets: 128, 512, 2048, 8192, 32768, 131072 below the maximum, plus the maximum"
      - "which sections are separate so host work (grammar masks, CPU experts, final acceptance) can sit between them"
    when_things_go_wrong: ["throws if the visible length exceeds the largest bucket"]
    must_never: ["change addresses of buffers or execution tables a graph references during its lifetime", "acquire or re-lay-out the expert cache inside capture", "outlive the backings it borrows"]
    evidence: ["src/core/decode_graph.h 1-95", "src/models/qwen4_exp/program/device_graphs.cpp 13-223", "src/models/qwen4_exp/program/graphs.cpp 13-22", "src/models/common/graph_preparation.cpp", "docs/maintainer/engine-architecture.md 110-122"]
    read: code

  - id: "host-expert-store"
    engine_name: "Host expert bank (registered WeightBank in ModelShard)"
    does: "Holds every main routed expert of the model in host memory registered with CUDA, so the same bytes can be copied asynchronously to the GPU and read in place by CPU workers."
