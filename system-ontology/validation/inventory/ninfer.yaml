    does: "Indexes reusable prefixes and checkpoints, ranks restore sources for a new or paused request (device, host, other rank, or recompute) by modelled transfer plus recompute time, decides which optional checkpoints to save, chooses reclaim and demotion victims by loss per freed byte, and for GLM attention data parallelism picks the attention-owner rank."
