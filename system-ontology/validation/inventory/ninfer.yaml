      - {to: "cpu-expert-team", what: "encoded expert weights read in place"}
    owns_state: ["all main routed expert weights and their registration"]
    exists_because: "the RTX 5090 has 32 GiB of device memory and large separate host memory; the experts fit only in host memory"
    output_effect: none
    output_effect_when: ""
    decisions:
      - "which banks are registered for transfer versus kept ordinary"
    when_things_go_wrong: []
    must_never: ["release the host source before consumers and registration end"]
    evidence: ["docs/maintainer/expert-weight-cache.md 9-19", "docs/maintainer/weights-and-loading.md 83-87", "src/core/weight_bank.h"]
