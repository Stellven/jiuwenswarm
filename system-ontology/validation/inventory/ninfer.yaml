  - id: "expert-cache"
    engine_name: "ExpertCache"
    does: "Keeps the device-side index of which experts are published in which slots of the fixed and reusable regions, lets consumers acquire and release sets of experts with generation numbers on their stream, and rebuilds a reusable region only after its readers have retired."
    not: "Does not decide what to hold; it executes placements given to it and does no math or conversion."
    runs: [startup, per_layer]
    takes:
      - {from: "expert-residency-planner", what: "capacity, fixed placements, region layouts"}
      - {from: "offload-mode-switch", what: "region replacements and required/prefetch requests"}
      - {from: "expert-uploader", what: "completion of uploaded expert bytes"}
    gives:
      - {to: "hybrid-moe-dispatch", what: "ready expert set snapshot and device views of acquired experts"}
      - {to: "layer-compute", what: "device views of experts for full-layer GPU MoE"}
    owns_state: ["slot placements, published flags, open uses and their generations, the device offset/divisor index"]
    exists_because: "experts are larger than device memory, so device copies must be tracked and protected while kernels read them"
    output_effect: none
    output_effect_when: ""
    decisions:
      - "bound on concurrently open uses (layers + 8)"
    when_things_go_wrong: ["acquire returns nothing while weights are unpublished or the bounded use ring is occupied", "throws when called during graph capture", "throws if a replacement cuts through a placement or would drop an expert with an open reader"]
    must_never: ["publish an expert before all its bytes are submitted in order", "rewrite a slot before the last device-side reader has retired", "be rolled back by prefix restore, pause or draft rejection"]
    evidence: ["src/core/expert_cache.h 100-134", "src/core/expert_cache.cpp 20-30, 344-433, 696-767", "docs/maintainer/expert-weight-cache.md 42-55"]
    read: code

  - id: "expert-uploader"
    engine_name: "ExpertCache::progress (upload batches and slots)"
    does: "Moves encoded expert bytes from host to device in bounded batches (up to 96 MiB and 4096 copies per batch, a fixed number of in-flight upload slots), merging contiguous runs, and in streaming mode fills the other window with the next layer's missing experts while the current layer computes."
    not: "Not a decision about which experts to hold."
    runs: [per_layer, background]
    takes:
      - {from: "host-expert-store", what: "encoded expert bytes"}
      - {from: "expert-cache", what: "pending required and prefetch placements"}
    gives:
      - {to: "expert-cache", what: "uploaded bytes and their completion events"}
    owns_state: ["upload slots, pinned descriptors and in-flight batches"]
    exists_because: "host-to-device copies are slow and must overlap computation without unbounded staging"
    output_effect: none
    output_effect_when: ""
    decisions:
      - "batch size and count per progress call (budget)"
      - "required uploads before prefetch; a new prefetch must not block current-layer data"
    when_things_go_wrong: ["returns without waiting on the GPU when slots are busy", "a submitted DMA cannot be cancelled; failures end real consumers before releasing sources"]
    must_never: ["reuse a pinned descriptor before its transfer completes"]
    evidence: ["src/core/expert_cache.h 24-31, 60-81", "src/models/common/moe/offload/resources.cpp 302-337 (per earlier notes)", "docs/maintainer/expert-weight-cache.md 46-55"]
    read: code

  - id: "offload-mode-switch"
    engine_name: "moe::offload Resources"
    does: "For each execution decides from its token count whether any layer needs full-layer streaming, switches the reusable region between extra-cache layout and window layout, and after returning to small T refills the extra cache in small batches."
    not: "Not a usage-driven replacement policy; it reacts to work size, not to which experts were used."
    runs: [per_step]
    takes:
      - {from: "rank-program", what: "tokens in this execution"}
      - {from: "expert-residency-planner", what: "layouts and thresholds"}
    gives:
      - {to: "expert-cache", what: "region replacements and prefetch targets"}
    owns_state: ["current region mode and refill progress"]
    exists_because: "with many tokens nearly every expert of a layer is selected, so streaming whole layers beats splitting with the CPU; with few tokens CPU help beats uploads"
    output_effect: numeric
    output_effect_when: "after a switch back to small T the ready set is smaller until refill finishes, so more experts run on CPU and rounding differs"
    decisions:
      - "streaming needed when T exceeds a layer's threshold"
      - "refill pace (at most 8 MiB, one batch per call)"
    when_things_go_wrong: ["experts not yet ready are computed on CPU instead"]
    must_never: ["move the fixed region"]
    evidence: ["src/models/common/moe/offload/resources.cpp 334-337, 385-396 (per earlier notes)", "docs/maintainer/expert-weight-cache.md 30-37"]
    read: code

  - id: "hybrid-moe-dispatch"
    engine_name: "moe::offload execution"
    does: "Per MoE layer, takes one global top-k routing, splits (token, expert) pairs between GPU and CPU by a mask built from a snapshot of ready experts (or streams the whole layer for large T), skips the CPU side when it has no pairs, and adds the FP32 partial sums before one rounding to BF16."
    not: "Never omits a selected expert and never renormalizes coefficients over a subset."
    runs: [per_layer]
    takes:
      - {from: "layer-compute", what: "router ids and coefficients, hidden states"}
      - {from: "expert-cache", what: "ready set and acquired device views"}
      - {from: "expert-residency-planner", what: "per-layer threshold"}
    gives:
      - {to: "cpu-expert-team", what: "hidden states, routes and CPU mask"}
      - {to: "layer-compute", what: "combined expert output"}
    owns_state: ["the bridge buffers for this layer's CPU inputs and partial sums"]
    exists_because: "experts not on the GPU still have to be computed for every token that selects them"
    output_effect: numeric
    output_effect_when: "compared with the fused all-GPU path: separate FP32 partial sums are added in a different order; depends on which experts are ready at that moment"
    decisions:
      - "GPU subset versus CPU complement per layer from the ready snapshot"
      - "large T versus small T by threshold"
    when_things_go_wrong: ["throws if a cache borrow or layout change is attempted inside graph capture"]
    must_never: ["add shared expert or residual twice", "overwrite bridge buffers while the previous layer's CPU results are still being read"]
    evidence: ["src/models/common/moe/offload/execution.cpp 99-120, 194-269 (per earlier notes)", "include/ninfer/ops/moe.h 197-247", "docs/maintainer/expert-weight-cache.md 13-16, 57-68"]
    read: code

  - id: "cpu-expert-team"
    engine_name: "CpuExecutor and moe_cpu kernels (nvfp4, groupwise_int; AVX2, AVX-512, AVX-512 BF16)"
    does: "A fixed team of pinned CPU threads computes the experts assigned to the CPU directly from encoded host weights, grouping (token, expert) pairs per expert, and returns FP32 partial sums; the team is kept polling or put to sleep by how many layers used it recently."
    not: "Never calls CUDA; the GPU-side program decides when inputs are ready and merges results."
    runs: [per_layer]
    takes:
      - {from: "hybrid-moe-dispatch", what: "hidden states, routes, mask"}
      - {from: "host-expert-store", what: "encoded weights in place"}
      - {from: "expert-residency-planner", what: "worker CPUs"}
    gives:
      - {to: "hybrid-moe-dispatch", what: "FP32 partial sums"}
    owns_state: ["worker threads, barriers, awake/asleep state"]
    exists_because: "the host has many cores with vector units and the experts already live in host memory; computing in place avoids a PCIe upload"
    output_effect: numeric
    output_effect_when: "CPU arithmetic order differs from GPU kernels"
    decisions:
      - "instruction set variant (AVX2/FMA, AVX-512, AVX-512 BF16; forced by NINFER_MOE_CPU_* switches)"
      - "keep awake when at least 1/4 of layers used CPU, sleep below 1/8"
      - "token block and per-task column limits"
    when_things_go_wrong: ["no CPU available is a startup error"]
    must_never: ["call CUDA from a worker", "let exceptions escape a worker"]
    evidence: ["src/core/cpu/executor.h 16-77", "src/ops/moe/kernels/cpu/nvfp4/launch.cpp", "src/models/common/moe/offload/resources.cpp 366-374 (per earlier notes)"]
    read: code

  - id: "ple-row-source"
    engine_name: "PLE disk RowReader / DirectReadQueue / prepare / UploadSlots, or device PLE shards"
    does: "Produces the per-layer embedding rows each token needs: hashes the token's 2- and 3-gram history into 16 row IDs, reads those NF4 rows from the model file with io_uring and O_DIRECT through a row cache (merging requests for the same page), decodes them to exact BF16 on a CPU worker and uploads them through slots; on two Sparks it looks rows up in device shards and merges the words across ranks."
    not: "Not request state; only the PLE convolution history and token frontier are restored."
    runs: [per_step, background]
    takes:
      - {from: "shard-materializer", what: "file backing or device shards of the PLE table"}
      - {from: "rank-program", what: "token IDs of the coming execution (known prefixes may be prepared early)"}
    gives:
      - {to: "layer-compute", what: "BF16 embedding rows with a ready event"}
    owns_state: ["row cache, in-flight reads, prepared windows and upload slots"]
    exists_because: "the PLE table (about 2.5 million rows x 128 shards) is too large to keep on the device of one machine and only a few rows per token are needed"
    output_effect: none
    output_effect_when: "lookup must reproduce exact BF16 words whichever source is used"
    decisions:
      - "disk path or device-shard path (by deployment)"
      - "row cache size, I/O depth, number of window slots"
      - "prefetch of known input versus required window priority"
    when_things_go_wrong: ["returns no slot when all are busy (caller waits)", "I/O errors come back as completion errors", "teardown terminates rather than free buffers still being written"]
    must_never: ["reuse an upload slot before the last GPU consumer retires", "let the table's location change what the main model consumes"]
    evidence: ["src/models/qwen4_exp/ple/disk/row_reader.h 9-40", "src/models/qwen4_exp/ple/disk/prepare.h 27-58", "src/models/qwen4_exp/ple/hash.h 7-10", "src/models/qwen4_exp/ple/upload.h 17-52", "src/core/io/read_queue.h 28-52", "docs/maintainer/qwen4_exp-model.md 55-69"]
    read: code

  - id: "engine-control-loop"
    engine_name: "EngineCore worker_loop / begin_cycle / advance_cycle"
    does: "The single control thread that polls execution events, then each cycle settles finished and cancelled requests, advances the service turn, admits or restores requests, reserves units, and submits at most one control batch, one decode batch and one prefill chunk."
    not: "Not the fairness rules themselves (request-scheduler) and not device execution (executor)."
    runs: [per_step]
    takes:
      - {from: "http-api", what: "prepared requests through a FIFO, cancellations"}
      - {from: "executor", what: "decision-needed, result-ready, commit and retirement events"}
      - {from: "request-scheduler", what: "memberships, admission candidates, preemption victims"}
    gives:
      - {to: "model-session", what: "start binding, start control/decode/prefill, commit decisions, pause"}
      - {to: "output-interpreter", what: "candidate tokens to preview and commit"}
      - {to: "observability", what: "runtime statistics and request lifecycle"}
    owns_state: ["request slots (lanes), pending and paused queues, the cycle step, the current admission decision"]
    exists_because: "every engine needs it"
    output_effect: none
    output_effect_when: ""
    decisions:
      - "order within a cycle: control span, then decode, then one prefill chunk"
      - "when to re-run admission (queue or capacity change, deadline)"
      - "spin-yield while work is outstanding versus 1 ms wait when idle"
    when_things_go_wrong: ["any uncaught error fails all requests and stops the worker", "rejects a single request whose plan fails without touching device state"]
    must_never: ["let ingress, output or network threads touch model storage directly", "publish a token whose model state was not committed"]
    evidence: ["src/runtime/engine/engine_schedule.inl 1016-1260", "src/runtime/engine/engine_execution.inl 6-254", "docs/maintainer/engine-architecture.md 71-87"]
    read: code

  - id: "request-scheduler"
    engine_name: "Scheduler"
    does: "Decides batch membership and fairness: which lanes join a control or decode round, which lane gets the next prefill chunk (round robin), which waiting requests are admission candidates (FIFO with a bounded bypass allowance), who owns progress under memory pressure (service turns of 1 to 4 seconds), and which resident request is paused as a victim (the youngest)."
    not: "Holds no physical reservations; native stores own them."
    runs: [per_step]
    takes:
      - {from: "engine-control-loop", what: "slots, queues, served time, pressure signals"}
    gives:
      - {to: "engine-control-loop", what: "round memberships with per-row token budgets, admission candidates, progress owner, preemption victim"}
    owns_state: ["prefill cursor, admission scan list, service order, pressure flag, service and recovery time"]
    exists_because: "up to 8 requests share one model execution and one memory pool"
    output_effect: none
    output_effect_when: ""
    decisions:
      - "FIFO bypass allowance equal to the concurrency"
      - "service quantum 1 s, up to 4 s when restore work was expensive"
      - "victim is the youngest resident not owning progress"
      - "decode rounds and prefill chunks are separate executions, not mixed in one batch"
    when_things_go_wrong: ["throws on inconsistent state (decode-ready without budget, ragged control spans)"]
    must_never: ["let replay or waiting for a grant consume a service turn", "admit a younger request more often than the bypass allowance over an older one"]
    evidence: ["src/runtime/engine/scheduler.h 19-320", "docs/maintainer/context-management.md 75-86"]
    read: code

  - id: "model-session"
    engine_name: "native model Session (e.g. qwen4_exp/session)"
    does: "Keeps each sequence's token ledger and main/draft frontiers, turns a request into a complete work demand (reads, writes, growth, copy-on-write tails, speculative peak, commit objects), binds sequences to lanes and restore sources, and runs generation transactions: plan, submit, decide, commit or discard, pause and resume."
    not: "Not the physical allocator (context-pool) or the identity store (context-directory)."
    runs: [per_request, per_step]
    takes:
      - {from: "engine-control-loop", what: "binding, unit and commit requests"}
      - {from: "context-directory", what: "reservations and assessments"}
      - {from: "context-resource-manager", what: "chosen restore source"}
      - {from: "prompt-preparer", what: "PreparedPrompt tokens, positions, media, identity"}
    gives:
      - {to: "executor", what: "work with frozen sequence, residency and batch row mapping; commit and discard"}
      - {to: "context-directory", what: "demands and context transactions"}
      - {to: "engine-control-loop", what: "pending batches, commit results, capture readiness, pause options"}
    owns_state: ["token ledger, main and backend frontiers, current transaction per sequence, recovery targets"]
    exists_because: "recurrent state and KV must stay consistent with exactly the committed tokens across speculation, pause and restore"
    output_effect: none
    output_effect_when: ""
    decisions:
      - "pause action per request: keep on device, host snapshot, relocate, or release and replay"
      - "full permit before verify that covers the later commit peak"
    when_things_go_wrong: ["a failed reservation leaves no half permit", "unrecoverable device, communication or ledger errors fail the instance"]
    must_never: ["compete for commit space after acceptance has happened", "splice independently recomputed state and KV into one checkpoint because tokens match"]
    evidence: ["src/models/qwen4_exp/session/ (session.cpp, commit.cpp, checkpoints.cpp, reclaim.cpp listed)", "src/runtime/contract/placement.h 14-19", "docs/maintainer/engine-architecture.md 22-31, 77-87", "docs/maintainer/context-management.md 62-73"]
    read: docs

  - id: "executor"
    engine_name: "Executor (LocalExecutor, DistributedExecutor)"
    does: "Accepts a unit of work into a reserved frame, hands it to the rank program(s), passes host decision inputs (grammar masks) into the running ticket, delivers result-ready, commit receipts and device retirement in order, and frees frames only when every participating rank's last consumer has retired."
    not: "Does not choose requests, sources or pages."
    runs: [per_step]
    takes:
      - {from: "model-session", what: "work, commits, discards"}
      - {from: "grammar-constraint", what: "decision inputs (token masks) per ticket"}
      - {from: "rank-program", what: "results, decision requests, retirement observations"}
    gives:
      - {to: "rank-program", what: "work and commit commands (in process, or over the control connection)"}
      - {to: "engine-control-loop", what: "DecisionNeeded, DecisionConsumed, ResultReady, DeviceRetired, ExecutionFailed events"}
      - {to: "observability", what: "execution samples and per-rank observations"}
    owns_state: ["compute and context frames, tickets with epoch and generation, command sequence, per-flight phase"]
    exists_because: "results become readable before device work ends, and memory may be reused only after true device retirement"
    output_effect: none
    output_effect_when: ""
    decisions:
      - "number of compute and context frames"
      - "local in-process versus distributed workers"
    when_things_go_wrong: ["late results whose ticket or generation does not match are rejected", "on failure stops submission, drains consumers and keeps the first cause"]
    must_never: ["let ordinary work block completion of existing tickets", "retire a frame before all participants finish"]
    evidence: ["src/runtime/executor/contract.h 13-142", "src/runtime/executor/executor.h 9-80", "src/runtime/executor/local_executor.h 12-277", "docs/maintainer/engine-architecture.md 89-108"]
    read: code

  - id: "rank-program"
    engine_name: "RankProgram (RankProgramImpl)"
    does: "On each rank, owns the context backing bindings, frames, workspace, fixed I/O buffers and graphs, and carries out one unit (prefill chunk, control span, decode round, draft-plus-verify round, commit, context action) by running the model's layer sequence, sampling or acceptance, and readback."
    not: "Not the math of each layer (layer-compute) and not the logical frontier (model-session)."
    runs: [per_step]
    takes:
      - {from: "executor", what: "work and commit commands"}
      - {from: "execution-graphs", what: "graph launches"}
      - {from: "ple-row-source", what: "PLE rows"}
    gives:
      - {to: "layer-compute", what: "batched inputs and state offsets"}
      - {to: "executor", what: "results, decision requests, retirement"}
      - {to: "offload-mode-switch", what: "tokens per execution"}
      - {to: "startup-memory-planner", what: "record layouts, working set, workspace peak"}
    owns_state: ["workspace arena, persistent I/O buffers, sampling frames, execution table rows, transition record buffers"]
    exists_because: "every engine needs it"
    output_effect: none
    output_effect_when: ""
    decisions:
      - "graph replay or eager per unit kind"
      - "where host handoffs split device work (grammar mask, CPU experts, final acceptance)"
    when_things_go_wrong: ["device errors fail the instance"]
    must_never: ["destroy graphs, events or registered views after the backings they borrow"]
    evidence: ["src/models/qwen4_exp/program/ (program.cpp, resources.cpp, execution.cpp, dispatch.cpp listed)", "src/models/qwen4_exp/program/device_graphs.cpp 33-98", "docs/maintainer/engine-architecture.md 30-40"]
    read: code

  - id: "layer-compute"
    engine_name: "native model execution and Ops (src/models/*/execution, src/ops)"
    does: "Computes the model as written natively per architecture: embedding, four-stream gated residual mixing, GDN or KDA linear attention with causal convolution (writing transition records during verify), QSA or Kpool sparse attention with compressed index keys and top-K block selection, router, routed and shared experts, PLE, KV append in the chosen encoding, final mixing and output head, using kernels that read encoded weights directly."
    not: "Holds no request policy; does not query the directory or pick victims."
    runs: [per_layer]
    takes:
      - {from: "rank-program", what: "batched inputs, positions, state and page offsets"}
      - {from: "shard-materializer", what: "resident weight views"}
      - {from: "expert-cache", what: "expert views for full-GPU MoE"}
      - {from: "hybrid-moe-dispatch", what: "combined expert output in offload mode"}
      - {from: "ple-row-source", what: "PLE rows"}
      - {from: "context-pool", what: "KV pages and state images through offset tables"}
      - {from: "partition-planner", what: "local geometry"}
      - {from: "collective-communication", what: "reduced and gathered results across ranks"}
    gives:
      - {to: "sampler", what: "logits"}
      - {to: "draft-acceptance", what: "target logits and argmax over K+1 columns"}
      - {to: "state-commit", what: "transition records, staged QSA tail, PLE conv records, conditioning features"}
      - {to: "mtp-drafter", what: "conditioning features (four-stream residual before the final mixer)"}
      - {to: "hybrid-moe-dispatch", what: "routes and hidden states"}
    owns_state: []
    exists_because: "the model defines it"
    output_effect: numeric
    output_effect_when: "against the source model: activations may be quantized to 4 or 8 bits where a weight use allows it; private accumulator order varies by kernel, batch shape and chunking"
    decisions:
      - "kernel variant per format, geometry, extent and GPU target (sm_120a or sm_121a), chosen by registered shape profiles"
      - "activation precision per use within the permit (A16, A8, A4)"
      - "KV encoding (bf16, int8, fp8, nvfp4, k8v4)"
    when_things_go_wrong: ["an op rejects geometries it has no registered implementation for", "no hidden device allocation; scratch comes from caller workspace with a capacity query"]
    must_never: ["re-evaluate projections at commit width for replay", "add index scores to attention logits"]
    evidence: ["src/models/qwen4_exp/execution/ (gdn.cpp, qsa.cpp, ple.cpp, text.cpp listed)", "src/ops/ family listing (linear 594 files, softmax_attention 170, moe 166, linear_attention 144)", "src/ops/linear/kernels/nvfp4/ (a4 quantize, a16 and a4 MMA)", "include/ninfer/kv_cache_format.h 41-87", "docs/maintainer/qwen4_exp-model.md 8-31", "docs/maintainer/op-development.md 1-60"]
    read: code

  - id: "chunked-prefill"
    engine_name: "Prefill / Replay units"
    does: "Reads a prompt (or replays a paused request's committed tokens) in chunks of a fixed size without graphs, splitting media and math segments inside the model, and offers optional full checkpoints at chunk ends or semantic boundaries near every 8192 tokens."
    not: "Not token-by-token reading; its reference is its own chunked math precision."
    runs: [per_request, per_step]
    takes:
      - {from: "model-session", what: "next chunk of tokens and media"}
      - {from: "vision-encoder", what: "media features for spans"}
    gives:
      - {to: "layer-compute", what: "chunk inputs"}
      - {to: "context-resource-manager", what: "capture-ready positions"}
    owns_state: []
    exists_because: "long prompts must be read with bounded workspace and interleaved with decoding of other requests"
    output_effect: numeric
    output_effect_when: "state after chunked reading can differ in the last bits from a different chunking or from token-by-token reading"
    decisions:
      - "chunk size (4096 or 1024 by model/path; multiple of 128)"
      - "checkpoint interval and the quarter-interval window for snapping to a semantic boundary"
    when_things_go_wrong: ["optional captures are skipped when space is short"]
    must_never: ["count replay work as new output or sample again during replay"]
    evidence: ["src/models/qwen4_exp/program/planning.cpp 72-75", "src/runtime/engine/context_cache/capture_policy.cpp 8-29", "src/runtime/engine/scheduler.h 127-143", "docs/maintainer/speculative-decoding.md 56-62"]
    read: code

  - id: "mtp-drafter"
    engine_name: "MTP proposal (qwen4_exp/program/mtp.cpp)"
    does: "Runs the model's built-in MTP layer K times (1 to 5) from the saved conditioning and its own history, taking the argmax of the (optionally 4-bit) draft head each step, to propose K tokens."
    not: "Does not decide acceptance; its history is rebuilt on commit, not truncated."
    runs: [per_step]
    takes:
      - {from: "layer-compute", what: "conditioning features"}
      - {from: "context-pool", what: "MTP history pages and tail state"}
    gives:
      - {to: "draft-acceptance", what: "K proposed token IDs (one-hot proposals)"}
      - {to: "grammar-constraint", what: "proposals read back for lookahead masks"}
    owns_state: ["temporary draft tail for this round (frame)"]
    exists_because: "the model ships a cheap draft layer; verifying K+1 positions reads weights once"
    output_effect: none
    output_effect_when: "changes only how many tokens are accepted per round"
    decisions:
      - "draft count, fixed at startup"
      - "full main head or optimized draft head"
    when_things_go_wrong: []
    must_never: ["treat recursively drafted hidden states as the real ones on commit"]
    evidence: ["src/models/qwen4_exp/program/mtp.cpp 90-118", "src/models/qwen4_exp/program/device_graphs.cpp 42-57", "docs/maintainer/speculative-decoding.md 21-44"]
    read: code

  - id: "block-drafter"
    engine_name: "DFlash, DFlash2 (qwen3_5/execution/draft.cpp)"
    does: "An external draft model conditioned on target residual features proposes up to 15 tokens at once with one non-causal masked-block attention pass (sliding-window local layers in cyclic KV, full layers in paged history); DFlash2 adds a dynamic grouped convolution and a candidate-path selector and keeps its actual proposal distribution q."
    not: "Not step-by-step drafting; shortening the block may change every proposal."
    runs: [per_step]
    takes:
      - {from: "layer-compute", what: "target residual features of selected layers"}
      - {from: "context-pool", what: "draft context KV (cyclic and paged)"}
    gives:
      - {to: "draft-acceptance", what: "proposed tokens, and q for DFlash2"}
    owns_state: ["query block, candidate paths and proposal probabilities for this round"]
    exists_because: "dense 27B and GLM targets have external block draft models that propose many tokens per pass"
    output_effect: none
    output_effect_when: "changes acceptance rate only"
    decisions:
      - "block width (1 to 15 drafts, fixed at startup)"
      - "full or indexed draft head"
    when_things_go_wrong: []
    must_never: ["replace DFlash2's q by per-column argmax or softmax"]
    evidence: ["src/models/qwen3_5/execution/draft.cpp 38-518", "docs/maintainer/speculative-decoding.md 69-87"]
    read: code

  - id: "sampler"
    engine_name: "ops sample, increment_token_counts"
    does: "Turns logits into a token per row with per-request temperature, top-k (at most 20 candidates), top-p, min-p and presence/frequency penalties, using counter-based random keys of (request seed, logical position, purpose)."
    not: "Keeps no mutable RNG; committed token counts are updated only by the commit path."
    runs: [per_step]
    takes:
      - {from: "layer-compute", what: "logits"}
