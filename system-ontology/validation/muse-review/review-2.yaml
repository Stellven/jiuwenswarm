leftovers:
# ---------------- sys/muse-on-spark ----------------
- object: "sys/muse-on-spark"
  field: "flows[expert-layout-to-sizing].description"
  quote: "The largest blob and each layer's blob size"
  kind: D
  because: "This design has one range per expert, not a per-layer blob: preparation writes 'every expert as one contiguous block-aligned range', and expert-layout says 'One range per expert, not three tensors per layer.' A per-layer blob size is the source's layout."
  severity: doubtful
  fix: "reword: The largest expert range, the unit the expert cache's slots are counted in."
- object: "sys/muse-on-spark"
  field: "flows[expert-bytes-from-files].timing"
  quote: "startup"
  kind: E
  because: "The same flow says the bytes are 'read from storage when asked for', and the summary says a missed expert 'is read from storage for that step'; weight-loader says 'Experts are never loaded at startup.' A startup timing is the source's (experts loaded at start into host memory)."
  severity: wrong
  fix: "reword: timing: on_demand"
- object: "sys/muse-on-spark"
  field: "flows[window-fetch-request].description"
  quote: "for this window only"
  kind: C
  because: "decode-loop decides 'tokens-per-step: One in the first version', and coverage excludes 'drafting'; there is no multi-token window, the unit is a step (or a prompt chunk)."
  severity: doubtful
  fix: "reword: Missed experts to copy into the staging area for this step only"
- object: "sys/muse-on-spark"
  field: "flows[expert-usage].description"
  quote: "How many tokens of the window routed each expert"
  kind: C
  because: "One token per step in the first version ('tokens-per-step: One in the first version'); without drafting there is no window of tokens in decode."
  severity: doubtful
  fix: "reword: How many tokens of the step or prompt chunk routed each expert"
- object: "sys/muse-on-spark"
  field: "flows[final-residual-to-head].description"
  quote: "one per window row"
  kind: C
  because: "Coverage excludes 'drafting' and decode is one token per step; windows of rows come from the source's drafted windows."
  severity: doubtful
  fix: "reword: The residual after the last layer, one per position."
- object: "sys/muse-on-spark"
  field: "flows[logits-to-sampler].description"
  quote: "in device memory"
  kind: B
  because: "machine.yaml: mem0 is 'unified_ram' and gpu0-mem0 notes 'CPU 与 GPU 共用同一个内存池，没有独立显存' (no separate GPU memory)."
  severity: wrong
  fix: "reword: One row of vocabulary logits per position, in the unified pool."
- object: "sys/muse-on-spark"
  field: "flows[client-request].description"
  quote: "An HTTP request in OpenAI or Anthropic form"
  kind: E
  because: "http-front's adaptation says 'Which request dialects the front offers is open until the form of the engine is decided', and target.yaml has 'form: UNSET'."
  severity: doubtful
  fix: "reword: A client request in the dialect the engine's form will define: messages, sampling fields and an output limit"
- object: "sys/muse-on-spark"
  field: "flows[prompt-ids].description"
  quote: "the thinking flag"
  kind: A
  because: "model.yaml describes no reasoning or thinking mode; its note says 'only what the card states is described'."
  severity: doubtful
  fix: "reword: The prompt token ids and the output limit fitted to the context"
- object: "sys/muse-on-spark"
  field: "flows[engine-commands].description"
  quote: "Text lines on the engine's standard input"
  kind: D
  because: "A stdin text-line protocol between a server and a child engine process is the source implementation's transport; target.yaml leaves 'form: UNSET' (execution library, offline engine or online service)."
  severity: doubtful
  fix: "reword: Commands to the engine: generate with settings and prompt token ids, stop, report memory, save and restore."
- object: "sys/muse-on-spark"
  field: "flows[response-events].description"
  quote: "Reasoning, content and tool-call events"
  kind: A
  because: "model.yaml describes no reasoning channel and no tool-call format; only 'modality_out: text'."
  severity: doubtful
  fix: "reword: Content events, pings and one finish record"
- object: "sys/muse-on-spark"
  field: "flows[session-file-in].description"
  quote: "validated before any device write"
  kind: B
  because: "machine.yaml: one unified pool, '没有独立显存'; there is no separate device memory to write."
  severity: doubtful
  fix: "reword: A session file read back and validated before the live attention state is written"
- object: "sys/muse-on-spark"
  field: "flows[hardware-readings].description"
  quote: "GPU utilisation, memory, temperature and power from the vendor library, and CPU, RAM and disk readings"
  kind: B
  because: "A GPU memory reading separate from RAM assumes separate device memory; machine.yaml has one 'unified_ram' pool shared by CPU and GPU."
  severity: doubtful
  fix: "reword: GPU utilisation, temperature and power from the vendor library, and CPU, unified memory and disk readings from the operating system, once a second"
# ---------------- comp/muse/run-config-generator ----------------
- object: "comp/muse/run-config-generator"
  field: "needs_resources[storage].purpose"
  quote: "One JSON file per installed model"
  kind: D
  because: "The engine is for one model ('Decide the engine's options for one model on one machine'); a JSON file per installed model is the source's file layout."
  severity: doubtful
  fix: "reword: One run configuration file, with a backup of the previous one"
- object: "comp/muse/run-config-generator"
  field: "calls[user_args.merge / capture / stamp].name"
  quote: "user_args.merge / capture / stamp"
  kind: D
  because: "A module-qualified function name of an existing implementation; nothing of this engine is built ('nothing of it has been built')."
  severity: wrong
  fix: "reword: merge / capture / stamp"
# ---------------- comp/muse/launch-argument-resolver ----------------
- object: "comp/muse/launch-argument-resolver"
  field: "invariants[inv/failed-fit-decides-nothing].text"
  quote: "A fit estimate that fails changes nothing."
  kind: D
  because: "Nothing in this design produces a fit estimate; the component is 'not_responsible_for: Sizing the expert cache; that is left to the engine', and sizing is done by startup memory sizing. The fit estimate is the source's launcher feature."
  severity: doubtful
  fix: "drop"
# ---------------- comp/muse/loading ----------------
- object: "comp/muse/loading"
  field: "not_responsible_for[0]"
  quote: "Changing sizes after READY"
  kind: D
  because: "READY is a protocol keyword of the source engine's line protocol (category D)."
  severity: doubtful
  fix: "reword: Changing sizes after the engine reports it is ready"
- object: "comp/muse/loading"
  field: "needs_resources[slow_memory].purpose"
  quote: "file mappings and staging buffers"
  kind: B
  because: "machine.yaml has one 'unified_ram' pool, no slow/fast split; and expert-dispatch puts the staging area in 'fast_memory' ('the staging area for experts read for this step only'), so this also contradicts the design (E)."
  severity: wrong
  fix: "drop"
- object: "comp/muse/loading"
  field: "needs_resources[accelerator].purpose"
  quote: "destination of the weight uploads"
  kind: B
  because: "machine.yaml: CPU and GPU share one pool, '没有独立显存'; weights are read into the unified pool, there is no upload to the accelerator."
  severity: wrong
  fix: "drop"
# ---------------- comp/muse/model-file-reader ----------------
- object: "comp/muse/model-file-reader"
  field: "needs_resources[slow_memory].purpose"
  quote: "one whole-file read-only mapping per open"
  kind: B
  because: "machine.yaml has a single unified pool (no slow memory tier); and expert-source's 'read-mode' decision weighs bypassing the page cache because it 'takes memory the budget does not count' — a whole-file mapping of a ~400 GB file sits in that same page cache."
  severity: doubtful
  fix: "reword: resource: fast_memory, purpose: the header and tensor directory only, read without mapping the expert ranges"
# ---------------- comp/muse/weight-loader ----------------
- object: "comp/muse/weight-loader"
  field: "decisions[head-precision].text"
  quote: "It moves about 25 GB between these weights and the expert cache."
  kind: E
  because: "model.yaml: token_embedding is '202,048 rows of 8,192 values: 1.66B parameters'; 4 to 16 bits adds about 2.5 GB per table (about 5 GB if the head is untied). About 25 GB is the difference for all 17.0B shared weights (system resource_expectations: '34 GB if kept at 16 bits' vs 8.5 GB)."
  severity: wrong
  fix: "reword: Whether the embedding table and output head are kept at 4 or 16 bits. It moves about 2.5 GB per table (about 5 GB if the head is not tied to the embedding) between these weights and the expert cache."
# ---------------- comp/muse/startup-memory-sizing ----------------
- object: "comp/muse/startup-memory-sizing"
  field: "invariants[inv/start-ends-on-failed-allocation].text"
  quote: "the weight range"
  kind: D
  because: "A single 'weight range' allocation is the source's loader structure; this design's weight-loader returns 'a table from tensor name to location'."
  severity: doubtful
  fix: "reword: The start ends with a message when the weights every token uses, the session state, or an explicitly sized expert cache cannot be allocated; ..."
# ---------------- comp/muse/expert-router ----------------
- object: "comp/muse/expert-router"
  field: "not_responsible_for[0]"
  quote: "Deciding which device computes a chosen expert"
  kind: B
  because: "machine.yaml has one GPU and one pool; expert-dispatch has 'No CPU path, no second accelerator' and cpu-expert-pool is not carried. Dispatch decides cache vs storage read, not a device."
  severity: wrong
  fix: "reword: Deciding whether a chosen expert is computed from the cache or after a storage read (expert dispatch)"
- object: "comp/muse/expert-router"
  field: "invariants[inv/route-independent-of-window].text"
  quote: "A token's routing does not depend on how many tokens share its window."
  kind: C
  because: "Decode is 'One in the first version' token per step and drafting is excluded by coverage; the multi-token window is the source's."
  severity: doubtful
  fix: "reword: A token's routing does not depend on how many tokens share its prompt chunk."
