leftovers:
# ---------------- sys/muse-on-spark (system.yaml) ----------------
- object: "sys/muse-on-spark"
  field: "flows[operator-memory-settings].description"
  quote: "prompt chunk, pipeline windows"
  kind: D
  because: "Pipeline windows are a setting of Strata's window graphs, which are not carried: 'Replaying one recorded graph per step assumes no wait inside a layer ... To be revisited when the miss rate is measured.' The decode loop runs 'One in the first version' token per step."
  severity: doubtful
  fix: "reword: Command-line flags and environment: context length, expert cache size or auto, reserve, prompt chunk."
- object: "sys/muse-on-spark"
  field: "flows[device-free-memory].description"
  quote: "Free device memory as the driver reports it"
  kind: B
  because: "machine.yaml: 'CPU 与 GPU 共用同一个内存池，没有独立显存' (one shared pool, no separate GPU memory); target c-mem budgets 'Everything the engine's container holds in the unified pool'."
  severity: wrong
  fix: "reword: Free memory of the unified pool as the operating system reports it, read before the cache is sized and again after its slots are written."
- object: "sys/muse-on-spark"
  field: "flows[expert-bytes-to-upload].description"
  quote: "Pointers to blobs to be copied into device memory"
  kind: B
  because: "machine.yaml has one unified pool and no device memory; the storage reader reads 'from storage into the staging area or a cache slot', there is no copy into device memory."
  severity: wrong
  fix: "reword: Ranges of the prepared file to be read into the staging area or a cache slot (cache fill, replacements, the prompt path's staging)."
- object: "sys/muse-on-spark"
  field: "flows[gpu-readable-experts].description"
  quote: "whether its bytes are registered with the GPU driver and at which address the GPU reads them in place"
  kind: E
  because: "Strata's host-resident pinned copy read in place. comp/muse/expert-source is 'not responsible for: Keeping any expert in memory; the cache does that' and its adaptation says 'no copy in memory is possible'; host-memory-admission is not carried."
  severity: wrong
  fix: "drop"
- object: "sys/muse-on-spark"
  field: "flows[accelerator-expert-plan].description"
  quote: "published before CPU work starts"
  kind: C
  because: "comp/muse/expert-subsystem: 'There is no CPU path.'; cpu-expert-pool is not_carried."
  severity: wrong
  fix: "reword: Which routed experts the accelerator computes this layer, from cache slots or from the staging area."
- object: "sys/muse-on-spark"
  field: "flows[window-inputs].description"
  quote: "Token ids, per-row step counts and positions, written to fixed mapped buffers the graph copies from."
  kind: C
  because: "comp/muse/token-path: 'no recorded graphs in the first version'; decode-loop tokens-per-step 'One in the first version'; coverage excludes drafting and 'more than one conversation in memory at a time', so there are no several rows."
  severity: wrong
  fix: "reword: The token id and its position for this step."
- object: "sys/muse-on-spark"
  field: "flows[routed-experts].description"
  quote: "read by the publish kernel, the device-side resident plan and the combine"
  kind: D
  because: "The publish kernel (doorbell) and the device-side resident plan (zero-doorbell graph) are Strata's window-graph kernels; window graphs are not carried and the token path has 'no recorded graphs in the first version'."
  severity: wrong
  fix: "reword: 8 expert ids and weights per token; read by expert dispatch and by the combine."
- object: "sys/muse-on-spark"
  field: "flows[window-layer-handoff].description"
  quote: "Only in the doorbell graph; in the zero-doorbell graph the device plans from the residency table and the host is not asked."
  kind: C
  because: "Recorded graphs are not in the first version (token-path adaptation 'no recorded graphs in the first version'; window-graphs not_carried). The decode loop hands the routing to the expert subsystem at each layer."
  severity: wrong
  fix: "drop"
- object: "sys/muse-on-spark"
  field: "flows[window-layer-handoff].description"
  quote: "with the buffer the unweighted expert rows are to be written into"
  kind: C
  because: "A buffer for expert rows written by the host belongs to Strata's CPU expert pool, which is not carried: 'There is no CPU path.'"
  severity: doubtful
  fix: "reword: When a layer's routing is known: its feed-forward input and routed ids, handed to expert dispatch."
- object: "sys/muse-on-spark"
  field: "flows[kv-pages-for-attention].description"
  quote: "with the selected blocks made resident first when streaming is on"
  kind: E
  because: "comp/muse/kv-store adaptation: 'Moving old keys and values out of memory is not part of the first version.' There is no streaming; 'selected blocks' also assume a sparse selection the model card does not describe."
  severity: wrong
  fix: "reword: The keys and values an attention step reads."
- object: "sys/muse-on-spark"
  field: "flows[kv-append].description"
  quote: "written to the host copy always and to the fast-memory slot only if its block is resident"
  kind: B
  because: "machine.yaml: one unified pool, '没有独立显存'; kv-store adaptation: moving keys and values out of memory 'is not part of the first version'. There is no host copy."
  severity: wrong
  fix: "reword: The new position's keys and values of each attention layer, written into the store."
- object: "sys/muse-on-spark"
  field: "flows[engine-commands].description"
  quote: "Text lines on the engine's standard input"
  kind: D
  because: "A process boundary with a line protocol on standard input is how Strata's implementation is built; target.yaml leaves 'form: UNSET  # execution library, offline engine or online service'."
  severity: doubtful
  fix: "reword: Commands to the engine: generate with settings and prompt token ids, stop, report memory, save and restore."
- object: "sys/muse-on-spark"
  field: "flows[tokens-to-runner].description"
  quote: "with a heartbeat every 10 s of quiet"
  kind: D
  because: "A constant of the source implementation; nothing in model.yaml, machine.yaml or target.yaml sets it, and coverage says 'every number tuned for another model has been turned back into an open choice'."
  severity: doubtful
  fix: "reword: Token ids as they arrive, with a heartbeat after a configured time of quiet."
- object: "sys/muse-on-spark"
  field: "flows[prompt-to-read].description"
  quote: "one GEN or BGEN"
  kind: D
  because: "Protocol keywords of Strata's engine; BGEN is the batch generation command, and the coverage excludes 'more than one conversation in memory at a time' (engine-command-loop adaptation: 'No batch slots')."
  severity: wrong
  fix: "reword: The prompt token ids of one generation, to be read from the resume point."
- object: "sys/muse-on-spark"
  field: "flows[take-or-park].description"
  quote: "take or borrow from the chosen parked entry"
  kind: C
  because: "Parked entries are other conversations' state held in memory; coverage: not covered 'more than one conversation in memory at a time'."
  severity: doubtful
  fix: "reword: Save the outgoing conversation's state, if parking is kept, and restore the chosen one."
- object: "sys/muse-on-spark"
  field: "flows[parked-restore].description"
  quote: "attention keys and values and running state"
  kind: A
  because: "model.yaml: 'The card mentions no ... state other than attention'; layer-kernels adaptation: 'Muse's card names attention state only, so the recurrent state ... do not exist here.'"
  severity: doubtful
  fix: "reword: A parked conversation's attention keys and values and its token record, copied back into the live conversation."
- object: "sys/muse-on-spark"
  field: "flows[session-file-out].description"
  quote: "the live running state and every attention layer's keys and values"
  kind: A
  because: "model.yaml: no state other than attention; session-files adaptation: 'A session file holds this model's state only, the attention keys and values.'"
  severity: doubtful
  fix: "reword: One session file on storage: the conversation's token record and every attention layer's keys and values."
- object: "sys/muse-on-spark"
  field: "flows[gpu-busy].description"
  quote: "utilisation of 10% or more"
  kind: D
  because: "A threshold of the source implementation; not supported by the given files. On this engine the GPU may be idle while it waits on storage."
  severity: doubtful
  fix: "reword: Whether the GPU is working (utilisation above a configured threshold), read by the frozen-engine check."
- object: "sys/muse-on-spark"
  field: "flows[batch-samples].description"
  quote: "BSTAT and PSTAT lines, at most one a second, when batch telemetry is on"
  kind: C
  because: "Batch telemetry is for several conversations generated at once; coverage excludes 'more than one conversation in memory at a time' and engine-command-loop says 'No batch slots'. BSTAT/PSTAT are Strata protocol keywords."
  severity: wrong
  fix: "drop"
# ---------------- comp/muse/run-config-generator ----------------
- object: "comp/muse/run-config-generator"
  field: "decisions[spec-window].text"
  quote: "The speculative window and the confidence floor written by default."
  kind: C
  because: "coverage: 'Not covered in the first version: ... drafting'; lookup-drafter, draft-policy and draft-verifier are not_carried."
  severity: wrong
  fix: "drop"
- object: "comp/muse/run-config-generator"
  field: "decisions[context].text"
  quote: "131072 recommended, capped by a memory rule"
  kind: D
  because: "A default tuned for Strata's model. target c-context: 'value: UNSET'; at up to 2.0 MB per token (system.yaml) 131,072 tokens would be about 262 GB, over the 80 GB budget; coverage: 'every number tuned for another model has been turned back into an open choice'."
  severity: wrong
  fix: "reword: The context length: the person's choice, capped by what the memory budget leaves after the minimum expert cache."
- object: "comp/muse/run-config-generator"
  field: "decisions[kv-format].text"
  quote: "16-bit float at a context of 8192 or less, else 8-bit integer"
  kind: D
  because: "Thresholds tuned for Strata; coverage: numbers tuned for another model are turned back into open choices; target 'allowed_transformations: UNSET' does not settle whether 8-bit K/V is allowed."
  severity: doubtful
  fix: "reword: The K/V precision, by a rule to be set once the attention state's size per token is known, or the person's choice."
- object: "comp/muse/run-config-generator"
  field: "decisions[kv-streaming].text"
  quote: "Keep only a 32768-token window of K/V in fast memory when the context is 65536 or more and host memory suffices."
  kind: E
  because: "comp/muse/kv-store adaptation: 'Moving old keys and values out of memory is not part of the first version.' Also machine.yaml has one unified pool, so there is no separate host memory."
  severity: wrong
  fix: "drop"
- object: "comp/muse/run-config-generator"
  field: "decisions[resident-budget].text"
  quote: "Host memory given to resident experts."
  kind: B
  because: "machine.yaml: one unified pool, no separate GPU memory; host-memory-admission is not_carried ('Muse's experts are three times the machine's memory'). The cache size 'is left to the engine' (decision expert-cache)."
  severity: wrong
  fix: "drop"
- object: "comp/muse/run-config-generator"
  field: "decisions[hybrid-cpu-workers].text"
  quote: "the worker count is P - 1 + E/2, at most 32"
  kind: C
  because: "CPU expert workers serve Strata's CPU expert pool, which is not_carried; 'There is no CPU path'. The 'without a calibration' case refers to speed-calibration, postponed."
  severity: wrong
  fix: "drop"
- object: "comp/muse/run-config-generator"
  field: "invariants[inv/calibration-exact-hardware].text"
  quote: "A saved calibration is used only for the exact hardware key it was measured on."
  kind: C
  because: "comp/strata/speed-calibration is not_carried (postponed): 'It needs first measurements of this engine.'"
  severity: doubtful
  fix: "drop"
- object: "comp/muse/run-config-generator"
  field: "calls[config_for].takes"
  quote: "chosen GPUs"
  kind: B
  because: "machine.yaml lists one GPU (gpu0); launch-argument-resolver adaptation: 'this machine has one GPU'."
  severity: wrong
  fix: "reword: parsed options, RAM, context, KV format, model paths, engine build facts"
- object: "comp/muse/run-config-generator"
  field: "calls[GET /config, POST /config].does"
  quote: "Lets the running server's settings page read and change a fixed set of keys"
  kind: D
  because: "A settings page and HTTP endpoints of Strata's server; target leaves 'form: UNSET' and asks for none."
  severity: doubtful
  fix: "drop"
- object: "comp/muse/run-config-generator"
  field: "equivalence.relative_to"
  quote: "The model run at full precision without speculation limits"
  kind: C
  because: "coverage excludes drafting, so there are no speculation limits; the reference in target c-quality is 'the NVFP4 weights ... greedy sampling', not full precision."
  severity: doubtful
  fix: "reword: The published reference implementation with the NVFP4 weights"
