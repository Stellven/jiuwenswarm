engine: hyperqwen
basis: "notes (engines/hyperqwen.md, all sections) plus source: README.md (head), PATCHES.md (full patch table), top-level layout and file lists of prepare/, drafter/, scripts/, bench/, xgrammar/. Patch bodies, kernels and upstream vLLM 0.33.0 were not read beyond what the notes cite."
parts:
  - name: "head and embedding requantization"
    what_it_does: "Offline, requantizes lm_head and embed_tokens from bf16 to int8 (or GPTQ int4 for the fast variant), with an error bound, and publishes the model directory atomically (index written last, resumable)."
    evidence: "notes section 5; prepare/quant_lm_head.py, prepare/quant_embed.py, prepare/quant_heads_stream.py, prepare/atomic_publish.py, prepare/quant_schema.py"
    node_type: model-preparation
    fit: partial
    note: "Its whole purpose is to change weight values, which the type's not-clause and its invariant (every tensor reads back equal to the checkpoint) forbid; only the choices list admits precision change. The atomic, resumable publish is a real invariant the type does not mention."
  - name: "draft vocabulary builder"
    what_it_does: "Offline, counts which tokens the model itself emits on a corpus and selects the 40,960 most used rows; the draft head computes only those rows."
    evidence: "notes sections 8 and 12.2; prepare/build_draft_vocab.py, prepare/draft_vocab_ids.json, patches/qwen3_5-mtp-draft-vocab.patch"
    node_type: model-preparation
    fit: partial
    note: "It produces a lossy, workload-statistic-selected subset of an output matrix, not a re-laid-out checkpoint. It needs a corpus and model runs as input, which model-preparation has no port for. Its consistency rule (slice must come from the same quantized head the target uses) is unrepresented."
  - name: "drafter training and calibration pipeline"
    what_it_does: "Offline, captures target hidden states on collected prompts, trains or re-exports the MTP head, and GPTQ-quantizes the MTP module and the DFlash2 drafter (3.85 GB to 1.19 GB) using those captures."
    evidence: "drafter/capture.py, drafter/capture_dflash2.py, drafter/train_mtp.py, drafter/gptq_lm_head.py, drafter/quant_dflash2.py, drafter/requant_mtp_gptq.py, prepare/quant_mtp.py; notes section 8"
    node_type: none
    fit: none
    note: "Training and calibration create new weight values from run-time data (captured activations). model-preparation is lossless layout only; no type covers offline calibration or training of auxiliary model parts."
  - name: "chat template hardening"
    what_it_does: "Offline, hardens and translates the model's chat template that the server later uses to turn messages into prompt tokens."
    evidence: "prepare/harden_chat_template.py, prepare/translate_chat_template.py, bench/test_chat_hardening.py"
    node_type: request-front
    fit: partial
    note: "request-front is per_request; this is an offline preparation step of the tokenizer/template input that the type treats as fixed reference. It touches the invariant (token ids equal the reference tokenizer's) by deliberately changing the template."
  - name: "weight loader with load-time re-encoding"
    what_it_does: "At startup loads the W4A16 model into GPU memory, folds the sign of negative AutoRound group scales into the int4 codes, and selects per layer (by name regex) which layers run W4A8."
    evidence: "notes section 7; patches/marlin-int8-negative-scales.patch, patches/marlin-int8-layer-select.patch, patches/marlin-int8-asym-zp.patch, patches/qwen3_5-embed-quant.patch"
    node_type: weight-loader
    fit: clean
    note: "Re-encoding at load time is in the type's choices. The expert_layout output has no consumer here."
  - name: "embedding table in pinned host memory (UVA)"
    what_it_does: "Keeps the quantized token embedding in pinned host RAM behind a CUDA UVA view so the GPU reads only the rows each token needs."
    evidence: "notes section 5; patches/qwen3_5-embed-uva.patch"
    node_type: table-reader
    fit: clean
    note: "Matches summary and applies_when. Its skip rule when embeddings are tied to the output head (which reads the whole table every step) is a placement condition the type could state."
  - name: "vision tower host offload"
    what_it_does: "Does not load the vision tower by default; when VISION=1 its bulk weights live in host RAM and are used only for image inputs."
    evidence: "notes section 11; patches/vision-tower-cpu-offload.patch, launcher_common.sh lines 164 to 180"
    node_type: weight-loader
    fit: partial
    note: "weight-loader is for weights every token uses; these are used only by requests carrying images, read from host memory. Not experts and not a row table, so it falls between weight-loader, table-reader and expert-source. Multimodal input encoding is not covered by any type."
  - name: "memory budget and pool sizing"
    what_it_does: "At startup sizes the paged state pool, either from GPU_UTIL after a profiling run or pinned to a byte count (KV_MEM), and computes and prints how many requests can stay resident."
    evidence: "notes section 10; single-user/start_qwen.sh lines 506 to 681, batch/start_qwen.sh lines 109 to 153, patches/memory-profile-after-warmup.patch, patches/cudagraph-memory-from-allocator.patch, patches/pinned-kv-empty-cache.patch, patches/kv-cache-seat-budget.patch, patches/async-mamba-kv-sizing.patch"
    node_type: memory-planner
    fit: partial
    note: "The type assumes the residual goes to an expert cache (cache_size output); here the residual goes to the state pool. The real priced items are CUDA-graph memory, profiled activation peak and drafter weights, which the type does not name. Part of the planning is measurement (a profile run), not arithmetic from geometry, and the budget is environment-dependent (WSL2 overcommits silently instead of failing)."
  - name: "unified paged state pool"
    what_it_does: "One pool of equal-size pages shared by full-attention KV, fixed-size GDN recurrent state (1 + async depth + k pages per resident request) and the drafter's sliding-window KV, with group sizing and page ownership handed between requests."
    evidence: "notes sections 4, 6, 10; patches/hybrid-kv-groups-v2-cudagraph.patch, patches/hybrid-sw-block-promote.patch, patches/quant-scale-view-preserve-pages.patch"
    node_type: attention-state-store
    fit: partial
    note: "The type is per-sequence, per-position history. Here three kinds of state with different growth laws share one allocator; GDN state is fixed-size and cannot be truncated to a position without stored snapshots; pages change owner between requests and kinds, and the main known bug class (KVarN flushing into another request's GDN state) is an ownership rule the type has no place for."
  - name: "KV cache format and KVarN staged quantizer"
    what_it_does: "Stores attention KV as bf16, fp8, int8 or int4 per token-head, or KVarN 4/2-bit, where new KV is staged in fp16 and quantized per 128-token slab, with retired sinks held in fp16 until slots run short."
    evidence: "notes section 10; kvarn/files/.../kvarn/config.py, kvarn/files/.../kvarn_attn.py, patches/int4-kv-per-token-head.patch, kvarn/kvarn-recycled-pages-0.33.0"
    node_type: attention-state-store
    fit: partial
    note: "Precision of stored state is a listed choice, but KVarN changes the representation of the same state during its lifetime with a staging area and flush/drop rules; the type treats representation as a static choice. Also lowers draft acceptance (a speed effect of a state-precision choice)."
  - name: "hybrid prefix cache"
    what_it_does: "Reuses attention KV blocks of any earlier or concurrent request sharing a prefix (block hashing) and restores GDN state from the nearest aligned block boundary, optionally from extra in-prefill GDN checkpoints."
    evidence: "notes section 11; launcher_common.sh lines 200 to 222, patches/mamba-align-checkpoint-order.patch, patches/gdn-multi-prefill-checkpoints.patch"
    node_type: conversation-reuse
    fit: partial
    note: "It shares blocks among live requests, not parked conversations, and does not truncate a store; reuse granularity is a block boundary forced by recurrent state. The invariant (output after resume equals output after full read) is false here: greedy output differs between hit and miss."
  - name: "KV offload tier"
    what_it_does: "With KV_OFFLOAD_GB, evicted prefix blocks go to host memory and are fetched back over PCIe instead of being recomputed."
    evidence: "notes section 11; launcher_common.sh lines 190 to 198, patches/offload-dflash-eagle-groups.patch, patches/offload-mamba-swa-replay-boundaries.patch, patches/offload-wsl2-devptr.patch"
    node_type: conversation-reuse
    fit: partial
    note: "Straddles conversation-reuse (keeps prefixes for reuse) and attention-state-store (choice whether old state may leave fast memory). It is a tier of the prefix cache with its own transfer path, much like expert-transfer but for state."
  - name: "request scheduler (continuous batching)"
    what_it_does: "Each step admits requests up to max_num_seqs, mixes chunked prefill and decode within a 2048-token budget, preempts and recomputes when the pool is full, and takes the per-request draft length from the runner."
    evidence: "notes sections 9 and 10; batch/start_qwen.sh, single-user/start_qwen.sh (max-num-seqs, max-num-batched-tokens, no-async-scheduling), patches/dflash2-lookup-drafting.patch lines 178 to 194"
    node_type: multi-request-scheduler
    fit: partial
    note: "Its real job is per-step composition (which tokens of which requests run this step, preemption), not only admission; the type gives it no per_step port to the loop. Its invariant is false: batch composition changes rounding and thus greedy output. It applies even in single-user mode (up to 8 slots), so the applies_when is met in every mode."
  - name: "model runner step with captured graphs"
    what_it_does: "Runs one engine step for the whole batch through all 64 layers and the head, replaying a captured CUDA graph per batch shape and per verify-block length, with async scheduling overlapping steps."
    evidence: "notes sections 9 and 12.7; patches/dflash2-lookup-drafting.patch lines 122 to 146, patches/vllm-pr61612-flashinfer-async-barrier.patch"
    node_type: decode-loop
    fit: partial
    note: "The summary and invariant are written around expert routing, which does not exist here. One step serves many requests and mixes prefill and decode tokens, so decode-loop and prompt-reader are not separate units. The captured graph set constrains which window sizes the draft policy may pick."
  - name: "chunked prefill"
    what_it_does: "Processes prompts in chunks bounded by the batched-token budget, interleaved with decode in the same steps, leaving KV and GDN state behind."
    evidence: "notes section 10 (max-num-batched-tokens 2048); patches/mamba-chunked-prefill-align.patch, patches/vllm-pr40371-prompt-progress.patch"
    node_type: prompt-reader
    fit: partial
    note: "Not a separate unit but a kind of token within the shared step; several prompt reads may be in flight at once. The routing output does not apply. Chunk boundaries interact with GDN state alignment (a NaN bug class)."
  - name: "linear-layer GEMM kernels (Marlin W4A16 / W4A8)"
    what_it_does: "Computes the quantized linear layers with Marlin, optionally quantizing activations to int8 online for the selected layers to use int8 tensor cores."
    evidence: "notes section 7; patches/marlin-int8-*.patch, patches/marlin-tune-table.patch, patches/marlin-repack-staged-sm80.patch"
    node_type: layer-compute
    fit: partial
    note: "Kernel variant is a listed choice, but int8 activations change the model's arithmetic approximately (perplexity +2.2 percent); the type's effect_on_output treats layer-compute as the reference arithmetic and has no way to say a kernel choice is a lossy approximation needing quality evidence."
  - name: "attention and GDN kernels and backends"
    what_it_does: "Computes full attention (FlashAttention, FlashInfer, fp8 FA2 port, pth-flash-attn int8, int8-QK prefill Triton kernel) and GDN recurrence, the backend chosen by compute capability, KV dtype and mode."
    evidence: "notes sections 7 and 10; fa2/, pthfa/, patches/prefill-attn-int8.patch, patches/gdn-ba-pad-small-m.patch, patches/gdn-sm75-cuda-prefill.patch, patches/flashinfer-sm75-optin.patch"
    node_type: layer-compute
    fit: clean
    note: "Backend availability depends on hardware generation (sm75/80/86/89/90/120); the type's choices could name that."
  - name: "split-KV verify attention"
    what_it_does: "A Triton kernel for steps with several query tokens per request that splits KV into 16 segments with online-softmax partials and a merge, with a scratch buffer sized once at startup because its address is captured in graphs."
    evidence: "notes section 8; patches/spec-decode-attn.patch, patches/spec-decode-int8-kv.patch, patches/spec-decode-int4-kv-mq3d.patch, patches/spec-decode-scratch-within-budget.patch"
    node_type: layer-compute
    fit: clean
    note: "A kernel variant for the verify shape. Its scratch must be priced by the memory planner, which the planner's outputs do not list."
  - name: "token sampler"
    what_it_does: "Turns logits into tokens with temperature, top-k and top-p, using a sort-free top-k path when k is at most 64."
    evidence: "notes section 8; patches/sampler-small-topk-fast-softmax.patch, patches/sampler-warmup-cuda.patch, patches/topk-honour-flashinfer-sampler-switch.patch"
    node_type: sampler
    fit: clean
  - name: "rejection sampler (speculative acceptance)"
    what_it_does: "Accepts the longest prefix of drafted tokens the target agrees with: greedy by argmax, sampled by rejection sampling against the draft distribution q, and commits state accordingly."
    evidence: "notes sections 8 and 9; patches/vllm-pr64137-logits-stats-no-specialize.patch, patches/vllm-pr66026-gather-draft-sampled-no-specialize.patch, patches/spec-sampler-prewarm.patch, patches/vllm-pr50021-gdn-spec-bounds.patch"
    node_type: draft-verifier
    fit: partial
    note: "Under sampling it needs the draft distribution q as input, and correctness rests on q; draft-verifier has only the sampler's checked tokens. In this engine sampling and verification are one kernel chain, so sampler and draft-verifier are not separable. Committing recurrent GDN state requires per-draft-position state pages, which the commit port does not express."
  - name: "MTP draft head with truncated vocabulary"
    what_it_does: "The model's own one-layer chained draft module proposes 3 or 4 tokens, computing logits only over the 40,960-row draft vocabulary and setting the rest to minus infinity."
    evidence: "notes section 8; patches/qwen3_5-mtp-draft-vocab.patch"
    node_type: drafter
    fit: clean
  - name: "DFlash2 block drafter"
    what_it_does: "A separate 5-layer, 1.92B-parameter drafter that reads target hidden states from 5 layers and proposes a block of 7 tokens in one non-autoregressive pass, keeping its own sliding-window KV in the shared pool."
    evidence: "notes sections 2, 8, 10; patches/dflash2-prewarm.patch, patches/dflash-context-capacity.patch, patches/dflash2-fp16-residual-scale.patch, patches/dspark-draft-quant-config.patch"
    node_type: drafter
    fit: partial
    note: "It is a model with its own weights (loaded and placed like target weights) and its own attention state in the pool, so it needs weight-loader and attention-state-store peers the drafter type does not list. Its block size is fixed by training, a constraint on draft-policy."
  - name: "context lookup drafter and fusion"
    what_it_does: "Per step and request, a GPU kernel finds the longest suffix match in the request's token history and fills draft positions from what follows it, fused per position with DFlash2's proposals under two thresholds, rewriting q to a point mass at filled positions."
    evidence: "notes section 9; patches/dflash2-lookup-drafting.patch lines 349 to 544, patches/dflash2-ngram-chains.patch"
    node_type: drafter
    fit: partial
    note: "Input is the request's token history, not the context activations the type's port names. It combines two sources position by position, and its correctness obligation is on the proposal distribution q, which no port carries. Fusing sources is neither drafter nor draft-policy as defined."
  - name: "adaptive verify-block controller"
    what_it_does: "Host-side, once per step, lengthens the verify block from 8 to 16 only after two consecutive qualifying steps agreed by every request in the batch, using flags copied back one step stale, with STICKY hold only for a single request; also DYNAMIC_K by batch size."
    evidence: "notes section 9; patches/dflash2-lookup-drafting.patch lines 902 to 1000, single-user/start_qwen.sh lines 437 to 477"
    node_type: draft-policy
    fit: partial
    note: "Its decision is batch-wide, uses deliberately stale signals and hysteresis state, and may only pick sizes that have captured graphs. Its invariant (never changes which tokens are accepted) is false: block length changes rounding and so greedy text, and with KVarN plus prefix-cache hits it corrupts output, so it is pinned off in that combination."
  - name: "structured-output grammar constraint"
    what_it_does: "Constrains generation to a grammar (xgrammar) by masking logits per step, plus tool-call parsing of the streamed output."
    evidence: "xgrammar/README.md, xgrammar/install.sh, xgrammar/PIN, patches/continuous-stream-usage.patch"
    node_type: none
    fit: none
    note: "A per-request stateful automaton that changes which tokens are allowed and must stay consistent with drafts and verification. The sampler's fixed chain and request-front's tokenization do not cover it."
  - name: "OpenAI-compatible API server"
    what_it_does: "Serves chat/completions with streaming, prompt progress, /tokenize and /v1 routes, Ollama-compatible routes, deny-by-default API-key auth, SSE keep-alive, and applies the chat template and tokenizer."
    evidence: "README.md; patches/auth-deny-default.patch, patches/tokenize-v1-route.patch, patches/api-root-health.patch, patches/serve-model-path-match.patch, patches/vllm-pr40371-prompt-progress.patch"
    node_type: request-front
    fit: partial
    note: "Fits the summary; access control (auth, bind address, unguarded paths) is a real responsibility of the front with its own invariant that the type does not mention."
  - name: "engine core process"
    what_it_does: "Runs the engine loop in its own process, moving requests between front and scheduler and passing tokens back, with async scheduling and a stall sentinel thread."
    evidence: "patches/engine-completion-log.patch, patches/engine-stall-sentinel.patch; notes section 9 (async scheduling)"
    node_type: engine-control
    fit: partial
    note: "The type drives one request at a time and its invariant (at most one prompt read at a time) is false under continuous batching with chunked prefill. In vLLM the per-request driving belongs to the scheduler; engine-control here is only the process loop and liveness."
  - name: "tensor parallelism"
    what_it_does: "Splits the model across 2 or 4 GPUs (TP=3 and PP=3 invalid for this geometry)."
    evidence: "notes section 3; docs/multi-gpu.md, bench/test_tp_size.sh"
    node_type: multi-request-scheduler
    fit: partial
    note: "The type lumps sharing among requests with spanning devices. Splitting one model's arithmetic across devices is a different job (collectives, geometry divisibility) from admitting requests."
  - name: "launchers and run configuration"
    what_it_does: "Turns the operator's .env choices (mode, SPEC, CTX, INT8_ACT, KV format) and the detected GPU generation and platform into vLLM flags and env knobs for five ready-made profiles."
    evidence: "notes sections 3, 9, 10; single-user/start_qwen.sh, batch/start_qwen.sh, launcher_common.sh, resolve_config.sh, .env.example, patches/speed-knobs-envs.patch, patches/compile-key-runtime-knobs.patch"
    node_type: configuration
    fit: clean
    note: "Env knobs also enter the torch.compile cache key, so configuration determines which compiled artifacts are valid; the type does not mention that."
  - name: "compile, warm-up and graph capture"
    what_it_does: "At boot compiles kernels (torch.compile, Triton rungs of the drafter and rejection sampler) and captures CUDA graphs for each batch shape and both verify-block lengths, before serving."
    evidence: "notes sections 9 and 12.7; patches/dflash2-prewarm.patch, patches/spec-sampler-prewarm.patch, patches/sampler-warmup-cuda.patch, bench/warmup.sh"
    node_type: none
    fit: none
    note: "Produces the static execution plan that fixes buffer addresses and the allowed set of step shapes, and costs fast memory the planner must price. decode-loop lists graph-vs-layer-by-layer only as a choice."
  - name: "telemetry and progress logging"
    what_it_does: "Exposes Prometheus metrics (including spec-decode acceptance), logs one line per completed step, per-request terminal progress, and the resident-seat budget at startup."
    evidence: "patches/engine-completion-log.patch, patches/terminal-request-progress.patch, patches/kv-cache-seat-budget.patch, patches/bench-probe-errors.patch, scripts/turing_metrics.py"
    node_type: telemetry
    fit: clean
    note: "Its counters come from the scheduler and drafter rather than expert-dispatch; the port peers are engine-specific."
  - name: "liveness watchdog and doctor"
    what_it_does: "Warns when no step completes while requests are live and diagnoses environment faults (WSL2 overcommit, toolchain) before or during a run."
    evidence: "patches/engine-stall-sentinel.patch, scripts/hq-doctor.sh, bench/test_doctor.py"
    node_type: telemetry
    fit: partial
    note: "Health checking acts on the engine's liveness and environment, not on records attached to requirements; between telemetry and engine-control."
  - name: "patch series and provenance"
    what_it_does: "Applies about 70 patches with fuzz 0 to a pinned vLLM, each with kind, upstream reference, cut-against version and retirement condition, and verifies each is in place."
    evidence: "PATCHES.md, patches/apply.sh, patches/series, verify.sh, scripts/export-patch.sh, scripts/pin-bump.py, scripts/port-*.sh; notes section 12.1"
    node_type: none
    fit: none
    note: "The engine is upstream plus deltas. Which upstream version and which deltas form the running engine determines every other part's behaviour and evidence validity; no type is responsible for build composition."
  - name: "quality and speed harness"
    what_it_does: "Runs quality batteries, needle tests, greedy repeatability checks and throughput benchmarks to pair speed claims with quality evidence."
    evidence: "bench/quality_battery.py, bench/needle_test.py, scripts/check_greedy_repeatability.py, bench/run_benchmarks.sh"
    node_type: none
    fit: none
    note: "Off the run path; arguably outside an engine-part taxonomy, but it is how the engine's effect_on_output claims are checked. telemetry records a run; it does not evaluate one."
unclear_types:
  - {type: "model-preparation", problem: "The not-clause and invariant say no weight value changes, while choices allow changing precision. In this engine the main preparation work is lossy (requantization, vocabulary truncation, calibration), so the type contradicts itself on its most common use."}
  - {type: "decode-loop", problem: "Summary and invariant assume expert routing and a single sequence. Under continuous batching one step serves many requests and mixes prefill and decode, so decode-loop and prompt-reader cannot be told apart as units."}
  - {type: "prompt-reader", problem: "Assumes prompt reading is a separate phase per request. Here it is chunked and interleaved in the same step as other requests' decode; the routing port does not apply to a dense model."}
  - {type: "engine-control", problem: "Summary (one request at a time) and invariant (at most one prompt read at a time) only hold for a single-stream engine. In a batching engine its per-request duties belong to the scheduler, leaving only the process loop."}
  - {type: "multi-request-scheduler", problem: "Defined as admission only, with no per-step output to the loop, yet it decides each step's composition and preemption. Its invariant (output independent of co-scheduled requests) is false here, and its effect_on_output field already concedes it."}
  - {type: "attention-state-store", problem: "Per-position state with truncation to a position does not fit recurrent (GDN) state, which is fixed-size and can be rolled back only via stored snapshots. It also does not describe a pool shared by several state kinds and requests with page ownership transfer."}
  - {type: "conversation-reuse", problem: "Framed as parking earlier conversations; here it is block-hash sharing among any requests, with reuse only at aligned boundaries. The equality invariant is false for this engine (greedy differs on hit vs miss)."}
  - {type: "memory-planner", problem: "Its outputs target an expert cache; for a dense model the residual goes to the state pool. It omits graph memory, activation peak and drafter weights, and assumes planning is arithmetic when this engine measures by a profile run."}
  - {type: "draft-policy", problem: "Invariant (changes how much work, never which tokens are accepted) is false under floating point: block length changes rounding and greedy text. Port model is per-request; here the decision is batch-wide and limited to sizes with captured graphs."}
  - {type: "drafter", problem: "The only input is target activations; a lookup drafter reads token history. Proposal distribution q, on which verifier correctness depends, is not a port. A separate draft model needs its own weights and state, not listed."}
  - {type: "sampler", problem: "Separating sampler and draft-verifier assumes acceptance follows sampling; in a rejection sampler they are one computation reading both target and draft distributions."}
  - {type: "layer-compute", problem: "effect_on_output says this is the model's reference arithmetic, but kernel choices here (int8 activations, int8-QK attention) are deliberate approximations; there is no way to mark a kernel variant as lossy."}
missing_or_wrong:
  - {kind: missing, proposal: "engine-build", summary: "Compose the running engine from an upstream version and a set of patches or extensions, each with provenance and retirement conditions, and verify the composition before start.", parts: ["patch series and provenance"]}
  - {kind: missing, proposal: "graph-capture", summary: "At startup compile kernels and capture static execution plans for each step shape, fixing buffer addresses and the set of shapes later policies may choose.", parts: ["compile, warm-up and graph capture"]}
  - {kind: missing, proposal: "output-constraint", summary: "Hold per-request grammar or format state and mask the allowed tokens each step, consistently across drafts and verification.", parts: ["structured-output grammar constraint"]}
  - {kind: missing, proposal: "model-calibration", summary: "Offline, derive new or reduced weights from data or model runs (quantization calibration, draft-head training, vocabulary selection), with an error bound and consistency rules to their sources.", parts: ["drafter training and calibration pipeline", "draft vocabulary builder", "head and embedding requantization"]}
  - {kind: missing, proposal: "state-pool", summary: "Allocate and hand over pages of one memory pool among several kinds of per-request state (growing KV, fixed recurrent state, sliding-window state, staging) with group sizing, residency vs admission, preemption and ownership rules.", parts: ["unified paged state pool"]}
  - {kind: missing, proposal: "model-parallelism", summary: "Split one model's computation across devices and keep them in step, subject to geometry divisibility.", parts: ["tensor parallelism"]}
  - {kind: split, type: "attention-state-store", why: "Growing per-position KV and fixed-size recurrent state have different truncation, commit and sizing laws; speculative commit of recurrent state needs per-position snapshots."}
  - {kind: split, type: "multi-request-scheduler", why: "Sharing the engine among requests (batching, admission, preemption) and spanning devices or machines are unrelated jobs."}
  - {kind: split, type: "model-preparation", why: "Lossless re-layout and lossy re-encoding have opposite invariants; one type cannot hold both."}
  - {kind: merge, types: ["sampler", "draft-verifier"], why: "In this engine acceptance is the sampling step (rejection sampling over target and draft distributions); the boundary between them is not a real interface."}
  - {kind: merge, types: ["decode-loop", "prompt-reader"], why: "In a continuous-batching engine both are token kinds within one step executor; they can be distinguished as modes, not as units."}
unused_types:
  - {type: "expert-source", explained_by_applies_when: true, note: "Dense model, no experts."}
  - {type: "expert-cache", explained_by_applies_when: true, note: "Dense model, no experts."}
