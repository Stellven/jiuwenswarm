"totals": {"decisions": 313, "covered": 104, "loosely": 48, "not_covered": 143, "engine_specific": 18}
"observations": ["The choices name what to size or place but rarely what happens when it cannot be had: fallbacks, retries, degradation order and refusal conditions are mostly missing.", "Nearly every type\
    \ omits overlap and ordering of work in time (fetch during compute, prefill yielding to decode, side reads during a step), which is where much engine design lives.", "Stopping, pausing and threshold\
    \ rules (draft confidence floors, drafting pauses, split thresholds, warm-up conditions) are absent from the speculation and dispatch types.", "State upkeep across rollback and reuse is thin: how rejected\
    \ positions are undone, when checkpoints are cut and what key makes stored state reusable are not choices.", "Precedence between operator values, presets, calibration and automatic fits, and whether\
    \ an operator value is a hard limit or a target, recurs in several components but has no home.", "Some decisions are model-defined facts (layer compression schedule, n-gram hash, draft token subset)\
    \ rather than engine choices; the types have no place for model facts the engine must honour, nor for decisions that change output such as residency-biased routing."]
