- component: comp/strata/http-front
  decisions:
  - How many inference calls may wait beyond those the engine can run at once. Unset means no bound.
  - The number of reserved inference calls above which a new one is refused with 429.
  - How long a request may wait for the engine before it is answered 429.
  - How long a streaming write may make no progress before the request ends as a disconnect.
  - How often the watcher checks whether the client closed its socket.
- component: comp/ds4/api-server
  decisions:
  - When an accepted run of drafted tokens crosses a tool call grammar boundary, where the sampling mode changes, go back
    to the start of that run and recompute the token at the boundary. At most one verify block is replayed.
- component: comp/strata/host-memory-admission
  decisions:
  - The n-gram table is locked in RAM only if available RAM holds the table, the whole expert arena still to be filled, and
    a headroom; unknown availability, table size or expert size admits nothing. Considered only when --ple-io was not given
    and STRATA_PLE_AUTO_RAM is not 0.
  - Load when the arena's need fits; when a hard memory limit or the available RAM is below the need, fall back to the file
    source if allowed, else refuse (hard limit) or warn and load (available RAM).
  - The engine may swap the arena for the file source on its own unless --ple-io ram was given by hand, a shared arena file
    is named, or STRATA_ARENA_RAM_FALLBACK=0.
  - '--ram-keep-gib W (or STRATA_RAM_KEEP_GIB): RAM that must stay available after the arena; added to the arena''s need.'
  - 'RAM the reduced copy of the hottest experts leaves free: the larger of ram-keep and the safety headroom; STRATA_RESIDENT_HEADROOM_GIB
    overrides.'
  - 'Budget of the reduced RAM copy: available minus headroom, or none when that leaves under 1 GiB.'
  - Page-locked memory held while the arena registers and released right after it.
  - 'Page-locked memory held until READY or until a guarded allocation is refused: a quarter of the soft reserve, at least
    64 MiB.'
  - A reserve that cannot be had is halved down to 16 MiB, then skipped.
- component: comp/ds4/kv-state
  decisions:
  - Each layer keeps the raw rows of the most recent positions.
  - Layers 0 and 1 have no compressed history. From layer 2 on, even layers compress every 4 tokens into one row and an indexer
    picks at most 512 rows once there are more than 512. Odd layers compress every 128 tokens into one row.
  - Rows written for rejected positions stay where they are and are made invisible by the row counters. They are overwritten
    the next time those positions are written.
- component: comp/ds4/engram-prewarm
  decisions:
  - Prewarm only when model size plus runtime buffers plus table size plus a 64 GiB reserve does not exceed physical memory.
  - Number of threads that read the table sequentially.
- component: comp/ds4/expert-cache
  decisions:
  - If locking a buffer fails, the effective cache limit is lowered.
- component: comp/strata/lookup-drafter
  decisions:
  - Shortest match that produces a proposal.
  - Longest match length counted.
  - Most recent end positions kept per trigram.
  - History tokens the index is sized for.
  - Tokens a lookup may append after the neural drafts in the same window, and the shortest match it extends on.
- component: comp/strata/engine-command-loop
  decisions:
  - How many sequences the engine keeps open. Zero means one request at a time.
  - The engine runs as many slot sessions as it can allocate on every stage; fewer than two turns batching off. It reports
    the number it runs.
  - The most rows one batch window holds.
  - With the opt-in slot drafts a slot takes two rows, so at most four slots are in one window and more take turns.
  - On a layer split, the slots are divided into groups that flow through the cards as a pipeline. The count must divide the
    slot count, else one group.
  - While a prompt is read beside decoding slots, after each prompt chunk the slots decode for this fraction of the time the
    chunk took.
- component: comp/strata/expert-cache
  decisions:
  - How many slots the cache has. The automatic value is the free fast memory minus a reserve, divided by the largest expert;
    after opening, free memory is read again and the cache is shrunk if the reserve was not really left.
- component: comp/strata/resume-decision
  decisions:
  - Reuse of any kind needs a checkpoint capacity above zero.
  - 'Which stored state wins: the live session and its checkpoints, longest first; then an idle batch slot or its checkpoints
    if strictly longer (text-only requests); then the best parked conversation if strictly longer than both.'
  - A match on a parked conversation's live state or deepest checkpoint moves the whole entry into the session; a match on
    a shallower checkpoint copies only the K/V up to that point and leaves the entry parked. No borrow with a layer split
    or past a pinned checkpoint.
  - A card that would have to create its copy stream and has less than this much VRAM free gets no restore; the prompt is
    read again.
- component: comp/strata/launch-argument-resolver
  decisions:
  - Which value an engine option takes at a launch.
  - A calibration record is applied at launch only if its model name, context length and image setting equal the current configuration's.
  - 'The order of changes at every engine start: the active tuning preset, then the person''s options again, then the drafter
    choice, then the fast-memory fit, then draft-layer, vision, layer-split, elastic and parallel additions.'
  - On this backend the only option the start-time fit changes is the size of the K/V window kept in fast memory; it never
    changes the context length or the request count, and keeps a value the person set. Nothing is fitted on a layer split
    or with several cards.
  - One drafter is chosen per run and the drafter options are rewritten to match.
  - The engine's environment names the cards by bus order and restricts it to the configured cards; library folders come first
    on the search path.
- component: comp/strata/expert-source
  decisions:
  - Arena by default. File source with --mmap-experts, --resident-experts or --resident-budget-gib, and automatically for
    this run when RAM is still short after the wait and the give-back.
  - The arena is filled from the GGUF shards when the pack is native, has no experts.bin, records GGUF offsets and --native
    is set; else from experts.bin.
  - Threads that fill the arena.
  - Seconds to wait for RAM an exiting program still holds, polled every 0.25 s; STRATA_ARENA_RAM_WAIT_S.
  - Large pages first (all or nothing), else ordinary pages; STRATA_NO_LARGEPAGES skips the attempt.
  - Register the whole arena with the GPU driver; if refused or capped, register layer by layer from the start until refusal
    or cap; keep the unregistered rest resident with an operating-system lock; large pages take no lock. STRATA_ARENA_PIN_GIB
    sets a cap, none, or auto; STRATA_ARENA_LOCK=0 disables the lock.
  - Under WDDM with several GPUs or remote experts at most this much of the arena is registered.
  - 'STRATA_PIN_BY_NEED=1: register chosen byte ranges (the hottest experts the GPU cache will not hold first) instead of
    a prefix. Off by default.'
  - On bare Linux a short arena still loads when a 2 MiB huge-page pool holds the whole mapping or free plus droppable file
    pages cover the need; STRATA_ARENA_FILE_CACHE=0 disables.
  - On Windows the fill bypasses the file cache when a timed probe says the files are not cached and RAM could not keep them
    cached beside the arena; STRATA_UNBUFFERED_LOAD forces either way. Always buffered elsewhere.
  - When the file source is taken automatically and an expert profile exists, a RAM copy of the hottest experts is also built
    within the reduced budget; STRATA_ARENA_FALLBACK_RESIDENT=0 keeps the plain file source.
- component: comp/strata/native-weight-loader
  decisions:
  - --native turns on native projections, native head and native embedding together; --native-head-gguf and --native-dense-gguf
    choose other files.
  - 'Which per-layer tensors are served natively: attn_qkv, attn_gate, ssm_out, attn_q, attn_k, attn_v, attn_output, and the
    three shared-expert matrices; plus the PLE key in four types.'
  - STRATA_HC_Q8 is turned on by default on CUDA when the shards carry the hyper-connection projections as Q8_0; a value the
    user set is kept.
  - The token embedding stays in page-locked host memory by default; STRATA_EMBED_VRAM=1 puts it on the card.
  - The output head is on the card unless the startup sizing moves it to page-locked host memory as its last resort.
- component: comp/strata/dflash2-drafter
  decisions:
  - Whether this drafter is loaded.
  - 'Widest verify window for this drafter by card class: 8 for unified-memory cards, 8 for compute capability 12.0 with at
    least 48 GB, 6 for other capability 12, no cap otherwise.'
  - The window ends where the product of the selector's probabilities falls below --draft-conf.
  - Skip the draft round when the lookup match is at least this many tokens.
- component: comp/ds4/distributed-tp
  decisions:
  - Routed experts of each layer are split in half by id range. Machine 0 holds the lower half.
  - The output head is split in half by vocabulary.
- component: comp/ds4/expert-eviction
  decisions:
  - Heat goes up by 1 every time the router selects the expert, on a miss as well as on a hit. Otherwise an expert that keeps
    being selected but is evicted before its second hit would always lose.
  - After this many generated tokens all heat values are shifted right by one bit. Prefill does not advance this clock.
  - The entry with the lowest heat is chosen. Among equal heat the one unused longest. Entries in flight and the experts selected
    for the current layer are passed over.
  - If no victim is found only because of in-flight entries, wait for those commands to finish and try once more.
  - The cache starts from a built-in list of often used experts gathered offline, ordered by hits per weight. One list for
    Flash and PRO.
- component: comp/strata/parked-conversations
  decisions:
  - 'The host memory the cache may take. Given by flag, else computed once at start: 40% of available memory above the floor,
    capped at 8192 MiB, rounded down to 256 MiB, zero below 1024 MiB or when memory cannot be read.'
  - The most conversations parked at once.
  - Host memory that must stay available after a park, a session save or a restore.
  - A conversation is parked only on a switch or a rewind, not on each continuing request, and before a batch slot is overwritten.
  - An allocation is admitted when available memory is at least the floor and the allocation fits above it. Available is the
    least of the system's figure, the room under each control-group limit and an operator cap. An unreadable figure refuses.
  - When the same conversation is parked again, only K/V pages after the first rewritten token are copied again.
- component: comp/strata/output-head
  decisions:
  - The projection reads the head in the model file's own format when the --native preset loaded it, otherwise in the pack's
    format with an 8-bit activation image.
  - 'Window loop: inside the window graph, in column chunks for long windows. Session loop: called by the driver after the
    layer loop, followed by a device synchronisation and by default a full logits read-back and a scan for non-finite values.'
- component: comp/strata/session-files
  decisions:
  - 'Exactly one checkpoint is written: the deepest, or the deepest pinned one.'
  - Disk space that must remain after a save.
  - 'Opt-in: a save short of memory first drops retained K/V, then evicts parked conversations oldest first, then erases checkpoints
    other than the one to be written and pinned ones.'
  - Session files are refused with a layer split, a peer device, batch slots, a checkpoint capacity of zero, or no complete
    live session.
  - 'What binds a file to a configuration: engine version, backend, KV format, context length, resident K/V, draft window,
    K/V rotation, position-encoding parameters, the control-vector digest and 23 arithmetic switches. Sampling, seeds, draft
    tuning, expert tier and prompt chunk are excluded.'
  - 'What binds a file to a model: for each loaded model input, its size and its first and last MiB. An edit in the middle
    of a file is not detected.'
  - With the reclaim option, the server retries a save refused for memory up to 3 times, waiting up to 30 s for memory.
- component: comp/ds4/prefill-driver
  decisions:
  - How many tokens pass through a layer together.
  - While a layer computes, the experts the next layer needs are read. On CUDA for V4.1 the selected experts are read in file
    order and adjacent reads are merged.
  - A long prefill yields to decoding sessions every 128 tokens.
  - A prefill that starts from the beginning sets expert heat to zero.
- component: comp/strata/replica-router
  decisions:
  - Whether several engines run. Off unless configured.
  - The cost of one request already running on a replica, in prompt tokens.
  - Hashes of 64-token blocks kept to track what each replica holds.
  - A dead replica is started again in the background at most this often.
  - 'Opt-in: back every replica''s expert arena with one shared memory object so the experts are in RAM once.'
- component: comp/strata/draft-policy
  decisions:
  - How much better a lookup or chained window must be than the neural drafter's window to be taken. The cost-aware window
    uses a third of it.
  - Whether the MTP window width is chosen step by step from each draft's probability and the measured cost of each width.
  - Which window sizes a lookup or chained window may use. A size whose window graph finds no GPU memory is dropped for the
    rest of the process.
  - When a neural drafter is loaded, a lookup window is considered only if its first token equals the neural drafter's first
    draft. Not required in probabilistic mode.
  - Without the cost-aware window, the MTP window ends before the first draft whose probability is below --spec-min-p.
  - 'Under --draft auto, the drafter of a request that names none: df2, mtp or learn.'
- component: comp/strata/mtp-drafter
  decisions:
  - Rows the drafter's graphs hold.
  - 'Most drafts in one round: the smallest of rows minus 1, the configured cap, and the cells left in the context.'
  - Configured cap on drafts per round.
  - 'When the draft chain stops before the cap: at the first draft whose probability is below --spec-min-p, or when the draft
    policy''s cost rule says so.'
  - How many of the latest cells the draft layer attends to.
  - 'Which rows of the verified window get their draft K/V written: accepted rows only, or all rows (STRATA_MTP_CATCHUP_ALL=1).'
  - The token subset the draft head covers. Drafts can only be tokens in the subset.
  - Whether the draft K/V is a ring of window + 4 x rows + 64 cells over a pinned host copy, or fully resident when pinned
    memory is short.
  - Whether drafts are sampled with the request's sampler chain instead of taken as the argmax.
- component: comp/ds4/model-preparation
  decisions:
  - Which tensor formats the routed experts get. In the Q2 recipe gate and up matrices use IQ2_XXS and the down matrix uses
    Q2_K.
  - Which formats attention projections, shared expert and output head get.
- component: comp/ds4/prefix-reuse
  decisions:
  - A checkpoint file is named by the SHA of the rendered text prefix, not by a hash of the token sequence. The file still
    carries the exact tokens and state.
  - Fewest tokens for which a checkpoint is stored.
  - A cold start prompt is stored up to this many tokens.
  - A continuing conversation is stored each time it grows by this many tokens.
  - The boundary is moved back 32 tokens and aligned to 2048.
  - Upper limit of disk space for checkpoints.
  - Half life of the hit count used for retention.
  - Checkpoints made with a different quantization may be reused by default. A switch forbids it.
- component: comp/ds4/dspark-drafter
  decisions:
  - Most tokens drafted in one round.
  - Drafting stops when the confidence of a draft is below this value.
  - Drafting needs the features of the most recent 128 positions to be complete. After a session is restored, ordinary decoding
    runs until the window is full.
  - The draft support file must come from the same checkpoint as the main model.
- component: comp/strata/cpu-expert-pool
  decisions:
  - 'Default: physical cores on the host thread''s socket minus one for the host; one more kept free when that is 16 or more;
    on a hybrid CPU with more efficiency than performance cores at most performance cores minus one plus half the efficiency
    cores; at most a container''s CPU quota minus one; never above 32. A configured count runs as given with a warning.'
  - The host thread claims jobs itself during a batch.
  - Row ranges a phase is cut into (--pool-tasks, 0 to 4096).
  - A parked worker spins this long, then sleeps on a condition variable (STRATA_POOL_SPIN_US).
  - A wait that sees no progress this long stops the process after releasing the GPU's waits.
  - 'Single-token path: one job per missed expert, whole or split by rows across threads. Window path: one job per distinct
    missed expert carrying every token routed to it, in two row phases (gate and up rows, then down rows) with a quantisation
    between.'
  - With two or more memory nodes the row phases are split one slice per node when that can run (STRATA_NUMA_POOL=0 turns
    it off).
- component: comp/strata/kv-store
  decisions:
  - 'Storage format, with bytes per position per attention layer: fp16 2048, int8 with one scale per 64 values 1056, rotated
    4-bit 576, 8-bit keys with rotated 4-bit values 816.'
  - Positions per attention layer kept in fast memory (--kv-resident). 0 keeps every position there and makes the resolve
    step a no-op. Streaming applies only when the window is smaller than the context.
  - The smallest resident window a streamed layer may have (STRATA_KV_RESIDENT_MIN, at least 1024).
  - Positions per page; one page is one indexer block.
  - With --kv-grow (fully resident, single GPU only) the pages get addresses for the whole context but physical memory only
    for the first 16384 positions; more is mapped as the context grows, from chunks the expert cache gives up.
  - The draft layer's state keeps only its window of pages in fast memory at block modulo slots, with a host copy for resume.
- component: comp/strata/slot-scheduler
  decisions:
  - The most slots asked of the engine without a layer split.
  - How often one request's prompt read gives way to a waiting request whose prompt is at most half as long.
  - How often a request left alone in a slot returns to the solo path, and the fewest tokens it must still be allowed.
  - 'Opt-in: new requests with at most N prompt tokens take the prompt-reading channel before longer ones; a longer one that
    waited 30 s counts as short.'
  - 'Opt-in: the request holding the channel also sends up to N-1 waiting prompts so the engine reads them in one pass.'
  - How often a request tries another slot after the engine refused one, and how long a refused slot is kept out of the picks.
  - How long the control lines or a slot stay held for an engine that owes an end line and says nothing, before the engine
    is ended.
  - The turn token id, the 8192-token branch boundary and the 512-token minimum prefix used by the slot choice repeat engine
    defaults by hand; no code links them.
- component: comp/strata/expert-dispatch
  decisions:
  - 'The order in which paths are tried for a routed expert: cached in fast memory; omitted because it ranks low for every
    token of the window; held by a second accelerator; fetched for this window only; computed by the CPU.'
  - A missed expert that every token of the window routes only at this rank or lower is neither fetched nor computed.
  - How many of a layer's missed experts are fetched for this window instead of being left to the CPU. A fixed share, or a
    count from measured CPU and accelerator costs when that option is on.
- component: comp/strata/ngram-reader
  decisions:
  - 'How rows are read. Unless --ple-io is given: the table is held locked in memory when available memory is at least the
    table plus the expert arena still to be filled plus 8 GiB, measured before either is allocated; otherwise unbuffered direct
    reads. Unknown figures admit nothing. STRATA_PLE_AUTO_RAM=0 keeps direct reads. A third mode maps the table without locking.'
  - Outstanding storage reads (--ple-inflight, 1 to 1024).
  - Rows kept after being read, 8-way set-associative with round-robin replacement (--ple-row-cache, 0 disables).
  - 'Direct mode with the worker: after this long without a read, read one random page of the table, until 60 s after the
    last request for rows (STRATA_SSD_KEEPALIVE, 0 off).'
  - Direct reads are probed at start; below 15000 rows per second the engine warns and switches to mapped reads only when
    STRATA_PLE_AUTO_MMAP=1.
  - Row number = (XOR over the n-gram of token id times a per-position multiplier) modulo the head's vocabulary size plus
    the head's offset; 8 bigram heads and 8 trigram heads; a missing or end-of-sequence predecessor cuts all older context.
- component: comp/strata/window-loop
  decisions:
  - 'Per window: the zero-doorbell graph when the host residency table shows every expert of the stage in fast memory, otherwise
    the doorbell graph. Checked before each window.'
  - Whether the window's rows go through multi-row kernels (STRATA_DEC_BATCH).
  - Whether the window is split into two token groups whose CPU and GPU work are pipelined (--spec-split).
  - How long the host waits for a layer signal before it enters the driver once to flush and check for a fault.
  - How long a layer may stay silent before the window is abandoned and the GPU's waits are force-released.
  - 'When the window''s n-gram rows are gathered. Doorbell graph: after layer 0''s CPU experts are served and before the layer-0
    flag is raised. Zero-doorbell graph: right after the launch, or before it when STRATA_VERIFY_EARLY_PLE_FLAG says so (0
    on CUDA).'
- component: comp/ds4/dspark-scheduler
  decisions:
  - A judgement is made each time this many rounds are complete.
  - Below this mean number of accepted drafts per round, drafting pauses.
  - How many rounds a pause lasts. Ordinary decoding is used meanwhile.
  - When the drafter gave no draft at all, pause at least 3 rounds. 4 if only short acceptances came before. 7 if nothing
    was ever accepted and the first confidence was not above 0.5.
  - When more than half the rounds of a window gave no draft, pause at least 4 rounds.
  - Judgements use counts only and never elapsed time, so that which path advanced a token does not vary with machine load
    and greedy output stays repeatable. The time based option is off by default.
- component: comp/ds4/engram-row-reader
  decisions:
  - For each new token, a multiplicative hash of its compressed vocabulary id and those of the 3 tokens before it, taken modulo
    a set of primes, gives 24 row numbers per table.
  - Rows are read through a separate file descriptor that bypasses the page cache. F_NOCACHE with read-ahead off on macOS
    and POSIX_FADV_RANDOM on Linux. Rows are scattered, so read-ahead would bring in useless pages and take memory the model
    needs.
  - During prefill the row numbers of a batch of at most 2048 tokens are sorted and then read by a fixed number of concurrent
    read threads.
- component: comp/strata/request-runner
  decisions:
  - Which sampling value wins when several sources give one.
  - Without batch slots, one request at a time holds the engine. The turn is a plain lock polled with a timeout; arrival order
    is not enforced.
  - With thinking on and no budget given, close the thinking early enough that the answer keeps a share of the output limit.
  - End the reply as length when one token repeats this many times in a row.
  - When the engine reports non-finite logits before any token was sent, send the same request once more.
  - 'Opt-in: when the thinking repeats whole passages, either end the reply or continue from a rewritten prompt with temperature
    at least 1.0 and presence penalty at least 1.5.'
  - A ping is sent when nothing has gone out for this long.
- component: comp/strata/weight-loader
  decisions:
  - Source bytes read and uploaded per round.
  - 'One of four transforms per plane, named by the index row: copy; keep the high 16 bits of a BF16 value stored as 32 bits;
    convert an F16 value stored as 32 bits back to 16; widen an fp16 scale plane to 32 bits.'
  - Tensors another loader serves are not read; their rows keep metadata and no bytes. --keep-canonical loads both forms.
  - 'STRATA_HC_REQ8=1 on one GPU: the hyper-connection projections are requantized to int8 with one scale per 32 values instead
    of being loaded as BF16. Off by default.'
- component: comp/strata/expert-router
  decisions:
  - 'Which top-10 kernel runs. Without the --native preset: the generic kernel (router_top10.cu). With it, for 512 experts
    and 10 picks: the fused native kernel (native_router.cu), in its multi-row form for a window of more than one row. The
    window loop requires the preset, so native packs use the native kernel.'
  - 'STRATA_ROUTE_PRIOR=lambda: pick the 10 again with a logit bonus for experts resident in fast memory; the weights stay
    the router''s own.'
  - 'STRATA_ROUTE_RESIDENT: swap a non-resident expert at a tail rank for a resident one within a logit margin.'
- component: comp/ds4/decode-loop
  decisions:
  - Row numbers are computed and the read thread started as soon as the token is known. The GPU encodes layer 0 first and
    layer 1 waits for the read when it needs the rows.
  - If any step of a drafted round fails, the whole session state is marked invalid and the caller prefills again from the
    kept token list.
- component: comp/ds4/weight-mapping
  decisions:
  - Register the whole mapping for device access, or copy it to device memory, or when sharded register only the expert range
    this machine owns.
- component: comp/strata/layer-kernels
  decisions:
  - Residual read (attention half), mixer (attention on 12 layers, recurrent on 36), residual write, residual read (feed-forward
    half), router and publish, shared expert, then after the host or the GPU has supplied the expert rows the combine and
    the residual write. On layer 1 the n-gram block updates the residual first.
  - Norm, key and value projections, append to the key and value store, append to the indexer, query projection, block scores,
    block top-k, make the selected blocks resident, attention, gate, output projection.
  - The shared expert runs right after the layer signal so that the GPU computes it while the host runs the CPU experts.
  - The residual read folds in the previous half's pending write. On only with the native projection contract and no dump
    or stage timing.
  - The session arena is sized once from the context length, the layer range and the key and value storage plan; nothing is
    allocated on the token path.
- component: comp/ds4/memory-plan
  decisions:
  - The fraction of the system's suggested working set size taken before non-expert weights are subtracted. Settable through
    DS4_SSD_AUTO_CACHE_PCT between 50 and 95.
  - Cache bytes divided by the bytes of one expert, at least 1 and at most the number of experts in the model.
  - A byte count or slot count given by the user is a target and not a guarantee.
- component: comp/strata/engine-client
  decisions:
  - 'How the server talks to the engine: a child process started with --serve, text lines on its standard input and output,
    standard error to a log file.'
  - How long the engine may take to report READY.
  - How often a start that exits before READY for a transient reason is tried again, after 2, 4 and 8 s.
  - One more start with no drafter when a card ran out of memory; one more start with the MTP drafter when an automatically
    chosen DFlash2 drafter did not start.
  - How long a running request's engine may print nothing before it is killed. A first prompt chunk adds min(prompt, 32768)/50
    s; after a progress line the allowance is 3 times the last chunk's time.
  - An engine that prints nothing for this long and also used at most 0.5 CPU seconds and 1 MiB of I/O in that time, while
    the GPU is not busy, is killed.
  - Inside the engine, a thread aborts the process when a busy request records no progress beat for this long.
  - How often a dead engine is started again at the next request, 15 s apart.
  - After this many engine deaths from a fatal GPU error within ten minutes the engine is not started again until the window
    has passed.
  - Unload the engine after this many idle seconds. Off by default.
  - A top_k outside 1 to 64 is sent as 64, the most candidates the engine's sampled path keeps.
- component: comp/ds4/expert-stream-reader
  decisions:
  - At startup experts are read in the order of the built-in hot list, at most this many in automatic mode, to avoid thousands
    of reads at startup.
- component: comp/strata/engine-diagnostics
  decisions:
  - Whether choices are counted. On by default.
  - Whether the counts are written as a file at process exit. Off unless a path is given.
  - Whether a record of the engine choice, budgets, fast paths taken or declined and tensor formats is written. Off unless
    a file is named. Written before READY and again after a request that changed something.
  - Whether batch windows and per-stage in-flight time are sampled, at most once a second, as BSTAT and PSTAT lines. Off by
    default.
  - Whether research counters of the batch loop are printed to the log when it goes idle. Off by default.
- component: comp/strata/server-metrics
  decisions:
  - Tokens per second of a finished request is the engine's generated count divided by the engine's decode time, which runs
    from the end of the prompt read to the last token and so includes the first window. Not reported for fewer than 2 tokens.
  - Prompt tokens per second is tokens read divided by the engine's prompt time, which starts after the request line is parsed
    and includes restoring stored conversation state.
  - The live rate is the token count gained over the last 2 s of samples; before 0.25 s of span it is the mean so far.
  - Time to first token is not in any API response. It is a histogram (from passing the queue and loading to the first engine
    token, server wall clock) and a history field (from entering the queue to the first engine token).
  - The inter-token latency histogram records each finished request's mean gap, once per gap; it has no spread within a request.
  - How often GPU, CPU, RAM and disk readings are taken, and how many are kept per series.
  - How many finished requests and transition events are kept.
- component: comp/strata/model-file-reader
  decisions:
  - Only GGUF version 3 is read.
  - 'Tensor data alignment: general.alignment when non-zero, else the default.'
  - Only the first items of a metadata array are kept; the count is kept in full.
  - Six metadata keys are required (block_count, embedding_length, expert_count, expert_used_count, attention.head_count,
    attention.head_count_kv); any other key the file lacks keeps the compiled value.
  - Only the expert count, the experts per token and the vocabulary size may differ from the compiled geometry; every other
    shape must match.
  - Upper limit on experts used per token.
- component: comp/strata/adaptive-tier
  decisions:
  - Run once every this many verify windows.
  - At most this many swaps per run, taken in order of gain across all layers.
  - After each run every usage count is multiplied by this.
  - A swap is made only if the entering expert's count exceeds the leaving expert's by at least this.
  - An expert is a candidate to enter only if its count is at least this.
- component: comp/strata/prompt-builder
  decisions:
  - Which tokenizer runs. It is the project's own byte-level BPE in Python, built from the pack's tokenizer directory (vocab.json,
    merges.txt, token_type.json, tokenizer.json).
  - Which chat template renders the messages. The pack's own Jinja template is used if present, else the shipped one. It runs
    in a sandboxed immutable Jinja2 environment.
  - Tokens kept free between prompt plus output and the context length. The engine applies the same margin.
  - When prompt plus requested output exceeds the context, shorten the output limit to the room left instead of refusing.
  - An absent, zero or negative output limit means the rest of the context.
  - How many recent prompts are kept so that a new prompt re-encodes only what follows the last special token it shares with
    one of them.
  - Whether a non-default reasoning effort is written in a short system turn before the answer, so the cached prompt start
    stays the same. Off by default.
- component: comp/strata/draft-verifier
  decisions:
  - 'How a draft is judged. Greedy: equal to the row''s argmax. Sampled, default: equal to the row''s sample drawn from a
    random stream keyed by seed and position. Sampled with STRATA_SPEC_PROB=1: accepted with probability min(1, p/q), else
    replaced by a sample from the positive part of p minus q.'
  - 'Under STRATA_SPEC_PROB=1, which confidence gate: pick (masked, not renormalised draft measure with a no-candidate tail)
    or top (gate on the largest probability before the draw).'
  - The pick gate's exact rule is used only with serial decode on one device, no lookup chain, no adaptive swaps, no PCIe
    share, no cost-aware window, no DFlash2, a window of at most 8 rows. Otherwise the older rule runs and the engine warns
    that its distribution is off when the gate fails.
  - A one-row window advances the state inside the window graph and no commit graph is launched.
  - The commit graph is launched without waiting; anything that reads the session from elsewhere waits for it first.
  - All recurrent layers commit in two launches and all attention layers' indexer restore and re-append in one.
- component: comp/ds4/gpu-kernels
  decisions:
  - The tensor formats the engine recognises.
  - The CPU backend is for reference and debugging only. Layouts that would need CPU execution are refused at startup.
- component: comp/strata/window-graphs
  decisions:
  - 'Window loop: one graph per window size, holding all layers and the head, in two variants (zero-doorbell and doorbell),
    recorded on first use or ahead of it, plus one commit graph. Session loop: one graph per token, or a first-half and a
    combine-half graph per layer.'
  - 'When instantiating a graph reports out of memory: first free the least recently used batch-layout graphs; then, for a
    single-request window, free the graph of the largest other window size that is neither the one being recorded nor one
    already launched ahead. A freed size is recorded again when next used.'
  - Upper bound on recorded batch layouts (0 means unbounded).
- component: comp/strata/run-config-generator
  decisions:
  - Which value wins when the file is written.
  - The expert cache size is left to the engine.
  - The speculative window and the confidence floor written by default.
  - 'The context length: 131072 recommended, capped by a memory rule, or the person''s choice.'
  - 'The K/V precision: 16-bit float at a context of 8192 or less, else 8-bit integer, or the person''s choice.'
  - Keep only a 32768-token window of K/V in fast memory when the context is 65536 or more and host memory suffices.
  - Host memory given to resident experts.
  - Hold the n-gram table in host memory when memory covers the model plus the table plus 16 GB (4 GB on a rotational disk).
  - 'On the GB10 machine type only: map experts from the file, a 32768-token prompt chunk, and 4-bit draft-layer options.'
  - On a CPU with more efficiency cores than performance cores, and only without a calibration, the worker count is P - 1
    + E/2, at most 32.
  - An option in the file's argument list that differs from what setup last wrote counts as the person's and is kept, except
    the options setup re-decides from its answers.
- component: comp/strata/expert-layout
  decisions:
  - Bytes of one expert blob in the canonical (non-native) layout.
  - Native layout (per-layer blob sizes and formats, GGUF spans) when native_experts.txt exists, else the canonical layout
    with one blob size.
  - A native_experts.txt newer than the engine reads is refused.
- component: comp/strata/session-loop
  decisions:
  - 'Three forms: one graph per token with a device-side wait per layer (default when it can be captured); two graphs per
    layer with a host poll per layer (--no-token-graph, dumps, or a hit path the token graph cannot hold); direct kernel launches
    (--no-capture).'
  - 'Token graph: how long a late layer signal waits before one driver call (STRATA_TG_FLUSH_US).'
  - 'Token graph: time after which a silent layer is an error.'
- component: comp/ds4/expert-split-dispatch
  decisions:
  - A layer is split when this many or more of its selected experts are missing from the cache. With one or two missing, a
    single computation is faster.
  - Splitting is enabled only after at least this many tokens have been generated.
  - Splitting is enabled only when the cache holds at least this many entries. If the budget is below 2048 entries, half of
    the budget is used.
  - As soon as the selected ids are read back to the CPU, a service thread starts reading the missing experts while the GPU
    computes the shared expert.
- component: comp/strata/prompt-path
  decisions:
  - Tokens per prompt chunk.
  - The CPU's share of the experts not in fast memory is the accelerator's time per expert over the sum of both times, as
    running averages, kept between these bounds.
  - Sharing is switched off for following layers when the measured time with sharing is not lower than without.
  - An expert may go to the CPU only if it is routed in this chunk, is not in fast memory, is not taken by a second accelerator,
    is routed by no more tokens than the CPU kernel's batch limit, and its weights can be read from slow memory without assembling
    a short-lived buffer. Candidates are taken in order of fewest tokens first.
- component: comp/strata/host-to-device-transfer
  decisions:
  - Whether the adaptive tier's copies are issued one by one or as one batched copy.
  - The most experts that can be fetched for one window, bounded by the staging area and by 64.
- component: comp/strata/sampler
  decisions:
  - 'Greedy: inside the window graph, at no extra launch or synchronisation. A sampled, penalised or biased request: again
    outside the graph after the window has finished, with the request''s own settings, followed by a synchronisation. Session
    loop: once per token after the head.'
  - A request without settings is greedy in the window loop. The parameter defaults are top-k 20, top-p 0.95, min-p 0, temperature
    1.0, penalties off.
  - The random draw of a row is a counter-based generator keyed by the seed and the row's absolute position.
  - 'Three implementations of the sampled chain that pick the same token: split top-k (default), one block per row (STRATA_SAMPLER_ONE_BLOCK,
    and where the split cannot run), the older kernel (STRATA_OLD_SAMPLER).'
  - Penalties count only the current reply unless STRATA_PENALTY_PROMPT=1; each window row gets its own history ending with
    the drafts before it.
- component: comp/strata/speed-calibration
  decisions:
  - 'What the calibration measures: decode tokens per second from the engine''s own decode time, over 3 fixed prompts of 128
    new tokens at temperature 0. On a layer split it also measures prompt read speed for the chunk-pipelining option.'
  - 'What the calibration sweeps: the share of routed experts read over the link, the speculation confidence floor (both per
    request, without a restart), then the CPU worker count and adaptive-tier settings (one engine restart each).'
  - A non-default value is kept only if it beats the default by more than this in an interleaved confirmation.
  - 'When the calibration runs: only on request (setup --calibrate, an offer at the end of a first install on NVIDIA, or the
    engine calibrate command).'
  - The auto-tuner changes one setting at a time and accepts a change when the median per-round ratio exceeds 1 + max(0.03,
    twice the measured noise, twice the drift), every round is faster, and prompt speed loses at most 2%.
  - The auto-tuner's time budget.
  - Only settings the project labels as leaving answers identical are chosen automatically; settings labelled as changing
    placement or as not repeatable need an explicit opt-in.
  - A preset is not applied when the GPU, CPU, RAM (by more than 10%), link, model digest or backend changed; it is applied
    with a re-check offered when the engine's tuning epoch, the driver or its age changed.
- component: comp/strata/startup-memory-sizing
  decisions:
  - Device memory left free once everything is loaded.
  - Device memory the load allocates after the cache that no setting prices; left out of the cache unless that would take
    it below the minimum slot count. Zero under STRATA_DEFAULTS=026.
  - slots = (free - reserve - late) / largest slot when that is at least the minimum and positive, else (free - reserve) /
    largest slot; reserve = vram-reserve + prompt buffers + draft head bind size + pipeline windows; capped by the number
    of ranked pairs in the expert profile.
  - 'Price of the prompt path''s own buffers when it does not borrow cache slots: 160 + chunk * 680 / 1024 MiB; STRATA_OWNED_PRICE=exact
    prices the real allocation plus 64 MiB.'
  - 'Least working cache: slots for a 256-token prompt chunk''s buffers plus the slots a loan leaves behind, or 1 without
    a borrowing prompt path.'
  - Slots a loan to the prompt path leaves in the cache.
  - Lowest value the reserve is lowered to so that the minimum cache fits.
  - Extra kept free when the prompt path is given its own small buffers.
  - For a native pack with a profile the uniform slot count becomes a byte budget, and slots of each layer's own blob size
    are taken in profile order until it is used, so the final count can exceed the uniform one.
  - After the cache is opened its slots are zeroed and free memory is read again; while more than 64 MiB short of the reserve
    the cache is reopened smaller.
  - When an automatic cache cannot be allocated it is retried at three quarters of its size.
  - 'When the automatic cache is below the minimum on one discrete GPU and the reserve was not given by hand: keep 16 slots
    behind a loan; lower the reserve to the floor; give the prompt path its own buffers at 1024, 512 or 256 tokens; move the
    output head to host memory; then report what is short. STRATA_SPILL_OFF=1 and STRATA_HEAD_HOST_OFF=1 disable steps.'
  - --expert-cache N is kept as asked; 0 and auto both mean the automatic rule.
- component: comp/ds4/draft-verify-commit
  decisions:
  - The last committed token plus the drafts are checked together.
  - In greedy mode a draft is accepted when the full model's most probable token at position k equals draft k plus 1. Checking
    stops at the first difference.
  - With temperature above 0 by default, a draft equal to the full model's greedy result is accepted directly and sampling
    at the set temperature happens only otherwise. Deliberately more deterministic than ordinary sampling.
  - With --mtp-exact-sampling a draft is accepted with probability target probability divided by draft probability, and on
    rejection a token is resampled from the remaining probability mass.
  - Most prefix lengths for which a copy of the compressor frontier is kept during a check.
  - The logits from before the check are saved and restored unchanged when no draft is accepted.
- component: comp/strata/checkpoint-chain
  decisions:
  - How many checkpoints the chain keeps.
  - A checkpoint is cut at the last turn token after the resume point, unless the request says ckpt=0.
  - When reading from token 0, a checkpoint is cut at the first turn token if it is at or beyond this position. Taken even
    with ckpt=0.
  - A checkpoint is cut every this many freshly read tokens, at a chunk end.
  - A request may pin one checkpoint at a given position; needs a capacity of at least 3; at most one pinned checkpoint at
    a time.
  - 'Opt-in, one GPU: an extra cut at the previous turn token if it is at or beyond 8192 tokens and within 1024 tokens of
    the turn cut.'
  - 'Opt-in, one GPU: one extra checkpoint at the last chunk boundary before the prompt''s end.'
  - 'Opt-in: drop the checkpoint whose removal leaves the smallest relative gap instead of the least recently used.'
