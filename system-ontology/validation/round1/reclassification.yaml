hard_to_tell_apart:
  - {types: ["request-front", "engine-control"], why: "both pass tokens back and drive a request; components that run a request through generations and build response events straddle the line"}
  - {types: ["engine-control", "multi-request-scheduler"], why: "engine-control keeps a live record and starts generations; once batch slots exist, the command loop also shares the engine between requests"}
  - {types: ["conversation-reuse", "attention-state-store"], why: "truncation, snapshots of the current conversation and explicit session save/load are state management that both definitions partly cover"}
  - {types: ["decode-loop", "layer-compute"], why: "a loop that launches layers in order and interleaves expert work is both 'taking tokens through every layer' and 'computing the layer'; recorded graphs are a choice of both"}
  - {types: ["expert-transfer", "expert-source"], why: "a reader that copies expert bytes from storage into a cache buffer both makes experts obtainable from the slow place and moves them into fast memory"}
  - {types: ["layer-compute", "expert-dispatch"], why: "layer-compute includes expert selection, while expert-dispatch consumes 'routing'; a router could be read as the start of dispatch"}
  - {types: ["memory-planner", "configuration"], why: "startup decisions from machine memory readings fit 'machine facts into settings' as well as budget division"}
  - {types: ["weight-loader", "expert-source"], why: "weight-loader outputs expert_layout, but a component whose only job is the expert layout table belongs equally to the expert store"}
definitions_that_need_work:
  - {type: "multi-request-scheduler", problem: "conflates sharing among requests with an engine spanning machines; expert/tensor parallelism across two machines processing the same token has no clear home"}
  - {type: "conversation-reuse", problem: "says 'earlier conversations' but components also keep checkpoints within the current conversation and save/load sessions to files on command; scope unclear"}
  - {type: "weight-loader", problem: "bundles file opening/validation, placement and expert-layout production; a pure file reader with the architecture guard does not place weights"}
  - {type: "decode-loop", problem: "recorded-graph lifecycle (record, keep, free, re-record under memory pressure) is only a choice here; no type owns it"}
  - {type: "table-reader", problem: "does not mention background prewarming of the table into the page cache; unclear whether a prewarm helper is part of it"}
  - {type: "configuration", problem: "unclear whether on-machine speed measurement/tuning and launch-time argument resolution belong here or are separate operations nodes"}
  - {type: "request-front", problem: "admission bound and client-disconnect cancellation are not mentioned; overlaps with multi-request-scheduler admission"}
