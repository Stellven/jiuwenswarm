  - {job: "expert parallelism (experts of one layer spread over devices)", why: "experts follow their layer's device or stay on the host; the MoE cache replicates hot experts per device instead"}
  - {job: "disaggregated prefill and decode on different machines", why: "one process does both; RPC only remotes devices, not phases"}
