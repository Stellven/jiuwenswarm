basis: "Read in code (targeted ranges, not whole files): src/llama-context.cpp (decode 2140-2617, process_ubatch 1817-1892, sched_reserve 788-955, sched_copy_experts 3159-3243), src/llama-memory.h, src/llama-kv-cache.h, src/llama-kv-cache-dsv4.h, src/llama-kv-cache-msa.h, src/llama-memory-recurrent.h, src/llama-model.cpp (buffer lists 1247-1350, layer placement 1700-1800, Hadamard tensors 2340-2420, memory selection 2940-3500), src/llama-model-loader.h, src/llama-mmap.cpp (lazy ranges 700-910), src/llama-moe-cache.h and the comments of src/llama-moe-cache.cpp, src/llama-batch.h, src/llama-graph.h (builder list), src/llama-grammar.h/.cpp (entry points), src/llama-quant.cpp (type choice), include/llama.h (sampler interface, load and lazy modes, process API), ggml/src/ggml-backend.cpp (scheduler 1171-2340), ggml/src/ggml-cpu/ggml-cpu.c (threadpool struct), ggml/src/ggml-cuda/ggml-cuda.cu (graph capture entry points), ggml/src/ggml-rpc/ggml-rpc.cpp (command list), common/sampling.cpp (sample, accept_n, rejection 607-850), common/speculative.h/.cpp (impl base, MTP driver, umbrella), common/fit.h, common/reasoning-budget.h, common/chat.h, tools/server/server-context.cpp (pre_decode 3704-4100, decode 4577-4716, post_decode spec acceptance 4800-4985, process_token, checkpoints), tools/server/server-slot-sched.h/.cpp, tools/server/server-decision.h, tools/server/server-queue.h, tools/server/server-models-sched.h, conversion/base.py (class layout). Read only in documents: docs/moe-cache.md, docs/multi-gpu.md, docs/speculative.md, tools/server/README-dev.md, tools/rpc/README.md, tools/mtmd/README-dev.md. Not read: the 182 per-architecture graph files in src/models, backend kernels other than the entry points named, ggml-backend-meta.cpp beyond its section headers, llama-vocab.cpp, common/jinja and common/parsers bodies, mtmd encoder graphs, server-http/realtime/tools/mcp bodies, the web UI."
concurrency: batched
models: "About 176 architecture ids (src/llama-arch.h). Dense decoder transformers (Llama, Qwen, Gemma, Mistral and many more); mixture-of-experts models (DeepSeek, Qwen-MoE, GLM, Minimax, gpt-oss and others) whose expert weights may live in host memory; pure recurrent models (Mamba, Mamba2, RWKV) and hybrids that mix attention with recurrent or linear-attention layers (Jamba, Nemotron-H, Qwen3.5/next style, Kimi-Linear, Falcon-H1); sliding-window attention models served with a pair of caches (iSWA); sparse-attention models with a learned indexer or compressed KV (DeepSeek 3.2 DSA, Minimax-M3 MSA, DeepSeek 4 compressed state, GLM-DSA); DeepSeek 4.1 'Engram' n-gram lookup tables and per-layer embedding tables read row by row from disk; models with trained multi-token-prediction heads (MTP) used as their own drafter; separate draft models (plain, EAGLE-3, DFlash block-diffusion drafts and its DFlash2/DSpark/LiliCorr variants); encoder-only embedding and reranking models (BERT family), encoder-decoder (T5), diffusion language models (Dream, LLaDA); 'decision' models that answer typed questions from one forward pass; vision, audio and video input through a separate projector file (mmproj, libmtmd), and speech output (TTS, audio-generation stages). Weights are usually block-quantized (many GGUF quant types), some with Hadamard rotations stored as metadata."
parts:
  - id: "checkpoint-converter"
    engine_name: "convert_hf_to_gguf.py / conversion/*.py / gguf-py"
    does: "Turns a training-framework checkpoint (Hugging Face safetensors, PyTorch) into one GGUF file of renamed, reshaped and optionally down-cast tensors plus key-value metadata (architecture, hyperparameters, tokenizer, chat template)."
    not: "It does not choose block-quantization types per tensor (that is the weight-quantizer); it only writes float or a few simple types."
    runs: [offline]
    takes: [{from: "model_files", what: "checkpoint tensors, config.json, tokenizer files; for EAGLE-3/DFlash drafts also the target model directory"}]
    gives: [{to: "weight-quantizer", what: "GGUF file in f32/f16/bf16/q8_0"}, {to: "model-file-reader", what: "GGUF file with metadata and tensors"}, {to: "multimodal-encoder", what: "separate mmproj GGUF for vision/audio projectors"}]
    owns_state: ["mapping from checkpoint tensor names to GGUF tensor names per architecture"]
    exists_because: "the runtime reads only GGUF, a single self-describing file format, and every architecture names and lays out its tensors differently"
    output_effect: numeric
    output_effect_when: "when the output type is lower precision than the checkpoint (bf16 to f16, q8_0), compared with the original weights"
    decisions:
      - "which model class handles a given checkpoint architecture"
      - "how tensors are renamed, split, merged or permuted for the runtime's kernels"
      - "which tokenizer type and pre-tokenizer hash to record"
      - "output data type and whether to split into shards"
      - "whether to export MTP heads or a reduced draft vocabulary map"
    when_things_go_wrong: ["fails on unknown architecture or unmapped tensor names", "lazy tensors avoid loading the whole checkpoint into RAM"]
    must_never: ["write a tensor under a name the runtime does not expect for that architecture"]
    evidence: ["convert_hf_to_gguf.py", "conversion/base.py:83-1810 (ModelBase.modify_tensors, prepare_tensors, write)", "conversion/ (124 per-family files)", "docs/speculative.md (--target-model-dir)"]
    read: code
  - id: "importance-calibrator"
    engine_name: "llama-imatrix"
    does: "Runs the model over calibration text and accumulates, per weight matrix column, the squared activations that reach it, saving them as an importance matrix."
    not: "It does not quantize anything itself."
    runs: [offline]
    takes: [{from: "operator", what: "calibration text"}, {from: "model_files", what: "a GGUF model"}]
    gives: [{to: "weight-quantizer", what: "importance matrix file"}]
    owns_state: ["running sums of activation statistics per tensor"]
    exists_because: "low-bit quantization loses less accuracy when rounding error is weighted by how much each input column matters"
    output_effect: none
    decisions: ["which text to calibrate on", "how many chunks and context length to use"]
    when_things_go_wrong: ["tensors never activated (unused experts) get partial statistics, which the quantizer must handle"]
    must_never: ["mix statistics from different models"]
    evidence: ["tools/imatrix/", "common/imatrix-loader.cpp", "src/llama-quant.cpp:81-96 (remap_imatrix)"]
    read: docs
  - id: "weight-quantizer"
    engine_name: "llama_model_quantize (llama-quantize)"
    does: "Rewrites a GGUF model with each tensor converted to a block-quantized type chosen per tensor from the requested file type, layer position, tensor role and whether an importance matrix is present."
    runs: [offline]
    takes: [{from: "checkpoint-converter", what: "high-precision GGUF"}, {from: "importance-calibrator", what: "importance matrix"}, {from: "operator", what: "target file type, per-tensor type overrides"}]
    gives: [{to: "model-file-reader", what: "quantized GGUF"}]
    owns_state: ["per-run counters of which layer and tensor category is being quantized"]
    exists_because: "the target machines (laptops, single GPUs) lack the memory and bandwidth for full-precision weights"
    output_effect: changes_output
    output_effect_when: "always, compared with the unquantized model; quality loss grows as bits per weight fall"
    decisions:
      - "type per tensor by role (attention V, FFN down, output, embeddings) and depth"
      - "fallback type when a tensor's row length does not fit the block size"
      - "whether a type requires an importance matrix"
    when_things_go_wrong: ["falls back to a compatible type when rows are not block-aligned", "aborts on an importance matrix name mismatch"]
    must_never: ["produce a type the row length cannot hold"]
    evidence: ["src/llama-quant.cpp:459-800 (tensor_type_fallback, llama_tensor_get_type_impl)", "tools/quantize/"]
    read: code
