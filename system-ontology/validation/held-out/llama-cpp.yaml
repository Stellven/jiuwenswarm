surprises:
  - "The KV cache has no blocks or block table: it is a flat cell pool where one cell can belong to many sequences (a bitset), so prefix sharing, unified vs per-sequence streams and position shifting all live in the cell metadata."
  - "MoE experts are often deliberately kept in host memory; a device-side expert cache with frequency-class LRU and a tunable share of misses computed on the CPU, plus selective upload of only the used experts for big batches, replaces both full offload and expert parallelism."
  - "Rollback of rejected drafts depends on the memory kind: attention caches drop a tail, recurrent stores keep a fixed number of snapshots, and beyond that the server saves and restores a full sequence-state checkpoint and replays accepted tokens."
  - "Huge lookup tables (Engram n-gram tables, per-layer embeddings) are read row by row straight from the memory map on demand, with the OS page cache acting as the weight cache."
  - "Sparse and compressed attention (DSA, MSA, DeepSeek 4) adds caches that must mirror the main KV cell layout exactly, so 'the KV cache' is several coupled stores."
  - "Sampling can run inside the model graph on the device (backend sampling), but then grammar constraints and reasoning budgets are not allowed."
  - "Drafting has a dozen interchangeable methods, several of which read the target's hidden states through device buffers synchronized by events; the server can even replace verification with synthetic acceptance for benchmarks."
  - "Placement is decided by a dry-run fitter that loads everything with no allocation, measures, and rewrites unset parameters; the router uses the same measurement to unload whole server processes."
  - "The server answers typed 'decision' questions from option-label logits in one pass, permuting option order across several prompts to cancel position bias."
  - "Multimodal encoders run in a separate library with their own scheduler and a single compute lock, and media in a prompt disables context shift and chunk reuse."
not_read: "The 182 per-architecture graph files in src/models (only the shared builder list in llama-graph.h); llama-vocab.cpp and unicode code; the body of llama-sampler.cpp; ggml-alloc.c; ggml-backend-meta.cpp beyond its section headers; backend kernels (CUDA, Metal, Vulkan, SYCL and others) beyond the CUDA graph entry points; ggml-rpc beyond its command list; the libmtmd encoder graphs, preprocessors and audio generation code; common/jinja, common/parsers and chat.cpp bodies; server-http, server-realtime, server-tools, server-mcp, server-models and server-stream bodies; tools/imatrix and tools/quantize mains; gguf-py; the web UI; tests; the .git directory and vendor/ code."
