pairs_hard_to_separate:
- types: [step-execution, step-scheduler]
  why: engine command loops and cores both plan and carry out steps
- types: [prefix-reuse, state-tiering]
  why: host or disk stores of evicted prefix blocks serve both reuse and capacity
- types: [prefix-reuse, sequence-lifecycle]
  why: slot matching by reusable state
- types: [model-partitioning, device-communication]
  why: partition plus lockstep exchange often in one part
- types: [expert-fetch, expert-source]
  why: page-cache warming and mapped file access
- types: [memory-planning, resource-governing]
  why: static startup sizing vs runtime ledger share budget logic
- types: [state-pool, positional-state-store]
  why: paged K/V stores that also allocate pages
- types: [configuration, model-loading]
  why: family detection and source validation at startup
definitions_that_need_work:
- {type: step-execution, problem: 'summary does not say whether it includes the engine command loop, rank dispatch or graph replay driver'}
- {type: prefix-reuse, problem: 'no clear boundary with stores of whole conversations, composite state attachment and restore-source ranking'}
- {type: modality-encoding, problem: 'input fetch, decode and preprocessing are not distinguished from the encoder; takes only media'}
- {type: engine-supervision, problem: 'covers process liveness but not in-engine startup staging, watchdog-only warnings, or the engine main loop'}
