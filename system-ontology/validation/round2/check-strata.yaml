contradictions:
  - {type: "expert-cache", claim: "effect none (no condition)", part: "expert-cache", evidence: "output_effect none, but output_effect_when says bit_exact only 'when the GPU and CPU expert kernels round identically'; the slot count it holds decides which experts the GPU computes and which fall to the CPU", fix: "add 'numeric when what it holds decides which device computes a block that devices round differently', as residency-policy already does"}
  - {type: "prompt-reading", claim: "effect numeric (always)", part: "prompt-path", evidence: "output_effect changes_output: 'approximate when the optional approximate late-layer read is on'", fix: "add 'changes_output when it takes an approximate path for part of the prompt (needs permission)'"}
  - {type: "model-loading", claim: "effect none / numeric when re-encoded at load", part: "weight-loader", evidence: "output_effect changes_output: 'approximate when STRATA_HC_REQ8=1' (hyper-connection projections requantized to int8 at load)", fix: "add 'changes_output when weights are re-encoded to a lower precision at load'; numeric only for lossless or float-width changes"}
  - {type: "model-loading", claim: "effect none / numeric when re-encoded at load", part: "native-weight-loader", evidence: "output_effect changes_output: 'approximate when a BF16 projection is converted to Q8_0 at load'", fix: "add 'changes_output when weights are quantised at load'"}
  - {type: "memory-planning", claim: "must_never: everything it prices plus what it hands out never exceeds the budget", part: "startup-memory-sizing", evidence: "unpriced late allocations are 'left out of the cache unless that would take it below the minimum slot count', and the slot formula falls back to (free - reserve) / largest slot; over-commitment is corrected afterwards by re-reading free memory and shrinking", fix: "condition the rule: the final plan, after any re-read and correction, never exceeds the budget; a first estimate may over-commit when a correction step exists"}
  - {type: "memory-planning", claim: "must_never: everything it prices plus what it hands out never exceeds the budget", part: "host-memory-admission", evidence: "when available RAM is below the arena's need and the file source is not allowed it will 'warn and load (available RAM)'; only a hard memory limit refuses", fix: "distinguish hard and soft budgets: never exceed a hard limit; a soft figure may be exceeded only with a warning, as an explicit choice"}
  - {type: "expert-source", claim: "effect none (no condition)", part: "expert-source", evidence: "output_effect numeric: 'numeric when registration status changes the share of uncached experts the GPU computes instead of the CPU'", fix: "add 'numeric when what it makes device-readable decides which device computes a block'"}
  - {type: "prompt-preparation", claim: "effect changes_output (always)", part: "prompt-builder", evidence: "output_effect none; the builder applies the model's own tokenizer and template (pack template, else shipped one)", fix: "split the case: none when it reproduces the model's own template and tokenizer exactly; changes_output when it corrects the template, injects text or shortens input"}
  - {type: "output-interpretation", claim: "effect changes_output when it decides where output stops and how it is divided", part: "request-runner", evidence: "changes_output 'when a thinking budget or forced tool call injects tokens, a recovery pass raises temperature and presence penalty' as well as at a stop string", fix: "widen the condition: changes_output when it injects tokens, re-drives a generation with changed settings, or decides where output stops"}
  - {type: "step-scheduler", claim: "must_never: every admitted sequence is eventually served", part: "request-runner", evidence: "the request runner acts as the scheduler when batch slots are off: 'The turn is a plain lock polled with a timeout; arrival order is not enforced'; the HTTP front answers 429 after a wait limit", fix: "reword: every admitted sequence is served or explicitly refused within a stated wait; or require fair order where there is no timeout"}
  - {type: "step-scheduler", claim: "effect none / numeric", part: "engine-command-loop", evidence: "output_effect changes_output: 'approximate when Batch slots on, sampled decoding, with a move between the solo path and a slot'", fix: "add 'changes_output under sampling when moving a sequence between step compositions changes rounding and so the sampled tokens'"}
  - {type: "sequence-lifecycle", claim: "effect none (no condition)", part: "slot-scheduler", evidence: "output_effect changes_output: 'approximate when Sampled decoding with a move between the solo path and a slot'", fix: "add 'numeric, and changes_output under sampling, when the place it assigns (solo or shared step) changes the arithmetic'"}
