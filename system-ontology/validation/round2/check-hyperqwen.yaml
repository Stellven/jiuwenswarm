contradictions:
  - {type: "configuration", claim: "A combination known to give wrong output is not started.", part: "correctness-pins", evidence: "decision 'Whether an explicit operator override is honoured'; failure 'fp16 dtype with a speculator: refuses to boot unless overridden'; must_never 'let the adaptive verify length run on KVarN with prefix caching and a block over 8 unless explicitly asked'. The engine does start known-corrupting combinations on explicit request.", fix: "A combination known to give wrong output is not started unless the operator explicitly overrides it, and the override is recorded with the run's settings."}
  - {type: "memory-planning", claim: "Everything it prices plus what it hands out never exceeds the budget.", part: "memory-budget-planner", evidence: "'Pin by bytes for fixed-context profiles'; failure 'pool pinned too full: first real batch OOMs on Linux, or silently spills to system RAM and slows 3-28x under WSL2'; must_never only forbids allocating scratch outside the measured window 'without saying so'. An operator-pinned size is not checked against the budget.", fix: "Condition the rule on computed sizes, or require that an operator-pinned size is checked against the measured budget (or reported as unchecked) before the pool is allocated."}
  - {type: "graph-capture", claim: "effect_on_output lists only none (intended) and numeric (different kernel variant or buffer layout)", part: "graph-capture", evidence: "output_effect changes_output: 'FULL capture of the verify step with a prefix-cache hit corrupted one prompt length in 128 on the huge-context profile, compared with PIECEWISE'.", fix: "Add a case changes_output: when a recorded graph mishandles a case the unrecorded path handles (a defect), with the obligation that such combinations are refused at configuration."}
  - {type: "model-conversion", claim: "changes_output when it changes precision, cuts the vocabulary, or rewrites the template", part: "draft-vocab-builder", evidence: "draft-vocab-builder cuts a vocabulary yet output_effect is none ('the target still scores the full vocabulary'); offline-weight-requantizer 'the MTP module's precision changes only acceptance, not output'; gptq-requantizer 'drafter quantization changes only acceptance'. The none case 'it only re-arranges bytes' does not describe this part either.", fix: "Condition on the target: changes_output when it changes the precision or vocabulary of what the full model computes, or rewrites the template; none when it only re-arranges bytes or changes derived pieces that are only proposals (draft head, draft vocabulary), which affect acceptance rate, not output."}
  - {type: "prefix-reuse", claim: "effect_on_output lists only none and numeric", part: "prefix-cache", evidence: "output_effect changes_output: 'Greedy text can differ between a hit and a miss (different chunking and rounding), compared with a cold prefill.'", fix: "Either state in the effect vocabulary that numeric differences may flip greedy tokens (so such parts stay numeric), or add changes_output to prefix-reuse when a hit takes a differently chunked or rounded path than a cold read."}
  - {type: "step-scheduler", claim: "effect_on_output lists only none (one sequence at a time) and numeric (which sequences share a step)", part: "request-scheduler", evidence: "output_effect changes_output: 'Batch composition and chunk boundaries change rounding, so greedy text can depend on which other requests are in flight.'", fix: "Same vocabulary decision as prefix-reuse: say that numeric covers rounding that can flip greedy text, or add a changes_output case when batch composition decides greedy tokens."}
  - {type: "draft-policy", claim: "changes_output only when its decision depends on timing; otherwise none or numeric", part: "verify-length-controller", evidence: "output_effect_when: 'Changing the block length changes rounding and so greedy text ... with KVarN and a prefix hit it corrupted the second turn (root cause open), hence pinned off there.' The corruption is neither rounding nor timing.", fix: "Add a case: changes_output when a block length it chooses interacts with a lossy state format or reused state to corrupt output (defect class, must be pinned off by configuration); and clarify whether rounding-induced greedy flips are numeric."}
  - {type: "layer-compute", claim: "effect_on_output: numeric always (only case listed)", part: "linear-gemm", evidence: "output_effect changes_output: 'With int8 activations on the selected layers (reported perplexity +0.9 to +3.7 percent by layer set) compared with W4A16.'", fix: "Add a case changes_output: when activation precision is reduced or the model's arithmetic is deliberately changed (the type's own last choice already says such a change changes output)."}
  - {type: "layer-compute", claim: "effect_on_output: numeric always (only case listed)", part: "full-attention-compute", evidence: "output_effect changes_output: 'int8-QK prefill kernel ... and sparse LSA (exact only below about 4.6k tokens) compared with FA2.'", fix: "Add changes_output when a kernel reduces precision or approximates the model's operation (sparse attention, low-precision dot products)."}
  - {type: "layer-compute", claim: "effect_on_output: numeric always (only case listed)", part: "output-head", evidence: "output_effect changes_output: 'Quantised head compared with bf16 (see offline-weight-requantizer, gptq-requantizer).'", fix: "Add changes_output when it computes from weights whose precision was reduced by conversion, or state that the reference for layer-compute is the converted model, not the published one."}
  - {type: "layer-compute", claim: "The order of operations the model defines is not changed.", part: "verify-attention", evidence: "'splitting each request's KV into segments with online-softmax partials and a combine'; output_effect_when 'Different floating-point summation order compared with FA2'.", fix: "Restrict the rule to the model's order of layers and operations; reduction order inside an operation may differ and is numeric."}
  - {type: "prompt-preparation", claim: "changes_output always: the template and tokenizer define the model's input", part: "prompt-renderer", evidence: "output_effect none for the part that applies the template and tokenizer; the template change is attributed to chat-template-rewriter (changes_output, offline).", fix: "none when it applies the model's own (or the prepared) template and tokenizer exactly; changes_output when it alters the template, truncates, or tokenizes differently from the model's tokenizer."}
  - {type: "output-interpretation", claim: "changes_output when it decides where the returned output stops and how it is divided", part: "output-parser", evidence: "The part divides output into reasoning, content and tool calls, yet output_effect is none; failure 'wrong parser: tool calls come back as plain content with no error'.", fix: "none when it only re-labels and splits the exact generated text; changes_output when it truncates, repairs or drops text, or when the parser does not match the model's format."}
  - {type: "sampling", claim: "changes_output always: it defines the output, given the logits (only case listed)", part: "sampler", evidence: "output_effect numeric: 'Sort-free top-k and multi-block softmax compared with full sort; exact up to floating point.'", fix: "Keep changes_output for the sampling chain's settings, and add numeric when an implementation of the same chain differs from the reference only in floating point."}
wrong_assignments:
  - {part: "drafter-free-chains", assigned: "draft-proposal", better: "draft-policy", why: "It proposes nothing of its own (it reuses the lookup's match); its job is deciding per step to skip the drafter's forward and which source supplies the block, which is draft-policy's 'whether to draft, from which source'. Its decisions (entry on a fresh match, exit on first miss, single request and greedy only) are pause/resume and source-selection rules."}
  - {part: "pool-layout-planner", assigned: "memory-planning", better: "state-pool", why: "Three of its four decisions are page geometry across kinds of state (group size, block promotion, null block), which is state-pool's 'page size and how the pool is split between kinds of state'; memory-planning's choices cover none of them. Only the charging of recurrent pages for async batches is a memory-planning setting. If startup-time layout must stay in memory-planning, memory-planning needs a page-geometry choice."}
