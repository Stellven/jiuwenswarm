  per_decision_notes:
    - "Judged per part against its assigned type only. A decision that another type lists (for example queue limits in request-front, page-cache bypass in expert-source, locked memory in expert-source) still counts as not_covered under the assigned type."
    - "loosely: offline-converter-quantizer per-layer mixed precision (choice says per kind of weight); memory-admission-guard per-allocation ROCm reserve (choice is a startup reserve); routed-expert-cache mlock with lowered limit on lock failure; expert-cache-preloader preload cap; prefill-layer-pagein routed-only page-in when non-routed are wired; resident-missing-split split threshold; ngram-row-reader prefetch only for chunks of 256+ with a 128 MiB buffer cap; tokenizer-and-chat-renderer suffix-only retokenization; session-timeline invalidate-and-re-prefill on rewind; slot-router victim preference; gpu-backend kernel per tensor format; gpu-backend prefill workspace shared between sessions; power-throttle smoothing factor; dspark-scheduler reset per request; session-payload-serializer token-only load under TP."
    - "engine_specific: expert-locality-profiler Metal-only; model-loader private mapping as macOS workaround; ssd-cache-planner slot clamp; multi-gpu-placer expert split only for DeepSeek V4 with even GPU count; multi-gpu-placer refusal of multi-GPU with SSD streaming; pipeline-parallel DeepSeek V4 and GLM only; expert-cache-preloader not for Qwen and off for GLM 5.2; engram-prewarm thread count and check every 64 reads; session-timeline GLM truncation and Qwen snapshots (model facts); compressed-attention-state compression ratio per layer; session-batch-executor Metal V4 Q8_0 shared weights; hyper-connection-mixer stream and Sinkhorn constants; attention-compute top-k and raw window; expert-router hash-routed layer count; expert-router V4.1 image router bias; directional-steering not implemented for GLM 5.2; directional-steering disables batch path; power-throttle not for Qwen and GLM requires 100; dspark-drafter disabled by --quality or --dspark-strict; disk-kv-checkpoint-store directory rescan with no index; server-generation-loop speculation only in single-session mode."
