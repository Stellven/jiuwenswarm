contradictions:
  - {type: "prompt-preparation", claim: "must_never: The token ids it produces are those of the model's own tokenizer.", part: "tokenizer-and-chat-renderer", evidence: "Decision: suffix-only retokenization after a reused prefix to avoid BPE merges across the boundary; the replayed tool-call text is exact sampled text. The produced sequence is not what the tokenizer gives for the whole rendered text.", fix: "Say the ids come from the model's vocabulary and that the sequence is either the tokenizer's output for the whole text or a stated concatenation at a recorded boundary."}
  - {type: "prompt-reading", claim: "must_never: The state it leaves is the state of that prompt, whatever the chunking.", part: "prompt-prefill-driver", evidence: "exists_because: chunk size also fixes compressor-row finalisation, which is why checkpoint boundaries align to it; routed-expert-cache output_effect_when: identical logits are required only for the same prefill chunking.", fix: "Condition it: the state is that of the prompt up to numeric differences; where chunk boundaries affect finalised state, the chunking is fixed and is part of the key under which the state is reused."}
  - {type: "layer-compute", claim: "effect_on_output: numeric only (always)", part: "directional-steering", evidence: "output_effect: changes_output, when a steering file is given with a non-zero scale, compared with the unsteered model.", fix: "Add a changes_output case: when a deliberate change to the model's arithmetic is enabled (the type already lists this as a choice)."}
  - {type: "layer-compute", claim: "must_never: The order of operations the model defines is not changed.", part: "directional-steering", evidence: "Removes or amplifies a stored direction per layer from attention and FFN outputs, an operation the model does not define.", fix: "Except where a permitted deliberate change is enabled, or move run-time behaviour edits to a type of their own."}
  - {type: "layer-compute", claim: "effect_on_output: numeric always", part: "attention-compute", evidence: "attention-compute, hyper-connection-mixer, linear-attention-compute, engram-lookup-compute, expert-router, routed-expert-ffn, shared-and-dense-ffn and output-head all say output_effect none; the inventory places the numeric effect on gpu-backend and session-batch-executor.", fix: "State which node carries the numeric effect: layer-compute as the definition of the arithmetic has none, and the kernel and batching choices (device-backend, step-execution) carry numeric; or require inventories to record numeric for model computation."}
  - {type: "model-partitioning", claim: "effect_on_output: numeric always (partial results combined in a different order)", part: "multi-gpu-placer", evidence: "output_effect none; greedy contiguous packing by layer ranges combines no partial results.", fix: "none when the model is split by whole layers; numeric when partial results are reduced across devices."}
  - {type: "model-partitioning", claim: "effect_on_output: numeric always (partial results combined in a different order)", part: "pipeline-parallel", evidence: "output_effect numeric only when activations are sent as f16 or fp8 instead of f32; a layer-range split combines no partial results.", fix: "none for a layer split at full precision; numeric when partial sums are reduced; changes_output when activations cross at a reduced precision such as fp8."}
  - {type: "model-partitioning", claim: "must_never: Every device makes the same selection where the model selects, so that the parts agree.", part: "pipeline-parallel", evidence: "Consecutive layer ranges per machine: each selection is made on exactly one stage. The part's own rule is that a worker never continues from a different token prefix.", fix: "Condition it on splits within a layer, and add a rule for layer splits: every stage advances from the same token prefix."}
  - {type: "device-communication", claim: "effect_on_output: none when it only moves data; numeric when it reduces partial sums", part: "cross-gpu-transfer", evidence: "does: moves activations and reduces expert-split partials; output_effect none.", fix: "Either the inventory is wrong, or add: none when reduction order is fixed and identical to the single-device order."}
  - {type: "prefix-reuse", claim: "must_never: Stored state is reused only for the model, settings and prefix it was made for.", part: "disk-kv-checkpoint-store", evidence: "Reuse across quantizations is allowed by default, bringing state computed by another quantization; the key is the SHA-1 of rendered text, with quant bits only in the header.", fix: "Keep the rule; the engine breaks it by default. If cross-quantization reuse is to be allowed, make it an explicit choice whose use changes the effect case."}
  - {type: "prefix-reuse", claim: "effect_on_output: none or numeric (reduced-precision storage, batched paths)", part: "disk-kv-checkpoint-store", evidence: "output_effect numeric, when state computed by another quantization is reused. State made by different weights is not a rounding difference.", fix: "Add changes_output when stored state made under other weights or settings is reused."}
  - {type: "session-persistence", claim: "must_never: A file is loaded only into the model and settings it was written for.", part: "session-payload-serializer", evidence: "It loads payloads from disk-kv-checkpoint-store, which reuses them across quantizations by default; load validation covers dimensions, window and counts only.", fix: "Keep the rule; the engine breaks it by default. Name quantization explicitly among the settings checked."}
  - {type: "sampling", claim: "effect_on_output: changes_output always", part: "token-sampler", evidence: "output_effect none.", fix: "Define the reference: sampling as requested is none; changes_output only when it departs from the requested settings (overrides, fallback to the top candidate on a degenerate distribution)."}
  - {type: "output-constraint", claim: "must_never: A token the rule forbids is never returned.", part: "tool-call-sampling-mode", evidence: "not: Not a grammar or logit mask; it never forbids a token. It only makes structural tokens greedy.", fix: "The rule does not apply: the part is a per-position change of sampling settings, not a constraint (see wrong_assignments)."}
  - {type: "expert-fetch", claim: "must_never: A fetch is complete before the computation that uses its destination starts.", part: "prefill-layer-pagein", evidence: "Best-effort page-in of the mapped file; on failure the job is marked not ok and inference still reads the pages on demand. Computation does not wait for it.", fix: "Condition it on fetches the computation depends on; a best-effort prefetch into memory the computation can read anyway is exempt, or belongs to another type."}
  - {type: "resource-governing", claim: "must_never: A grant never takes the engine over its limit.", part: "power-throttle", evidence: "It grants nothing; it sleeps in proportion to a smoothed work time so the duty cycle only approximates the requested percentage.", fix: "Add a rule for duty-cycle limiting (the averaged duty cycle stays at or below the requested level over a stated window), or condition the grant rule on memory."}
wrong_assignments:
  - {part: "directional-steering", assigned: "layer-compute", better: "none", why: "It is an optional behaviour edit the engine offers, not what the model defines; it changes output and adds an operation, which the layer-compute summary, effect cases and must_never exclude. A type for permitted run-time edits to the model's arithmetic is missing."}
  - {part: "tool-call-sampling-mode", assigned: "output-constraint", better: "sampling", why: "It never restricts or forces tokens; it switches the sampling setting per position (greedy on structure). Sampling has no choice for per-position settings yet."}
  - {part: "prefill-layer-pagein", assigned: "expert-fetch", better: "expert-source", why: "It does not bring absent selected blocks into the expert cache; it warms the page cache of the mapped file for all routed weights of the next layer, best effort. That is a property of the slow place the full set lives (expert-source already has read through the page cache or around it), though expert-source lacks a warming choice."}
  - {part: "memory-admission-guard", assigned: "memory-planning", better: "memory-planning plus resource-governing", why: "The startup estimate is memory-planning, but it also runs on_demand and refuses single ROCm allocations against an OS reserve while the engine runs, which is resource-governing."}
