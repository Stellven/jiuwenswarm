contradictions:
  - {type: "layer-compute", claim: "effect_on_output: numeric, always", part: "block-sparse-indexer", evidence: "inventory gives output_effect none for a part of the model's own computation (top-block selection)", fix: "allow none for exact index or selection steps, or condition the case; note that a top-k over rounded scores can flip, so the inventory's none may itself be wrong"}
  - {type: "prompt-reading", claim: "effect_on_output: numeric, always (compared with the token-by-token path, not bit for bit)", part: "prefill-runner", evidence: "inventory gives output_effect none; yet kernel-selector picks a prefill tile versus a staged tile by chunk rows, so the record conflicts with the engine's own evidence", fix: "keep numeric but condition it on the chunk path using different kernels or state rounding than single-token decoding; correct the inventory if it is the inventory that is wrong"}
  - {type: "prompt-reading", claim: "must_never: the state it leaves is the state of that prompt, whatever the chunking", part: "prefill-runner", evidence: "gdn-state-cells: '--state-format bf16 rounds state at each chunk end and capture point, so where chunks end and states are captured changes last bits'", fix: "the state of that prompt up to rounding; with reduced-precision state, chunk boundaries may change the last bits"}
  - {type: "draft-proposal", claim: "effect_on_output: none (a proposal is never output unchecked)", part: "draft-proposer", evidence: "output_effect_when: 'for sampled lanes the draft changes which tokens appear though not their distribution'", fix: "add a case: changes_output under sampled acceptance (different tokens for a fixed seed, same distribution); none only under greedy"}
  - {type: "draft-verification", claim: "effect_on_output: changes_output only when an acceptance rule does not preserve the sampling distribution", part: "acceptance-commit", evidence: "changes_output with 'sampled lanes: same distribution as non-speculative sampling but different tokens for the same seed'", fix: "add a case: changes_output under sampling even with a distribution-preserving rule, since tokens for a fixed seed differ from non-speculative sampling"}
  - {type: "sampling", claim: "must_never: with a fixed seed and fixed logits it returns the same token", part: "token-selector", evidence: "'for a sampled row with a draft draws from the residual distribution the acceptance rule needs'; acceptance-commit: different tokens for the same seed", fix: "with a fixed seed, fixed logits and fixed proposals (and draft probabilities) it returns the same token"}
  - {type: "expert-cache", claim: "not: it does not choose its own contents", part: "expert-store", evidence: "gives its last chunk back 'compacting experts below it', and 'a size used by only one block holds all its experts in its floor'", fix: "allow the cache to decide placement, compaction and pinning by size class, or move those decisions to residency-policy"}
  - {type: "state-tiering", claim: "must_never: state brought back is the state that left", part: "spilled-kv-reader", evidence: "'an unreadable block leaves zeros and fails the lanes that listed it, not the command; their cycle commits nothing'", fix: "state brought back is the state that left, or the read is reported failed and nothing computed from it is committed"}
  - {type: "step-scheduler", claim: "must_never: every admitted sequence is eventually served", part: "request-scheduler", evidence: "scheduler serves the most urgent priority first and lane-admission ends waiting requests: 'a request waits for memory and fails with resource_timeout at its limit'; lower-priority lanes are suspended", fix: "every admitted sequence is eventually served or ended with an error within its wait limit"}
wrong_assignments:
  - {part: "ssd-reader-pool", assigned: "expert-fetch", better: "none", why: "a shared storage-read service for experts, PLE rows, spilled KV and tier restores, with foreground/background priority; not specific to selectively used weights; no type describes a shared I/O service"}
  - {part: "native-loop", assigned: "step-scheduler", better: "engine-supervision", why: "it does not decide step contents (request-scheduler does); it is the engine process's loop, transport, exception-to-exit conversion and clean-stop flush, i.e. the in-process half of supervision; arguably none"}
  - {part: "kv-page-pool", assigned: "positional-state-store", better: "state-pool", why: "it allocates pages in extents, shares cached pages, releases empty extents and compacts pages, which are state-pool jobs; only its KV-format decision is positional-state-store; Splash otherwise has no state-pool instance"}
