  # Per-decision judgments (part: decision -> verdict), for traceability.
  # checkpoint-converter: format per role C; source per role C (precedence); parent merge order C (layout); activation permit NC; conv relayout C; recipe geometry match L (failure on mismatch)
  # draft-head-builder: full vs shortlist and rows C (derived pieces); forced special tokens L; draft head format C
  # context-cost-calibrator: cost model form L (what is measured); acceptance limits C; preset key NC
  # expert-priority-table: rank estimator NC; geometry applicability with identity fallback NC
  # offload-mode-switch: streaming when T over threshold C (region changes role with load); refill pace C (limit on changes per round)
  # configuration: options a model accepts C; per-model defaults L
  # model-definition-loader: which optional components bound NC
  # shard-materializer: location per parent C; read alignment and dedup L (staging); value-preserving slice or reject C (re-encode at load)
  # partition-planner: TP/EP mode C; replicated vs communicated NC; head split by vocabulary C; PLE table location L
  # startup-memory-planner: headroom C; device/host vs unified accounting NC; per-rank never summed NC; bounded correction with explicit kept C
  # expert-residency-planner: balanced fixed share L; two windows then one C (give-up order); CPU workers NC; upload slots L
  # execution-graphs: variants C; context buckets C; separate sections C
  # host-expert-store: registered vs ordinary banks C (locked memory)
  # expert-cache: open-use bound (layers + 8) ES
  # expert-uploader: batch size and count C; required before prefetch NC
  # hybrid-moe-dispatch: GPU subset vs CPU complement C; large vs small T C
  # cpu-expert-team: ISA variant NC; awake/sleep thresholds C; token block and column limits C
  # ple-row-source: disk vs device shards L; cache size, I/O depth, slots C; prefetch vs required priority NC
  # engine-control-loop: order within a cycle C; when admission re-runs L; spin vs 1 ms idle wait NC
  # request-scheduler: bypass allowance C; service quantum C; youngest victim C; prefill and decode separate C
  # model-session: pause action C; full permit before verify L
  # executor: frame counts C; local vs distributed workers NC
  # rank-program: graph or eager per unit L; host handoff split points L
  # layer-compute: kernel variant C; activation precision C; KV encoding NC
  # chunked-prefill: chunk size C; checkpoint interval and snapping C
  # mtp-drafter: draft count C; full or optimized head NC
  # block-drafter: block width C; full or indexed head NC
  # sampler: candidate cap C; tie rule NC
  # draft-acceptance: rule per draft kind C; RNG purposes NC
  # state-commit: graph or eager commit L; rebuild draft history only when more than one accepted C
  # output-interpreter: reasoning and tool formats C; thinking budget L
  # grammar-constraint: composed languages C
  # context-pool: size classes and alignment C; when to compact NC
  # context-directory: logical references vs execution borrows L; copy only conflicting tail pages C
  # context-transfer: chunk and staging per slot L; host tier size C
  # context-resource-manager: rank sources by cost L; cross-rank copy only if cheaper than measured recompute C; victim order C; retention from real adoption L; checkpoint interval C; ADP owner rank NC
  # prompt-preparer: history and template corrections C; restore points not inside media L
  # media-preparer: limits C; cache capacity and live budget C
  # vision-encoder: units fitting the window C; rank-major split NC
  # http-api: accepted protocol fields C
  # responses-store: record and byte limits L
  # rank-launcher: field-only message encoding, no cross-version compatibility ES
  # collective-communication: backend per collective C; override policy C
  # observability: timing on or off, unmeasured as missing C
