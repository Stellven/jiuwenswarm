contradictions:
  - {type: "model-conversion", claim: "effect_on_output: changes_output when it changes precision, cuts the vocabulary, or rewrites the template", part: "draft-head-builder", evidence: "builds a 4-bit (q4_g64) draft head over a frequency shortlist of the vocabulary, yet output_effect is none: 'changes only the acceptance rate; the target distribution and committed output rule are unchanged'", fix: "condition the case on the piece being used for output: changes_output when it changes precision, vocabulary or template of what the target computes; none when the changed piece only feeds proposals that are verified"}
  - {type: "calibration", claim: "must_never: A recorded result is never used for a model, machine or build other than the one it was measured on.", part: "context-cost-calibrator", evidence: "cost coefficients reach the resource manager 'via the preset file named in configuration, or compiled-in defaults copied from earlier runs' - measured results from other runs used on machines where nothing was measured", fix: "allow an explicit, labelled fallback: a recorded result is never used for another model, machine or build as if it were measured there; a default derived from other measurements is used only when no valid record exists and is marked as a default"}
  - {type: "model-loading", claim: "effect_on_output: numeric when weights are re-encoded while loading", part: "shard-materializer", evidence: "refines block-FP8 scale blocks at load ('repeats scale words and keeps represented values'), and output_effect is none", fix: "numeric only when re-encoding changes represented values; none when it is value-preserving"}
  - {type: "memory-planning", claim: "must_never: Everything it prices plus what it hands out never exceeds the budget.", part: "startup-memory-planner", evidence: "decision 'bounded correction of automatic capacity after an over-budget preparation'; when_things_go_wrong 'tightens the runtime limit and retries automatic capacity once over budget' - a plan is allowed to come out over budget and is corrected afterwards", fix: "the engine never starts serving with a plan over budget; a preparation found over budget is corrected or refused before the first request"}
  - {type: "expert-cache", claim: "must_never: A block is reported present only after its bytes have fully arrived.", part: "expert-cache", evidence: "the part's own rule is 'publish an expert before all its bytes are submitted in order', i.e. publication follows submission on an ordered stream, not arrival; consumers acquire with generation numbers on their stream", fix: "a block is reported present only when every reader of it is ordered after the arrival of all its bytes (by completion or by stream ordering)"}
  - {type: "step-scheduler", claim: "effect_on_output: none when one sequence at a time; numeric when which sequences share a step changes rounding", part: "engine-control-loop, request-scheduler", evidence: "concurrency batched up to 8 requests sharing one execution, yet both parts state output_effect none with no condition; layer-compute says accumulator order varies by batch shape", fix: "either the inventory understates (should be numeric), or the type needs a case 'none when the batch composition does not change any row's arithmetic (row-independent kernels)'; resolve which, the two do not agree now"}
  - {type: "step-execution", claim: "effect_on_output: none when one sequence per step; numeric when several sequences share a step", part: "rank-program", evidence: "carries batched decode and verify rounds for several lanes, output_effect none with no condition", fix: "same as step-scheduler: add a row-independence condition for none, or record the part as numeric"}
  - {type: "step-execution", claim: "must_never: A step ends only when every part of its work is complete.", part: "rank-program", evidence: "executor (driving rank-program) exists because 'results become readable before device work ends, and memory may be reused only after true device retirement'; ResultReady is delivered before DeviceRetired", fix: "split the rule: a step's results are used only after the work that produces them is complete; its memory is reused only after all of its device work has retired"}
  - {type: "layer-compute", claim: "effect_on_output: numeric always (only last bits differ)", part: "layer-compute", evidence: "output_effect_when: 'activations may be quantized to 4 or 8 bits where a weight use allows it' - a deliberate precision reduction, more than last-bit differences; the type's own choice says a deliberate change 'changes output'", fix: "add a case changes_output when activations are computed at reduced precision or the arithmetic is deliberately changed"}
  - {type: "layer-compute", claim: "must_never: The order of operations the model defines is not changed.", part: "layer-compute", evidence: "'private accumulator order varies by kernel, batch shape and chunking'", fix: "scope the rule: the sequence of operations the model defines is not changed; the order of accumulation inside one operation may vary"}
  - {type: "prompt-reading", claim: "must_never: The state it leaves is the state of that prompt, whatever the chunking.", part: "chunked-prefill", evidence: "output_effect_when: 'state after chunked reading can differ in the last bits from a different chunking or from token-by-token reading' (the type's own effect case says the same)", fix: "the state it leaves is the state of that prompt up to rounding, whatever the chunking"}
  - {type: "draft-verification", claim: "effect_on_output: changes_output only when an acceptance rule does not preserve the sampling distribution", part: "draft-acceptance", evidence: "output_effect changes_output: 'under sampling, the token sequence differs from non-speculative sampling with the same seed while the distribution is preserved'", fix: "add a case: changes_output under sampling even with a distribution-preserving rule, because the drawn tokens differ from non-speculative sampling with the same seed"}
  - {type: "prefix-reuse", claim: "effect_on_output: numeric when state is stored at reduced precision, or batched and unbatched paths round differently", part: "context-resource-manager", evidence: "output_effect numeric because 'a restored prefix was read with different chunk boundaries than a fresh read'", fix: "add the condition: or the stored state was produced with different chunk boundaries than a fresh read would use"}
wrong_assignments:
  - {part: "expert-priority-table", assigned: "residency-policy", better: "calibration", why: "it is a recorded offline ranking from routing-count measurement, with a geometry check deciding whether the record applies; it decides no entry or exit itself (expert-residency-planner and offload-mode-switch do), and residency-policy's must_never about changing contents does not apply to it. Both of its decisions are calibration choices (what is measured and how; what is used when no valid record exists)."}
  - {part: "expert-residency-planner", assigned: "memory-planning", better: "residency-policy", why: "its core job is choosing the fixed expert set per layer from the ranking and whether the reusable region holds extra experts or windows (residency-policy forms 'fixed at startup from an offline ranking', 'whether a region changes role with load'); memory-planning's own startup-memory-planner explicitly does not size the expert cache. It also fixes the CPU worker count (secondary-compute) and the dispatch threshold (expert-dispatch), so it is a composite; memory-planning covers only its byte budgeting."}
