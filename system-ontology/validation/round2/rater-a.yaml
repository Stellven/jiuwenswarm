pairs_hard_to_separate:
- types:
  - draft-verification
  - sampling
  why: Acceptance under sampling and residual resampling sit in the sampler in some engines and in the verifier in others; commit is often a separate part.
- types:
  - prefix-reuse
  - state-tiering
  why: Prefix caches spanning RAM, host and SSD both index reusable state and move it between tiers.
- types:
  - step-scheduler
  - step-execution
  why: Engine command loops run steps and also decide their content; the boundary follows process layout.
- types:
  - sequence-lifecycle
  - step-scheduler
  why: Slot assignment, admission and pausing appear in both.
- types:
  - model-partitioning
  - device-communication
  why: Most multi-device parts both split the model and run the exchanges.
- types:
  - positional-state-store
  - state-pool
  why: Paged KV stores usually also allocate and compact pages.
- types:
  - memory-planning
  - residency-policy
  why: Startup offload planners fix the resident expert set while sizing memory.
- types:
  - resource-governing
  - prefix-reuse
  why: Reclaim victim choice is placed in reuse indexes in some engines.
definitions_that_need_work:
- type: draft-verification
  problem: Bundles acceptance and state commit; several engines split them into separate parts.
- type: modality-encoding
  problem: Does not cover media fetching, preprocessing and document rendering that produce no embeddings.
- type: model-loading
  problem: Does not separate opening, validating and planning from moving weight bytes; load-time precision changes are excluded by effect_on_output.
- type: engine-supervision
  problem: Unclear whether the engine-core loop process, rank worker spawning and stall-only watchdogs belong here.
- type: expert-fetch
  problem: No home for a shared storage reader pool serving experts, rows and spilled KV, nor for page-cache warming of mapped weights.
- type: sequence-lifecycle
  problem: No type for routing across independent replica engines; 'engine copy' in a choice is the only hint.
- type: layer-compute
  problem: Deliberate arithmetic changes like steering vectors are only a choice, yet appear as standalone parts with state.
- type: output-constraint
  problem: Parts that change sampling settings per position without masking fall between it and sampling.
