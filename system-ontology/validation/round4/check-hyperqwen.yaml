contradictions:
  - {part: "recurrent-state-store", type: "recurrent-state-store", claim: "with what is needed to go back: snapshots, a second copy, or a commit deferred until acceptance is known", evidence: "Rollback uses one state slot per draft position, written during the verify block; the next step continues from the slot of the accepted index. None of the three named means.", fix: "with what is needed to go back: snapshots, a second copy, one slot per proposed position, or a commit deferred until acceptance is known"}
  - {part: "verify-length-controller", type: "draft-policy", claim: "state: estimates of acceptance and cost", evidence: "Owns only the previous step's want flag, a sticky countdown and a pinned copy of the lookup flags; it keeps no estimate of acceptance or cost.", fix: "state: the signals it decides from: estimates of acceptance and cost, or mode flags and countdowns"}
  - {part: "drafter-free-chains", type: "draft-policy", claim: "state: estimates of acceptance and cost", evidence: "Owns a host-side engaged-or-not state machine; entry and exit are by match and first miss, no estimate.", fix: "state: the signals it decides from: estimates of acceptance and cost, or the current mode and what ends it"}
  - {part: "kv-offload-tier", type: "state-tiering", claim: "Move per-sequence state out of fast memory to a slower place and back, so that more sequences or longer contexts fit.", evidence: "It copies blocks already evicted from the pool and restores them on a later prefix hit or after preemption; its purpose is to avoid recomputation, not to let more sequences or longer contexts fit.", fix: "Move per-sequence state out of fast memory to a slower place and back, so that more sequences or longer contexts fit, or so that state evicted from fast memory is restored instead of recomputed."}
relaxations:
