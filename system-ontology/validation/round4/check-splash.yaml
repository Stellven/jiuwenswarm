contradictions:
  - {part: "model-inspection", type: "model-loading", claim: "effect_on_output: exact / rounding / resampled / approximate, the approximate case being 'weights the full model computes with are quantised or otherwise reduced while loading'", evidence: "runtime/model/RopeScaling.hpp:12-23 YaRN is static, every request short or long takes the same factor; server/serve_options.py:487-491 says it 'changes answers at every length' and is turned on when --max-context exceeds the native window. The node's own choice 'whether the model's positional range is extended beyond its trained length' changes output and no listed case covers it.", fix: "add 'approximate: it extends the model's positional range, where the extension changes the computation for every length'"}
  - {part: "streamed-parts-planner", type: "memory-planning", claim: "takes: what the machine reports as free", evidence: "inventory must_never 'rest any size on the host's free memory; only the engine limit counts'; memory-plan takes the device's recommended working set and physical memory (a capacity), not free memory. Free memory is read only at run time by memory-governor.", fix: "takes: what the machine reports as its capacity or as free"}
