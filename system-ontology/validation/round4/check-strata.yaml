contradictions:
- part: host-memory-admission
  type: resource-governing
  claim: A grant of memory never takes the engine over its limit.
  evidence: When available RAM (which includes the operator's --ram-keep-gib) is below the arena's need and the fallback is
    not allowed because the operator fixed the choice by hand, the arena is loaded anyway with a warning; only a hard (cgroup)
    limit refuses (include/strata/core/ple_residency.hpp:50-65, verdict Warn).
  fix: A grant of memory never takes the engine over a hard limit; a soft figure (available memory, an operator's keep-free
    amount) is exceeded only on the operator's explicit choice and with a warning.
- part: output-head
  type: layer-compute
  claim: Unless an approximation that was explicitly turned on is in effect, the sequence of layers and operations the model
    defines is kept; only the order of accumulation inside one operation may vary.
  evidence: 'Correction (round3): on the pack path, the default when the --native preset is not given, the mixed activation
    is quantised to 8-bit q8_K before the vocabulary projection (src/core/layer.cpp:1425). Nothing turns this on explicitly;
    it is the path''s default.'
  fix: Unless an approximation turned on explicitly, or as a default recorded with the run's settings, is in effect, the sequence
    of layers and operations the model defines is kept; reduced activation precision inside a kernel counts as such an approximation,
    and otherwise only the order of accumulation inside one operation may vary.
- part: prompt-builder
  type: prompt-preparation
  claim: 'effect_on_output defines: when it corrects the template, injects text, shortens input, or tokenizes in pieces'
  evidence: The part shortens the output limit to the room left in the context minus a margin instead of refusing, and maps
    an absent, zero or negative limit to the rest of the context; that decides where output stops. No listed case covers setting
    the output limit.
  fix: 'defines: when it corrects the template, injects text, shortens input, sets or shortens the output limit, or tokenizes
    in pieces'
relaxations: []
wrong_assignments:
- part: layer-kernels
  assigned: layer-compute (also recurrent-state-store)
  better: layer-compute, with positional-state-store as a further also
  why: The part owns per-position indexer keys (indexer_keys) at fixed device addresses; that is the indexed per-position
    state positional-state-store names, and neither assigned type covers holding it.
- part: kv-store
  assigned: positional-state-store
  better: positional-state-store, with state-tiering as also
  why: With streaming on it always writes a host copy and keeps only a window of positions in fast memory, bringing selected
    blocks back before attention reads them; that is moving per-sequence state to a slower tier and back so longer contexts
    fit.
inventory_errors:
- part: window-loop
  field: output_effect_when
  recorded: bit_exact when default configuration; approximate when ... a route tail skip rank is set
  source_shows: The route tail skip is on by default on CUDA serving (rank 7) unless at least 90% of experts are in the GPU
    cache or the experts are NVFP4, and it changes the output (src/program/generate.cpp:12776-12822; src/core/expert_source.cpp:4964;
    docs/QUANTS.md:158). The default configuration is not bit_exact.
- part: expert-dispatch
  field: decisions
  recorded: A missed expert that every token of the window routes only at this rank or lower is neither fetched nor computed;
    tail skip described as default on the CUDA serving path
  source_shows: 'The default is conditional: off when the share of experts in the GPU cache reaches STRATA_TAIL_SKIP_MAX_CACHED
    (default 90%, 60 on a HIP layer split) and off for NVFP4 experts; the start-up message says which applies (src/program/generate.cpp:12787-12822).
    That condition is a decision of its own.'
- part: engine-command-loop
  field: output_effect_when
  recorded: approximate when Batch slots on, sampled decoding, with a move between the solo path and a slot
  source_shows: Sampled rows in batch slots use the solo window's counter-based draw Philox(seed, position) (docs/BATCHING.md:623-624);
    a move changes only the logits' rounding, which can flip a draw. Nothing approximates the computation.
- part: slot-scheduler
  field: output_effect_when
  recorded: approximate when Sampled decoding with a move between the solo path and a slot
  source_shows: 'Same as engine-command-loop: the draw is keyed by seed and position on both paths (docs/BATCHING.md:623-624);
    the difference is rounding of the logits, not an approximation.'
