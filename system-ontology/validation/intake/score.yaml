  readiness: needs_clarification
  readiness_reason: 'Purpose and requested result are clear, but one required statement conflicts: the engine description
    the user gives as what is wanted routes 10 of 512 experts, while the given model routes 8 of 256 (unc-expert-routing-conflict).
    Contradictory required constraints are blocking. All other uncertainties are missing or ambiguous parameters that Requirements
    can carry as unresolved items.'
