    context: 8
    in_scope: 7
    out_of_scope: 6
    constraints: 7
    preferences: 3
    user_targets: 6
    uncertainties: 13
  uncertainties_blocking: 1
  uncertainties:
  - id: unc-expert-routing-conflict
    kind: conflicting
    blocking: true
    description: The given model selects 8 of 256 experts per token per layer (model card, system summary, node startup
      sizing), but the node-level expert router, which the user gives as part of what is wanted, turns the feed-forward
      input into 512 logits and chooses 10 experts, and the system flow routed-experts carries 10 expert ids per token.
      The engine description contradicts the given model on the routing it must implement.
  - id: unc-context-length
    kind: missing
    blocking: false
    description: The context length the engine must offer is not given; the target says the engine cannot be sized until
      it is. The node-level run configuration recommends 131072, which the target does not adopt.
  - id: unc-memory-budget-proposed
    kind: ambiguous
    blocking: false
    description: The 80 GB memory budget, its decimal unit basis and its accounting boundary are proposals awaiting confirmation;
      the scope page names three figures (128 GB, 12 GB, 80 GB).
  - id: unc-quality-taskset-threshold
    kind: missing
    blocking: false
    description: The held-out task set and the pass threshold for the quality score are not given.
  - id: unc-allowed-transformations
    kind: missing
    blocking: false
    description: Whether quantisation below NVFP4 or approximations that change output are allowed is not stated; this also
      decides which quality comparison applies.
  - id: unc-workload
    kind: missing
    blocking: false
    description: The fixed workload (including prompt lengths) on which time to first token, decode rate and peak memory
      are reported is not defined.
  - id: unc-checkpoint
    kind: missing
    blocking: false
    description: The model checkpoint is not chosen; the target notes the model card offers BF16 and NVFP4 and only NVFP4
      is within reach.
  - id: unc-boundary-form
    kind: ambiguous
    blocking: false
    description: The engine's form (execution library, offline engine or online service) is unset in the target, while the
      system and node descriptions include an HTTP front accepting OpenAI- and Anthropic-shaped requests.
  - id: unc-streaming-environment
    kind: missing
    blocking: false
    description: Whether output is streamed, and the software environment, are unset in the target.
  - id: unc-drafting-residue
    kind: conflicting
    blocking: false
    description: Drafting is excluded from the first version, but some system flows still describe drafts (token lines per
      verify window when drafts are accepted; drafts counted in end-of-request figures).
  - id: unc-multi-card-and-ngram
    kind: ambiguous
    blocking: false
    description: Node and flow descriptions refer to several cards and to an n-gram table, while the machine has one GPU
      and the model card names no lookup table.
  - id: unc-expert-arena
    kind: ambiguous
    blocking: false
    description: The system summary keeps all experts on storage and reads missed experts on demand, but the flow expert-bytes-from-files
      describes every routed expert read into an arena at startup, with a file-source mode as the alternative.
  - id: unc-model-unknowns
    kind: missing
    blocking: false
    description: 'Model facts the engine depends on are not in the sources: per-token attention key/value size (config.json
      not read), separate sizes of expert and other weights (derived under an assumption), whether the output head is tied
      to the embedding; SSD read bandwidth of the machine is not given.'
