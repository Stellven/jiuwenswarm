inventory_errors:
  - {part: "ane-ffn-split", field: "output_effect_when", recorded: "when the split runs (27B prefill with --ane on and a calibrated gain)", source_shows: "The split is on by default for dense models; the server offers only --disable-ane (default False), which passes --ane off to the engine (server/serve_options.py:755-766)."}
  - {part: "draft-proposer", field: "output_effect", recorded: "none (while output_effect_when says sampled lanes see different tokens)", source_shows: "Sampled acceptance u*q < p uses the draft's probabilities (runtime/metal/kernels/decode/sampling.metal:1460-1510, recorded under acceptance-commit as changes_output), so under sampling the proposal changes the draw: changes_output for sampled lanes."}
