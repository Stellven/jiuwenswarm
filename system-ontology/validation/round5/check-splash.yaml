contradictions:
  - {part: "prefill-runner", type: "prompt-reading", claim: "Unless an approximate path that was explicitly turned on is taken, the state it leaves is the state of that prompt up to rounding ... whatever the chunking.", evidence: "The W8A8 Neural Engine share of dense FFN prefill (ane-ffn-split, inventory changes_output) is on by default; server/serve_options.py:755-766 offers only --disable-ane, default False. The approximate path is taken without being explicitly turned on.", fix: "Unless an approximate path is in effect that was turned on explicitly or as a recorded default that can be turned off, the state it leaves is the state of that prompt up to rounding, whatever the chunking."}
  - {part: "memory-governor", type: "resource-governing", claim: "A soft figure is exceeded only on the operator's explicit choice and with a warning.", evidence: "The host margin is a soft figure the engine sets itself; floor work always passes the host rule and in-service work passes as an exempt claim once nothing in place meets it (runtime/engine/MemoryGovernor.hpp:294-305), with no operator choice.", fix: "A soft figure is exceeded only by classes of work the engine states in advance, or on the operator's explicit choice."}
  - {part: "thinking-budget", type: "output-constraint", claim: "effect_on_output: defines, when: always, by design", evidence: "Output changes only whenever the budget runs out before the model ends thinking (inventory output_effect_when); below the budget the output is that of the unconstrained model.", fix: "defines, when the rule forbids or forces a token the model would otherwise have produced; exact otherwise."}
  - {part: "document-renderer", type: "media-preparation", claim: "effect_on_output: defines, when how media is resized or cut decides the model's input", evidence: "Correction (round4): server/documents.py:133-153 extracts page text as well as rendering pages at a chosen scale; text extraction is neither resizing nor cutting.", fix: "defines, when how media is converted (text extracted, pages rendered), resized or cut decides the model's input."}
  - {part: "weight-image-loader", type: "model-loading", claim: "effect_on_output cases: exact when weights are used as stored or re-encoded without changing their values; resampled when it reduces weights used only for proposals under sampling", evidence: "It quantizes the BF16 draft to 4 bits at load; under greedy decoding this leaves the target's output unchanged, a case none of the listed conditions covers (model-conversion lists it, model-loading does not).", fix: "exact: weights are used as stored, re-encoded without changing their values, or reduced only for proposals under greedy decoding."}
