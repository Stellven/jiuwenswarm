inventory_errors:
  - part: "gpu-backend"
    field: "output_effect"
    recorded: "numeric (scalar, batched and tensor-parallel kernels are not numerically identical)"
    source_shows: "ds4_cuda.cu 1236-1277: single-GPU CUDA uses the vendored mmq tier by default for steps of 2 or more rows, quantising activations to Q8_1 (off with --quality, DS4_CUDA_MMQ=0 or several GPUs); ds4_cuda.cu 14787-14792: MXFP4 indexer for steps of 32 or more tokens with 1024 or more compressed rows (off with --quality). Reduced activation precision is changes_output, on by default, settable off."
  - part: "prompt-prefill-driver"
    field: "output_effect"
    recorded: "numeric (batched prefill versus token-by-token decode differ in summation order)"
    source_shows: "Same source as above: on CUDA, prefill chunks of 2 or more tokens run with Q8_1-quantised activations by default (ds4_cuda.cu 1236-1277), so prefill versus decode differs beyond summation order unless --quality is set."
