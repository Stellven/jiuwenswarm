contradictions:
- part: window-loop
  type: step-execution
  claim: 'effect_on_output: exact when one sequence per step, or kernels that treat each row independently'
  evidence: 'With one sequence the width of the verify window changes a row''s arithmetic: draft-verifier records numeric
    for a greedy request with a native IQ pack and experts on the CPU, because the grouped CPU kernels round differently by
    window width; mtp-drafter and lookup-drafter record that the number of drafts sets that width. One sequence per step is
    not enough for exact.'
  fix: exact when every row's arithmetic is independent of how many rows the step holds; rounding when sequences sharing a
    step, or the number of rows of one sequence's step, change the arithmetic of a row
- part: startup-memory-sizing
  type: memory-planning
  claim: 'effect_on_output: rounding when what it places where decides which device computes something'
  evidence: Its last-resort ladder gives the prompt path its own buffers at 1024, 512 or 256 tokens, which sets the prompt
    chunk; docs/RESEARCH_RUNS.md:60 says a change of chunking changes the rounding and docs/MESSAGE_BOUNDARY_CACHE.md:65 that
    chunk geometry can change floating-point results. No listed case covers a size that changes how the computation is cut.
  fix: rounding when what it places where decides which device computes something, or a size it sets (such as the prompt chunk)
    changes how the computation is cut
- part: checkpoint-chain
  type: prefix-reuse
  claim: 'effect_on_output: rounding when the stored state was produced under other rounding than a fresh read: reduced width,
    other chunk boundaries, another batch path, or computation placed on other devices'
  evidence: The inventory records numeric when a checkpoint cut ends a prompt part and so changes the chunking of the prompt
    read; that changes the output of the request that stores the checkpoint, with no reuse involved. The listed cases cover
    only the effect of reusing a state.
  fix: 'add: rounding when where it places a restore point splits the prompt read and so changes the chunking of the request
    that stores it'
relaxations: []
wrong_assignments: []
inventory_errors:
- part: startup-memory-sizing
  field: output_effect_when
  recorded: bit_exact when the sizing only moves where bytes are read from (output head on host, smaller prompt chunks); inferred
  source_shows: A smaller prompt chunk changes the chunking and with it the rounding (docs/RESEARCH_RUNS.md:60, docs/MESSAGE_BOUNDARY_CACHE.md:65).
    Smaller chunks are numeric, not bit_exact.
- part: host-memory-admission
  field: output_effect
  recorded: none; bit_exact for arena or file source, per the startup message, not verified
  source_shows: A missed expert is fetched to the GPU only when its source bytes are page-locked (src/core/expert_source.cpp:5056-5063,
    d.src->pinned); otherwise it stays with the CPU. Choosing the file source instead of the registered arena moves uncached
    experts from GPU to CPU computation, which the inventory's expert-source entry records as numeric. The choice is numeric,
    not none.
