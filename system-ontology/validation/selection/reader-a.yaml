  - {node_type: memory-planning, needed: needed, because: "No applies_when; and c-mem proposes an 80 GB budget in mem0 that must be divided between expert cache and attention state.", asks: ""}
  - {node_type: graph-capture, needed: needed, because: "gpu0 is a Blackwell GPU, and decode over 62 layers of small kernels benefits from recorded graphs on such a device.", asks: ""}
  - {node_type: layer-compute, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
  - {node_type: device-backend, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
