  - {node_type: model-conversion, needed: needed, because: "No applies_when; the safetensors checkpoint (model_checkpoint UNSET, BF16 or NVFP4) must be obtained, pinned and put in the engine's layout.", asks: ""}
  - {node_type: calibration, needed: needed, because: "No applies_when, so every engine has it; here it would at least rank expert usage for an expert cache inside the 80 GB budget.", asks: ""}
