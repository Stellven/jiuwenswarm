  - {node_type: modality-encoding, needed: not_needed, because: "The model has a perception_encoder, but the engine serves text input only (interface.input.modality text, required).", asks: ""}
  - {node_type: expert-source, needed: needed, because: "The model selects 8 of 256 experts per token per layer and the derived 399.5 GB of experts cannot sit in 128 GB of memory, let alone the 80 GB budget, so they stay on ssd0.", asks: ""}
