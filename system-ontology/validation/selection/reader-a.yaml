  - {node_type: residency-policy, needed: needed, because: "There is a cache of experts in mem0 (see expert-cache).", asks: ""}
  - {node_type: expert-fetch, needed: needed, because: "There is a cache of experts, and absent ones must be paged in from ssd0 to mem0.", asks: ""}
