targets:
  qwen-on-pc:
  - {node_type: model-conversion, needed: needed, because: "No applies_when; every engine has it, and the target delivers the checkpoint qwen3.8-flash-next-iq3_s that must be pinned and put in the engine's layout.", asks: ""}
  - {node_type: calibration, needed: needed, because: "No applies_when, so every engine has it; here it would at least rank expert usage for the 12 GB VRAM expert cache.", asks: ""}
  - {node_type: model-loading, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
  - {node_type: memory-planning, needed: needed, because: "No applies_when; and target c-mem sets a hard 12 GB VRAM budget that weights, state and caches must be divided within.", asks: ""}
  - {node_type: graph-capture, needed: open, because: "machine.yaml names only a gpu0 of kind gpu, with no vendor, architecture or API, so whether pre-recorded graphs or pre-compiled kernels pay off is not stated.", asks: "Which GPU and programming interface gpu0 is, and whether decode on it is launch-bound or needs first-use compilation."}
  - {node_type: layer-compute, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
  - {node_type: device-backend, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
  - {node_type: secondary-compute, needed: open, because: "Experts (50.3 GB) cannot fit the 12 GB VRAM budget and cpu0 reads them in host RAM directly, so computing selected experts on the CPU is a candidate, but the target leaves placement to the builder.", asks: "Whether selected experts held in host RAM are computed by cpu0 (or by gpu0 over its direct read of RAM) instead of being copied to VRAM."}
  - {node_type: model-edit, needed: not_needed, because: "The target interface is plain text in, text out for single_stream_text and offers no run-time changes to the model's behaviour.", asks: ""}
  - {node_type: step-execution, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
  - {node_type: prompt-reading, needed: open, because: "Whether prompts get their own chunked path or share the decode step is a design choice the target does not make.", asks: "Whether the engine reads prompts by a separate chunked path rather than in the same steps as decode rows."}
  - {node_type: media-preparation, needed: not_needed, because: "target interface input modality is text.", asks: ""}
  - {node_type: modality-encoding, needed: not_needed, because: "The model has no encoder and the target input modality is text.", asks: ""}
  - {node_type: expert-source, needed: needed, because: "The model selects 10 of 512 experts per token per layer and the 50.3 GB of expert weights cannot sit in the 12 GB VRAM the GPU computes from.", asks: ""}
  - {node_type: expert-cache, needed: needed, because: "Not all 50.3 GB of experts fit in 12 GB of VRAM, and target c-mem caps VRAM at 12 GB.", asks: ""}
  - {node_type: residency-policy, needed: needed, because: "There is a cache of experts in VRAM (see expert-cache), and target c-equiv requires that cache contents not change output.", asks: ""}
  - {node_type: expert-fetch, needed: needed, because: "There is a cache of experts, and absent ones must be brought over the ram-to-vram transfer path (and from ssd0 by page_in).", asks: ""}
  - {node_type: expert-dispatch, needed: needed, because: "Selected experts can be in VRAM, in host RAM or on ssd0, and both cpu0 and gpu0 can read RAM.", asks: ""}
  - {node_type: row-source, needed: needed, because: "The model has ngram_lookup reading a 28.8 GB ngram_table (and a token_embedding read one row per token), which cannot be held in 12 GB VRAM.", asks: ""}
  - {node_type: storage-reader, needed: open, because: "All weights total about 85 GB against 64 GB of host RAM, so something is read from ssd0 while running, but whether it is more than one kind of data (experts and n-gram rows) depends on placement left to the builder.", asks: "Whether both expert weights and n-gram table rows (or other data) are read from ssd0 while the engine runs."}
  - {node_type: positional-state-store, needed: needed, because: "No applies_when; the model writes attention_kv, indexer_keys and the draft layer's mtp_kv per position.", asks: ""}
  - {node_type: recurrent-state-store, needed: needed, because: "The model writes gdn_state, a fixed-size recurrent state that cannot be cut back, and drafting is offered so rejection needs a way back.", asks: ""}
  - {node_type: state-pool, needed: not_needed, because: "The target workload is single_stream_text, so several sequences do not share one backing memory for state.", asks: ""}
  - {node_type: state-tiering, needed: open, because: "The context length to offer is not stated, so whether attention state exceeds what fits beside the expert cache in 12 GB VRAM is unknown.", asks: "What context length the engine must offer, and whether its attention and indexer state then fits in the VRAM budget."}
  - {node_type: prefix-reuse, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
  - {node_type: session-persistence, needed: not_needed, because: "The target interface offers no saving or restoring of sessions.", asks: ""}
  - {node_type: draft-proposal, needed: needed, because: "The model has a draft layer mtp_draft (up to 7 tokens) and an optional dflash2_draft, a cheap source of proposals.", asks: ""}
  - {node_type: draft-policy, needed: open, because: "Two draft sources exist, but whether the amount or source of drafting is adjusted while running is a design choice the target leaves open.", asks: "Whether the draft length or draft source (mtp or dflash2) is adjusted while running rather than fixed."}
  - {node_type: draft-verification, needed: needed, because: "Tokens are proposed ahead by the model's mtp_draft, so the full model must accept them and commit attention, gdn and mtp state to the accepted prefix.", asks: ""}
  - {node_type: sampling, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
  - {node_type: output-constraint, needed: not_needed, because: "The target offers plain text output with no constrained output or enforced format.", asks: ""}
  - {node_type: output-interpretation, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
  - {node_type: request-front, needed: needed, because: "No applies_when; every engine has it (here the offline_engine's way of taking requests and streaming results).", asks: ""}
  - {node_type: prompt-preparation, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
  - {node_type: step-scheduler, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
  - {node_type: sequence-lifecycle, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
  - {node_type: replica-routing, needed: not_needed, because: "One PC serving single_stream_text; no several whole copies of the engine run side by side.", asks: ""}
  - {node_type: engine-supervision, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
  - {node_type: scoring, needed: not_needed, because: "The target interface offers text generation only, no scoring.", asks: ""}
  - {node_type: model-partitioning, needed: open, because: "The machine has one GPU and one CPU; whether the model is spread over both devices depends on the placement the builder chooses.", asks: "Whether parts of the model (layers or experts) are computed on cpu0 as well as gpu0."}
  - {node_type: device-communication, needed: open, because: "Needed only if the model is spread over cpu0 and gpu0, which the target leaves to the builder.", asks: "Whether the model is split between cpu0 and gpu0 so that activations or partial results move between them."}
  - {node_type: configuration, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
  - {node_type: resource-governing, needed: open, because: "The 12 GB VRAM budget is fixed, workload is a single stream, and nothing states memory reclaim by the system or a power limit while running.", asks: "Whether host RAM is reclaimed by the OS or a power/thermal limit applies while the engine runs on this PC."}
  - {node_type: telemetry, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
