  - {node_type: sequence-lifecycle, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
  - {node_type: replica-routing, needed: not_needed, because: "One DGX Spark with an 80 GB budget for one copy of an 816B model leaves no room for several whole copies side by side.", asks: ""}
  - {node_type: engine-supervision, needed: needed, because: "No applies_when; every engine has it.", asks: ""}
  - {node_type: scoring, needed: open, because: "c-quality judges a task score with taskset UNSET; whether that taskset scores options by log-probability is not stated.", asks: "Whether the quality taskset needs log-probability scoring of given text or options rather than generation only."}
