# Reader B. Inputs: node-types.thin.yaml and the model/machine/target files of the three target folders in this folder only.
targets:
  qwen-on-pc:
  - {node_type: model-conversion, needed: needed, because: "No applies_when; the delivery names an iq3_s checkpoint that must be obtained, pinned and put in the engine's layout.", asks: ""}
  - {node_type: calibration, needed: needed, because: "No applies_when; every engine has it (here, e.g., usage rankings of 512 experts for a cache that cannot hold them all).", asks: ""}
  - {node_type: model-loading, needed: needed, because: "No applies_when; every engine opens and checks its model files.", asks: ""}
  - {node_type: memory-planning, needed: needed, because: "No applies_when; the target sets a 12 GB vram budget (c-mem) that the plan must respect.", asks: ""}
  - {node_type: graph-capture, needed: open, because: "machine.yaml says only 'gpu' with no vendor, architecture or runtime, so whether pre-recorded or pre-compiled work benefits it is not stated.", asks: "Which GPU and runtime is gpu0, and does it benefit from recorded graphs or compiled kernels?"}
  - {node_type: layer-compute, needed: needed, because: "No applies_when; the model's 48 layers must be computed.", asks: ""}
  - {node_type: device-backend, needed: needed, because: "No applies_when; work must be submitted to gpu0 and/or cpu0.", asks: ""}
  - {node_type: secondary-compute, needed: open, because: "Experts (50.3 GB) exceed the 12 GB vram budget and cpu0 reads ram directly, but whether CPU compute beats GPU direct_read or transfer depends on bandwidths the machine file does not give.", asks: "Is computing selected experts on cpu0 from ram faster than having gpu0 read or copy them from ram?"}
  - {node_type: model-edit, needed: not_needed, because: "The target interface is plain text in and out and offers no run-time change to the model's behaviour.", asks: ""}
  - {node_type: step-execution, needed: needed, because: "No applies_when; every engine carries planned steps through the model.", asks: ""}
  - {node_type: prompt-reading, needed: open, because: "Whether prompts are read by a separate chunked path or inside ordinary steps is an engine design choice the target leaves open.", asks: "Will the engine read prompts by a path of its own rather than as chunks inside ordinary steps?"}
  - {node_type: media-preparation, needed: not_needed, because: "target.yaml interface input modality is text only.", asks: ""}
  - {node_type: modality-encoding, needed: not_needed, because: "The model has no encoder and the target input modality is text.", asks: ""}
  - {node_type: expert-source, needed: needed, because: "expert_router picks 10 of 512 experts per token per layer and the 50.3 GB of expert_weights cannot sit in the 12 GB vram budget.", asks: ""}
  - {node_type: expert-cache, needed: needed, because: "Not all 50.3 GB of experts fit in 12 GB of vram, so a bounded fast-memory set is kept.", asks: ""}
  - {node_type: residency-policy, needed: needed, because: "There is an expert cache in vram (12 GB budget vs 50.3 GB of experts).", asks: ""}
  - {node_type: expert-fetch, needed: needed, because: "There is an expert cache, so absent experts must be brought in (ram-to-vram transfer path exists).", asks: ""}
  - {node_type: expert-dispatch, needed: needed, because: "Selected experts can be in vram or only in ram (or ssd), and the machine has gpu0 and cpu0 with direct paths to ram.", asks: ""}
  - {node_type: row-source, needed: needed, because: "The model has ngram_lookup reading rows of a 28.8 GB ngram_table per token.", asks: ""}
  - {node_type: storage-reader, needed: open, because: "Experts (50.3 GB) plus ngram_table (28.8 GB) exceed 64 GB ram, so something is read from ssd0, but whether more than one kind of data is read from it while running depends on placement.", asks: "Which data (ngram rows, expert weights, both) is read from ssd0 while the engine runs?"}
  - {node_type: positional-state-store, needed: needed, because: "No applies_when; the model writes attention_kv, indexer_keys and mtp_kv per position.", asks: ""}
  - {node_type: recurrent-state-store, needed: needed, because: "The model writes gdn_state, a fixed-size recurrent state, and has drafters (mtp, dflash2) whose rejected tokens require going back.", asks: ""}
  - {node_type: state-pool, needed: not_needed, because: "The workload is single_stream_text, so several sequences do not share one backing memory.", asks: ""}
  - {node_type: state-tiering, needed: open, because: "The context length the engine must offer is not stated, so whether state exceeds the vram left after the 12 GB budget's other uses is unknown.", asks: "What context length must the engine support within the 12 GB vram budget?"}
  - {node_type: prefix-reuse, needed: needed, because: "No applies_when; every engine has it (for a single stream, continuing from the previous turn's state).", asks: ""}
  - {node_type: session-persistence, needed: not_needed, because: "The target does not offer saving or restoring sessions; the interface is text in, text out.", asks: ""}
  - {node_type: draft-proposal, needed: needed, because: "The model has mtp_draft and dflash2_draft, each proposing up to 7 tokens.", asks: ""}
  - {node_type: draft-policy, needed: open, because: "Whether the amount of drafting is adjusted while running is a design choice not stated in the target.", asks: "Is the draft length or source adjusted at run time, or fixed?"}
  - {node_type: draft-verification, needed: needed, because: "Tokens are proposed ahead by the model's mtp/dflash2 drafters.", asks: ""}
  - {node_type: sampling, needed: needed, because: "No applies_when; logits must be turned into tokens.", asks: ""}
  - {node_type: output-constraint, needed: not_needed, because: "The target offers plain text output with no grammar, tool-call format or other enforced format.", asks: ""}
  - {node_type: output-interpretation, needed: needed, because: "No applies_when; tokens must be turned into streamed text with a stop decision.", asks: ""}
  - {node_type: request-front, needed: needed, because: "No applies_when; even an offline_engine accepts requests and returns streamed results.", asks: ""}
  - {node_type: prompt-preparation, needed: needed, because: "No applies_when; text must become prompt tokens.", asks: ""}
  - {node_type: step-scheduler, needed: needed, because: "No applies_when; the engine loop decides each step (decode, verify block, prompt chunk).", asks: ""}
  - {node_type: sequence-lifecycle, needed: needed, because: "No applies_when; even one stream is admitted, tracked and released.", asks: ""}
  - {node_type: replica-routing, needed: not_needed, because: "One PC, single_stream_text workload; no several whole copies of the engine.", asks: ""}
  - {node_type: engine-supervision, needed: needed, because: "No applies_when; the engine must be started, watched and stopped.", asks: ""}
  - {node_type: scoring, needed: not_needed, because: "The target offers text generation only; no scoring service is stated.", asks: ""}
  - {node_type: model-partitioning, needed: open, because: "Whether the model is split between gpu0 and cpu0 (e.g. whole layers or experts on the CPU) is a placement decision the target allows but does not make.", asks: "Will any layers or experts be computed on cpu0 rather than gpu0?"}
  - {node_type: device-communication, needed: open, because: "Depends on whether the model is spread over gpu0 and cpu0, which is not decided.", asks: "Will partial results move between gpu0 and cpu0 within a step?"}
  - {node_type: configuration, needed: needed, because: "No applies_when; every engine resolves settings.", asks: ""}
  - {node_type: resource-governing, needed: open, because: "The vram budget is fixed and the workload single-stream; whether host-memory reclaim (page cache over 64 GB ram) or a power limit varies the allowance at run time is not stated.", asks: "Does the engine's memory or power allowance change while it runs (OS reclaim of ram, power limit)?"}
  - {node_type: telemetry, needed: needed, because: "No applies_when; c-mem must be shown against the run.", asks: ""}
