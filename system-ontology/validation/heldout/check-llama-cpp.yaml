contradictions:
- part: telemetry
  type: telemetry
  claim: 'must: Recording does not change what the engine computes.'
  evidence: 'With an eval callback set, the scheduler no longer submits each backend piece whole: it cuts it into graph views
    ending at every node the callback wants, synchronizes after each, and stops the computation when the callback returns
    false (ggml/src/ggml-backend.cpp:2252-2287). Backends fuse operations only within one submitted graph, so cutting at observed
    nodes can change kernels and rounding, and the callback can abort a step.'
  fix: Recording does not change what the engine computes, except an opt-in per-operation inspection that is stated to change
    how work is submitted, and so may change rounding, or to stop a step.
- part: draft-verifier
  type: draft-proposal
  claim: 'must: A proposed token is never returned to the client before the full model has accepted it.'
  evidence: With --spec-synth-len or --spec-synth-rates (marked 'benchmarking only', common/arg.cpp:4217-4248) the server
    accepts draft tokens at random instead of by match with the target and returns them (tools/server/server-context.cpp:96-134,
    4864). The inventory records 'synthetic acceptance produces invalid output by design'.
  fix: A proposed token is never returned before the full model has accepted it, except in an explicitly enabled measurement
    mode whose output is declared invalid.
- part: draft-verifier
  type: output-constraint
  claim: 'must: A token the rule forbids is never returned.'
  evidence: Under synthetic acceptance, accepted draft tokens are returned without being checked against the grammar ('synthetic
    draft tokens do not advance grammar or reasoning state', tools/server/server-context.cpp:120-123).
  fix: A token the rule forbids is never returned, except in an explicitly enabled measurement mode whose output is declared
    invalid.
- part: continuous-batcher
  type: step-scheduler
  claim: 'effect_on_output: exact, always, in its own work'
  evidence: 'When a slot''s context is full and context shift is on (opt-in, common/common.h:599), the batcher decides how
    many tokens to keep and how many to discard and has the rest moved to earlier positions (inventory decision ''context
    shift: how many tokens to keep and discard''; tools/server/server-context.cpp:3483-3520). It thereby decides what history
    the model reads, which is the level ''defines''. If the shift itself is counted as the cache''s work, this is an indirect
    effect not named in affects_output_through.'
  fix: 'Add ''defines: when it discards part of a full context so that generation can continue''.'
- part: weight-placer
  type: model-loading
  claim: 'effect_on_output: exact when weights are ... re-encoded without changing their values'
  evidence: Weights placed in a CPU repacked buffer type are re-encoded at load into an interleaved layout without changing
    their values (ggml/src/ggml-cpu/repack.cpp), and that layout is read by other matmul kernels with another accumulation
    order; the inventory records 'different devices and repacked kernels round differently'. Re-encoding without changing
    values is therefore not exact here.
  fix: exact when weights are used as stored, or re-encoded without changing their values into a form the same kernels read;
    rounding when re-encoding without changing values selects other kernels.
- part: model-router
  type: replica-routing
  claim: 'summary: Present several independent copies of the engine as one, and choose which copy serves each request.'
  evidence: The router's children are separate server processes each serving a different model, chosen by the model name in
    the request, started on demand and unloaded by measured memory (tools/server/server-models-sched.h:1-60; inventory model-router).
    They are not copies of one engine, and the choice is not among equivalent copies.
  fix: 'Present several engine instances, of one model or of several, as one service: choose the instance that serves each
    request, by model name, load or held state, and start or stop instances as needed.'
new_causes:
- part: kv-cache
  type: positional-state-store
  kind: own
  level: rounding
  cause: stored keys are re-rotated in place to new positions (shift, or division of positions), so they differ in their last
    bits from keys computed at those positions, and a quantised store re-rounds them
  evidence: 'inventory kv-cache: ''supports remove, copy (shared cells), keep, shift and divide of positions per sequence'',
    ''pending shift flag'', decision ''whether position shifting (RoPE re-rotation) is allowed'''
- part: continuous-batcher
  type: prefix-reuse
  kind: own
  level: approximate
  cause: it reuses stored state of a matching chunk that is not part of the common prefix, computed after different preceding
    text, by moving it to its new positions
  evidence: inventory continuous-batcher decision 'how many prompt tokens can be skipped (common prefix, chunk reuse by shifting)';
    common/common.h:658 n_cache_reuse 'min chunk size to reuse from the cache via KV shifting' (opt-in, default 0)
- part: backend-sampler
  type: sampling
  kind: own
  level: resampled
  cause: the draw runs on the device with another random generator than host sampling, so the same seed gives another draw
    from the same distribution
  evidence: 'inventory backend-sampler output_effect_when: ''stochastic draws can pick different tokens than CPU sampling
    with the same seed; greedy matches'''
- part: moe-expert-cache
  type: expert-dispatch
  kind: own
  level: rounding
  cause: the share of misses left to the other device carries a remainder over from earlier plans, so which blocks a request
    computes on which device depends on what ran before it
  evidence: inventory moe-expert-cache owns_state 'fraction of a miss carried to the next plan', decision 'which misses go
    to the CPU (lowest score) and how many'
- part: draft-rollback
  type: draft-verification
  kind: through
  level: rounding
  cause: after a checkpoint is restored, the accepted tokens are replayed in a further step, so their state is recomputed
    at another step width than the checked block that accepted them
  evidence: 'inventory draft-rollback: ''saves a state checkpoint before verification and restores it then replays the accepted
    tokens''; gives ''replay of accepted tokens when a checkpoint was restored'' to continuous-batcher'
- part: decision-scorer
  type: scoring
  kind: own
  level: defines
  cause: it applies per-model calibration stored with the weights (temperatures, biases) to the scores and averages them over
    several orders of the options
  evidence: inventory decision-scorer takes 'decision metadata (labels, temperatures, biases)', returns 'calibrated option
    scores', 'order variants average out option-position bias'
- part: memory-fit-planner
  type: memory-planning
  kind: through
  level: defines
  cause: the context length it lowers to make the plan fit decides where a sequence's output is cut by the context limit
  evidence: 'inventory memory-fit-planner gives ''context size'' to kv-cache and adjusts unset parameters ''context size''
    first among things given up; request-slot ends output when ''context full without shift: stop with limit'''
relaxations:
- part: op-kernels
  type: layer-compute
  rule: An approximation that is in effect is stated with the run's settings.
  how: Quantised matmuls on CUDA run the activations at a reduced 8-bit precision in the kernels the engine chooses by device
    class and by the number of rows in the step (ggml/src/ggml-cuda/mmq.cu:395-526, MMQ_DP4A_MAX_BATCH_SIZE), with only a
    build-time switch to turn it off (GGML_CUDA_FORCE_CUBLAS); the run does not state it. This is a kernel default selected
    by step width and device with no run-time switch, a mechanism the relaxed text does not name.
- part: state-persistence
  type: session-persistence
  rule: A file is loaded only where its recorded identity matches the model and settings.
  how: Session and sequence files are checked only for magic and version and then structurally (layer count, key and value
    types and row sizes) (src/llama-context.cpp:3918-3990, src/llama-kv-cache.cpp:2729-2851). Nothing identifies the weights,
    so a file written under another model of the same shape, another fine-tune or another weight precision loads.
- part: continuous-batcher
  type: prefix-reuse
  rule: Stored state is reused only where the model, the weights' precision, the settings and the prefix match what it was
    made for.
  how: With chunk reuse on (n_cache_reuse > 0), stored state of chunks that match a later part of the prompt is reused although
    the prefix before them differs (common/common.h:658).
