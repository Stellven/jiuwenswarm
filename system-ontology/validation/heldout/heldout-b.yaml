missing_from_the_types:
- "Discovering compute devices and dynamically loading the matching backend libraries for the host machine."
- "Producing non-text output (audio codes and waveform) through extra stage models on a decode loop of their own."
- "Composing several coupled per-sequence state stores (attention, sliding-window, sparse-index, recurrent) behind one interface so every sequence operation reaches all of them."
- "Expressing the model's computation as a backend-independent tensor-operation graph that is built or reused per micro-batch and handed to a separate execution library."
- "Handing the target model's hidden states to a feature-conditioned proposer on the device with event ordering."
- "Context shift: dropping the oldest tokens of a full sequence and re-positioning the rest so generation continues."
- "Validating a logical batch and cutting it into micro-batches shaped for the state store, then restoring the caller's output order."
- "Resumable response streams: replaying buffered output to a client that reattaches after a disconnect."
- "Routing requests by model name to separate child server processes serving different models, with on-demand start and unload."
