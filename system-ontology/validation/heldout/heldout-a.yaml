missing_from_the_types:
- "Discovering the machine's compute devices and loading the backend implementation that best matches the host at startup."
- "Composing the per-sequence memory from several kinds of state store chosen per architecture and per layer, and applying every sequence operation to all members or none."
- "Splitting a logical batch into micro-batches whose grouping is dictated by the kind of state store (for example equal-length sequence sets for recurrent layers)."
- "Assigning each operation of a step's computation graph to a device every step, including moving operations on host-resident weights to an accelerator for large batches, and splitting the graph into per-device pieces."
- "Shifting stored per-position state to new positions (re-rotating keys) so that part of a full context can be discarded and generation continue."
- "Handing the target model's hidden states to a separate draft context on the device without a host round trip."
- "Producing output other than text, such as audio generated from tokens and hidden states by additional stage models."
- "Returning embeddings, pooled embeddings or rerank scores from a forward pass instead of tokens or log-probabilities."
- "Serving several different models behind one endpoint, starting and unloading whole model processes on demand within a memory budget."
