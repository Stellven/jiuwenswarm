contradictions:
  - {part: "calibration-data-capture", type: "calibration", claim: "effect_on_output: exact (in itself), rounding (split between devices / restore vs recompute), approximate (feeds a lossy conversion or reduced-precision path)", evidence: "Its captured Hessians feed GPTQ of the MTP module and the DFlash2 drafter, whose quantization 'changes only acceptance' (gptq-requantizer output_effect_when), and its self-generated outputs are what draft-vocab-builder counts to choose the draft vocabulary. Both change only pieces used for proposals: under sampling with acceptance using q this is `resampled` (output_principles 3), a level the type does not list.", fix: "Add `resampled` when its results feed a conversion or selection of pieces used only for proposals, and acceptance under sampling uses the proposals; keep `approximate` for results that feed a lossy conversion of what the full model computes."}
  - {part: "paged-block-pool", type: "state-pool", claim: "effect_on_output: exact (in itself), approximate (the pool fixes a quantised stored format)", evidence: "The pool owns 'the free queue (eviction order)' and decides 'order in which freed blocks enter the free queue' (mamba-align-checkpoint-order.patch); that order decides which cached prefix blocks and recurrent snapshots survive, and prefix-cache records that greedy text differs between a hit and a miss (different chunking and rounding). The pool's own choice therefore reaches `rounding`, which the type does not list (output_principles 1 and 4 would put it there).", fix: "Add `rounding` when the order in which it reuses freed pages decides which stored state survives for reuse, and reused state differs in rounding from a fresh read."}
  - {part: "engine-core-loop", type: "engine-supervision", claim: "effect_on_output: exact when it passes requests on unchanged; defines when it rewrites request settings", evidence: "Its one decision is async scheduling (plan step N+1 while step N runs). Under it the verify-length count is ignored and 'async scheduling pads every decode step to the full draft count' (request-scheduler, verify-length-controller), so the width of every verify block changes, and verify-length-controller records that block length changes rounding and greedy text. That is `rounding`, not listed for the type.", fix: "Add `rounding` when preparing the next step while the current one runs fixes the width of steps (for example the number of proposed rows checked) differently from serial planning."}
new_causes:
  - {part: "weight-loader", type: "model-loading", level: "rounding", cause: "re-encoding the stored weights into the form a kernel reads cannot represent every stored value, so a rare value is moved by one quantisation step", evidence: "marlin-int8-negative-scales.patch folds the sign of negative group scales into the int4 codes for the int8-activation kernel; 'numerically identical except that the rare code -8 becomes -7 (one LSB) in flipped groups'. The type's rounding conditions name only a change of floating-point width or a choice among stored encodings."}
  - {part: "request-scheduler", type: "step-scheduler", level: "approximate", cause: "whether a prompt chunk runs alone in a step or shares it with other sequences selects a reduced-precision kernel (not only how many rows the step holds)", evidence: "patches/prefill-attn-int8.patch: the int8-QK prefill kernel 'fires only for single-request prefill chunks (max_seqlen_q > 16, one request in the varlen batch)'; with other requests in the batch the step falls back to FA2. The type's approximate condition names only the number of rows."}
  - {part: "kvarn-staging-quantizer", type: "positional-state-store", level: "approximate", cause: "whether state reused by a later request is still held at the higher staging precision or has been converted to the stored quantised format depends on slot pressure from other sequences", evidence: "kvarn-staging-quantizer keeps finished requests' first blocks in fp16 'until slots run short' and evicts the oldest only when slots run dry; output_effect_when says these retained sinks keep multi-turn reuse closer to unquantised. The type names only 'stored quantised or compressed', not a precision of reused state that depends on concurrent load."}
