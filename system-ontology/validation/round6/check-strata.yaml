  # Notes on counting:
  # - expert-dispatch includes the decision added by strata.corrections.yaml (round4): the conditional default of the tail skip.
  # - http-front includes the decision added by the corrections (round3): who may call (covered by "who is allowed and how").
  # - dflash2-drafter's "skip the draft round when the lookup match is long enough" is counted under draft-policy, per the
  #   corrections (round3); dflash2-drafter keeps 3 decisions, draft-policy has 7.
  # - engine-command-loop: "how many sequences the engine keeps open" is counted under sequence-lifecycle (also type), its
  #   other 5 decisions under step-scheduler. host-memory-admission: all 9 under memory-planning. layer-kernels: all 5 under
  #   layer-compute. kv-store: all 6 under positional-state-store.
  # - engine_specific: model-file-reader (only the first items of a metadata array kept; upper limit on experts per token),
  #   expert-layout (canonical blob byte size), slot-scheduler (engine defaults repeated by hand in the server, no code link),
  #   launch-argument-resolver (card naming by bus order and library search path), draft-verifier (commit grouped into two
  #   plus one launches), layer-kernels (the model's own operation order of a layer and of its attention block, two
  #   decisions), ngram-reader (the model's hash that defines row numbers).
