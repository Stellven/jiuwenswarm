contradictions:
  - {part: "startup-memory-sizing", type: "memory-planning", claim: "effect_on_output: exact (in itself); rounding (what it places where decides which device computes something, or a size it sets changes how the computation is cut)", evidence: "The cache size it sets decides whether the default route tail skip (omitting low-ranked missed experts, an approximation) is on: the skip is off by default when at least 90% of experts are in the GPU cache (src/program/generate.cpp:12785-12817). A different slot count can therefore turn a default approximation on or off, which is the approximate level, not listed.", fix: "add approximate: when a size it sets decides whether a default approximation of another node is in effect, such as omitting low-ranked selected blocks when few enough are cached"}
  - {part: "adaptive-tier", type: "residency-policy", claim: "effect_on_output: exact (in itself); rounding (what is resident decides which device computes a block)", evidence: "With the tail skip on (the CUDA serving default), a missed expert routed only at rank 7 or lower is neither fetched nor computed (expert-dispatch decisions; generate.cpp:12776-12822). What the adaptive tier keeps resident decides which selected experts are missed and hence omitted, so its swaps change which experts the output omits, beyond rounding.", fix: "add approximate: when the dispatch omits low-ranked blocks that are not resident, what it keeps resident decides which are omitted"}
  - {part: "engine-client", type: "engine-supervision", claim: "effect_on_output: exact (it passes requests on unchanged); defines (it rewrites request settings on the way to the engine)", evidence: "On a failed start it starts the engine again with no drafter after an out-of-memory error, or with the MTP drafter when DFlash2 did not start (engine-client decisions). Dropping or swapping the drafter changes the verify window widths, which the inventory records as numeric for this engine (draft-verifier, mtp-drafter, dflash2-drafter output_effect_when), and under STRATA_SPEC_PROB another draw: rounding and resampled, not listed.", fix: "add rounding and resampled: when a start retried with a reduced configuration drops or swaps a setting whose own effect is rounding or another draw, such as speculation or the proposal source"}
new_causes:
  - {part: "native-weight-loader", type: "model-loading", level: "approximate", cause: "by default it selects a lower-precision stored copy of some weights the full model computes with, when the files carry one, instead of the higher-precision copy", evidence: "STRATA_HC_Q8 is on by default on CUDA when the shards carry the hyper-connection projections as Q8_0 (inventory decision; data/settings-register.json:12969); it reads Q8_0 instead of BF16 and changes tokens (docs/STRIX_HALO.md:191, 309: 94 of 250 tokens differ). The listed approximate condition names reduction while loading and the rounding condition names choosing among stored encodings; neither names choosing a lower-precision stored copy."}
  - {part: "engine-command-loop", type: "sequence-lifecycle", level: "approximate", cause: "the number of sequences kept open turns a default approximation of another node off, because that approximation would make one sequence's output depend on another's tokens", evidence: "The route tail skip default requires o.batch == 0 and is off with batch slots (src/program/generate.cpp:12779-12780, 12806); the slot count is this part's decision."}
  - {part: "speed-calibration", type: "calibration", level: "approximate", cause: "its measured choice of residency settings decides which selected blocks a default omission skips", evidence: "The calibration sweeps adaptive-tier settings (speed-calibration decisions) and the tail skip omits missed experts by default (generate.cpp:12776-12822); the listed approximate condition names only lossy conversion and reduced-precision paths."}
relaxations: []
wrong_assignments: []
inventory_errors:
  - {part: "native-weight-loader", field: "output_effect_when", recorded: "bit_exact when a tensor uploaded unchanged; numeric when native head or projections; approximate when a BF16 projection is converted to Q8_0 at load", source_shows: "The default STRATA_HC_Q8 read of the shards' Q8_0 hyper-connection copies changes tokens beyond rounding (docs/STRIX_HALO.md:191-192, 309; data/settings-register.json:12969); it is on by default on CUDA for such files and is not listed as approximate."}
  - {part: "startup-memory-sizing", field: "output_effect_when", recorded: "bit_exact when the sizing only moves where bytes are read from; numeric when the slot count changes which experts the GPU computes", source_shows: "The slot count also decides whether the route tail skip is on by default (off when at least 90% of experts are cached), which changes output beyond rounding (src/program/generate.cpp:12785-12817)."}
  - {part: "engine-command-loop", field: "output_effect_when", recorded: "bit_exact when batch slots off", source_shows: "With batch slots off the tail skip is on by default on CUDA (unless nearly all experts are cached or experts are NVFP4), so the default solo path is not bit_exact; with slots on it is off (src/program/generate.cpp:12776-12822, condition o.batch == 0)."}
  - {part: "adaptive-tier", field: "output_effect", recorded: "none; bit_exact when the GPU and CPU expert kernels round identically", source_shows: "Under the default tail skip, residency decides which low-ranked experts are omitted (src/program/generate.cpp:12776-12822; src/core/expert_source.cpp:4964), so swaps change the output beyond rounding."}
