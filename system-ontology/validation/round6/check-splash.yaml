  loosely:
  - part: weight-image-loader
    type: model-loading
    decision: repack on GPU through a fixed staging buffer
    nearest_choice: staging buffers and reader threads used while loading (nothing names which device does the re-encoding)
  - part: expert-store
    type: expert-cache
    decision: release one chunk, or all to floor under critical pressure
    nearest_choice: which part is released or regrown first under memory pressure (how much is released at each pressure level
      is not named)
  - part: expert-store
    type: expert-cache
    decision: a size used by only one block holds all its experts in its floor
    nearest_choice: whether it arranges, compacts or pins what it holds by size
  - part: ple-row-store
    type: row-source
    decision: prefetch as a hint
    nearest_choice: prefetching rows for coming or drafted tokens (that a prefetch is best-effort and its failed rows are
      dropped is not named)
  - part: composite-state-cache
    type: prefix-reuse
    decision: retire rolling checkpoints once a newer one is published
    nearest_choice: 'what earns stored state its retention: recency, cost to rebuild, or actual reuse'
  - part: write-behind
    type: state-tiering
    decision: minimum depth and delay before copying
    nearest_choice: copying ahead of need
  - part: kv-spill-controller
