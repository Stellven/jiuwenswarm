contradictions:
- part: slot-recycler
  type: residency-policy
  claim: 'state: use counts, the ranking, or the current role of each region (and takes: how often each is used, a ranking
    made offline, or the size of the coming work)'
  evidence: 'The part is adaptive replacement (ARC): it keeps a recently-once list, a recently-again list, two ghost lists
    of evicted keys and an adaptive target share, and takes hits, misses and whether a load is a scan. It keeps no use counts
    (inventory slot-recycler owns_state; runtime/model/SlotRecycler.hpp:11, 67-79, 110-137).'
  fix: 'state: the use history it decides from (use counts, or recency lists with remembered evictions and an adaptive split
    between them), the ranking, or the current role of each region'
- part: option-scoring
  type: scoring
  claim: 'effect_on_output: exact; rounding when the scored sequence is read in steps of another width than generation uses
    (no defines)'
  evidence: 'The part renders its own fixed prompt shape (a fixed system instruction plus one JSON user payload, thinking
    disabled) around the caller''s question and returns a softmax over the option slots only (server/dialects/scoring.py:24-31,
    56-60). The probabilities returned are decided by that prompt by design: the defines level, which the type does not list.'
  fix: 'add effect: defines, when: it renders its own prompt around the given text or options, or normalises the returned
    probabilities over the given options only'
- part: memory-ledger
  type: resource-governing
  claim: 'effect_on_output: exact (the only level listed, with no condition)'
  evidence: 'The ledger''s reclaim order takes, as its own victims, a Resident lane''s KV by converting the lane to Spill,
    the paused prefill command (which reruns later) and units in use (inventory memory-ledger decisions; runtime/engine/MemoryLedger.hpp:79-81,
    146-153). Conversion to Spill bounds the request''s output by the SSD tier''s active-KV quota and ends it there (corrections:
    kv-spill-controller changes_output), and evicting cached states decides whether a later request restores stored state
    or recomputes it, which the type of calibration itself counts as rounding. So by its own choice of victim it reaches rounding
    and defines.'
  fix: exact in itself; rounding when what it reclaims decides whether a sequence's state is later restored or recomputed,
    or abandons work that is rerun with another cut; defines when its reclaim moves a sequence to a slower tier whose capacity
    then ends that sequence's output
new_causes:
- part: request-scheduler
  type: step-scheduler
  level: approximate
  cause: the number of rows it puts in a prompt chunk decides whether the chunk reaches a row threshold measured at startup,
    above which part of each dense block is computed on a second device at lower precision; neither the weights nor the kernel
    tier select it
  evidence: ane-ffn-calibrator picks the least chunk rows; the split runs only for rows >= minimumRows (runtime/ops/AneFfn.cpp:470-474);
    the split computes W8A8 on the Neural Engine (ane-ffn-split, on by default per corrections); request-scheduler sizes contended
    prefill cuts from measured time
- part: lane-admission
  type: sequence-lifecycle
  level: rounding
  cause: a paused sequence that is released and later resumed recomputes its generated history by the prompt-reading path,
    with other kernels and cuts than the decode steps that first produced it
  evidence: 'lane-admission suspends lower-ranked lanes which later replay from cache; runtime/engine/Engine.hpp:701-705:
    generated history that a resumed lane replays is its own; kernel-selector chooses a different tile for prefill rows'
relaxations: []
wrong_assignments: []
inventory_errors:
- part: lane-admission
  field: output_effect
  recorded: none
  source_shows: 'A suspended request resumes by replaying its generated history through prefill (runtime/engine/Engine.hpp:695-707),
    so the continuation is computed from recomputed state with prefill kernels and cuts, not the decode steps'' state: numeric.'
- part: option-scoring
  field: output_effect
  recorded: none
  source_shows: 'server/dialects/scoring.py:24-31, 56-60: it renders a fixed system instruction and JSON payload of its own
    and softmaxes over the option slots, so the returned probabilities are decided here (changes_output).'
- part: memory-ledger
  field: output_effect
  recorded: none
  source_shows: 'runtime/engine/MemoryLedger.hpp:79-81, 146-153: one of its victim kinds is the conversion of a Resident lane
    to Spill, after which the request''s output is bounded by the SSD quota (changes_output for that request).'
