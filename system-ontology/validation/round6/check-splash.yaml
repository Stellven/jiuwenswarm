# Independent check of node types draft 0.6 against the Splash inventory (round6).
# kv-page-pool's decisions are counted once, under state-pool, and judged against the choices of state-pool and
# positional-state-store (its `also` type). engine_specific: target-forward's router weighting and
# block-sparse-indexer's top-block count are fixed by the model, not by whoever builds the engine.
# No relaxation of a `should` rule beyond what the types already state was found: the calibration key covers
# shapes, device, OS, build and allowed units; the persistent SSD cache namespace includes the state layout and
# format (runtime/engine/RuntimeResources.mm:1117, CacheDirectory.hpp:15-17); operator memory sizes are checked
# against the budget and part minimums; the serve record records resolved settings.
