    nearest_choice: the chain of steps and their order
  - part: thinking-budget
    type: output-constraint
    decision: where in the 8 rows the end starts
    nearest_choice: how it applies to proposed tokens that are not yet accepted
  - part: output-parser
    type: output-interpretation
    decision: hold text that may begin a stop string
    nearest_choice: stop conditions and their order (holding partial matches is the type's must rule, not a choice)
