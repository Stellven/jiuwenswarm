  - {part: "model-session", type: "sequence-lifecycle", level: "approximate", cause: "a paused sequence released and replayed has its generated tokens re-read in wide chunks, so its rebuilt state is computed at another activation precision than the decode steps that first produced it", evidence: "pause action 'release and replay' (model-session decisions); chunked-prefill replays committed tokens in chunks; AllowA4 projections use 4-bit activations at 5 or more tokens per step (dispatch.cpp 22-36)"}
