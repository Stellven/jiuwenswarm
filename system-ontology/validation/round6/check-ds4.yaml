contradictions: []
new_causes:
  - {part: "gpu-backend", type: "device-backend", level: "approximate", cause: "the kernel tier selects a reduced-precision path by the amount of stored context the step reads (number of stored compressed rows), not only by step width or device; it is also skipped while the work is being recorded into a graph", evidence: "ds4_cuda.cu 14787-14797: MXFP4 indexer only when n_comp >= 1024 and n_tokens >= 32, one GPU, not --quality, and not during stream capture"}
  - {part: "dspark-scheduler", type: "draft-policy", level: "approximate", cause: "under an acceptance rule that does not preserve the distribution, the decision whether to draft in a round decides whether that round's tokens follow the sampling distribution or the greedy one", evidence: "ds4.c 88383-88384: default (non-exact) acceptance compares the draft with the argmax at any temperature; the scheduler pauses and resumes drafting from acceptance counts (ds4.c 63216-63335)"}
  - {part: "dspark-drafter", type: "draft-proposal", level: "approximate", cause: "under an acceptance rule that does not preserve the distribution, how many tokens are proposed (the confidence stop) decides how many positions are taken greedily instead of sampled", evidence: "inventory draft-verify-commit output_effect_when; ds4.c 88383-88384 argmax comparison in default mode; drafter stops on a confidence threshold"}
  - {part: "tool-call-codec", type: "output-interpretation", level: "defines", cause: "it substitutes remembered generated text for the client's resubmitted version of earlier output when the next prompt is built", evidence: "inventory: LRU map from tool-call id to sampled text, replayed byte-identically into rendering instead of the client's JSON"}
relaxations:
  - {part: "disk-kv-checkpoint-store", type: "prefix-reuse", rule: "Stored state is reused only where the model, the weights' precision, the settings and the prefix match what it was made for.", how: "Besides cross-precision reuse (named), the stored key holds only model id, routed quant bits and context; settings that change the stored state, such as directional steering and the activation-precision mode (--quality), are not keyed, so state made under one is restored under another (ds4_kvstore.h 36-58, ds4_kvstore.c 518-519, 852-858)."}
wrong_assignments: []
inventory_errors:
  - {part: "request-scheduler", field: "output_effect", recorded: "none", source_shows: "ds4_server.c 12431-12439, 12473-12474: the prefill quantum, and so where a prompt is cut into chunks, is 128 tokens while any generation is active and 2048 or more otherwise; chunk boundaries depend on concurrent load, so the effect is at least numeric (and, with the CUDA Q8_1 tier, beyond last bits)."}
  - {part: "cross-gpu-transfer", field: "output_effect", recorded: "none", source_shows: "ds4_gpu_mgpu.h 184-189: ds4_gpu_add_xdev_tensor adds partial results from two GPUs for tensor-parallel reductions, so the sum order differs from one device; numeric."}
  - {part: "tool-call-codec", field: "output_effect", recorded: "none", source_shows: "ds4_server.c 14323-14396: repaired tool-call text replaces the generated text, and a failed parse of a non-streaming request reruns generation with a model-visible error; changes_output."}
  - {part: "dspark-scheduler", field: "output_effect_when", recorded: "Which path advances a token changes summation order only (numeric)", source_shows: "ds4.c 88383-88384: in the default mode a draft is accepted when it equals the argmax at any temperature, so whether a round drafts changes the distribution at temperature above 0; changes_output."}
  - {part: "(missing part)", field: "parts", recorded: "no part for recorded execution graphs", source_shows: "ds4_cuda.cu 1118-1216 (also 9923, 24567): CUDA decode steps are captured as graphs per layer and island key with a warm pass, replayed on later steps, and fall back to eager encoding when capture or replay fails; this is a graph-capture part the inventory omits."}
