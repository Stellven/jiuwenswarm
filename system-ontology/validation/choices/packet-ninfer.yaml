# Written by tools/so_nodetypes_experiments.py packets. Read validation/choices/BRIEF.md first.
engine: ninfer
decisions: 104
parts:
- part: checkpoint-converter
  does: 'Turns a published checkpoint (or several, e.g. a base BF16 checkpoint plus an NVIDIA NVFP4 one) into a .ninfer
    v3 artifact: maps source tensors to logical roles, picks a storage format and encoding method per role, merges and orders
    parent matrices, records per-use activation permits and auxiliary divisors, and writes framed object files plus a conversion
    report.'
  types:
  - model-conversion
  decisions:
  - d: D001
    text: which storage format and encoding method each logical role gets (import encoded, grouped absmax, row/block FP8
      maxabs, stored-scale MSE search for NF4, direct cast)
  - d: D002
    text: which source checkpoint supplies each role when several are given
  - d: D003
    text: how parent matrices are merged and ordered so that history-only computation can borrow a contiguous prefix (K,
      V, index-K first)
  - d: D004
    text: which activation permit (A16Only, AllowA8, AllowA4) each use of a weight carries
  - d: D005
    text: how convolution weights are re-laid out (tap outside, channel contiguous)
  - d: D006
    text: which architecture constants must match before a recipe applies
- part: draft-head-builder
  does: Generates an extra 4-bit (q4_g64) copy of the main output head for draft use only, either over the full vocabulary
    or over a shortlist of the most frequent tokens chosen from an offline token-frequency ranking, storing the shortlist's
    token-ID map.
  types:
  - model-conversion
  decisions:
  - d: D007
    text: full vocabulary or frequency-indexed shortlist, and how many rows
  - d: D008
    text: which special tokens are forced into the shortlist
  - d: D009
    text: which storage format the draft head uses
- part: context-cost-calibrator
  does: Measures device-to-host, host-to-device and device-to-device context copy times and prefill recomputation times
    on the actual machine and model, fits the cost model, accepts or rejects the fit on held-out error and ordering, and
    writes a machine/model cost preset JSON.
  types:
  - calibration
  decisions:
  - d: D010
    text: 'cost model form: max(batch + copies x per-copy, bytes x per-byte) for transfers; chunk, token, attention-pair,
      vision-item and patch terms for recompute'
  - d: D011
    text: acceptance limits on p95 relative error and ordering significance
  - d: D012
    text: how a preset is keyed (hardware class string, prefill signature hash)
- part: expert-priority-table
  does: Supplies, compiled into the binary, a per-layer ranking of all experts from highest to lowest cache priority, derived
    from an offline routing-count calibration over 128 tasks in nine domains, with a geometry check that decides whether
    the table applies.
  types:
  - calibration
  decisions:
  - d: D013
    text: which estimator turned routing counts into ranks
  - d: D014
    text: the geometry (hidden size, layers, experts, top-k) under which the default table applies; otherwise identity order
- part: configuration
  does: Turns the TOML file, command-line options and environment variables into one validated set of startup options (model,
    max concurrency, max context, prefill chunk, KV encoding, speculative backend and draft count, proposal head, CUDA graph
    on/off, context cache sizes and cost presets, vision, sampling defaults, server and logging).
  types:
  - configuration
  decisions:
  - d: D015
    text: which options a model accepts (e.g. Qwen4Exp MTP draft count 1 to 5, chunk a multiple of 128, scoring requires
      one lane)
  - d: D016
    text: defaults per model (prefill chunk 4096 for Qwen4Exp, GLM and offload, else 1024)
- part: model-definition-loader
  does: Opens the artifact's directory and files, checks framing, reads resources (tokenizer, template, PLE hash controls),
    and binds logical parameters with their shapes, uses and activation permits for the selected components into a device-free
    model definition.
  types:
  - model-loading
  decisions:
  - d: D017
    text: which optional components and resources are bound
- part: partition-planner
  does: 'Derives from the global config and bindings how one model is split across ranks: which heads, intermediate columns,
    experts and vocabulary rows each rank holds, what is replicated (router, indexer, embedding, residual mixing), where
    results must be reduced or gathered, and a 64-bit topology identity.'
  types:
  - model-partitioning
  decisions:
  - d: D018
    text: TP only, or TP2 with EP1 (each expert's intermediate halved) or EP2 (whole experts alternate by priority rank)
  - d: D019
    text: which parts are replicated instead of communicated
  - d: D020
    text: how the output head is split (by vocabulary)
  - d: D021
    text: where the PLE table lives (device shards on two Sparks, disk otherwise)
- part: shard-materializer
  does: Reads exactly this rank's encoded rectangles of each parameter from the artifact files through bounded staging and
    builds stable backing on the device, in ordinary host memory, in CUDA-registered host memory, or left as file backing,
    then holds them as the rank's immutable weights.
  types:
  - model-loading
  decisions:
  - d: D022
    text: which location each parent goes to (device, registered host, ordinary host, file)
  - d: D023
    text: how reads are aligned and deduplicated when several destinations share a source
  - d: D024
    text: whether a slice can be expressed value-preservingly, else the format rejects it
- part: startup-memory-planner
  does: Prices fixed weights, workspace, transition records, vision window, communication and allocator metadata per rank,
    measures graph capture growth by capturing, releasing and recapturing, and sizes the shared context backing from what
    remains, keeping planning headroom, a mandatory host reservation and a final whole-instance check apart.
  types:
  - memory-planning
  decisions:
  - d: D025
    text: how much headroom planning may consume versus what must stay free after initialization
  - d: D026
    text: separate device and host accounting on discrete GPUs; one physical budget on shared-memory Spark
  - d: D027
    text: per-rank capacity; never use the sum over machines
  - d: D028
    text: bounded correction of automatic capacity after an over-budget preparation; explicit capacity kept
- part: expert-residency-planner
  does: At startup jointly solves, from the remaining device bytes, the per-layer fixed expert set, the reusable region,
    whether it holds two streaming windows or one, the small-T extra-cache target, the CPU worker count and the CPU/GPU
    split threshold per layer; refuses to run if no solution exists.
  types:
  - memory-planning
  - residency-policy
  decisions:
  - d: D029
    text: balanced per-layer byte share for the fixed region, largest that still leaves each window room for the worst layer's
      missing experts
  - d: D030
    text: two windows first, one window if two do not fit
  - d: D031
    text: CPU workers min(16, cores - 1) unless given
  - d: D032
    text: upload slots at least 3, enough for two largest banks in 96 MiB batches
- part: execution-graphs
  does: Captures at startup one outer CUDA graph per batch size and round type (plain decode, draft plus verify), separate
    decision graphs and commit graphs, and per-context-length-bucket child graphs for the sparse attention layers and draft
    steps; at run time swaps child nodes when the visible length crosses a bucket, toggles the head and draft-readback sections,
    and replays.
  types:
  - graph-capture
  decisions:
  - d: D033
    text: which variants to capture (batch size 1..max concurrency, with or without verify)
  - d: D034
    text: 'context buckets: 128, 512, 2048, 8192, 32768, 131072 below the maximum, plus the maximum'
  - d: D035
    text: which sections are separate so host work (grammar masks, CPU experts, final acceptance) can sit between them
- part: host-expert-store
  does: Holds every main routed expert of the model in host memory registered with CUDA, so the same bytes can be copied
    asynchronously to the GPU and read in place by CPU workers.
  types:
  - expert-source
  decisions:
  - d: D036
    text: which banks are registered for transfer versus kept ordinary
- part: expert-cache
  does: Keeps the device-side index of which experts are published in which slots of the fixed and reusable regions, lets
    consumers acquire and release sets of experts with generation numbers on their stream, and rebuilds a reusable region
    only after its readers have retired.
  types:
  - expert-cache
  decisions:
  - d: D037
    text: bound on concurrently open uses (layers + 8)
- part: expert-uploader
  does: Moves encoded expert bytes from host to device in bounded batches (up to 96 MiB and 4096 copies per batch, a fixed
    number of in-flight upload slots), merging contiguous runs, and in streaming mode fills the other window with the next
    layer's missing experts while the current layer computes.
  types:
  - expert-fetch
  decisions:
  - d: D038
    text: batch size and count per progress call (budget)
  - d: D039
    text: required uploads before prefetch; a new prefetch must not block current-layer data
- part: offload-mode-switch
  does: For each execution decides from its token count whether any layer needs full-layer streaming, switches the reusable
    region between extra-cache layout and window layout, and after returning to small T refills the extra cache in small
    batches.
  types:
  - residency-policy
  decisions:
  - d: D040
    text: streaming needed when T exceeds a layer's threshold
  - d: D041
    text: refill pace (at most 8 MiB, one batch per call)
- part: hybrid-moe-dispatch
  does: Per MoE layer, takes one global top-k routing, splits (token, expert) pairs between GPU and CPU by a mask built
    from a snapshot of ready experts (or streams the whole layer for large T), skips the CPU side when it has no pairs,
    and adds the FP32 partial sums before one rounding to BF16.
  types:
  - expert-dispatch
  decisions:
  - d: D042
    text: GPU subset versus CPU complement per layer from the ready snapshot
  - d: D043
    text: large T versus small T by threshold
- part: cpu-expert-team
  does: A fixed team of pinned CPU threads computes the experts assigned to the CPU directly from encoded host weights,
    grouping (token, expert) pairs per expert, and returns FP32 partial sums; the team is kept polling or put to sleep by
    how many layers used it recently.
  types:
  - secondary-compute
  decisions:
  - d: D044
    text: instruction set variant (AVX2/FMA, AVX-512, AVX-512 BF16; forced by NINFER_MOE_CPU_* switches)
  - d: D045
    text: keep awake when at least 1/4 of layers used CPU, sleep below 1/8
  - d: D046
    text: token block and per-task column limits
- part: ple-row-source
  does: 'Produces the per-layer embedding rows each token needs: hashes the token''s 2- and 3-gram history into 16 row IDs,
    reads those NF4 rows from the model file with io_uring and O_DIRECT through a row cache (merging requests for the same
    page), decodes them to exact BF16 on a CPU worker and uploads them through slots; on two Sparks it looks rows up in
    device shards and merges the words across ranks.'
  types:
  - row-source
  decisions:
  - d: D047
    text: disk path or device-shard path (by deployment)
  - d: D048
    text: row cache size, I/O depth, number of window slots
  - d: D049
    text: prefetch of known input versus required window priority
- part: engine-control-loop
  does: The single control thread that polls execution events, then each cycle settles finished and cancelled requests,
    advances the service turn, admits or restores requests, reserves units, and submits at most one control batch, one decode
    batch and one prefill chunk.
  types:
  - step-scheduler
  decisions:
  - d: D050
    text: 'order within a cycle: control span, then decode, then one prefill chunk'
  - d: D051
    text: when to re-run admission (queue or capacity change, deadline)
  - d: D052
    text: spin-yield while work is outstanding versus 1 ms wait when idle
- part: request-scheduler
  does: 'Decides batch membership and fairness: which lanes join a control or decode round, which lane gets the next prefill
    chunk (round robin), which waiting requests are admission candidates (FIFO with a bounded bypass allowance), who owns
    progress under memory pressure (service turns of 1 to 4 seconds), and which resident request is paused as a victim (the
    youngest).'
  types:
  - step-scheduler
  decisions:
  - d: D053
    text: FIFO bypass allowance equal to the concurrency
  - d: D054
    text: service quantum 1 s, up to 4 s when restore work was expensive
  - d: D055
    text: victim is the youngest resident not owning progress
  - d: D056
    text: decode rounds and prefill chunks are separate executions, not mixed in one batch
- part: model-session
  does: 'Keeps each sequence''s token ledger and main/draft frontiers, turns a request into a complete work demand (reads,
    writes, growth, copy-on-write tails, speculative peak, commit objects), binds sequences to lanes and restore sources,
    and runs generation transactions: plan, submit, decide, commit or discard, pause and resume.'
  types:
  - sequence-lifecycle
  decisions:
  - d: D057
    text: 'pause action per request: keep on device, host snapshot, relocate, or release and replay'
  - d: D058
    text: full permit before verify that covers the later commit peak
- part: executor
  does: Accepts a unit of work into a reserved frame, hands it to the rank program(s), passes host decision inputs (grammar
    masks) into the running ticket, delivers result-ready, commit receipts and device retirement in order, and frees frames
    only when every participating rank's last consumer has retired.
  types:
  - device-backend
  - step-execution
  decisions:
  - d: D059
    text: number of compute and context frames
  - d: D060
    text: local in-process versus distributed workers
- part: rank-program
  does: On each rank, owns the context backing bindings, frames, workspace, fixed I/O buffers and graphs, and carries out
    one unit (prefill chunk, control span, decode round, draft-plus-verify round, commit, context action) by running the
    model's layer sequence, sampling or acceptance, and readback.
  types:
  - step-execution
  decisions:
  - d: D061
    text: graph replay or eager per unit kind
  - d: D062
    text: where host handoffs split device work (grammar mask, CPU experts, final acceptance)
- part: layer-compute
  does: 'Computes the model as written natively per architecture: embedding, four-stream gated residual mixing, GDN or KDA
    linear attention with causal convolution (writing transition records during verify), QSA or Kpool sparse attention with
    compressed index keys and top-K block selection, router, routed and shared experts, PLE, KV append in the chosen encoding,
    final mixing and output head, using kernels that read encoded weights directly.'
  types:
  - layer-compute
  decisions:
  - d: D063
    text: kernel variant per format, geometry, extent and GPU target (sm_120a or sm_121a), chosen by registered shape profiles
  - d: D064
    text: activation precision per use within the permit (A16, A8, A4)
  - d: D065
    text: KV encoding (bf16, int8, fp8, nvfp4, k8v4)
- part: chunked-prefill
  does: Reads a prompt (or replays a paused request's committed tokens) in chunks of a fixed size without graphs, splitting
    media and math segments inside the model, and offers optional full checkpoints at chunk ends or semantic boundaries
    near every 8192 tokens.
  types:
  - prompt-reading
  decisions:
  - d: D066
    text: chunk size (4096 or 1024 by model/path; multiple of 128)
  - d: D067
    text: checkpoint interval and the quarter-interval window for snapping to a semantic boundary
- part: mtp-drafter
  does: Runs the model's built-in MTP layer K times (1 to 5) from the saved conditioning and its own history, taking the
    argmax of the (optionally 4-bit) draft head each step, to propose K tokens.
  types:
  - draft-proposal
  decisions:
  - d: D068
    text: draft count, fixed at startup
  - d: D069
    text: full main head or optimized draft head
- part: block-drafter
  does: An external draft model conditioned on target residual features proposes up to 15 tokens at once with one non-causal
    masked-block attention pass (sliding-window local layers in cyclic KV, full layers in paged history); DFlash2 adds a
    dynamic grouped convolution and a candidate-path selector and keeps its actual proposal distribution q.
  types:
  - draft-proposal
  decisions:
  - d: D070
    text: block width (1 to 15 drafts, fixed at startup)
  - d: D071
    text: full or indexed draft head
- part: sampler
  does: Turns logits into a token per row with per-request temperature, top-k (at most 20 candidates), top-p, min-p and
    presence/frequency penalties, using counter-based random keys of (request seed, logical position, purpose).
  types:
  - sampling
  decisions:
  - d: D072
    text: candidate cap of 20 before top-p/min-p
  - d: D073
    text: tie rule (lower token ID wins)
- part: draft-acceptance
  does: 'Given target logits for K+1 columns and the drafts, licenses a prefix: greedy rows accept the longest match with
    the penalty-adjusted argmax plus one correction or bonus token; sampled rows accept with p(draft) (one-hot drafts) or
    min(1, p/q) (DFlash2) and resample the first rejection from the residual.'
  types:
  - draft-verification
  decisions:
  - d: D074
    text: acceptance rule per draft kind (one-hot or sparse q)
  - d: D075
    text: RNG purposes for accept, correction and bonus
- part: state-commit
  does: 'After the final accepted count m is known, writes every kind of per-sequence state for the committed prefix into
    the destination state record: replays m GDN/KDA transition records from the unchanged start state S0, extracts QSA raw
    index tail and PLE convolution history, scatters conditioning and continuation hidden, rebuilds MTP history from the
    real backbone features when more than one token is accepted, and adds accepted tokens to penalty counts; does nothing
    when m is zero.'
  types:
  - draft-verification
  - recurrent-state-store
  decisions:
  - d: D076
    text: commit by graph replay or eager
  - d: D077
    text: rebuild draft history only when more than one token accepted
- part: output-interpreter
  does: Per request, previews candidate tokens against EOS, stop strings, output budget and cancellation to pick the actually
    adopted prefix, then on commit detokenizes, separates thinking from content, parses tool calls, supplies forced control
    tokens (e.g. template closings) and emits protocol-neutral output events; discards a preview without side effects.
  types:
  - output-interpretation
  decisions:
  - d: D078
    text: reasoning and tool formats per model family
  - d: D079
    text: thinking budget
- part: grammar-constraint
  does: Holds a per-request grammar matcher (JSON schema, tool-call languages, model output framing) on the host, builds
    legal-token bitmasks for the target position and for draft lookahead positions, supplies them to the running ticket,
    and advances only on committed tokens.
  types:
  - output-constraint
  decisions:
  - d: D080
    text: which constraint languages compose for a request
- part: context-pool
  does: One startup-sized byte backing per rank and domain holds every request's paged KV planes and fixed-size state images
    (main, MTP and draft histories alike) in a few record size classes; it places records, tracks real allocatability, and
    compacts blocks by moving records and patching device offset tables.
  types:
  - state-pool
  - positional-state-store
  decisions:
  - d: D081
    text: record size classes and alignment
  - d: D082
    text: when compaction is worth doing
- part: context-directory
  does: Keeps logical identity of states, histories and pages (content version, coverage, references, copy-on-write branching
    of shared tail pages, reservations, address borrows), evaluates a demand jointly across ranks and domains, and runs
    context transactions that copy, map, wait for retirement and then publish.
  types:
  - state-pool
  decisions:
  - d: D083
    text: logical references versus execution borrows
  - d: D084
    text: copy only conflicting tail pages on write
- part: context-transfer
  does: Moves context records between device memory, a pinned host tier (RTX 5090, default 8 GiB plus 8 state images; zero
    on Spark) and peer ranks in bounded chunks on a transfer stream, for demotion, restore, pause snapshots and attention-owner
    changes.
  types:
  - state-tiering
  decisions:
  - d: D085
    text: chunk size and staging per slot
  - d: D086
    text: host tier size (must be zero on shared-memory targets)
- part: context-resource-manager
  does: Indexes reusable prefixes and checkpoints, ranks restore sources for a new or paused request (device, host, other
    rank, or recompute) by modelled transfer plus recompute time, decides which optional checkpoints to save, chooses reclaim
    and demotion victims by loss per freed byte, and for GLM attention data parallelism picks the attention-owner rank.
  types:
  - prefix-reuse
  decisions:
  - d: D087
    text: sort sources by transfer + recompute time, ties by fewer bytes then more reused tokens
  - d: D088
    text: cross-rank copy only when recompute cost was measured and it is cheaper
  - d: D089
    text: 'victims: unwaited before waited, never-reused before reused, then lowest loss per freed byte'
  - d: D090
    text: retention value only from real cross-request adoption
  - d: D091
    text: checkpoint interval 8192 tokens snapped to semantic boundaries
  - d: D092
    text: 'ADP: balanced when peak load at most 1.5 x minimum; among balanced, longest local prefix'
- part: prompt-preparer
  does: 'Turns a protocol-neutral prompt (turns, tools, media references) into a PreparedPrompt: renders the model''s chat
    template, tokenizes with the artifact''s BPE description, lays out media placeholder spans and positions, and produces
    an input identity and candidate restore points for prefix reuse.'
  types:
  - prompt-preparation
  decisions:
  - d: D093
    text: history thinking removal, tool history normalization, template closings
  - d: D094
    text: where restore points may sit (not inside media)
- part: media-preparer
  does: Fetches image and video bytes from files or URLs under size, time, redirect and private-network limits, decodes
    them, runs the model processor (sampling, resize, patch order), and caches preprocessed results by content and processing
    plan with a live-memory budget and single-flight.
  types:
  - media-preparation
  decisions:
  - d: D095
    text: limits (256 MiB bytes, timeouts, video pixels, frames and duration)
  - d: D096
    text: cache capacity and live budget
- part: vision-encoder
  does: Runs the vision tower eagerly on independently encodable media units chosen to fit a separate vision memory window,
    borrowing scratch from the program workspace, and keeps features until the matching text spans have consumed them.
  types:
  - modality-encoding
  decisions:
  - d: D097
    text: which complete units fit the window in one execution
  - d: D098
    text: rank-major split of units across ranks (weights replicated)
- part: http-api
  does: Serves /v1/chat/completions, /v1/responses (with input_tokens, compact, cancel, get, delete), /v1/messages and count_tokens,
    /v1/models, /health and /metrics over HTTP with streaming, validating and translating each protocol into one generation
    request, establishing admission before committing a streaming response, and settling cancellation on client disconnect.
  types:
  - request-front
  decisions:
  - d: D099
    text: which protocol fields are accepted or rejected (e.g. audio history rejected)
  corrections:
  - field: does
    recorded: no mention of caller authorisation
    source_shows: an optional API key is checked as a Bearer or x-api-key header on every route except /health and OPTIONS
      (src/serve/http_server.cpp 164-191, 358-365)
- part: responses-store
  does: Keeps stored Responses objects and their previous_response_id conversation DAG in process memory, bounded by record
    count and bytes with LRU eviction, and flattens a stored context when a continuation is submitted.
  types:
  - request-front
  decisions:
  - d: D100
    text: record and byte limits
- part: rank-launcher
  does: Starts worker processes for other ranks (posix_spawn locally, non-interactive SSH remotely), hands each its rank,
    node, device and environment before CUDA initialization, keeps one persistent control connection per worker for commands
    and results, and runs the worker loop that executes the coordinator's plan.
  types:
  - engine-supervision
  decisions:
  - d: D101
    text: message encoding by fields only (no pointers); no cross-version compatibility
- part: collective-communication
  does: Prepares communication groups and runs the all-reduce, all-gather, reduce-scatter and peer transfers the model's
    partition requires, choosing per collective shape between NCCL and a native backend over InfiniBand verbs with device-visible
    signals (preferred on two-rank Spark).
  types:
  - device-communication
  decisions:
  - d: D102
    text: backend per collective and count range (native or NCCL), agreed by all members before connecting
  - d: D103
    text: policy override (native, NCCL, automatic)
- part: observability
  does: Records request lifecycle (TTFT, queue wait, preemptions), execution samples per unit, GPU stream intervals, host
    work, speculative counters per draft position, resource allocations, expert and PLE upload bytes and per-rank snapshots,
    and exposes them as Prometheus metrics, JSONL and pretty logs, measurement windows and startup progress.
  types:
  - telemetry
  decisions:
  - d: D104
    text: timing on or off; unmeasured is reported as missing, not zero
