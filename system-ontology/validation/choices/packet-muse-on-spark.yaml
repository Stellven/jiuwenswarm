# Written by tools/so_nodetypes_experiments.py packets. Read validation/choices/BRIEF.md first.
engine: muse-on-spark
decisions: 24
parts:
- part: model-file-reader
  does: Open the prepared files read-only, expose their metadata and tensor directory unchanged, and refuse files whose
    declared shape the compiled kernels cannot run.
  types:
  - model-loading
  decisions:
  - d: D001
    decision: model-file-reader/required-geometry
    text_sha256: b6e0ca64a7e45844de03930515cfe9f3d8532f1f2fbd198788b97f1411a686bd
    text: The layer count, experts per layer, experts per token and hidden size the kernels are compiled for.
- part: expert-layout
  does: Read the table of expert ranges once and answer, for the whole process, where each expert's bytes lie in the prepared
    file and how long they are.
  types:
  - model-loading
  decisions:
  - d: D002
    decision: expert-layout/layout-version
    text_sha256: 6efeba744e71401cda50877e1c536d0c202bc386d9cfc958d0b25e860f25399f
    text: The version of the range table this engine accepts.
- part: weight-loader
  does: At startup, place the weights every token uses in fast memory and return a table from tensor name to location.
  types:
  - model-loading
  decisions:
  - d: D003
    decision: weight-loader/head-precision
    text_sha256: 6dfeb802057747b3503acf4e639c6705e301d4b5d6fc91c8bfae2d4d7b4532fe
    text: 'Whether the embedding table and output head are kept at 4 or 16 bits. For each of the two tables this moves about
      2.5 GB between these weights and the expert cache: 202,048 rows of 8,192 values, 12 bits more per value.'
- part: startup-memory-sizing
  does: Within the memory budget, price the weights every token uses, the attention state for the configured context, the
    staging area and a reserve; give the expert cache what remains; and refuse to start when the cache would be below its
    minimum.
  types:
  - memory-planning
  decisions:
  - d: D004
    decision: startup-memory-sizing/memory-budget
    text_sha256: 9984480d0028c07144fa045157167ebfde5ce7f0dfb9b505bc7396d34e1a794e
    text: The total the engine may hold in the unified pool. Fixed by the request.
  - d: D005
    decision: startup-memory-sizing/reserve
    text_sha256: b1692a49951678ec7b6a5a562f0a2fcf2e66fce121614bd718c1760bb54c3b4f
    text: Memory left free for the operating system and for allocations not priced in advance.
  - d: D006
    decision: startup-memory-sizing/context-length
    text_sha256: b2bfac65280c00a2ea8844b0fa1221cd2512ce9e18ca8180e364c76d7536ad4f
    text: The longest context the engine offers. With the attention state's size per token it sets how much memory the cache
      loses.
  - d: D007
    decision: startup-memory-sizing/min-cache
    text_sha256: 227ef38f4f19170ab6d52e43f7b1c84929673ddde15b3cfda5561a3e12080410
    text: 'The smallest cache the engine will start with: at least the experts one step can route, 8 times 62.'
  - d: D008
    decision: startup-memory-sizing/reserve-recheck
    text_sha256: 033068b567b5d5b074a52232c1ab7506d28131b4b4a3a5128de08c87e18764ae
    text: After allocating, read free memory again and shrink the cache if the reserve was not really left.
- part: expert-source
  does: For any expert, give the range of the prepared file that holds it, and deliver its bytes into a buffer it is handed.
  types:
  - expert-source
  decisions:
  - d: D009
    decision: expert-source/read-mode
    text_sha256: 9f4a741024f2378ef5e420bf3ccd48abd7cde88cbe09d3eaac59d8eb8282ec20
    text: Whether reads bypass the operating system's page cache. Bypassing keeps the page cache from taking memory the
      budget does not count.
  - d: D010
    decision: expert-source/read-concurrency
    text_sha256: 61b8ed93d2de1a8c5b20716a47a66ae176ab25ed035e074248b96b096a852683
    text: How many expert reads may be in flight at once.
- part: expert-cache
  does: Hold as many experts in fast memory as its budget allows and answer, for any expert, whether it is there and in
    which slot.
  types:
  - expert-cache
  decisions:
  - d: D011
    decision: expert-cache/slot-count
    text_sha256: 4a51480fae56af2f4e0fb7c92dd246ff96ff8733a5fb7e66f6bbe0d29d46b4eb
    text: How many slots the cache has. Decided at startup from the memory budget; see startup memory sizing.
- part: expert-dispatch
  does: For one layer of one step, decide for every routed expert whether it is computed from the cache at once or after
    a read from storage, and issue the reads before the cached experts start computing.
  types:
  - expert-dispatch
  - layer-compute
  decisions:
  - d: D012
    decision: expert-dispatch/wait-or-stage
    text_sha256: 29c2d8f1d25197cbb675ff166bde2b1c0b81abceaf1db05575352bdae3c8bd99
    text: Whether a missed expert is computed from the staging area and then dropped, or is computed after the cache policy
      has admitted it to the cache.
- part: cache-policy
  does: Decide, for an expert that has just been read from storage, whether it enters the cache and which resident expert
    leaves, so that the cache holds the experts the current work uses most.
  types:
  - residency-policy
  decisions:
  - d: D013
    decision: cache-policy/admit-rule
    text_sha256: dd67f3b45426f12dfb1bd12ea5741d5e0e5bdd3f243206ba08a484d31c7f4d42
    text: 'The condition under which a missed expert enters the cache: always, or only when its usage count exceeds that
      of the least used resident expert of the layer.'
  - d: D014
    decision: cache-policy/decay
    text_sha256: 6fac3e75e1ea8c5109984e089c4a035badccae7da809e247d18a333487c1dfb7
    text: How fast usage counts fade.
  - d: D015
    decision: cache-policy/per-layer-share
    text_sha256: e436fc8109c8988e345130202fae9cfc6d935600e586924027d8a20c8dd7c165
    text: Whether every layer has the same number of slots or slots move to the layers with the most misses.
  - d: D016
    decision: cache-policy/starting-contents
    text_sha256: ad523f48fbbd031a282b3c92c649b42492bf57e729adaa5a0c493b0ede8ea685
    text: 'What the cache holds before any request: nothing, or the experts a recorded usage profile ranks highest.'
- part: prompt-path
  does: Read the prompt in chunks, one layer at a time, reading each routed expert that is not cached once per chunk, and
    leave behind the attention state that generation continues from.
  types:
  - prompt-reading
  decisions:
  - d: D017
    decision: prompt-path/chunk-size
    text_sha256: d675a72c703b42e3358ba457acb42de70acfaa9291909d8fd7f4a050353a44ba
    text: Tokens per chunk. Larger chunks amortise each expert read over more tokens but need more experts in memory at
      once.
  - d: D018
    decision: prompt-path/borrow-cache
    text_sha256: 11ab6682e29b7bd560d59b56152b0fe4de9d53bb9c4b6eacaef2e1f29a7cd697
    text: Whether the prompt path may use cache slots for a layer's experts while it reads, and whether it restores the
      cache afterwards.
  - d: D019
    decision: prompt-path/feeds-usage
    text_sha256: 02b994f6e084f3dd7e99e753158e35fa0c6fcf8fad99448baa579c74be6a446c
    text: Whether the experts a prompt routes count toward the usage that decides the cache's contents for generation.
- part: decode-loop
  does: Take one token through the 62 layers and the output head, at each layer handing the routing to the expert subsystem
    and waiting until every routed expert has been computed.
  types:
  - step-execution
  decisions:
  - d: D020
    decision: decode-loop/tokens-per-step
    text_sha256: 1b531c2d4b99bbadbf3b8d0a6109498f836b2e7ec2fc5f54f71f334dc1d5880f
    text: 'How many tokens are computed in one step: one in the first version.'
  - d: D021
    decision: decode-loop/layer-timeout
    text_sha256: ad9b3a40716364008ca90b0cafdfdce4832d53db68a9ca9e5e16f65d5afdf437
    text: How long a layer may wait for storage before the step is reported as failed.
- part: prompt-builder
  does: Produce the exact prompt token ids and the token limit for a request from its messages, or refuse the request.
  types:
  - prompt-preparation
  decisions:
  - d: D022
    decision: prompt-builder/tokenizer-implementation
    text_sha256: b5b9a9b92e263782e005d7689f3cab9292494c7b07f2eb20f386c72455bb60ff
    text: The tokenizer used; it must reproduce the reference tokenizer exactly.
  - d: D023
    decision: prompt-builder/chat-template
    text_sha256: 1c3524b710e2696cc37a42db7b4e8be0166345f1048d19678e3015cc145f3fbe
    text: The template that turns messages into one prompt.
  - d: D024
    decision: prompt-builder/fit-max-tokens
    text_sha256: 3b07d9c70e4eee07e723d75aee5975cd096e1bddfba43bcc189a3f7357f1f17d
    text: 'What happens when prompt plus requested output exceed the configured context: refuse, or shorten the output limit.'
