# Written by tools/so_nodetypes_experiments.py packets. Read validation/choices/BRIEF.md first.
engine: llama-cpp
decisions: 121
parts:
- part: checkpoint-converter
  does: Turns a training-framework checkpoint (Hugging Face safetensors, PyTorch) into one GGUF file of renamed, reshaped
    and optionally down-cast tensors plus key-value metadata (architecture, hyperparameters, tokenizer, chat template).
  types:
  - model-conversion
  decisions:
  - d: D001
    text: which model class handles a given checkpoint architecture
  - d: D002
    text: how tensors are renamed, split, merged or permuted for the runtime's kernels
  - d: D003
    text: which tokenizer type and pre-tokenizer hash to record
  - d: D004
    text: output data type and whether to split into shards
  - d: D005
    text: whether to export MTP heads or a reduced draft vocabulary map
- part: importance-calibrator
  does: Runs the model over calibration text and accumulates, per weight matrix column, the squared activations that reach
    it, saving them as an importance matrix.
  types:
  - calibration
  decisions:
  - d: D006
    text: which text to calibrate on
  - d: D007
    text: how many chunks and context length to use
- part: weight-quantizer
  does: Rewrites a GGUF model with each tensor converted to a block-quantized type chosen per tensor from the requested
    file type, layer position, tensor role and whether an importance matrix is present.
  types:
  - model-conversion
  decisions:
  - d: D008
    text: type per tensor by role (attention V, FFN down, output, embeddings) and depth
  - d: D009
    text: fallback type when a tensor's row length does not fit the block size
  - d: D010
    text: whether a type requires an importance matrix
- part: backend-registry
  does: Discovers the available compute devices (CPU, CUDA, HIP, Metal, Vulkan, SYCL, OpenCL, CANN, RPC and others), loading
    backend libraries dynamically and choosing the best build for the host CPU.
  types:
  - configuration
  decisions:
  - d: D011
    text: which backend variant to load (CPU feature level scoring)
  - d: D012
    text: which devices are allowed
- part: model-file-reader
  does: Parses GGUF metadata into hyperparameters and vocabulary, validates tensor bounds, and brings tensor bytes from
    disk into their assigned buffers by memory map, plain read, direct I/O or locked pages, across split files.
  types:
  - model-loading
  decisions:
  - d: D013
    text: mmap vs read vs direct I/O vs mlock
  - d: D014
    text: which byte ranges to prefetch and which to leave unfaulted (lazy ranges)
  - d: D015
    text: whether to release mmap pages of tensors that were copied to a device
- part: memory-fit-planner
  does: Loads the model and context in a no-allocation dry run to measure memory per device, then adjusts unset parameters
    (layers on GPU, tensor split, which MoE weights stay on the host, context size) until the projection fits free device
    memory minus margins.
  types:
  - memory-planning
  decisions:
  - d: D016
    text: which parameter to give up first (context size, layers, MoE experts to host)
  - d: D017
    text: only parameters left at their defaults are changed
  - d: D018
    text: how to account for a draft or MTP model sharing the devices
- part: weight-placer
  does: 'Assigns every weight tensor to a device and buffer type: whole layers to devices in proportion to free memory or
    a given split, input embedding on the CPU, pattern overrides (for example MoE experts to host), CPU repacked layouts,
    row-split buffers, and checks the device can run the ops that read it.'
  types:
  - model-loading
  - model-partitioning
  decisions:
  - d: D019
    text: how many layers go to accelerators and where the split points fall
  - d: D020
    text: which buffer type to prefer per tensor (repacked CPU, host-pinned, device, row-split)
  - d: D021
    text: keep input embeddings on the CPU
  - d: D022
    text: which tensors match override patterns
  - d: D023
    text: where generated helper tensors (Hadamard rotations) live
- part: lazy-table-reader
  does: Keeps very large lookup tables (per-layer embeddings, Engram n-gram tables) in the memory map and reads only the
    rows a batch needs, letting the OS page them in on demand.
  types:
  - row-source
  decisions:
  - d: D024
    text: OFF, AUTO (only marked tensors larger than 4 GiB) or ON
  - d: D025
    text: which tensors an architecture marks as lazy
- part: moe-expert-cache
  does: Keeps the most recently and frequently used experts of host-resident MoE layers in device slots, maps each selected
    expert to a slot per small batch, uploads misses, and optionally leaves a share of misses to be computed on the CPU.
  types:
  - expert-cache
  - residency-policy
  - expert-dispatch
  decisions:
  - d: D026
    text: budget split among GPUs and among layer groups
  - d: D027
    text: victim choice by age scaled by frequency class
  - d: D028
    text: which misses go to the CPU (lowest score) and how many
  - d: D029
    text: batch size threshold above which the cache is not used for lookups
- part: host-expert-streamer
  does: When a split on the GPU reads expert weights from host memory, uploads only the experts the batch actually selected,
    grouped into contiguous runs, copying cached ones device-to-device.
  types:
  - expert-fetch
  decisions:
  - d: D030
    text: group consecutive used experts into one transfer
  - d: D031
    text: pad the last expert so device kernels read no garbage
- part: tensor-split-device
  does: Presents several GPUs as one device whose buffers hold slices of each weight and KV tensor, and runs every op on
    all slices with cross-GPU reductions (NCCL/RCCL when built).
  types:
  - model-partitioning
  - device-communication
  decisions:
  - d: D032
    text: which axis each tensor splits on
  - d: D033
    text: proportions per GPU
- part: remote-device-rpc
  does: Exposes devices of other machines as local backend devices over TCP, forwarding buffer allocation, tensor transfers
    and graph compute, with an optional server-side cache of large tensors keyed by hash.
  types:
  - device-communication
  - device-backend
  decisions:
  - d: D034
    text: which tensors to send by hash instead of by value
  - d: D035
    text: transport
- part: compute-memory-planner
  does: Builds worst-case prompt and single-token graphs against a simulated full cache and reserves compute buffers on
    each backend so that later steps never allocate, reusing activation memory across graph nodes.
  types:
  - memory-planning
  decisions:
  - d: D036
    text: which shapes count as worst case (n_seqs 1 vs many for some recurrent inputs)
  - d: D037
    text: whether pipeline parallel copies are kept
- part: adapter-overlay
  does: Applies low-rank adapters (with per-request scales, including activated LoRA that starts at an invocation token)
    and control vectors on top of base weights inside the graph.
  types:
  - model-edit
  decisions:
  - d: D038
    text: which adapters are active
  - d: D039
    text: scale per adapter
- part: tokenizer
  does: Converts text to token ids and back with the model's tokenizer type (SPM, BPE, WordPiece, Unigram, RWKV, PLaMo)
    and pre-tokenizer rules, and classifies special and end-of-generation tokens.
  types:
  - prompt-preparation
  - output-interpretation
  decisions:
  - d: D040
    text: whether to add BOS/EOS
  - d: D041
    text: whether to parse special tokens in the input
- part: chat-template-renderer
  does: Renders a chat message list, tools and options into the prompt text with the model's Jinja template, and derives
    the grammar, lazy triggers and preserved tokens needed to constrain tool-call output.
  types:
  - prompt-preparation
  - output-constraint
  decisions:
  - d: D042
    text: which format family a template belongs to
  - d: D043
    text: whether tool calls get a lazy grammar
- part: output-message-parser
  does: Parses generated text, incrementally while streaming, into reasoning content, visible content and tool calls per
    model format.
  types:
  - output-interpretation
  decisions:
  - d: D044
    text: format-specific parser
  - d: D045
    text: how to treat partial output
- part: multimodal-encoder
  does: Decodes and preprocesses images, audio and video frames, splits them into chunks with model-specific marker tokens
    and positions, runs the vision or audio encoder and projector, and returns embedding rows for the language model.
  types:
  - modality-encoding
  - media-preparation
  decisions:
  - d: D046
    text: tiling or slicing of large images
  - d: D047
    text: merging consecutive video frames
  - d: D048
    text: image token budget
- part: speech-output-generator
  does: Turns generated semantic tokens and hidden states into audio codes and then a waveform through extra stage models
    (code predictor, codec decoder), including a streaming realtime path.
  types: []
  decisions:
  - d: D049
    text: stage pipeline per model
- part: batch-splitter
  does: 'Validates a batch (positions, sequence ids, outputs), fills defaults, and cuts it into micro-batches shaped for
    the memory type: simple splits, equal-length sequence sets, or one sequence set per micro-batch.'
  types:
  - step-execution
  decisions:
  - d: D050
    text: which split strategy the memory asks for
  - d: D051
    text: how many trailing tokens of a sequence must stay together
- part: kv-cache
  does: Stores keys and values per layer in a fixed pool of cells, each tagged with a position and a set of sequence ids,
    finds cells for each micro-batch, writes new K/V by index, and supports remove, copy (shared cells), keep, shift and
    divide of positions per sequence.
  types:
  - positional-state-store
  - state-pool
  decisions:
  - d: D052
    text: K/V data types and whether to rotate before quantizing
  - d: D053
    text: one shared stream for all sequences or one stream per sequence
  - d: D054
    text: contiguous vs scattered cell placement
  - d: D055
    text: whether position shifting (RoPE re-rotation) is allowed
  - d: D056
    text: full-size or window-size cache for sliding-window layers
- part: sparse-attention-cache
  does: Holds the extra per-token state that sparse or compressed attention needs (indexer keys for top-k token selection,
    compressed KV rows and scores, raw-window token history for Engram n-gram hashing), kept in lockstep with the main KV
    cells.
  types:
  - positional-state-store
  decisions:
  - d: D057
    text: compression ratio and overlap per layer
  - d: D058
    text: mirror the main cache layout instead of searching its own cells
- part: recurrent-state-store
  does: Holds one fixed-size recurrent state (convolution and SSM/RWKV states) per sequence, plus a configurable number
    of earlier snapshots so the last few tokens can be rolled back.
  types:
  - recurrent-state-store
  decisions:
  - d: D059
    text: number of rollback snapshots
  - d: D060
    text: state data types
- part: memory-composer
  does: Chooses the per-sequence memory for an architecture (none, KV, iSWA pair, sparse-index KV, recurrent, or a hybrid
    that routes each layer to an attention or recurrent store) and presents it to the context through one interface.
  types: []
  decisions:
  - d: D061
    text: memory type per architecture
  - d: D062
    text: layer filter and layer reuse/sharing callbacks
  - d: D063
    text: separate memory shape for an MTP draft context
- part: decode-driver
  does: 'Runs one logical batch: applies pending cache shifts, gets a memory context for the micro-batches, reuses or rebuilds
    the graph per micro-batch, sets inputs, computes, copies logits, embeddings and sampled tokens out, and restores the
    caller''s output order.'
  types:
  - step-execution
  - graph-capture
  decisions:
  - d: D064
    text: whether the previous graph topology can be reused
  - d: D065
    text: retry once after optimizing the cache when no slot is found
  - d: D066
    text: all tokens output for embeddings and non-causal models
- part: graph-builder
  does: Builds the per-micro-batch computation graph of the architecture from shared primitives (embedding, RoPE, attention
    over the cache, FFN, MoE routing, recurrent scans, pooling, output head) as tensor operations.
  types:
  - layer-compute
  decisions:
  - d: D067
    text: which fused ops to use
  - d: D068
    text: flash attention or not
  - d: D069
    text: sliced attention per sequence (kv rows)
- part: backend-scheduler
  does: Assigns each graph node to a backend (following where weights live, offloading host-weight ops to an accelerator
    for big batches), splits the graph into per-backend pieces, copies inputs between backends, and runs the pieces with
    events, prefetch and multiple input copies for pipelining.
  types:
  - device-backend
  - secondary-compute
  - model-partitioning
  decisions:
  - d: D070
    text: op offload of host-weight ops
  - d: D071
    text: pipeline parallel copies
  - d: D072
    text: prefetch next split inputs to host
- part: op-kernels
  does: Executes tensor operations on each device, including quantized matmuls, flash attention and fused ops; the CPU backend
    runs a thread pool and the CUDA backend captures and replays graphs.
  types:
  - device-backend
  - layer-compute
  - graph-capture
  decisions:
  - d: D073
    text: kernel per op, type and shape
  - d: D074
    text: whether a graph can be captured or must be re-captured
- part: hidden-state-bridge
  does: Hands hidden-state rows of the target context (selected layer inputs, pre-head states) to a draft context on the
    device, ordering writer and reader with backend events instead of host copies.
  types: []
  decisions:
  - d: D075
    text: device or host extraction
  - d: D076
    text: which layers' inputs to keep
- part: sampler-chain
  does: Turns a logits row into one token by a configured chain (penalties, DRY, top-k, top-p, min-p, typical, XTC, temperature,
    mirostat, adaptive-p, logit bias, then a random or greedy pick) and records accepted tokens for history-based samplers.
  types:
  - sampling
  decisions:
  - d: D077
    text: sampler order
  - d: D078
    text: apply grammar before the chain or only check the chosen token and resample
- part: backend-sampler
  does: Appends supported samplers to the model graph so top-k, temperature, softmax and the random draw run on the device
    and only candidates or the chosen token come back to the host.
  types:
  - sampling
  decisions:
  - d: D079
    text: which samplers can run on the backend
  - d: D080
    text: outputs per sequence limit
- part: grammar-constraint
  does: Tracks a pushdown automaton over the GBNF grammar and masks every candidate token whose text cannot continue a valid
    parse; lazy grammars stay inactive until a trigger word, token or pattern appears.
  types:
  - output-constraint
  decisions:
  - d: D081
    text: lazy vs always active
  - d: D082
    text: trigger words, tokens and patterns
  - d: D083
    text: native engine vs llguidance
- part: reasoning-budget
  does: Counts tokens inside a thinking block and, when the budget runs out, waits for a UTF-8 boundary and then forces
    the closing sequence token by token.
  types:
  - output-constraint
  - output-interpretation
  decisions:
  - d: D084
    text: budget size
  - d: D085
    text: which sequences start and end reasoning
- part: drafter
  does: 'Proposes up to n draft tokens per generating sequence from one or more configured methods: a separate draft model,
    a target-conditioned draft (EAGLE-3, block-diffusion DFlash family, MTP heads), or n-gram lookups over history or a
    shared hash pool.'
  types:
  - draft-proposal
  decisions:
  - d: D086
    text: which method, and precedence of draftless over draft-model methods
  - d: D087
    text: draft length limits and truncation at low confidence (p-min)
  - d: D088
    text: greedy or probabilistic drafting
  - d: D089
    text: whether a reduced draft vocabulary maps back via a table
- part: draft-verifier
  does: Samples the target at each draft position of the verification batch and accepts the longest matching prefix, or
    accepts each draft token with probability min(1, p/q) and draws a replacement from the residual, always emitting one
    more target token.
  types:
  - draft-verification
  decisions:
  - d: D090
    text: exact match vs rejection sampling
  - d: D091
    text: synthetic acceptance for benchmarking replaces verification
- part: draft-rollback
  does: Removes the positions of rejected draft tokens from the target and draft memories, or, for memories that cannot
    drop a tail (recurrent beyond its snapshots), saves a state checkpoint before verification and restores it then replays
    the accepted tokens.
  types:
  - draft-verification
  decisions:
  - d: D092
    text: tail removal vs checkpoint restore, by memory kind and draft length vs snapshot depth
- part: http-front
  does: Accepts HTTP requests (completions, OpenAI and Anthropic compatible chat, embeddings, rerank, infill, tokenize,
    decisions, tools, slots, metrics), parses JSON into tasks in worker threads, and formats results or streams them as
    server-sent events.
  types:
  - request-front
  decisions:
  - d: D093
    text: API compatibility mapping
  - d: D094
    text: which endpoints answer from cache while sleeping
- part: task-queue
  does: Moves tasks from HTTP threads to the single inference thread and results back, defers tasks that cannot start, lets
    metrics tasks run while a decode is in flight, and puts the server to sleep after an idle timeout.
  types:
  - engine-supervision
  - sequence-lifecycle
  decisions:
  - d: D095
    text: defer vs start
  - d: D096
    text: idle timeout for sleep
  - d: D097
    text: which tasks run while yielding
- part: slot-scheduler
  does: 'Picks which slot a new task goes to: the requested slot, else the idle slot whose cached prompt shares the longest
    prefix above a similarity threshold, else an empty or least recently used slot, and says whether to swap prompt states
    through the prompt cache.'
  types:
  - sequence-lifecycle
  - prefix-reuse
  decisions:
  - d: D098
    text: prompt similarity threshold
  - d: D099
    text: empty first, then least recently used
- part: request-slot
  does: 'Carries one request through prompt processing and generation on its own sequence id: tracks tokens in memory, the
    sampler, stop strings, limits (tokens, time, indentation, context), partial UTF-8, and emits partial and final results.'
  types:
  - sequence-lifecycle
  - output-interpretation
  decisions:
  - d: D100
    text: stop condition checks
  - d: D101
    text: hold back text that may be the start of a stop string
  - d: D102
    text: parent and child slots for n>1 completions sharing a prompt
- part: continuous-batcher
  does: 'Each iteration builds one shared batch: applies context shift, asks the drafter for drafts, adds each generating
    slot''s last token plus draft, then fills remaining room with prompt chunks of compatible slots, decodes in chunks of
    the logical batch size, and hands outputs to sampling and verification.'
  types:
  - step-scheduler
  - prefix-reuse
  decisions:
  - d: D103
    text: generation tokens first, then prompt chunks up to the batch size
  - d: D104
    text: only slots with the same adapter configuration share a batch
  - d: D105
    text: 'context shift: how many tokens to keep and discard'
  - d: D106
    text: on 'no room' free idle slots' cache or halve the batch and retry
  - d: D107
    text: how many prompt tokens can be skipped (common prefix, chunk reuse by shifting)
- part: prompt-cache
  does: Keeps serialized sequence states of earlier prompts (target and draft) in host RAM, plus snapshots taken at points
    within a prompt for SWA and recurrent models, and restores the best match so a new request processes only the new suffix.
  types:
  - prefix-reuse
  - state-tiering
  decisions:
  - d: D108
    text: size and token limits and oldest-first eviction
  - d: D109
    text: which checkpoint is usable for a given prefix and window
  - d: D110
    text: minimum spacing between checkpoints
- part: state-persistence
  does: Serializes and restores the whole context or one sequence (memory cells and data, optionally only the partial-rollback
    part) to buffers or files, with slot checkpoints appended to slot files.
  types:
  - session-persistence
  decisions:
  - d: D111
    text: full vs partial-only flags
  - d: D112
    text: whether file save is enabled (off by default for security)
- part: stream-replay-buffer
  does: Keeps the SSE bytes of a generation tagged with a conversation id in a bounded ring buffer so a client can reattach
    after a disconnect, while generation continues.
  types:
  - request-front
  decisions:
  - d: D113
    text: ring cap, TTL, GC interval
- part: model-router
  does: Routes requests to child server processes by model name, starting and stopping children on demand, limiting how
    many run, and unloading instances by measured device memory.
  types:
  - replica-routing
  - engine-supervision
  decisions:
  - d: D114
    text: which instance to unload
  - d: D115
    text: maximum instances
  - d: D116
    text: memory margin
- part: decision-scorer
  does: Answers typed questions (choice, score, yes/no) about a given state by rendering each question, sometimes in several
    option orders, and reading the option-label logits of one forward pass, with no token generated.
  types:
  - scoring
  decisions:
  - d: D117
    text: number of order variants
  - d: D118
    text: joint vs per-question prompts
  - d: D119
    text: shared prefix grouping
- part: telemetry
  does: Collects timing and token counters per context and per sampler, speculative acceptance statistics, MoE cache statistics,
    server Prometheus metrics, memory breakdowns, and logs through an asynchronous log thread.
  types:
  - telemetry
  decisions:
  - d: D120
    text: log verbosity
  - d: D121
    text: whether eval callback forces per-node synchronization
candidates:
  model-conversion:
  - id: model-conversion#01
    kind: format
    what: file layout, alignment and ordering of weights
  - id: model-conversion#02
    kind: format
    what: precision per kind of weight
  - id: model-conversion#03
    kind: policy
    what: which derived pieces are built (draft head, shortlist vocabulary, extra copies)
  - id: model-conversion#04
    kind: policy
    what: whether conversion is one step or resumable stages
  - id: model-conversion#05
    kind: failure
    what: what happens to a conversion that is interrupted or does not match its source
  - id: model-conversion#06
    kind: precedence
    what: which source wins when several checkpoints supply the same tensor
  - id: model-conversion#07
    kind: sizing
    what: 'memory used while converting: whole files or piece by piece'
  - id: model-conversion#08
    kind: policy
    what: the data a derived piece is selected or fitted from, and what is eligible for it
  - id: model-conversion#09
    kind: format
    what: which reduced activation precisions each weight permits at run time, recorded with the weight
  - id: model-conversion#10
    kind: policy
    what: which revision of the published sources is used, and whether it is pinned
  - id: model-conversion#11
    kind: sizing
    what: the size of a derived piece
  - id: model-conversion#12
    kind: policy
    what: 'how a derived template is corrected: which inputs it accepts and what each maps to'
  - id: model-conversion#13
    kind: policy
    what: which optional parts of the published model are included
  - id: model-conversion#14
    kind: policy
    what: precision per layer as well as per kind of weight
  - id: model-conversion#15
    kind: format
    what: whether a tensor's stored shape is padded for the kernels
  - id: model-conversion#16
    kind: timing
    what: the order of writes, and which write marks the conversion complete
  - id: model-conversion#17
    kind: policy
    what: which source formats and architecture constants a recipe accepts
  - id: model-conversion#18
    kind: policy
    what: which separately trained pieces are paired with which model
  - id: model-conversion#19
    kind: policy
    what: whether files are rewritten in place, and how the originals are kept
  calibration:
  - id: calibration#01
    kind: policy
    what: what is measured and on which prompts
  - id: calibration#02
    kind: policy
    what: the rule that accepts or rejects a measured result
  - id: calibration#03
    kind: timing
    what: offline, at install, or at every start
  - id: calibration#04
    kind: precedence
    what: when a recorded result is trusted over a default or an operator setting
  - id: calibration#05
    kind: failure
    what: what is used when no valid record exists
  - id: calibration#06
    kind: threshold
    what: when a stored record is considered stale
  - id: calibration#07
    kind: sizing
    what: time budget of a measurement run
  - id: calibration#08
    kind: policy
    what: which settings a measurement may choose on its own, by their effect on output
  - id: calibration#09
    kind: policy
    what: the key that states which model, machine and build a result is valid for
  - id: calibration#10
    kind: policy
    what: how measured counts are turned into a ranking
  - id: calibration#11
    kind: policy
    what: the form of the model fitted to the measurements
  - id: calibration#12
    kind: policy
    what: whether a negative result is recorded and reused
  - id: calibration#13
    kind: sizing
    what: how much data a measurement collects
  - id: calibration#14
    kind: threshold
    what: the noise tolerated when a result is accepted
  - id: calibration#15
    kind: policy
    what: which capacities or settings a profile simulates
  - id: calibration#16
    kind: policy
    what: whether a measurement runs the serving path or a slower instrumented path that exposes internal values
  - id: calibration#17
    kind: threshold
    what: the least gain a measured result must predict before the setting it supports is turned on
  configuration:
  - id: configuration#01
    kind: precedence
    what: operator values, presets, measured values and defaults
  - id: configuration#02
    kind: policy
    what: which combinations are refused
  - id: configuration#03
    kind: policy
    what: whether an operator value is a hard limit or a target
  - id: configuration#04
    kind: policy
    what: which settings are fixed per machine class
  - id: configuration#05
    kind: policy
    what: rules that derive a setting's default from other settings and machine facts
  - id: configuration#06
    kind: policy
    what: whether and where the resolved settings are recorded
  - id: configuration#07
    kind: policy
    what: which settings that change output are on by default, and in which profile
  - id: configuration#08
    kind: failure
    what: what is assumed when a fact about the machine cannot be read
  - id: configuration#09
    kind: policy
    what: named profiles and what each fixes
  - id: configuration#10
    kind: policy
    what: 'how a known-bad combination is handled: refused, or one member replaced'
  - id: configuration#11
    kind: policy
    what: the conditions under which a recorded calibration is applied
  - id: configuration#12
