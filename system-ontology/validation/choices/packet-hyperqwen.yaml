# Written by tools/so_nodetypes_experiments.py packets. Read validation/choices/BRIEF.md first.
engine: hyperqwen
decisions: 125
parts:
- part: model-dir-publisher
  does: Commits every offline rewrite of the model directory crash-safely and refuses a checkpoint the rewrites cannot extend,
    so a killed or wrong preparation never leaves a half-written model.
  types:
  - model-conversion
  decisions:
  - d: D001
    text: 'Order of writes: shards, then config.json, then the index last as the commit point'
  - d: D002
    text: Whether a checkpoint is an extendable compressed-tensors pack-quantized schema, checked before any read
  - d: D003
    text: Backup suffix per step so two steps sharing a shard do not overwrite each other's pristine copy
- part: offline-weight-requantizer
  does: Requantizes the tensors the published quant left in bf16 (output head, input embedding, MTP draft module) to symmetric
    group-128 int8 (MTP optionally int4) by round-to-nearest, with an error bound.
  types:
  - model-conversion
  decisions:
  - d: D004
    text: Bit width per tensor group and group size
  - d: D005
    text: Whether mtp.fc is kept in bf16
  - d: D006
    text: Read whole shards or stream a single huge shard
- part: draft-vocab-builder
  does: Chooses the token ids the MTP drafter may propose and slices those rows out of the already-quantized output head
    into a separate draft head.
  types:
  - model-conversion
  decisions:
  - d: D007
    text: Number of rows kept
  - d: D008
    text: Which corpus the counts come from
  - d: D009
    text: Which extra scripts (CJK, Cyrillic) are appended and under what row budget
  - d: D010
    text: Only whole-UTF-8 rows are eligible
- part: calibration-data-capture
  does: Runs the served model offline over a prompt mix to produce self-distillation outputs, target hidden states and per-layer
    Hessians of the drafters' own inputs.
  types:
  - calibration
  decisions:
  - d: D011
    text: Prompt mix and thinking on/off share
  - d: D012
    text: Number of calibration rows
  - d: D013
    text: Run eagerly so module hooks see inputs (graphs bypass hooks)
- part: gptq-requantizer
  does: Quantizes the output head, the MTP module and the DFlash2 drafter to int4 group-128 with GPTQ using captured Hessians,
    writing a new model-directory variant.
  types:
  - model-conversion
  decisions:
  - d: D014
    text: Bits and group size; no act-order so Marlin needs no index
  - d: D015
    text: Which drafter modules stay bf16 (convolution projections, selector, norms)
  - d: D016
    text: Width of the DFlash2 fc projection
  corrections:
  - field: decisions
    recorded: Width of the DFlash2 fc projection
    source_shows: The choice is the bit width of the fc projection (--fc-bits 4|8|16, default int4 GPTQ), not its dimension
      (drafter/quant_dflash2.py:5,9,29,59)
- part: chat-template-rewriter
  does: Rewrites the model's chat template so array-shaped tool arguments and unknown reasoning-effort names no longer fail
    rendering.
  types:
  - model-conversion
  decisions:
  - d: D017
    text: Which effort names map to which template level; unknown ones fall through to no instruction
- part: launch-profile-resolver
  does: Turns the operator's profile choices and the detected GPU, platform and parallel size into the vLLM flags and environment
    knobs of one engine instance, and predicts how many requests the pool will hold.
  types:
  - configuration
  decisions:
  - d: D018
    text: Profile (batch or single-user) and context class (fast, long, huge)
  - d: D019
    text: KV format and attention backend from context class and compute capability
  - d: D020
    text: Drafter kind and number of draft tokens
  - d: D021
    text: Pin the pool by bytes or by utilisation; skip the pin under tensor parallelism
  - d: D022
    text: Which layers run int8 activations
  - d: D023
    text: Allocator mode (expandable segments off under WSL2, KV connector, or TP>1)
  - d: D024
    text: Prefix caching on with align-mode Mamba state, and the snapshot retention interval
- part: correctness-pins
  does: Turns off, at boot, feature combinations measured to corrupt output, and refuses combinations the kernels do not
    support.
  types:
  - configuration
  decisions:
  - d: D025
    text: Which combinations are pinned and to what
  - d: D026
    text: Whether an explicit operator override is honoured
- part: compile-and-warmup
  does: Compiles the model graph and every Triton kernel variant the deployment can reach before the first request, keyed
    so a cached compile is reused only for the same knob settings.
  types:
  - graph-capture
  decisions:
  - d: D027
    text: Which knobs enter the cache key and which are excluded as runtime-only
  - d: D028
    text: Which kernel rungs and spec-shaped dummy verifies to run at boot
  - d: D029
    text: Which Triton kernels must not specialise on batch size
- part: graph-capture
  does: Captures CUDA graphs for each batch size up to the capture limit and for each verify-block length the drafting path
    can schedule, fixing buffer addresses for replay.
  types:
  - graph-capture
  decisions:
  - d: D030
    text: FULL, PIECEWISE or FULL_AND_PIECEWISE per profile
  - d: D031
    text: Capture both verify lengths when the lookup can lengthen the block
  - d: D032
    text: Largest captured batch size
- part: weight-loader
  does: Loads target and drafter weights from the model directory onto the GPU and re-encodes them for the kernels that
    will run them.
  types:
  - model-loading
  decisions:
  - d: D033
    text: Fold the sign of negative AutoRound scales into int4 codes for the int8-activation kernel
  - d: D034
    text: Accept asymmetric zero-point int4 weights on the int8-activation path
  - d: D035
    text: Stage repack transients through one grow-only buffer (opt-in)
  - d: D036
    text: Load a bf16 drafter beside a quantized target
- part: memory-budget-planner
  does: Decides at startup how many bytes the state pool gets, from a profiling forward pass or from an operator-pinned
    byte count, after charging weights, activation peak, graph memory and fixed scratch.
  types:
  - memory-planning
  decisions:
  - d: D037
    text: Measure after an uncounted warm profile pass, and empty the allocator cache before allocating the pool
  - d: D038
    text: Measure graph memory by allocator reserved bytes, not the driver's free-memory delta
  - d: D039
    text: Pin by bytes for fixed-context profiles
- part: pool-layout-planner
  does: Splits the pool into equal-size pages shared by attention KV, recurrent state and drafter window layers, choosing
    group size, per-kind block size and padding, and computes how many requests can be admitted and resident.
  types:
  - state-pool
  - memory-planning
  decisions:
  - d: D040
    text: Group size when the smallest bucket is the drafter's sliding-window layers (common divisor of the others instead)
  - d: D041
    text: Promote a draft layer's block to a divisor of the primary block when its page does not divide the maximum
  - d: D042
    text: Charge recurrent-state pages for every in-flight async batch, plus speculative scratch and prefill checkpoints
  - d: D043
    text: Exclude the null block from displayed concurrency
- part: paged-block-pool
  does: Hands out, reference-counts and frees fixed-size pages per request and per group, keeping a free queue whose order
    decides eviction.
  types:
  - state-pool
  decisions:
  - d: D044
    text: Order in which freed blocks enter the free queue
  - d: D045
    text: Free sliding-window blocks behind the window
- part: recurrent-state-store
  does: Keeps each request's fixed-size GDN recurrent state and convolution history in pool pages, with extra slots per
    draft position so the state after any accepted prefix of a verify block can be continued.
  types:
  - recurrent-state-store
  decisions:
  - d: D046
    text: State dtype (fp16 chosen over bf16 for mantissa bits)
  - d: D047
    text: Copy state across a block boundary during chunked prefill only when the column changes
  - d: D048
    text: Bound the spec-decode state lookup by the previous step's row width, not this step's query length
- part: attention-kv-store
  does: Holds the full-attention layers' keys and values for every context position in pool pages, in the storage format
    chosen at boot.
  types:
  - positional-state-store
  decisions:
  - d: D049
    text: Format per context class and compute capability (fp8 needs FlashInfer, the fa2 port, or sm89+ Triton)
  - d: D050
    text: Padded-page views when another group's promoted page is larger
- part: kvarn-staging-quantizer
  does: Buffers each block's new K/V in an fp16 staging pool and, when a 128-token tile is full, rotates, variance-normalises
    and packs it to 4-bit keys and 2-bit values in the cache; keeps finished requests' first blocks in fp16 until slots
    run short.
  types:
  - positional-state-store
  decisions:
  - d: D051
    text: Flush a finished request's full block (a later prefix hit may read it) but discard a partial one
  - d: D052
    text: Keep retired sinks resident; evict oldest first only when slots run dry
  - d: D053
    text: Drop, never flush, anything held for a page another group now owns
  - d: D054
    text: Draft passes after the first only allocate slots, never flush
  - d: D055
    text: Size of the staging pool as a share of memory
- part: prefix-cache
  does: Lets a new request reuse pages of any earlier or concurrent request with the same prompt prefix, resuming attention
    KV at block hashes and recurrent state from the nearest retained snapshot at or below the attention match.
  types:
  - prefix-reuse
  decisions:
  - d: D056
    text: Retention interval of state snapshots (dense, every 6th, boundaries only)
  - d: D057
    text: Hold the snapshot a turn resumed from and the last prompt-boundary snapshots until request end, freed last
  - d: D058
    text: Hash unit (128 on KVarN)
  - d: D059
    text: Export several interior GDN states per prefill (opt-in, Triton path only)
- part: kv-offload-tier
  does: Copies evicted prefix blocks to a pinned host-memory tier and loads them back over PCIe on a later hit or after
    preemption instead of recomputing.
  types:
  - state-tiering
  decisions:
  - d: D060
    text: Which groups count as draft attention (only the drafter's sliding-window groups)
  - d: D061
    text: Retain the sliding-window history at the recurrent state's replay boundary under sparse retention
  - d: D062
    text: Device pointers on WSL2
- part: api-server
  does: Accepts chat and completion requests over HTTP and streams results back as SSE, plus model listing, tokenize and
    Ollama-style discovery routes.
  types:
  - request-front
  decisions:
  - d: D063
    text: Accept a model name equal to the served name, the root path or its basename (exact only)
  - d: D064
    text: Mount /tokenize under /v1 too
  - d: D065
    text: Serve /, /api/status and /api/show for Ollama clients
  - d: D066
    text: SSE keep-alive interval
- part: access-guard
  does: Requires the bearer key on every path except the liveness paths and chooses the listening interface so an unkeyed
    server is not exposed.
  types:
  - request-front
  decisions:
  - d: D067
    text: Deny by default; allow /health, /ping, /load, /version and discovery routes
  - d: D068
    text: Ignore a trailing slash on the allowlist
  - d: D069
    text: Let only a real CORS preflight skip the token
  - d: D070
    text: Bind to loopback when no key is set (outside containers)
- part: prompt-renderer
  does: Turns a request's messages, tools and reasoning-effort setting into prompt token ids.
  types:
  - prompt-preparation
  decisions:
  - d: D071
    text: Which chat template (the offline-hardened one)
- part: output-parser
  does: Turns generated tokens into text and separates reasoning, content and XML tool calls while streaming, keeping usage
    updates flowing.
  types:
  - output-interpretation
  decisions:
  - d: D072
    text: Parser must match the template's XML call format (qwen3_coder, not hermes)
- part: engine-core-loop
  does: Runs the engine in its own process, taking requests from the frontend, calling the scheduler and model runner once
    per step, and returning outputs.
  types:
  - engine-supervision
  decisions:
  - d: D073
    text: Async scheduling overlaps planning of step N+1 with execution of step N
- part: request-scheduler
  does: Each step chooses which requests run and how many tokens of each (prefill chunks within the 2048-token budget, one
    decode or verify block per running request), admits, preempts and finishes requests.
  types:
  - step-scheduler
  decisions:
  - d: D074
    text: Token budget per step
  - d: D075
    text: Admission count (max-num-seqs) versus residency (pages)
  - d: D076
    text: Preempt and recompute when the pool is full
  - d: D077
    text: Synchronous scheduling when the worker must choose the draft count
- part: model-runner
  does: Prepares the step's inputs, block tables and attention metadata on the GPU and runs target forward, sampling, acceptance
    and drafting for the whole batch, replaying a captured graph when the shape has one.
  types:
  - step-execution
  decisions:
  - d: D078
    text: Keep FlashInfer's blocking sequence-length read as the barrier between steps under async scheduling
  - d: D079
    text: Truncate the draft tokens handed for verification to the controller's count
- part: token-embedding
  does: Looks up and dequantises the embedding row of each input token, from VRAM or from pinned host memory through a UVA
    view.
  types:
  - layer-compute
  decisions:
  - d: D080
    text: Keep the table in host memory (opt-in)
  - d: D081
    text: Skip host placement for tied embeddings and for an unquantised table
- part: linear-gemm
  does: Computes every quantised linear layer of the target and drafters, optionally quantising activations to int8 per
    token for the layers selected by name.
  types:
  - layer-compute
  decisions:
  - d: D082
    text: Which layers use int8 activations (batch default MLP only; head and MTP excluded)
  - d: D083
    text: Tuned tile table (opt-in extension)
  - d: D084
    text: Pad 2-4 row batches of the unquantised GDN in_proj_ba GEMM to 5 rows to avoid a cuBLAS slow kernel
- part: gdn-recurrence-compute
  does: 'Computes the 48 linear-attention layers: the short convolution and the gated delta-rule recurrence, chunked over
    a prefill or step by step over a verify block, writing the state after each position.'
  types:
  - layer-compute
  decisions:
  - d: D085
    text: Kernel per compute capability (Triton/FLA, CUDA on sm75)
  - d: D086
    text: Mask partial boundary chunks before exponentials
- part: full-attention-compute
  does: Computes the 16 full-attention layers over the paged KV cache for prefill chunks and single-token decode, with the
    kernel chosen by KV format, compute capability and step shape.
  types:
  - layer-compute
  decisions:
  - d: D087
    text: Backend per KV format and card (FlashInfer for fp8 on sm86, fa2 port, pth-flash-attn for int8, sm75 opt-ins)
  - d: D088
    text: int8-QK prefill only for one-request chunks over 16 tokens on the exact 24/4/256 geometry with bf16 KV
  - d: D089
    text: Sparse attention budget when LSA is on
- part: verify-attention
  does: Computes attention for steps where each request has several query tokens (the verify block), splitting each request's
    KV into segments with online-softmax partials and a combine.
  types:
  - layer-compute
  decisions:
  - d: D090
    text: Query-row tile size by row count and register budget
  - d: D091
    text: Halve the KV tile when shared memory is short (sm75)
  - d: D092
    text: Scratch capacity in tokens, shared by builders of one geometry
- part: image-encoder
  does: Encodes one image per prompt into image tokens, with the tower's weights bulk-copied from host RAM per forward.
  types:
  - modality-encoding
  decisions:
  - d: D093
    text: 'Load the tower at all (default: language-model only)'
  - d: D094
    text: Bulk-copy per module rather than UVA zero-copy, which re-reads tiles over PCIe
  - d: D095
    text: Pixel cap of 2048 image tokens and one image per prompt
- part: sampler
  does: Turns target logits into a token per request with temperature, top-k and top-p, and provides the truncated distributions
    drafting and acceptance use.
  types:
  - sampling
  decisions:
  - d: D096
    text: Use one topk instead of a full-vocabulary sort when every request's top-k is at most 64 (known on host, no sync)
  - d: D097
    text: Multi-block row softmax for up to 16 rows
- part: grammar-constraint
  does: Holds a per-request grammar state for tool calls and masks the tokens the grammar forbids at each position.
  types:
  - output-constraint
  decisions:
  - d: D098
    text: Hold every tool to its schema, not only strict ones
  - d: D099
    text: Use a source build of xgrammar so bounded string parameters stay on the fast path
- part: mtp-drafter
  does: Proposes k tokens per request by chaining the model's own one-layer draft module, scoring only the draft vocabulary
    and sampling from the request's truncated support.
  types:
  - draft-proposal
  decisions:
  - d: D100
    text: Number of drafts (3 or 4)
  - d: D101
    text: Use the truncated head when the id list exists
  - d: D102
    text: Draft from the target's top-k/top-p support; optional draft temperature scale
  - d: D103
    text: Probabilistic draft sampling rather than argmax
- part: dflash2-drafter
  does: Proposes a block of 7 tokens per request in one non-autoregressive pass over target hidden states, picking each
    position from a small candidate set by a seeded selector walk.
  types:
  - draft-proposal
  decisions:
  - d: D104
    text: Draft block equals the trained block even when the verify block is longer (the grouped convolution resets on block
      boundaries)
  - d: D105
    text: Truncate the candidate walk to the request's top-k/top-p
  - d: D106
    text: Carry the residual at 1/32 scale under fp16 (Turing)
  - d: D107
    text: Refuse a target context whose length plus the lookahead exceeds the drafter's positional capacity
- part: context-lookup-proposer
  does: Finds, per request, the most recent occurrence of the longest suffix of its token history and fuses the tokens that
    followed it into the draft block, rewriting the draft distribution to a point mass wherever it supplied the token.
  types:
  - draft-proposal
  decisions:
  - d: D108
    text: Minimum and maximum match length, ties broken by recency
  - d: D109
    text: 'Head positions: take a match of at least NSTRONG alone, shorter only if the drafter agrees on the first AGREE
      tokens'
  - d: D110
    text: 'Tail positions: lower threshold, must be consistent with the head'
  - d: D111
    text: Search distance
- part: drafter-free-chains
  does: While a single request keeps reproducing its context, proposes whole verify blocks from the lookup alone and skips
    the drafter's forward until the first rejection.
  types:
  - draft-policy
  - draft-proposal
  decisions:
  - d: D112
    text: Entry needs a fresh match from a normal step; first miss ends the chain
  - d: D113
    text: Single request only; greedy only by default (point mass under sampling displaced better drafts, -8 percent)
- part: verify-length-controller
  does: Once per step on the host, decides whether the next step verifies the drafter's own block or the long block, requiring
    two consecutive qualifying steps agreed by every request.
  types:
  - draft-policy
  decisions:
  - d: D114
    text: Unanimity across the batch
  - d: D115
    text: Two qualifying steps to enter, STICKY steps to leave (single request only)
  - d: D116
    text: Take the long block unconditionally below a context length (off by default)
  - d: D117
    text: Read the flags one step stale rather than synchronise (synchronous read cost 5 percent)
- part: draft-acceptance
  does: Accepts the longest prefix of the proposed tokens the target agrees with (argmax under greedy, rejection sampling
    against q under sampling), emits a corrected or bonus token, and reports how many were accepted so state can be committed.
  types:
  - draft-verification
  decisions:
  - d: D118
    text: Draft sample method must be probabilistic so q is passed (otherwise acceptance is strictly stricter)
  - d: D119
    text: Kernels must not specialise on batch size
- part: tensor-parallel
  does: Splits the model's layers' weights and heads across 2 or 4 GPUs (or pipelines layers across GPUs) and keeps them
    in step with collectives.
  types:
  - model-partitioning
  - device-communication
  decisions:
  - d: D120
    text: Allocator without expandable segments so graph buffers can be exported over CUDA IPC
  - d: D121
    text: Size the pool from utilisation rather than the single-card pin
- part: telemetry
  does: 'Reports what the engine is doing: metrics including spec-decode acceptance, one line per finished request, per-request
    progress lines, prefill progress in SSE, and the pool''s resident-request capacity at boot.'
  types:
  - telemetry
  decisions:
  - d: D122
    text: Progress lines opt-in; no CUDA synchronisation
  - d: D123
    text: Prompt progress only for requests that asked
- part: stall-watchdog
  does: A daemon thread warns once per episode when no step has completed for a threshold while the scheduler still holds
    requests.
  types:
  - engine-supervision
  decisions:
  - d: D124
    text: Threshold (off by default)
  - d: D125
    text: No lock shared with the main loop
candidates:
  model-conversion:
  - id: model-conversion#01
    kind: format
    what: file layout, alignment and ordering of weights
  - id: model-conversion#02
    kind: format
    what: precision per kind of weight
  - id: model-conversion#03
    kind: policy
    what: which derived pieces are built (draft head, shortlist vocabulary, extra copies)
  - id: model-conversion#04
    kind: policy
    what: whether conversion is one step or resumable stages
  - id: model-conversion#05
    kind: failure
    what: what happens to a conversion that is interrupted or does not match its source
  - id: model-conversion#06
    kind: precedence
    what: which source wins when several checkpoints supply the same tensor
  - id: model-conversion#07
    kind: sizing
    what: 'memory used while converting: whole files or piece by piece'
  - id: model-conversion#08
    kind: policy
    what: the data a derived piece is selected or fitted from, and what is eligible for it
  - id: model-conversion#09
    kind: format
    what: which reduced activation precisions each weight permits at run time, recorded with the weight
  - id: model-conversion#10
    kind: policy
    what: which revision of the published sources is used, and whether it is pinned
  - id: model-conversion#11
    kind: sizing
    what: the size of a derived piece
  - id: model-conversion#12
    kind: policy
    what: 'how a derived template is corrected: which inputs it accepts and what each maps to'
  - id: model-conversion#13
    kind: policy
    what: which optional parts of the published model are included
  - id: model-conversion#14
    kind: policy
    what: precision per layer as well as per kind of weight
  - id: model-conversion#15
    kind: format
    what: whether a tensor's stored shape is padded for the kernels
  - id: model-conversion#16
    kind: timing
    what: the order of writes, and which write marks the conversion complete
  - id: model-conversion#17
    kind: policy
    what: which source formats and architecture constants a recipe accepts
  - id: model-conversion#18
    kind: policy
    what: which separately trained pieces are paired with which model
  - id: model-conversion#19
    kind: policy
    what: whether files are rewritten in place, and how the originals are kept
  calibration:
  - id: calibration#01
    kind: policy
    what: what is measured and on which prompts
  - id: calibration#02
    kind: policy
    what: the rule that accepts or rejects a measured result
  - id: calibration#03
    kind: timing
    what: offline, at install, or at every start
  - id: calibration#04
    kind: precedence
    what: when a recorded result is trusted over a default or an operator setting
  - id: calibration#05
    kind: failure
    what: what is used when no valid record exists
  - id: calibration#06
    kind: threshold
    what: when a stored record is considered stale
  - id: calibration#07
    kind: sizing
    what: time budget of a measurement run
  - id: calibration#08
    kind: policy
    what: which settings a measurement may choose on its own, by their effect on output
  - id: calibration#09
    kind: policy
    what: the key that states which model, machine and build a result is valid for
  - id: calibration#10
    kind: policy
    what: how measured counts are turned into a ranking
  - id: calibration#11
    kind: policy
    what: the form of the model fitted to the measurements
  - id: calibration#12
    kind: policy
    what: whether a negative result is recorded and reused
  - id: calibration#13
    kind: sizing
    what: how much data a measurement collects
  - id: calibration#14
    kind: threshold
    what: the noise tolerated when a result is accepted
  - id: calibration#15
    kind: policy
    what: which capacities or settings a profile simulates
  - id: calibration#16
    kind: policy
    what: whether a measurement runs the serving path or a slower instrumented path that exposes internal values
  - id: calibration#17
    kind: threshold
    what: the least gain a measured result must predict before the setting it supports is turned on
  configuration:
  - id: configuration#01
    kind: precedence
    what: operator values, presets, measured values and defaults
  - id: configuration#02
    kind: policy
    what: which combinations are refused
  - id: configuration#03
    kind: policy
    what: whether an operator value is a hard limit or a target
  - id: configuration#04
    kind: policy
    what: which settings are fixed per machine class
  - id: configuration#05
    kind: policy
    what: rules that derive a setting's default from other settings and machine facts
  - id: configuration#06
    kind: policy
    what: whether and where the resolved settings are recorded
  - id: configuration#07
    kind: policy
    what: which settings that change output are on by default, and in which profile
  - id: configuration#08
    kind: failure
    what: what is assumed when a fact about the machine cannot be read
  - id: configuration#09
    kind: policy
    what: named profiles and what each fixes
  - id: configuration#10
    kind: policy
    what: 'how a known-bad combination is handled: refused, or one member replaced'
  - id: configuration#11
    kind: policy
    what: the conditions under which a recorded calibration is applied
