# Written by tools/so_nodetypes_experiments.py packets. Read validation/choices/BRIEF.md first.
engine: ds4
decisions: 124
parts:
- part: offline-converter-quantizer
  does: Builds the project's own GGUF files from source checkpoints, with low-bit formats spent on routed experts, layout
    padding the kernels expect, page-aligned disk tables and separate draft and vision files.
  types:
  - model-conversion
  decisions:
  - d: D001
    text: Which tensor format each tensor class gets (routed gate/up, routed down, attention, shared expert, output)
  - d: D002
    text: Whether some layers' routed experts get a higher-precision format (mixed Q2/Q4 recipe)
  - d: D003
    text: Padding of expert input width to a kernel-friendly size (Qwen 640 to 768)
  - d: D004
    text: Alignment of disk-only tables inside the file (Engram 16 KiB)
- part: imatrix-collector
  does: Runs the engine over a calibration text set and accumulates per-expert activation statistics for the gate/up and
    down matrices, then writes them as an importance matrix.
  types:
  - calibration
  decisions:
  - d: D005
    text: Minimum samples per expert before an entry counts as covered
- part: expert-locality-profiler
  does: Records every routing decision during a run, simulates per-layer LRU caches of several sizes, and writes a profile
    and a hot-expert list that can seed the expert cache.
  types:
  - calibration
  decisions:
  - d: D006
    text: Set of simulated cache capacities
  - d: D007
    text: Metal only; ignored with a warning on other backends
- part: engine-option-validator
  does: At startup refuses option combinations the chosen model family and backend do not support, and takes a machine-wide
    lock so only one huge model process runs at a time.
  types:
  - configuration
  decisions:
  - d: D008
    text: Which features each family allows (e.g. Qwen refuses TP, pipeline, multi-GPU, DSpark, external MTP, power below
      100)
  - d: D009
    text: Default draft count, MTP margin and DSpark confidence threshold per backend
  - d: D010
    text: Whether vision needs a GPU backend and one GPU
- part: model-loader
  does: Maps the GGUF file read-only, parses metadata and tensor directory, selects the model family shape, and unmaps the
    regions of disk-only tables so they never count as mapped.
  types:
  - model-loading
  decisions:
  - d: D011
    text: Shared mapping for GPU backends, private mapping for the CPU backend (to avoid a macOS VM failure)
  - d: D012
    text: Only GGUF version 3; unknown layouts are fatal
- part: weight-binder
  does: Makes the mapped weights readable by the GPU without a second copy (or copies them when asked), binding only a layer
    slice or one expert half when the process owns only part of the model.
  types:
  - model-loading
  decisions:
  - d: D013
    text: Register the mapping, copy it to device memory, or register only an owned expert range
  - d: D014
    text: Whether to pre-fault (warm) the whole model or only the owned shard
  - d: D015
    text: Whether non-routed weights are wired so streaming cannot evict them
- part: memory-admission-guard
  does: Estimates context, scratch and model bytes for the requested context and session count and refuses to start (or
    refuses an allocation) when they exceed the machine's budget minus a reserve.
  types:
  - memory-planning
  - resource-governing
  decisions:
  - d: D016
    text: Budget fraction and fixed reserve per machine class and family
  - d: D017
    text: Whether an explicitly raised wired limit overrides the heuristics
  - d: D018
    text: OS reserve kept back for every ROCm allocation on integrated GPUs
- part: ssd-cache-planner
  does: Computes at startup how many routed experts the expert cache may hold, from the recommended working set times a
    percentage, capped by a context-aware limit, minus non-routed weight bytes, divided by one expert's bytes.
  types:
  - memory-planning
  decisions:
  - d: D019
    text: Default percentage (80, or 86 on Apple for non-GLM), override range 50 to 95
  - d: D020
    text: At least one slot, at most the model's expert count
  - d: D021
    text: A user-given size is a target, not a guarantee
- part: multi-gpu-placer
  does: On one CUDA machine with several GPUs, assigns embedding, each layer and the output head to GPUs in order within
    per-GPU budgets, or pairs GPUs so each holds half of every layer's routed experts.
  types:
  - model-partitioning
  decisions:
  - d: D022
    text: Greedy contiguous packing in layer order
  - d: D023
    text: Expert split only for DeepSeek V4 with an even GPU count
  - d: D024
    text: Refuse any layout that would place layers on the CPU
  - d: D025
    text: Refuse multi-GPU together with SSD streaming
- part: routed-expert-cache
  does: Holds a bounded set of routed experts (gate, up and down blocks) in separately allocated GPU-visible buffers and
    answers which slot holds a selected expert of a layer.
  types:
  - expert-cache
  decisions:
  - d: D026
    text: 'Metal: buffers locked with mlock; lock failure lowers the effective limit'
  - d: D027
    text: 'CUDA: capacity backs off by a quarter until allocation succeeds, keeping 8 GiB system headroom; single GPU only'
  - d: D028
    text: A hit requires matching file offsets of all three blocks
- part: expert-eviction-policy
  does: 'Chooses which cached expert gives up its slot: on Metal the lowest decaying selection count then oldest use; on
    CUDA simply the oldest use stamp after all hits of the step are protected.'
  types:
  - residency-policy
  decisions:
  - d: D029
    text: Heat increments on every selection, not only hits
  - d: D030
    text: Heat halves every 16 decoded tokens; prefill does not advance the clock; a fresh prefill resets heat
  - d: D031
    text: On Metal, wait once for in-flight commands and retry when only in-flight entries remain
  - d: D032
    text: CUDA keeps no heat (reset is a no-op)
- part: expert-ssd-reader
  does: Copies a missing expert's three blocks from the model file into its cache slot with several reader threads, starting
    as soon as the selected ids are known.
  types:
  - expert-fetch
  decisions:
  - d: D033
    text: Start reads while the GPU computes the shared expert
  - d: D034
    text: 'CUDA batched prefill: sort misses by file offset and merge adjacent reads'
- part: resident-missing-split
  does: When three or more selected experts of a layer are missing, computes the resident ones first while the missing ones
    are read, then the late ones, and does the down projection and sum once at the end.
  types:
  - expert-dispatch
  decisions:
  - d: D035
    text: Split threshold on missing experts per layer
  - d: D036
    text: Enable only after a few decoded tokens and once the cache holds enough entries
- part: expert-cache-preloader
  does: Fills the expert cache at startup from a built-in list of frequently used experts gathered offline, up to a cap,
    so the first tokens do not cause thousands of reads.
  types:
  - residency-policy
  decisions:
  - d: D037
    text: Preload cap in automatic mode
  - d: D038
    text: Not used for Qwen and off by default for GLM 5.2
- part: prefill-layer-pagein
  does: During wide prefills in streaming mode, touches the next layer's routed-weight pages of the mapped file from helper
    threads so they are in the page cache when that layer runs.
  types:
  - expert-fetch
  decisions:
  - d: D039
    text: 'Which variant runs: pread is on by default; madvise, page-in and readahead are opt-in by environment'
  - d: D040
    text: Only routed matrices when non-routed weights are already wired (GLM)
- part: engram-row-reader
  does: For V4.1, hashes each new token with the 3 previous ones into 24 row numbers per table and reads those rows directly
    from the file with an uncached descriptor, decoding E4M3 to BF16.
  types:
  - row-source
  decisions:
  - d: D041
    text: Bypass the page cache (F_NOCACHE on macOS, POSIX_FADV_RANDOM on Linux)
  - d: D042
    text: 'Decode: start reads before layer 0, wait at layer 1'
  - d: D043
    text: 'Prefill: sort rows of up to 2048 tokens, reuse duplicate rows, read in parallel'
- part: engram-prewarm
  does: When memory clearly allows, reads the Engram tables sequentially in background threads to fill the page cache, stopping
    under OS memory pressure.
  types:
  - row-source
  decisions:
  - d: D044
    text: Warm only when model plus runtime plus table plus a fixed reserve fits physical memory
  - d: D045
    text: Number of warm threads; check pressure every 64 reads
- part: ngram-row-reader
  does: For Qwen3.8, reads BF16 n-gram embedding rows for each token from the on-disk table with pread, and during prefill
    reads the next chunk's rows in a background thread.
  types:
  - row-source
  decisions:
  - d: D046
    text: Prefetch only for chunks of at least 256 tokens and buffers up to 128 MiB
- part: tokenizer-and-chat-renderer
  does: Turns a conversation into tokens with hand-written per-family chat renderers (not templates) and the model's tokenizer,
    keeping both rendered text and tokens.
  types:
  - prompt-preparation
  decisions:
  - d: D047
    text: Tool schemas rendered before system content so the checkpoint trim cuts the dynamic tail
  - d: D048
    text: Old reasoning dropped unless tool context or after the last user message
  - d: D049
    text: Suffix-only retokenization after a reused prefix to avoid BPE merges across the boundary
- part: image-input-encoder
  does: Decodes PNG or JPEG data into pixels and runs the family's vision encoder to produce visual token embeddings that
    are spliced into the prompt at image markers.
  types:
  - modality-encoding
  - media-preparation
  decisions:
  - d: D050
    text: Size limits on encoded bytes, dimensions and pixels
  - d: D051
    text: Remote URLs and file paths rejected
  - d: D052
    text: Sessions with images are never stored to disk
- part: session-timeline
  does: 'Represents one mutable inference timeline: the exact token list whose state is live, a validity flag, the last
    logits and image identities; callers give full prefixes and it reuses, extends or rebuilds.'
  types:
  - sequence-lifecycle
  decisions:
  - d: D053
    text: Each session allocates full-context capacity at creation
  - d: D054
    text: DeepSeek state cannot be truncated except within the speculative window; any other rewind invalidates and forces
      re-prefill
  - d: D055
    text: GLM can truncate; Qwen restores one of three snapshots or replays
- part: compressed-attention-state
  does: 'Holds DeepSeek attention state per layer: a 128-row ring of raw rows, appended compressed rows, indexer rows, the
    compressor''s pending group, and row counters that define which rows are valid.'
  types:
  - positional-state-store
  decisions:
  - d: D056
    text: Compression ratio per layer (none, every 4, every 128) is a model property
  - d: D057
    text: Rows for rejected positions stay in place, hidden by counters
  - d: D058
    text: Compressed rows optionally stored as F16
- part: dense-attention-cache
  does: Holds per-position key/value (or compact latent) rows and sparse-attention indexer keys for GLM and for Qwen's attention
    layers.
  types:
  - positional-state-store
  decisions:
  - d: D059
    text: Full dense cache length cap versus compact latent cache
- part: recurrent-layer-state
  does: Holds fixed-size recurrent and convolution state of linear-attention layers, plus up to three snapshots used to
    roll back after rejected drafts.
  types:
  - recurrent-state-store
  decisions:
  - d: D060
    text: Batched Qwen sessions draw state from a shared slot pool
- part: prompt-prefill-driver
  does: Brings a session from its live token list to a requested prompt by keeping the common prefix and running the remainder
    through the model chunk by chunk, layer-major, with progress and cancel checks between chunks.
  types:
  - prompt-reading
  decisions:
  - d: D061
    text: Prefill chunk size per family (graph-selected for GLM)
  - d: D062
    text: Leave the partial frontier valid on interrupt so it can be reused
- part: decode-step
  does: Runs one token through the model for one session, updating its state and logits.
  types:
  - step-execution
  decisions:
  - d: D063
    text: Whether to probe the MTP head in the same step
- part: gpu-backend
  does: Encodes and runs the model's operations as GPU kernels specialised per tensor format, per family and per batch shape.
  types:
  - device-backend
  - graph-capture
  decisions:
  - d: D064
    text: Kernel per tensor format (F32, F16, BF16, Q4_0, Q4_1, Q8_0, Q2_K, Q4_K, Q5_K, Q6_K, Q8_K, IQ2_XXS, I8, I32, MXFP4)
  - d: D065
    text: Native FP4 matrix instructions on Blackwell for batched expert work
  - d: D066
    text: Prefill workspace shared between sessions in server batch mode
- part: hyper-connection-mixer
  does: Keeps several residual streams per token and mixes them before and after each sublayer with Sinkhorn-normalised
    weights.
  types:
  - layer-compute
  decisions:
  - d: D067
    text: Number of streams and Sinkhorn iterations are model constants
- part: attention-compute
  does: Computes attention for each token over the visible cached rows, including compressing new rows and selecting the
    top compressed rows with an indexer.
  types:
  - layer-compute
  decisions:
  - d: D068
    text: Indexer top-k (512) and raw window (128) are model constants
- part: expert-router
  does: 'Chooses the routed experts and their weights per token and layer: by a learned gate, or in the first DeepSeek layers
    by a token-id lookup table.'
  types:
  - layer-compute
  decisions:
  - d: D069
    text: Hash-routed layer count is a model constant (3 for DeepSeek V4, 0 for V4.1)
  - d: D070
    text: V4.1 image tokens use a separate router bias
- part: routed-expert-ffn
  does: Computes the selected experts' gate/up/SwiGLU/down and their weighted sum for each token.
  types:
  - layer-compute
  decisions:
  - d: D071
    text: Under TP each rank computes its expert-id half (or half of every expert's intermediate width for CUDA MXFP4)
- part: shared-and-dense-ffn
  does: Computes the always-on shared expert and the dense FFN of leading dense layers.
  types:
  - layer-compute
  decisions:
  - d: D072
    text: Under TP, V4 splits the shared expert by width; V4.1 gives it to one rank, alternating by layer parity
- part: directional-steering
  does: Removes or amplifies one stored direction per layer from attention and/or FFN outputs at run time.
  types:
  - model-edit
  decisions:
  - d: D073
    text: Apply after FFN (default when a file is given) or after attention
  - d: D074
    text: Not implemented for GLM 5.2
  - d: D075
    text: Disables the shared-weight session batch path
- part: output-head
  does: Projects the final hidden state to vocabulary logits.
  types:
  - layer-compute
  decisions:
  - d: D076
    text: Split by vocabulary halves under TP (V4 and V4.1 CUDA) or across GPUs under CUDA expert split
- part: power-throttle
  does: Sleeps after each prefill layer or decoded token for a time proportional to a smoothed measured work time, so the
    GPU duty cycle approximates the requested percentage.
  types:
  - resource-governing
  decisions:
  - d: D077
    text: Smoothing factor of the moving average
  - d: D078
    text: Not available for Qwen; GLM requires 100
- part: token-sampler
  does: Chooses the next token from logits by greedy argmax or by temperature with top-k, top-p and min-p, and computes
    log-probabilities.
  types:
  - sampling
  decisions:
  - d: D079
    text: Defaults temperature 1.0, top_p 1.0, min_p 0.05
  - d: D080
    text: Top-k capped at 1024; non-finite logits skipped
  - d: D081
    text: Thinking-mode defaults apply only to knobs the client left unset
- part: tool-call-sampling-mode
  does: Tracks whether generated text is inside tool-call structure or a string payload and makes structural tokens greedy
    while payload text keeps the request temperature.
  types:
  - sampling
  decisions:
  - d: D082
    text: Which tag sets count as structure
  - d: D083
    text: On a mode flip inside an accepted draft block, discard the rest and rewind to the boundary
- part: dspark-drafter
  does: For DeepSeek V4/V4.1, proposes up to five next tokens from the target model's hidden features with a small block
    drafter, each with a confidence, stopping when confidence falls below a threshold.
  types:
  - draft-proposal
  decisions:
  - d: D084
    text: Confidence threshold (default 0.6 Metal, 0.7 otherwise, settable)
  - d: D085
    text: Draft only when the full 128-position feature window is present; otherwise decode ordinarily to refill it
  - d: D086
    text: Disabled by --quality or --dspark-strict
- part: builtin-mtp-drafter
  does: Drafts one or two tokens with the model's own multi-token-prediction block.
  types:
  - draft-proposal
  decisions:
  - d: D087
    text: Qwen depth adapts between 1 and 2 from recent first-draft acceptance
  - d: D088
    text: How prefill prepares the predictor history (DS4_QWEN4_MTP_PREFILL)
- part: dspark-scheduler
  does: Decides per round whether drafting runs, pausing it for some rounds when recent acceptance counts show it does not
    pay.
  types:
  - draft-policy
  decisions:
  - d: D089
    text: Window size, minimum mean acceptance and pause length, with platform variants
  - d: D090
    text: Longer pauses after rounds with no draft
  - d: D091
    text: Time-based judgement off by default
  - d: D092
    text: Reset at the start of each request
- part: draft-verify-commit
  does: Runs the last token plus drafts through the full model in one batch, accepts the longest matching prefix (or by
    probability ratio in exact mode), and leaves state exactly as for the accepted prefix.
  types:
  - draft-verification
  decisions:
  - d: D093
    text: Greedy compare, or accept with probability target over draft and resample from the residual
  - d: D094
    text: On correction, evaluate the corrected token ordinarily
- part: session-payload-serializer
  does: Writes or reads a session's tokens, logits, row counters and live state rows in a versioned binary payload, validating
    dimensions and counts on load.
  types:
  - session-persistence
  decisions:
  - d: D095
    text: Only live rows written, so size scales with tokens not context
  - d: D096
    text: Engram history not stored; rebuilt from tokens
  - d: D097
    text: Under TP, load only tokens and re-prefill
- part: disk-kv-checkpoint-store
  does: Keeps session checkpoints on disk keyed by the SHA-1 of the rendered text prefix, finds the longest saved prefix
    of a new prompt, and evicts by a decaying hit score within a disk budget.
  types:
  - prefix-reuse
  decisions:
  - d: D098
    text: Store thresholds (min 512, cold max 30000, every 10240 continued) and boundary trimmed 32 and aligned to 2048
  - d: D099
    text: Cold store at the last user marker before the first assistant marker
  - d: D100
    text: Score = (decayed hits + 1) x tokens / bytes, 6 h half-life, doubled for anchor reasons
  - d: D101
    text: Directory rescanned on every lookup, no index
- part: http-api-server
  does: Accepts OpenAI chat/completions/responses and Anthropic messages over hand-written HTTP/1.1, streams SSE, detects
    disconnects and cancels jobs.
  types:
  - request-front
  decisions:
  - d: D102
    text: Body cap 64 MiB, socket timeouts, fail slow clients rather than block the worker
  - d: D103
    text: Durable response state rejected; client must replay input
  - d: D104
    text: No metrics, health or overload rejection
- part: tool-call-codec
  does: Parses generated tool calls per family, repairs a missing wrapper, retries once with a model-visible error, and
    remembers the exact sampled call text by id so history replays byte-identically.
  types:
  - output-interpretation
  decisions:
  - d: D105
    text: Retry on invalid call only for non-streaming requests
- part: server-generation-loop
  does: 'Drives one job: sync, then sample and evaluate tokens, tracking thinking, stop sequences and EOS, streaming text,
    and triggering continued checkpoints.'
  types:
  - output-interpretation
  decisions:
  - d: D106
    text: A client stop-sequence hit invalidates the live session
  - d: D107
    text: Speculative decoding only in single-session mode (except Qwen Metal)
- part: slot-router
  does: Matches a request to the session slot with the most reusable live state through seven ordered tiers and, when needed,
    picks a slot to repurpose, saving its old state to disk first.
  types:
  - sequence-lifecycle
  - prefix-reuse
  decisions:
  - d: D108
    text: 'Tier order: visible transcript, tool-output bindings, GLM rewind, token prefix, thinking-visible, rendered-text
      prefix'
  - d: D109
    text: 'Victim preference: empty, idle over 1 h, then shortest checkpoint; busy slots never'
  - d: D110
    text: Continuations pinned to their slot
- part: request-scheduler
  does: Runs queued jobs on slot threads, coalesces their pending decode tokens into one batch, and admits prefill one quantum
    at a time only when no decode is pending, round-robin across slots.
  types:
  - step-scheduler
  decisions:
  - d: D111
    text: Coalesce window 2 ms or until all active generations post
  - d: D112
    text: Prefill quantum 128 tokens while any generation is active (at least 1024 for GLM 5.3), larger otherwise
  - d: D113
    text: Decode has strict priority over prefill; prefill and decode never fused
  - d: D114
    text: Unbounded queue
- part: session-batch-executor
  does: Advances several sessions by one token in one call, using a family-specific fused path when supported, encoding
    several graphs before one synchronisation on CUDA, or evaluating them one after another.
  types:
  - step-execution
  decisions:
  - d: D115
    text: Fused only when every member qualifies (no streaming, no steering, same engine, valid state)
  - d: D116
    text: Shared-expert and QKV weights shared across rows on Metal V4 when Q8_0
- part: network-tensor-parallel
  does: Runs the model in lockstep on two machines, each holding half of the routed experts (and half of some projections),
    exchanging f32 partial sums at up to two gates per layer over RDMA or TCP, with the worker mirroring every session call.
  types:
  - model-partitioning
  - device-communication
  decisions:
  - d: D117
    text: Hello exchange must match model, quant, context and gate schedule
  - d: D118
    text: Cancellation only agreed at prefill checkpoints
  - d: D119
    text: 'Speculation: leader drafts; verify sharded; commit as full, prefix or rollback-replay'
- part: pipeline-parallel
  does: Splits consecutive layer ranges across machines, forwarding tokens and hidden state stage to stage and returning
    logits, with route discovery from worker registrations.
  types:
  - model-partitioning
  - device-communication
  decisions:
  - d: D120
    text: Activation bits on the wire
  - d: D121
    text: Prefill pipelining window
  - d: D122
    text: DeepSeek V4 and GLM only
- part: cross-gpu-transfer
  does: Moves activations between GPUs at layer boundaries and reduces expert-split partials, by peer copy or a pinned host
    bounce.
  types:
  - device-communication
  decisions:
  - d: D123
    text: Peer copy when available, else host bounce
- part: logging-and-trace
  does: Reports prefill and decode progress, cache decisions, tool events, speculative statistics and optional per-stage
    timings to stderr or a trace file.
  types:
  - telemetry
  decisions:
  - d: D124
    text: Log categories; batch timing only with DS4_SERVER_BATCH_LOG
candidates:
  model-conversion:
  - id: model-conversion#01
    kind: format
    what: file layout, alignment and ordering of weights
  - id: model-conversion#02
    kind: format
    what: precision per kind of weight
  - id: model-conversion#03
    kind: policy
    what: which derived pieces are built (draft head, shortlist vocabulary, extra copies)
  - id: model-conversion#04
    kind: policy
    what: whether conversion is one step or resumable stages
  - id: model-conversion#05
    kind: failure
    what: what happens to a conversion that is interrupted or does not match its source
  - id: model-conversion#06
    kind: precedence
    what: which source wins when several checkpoints supply the same tensor
  - id: model-conversion#07
    kind: sizing
    what: 'memory used while converting: whole files or piece by piece'
  - id: model-conversion#08
    kind: policy
    what: the data a derived piece is selected or fitted from, and what is eligible for it
  - id: model-conversion#09
    kind: format
    what: which reduced activation precisions each weight permits at run time, recorded with the weight
  - id: model-conversion#10
    kind: policy
    what: which revision of the published sources is used, and whether it is pinned
  - id: model-conversion#11
    kind: sizing
    what: the size of a derived piece
  - id: model-conversion#12
    kind: policy
    what: 'how a derived template is corrected: which inputs it accepts and what each maps to'
  - id: model-conversion#13
    kind: policy
    what: which optional parts of the published model are included
  - id: model-conversion#14
    kind: policy
    what: precision per layer as well as per kind of weight
  - id: model-conversion#15
    kind: format
    what: whether a tensor's stored shape is padded for the kernels
  - id: model-conversion#16
    kind: timing
    what: the order of writes, and which write marks the conversion complete
  - id: model-conversion#17
    kind: policy
    what: which source formats and architecture constants a recipe accepts
  - id: model-conversion#18
    kind: policy
    what: which separately trained pieces are paired with which model
  - id: model-conversion#19
    kind: policy
    what: whether files are rewritten in place, and how the originals are kept
  calibration:
  - id: calibration#01
    kind: policy
    what: what is measured and on which prompts
  - id: calibration#02
    kind: policy
    what: the rule that accepts or rejects a measured result
  - id: calibration#03
    kind: timing
    what: offline, at install, or at every start
  - id: calibration#04
    kind: precedence
    what: when a recorded result is trusted over a default or an operator setting
  - id: calibration#05
    kind: failure
    what: what is used when no valid record exists
  - id: calibration#06
    kind: threshold
    what: when a stored record is considered stale
  - id: calibration#07
    kind: sizing
    what: time budget of a measurement run
