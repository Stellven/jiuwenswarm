# Written by tools/so_nodetypes_experiments.py packets. Read validation/choices/BRIEF.md first.
engine: strata
decisions: 253
parts:
- part: expert-cache
  does: Hold a fixed number of experts in fast memory and answer, for any expert, whether it is there and in which slot.
  types:
  - expert-cache
  decisions:
  - d: D001
    text: How many slots the cache has. The automatic value is the free fast memory minus a reserve, divided by the largest
      expert; after opening, free memory is read again and the cache is shrunk if the reserve was not really left.
- part: expert-dispatch
  does: For one layer of one window, decide for every routed expert which path computes it, and publish the accelerator's
    share before the CPU's share starts.
  types:
  - expert-dispatch
  decisions:
  - d: D002
    text: 'The order in which paths are tried for a routed expert: cached in fast memory; omitted because it ranks low for
      every token of the window; held by a second accelerator; fetched for this window only; computed by the CPU.'
  - d: D003
    text: A missed expert that every token of the window routes only at this rank or lower is neither fetched nor computed.
  - d: D004
    text: How many of a layer's missed experts are fetched for this window instead of being left to the CPU. A fixed share,
      or a count from measured CPU and accelerator costs when that option is on.
  corrections:
  - field: decisions
    recorded: A missed expert that every token of the window routes only at this rank or lower is neither fetched nor computed;
      tail skip described as default on the CUDA serving path
    source_shows: 'The default is conditional: off when the share of experts in the GPU cache reaches STRATA_TAIL_SKIP_MAX_CACHED
      (default 90%, 60 on a HIP layer split) and off for NVFP4 experts; the start-up message says which applies (src/program/generate.cpp:12787-12822).
      That condition is a decision of its own.'
- part: adaptive-tier
  does: Keep the expert cache filled with the experts the current conversation uses most, by swapping a bounded number of
    them at fixed intervals.
  types:
  - residency-policy
  decisions:
  - d: D005
    text: Run once every this many verify windows.
  - d: D006
    text: At most this many swaps per run, taken in order of gain across all layers.
  - d: D007
    text: After each run every usage count is multiplied by this.
  - d: D008
    text: A swap is made only if the entering expert's count exceeds the leaving expert's by at least this.
  - d: D009
    text: An expert is a candidate to enter only if its count is at least this.
- part: host-to-device-transfer
  does: Copy expert bytes from slow memory to fast memory in an order the accelerator work that follows can rely on.
  types:
  - expert-fetch
  decisions:
  - d: D010
    text: Whether the adaptive tier's copies are issued one by one or as one batched copy.
  - d: D011
    text: The most experts that can be fetched for one window, bounded by the staging area and by 64.
- part: prompt-path
  does: Read the prompt in large chunks, layer by layer, and leave behind the model state that generation continues from.
  types:
  - prompt-reading
  decisions:
  - d: D012
    text: Tokens per prompt chunk.
  - d: D013
    text: The CPU's share of the experts not in fast memory is the accelerator's time per expert over the sum of both times,
      as running averages, kept between these bounds.
  - d: D014
    text: Sharing is switched off for following layers when the measured time with sharing is not lower than without.
  - d: D015
    text: An expert may go to the CPU only if it is routed in this chunk, is not in fast memory, is not taken by a second
      accelerator, is routed by no more tokens than the CPU kernel's batch limit, and its weights can be read from slow
      memory without assembling a short-lived buffer. Candidates are taken in order of fewest tokens first.
- part: model-file-reader
  does: Map a GGUF v3 shard read-only, expose its metadata, tensor directory and tensor bytes unchanged, and refuse a file
    whose declared shape the compiled kernels cannot run.
  types:
  - model-loading
  decisions:
  - d: D016
    text: Only GGUF version 3 is read.
  - d: D017
    text: 'Tensor data alignment: general.alignment when non-zero, else the default.'
  - d: D018
    text: Only the first items of a metadata array are kept; the count is kept in full.
  - d: D019
    text: Six metadata keys are required (block_count, embedding_length, expert_count, expert_used_count, attention.head_count,
      attention.head_count_kv); any other key the file lacks keeps the compiled value.
  - d: D020
    text: Only the expert count, the experts per token and the vocabulary size may differ from the compiled geometry; every
      other shape must match.
  - d: D021
    text: Upper limit on experts used per token.
- part: expert-layout
  does: Read the pack's native_experts.txt once and answer, for the whole process, how many bytes each layer's expert blob
    has, where it starts, and where each layer's gate, up and down tensors lie in the GGUF shards.
  types:
  - model-loading
  decisions:
  - d: D022
    text: Bytes of one expert blob in the canonical (non-native) layout.
  - d: D023
    text: Native layout (per-layer blob sizes and formats, GGUF spans) when native_experts.txt exists, else the canonical
      layout with one blob size.
  - d: D024
    text: A native_experts.txt newer than the engine reads is refused.
- part: weight-loader
  does: Copy every tensor the pack index lists, except those in a skip set, into one device memory range at its recorded
    offset, applying the byte transform the index names for each plane, and return a table from tensor name to location.
  types:
  - model-loading
  decisions:
  - d: D025
    text: Source bytes read and uploaded per round.
  - d: D026
    text: 'One of four transforms per plane, named by the index row: copy; keep the high 16 bits of a BF16 value stored
      as 32 bits; convert an F16 value stored as 32 bits back to 16; widen an fp16 scale plane to 32 bits.'
  - d: D027
    text: Tensors another loader serves are not read; their rows keep metadata and no bytes. --keep-canonical loads both
      forms.
  - d: D028
    text: 'STRATA_HC_REQ8=1 on one GPU: the hyper-connection projections are requantized to int8 with one scale per 32 values
      instead of being loaded as BF16. Off by default.'
- part: native-weight-loader
  does: Upload selected tensors in their unchanged GGUF block form (per-layer projections, output head, token embedding)
    and attach them to the matching entries of the weight table, so that the pack copy of each can be skipped.
  types:
  - model-loading
  decisions:
  - d: D029
    text: --native turns on native projections, native head and native embedding together; --native-head-gguf and --native-dense-gguf
      choose other files.
  - d: D030
    text: 'Which per-layer tensors are served natively: attn_qkv, attn_gate, ssm_out, attn_q, attn_k, attn_v, attn_output,
      and the three shared-expert matrices; plus the PLE key in four types.'
  - d: D031
    text: STRATA_HC_Q8 is turned on by default on CUDA when the shards carry the hyper-connection projections as Q8_0; a
      value the user set is kept.
  - d: D032
    text: The token embedding stays in page-locked host memory by default; STRATA_EMBED_VRAM=1 puts it on the card.
  - d: D033
    text: The output head is on the card unless the startup sizing moves it to page-locked host memory as its last resort.
- part: startup-memory-sizing
  does: Give the expert cache the device memory that remains after weights, session, drafter and output head, minus a reserve
    and minus later allocations priced in advance; and when that is too little, step down through fixed last resort before
    ending the start.
  types:
  - memory-planning
  decisions:
  - d: D034
    text: Device memory left free once everything is loaded.
  - d: D035
    text: Device memory the load allocates after the cache that no setting prices; left out of the cache unless that would
      take it below the minimum slot count. Zero under STRATA_DEFAULTS=026.
  - d: D036
    text: slots = (free - reserve - late) / largest slot when that is at least the minimum and positive, else (free - reserve)
      / largest slot; reserve = vram-reserve + prompt buffers + draft head bind size + pipeline windows; capped by the number
      of ranked pairs in the expert profile.
  - d: D037
    text: 'Price of the prompt path''s own buffers when it does not borrow cache slots: 160 + chunk * 680 / 1024 MiB; STRATA_OWNED_PRICE=exact
      prices the real allocation plus 64 MiB.'
  - d: D038
    text: 'Least working cache: slots for a 256-token prompt chunk''s buffers plus the slots a loan leaves behind, or 1
      without a borrowing prompt path.'
  - d: D039
    text: Slots a loan to the prompt path leaves in the cache.
  - d: D040
    text: Lowest value the reserve is lowered to so that the minimum cache fits.
  - d: D041
    text: Extra kept free when the prompt path is given its own small buffers.
  - d: D042
    text: For a native pack with a profile the uniform slot count becomes a byte budget, and slots of each layer's own blob
      size are taken in profile order until it is used, so the final count can exceed the uniform one.
  - d: D043
    text: After the cache is opened its slots are zeroed and free memory is read again; while more than 64 MiB short of
      the reserve the cache is reopened smaller.
  - d: D044
    text: When an automatic cache cannot be allocated it is retried at three quarters of its size.
  - d: D045
    text: 'When the automatic cache is below the minimum on one discrete GPU and the reserve was not given by hand: keep
      16 slots behind a loan; lower the reserve to the floor; give the prompt path its own buffers at 1024, 512 or 256 tokens;
      move the output head to host memory; then report what is short. STRATA_SPILL_OFF=1 and STRATA_HEAD_HOST_OFF=1 disable
      steps.'
  - d: D046
    text: --expert-cache N is kept as asked; 0 and auto both mean the automatic rule.
- part: host-memory-admission
  does: Decide at startup, from host memory readings taken before the allocations, whether the n-gram table is locked in
    RAM and whether the expert arena is loaded or replaced by the file source, and hold back page-locked memory while the
    arena registers so that later small page-locked buffers succeed.
  types:
  - memory-planning
  - resource-governing
  decisions:
  - d: D047
    text: The n-gram table is locked in RAM only if available RAM holds the table, the whole expert arena still to be filled,
      and a headroom; unknown availability, table size or expert size admits nothing. Considered only when --ple-io was
      not given and STRATA_PLE_AUTO_RAM is not 0.
  - d: D048
    text: Load when the arena's need fits; when a hard memory limit or the available RAM is below the need, fall back to
      the file source if allowed, else refuse (hard limit) or warn and load (available RAM).
  - d: D049
    text: The engine may swap the arena for the file source on its own unless --ple-io ram was given by hand, a shared arena
      file is named, or STRATA_ARENA_RAM_FALLBACK=0.
  - d: D050
    text: '--ram-keep-gib W (or STRATA_RAM_KEEP_GIB): RAM that must stay available after the arena; added to the arena''s
      need.'
  - d: D051
    text: 'RAM the reduced copy of the hottest experts leaves free: the larger of ram-keep and the safety headroom; STRATA_RESIDENT_HEADROOM_GIB
      overrides.'
  - d: D052
    text: 'Budget of the reduced RAM copy: available minus headroom, or none when that leaves under 1 GiB.'
  - d: D053
    text: Page-locked memory held while the arena registers and released right after it.
  - d: D054
    text: 'Page-locked memory held until READY or until a guarded allocation is refused: a quarter of the soft reserve,
      at least 64 MiB.'
  - d: D055
    text: A reserve that cannot be had is halved down to 16 MiB, then skipped.
- part: expert-source
  does: Make the bytes of every routed expert of every layer addressable in host memory for the whole run, either as one
    arena filled at startup or as mappings of the files that hold them, and say for each expert whether the GPU can read
    it in place.
  types:
  - expert-source
  decisions:
  - d: D056
    text: Arena by default. File source with --mmap-experts, --resident-experts or --resident-budget-gib, and automatically
      for this run when RAM is still short after the wait and the give-back.
  - d: D057
    text: The arena is filled from the GGUF shards when the pack is native, has no experts.bin, records GGUF offsets and
      --native is set; else from experts.bin.
  - d: D058
    text: Threads that fill the arena.
  - d: D059
    text: Seconds to wait for RAM an exiting program still holds, polled every 0.25 s; STRATA_ARENA_RAM_WAIT_S.
  - d: D060
    text: Large pages first (all or nothing), else ordinary pages; STRATA_NO_LARGEPAGES skips the attempt.
  - d: D061
    text: Register the whole arena with the GPU driver; if refused or capped, register layer by layer from the start until
      refusal or cap; keep the unregistered rest resident with an operating-system lock; large pages take no lock. STRATA_ARENA_PIN_GIB
      sets a cap, none, or auto; STRATA_ARENA_LOCK=0 disables the lock.
  - d: D062
    text: Under WDDM with several GPUs or remote experts at most this much of the arena is registered.
  - d: D063
    text: 'STRATA_PIN_BY_NEED=1: register chosen byte ranges (the hottest experts the GPU cache will not hold first) instead
      of a prefix. Off by default.'
  - d: D064
    text: On bare Linux a short arena still loads when a 2 MiB huge-page pool holds the whole mapping or free plus droppable
      file pages cover the need; STRATA_ARENA_FILE_CACHE=0 disables.
  - d: D065
    text: On Windows the fill bypasses the file cache when a timed probe says the files are not cached and RAM could not
      keep them cached beside the arena; STRATA_UNBUFFERED_LOAD forces either way. Always buffered elsewhere.
  - d: D066
    text: When the file source is taken automatically and an expert profile exists, a RAM copy of the hottest experts is
      also built within the reduced budget; STRATA_ARENA_FALLBACK_RESIDENT=0 keeps the plain file source.
- part: http-front
  does: Accept OpenAI- and Anthropic-shaped HTTP requests, bound how many inference calls are pending, answer every failure
    class with a defined status code, and cancel a request whose client has hung up.
  types:
  - request-front
  decisions:
  - d: D067
    text: How many inference calls may wait beyond those the engine can run at once. Unset means no bound.
  - d: D068
    text: The number of reserved inference calls above which a new one is refused with 429.
  - d: D069
    text: How long a request may wait for the engine before it is answered 429.
  - d: D070
    text: How long a streaming write may make no progress before the request ends as a disconnect.
  - d: D071
    text: How often the watcher checks whether the client closed its socket.
  corrections:
  - field: decisions
    recorded: five admission and timeout decisions; nothing on who may call
    source_shows: An API key (Bearer or x-api-key), allowed host names and CORS origins gate /v1/* (serve/server.py:7605-7744,
      9906-9911); the who-is-allowed decision is missing.
- part: prompt-builder
  does: Produce the exact prompt token ids and the token limit for a request from its messages, or refuse the request.
  types:
  - prompt-preparation
  decisions:
  - d: D072
    text: Which tokenizer runs. It is the project's own byte-level BPE in Python, built from the pack's tokenizer directory
      (vocab.json, merges.txt, token_type.json, tokenizer.json).
  - d: D073
    text: Which chat template renders the messages. The pack's own Jinja template is used if present, else the shipped one.
      It runs in a sandboxed immutable Jinja2 environment.
  - d: D074
    text: Tokens kept free between prompt plus output and the context length. The engine applies the same margin.
  - d: D075
    text: When prompt plus requested output exceeds the context, shorten the output limit to the room left instead of refusing.
  - d: D076
    text: An absent, zero or negative output limit means the rest of the context.
  - d: D077
    text: How many recent prompts are kept so that a new prompt re-encodes only what follows the last special token it shares
      with one of them.
  - d: D078
    text: Whether a non-default reasoning effort is written in a short system turn before the answer, so the cached prompt
      start stays the same. Off by default.
- part: request-runner
  does: Drive one API request through one or more engine generations and turn the token ids into reasoning, content and
    tool-call events with a final finish record.
  types:
  - output-interpretation
  decisions:
  - d: D079
    text: Which sampling value wins when several sources give one.
  - d: D080
    text: Without batch slots, one request at a time holds the engine. The turn is a plain lock polled with a timeout; arrival
      order is not enforced.
  - d: D081
    text: With thinking on and no budget given, close the thinking early enough that the answer keeps a share of the output
      limit.
  - d: D082
    text: End the reply as length when one token repeats this many times in a row.
  - d: D083
    text: When the engine reports non-finite logits before any token was sent, send the same request once more.
  - d: D084
    text: 'Opt-in: when the thinking repeats whole passages, either end the reply or continue from a rewritten prompt with
      temperature at least 1.0 and presence penalty at least 1.5.'
  - d: D085
    text: A ping is sent when nothing has gone out for this long.
- part: engine-client
  does: 'Keep one engine child process resident and in step with the server: send each generation as one text command, deliver
    its token lines to the caller, and end and restart a process that is dead, silent, frozen or fatally broken.'
  types:
  - engine-supervision
  decisions:
  - d: D086
    text: 'How the server talks to the engine: a child process started with --serve, text lines on its standard input and
      output, standard error to a log file.'
  - d: D087
    text: How long the engine may take to report READY.
  - d: D088
    text: How often a start that exits before READY for a transient reason is tried again, after 2, 4 and 8 s.
  - d: D089
    text: One more start with no drafter when a card ran out of memory; one more start with the MTP drafter when an automatically
      chosen DFlash2 drafter did not start.
  - d: D090
    text: How long a running request's engine may print nothing before it is killed. A first prompt chunk adds min(prompt,
      32768)/50 s; after a progress line the allowance is 3 times the last chunk's time.
  - d: D091
    text: An engine that prints nothing for this long and also used at most 0.5 CPU seconds and 1 MiB of I/O in that time,
      while the GPU is not busy, is killed.
  - d: D092
    text: Inside the engine, a thread aborts the process when a busy request records no progress beat for this long.
  - d: D093
    text: How often a dead engine is started again at the next request, 15 s apart.
  - d: D094
    text: After this many engine deaths from a fatal GPU error within ten minutes the engine is not started again until
      the window has passed.
  - d: D095
    text: Unload the engine after this many idle seconds. Off by default.
  - d: D096
    text: A top_k outside 1 to 64 is sent as 64, the most candidates the engine's sampled path keeps.
- part: engine-command-loop
  does: Inside the engine process, read one command at a time, run one prompt read at a time, advance every active batch
    slot one window at a time between commands, and report each generation's tokens and end figures as text lines.
  types:
  - step-scheduler
  - sequence-lifecycle
  - engine-supervision
  decisions:
  - d: D097
    text: How many sequences the engine keeps open. Zero means one request at a time.
  - d: D098
    text: The engine runs as many slot sessions as it can allocate on every stage; fewer than two turns batching off. It
      reports the number it runs.
  - d: D099
    text: The most rows one batch window holds.
  - d: D100
    text: With the opt-in slot drafts a slot takes two rows, so at most four slots are in one window and more take turns.
  - d: D101
    text: On a layer split, the slots are divided into groups that flow through the cards as a pipeline. The count must
      divide the slot count, else one group.
  - d: D102
    text: While a prompt is read beside decoding slots, after each prompt chunk the slots decode for this fraction of the
      time the chunk took.
- part: slot-scheduler
  does: With batch slots on, decide for each request whether it runs alone or in a slot, which slot, and in what order requests
    get the single prompt-reading channel, and keep the server's record of slots consistent with the engine's.
  types:
  - sequence-lifecycle
  decisions:
  - d: D103
    text: The most slots asked of the engine without a layer split.
  - d: D104
    text: How often one request's prompt read gives way to a waiting request whose prompt is at most half as long.
  - d: D105
    text: How often a request left alone in a slot returns to the solo path, and the fewest tokens it must still be allowed.
  - d: D106
    text: 'Opt-in: new requests with at most N prompt tokens take the prompt-reading channel before longer ones; a longer
      one that waited 30 s counts as short.'
  - d: D107
    text: 'Opt-in: the request holding the channel also sends up to N-1 waiting prompts so the engine reads them in one
      pass.'
  - d: D108
    text: How often a request tries another slot after the engine refused one, and how long a refused slot is kept out of
      the picks.
  - d: D109
    text: How long the control lines or a slot stay held for an engine that owes an end line and says nothing, before the
      engine is ended.
  - d: D110
    text: The turn token id, the 8192-token branch boundary and the 512-token minimum prefix used by the slot choice repeat
      engine defaults by hand; no code links them.
- part: replica-router
  does: Present several independent engine processes, each on its own group of cards, as one engine, and choose a process
    for each generation.
  types:
  - replica-routing
  decisions:
  - d: D111
    text: Whether several engines run. Off unless configured.
  - d: D112
    text: The cost of one request already running on a replica, in prompt tokens.
  - d: D113
    text: Hashes of 64-token blocks kept to track what each replica holds.
  - d: D114
    text: A dead replica is started again in the background at most this often.
  - d: D115
    text: 'Opt-in: back every replica''s expert arena with one shared memory object so the experts are in RAM once.'
- part: resume-decision
  does: For each request, choose the stored state that shares the longest valid prefix with the prompt, make the session
    hold exactly that state, and report the prefix length.
  types:
  - prefix-reuse
  decisions:
  - d: D116
    text: Reuse of any kind needs a checkpoint capacity above zero.
  - d: D117
    text: 'Which stored state wins: the live session and its checkpoints, longest first; then an idle batch slot or its
      checkpoints if strictly longer (text-only requests); then the best parked conversation if strictly longer than both.'
  - d: D118
    text: A match on a parked conversation's live state or deepest checkpoint moves the whole entry into the session; a
      match on a shallower checkpoint copies only the K/V up to that point and leaves the entry parked. No borrow with a
      layer split or past a pinned checkpoint.
  - d: D119
    text: A card that would have to create its copy stream and has less than this much VRAM free gets no restore; the prompt
      is read again.
- part: checkpoint-chain
  does: Keep a bounded set of snapshots of the running state at chosen token positions of the conversation the session currently
    holds, so a later request on the same history can rewind to one.
  types:
  - prefix-reuse
  decisions:
  - d: D120
    text: How many checkpoints the chain keeps.
  - d: D121
    text: A checkpoint is cut at the last turn token after the resume point, unless the request says ckpt=0.
  - d: D122
    text: When reading from token 0, a checkpoint is cut at the first turn token if it is at or beyond this position. Taken
      even with ckpt=0.
  - d: D123
    text: A checkpoint is cut every this many freshly read tokens, at a chunk end.
  - d: D124
    text: A request may pin one checkpoint at a given position; needs a capacity of at least 3; at most one pinned checkpoint
      at a time.
  - d: D125
    text: 'Opt-in, one GPU: an extra cut at the previous turn token if it is at or beyond 8192 tokens and within 1024 tokens
      of the turn cut.'
  - d: D126
    text: 'Opt-in, one GPU: one extra checkpoint at the last chunk boundary before the prompt''s end.'
  - d: D127
    text: 'Opt-in: drop the checkpoint whose removal leaves the smallest relative gap instead of the least recently used.'
- part: parked-conversations
  does: Hold whole images of other conversations, including their attention K/V, within a host memory budget, find the one
    with the longest valid prefix for a prompt, and evict.
  types:
  - prefix-reuse
  decisions:
  - d: D128
    text: 'The host memory the cache may take. Given by flag, else computed once at start: 40% of available memory above
      the floor, capped at 8192 MiB, rounded down to 256 MiB, zero below 1024 MiB or when memory cannot be read.'
  - d: D129
    text: The most conversations parked at once.
  - d: D130
    text: Host memory that must stay available after a park, a session save or a restore.
  - d: D131
    text: A conversation is parked only on a switch or a rewind, not on each continuing request, and before a batch slot
      is overwritten.
  - d: D132
    text: An allocation is admitted when available memory is at least the floor and the allocation fits above it. Available
      is the least of the system's figure, the room under each control-group limit and an operator cap. An unreadable figure
      refuses.
  - d: D133
    text: When the same conversation is parked again, only K/V pages after the first rewritten token are copied again.
- part: session-files
  does: On an explicit command, write the session's current conversation to one file or read one back, refusing any file
    that does not belong to this model, configuration and engine version before any state changes.
  types:
  - session-persistence
  decisions:
  - d: D134
    text: 'Exactly one checkpoint is written: the deepest, or the deepest pinned one.'
  - d: D135
    text: Disk space that must remain after a save.
  - d: D136
    text: 'Opt-in: a save short of memory first drops retained K/V, then evicts parked conversations oldest first, then
      erases checkpoints other than the one to be written and pinned ones.'
  - d: D137
    text: Session files are refused with a layer split, a peer device, batch slots, a checkpoint capacity of zero, or no
      complete live session.
  - d: D138
    text: 'What binds a file to a configuration: engine version, backend, KV format, context length, resident K/V, draft
      window, K/V rotation, position-encoding parameters, the control-vector digest and 23 arithmetic switches. Sampling,
      seeds, draft tuning, expert tier and prompt chunk are excluded.'
  - d: D139
    text: 'What binds a file to a model: for each loaded model input, its size and its first and last MiB. An edit in the
      middle of a file is not detected.'
  - d: D140
    text: With the reclaim option, the server retries a save refused for memory up to 3 times, waiting up to 30 s for memory.
- part: run-config-generator
  does: Produce a complete run configuration file for one model on this machine from machine facts and the person's answers,
    and rewrite it without losing what the person added by hand.
  types:
  - configuration
  decisions:
  - d: D141
    text: Which value wins when the file is written.
  - d: D142
    text: The expert cache size is left to the engine.
  - d: D143
    text: The speculative window and the confidence floor written by default.
  - d: D144
    text: 'The context length: 131072 recommended, capped by a memory rule, or the person''s choice.'
  - d: D145
    text: 'The K/V precision: 16-bit float at a context of 8192 or less, else 8-bit integer, or the person''s choice.'
  - d: D146
    text: Keep only a 32768-token window of K/V in fast memory when the context is 65536 or more and host memory suffices.
  - d: D147
    text: Host memory given to resident experts.
  - d: D148
    text: Hold the n-gram table in host memory when memory covers the model plus the table plus 16 GB (4 GB on a rotational
      disk).
  - d: D149
    text: 'On the GB10 machine type only: map experts from the file, a 32768-token prompt chunk, and 4-bit draft-layer options.'
  - d: D150
    text: On a CPU with more efficiency cores than performance cores, and only without a calibration, the worker count is
      P - 1 + E/2, at most 32.
  - d: D151
    text: An option in the file's argument list that differs from what setup last wrote counts as the person's and is kept,
      except the options setup re-decides from its answers.
- part: launch-argument-resolver
  does: Turn the stored run configuration into the argument list and environment the engine process actually receives, at
    every launch and every engine start, so that standing choices kept outside the list cannot be undone by whoever last
    rewrote it.
  types:
  - configuration
  decisions:
  - d: D152
    text: Which value an engine option takes at a launch.
  - d: D153
    text: A calibration record is applied at launch only if its model name, context length and image setting equal the current
      configuration's.
  - d: D154
    text: 'The order of changes at every engine start: the active tuning preset, then the person''s options again, then
      the drafter choice, then the fast-memory fit, then draft-layer, vision, layer-split, elastic and parallel additions.'
  - d: D155
    text: On this backend the only option the start-time fit changes is the size of the K/V window kept in fast memory;
      it never changes the context length or the request count, and keeps a value the person set. Nothing is fitted on a
      layer split or with several cards.
  - d: D156
    text: One drafter is chosen per run and the drafter options are rewritten to match.
  - d: D157
    text: The engine's environment names the cards by bus order and restricts it to the configured cards; library folders
      come first on the search path.
- part: speed-calibration
  does: Measure on this machine, with the real engine and on demand, which of a bounded set of settings is faster, keep
    a non-default value only when it beats the default by more than measurement noise, and store the result for later starts.
  types:
  - calibration
  decisions:
  - d: D158
    text: 'What the calibration measures: decode tokens per second from the engine''s own decode time, over 3 fixed prompts
      of 128 new tokens at temperature 0. On a layer split it also measures prompt read speed for the chunk-pipelining option.'
  - d: D159
    text: 'What the calibration sweeps: the share of routed experts read over the link, the speculation confidence floor
      (both per request, without a restart), then the CPU worker count and adaptive-tier settings (one engine restart each).'
  - d: D160
    text: A non-default value is kept only if it beats the default by more than this in an interleaved confirmation.
  - d: D161
    text: 'When the calibration runs: only on request (setup --calibrate, an offer at the end of a first install on NVIDIA,
      or the engine calibrate command).'
  - d: D162
    text: The auto-tuner changes one setting at a time and accepts a change when the median per-round ratio exceeds 1 +
      max(0.03, twice the measured noise, twice the drift), every round is faster, and prompt speed loses at most 2%.
  - d: D163
    text: The auto-tuner's time budget.
  - d: D164
    text: Only settings the project labels as leaving answers identical are chosen automatically; settings labelled as changing
      placement or as not repeatable need an explicit opt-in.
  - d: D165
    text: A preset is not applied when the GPU, CPU, RAM (by more than 10%), link, model digest or backend changed; it is
      applied with a re-check offered when the engine's tuning epoch, the driver or its age changed.
- part: engine-diagnostics
  does: Inside the engine process, count which kernel variants and window graphs were chosen, record what the run selected
    at start, and sample batch windows, writing each only when asked by an environment variable.
  types:
  - telemetry
  decisions:
  - d: D166
    text: Whether choices are counted. On by default.
  - d: D167
    text: Whether the counts are written as a file at process exit. Off unless a path is given.
  - d: D168
    text: Whether a record of the engine choice, budgets, fast paths taken or declined and tensor formats is written. Off
      unless a file is named. Written before READY and again after a request that changed something.
  - d: D169
    text: Whether batch windows and per-stage in-flight time are sampled, at most once a second, as BSTAT and PSTAT lines.
      Off by default.
  - d: D170
    text: Whether research counters of the batch loop are printed to the log when it goes idle. Off by default.
- part: server-metrics
  does: In the server process, turn the engine's end-of-request figures and the server's own clocks into per-request records,
    running totals and a live rate, fill the usage and timings of each response, sample the machine once a second, and render
    all of it for outside monitors.
  types:
  - telemetry
  decisions:
  - d: D171
    text: Tokens per second of a finished request is the engine's generated count divided by the engine's decode time, which
      runs from the end of the prompt read to the last token and so includes the first window. Not reported for fewer than
      2 tokens.
  - d: D172
    text: Prompt tokens per second is tokens read divided by the engine's prompt time, which starts after the request line
      is parsed and includes restoring stored conversation state.
  - d: D173
    text: The live rate is the token count gained over the last 2 s of samples; before 0.25 s of span it is the mean so
      far.
  - d: D174
    text: Time to first token is not in any API response. It is a histogram (from passing the queue and loading to the first
      engine token, server wall clock) and a history field (from entering the queue to the first engine token).
  - d: D175
    text: The inter-token latency histogram records each finished request's mean gap, once per gap; it has no spread within
      a request.
  - d: D176
    text: How often GPU, CPU, RAM and disk readings are taken, and how many are kept per series.
  - d: D177
    text: How many finished requests and transition events are kept.
- part: mtp-drafter
  does: From the verify window's final hidden rows and the tokens that followed them, produce draft tokens with a probability
    each, and keep the draft layer's own attention K/V complete for every accepted position.
  types:
  - draft-proposal
  decisions:
  - d: D178
    text: Rows the drafter's graphs hold.
  - d: D179
    text: 'Most drafts in one round: the smallest of rows minus 1, the configured cap, and the cells left in the context.'
  - d: D180
    text: Configured cap on drafts per round.
  - d: D181
    text: 'When the draft chain stops before the cap: at the first draft whose probability is below --spec-min-p, or when
      the draft policy''s cost rule says so.'
  - d: D182
    text: How many of the latest cells the draft layer attends to.
  - d: D183
    text: 'Which rows of the verified window get their draft K/V written: accepted rows only, or all rows (STRATA_MTP_CATCHUP_ALL=1).'
  - d: D184
    text: The token subset the draft head covers. Drafts can only be tokens in the subset.
  - d: D185
    text: Whether the draft K/V is a ring of window + 4 x rows + 64 cells over a pinned host copy, or fully resident when
      pinned memory is short.
  - d: D186
    text: Whether drafts are sampled with the request's sampler chain instead of taken as the argmax.
- part: dflash2-drafter
  does: Produce 7 draft tokens in one forward pass of a separate 5-layer drafter model that reads the target model's hidden
    states at five layers, and keep its context ring to committed rows only.
  types:
  - draft-proposal
  decisions:
  - d: D187
    text: Whether this drafter is loaded.
  - d: D188
    text: 'Widest verify window for this drafter by card class: 8 for unified-memory cards, 8 for compute capability 12.0
      with at least 48 GB, 6 for other capability 12, no cap otherwise.'
  - d: D189
    text: The window ends where the product of the selector's probabilities falls below --draft-conf.
  - d: D190
    text: Skip the draft round when the lookup match is at least this many tokens.
  corrections:
  - field: decisions
    recorded: Skip the draft round when the lookup match is at least this many tokens.
    source_shows: The skip is decided by the draft-policy rule skip_draft_for_lookup in include/strata/spec/window_rule.hpp,
      called from the host loop (src/program/generate.cpp:18893-18905, 20899-20913); it belongs to draft-policy.
- part: lookup-drafter
  does: Propose the tokens that followed the longest earlier occurrence of the text's current ending, with the match length,
    using no model weights.
  types:
  - draft-proposal
  decisions:
  - d: D191
    text: Shortest match that produces a proposal.
  - d: D192
    text: Longest match length counted.
  - d: D193
    text: Most recent end positions kept per trigram.
  - d: D194
    text: History tokens the index is sized for.
  - d: D195
    text: Tokens a lookup may append after the neural drafts in the same window, and the shortest match it extends on.
- part: draft-policy
  does: Choose, for each round, where the verify window's drafts come from and how wide the window is, so that committed
    tokens per measured millisecond is highest; and under automatic drafter selection, which neural drafter a request uses.
  types:
  - draft-policy
  decisions:
  - d: D196
    text: How much better a lookup or chained window must be than the neural drafter's window to be taken. The cost-aware
      window uses a third of it.
  - d: D197
    text: Whether the MTP window width is chosen step by step from each draft's probability and the measured cost of each
      width.
  - d: D198
    text: Which window sizes a lookup or chained window may use. A size whose window graph finds no GPU memory is dropped
      for the rest of the process.
  - d: D199
    text: When a neural drafter is loaded, a lookup window is considered only if its first token equals the neural drafter's
      first draft. Not required in probabilistic mode.
  - d: D200
    text: Without the cost-aware window, the MTP window ends before the first draft whose probability is below --spec-min-p.
  - d: D201
    text: 'Under --draft auto, the drafter of a request that names none: df2, mtp or learn.'
- part: draft-verifier
  does: Given the full model's target token for every row of a window, accept the longest prefix of drafts that agree, and
    make exactly that prefix permanent in indexer keys, recurrent state, convolution history and n-gram history.
  types:
  - draft-verification
  decisions:
  - d: D202
    text: 'How a draft is judged. Greedy: equal to the row''s argmax. Sampled, default: equal to the row''s sample drawn
      from a random stream keyed by seed and position. Sampled with STRATA_SPEC_PROB=1: accepted with probability min(1,
      p/q), else replaced by a sample from the positive part of p minus q.'
  - d: D203
    text: 'Under STRATA_SPEC_PROB=1, which confidence gate: pick (masked, not renormalised draft measure with a no-candidate
      tail) or top (gate on the largest probability before the draw).'
  - d: D204
    text: The pick gate's exact rule is used only with serial decode on one device, no lookup chain, no adaptive swaps,
      no PCIe share, no cost-aware window, no DFlash2, a window of at most 8 rows. Otherwise the older rule runs and the
      engine warns that its distribution is off when the gate fails.
  - d: D205
    text: A one-row window advances the state inside the window graph and no commit graph is launched.
  - d: D206
    text: The commit graph is launched without waiting; anything that reads the session from elsewhere waits for it first.
  - d: D207
    text: All recurrent layers commit in two launches and all attention layers' indexer restore and re-append in one.
- part: window-loop
  does: Run one window of 1 to max_t tokens through the layers and the output head as a single replayed graph, and serve
    each layer's host-side expert work when the GPU signals that the layer's routing is known.
  types:
  - step-execution
  decisions:
  - d: D208
    text: 'Per window: the zero-doorbell graph when the host residency table shows every expert of the stage in fast memory,
      otherwise the doorbell graph. Checked before each window.'
  - d: D209
    text: Whether the window's rows go through multi-row kernels (STRATA_DEC_BATCH).
  - d: D210
    text: Whether the window is split into two token groups whose CPU and GPU work are pipelined (--spec-split).
  - d: D211
    text: How long the host waits for a layer signal before it enters the driver once to flush and check for a fault.
  - d: D212
    text: How long a layer may stay silent before the window is abandoned and the GPU's waits are force-released.
  - d: D213
    text: 'When the window''s n-gram rows are gathered. Doorbell graph: after layer 0''s CPU experts are served and before
      the layer-0 flag is raised. Zero-doorbell graph: right after the launch, or before it when STRATA_VERIFY_EARLY_PLE_FLAG
      says so (0 on CUDA).'
- part: session-loop
  does: For one token on a canonical Q2_0 pack, launch the layers in order and place the CPU's expert rows between each
    layer's routing and its combine, so that a layer's experts meet that layer's router weights.
  types:
  - step-execution
  decisions:
  - d: D214
    text: 'Three forms: one graph per token with a device-side wait per layer (default when it can be captured); two graphs
      per layer with a host poll per layer (--no-token-graph, dumps, or a hit path the token graph cannot hold); direct
      kernel launches (--no-capture).'
  - d: D215
    text: 'Token graph: how long a late layer signal waits before one driver call (STRATA_TG_FLUSH_US).'
  - d: D216
    text: 'Token graph: time after which a silent layer is an error.'
- part: layer-kernels
  does: Compute the part of each layer every token needs, in a fixed order, and keep the per-sequence state those kernels
    read and write at fixed device addresses.
  types:
  - layer-compute
  - recurrent-state-store
  - positional-state-store
  decisions:
  - d: D217
    text: Residual read (attention half), mixer (attention on 12 layers, recurrent on 36), residual write, residual read
      (feed-forward half), router and publish, shared expert, then after the host or the GPU has supplied the expert rows
      the combine and the residual write. On layer 1 the n-gram block updates the residual first.
  - d: D218
    text: Norm, key and value projections, append to the key and value store, append to the indexer, query projection, block
      scores, block top-k, make the selected blocks resident, attention, gate, output projection.
  - d: D219
    text: The shared expert runs right after the layer signal so that the GPU computes it while the host runs the CPU experts.
  - d: D220
    text: The residual read folds in the previous half's pending write. On only with the native projection contract and
      no dump or stage timing.
  - d: D221
    text: The session arena is sized once from the context length, the layer range and the key and value storage plan; nothing
      is allocated on the token path.
- part: expert-router
  does: For each token in each layer, turn the feed-forward input into 512 logits and choose 10 experts with renormalised
    weights, on the device inside the recorded graph.
  types:
  - layer-compute
  decisions:
  - d: D222
    text: 'Which top-10 kernel runs. Without the --native preset: the generic kernel (router_top10.cu). With it, for 512
      experts and 10 picks: the fused native kernel (native_router.cu), in its multi-row form for a window of more than
      one row. The window loop requires the preset, so native packs use the native kernel.'
  - d: D223
    text: 'STRATA_ROUTE_PRIOR=lambda: pick the 10 again with a logit bonus for experts resident in fast memory; the weights
      stay the router''s own.'
  - d: D224
    text: 'STRATA_ROUTE_RESIDENT: swap a non-resident expert at a tail rank for a resident one within a logit margin.'
- part: window-graphs
  does: Record the fixed sequence of device work once and keep the recorded graphs available for replay, freeing and re-recording
    them when fast memory for a new one runs out.
  types:
  - graph-capture
  decisions:
  - d: D225
    text: 'Window loop: one graph per window size, holding all layers and the head, in two variants (zero-doorbell and doorbell),
      recorded on first use or ahead of it, plus one commit graph. Session loop: one graph per token, or a first-half and
      a combine-half graph per layer.'
  - d: D226
    text: 'When instantiating a graph reports out of memory: first free the least recently used batch-layout graphs; then,
      for a single-request window, free the graph of the largest other window size that is neither the one being recorded
      nor one already launched ahead. A freed size is recorded again when next used.'
  - d: D227
    text: Upper bound on recorded batch layouts (0 means unbounded).
- part: kv-store
  does: Hold the attention keys and values of every position of each attention layer in the configured format, reachable
    through a page table, and when streaming is on make every block a selection names resident in fast memory before the
    attention reads it.
  types:
  - positional-state-store
  - state-tiering
  decisions:
  - d: D228
    text: 'Storage format, with bytes per position per attention layer: fp16 2048, int8 with one scale per 64 values 1056,
      rotated 4-bit 576, 8-bit keys with rotated 4-bit values 816.'
  - d: D229
    text: Positions per attention layer kept in fast memory (--kv-resident). 0 keeps every position there and makes the
      resolve step a no-op. Streaming applies only when the window is smaller than the context.
  - d: D230
    text: The smallest resident window a streamed layer may have (STRATA_KV_RESIDENT_MIN, at least 1024).
  - d: D231
    text: Positions per page; one page is one indexer block.
  - d: D232
    text: With --kv-grow (fully resident, single GPU only) the pages get addresses for the whole context but physical memory
      only for the first 16384 positions; more is mapped as the context grows, from chunks the expert cache gives up.
  - d: D233
    text: The draft layer's state keeps only its window of pages in fast memory at block modulo slots, with a host copy
      for resume.
- part: ngram-reader
  does: For each token, compute its 16 row numbers from the token and its two predecessors and deliver those 16 rows of
    the n-gram table as 2560 floats before layer 1 needs them.
  types:
  - row-source
  decisions:
  - d: D234
    text: 'How rows are read. Unless --ple-io is given: the table is held locked in memory when available memory is at least
      the table plus the expert arena still to be filled plus 8 GiB, measured before either is allocated; otherwise unbuffered
      direct reads. Unknown figures admit nothing. STRATA_PLE_AUTO_RAM=0 keeps direct reads. A third mode maps the table
      without locking.'
  - d: D235
    text: Outstanding storage reads (--ple-inflight, 1 to 1024).
  - d: D236
    text: Rows kept after being read, 8-way set-associative with round-robin replacement (--ple-row-cache, 0 disables).
  - d: D237
    text: 'Direct mode with the worker: after this long without a read, read one random page of the table, until 60 s after
      the last request for rows (STRATA_SSD_KEEPALIVE, 0 off).'
  - d: D238
    text: Direct reads are probed at start; below 15000 rows per second the engine warns and switches to mapped reads only
      when STRATA_PLE_AUTO_MMAP=1.
  - d: D239
    text: Row number = (XOR over the n-gram of token id times a per-position multiplier) modulo the head's vocabulary size
      plus the head's offset; 8 bigram heads and 8 trigram heads; a missing or end-of-sequence predecessor cuts all older
      context.
- part: output-head
  does: 'Turn the residual after the last layer into one row of vocabulary logits per position: a final residual read, then
    the vocabulary projection.'
  types:
  - layer-compute
  decisions:
  - d: D240
    text: The projection reads the head in the model file's own format when the --native preset loaded it, otherwise in
      the pack's format with an 8-bit activation image.
  - d: D241
    text: 'Window loop: inside the window graph, in column chunks for long windows. Session loop: called by the driver after
      the layer loop, followed by a device synchronisation and by default a full logits read-back and a scan for non-finite
      values.'
- part: sampler
  does: 'Turn each position''s logits into one token id by a fixed chain: logit bias, penalties, top-k, top-p, min-p, temperature,
    pick.'
  types:
  - sampling
  decisions:
  - d: D242
    text: 'Greedy: inside the window graph, at no extra launch or synchronisation. A sampled, penalised or biased request:
      again outside the graph after the window has finished, with the request''s own settings, followed by a synchronisation.
      Session loop: once per token after the head.'
  - d: D243
    text: A request without settings is greedy in the window loop. The parameter defaults are top-k 20, top-p 0.95, min-p
      0, temperature 1.0, penalties off.
  - d: D244
    text: The random draw of a row is a counter-based generator keyed by the seed and the row's absolute position.
  - d: D245
    text: 'Three implementations of the sampled chain that pick the same token: split top-k (default), one block per row
      (STRATA_SAMPLER_ONE_BLOCK, and where the split cannot run), the older kernel (STRATA_OLD_SAMPLER).'
  - d: D246
    text: Penalties count only the current reply unless STRATA_PENALTY_PROMPT=1; each window row gets its own history ending
      with the drafts before it.
- part: cpu-expert-pool
  does: Compute a batch of expert evaluations on CPU cores, reading each expert's bytes in place, and return only when every
    job is done and every worker is parked again.
  types:
  - secondary-compute
  decisions:
  - d: D247
    text: 'Default: physical cores on the host thread''s socket minus one for the host; one more kept free when that is
      16 or more; on a hybrid CPU with more efficiency than performance cores at most performance cores minus one plus half
      the efficiency cores; at most a container''s CPU quota minus one; never above 32. A configured count runs as given
      with a warning.'
  - d: D248
    text: The host thread claims jobs itself during a batch.
  - d: D249
    text: Row ranges a phase is cut into (--pool-tasks, 0 to 4096).
  - d: D250
    text: A parked worker spins this long, then sleeps on a condition variable (STRATA_POOL_SPIN_US).
  - d: D251
    text: A wait that sees no progress this long stops the process after releasing the GPU's waits.
  - d: D252
    text: 'Single-token path: one job per missed expert, whole or split by rows across threads. Window path: one job per
      distinct missed expert carrying every token routed to it, in two row phases (gate and up rows, then down rows) with
      a quantisation between.'
  - d: D253
    text: With two or more memory nodes the row phases are split one slice per node when that can run (STRATA_NUMA_POOL=0
      turns it off).
candidates:
  expert-cache:
  - id: expert-cache#01
    kind: sizing
    what: total size and whether it can grow or shrink while running
  - id: expert-cache#02
    kind: format
    what: fixed slots or sized per block
  - id: expert-cache#03
    kind: placement
    what: one region or several with different roles
  - id: expert-cache#04
    kind: failure
    what: what is done when it is full and nothing can be released
  - id: expert-cache#05
    kind: policy
    what: the key that identifies a cached block
  - id: expert-cache#06
    kind: failure
    what: what is done when the cache cannot be allocated at its planned size
  - id: expert-cache#07
    kind: policy
    what: whether it arranges, compacts or pins what it holds by size
  - id: expert-cache#08
    kind: sizing
    what: how many uses of cached blocks may be open at once
  - id: expert-cache#09
    kind: policy
    what: which part is released or regrown first under memory pressure
  expert-dispatch:
  - id: expert-dispatch#01
    kind: policy
    what: the order in which the ways are tried
  - id: expert-dispatch#02
    kind: policy
    what: whether low-ranked selections may be omitted
  - id: expert-dispatch#03
    kind: threshold
    what: the share of misses fetched now against left to another device
  - id: expert-dispatch#04
    kind: timing
    what: computing resident blocks while absent ones arrive
  - id: expert-dispatch#05
    kind: threshold
    what: when computing resident blocks ahead of absent ones is switched on
  - id: expert-dispatch#06
    kind: policy
    what: whether the split is decided from a snapshot of what is ready at the start of the layer
  - id: expert-dispatch#07
    kind: threshold
    what: the share of selected blocks already in fast memory above which omitting low-ranked selections is off by default,
      and the weight formats for which it is never on
  residency-policy:
  - id: residency-policy#01
    kind: policy
    what: fixed from an offline ranking, or adjusted from use while running
  - id: residency-policy#02
    kind: policy
    what: the replacement rule
  - id: residency-policy#03
    kind: timing
    what: on every miss or at intervals
  - id: residency-policy#04
    kind: threshold
    what: the gain a change must bring, and a limit on changes per round
  - id: residency-policy#05
    kind: policy
    what: what the cache holds before any request
  - id: residency-policy#06
    kind: policy
    what: whether a region changes role with load
  - id: residency-policy#07
    kind: failure
    what: what is done when every candidate for replacement is still in use
  - id: residency-policy#08
    kind: failure
    what: which ranking is used when no recorded ranking matches the model
  - id: residency-policy#09
    kind: policy
    what: how use counts age, so that recent use outweighs old use
  - id: residency-policy#10
    kind: threshold
    what: the least use that qualifies a block to enter
  - id: residency-policy#11
    kind: policy
    what: whether warming at startup is used at all, per model
  - id: residency-policy#12
    kind: timing
    what: what event changes the role of a region, such as the size of the coming work
  expert-fetch:
  - id: expert-fetch#01
    kind: sizing
    what: staging area and how many fetches at once
  - id: expert-fetch#02
    kind: timing
    what: whether it fetches ahead of selection, and from what prediction
  - id: expert-fetch#03
    kind: timing
    what: how fetching overlaps with computation
  - id: expert-fetch#04
    kind: policy
    what: one reader shared with other reads or its own
  - id: expert-fetch#05
    kind: failure
    what: what is done when a read fails or is short
  - id: expert-fetch#06
    kind: precedence
    what: fetches the current computation needs over those made ahead
  - id: expert-fetch#07
    kind: policy
    what: how outstanding reads are ordered and joined
  - id: expert-fetch#08
    kind: policy
    what: 'the mechanism used: explicit read, a hint to the operating system, or touching a mapping'
  - id: expert-fetch#09
    kind: format
    what: blocks copied as stored or transformed on the way
  - id: expert-fetch#10
    kind: policy
