# Written by tools/so_nodetypes_experiments.py packets. Read validation/choices/BRIEF.md first.
engine: splash
decisions: 136
parts:
- part: model-installer
  does: Offline, selects a target repository and the DFlash2 draft trained for its family, derives config and tokenizer
    metadata from a GGUF header, pins the Hub snapshots and publishes an immutable assembly directory of links plus a model.json
    naming every file's digest.
  types:
  - model-conversion
  decisions:
  - d: D001
    text: which draft goes with which target family (by config, never by repository name)
  - d: D002
    text: whether to include the vision tower (--language-only)
  - d: D003
    text: when to follow the Hub versus use pinned snapshots
- part: model-inspection
  does: At each start, finds the family whose rules the target configuration fits, validates target, draft and vision sources
    against the assembly record's digests, and fixes the model's capabilities (window, YaRN, stop tokens, sparse KV shape).
  types:
  - model-loading
  decisions:
  - d: D004
    text: which family a configuration describes
  - d: D005
    text: whether to stretch context with YaRN (static factor for all requests)
- part: device-probe
  does: Reads the GPU family, core count, macOS version, unified memory and the recommended working set, classifies the
    GPU as Apple9 or Apple10, and refuses unsupported Macs.
  types:
  - configuration
  decisions:
  - d: D006
    text: which GPU class a family number maps to
  - d: D007
    text: what core count to assume when none is reported
- part: weight-layout-planner
  does: 'From file metadata alone, plans each weight image: section offsets, row order (GDN value heads regrouped by key
    head), which tensors become GPU-repacked planes, which are copied, and which parts (routed experts, PLE table) are left
    out to stream.'
  types:
  - model-loading
  decisions:
  - d: D008
    text: which formats are accepted and kept native versus converted
  - d: D009
    text: which tensors are widened or recast (norms as F32 1+w, GDN decay, shared-expert gate to F32)
  - d: D010
    text: which parts are left out of the image to stream
- part: weight-image-loader
  does: Writes every planned image into its own Metal buffer by reading source rows with F_NOCACHE and having the GPU repack
    them into planes, quantizes the BF16 draft into 4-bit af4g64 planes, and checks afterwards that no source was written
    meanwhile.
  types:
  - model-loading
  decisions:
  - d: D011
    text: bypass the page cache for reads
  - d: D012
    text: repack on GPU through a fixed staging buffer
  - d: D013
    text: quantize the draft at load rather than ship it quantized
- part: weight-residency
  does: After an idle period with no request, releases the weight images, the expert store's chunks and staging, and the
    ANE program; on the next request restores them one part per engine tick before any request runs.
  types:
  - resource-governing
  decisions:
  - d: D014
    text: how long idle before release (--idle-release, or off)
  - d: D015
    text: restore one part per tick so frames and timed checks still run
  - d: D016
    text: abandon a restore when no request waits and memory is refused
- part: streamed-parts-planner
  does: Before the model loads, decides from the engine budget whether MoE routed experts and the PLE table load whole or
    stream from SSD, sizes their stores and floors, and sizes the floors of KV spill for a sparse-attention target.
  types:
  - memory-planning
  decisions:
  - d: D017
    text: KV allowance first (64K tokens or --max-context), then experts whole, then PLE table, then the rest
  - d: D018
    text: 'expert floor share: all slots when KV can spill, else a fixed share'
  - d: D019
    text: replan with fewer streamed parts when that streams more
- part: memory-plan
  does: Computes the engine's hard Metal budget (recommended working set less a margin, optionally lowered by --max-memory),
    the host reserves, the fixed floors, the KV page and extent geometry, and the longest context one request may take,
    which is a result of the plan.
  types:
  - memory-planning
  decisions:
  - d: D020
    text: working-set margin rule
  - d: D021
    text: host available and spare reserves as shares of physical memory
  - d: D022
    text: context bound by model window, resident memory, or spill and disk
- part: memory-governor
  does: 'Is the sole admission for every Metal allocation: grants a short-lived byte reservation inside a claim''s scope
    if it fits under the engine limit (less what higher-ranked waiting claims hold) and the host rule admits it for the
    claim''s class, else refuses with the cause.'
  types:
  - resource-governing
  decisions:
  - d: D023
    text: estimate of host available and spare memory, counting a capped compression credit unless pressure is critical
  - d: D024
    text: 'per-class host rule: floor work always, in-service work keeps the margin at normal pressure, elective work also
      needs to be outside the band'
  - d: D025
    text: critical pressure refuses everything and triggers a host claim each settle period
  - d: D026
    text: pool growth admitted on its net change when cache funds it
- part: memory-ledger
  does: Keeps every open memory claim with its rank and class, decides what each claim may take, and frees what it lacks
    from heterogeneous holders in one fixed order, and grows elastic pools toward their caps when quiet.
  types:
  - resource-governing
  decisions:
  - d: D027
    text: 'reclaim order: free-now cache, rebuild-only pools, cache needing a write, own conversion to spill or the paused
      command, expert chunks above floor, units in use, next lane''s start buffers'
  - d: D028
    text: take rights per claim class, timing and priority (no pool unit below a higher-priority lane in service)
  - d: D029
    text: 'claim rank: priority, decoding before prefill, completed tokens, earlier submission'
  - d: D030
    text: wait a quiet period before regrowing pools
- part: bootstrap-sequencer
  does: Runs the start in fixed stages (configuration, backend, capability check, model loading, memory planning, storage
    allocation, maximum-prefill and decode warmup, composite state restore from a persistent tier, memory audit) and reports
    Ready or a classified start failure.
  types:
  - engine-supervision
  decisions:
  - d: D031
    text: retry temporary host or driver allocation failures within a window that opens at the first failure
  - d: D032
    text: warm up on the runway pages without allocating KV
- part: ane-ffn-calibrator
  does: At start, for a dense target only, times the FFN split at two ANE shares and the GPU alone on a few layers, fits
    T(s) = max(A(s), G(s) + u A(s)), and picks the ANE's channel share and least chunk rows, or none; persists the result
    keyed by layer shapes, device, macOS version, build and allowed units.
  types:
  - calibration
  decisions:
  - d: D033
    text: the minimum predicted gain to enable the split
  - d: D034
    text: the chunk-noise tolerance for the least rows
  - d: D035
    text: remember a no-gain result too
- part: ane-ffn-split
  does: During a dense target's prefill, runs the leading intermediate channels of each FFN layer on the GPU and the rest
    as a W8A8 program on the Neural Engine (int8 weights requantized by the GPU one layer ahead into shared IOSurfaces),
    ordered by a shared event, and adds the ANE's partial down projection to the GPU's.
  types:
  - secondary-compute
  decisions:
  - d: D036
    text: which program function size a chunk uses
  - d: D037
    text: stop the split on any ANE failure, timeout or non-finite value
  - d: D038
    text: stop it when a window of commands shows no gain
- part: kernel-selector
  does: When each command is encoded, picks for every projection, MoE block and attention the kernel tile (register, staged,
    prefill, float tile) and the K-split count and gate/up pass mode, from the GPU class, core count, weight formats, lane
    count and rows, using a per-class table of measured constants and a wave-law cost model.
  types:
  - device-backend
  decisions:
  - d: D039
    text: register tile versus staged tile by a per-class boundary on column tiles times lanes
  - d: D040
    text: split count by tier law (Apple9, register) or wave law minimizing predicted time (Apple10 staged)
  - d: D041
    text: one or two passes for a gate/up pair
  - d: D042
    text: staged tile versus prefill tile by chunk rows
- part: metal-command-backend
  does: Encodes command graphs into Metal command buffers split at event signals and host steps, declares residency per
    encoder only for the buffers its address tables reach, keeps a residency set wired by a heartbeat, optionally spins
    one GPU thread through short host steps, and fails a command that makes no progress.
  types:
  - device-backend
  decisions:
  - d: D043
    text: bound versus addressed buffer reach
  - d: D044
    text: per-encoder residency instead of queue residency
  - d: D045
    text: spin the GPU through short host steps or not (checked at start)
  - d: D046
    text: heartbeat and keep-alive of the residency set
- part: target-forward
  does: 'Computes the target model for a prefill chunk or a verify block: embedding, hybrid GDN and attention layers (sinks
    and sliding windows for Flint), dense or MoE FFN with routing, hyper-connected residual streams and PLE n-gram injection
    for Flash-Next, capture of the draft''s chosen layer outputs, final norm and vocabulary projection.'
  types:
  - layer-compute
  decisions:
  - d: D047
    text: router weighting (softmax or sigmoid-normalized)
  - d: D048
    text: verify rows routed for MoE
  - d: D049
    text: GDN value-head order
- part: block-sparse-indexer
  does: For Flash-Next's attention layers, scores pooled block keys and picks the top blocks each row attends, and pools
    the keys of blocks the step completes into the page's index plane.
  types:
  - layer-compute
  decisions:
  - d: D050
    text: how many top blocks to attend (model-defined)
- part: vision-encoder
  does: Runs the vision tower on an image's pixels inside the prefill command that first reaches the image, producing embedding
    rows that replace the image placeholder tokens.
  types:
  - modality-encoding
  decisions:
  - d: D051
    text: build the arena only when an image waits
  - d: D052
    text: the per-image patch cap from --max-image-pixels
- part: image-embedding-cache
  does: Keeps encoded image rows by content digest and grid, shared by repeated placements and concurrent requests, and
    gives the least recently used unheld entries back to the ledger.
  types:
  - modality-encoding
  decisions:
  - d: D053
    text: least recently used first
  - d: D054
    text: entries something holds form the floor
- part: expert-store
  does: Holds routed experts in slots grouped by expert size, in a floor chunk plus about 1 GiB elastic chunks, with per-block
    slot tables the MoE kernels read; gives its last elastic chunk back under pressure (compacting experts below it) and
    takes chunks back when memory is ample.
  types:
  - expert-cache
  decisions:
  - d: D055
    text: which size's chunk to release (largest share above floor) or regrow (smallest share)
  - d: D056
    text: release one chunk, or all to floor under critical pressure
  - d: D057
    text: a size used by only one block holds all its experts in its floor
- part: slot-recycler
  does: Chooses which slot a missing key takes by adaptive replacement over recently-once and recently-again lists with
    ghost lists, never a slot the same load uses, treating long prefill chunks as scans.
  types:
  - residency-policy
  decisions:
  - d: D058
    text: adapt T1's target share on ghost hits
  - d: D059
    text: scans leave no ghosts and move no hits
- part: expert-loader
  does: After routing in a streamed layer, a host step inside the command claims slots for non-resident routed experts,
    reads their native rows from the source files into staging (directly with F_NOCACHE where stored as-is), and a GPU repack
    kernel moves them into slots before the expert kernels run.
  types:
  - expert-fetch
  decisions:
  - d: D060
    text: one round for decode, half the staging per round for prefill
  - d: D061
    text: read straight from file versus build rows
- part: expert-read-ahead
  does: 'While the GPU runs, reads ahead into the free staging the experts most likely next: the next round''s, or after
    a decode step the next block''s experts its router picks from this block''s input, ranked by summed routing weight;
    for a long prefill chunk the whole next block.'
  types:
  - expert-fetch
  decisions:
  - d: D062
    text: which experts to read ahead and in what order
  - d: D063
    text: read-ahead piece size
- part: ssd-reader-pool
  does: Runs the engine's single pool of reader threads for every SSD read a step needs (experts, PLE rows, spilled KV),
    with foreground batches ahead of background ones and one retry per task.
  types:
  - storage-reader
  decisions:
  - d: D064
    text: foreground before background
  - d: D065
    text: hold drive writes back while a foreground batch runs
- part: ple-row-store
  does: Keeps Flash-Next's n-gram embedding table in its GGUF and, before each command, stages every distinct row the command
    needs from a bounded host row cache (reading misses on the SSD readers) into memory the GPU reads.
  types:
  - row-source
  decisions:
  - d: D066
    text: row cache size
  - d: D067
    text: prefetch as a hint
- part: kv-page-pool
  does: Allocates attention K/V in pages of 32 tokens inside extents of about 128 MiB of one page form (Full, Index-only,
    or Slim), INT8 with per-token scales by default, reached by kernels through per-request GPU page tables; releases empty
    extents between commands and compacts pages to empty extents.
  types:
  - state-pool
  - positional-state-store
  decisions:
  - d: D068
    text: KV format for the whole run
  - d: D069
    text: extent size target
  - d: D070
    text: release empty extents only between commands
  - d: D071
    text: compact by moving pages
- part: gdn-state-cells
  does: Holds each lane's fixed-size GDN convolution and recurrent state in two cells plus a tape of the last decode step's
    layer inputs, and the target's auxiliary state (indexer pending keys, PLE history); a committed step only records pending
    rows and swaps cell parity, and the next step folds the taped rows in first.
  types:
  - recurrent-state-store
  decisions:
  - d: D072
    text: state storage format for the run
  - d: D073
    text: defer the fold to the next step instead of copying
- part: draft-state
  does: Keeps per lane the draft's ring K/V of the last sliding-window positions, computed from target layer captures, and
    a context window of the rows the ring is computed from, which cached states keep instead of the ring and from which
    a restore recomputes it.
  types:
  - positional-state-store
  decisions:
  - d: D074
    text: cache the window, not the ring
  - d: D075
    text: rebuild the ring in the next prefill chunk after a restore
- part: prefix-block-cache
  does: Addresses committed 32-token KV blocks by chained hash of parent, tokens and image/salt identity across RAM pages
    and SSD slots, matches a new prompt from the root, shares physical pages, and offers its blocks to the ledger as victims
    in its own walk order.
  types:
  - prefix-reuse
  decisions:
  - d: D076
    text: block key includes images, cache salt and model identity
  - d: D077
    text: resident blocks form a root subtree
  - d: D078
    text: trim windowed layers' K/V from pages no window reaches (Slim)
- part: composite-state-cache
  does: Attaches immutable composite states (GDN cells plus draft context window) to complete KV blocks at replay points,
    rolling prefill checkpoints and shared-prefix junctions, in RAM, on disk or both, so a prefix hit can resume only where
    a state exists.
  types:
  - prefix-reuse
  decisions:
  - d: D079
    text: checkpoint interval (two draft windows)
  - d: D080
    text: state published only at prefill boundaries, never during decode
  - d: D081
    text: retire rolling checkpoints once a newer one is published
  - d: D082
    text: evict checkpoints first, states in use last
- part: ssd-cache-tier
  does: Writes evicted or copied KV pages and composite states into slot files on the SSD, sized from the volume's free
    space, under an optional daily write budget, read back by the SSD readers; optionally persists across processes in a
    namespace keyed by models, layouts and RoPE scaling.
  types:
  - state-tiering
  decisions:
  - d: D083
    text: automatic quota as a quarter of the volume's room above a floor
  - d: D084
    text: share of writes in flight per kind (reclaim, copy ahead, write-through)
  - d: D085
    text: drop states not in use while the write budget is spent
  - d: D086
    text: empty the persistent cache after repeated failed starts
- part: write-behind
  does: Copies the newest restore point of each conversation to the SSD tier ahead of need, after a delay and only if deep
    enough and not superseded, so a later reclaim frees its memory at once; on a persistent tier it copies every point.
  types:
  - state-tiering
  decisions:
  - d: D087
    text: minimum depth and delay before copying
  - d: D088
    text: copy on a temporary tier only under demand
  - d: D089
    text: pause while a claim waits for memory
- part: kv-spill-controller
  does: For Flash-Next only, decides per request whether its K/V stays Resident or Spills (only the index stays in memory,
    K/V written through to the SSD tier), converts a lane to Spill when memory refuses its growth, and bounds its output
    by the tier's active-KV quota.
  types:
  - state-tiering
  decisions:
  - d: D090
    text: which requests spill at admission
  - d: D091
    text: convert on refused growth
  - d: D092
    text: keep dense history, tail window and in-flight prefill groups Full
- part: spilled-kv-reader
  does: 'Brings spilled K/V back for attention: during decode a host step resolves each selected block on Index pages through
    a shared hot block cache (reading misses from tier copies); during prefill it streams the history one attention layer
    at a time into staging.'
  types:
  - state-tiering
  decisions:
  - d: D093
    text: per-lane hot cache floor and target
  - d: D094
    text: one or two staging buffers to overlap reads with attention
- part: prefill-runner
  does: Encodes a prefill command of one or more lanes' chunks (up to 2048 rows each, grouped up to four chunks run layer
    by layer when experts stream or K/V spills), split into layer passes, capturing composite states at planned boundaries,
    then runs the draft's context prefill and selects the first anchor.
  types:
  - prompt-reading
  decisions:
  - d: D095
    text: group or single chunk
  - d: D096
    text: number of layer passes
  - d: D097
    text: abandon a paused command for higher-priority work (nothing committed)
- part: draft-proposer
  does: In one non-causal forward over 8 rows (anchor plus 7 mask rows) per lane, computes draft logits from its rings and
    the target's vocabulary projection, keeps the top candidates per position, scores each by a codebook edge from the previous
    choice, walks the 7 positions greedily or by sampling, and records each position's confidence.
  types:
  - draft-proposal
  decisions:
  - d: D098
    text: number of candidates kept per position
  - d: D099
    text: greedy or temperature walk per lane
- part: verify-row-budget
  does: For MoE targets, allots verify rows across the batch's lanes on the GPU to maximize expected accepted tokens per
    predicted cycle cost, using an acceptance model on draft confidence and a cost line per lane count, both refit online
    on the host from completed cycles.
  types:
  - draft-policy
  decisions:
  - d: D100
    text: refit interval, label window, decay, prior strength
  - d: D101
    text: periodic full verification to explore
  - d: D102
    text: allot rows jointly across lanes
- part: token-selector
  does: 'Turns each verified row''s logits into a token on the GPU: applies repetition/presence/frequency penalties and
    the grammar mask, then greedy argmax (lowest id on ties) or min-p, top-k, top-p sampling, and for a sampled row with
    a draft draws from the residual distribution the acceptance rule needs.'
  types:
  - sampling
  decisions:
  - d: D103
    text: sampling policy per lane
  - d: D104
    text: residual weights clamp at zero; with nothing left the draw follows the distribution
- part: acceptance-commit
  does: 'Accepts draft tokens up to the first mismatch (greedy) or by u*q < p (sampled), keeps accepted+1 tokens cut at
    a stop token and at the output budget, then commits: KV length advances by the kept count, GDN parity swaps with pending
    rows, the target''s auxiliary state is rewritten, and the draft ring takes the kept rows.'
  types:
  - draft-verification
  decisions:
  - d: D105
    text: emit a stop or last budgeted token at once without a target cycle
- part: thinking-budget
  does: When a request's thinking-token budget runs out, forces the format's end-of-thinking tokens into the selected rows
    (replacing draft proposals at row 0), unless the model closed thinking first; for a constrained lane, starts the end
    where the mask admits it.
  types:
  - output-constraint
  decisions:
  - d: D106
    text: where in the 8 rows the end starts
- part: grammar-constraint
  does: Compiles JSON-schema or tool-call grammars into cached llguidance matchers on the server, and for a constrained
    lane computes a bitmask for the anchor and each of the 7 drafted tokens it simulates, while the engine runs the target
    verify forward and waits (up to a limit) for the masks before selection.
  types:
  - output-constraint
  decisions:
  - d: D107
    text: mask rows past the first invalid simulated token copy the last valid mask
  - d: D108
    text: overlap mask computation with the target forward
  - d: D109
    text: cache compiled matchers by grammar text within a byte budget
- part: request-scheduler
  does: 'Plans the next command: a prefill plan of the most urgent priority (overdue requests first, else fewest remaining
    rows, with joiners), sized while decode waits to a time bound measured from past commands, or a decode batch of up to
    4 ready lanes of one priority and stage; owes decode a share of contended prefill time.'
  types:
  - step-scheduler
  decisions:
  - d: D110
    text: decode share and decode gap target
  - d: D111
    text: overdue threshold for overtaken requests
  - d: D112
    text: contended prefill cut rows from measured time with a floor
  - d: D113
    text: group commands run in layer passes
- part: lane-admission
  does: 'Owns each request''s life on the engine: probes the prefix cache, assigns a lane and state, plans state boundaries,
    grows its KV through its memory claim before each command, waits for memory with a limit, suspends lower-ranked or lower-priority
    lanes (which later replay from cache), lets requests wait for another''s shared prefix, and settles ends, deadlines
    and cancels.'
  types:
  - sequence-lifecycle
  decisions:
  - d: D114
    text: 'rank for memory: priority, decoding before prefill, completed work, submission order'
  - d: D115
    text: which lane yields first
  - d: D116
    text: resource wait limit and retry backoff
  - d: D117
    text: projected output tokens for admission
  - d: D118
    text: whether a request waits for another's shared prefix
- part: native-loop
  does: 'Runs the engine process''s single loop: a reader thread takes framed messages from the server''s pipe, the loop
    hands frames to the engine, runs a memory control pass at command-free points and one engine tick, writes events back,
    and turns any engine exception into an EngineUnhealthy error and exit.'
  types:
  - engine-supervision
  decisions:
  - d: D119
    text: bound the input queue to one largest frame
  - d: D120
    text: rerun control at the next command-free point while landings are awaited
  - d: D121
    text: flush newest restore points on clean stop within a budget
- part: engine-supervisor
  does: In the Python server, spawns and talks to the engine process, submits and cancels requests, probes liveness, relaunches
    a failed engine with doubling backoff (never after permanent failures or a crash loop), and refuses requests that were
    running at two consecutive engine failures they may have caused.
  types:
  - engine-supervision
  decisions:
  - d: D122
    text: which failures are permanent or memory-caused
  - d: D123
    text: backoff base and cap
  - d: D124
    text: which exits count as request-caused (fault signals, execution failures)
- part: http-front
  does: Serves OpenAI Chat and Completions, Anthropic Messages, OpenAI Responses (with a stored-response conversation store)
    and token counting over HTTP with streaming, bounding connections, threads and body bytes, and validating host, origin
    and API key.
  types:
  - request-front
  decisions:
  - d: D125
    text: request priority and cache salt fields
  - d: D126
    text: queue size and request timeout
  - d: D127
    text: allowed origins
- part: prompt-builder
  does: Renders the conversation through the model's chat template (probed at startup and patched where the template rejects
    or drops later system messages), decrypts carried reasoning signatures, and tokenizes, reusing cached tokens up to the
    last literal message-boundary token.
  types:
  - prompt-preparation
  decisions:
  - d: D128
    text: native or patched template
  - d: D129
    text: reuse tokens only where the tokenizer provably splits at the marker
- part: output-parser
  does: Detokenizes streamed tokens, splits reasoning from answer, applies stop strings with partial-match holding, projects
    tool calls into streamed argument deltas, and validates the final content.
  types:
  - output-interpretation
  decisions:
  - d: D130
    text: hold text that may begin a stop string
- part: image-preparation
  does: Decodes data-URL images, resizes them to patch-aligned RGB within the pixel budget, computes a content digest and
    grid that identify image prefixes, and caches prepared images resent in chat history.
  types:
  - media-preparation
  decisions:
  - d: D131
    text: pixel budget (--max-image-pixels)
- part: document-renderer
  does: Renders PDF pages to text and images in a disposable sandboxed PDFium process with memory and time budgets, for
    the existing image prompt path.
  types:
  - media-preparation
  decisions:
  - d: D132
    text: render limits and document budget
- part: option-scoring
  does: Answers finite-option questions by rendering a fixed prompt, having the engine compute raw final-position logits
    at verified single-token answer slots instead of generating, and returning softmax scores.
  types:
  - scoring
  decisions:
  - d: D133
    text: which options have single-token slots
- part: configuration
  does: Parses and checks every serve option, passes them to the server and the native command line, reports which options
    each family can use, and writes the serve record the desktop app follows.
  types:
  - configuration
  decisions:
  - d: D134
    text: defaults for each flag (decode share, idle release, KV and state formats, verify rows, cache disk quota and writes,
      ANE on/off)
- part: telemetry
  does: 'Reports the engine''s state on /status and Prometheus: memory plan, governor and ledger accounts, host memory as
    macOS counts it, memory audit against the plan, cache, spill, expert store, weights, scheduler and decode-gap causes,
