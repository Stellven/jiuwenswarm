# Acceptance thresholds for the node types, fixed before the types are redone so that the result cannot be read
# generously afterwards. tools/so_nodetypes_validate.py reports each measure against its threshold.
#
# First round, 2026-11-16, draft 0.1 (types induced from Strata and ds4 only):
#   fit on engines not used for induction   30% clean, 15% no type      FAIL
#   blind agreement on the induction engines 100%                        pass, but not informative on its own
#   removed decisions covered by a choice    35% of real design choices  FAIL
#   claims contradicted by an engine         several "no effect on output" claims, not counted  FAIL
set_on: 2026-11-16

generalisation:
  method: "Leave one engine out. Node types are induced from four engines by a reader who has not seen the fifth; a second reader classifies the fifth engine's parts against them. Repeated for each engine."
  clean_fit_min: 0.75          # share of the held-out engine's parts that are plainly an instance of one type
  no_type_max: 0.05            # share with no type at all, after excluding parts that are outside an engine (see scope)
  applies_to: every_fold       # each engine must pass, not the average

agreement:
  method: "Two independent readers classify every part of every engine from the definitions alone, with names and origins hidden."
  same_type_min: 0.90          # share of parts on which both readers and the reference assignment agree

decision_coverage:
  method: "Every decision recorded in an engine inventory is matched against the choices of its part's node type."
  covered_min: 0.80            # share of real design decisions plainly covered; engine-specific trivia excluded
  not_covered_max: 0.05

claims:
  method: "Every invariant and every effect-on-output statement of a node type is checked against each engine that has an instance."
  contradicted_max: 0          # a claim an engine contradicts must be reworded, conditioned or removed

claims_note_2026_11_16: >
  Changed after round 5, and therefore to be reported with the results. Up to draft 0.5 an effect-on-output statement was read as a closed list of causes per
  node type, and any cause an engine showed that the type had not listed counted as a contradiction. Five rounds, each with fresh readers, kept finding
  further causes (74, 41, 23, 17 contradictions), most of them one cross-cutting fact seen from several node types. From draft 0.6 the claim of a node type
  is the set of levels it can reach; the cross-cutting causes are stated once as output principles. A reader records an unlisted cause at a listed level as
  `new_causes`, not as a contradiction. The threshold stays 0. The summary reports contradictions and new causes side by side so that the count under the
  earlier reading (their sum) stays visible.

claims_note_2026_11_16_second: >
  Round 6 (draft 0.6): 15 contradictions and 14 new causes. Twelve of the 15 were effects a node has only through another node (a cache size that decides what a
  default omission skips, a capacity that bounds how many rows share a step). Listing these per node type does not close either: almost every node can reach
  another node's level through something it decides. From draft 0.7 `effect_on_output` claims only what the node's own work does; what it decides for other
  nodes is named in `affects_output_through` and governed by `output_principles`, and an unnamed indirect effect is recorded as a new cause. The threshold stays 0.
  Both this note and the one above describe a change made after results were seen; the summary keeps contradictions and new causes side by side for that reason.

sufficiency:
  method: "A reader given only the node types, a model and a machine selects the node types and settles their choices."
  selection_agrees_min: 0.90
  choices_without_guidance_max: 0

scope:
  outside_an_engine:           # parts found in engine repositories that are not parts of the engine
    - "benchmark, evaluation and quality harnesses"
    - "desktop applications and other clients"
    - "patch provenance and build bookkeeping of a fork"
  note: "Such parts are recorded in the inventories and reported, and are not counted against the node types."

held_out:
  engine: "llama.cpp"
  source: "https://github.com/ggml-org/llama.cpp, shallow copy of the default branch at 92192d3, downloaded 2026-11-16"
  rule: "Its inventory is built by an independent reader and is not opened by whoever induces the node types until the types are frozen. It is used once, after freezing, with the generalisation thresholds above. A second use after any change to the types is no longer a held-out test and must be reported as such."
  why_this_engine: "A general engine of a different lineage from the five used for induction: not written for one model, not a mixture-of-experts specialist, with its own serving, grammar constraint, speculative decoding, partial offload to an accelerator and other input kinds."

frozen:
  draft: "0.8"
  on: 2026-11-16
  sha256: "220495602ef48973f964d62569b8e590cced9a173664bd54c4739f2239cf3edb"
  state: "Draft 0.8 answers the five contradictions round 7 found in draft 0.7 and was not checked again on the five engines before freezing."
  disclosure: "Before freezing, the author of the node types saw the hand-back summary of the reader who built the held-out inventory (a flat state pool, an expert cache with a CPU share, a speech output part, among others) but did not open the inventory. Nothing was added to the types on that account."

# ---------------------------------------------------------------------------------------------------------------
# Added 2026-11-17, before any of the results below existed. The thin draft (0.9) keeps the 44 types of the frozen
# draft 0.8 and removes detail. Three checks are run once each. No pass mark is set and no draft is revised to move
# a number; what is reported is fixed here.
thin_draft_2026_11_17:
  why: "The only feedback on the node ontology was that it has too much detail. Drafts 0.2 to 0.8 added detail. The
    held-out engine showed the division into types holds and the list of choices does not (50% of its decisions
    plainly covered, against 93% on the five engines the list was written from)."
  readers: "Claude subagents (model: opus), each alone in its own folder with only the files named. Not people."
  choices:
    question: "Which choices of draft 0.8 do engines decide independently, and which were copied from one engine?"
    method: "For each of the six engines, one reader matches every recorded decision to at most one choice of its
      part's node type (validation/choices/BRIEF.md). A choice counts for an engine when a decision plainly is it."
    rule_for_the_thin_draft: "A choice stays in the node type when at least two of the six engines decide it. The
      others are kept as examples with the engine they came from, outside the type."
    reported:
      - "The number of choices by the number of induction engines that decide them."
      - "Whether being decided in two or more of the five induction engines predicts being decided in llama.cpp:
        the share of such choices llama.cpp also decides, against the share for the rest. Only choices of types
        llama.cpp has are counted. llama.cpp played no part in which choices are counted as recurring here."
      - "The share of llama.cpp's decisions that plainly are a recurring choice."
    limits: "One reader per engine, no second reader. Near-duplicate choices of one type split the count and make
      recurrence look lower than it is."
  classification:
    question: "Does removing the choices and the per-cause lists make the types harder to tell apart?"
    method: "Two readers see the thin types without any choices and classify the 287 parts of all six engines,
      names removed (validation/round8/). Scored as in round 7: a part agrees when every reader gives a type the
      reference accepts."
    reported: ["agreement on the 240 parts of the induction engines, beside round 7's 239 of 240",
               "agreement on the 47 parts of llama.cpp, whose reference came from its independent checker"]
    limits: "The readers are a different model from rounds 2 to 7, so a drop cannot be put on the thinning alone."
  selection:
    question: "Given a model, a machine and a target, do the thin types say which nodes the engine needs?"
    method: "Two readers see the thin types and the descriptions of a model, a machine and a target, and answer for
      each type: needed, not needed, or open with the fact that would settle it. Three targets: Strata's model on
      its PC, the same model on DGX Spark, Muse Spark Open on DGX Spark. For the first two the answer is compared
      with the types Strata's working parts are instances of on that machine (validation/selection/strata-truth.yaml)."
    reported: ["agreement between the two readers per target", "each reader against Strata on the two known targets",
               "the facts readers needed and did not find"]
    limits: "Strata runs some parts by choice, not by need; a type it runs is not always one the model and machine
      require. The Muse target has no known answer."
  results_2026_11_17:
    choices: "863 decisions matched. Plainly a choice: Strata 78%, ds4 73%, HyperQwen 70%, NInfer 79%, Splash 76%,
      llama.cpp 30%. Of the 505 choices, 81 are decided by two or more of the six engines, 322 by one, 102 by none
      plainly. Decided in two or more of the five induction engines: llama.cpp also decides 14 of 66 (21%); the
      rest: 22 of 387 (6%). llama.cpp decisions that plainly are such a choice: 14 of 121. Files:
      validation/choices/map-*.yaml, recurrence.yaml."
    classification: "Both readers and the reference agree on 238 of 240 parts of the induction engines (round 7:
      239 of 240) and on 44 of 47 of llama.cpp. The two readers gave the same type for 283 of 287. Files:
      validation/round8/."
    selection: "The two readers gave the same answer for 44, 44 and 43 of 44 types. Strata's model on its PC:
      Strata runs 25 of the 27 types both called needed, 1 of the 8 called not needed, 6 of the 9 left open. Moving
      to DGX Spark Strata stops running expert-fetch, residency-policy and secondary-compute; both readers called
      all three not needed there, and also expert-source, expert-cache and expert-dispatch, which Strata still
      runs. Files: validation/selection/."
    to_be_said_with_the_results:
      - "The file the classification readers saw listed the open gaps, which describe the three llama.cpp parts
        that have no type. This helped them answer `none` for those parts."
      - "After the readers ran, draft 0.9 renamed three fields and four effect levels to agree with the dictionary,
        dropped the kind of a choice, merged eight pairs of near-duplicate choices the mapping readers named (81
        kept choices became 79), and reworded `needed_when` of model-conversion and row-source on what the
        selection readers reported. None of this was checked again."
      - "The mapping reader here was stricter than the checkers of rounds 2 to 7, who judged the same five
        engines 93% covered against draft 0.7: one choice per decision, and doubt counted against."
      - "The two selection readers are the same model reading the same files; their agreement with each other is
        weak evidence. Their agreement with what Strata runs is the stronger result."
  # One confirmation on the final draft 0.9, set before it was run: classification and selection each run once more,
  # nothing in the draft changed afterwards whatever the result.
  confirmation_2026_11_17:
    draft: "ontology/node-types.draft.yaml, draft 0.9, sha256 a65acca0ad5f54476bb1953fd7d79ac45059779d1a13365b4c068d5f7e6ce4fb"
    what_the_readers_saw: "The final draft with its choices and seen_in and without open_gaps
      (validation/round9/node-types.for-readers.yaml). New readers (model: opus), each alone in a new empty folder.
      The parts were shuffled again under new item ids. The selection readers were told not to use seen_in."
    classification:
      first_run: "238 of 240 and 44 of 47; the two readers gave each other the same type for 283 of 287."
      confirmation: "237 of 240 and 43 of 47; the two readers gave each other the same type for 285 of 287.
        Neither reader answered `none` for any part: the three llama.cpp parts that have no type were each put in
        the nearest type (layer-compute, output-interpretation, positional-state-store)."
      files: validation/round9/
    selection:
      first_run: "Readers agreed with each other on 44, 44, 43 of 44. PC: both said needed 27 (Strata runs 25),
        not needed 8 (1), open 9 (6). DGX Spark: needed 23 (21), not needed 17 (4), open 4 (4)."
      confirmation: "Readers agreed with each other on 40, 40, 42 of 44; every difference is not needed against
        open. PC: both said needed 26 (Strata runs 25), not needed 4 (0), open 10 (6). DGX Spark: needed 21 (20),
        not needed 14 (4), open 5 (4). In both runs both readers called all three types Strata stops running on
        DGX Spark not needed there."
      changed_by_the_reworded_conditions: "model-conversion went from needed to open in all three cases (the files
        do not say whether the checkpoint is read as published). row-source went from needed to not needed on DGX
        Spark, where Strata still runs its table reader although the table fits in memory."
      files: validation/selection-final/

