# Added 2026-11-18, after all the results above were known. Nothing in this entry was set in advance of a result.
audit_2026_11_18:
  written: "2026-11-18, after every result above was known."
  found: "An audit of the scoring programs (rules-audit-2026-11-18, section C and finding B5) found that none of the
    scorers behind section 6 of NODE-ONTOLOGY-revised.md could print a failure or exit with an error, and that the
    marks set on 2026-11-16 at the top of this file were neither applied nor mentioned in section 6. The entry of
    2026-11-17 above set no mark for the thin draft after the results of rounds 2 to 7 and of the held-out engine
    were known."
  changed_in_the_scorers:
    - "so_nodetypes_experiments.py classify, selection and recurrence, and so_nodetypes_validate.py, set each figure
      against the mark of 2026-11-16 that applies to it, print met or not met, and exit with 1 when a mark is not met
      or a reader's file has a problem. A figure no mark applies to is printed with 'no mark was set for this check'."
    - "A missing answer is never counted as agreement, between readers or with the key, and a part of the held-out
      engine a reader did not answer stays in the denominator of the fit marks. A share that is not all of its total
      is never printed as 100%."
    - "so_nodetypes_validate.py reads every check file of a round, the held-out engine's included, compares typed
      totals with the entries listed under them, prints how many parts a reader flags as outside an engine are left
      out, and says per row when its mark was set and whether its reading changed later."
    - "selection reports open answers, types with no needed_when, the figure with Strata's main types only, and
      whether a reader's stated reason rests on a type Strata still runs."
    - "Material for future selection readers no longer carries seen_in or the list of engines, and a removed name
      leaves no trace; the stored inputs of the two runs were not rewritten. A run's reader instructions can now be
      stored with it."
    - "so_nodetypes.py doc writes section 6 from these scorers. A design's node types are read from its own
      components (examples/systems/muse/node-assignment.yaml, read by Claude subagents), pinned to the text read; the
      type of a design's component is no longer taken from the component it is derived from."
    - "so_intake_trial.py score separates target items a quote singles out from items touched only by a quote that
      spans several."
  not_done: "No check was run again with new readers. Every figure below is computed from the answers stored on
    2026-11-16 and 2026-11-17."
  reading_fixed_after_the_results: "sufficiency.selection_agrees_min does not say what a selection must agree with.
    It is read as agreement of each reader's answer with the types Strata has an active part for in the resolved
    specs, an open answer agreeing with nothing. Agreement between the two readers is shown beside it."
  against_the_marks_of_2026_11_16:
    agreement: "Met. Every reader gives a type the key accepts: first run 238 of 240 and 44 of 47; confirmation 237
      of 240 and 43 of 47. Counting only the key's main type: 236 of 240 and 41 of 47, then 236 of 240 and 40 of 47;
      for llama.cpp that is 87.2% and 85.1%, not met."
    generalisation: "Not met on draft 0.9. Parts a reader calls plainly one type, llama.cpp: first run 31 and 34 of
      47, confirmation 30 and 30 of 47 (mark: 75%). No type: first run 4 and 1 of 47 (the first is 8.5%, not met),
      confirmation 0 and 0. On draft 0.8 the two held-out readers met both marks (40 and 38 of 47 plainly one type;
      0 and 1 with none). Holding out each engine in turn was never done; one engine was held out once."
    decision_coverage: "Not met. Held-out checker on draft 0.8: 60 of 119 decisions plainly covered (50.4%), 30 of
      119 not covered (25.2%). Mapping readers on the full-detail draft: five induction engines 563 of 709 (79.4%),
      8 of 709 not covered (met); llama.cpp 36 of 118 (30.5%), 35 of 118 not covered (29.7%). By the choices draft
      0.9 keeps: 217 of 709 and 26 of 118."
    claims: "Not met on draft 0.8: the held-out checker found 6 claims llama.cpp contradicts. Draft 0.9 was not checked
      for claims."
    sufficiency: "Not met. Each reader's answer is what Strata has: first run 32 and 32 of 44 on the PC, 34 and 34 on
      DGX Spark; confirmation 32 and 29 on the PC, 33 and 30 on DGX Spark. Shown beside, the two readers give the same
      answer for 44, 44, 43 of 44 (first run) and 40, 40, 42 of 44 (confirmation). The half that asks a reader to
      settle the choices was never tested."
    in_all: "33 figures the marks apply to: 12 met, 21 not met. Three parts of the marks were never tested."

