  figure: "10.9 tokens per second: 273 GB/s over the 25.1 GB one token surely reads (6.44 GB of experts, 17.31 GB of
    other weights, the output head of 1.36 GB, one row of the embedding table)."
  condition: "For one sequence and one token per pass, a measured decode speed is at or below 10.9 tokens per second.
    A higher measured speed means the bound is wrong: the sizes, the bandwidth, or what a token is taken to read."
  cannot_fail_on: "A low speed. An upper bound is not contradicted by a slow run, and computation is not counted."
  not_comparable_as_they_stand: "The estimates of that run (0.84 to 2.83 tokens per second, first token 20 to 31
    seconds) are for an engine that keeps to the target's 80 GB and holds the most used experts. A runtime that maps
    the files and lets the operating system keep what fits of them in up to 127 GB is not that engine. The reference
    point, every routed expert read from storage, is 0.74 tokens per second; it is not a bound."
  would_be_worth_recording: "From such a run: how often each expert of each layer is routed. That gives the
    unevenness of use, which the estimates vary between 0 and 0.899 because nobody has measured it."

