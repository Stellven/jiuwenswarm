# Added 2026-11-20, after the runs. The condition of bench_comparison_2026_11_19 was written before any result;
# everything else here is a record of observations.
measured_2026_11_20:
  what: "The model files the bench runs (Unsloth UD-IQ2_XXS, six files in ~/ifbench on the DGX Spark, read only),
    served by a llama-server of my own in the bench's configuration (-c 20480 -np 1 --load-mode mmap -ngl 999
    --cpu-moe -b 2048 -ub 2048), then with --moe-cache-mib 16384 and 49152. Each run: 2 warm-up requests, then 4
    requests of 2,042 to 2,398 prompt tokens and 128 output tokens, prompt cache off, seed 1234. The bench team's own
    server, idle since their run ended, was stopped first, after its owner said the run had ended; its command line is kept on the
    Spark in logs/bench-llama-server-cmdline.txt."
  files: "runs/muse-measured-2026-11-20/ (per run: the evidence file of tools/spark_kit/measure.py, the server's log,
    its metrics and the run record; probe/: three storage probes of the day). `python tools/so_measured.py` prints
    the comparison; METHOD-assessment.md, section 'What the machine measured', says what it means."
  condition_of_2026_11_19: "Holds. Decode 1.05 to 1.12 tokens per second in the control run, 0.41 to 0.48 and 0.68 to
    0.72 with the two caches: all below 10.9. The condition could not fail on a slow run, as it says itself."
  observed:
    - "First token after 234 to 366 s in the control run, against estimates of 20 to 31 s (80 GB) and 12 to 21 s
      (128 GB). The estimates count one reading of the experts and no computing. They do not hold for this baseline."
    - "Decode of the control run is inside the estimates for 80 GB and 6% under the low end of those for 128 GB; the
      process held 91.9 GiB of mapped files and 21.4 GiB on the GPU."
    - "A GPU cache with 8.3% of the experts held 52.8% of those the decode steps asked for; one with 25.0% held
      79.0%. Independent choices allow at most 52.3% and 71.9%. Successive tokens reuse experts: the assumption the
      decode estimates rest on does not hold."
    - "Both cache runs decode slower than the control run."
    - "The server allocates 4,096 bytes of attention state per token per layer, the figure derived from the model
      files. Three storage probes on the idle machine: 4.44 to 4.81 GB/s for ranges of 25.2 MB, 4.28 to 5.04 GB/s for
      ranges of 12.98 MB."
  seen_before_this_was_written: "All of it. Only the condition of 2026-11-19 was fixed beforehand."
  limits: "One runtime, which is the bench's baseline and not an engine built to the Muse design. One prompt length,
    four requests a run, one run per setting. What the first-token time is spent on was not separated, nor why the
    cache runs decode slower. The hit counts are the server's, over all decode steps of a run, warm-up included."

