assessment_2026_11_18:
  written: "after the results were known; this is a record, not a criterion set beforehand"
  found_by_the_audit: "The back-test printed 'the right order of magnitude' whatever the figures were, compared tokens
    per second with a figure per pass over the weights, and a reported speed was above the figure called a ceiling.
    The assessment's figures did not depend on the design, and several of its conclusions were fixed sentences."
  back_test_condition: "For the memory-bandwidth upper bound: every reported speed, divided by the fewest tokens per
    pass the evidence states, is at or below the bound. Written into tools/so_backtest.py on 2026-11-18; the program
    prints PASS or FAIL and exits with 1 on FAIL."
  result: "runs/strata-backtest-02: PASS. Per pass the reported speeds are 0.29 to 0.46 times the bound. In tokens per
    second they are 0.93 to 1.12 times it. The tokens per pass (2.4 to 3.2) are not stated for this machine."
  not_compared_with_any_engine: "the storage part of the arithmetic, the cache and hit-rate estimates, the
    first-token estimates"
  assessment_run: "runs/muse-assessment-05. Its speed and first-token figures other than the memory-bandwidth bound
    are estimates under the assumption that each token's choice of experts is independent of the previous token's;
    they are not bounds."

