# Added 2026-11-17 after the team said who reads the ontology first, and before the trial below was run.
intake_trial_2026_11_17:
  why: "The team: 'the first node is Intention Compiler. System Ontology will be part of query input, and all the
    query prompts will go to Intention Compiler.' Nothing in the ontology was shaped for that reader. One trial, to
    see what of the ontology an Intent pass takes up when it arrives inside a query."
  what_is_run: "A query for the first use case is assembled: a three-sentence request written for this trial, and
    ontology files as its context. Two variants. A: the target spec, the model and the machine. B: A plus the node
    types (draft 0.9). For each variant one reader plays the Intent CC of the Intention Compiler, working from the
    factory's own pages (docs/architecture/design-package/pipeline/intention-compiler.md,
    reference/intent-and-requirements.md) and the Intent IR schema. Where the schema asks for a source span the
    reader gives the exact quoted text and tools/so_intake_trial.py turns it into offsets. If an Intent comes out
    `ready`, a second reader plays the Requirements CC on it and writes a Research Brief. If it comes out
    `needs_clarification`, the Requirements pass is not run, as the design says."
  reported:
    - "Whether each Intent IR is valid against the factory's schema, and how many quotes were not found word for word."
    - "Readiness, and the uncertainties with their blocking flag."
    - "Of the requirements and stated fields of the target spec, how many an entry of the IR cites. Of its lines
      that are not set, how many an uncertainty cites."
    - "In variant B, which node types are cited and in which fields of the IR."
    - "The size of each query."
    - "For a Brief, when one is written: validity against the schema, and what of the ontology it carries on."
  not_a_test_of: "The factory's Intention Compiler itself. The readers are Claude subagents (model: opus) following
    the design pages, not the pinned model behind the real CC, and no check bundle, verifier or gate is run."
  rule: "Run once. Nothing in the ontology is changed on the result without its owner's decision."
  results:
    queries: "A: request, target spec, model, machine, 11 KB. B: the same plus the node types, 59 KB."
    intent: "Both Intent IRs are valid against the factory's schema; all quotes (110 and 73) are found word for word.
      Both say `ready`, with 13 and 12 uncertainties, none blocking. Of the target spec: all 6 requirements and all 9
      stated fields are cited in both; of its 12 lines that are not set, 9 and 8 are cited; of the 5 aspects left
      open to the factory, 2 in both. In B none of the 44 node types is cited: the file appears once, as one context
      entity, and once as an uncertainty about what it is for."
    brief: "Both Research Briefs are valid against the factory's schema. A: 12 mandatory requirements, 7 constraints,
      5 target metrics, 4 deliverables, 14 unresolved items of which 4 blocking (context length, quality task set and
      threshold, allowed transformations, checkpoint). B: 15, 9, 4, 4, 15 unresolved of which 5 blocking (the same
      four and the workload). No default was applied in either. In B the node types are bound as a reference
      document and no requirement is drawn from them."
    what_had_no_place: "Both Requirements readers report that the Brief has no field for facts about the model and
      the machine (layers, experts per token, memory bandwidth), for the status of a statement (stated, proposed,
      derived, not set), for a unit basis or an accounting boundary, or for a requirement that is reported and not
      judged. These went into free text or stayed reachable only as attached reference documents. `domain_lane` is
      fixed to scientific_research."
    to_be_said_with_the_results:
      - "The readers are Claude subagents following the design pages; this is not the factory's Intention Compiler.
        No check bundle, verifier or gate was run."
      - "The request text was written for this trial. Its last sentence tells the reader to take the attached files
        as the statement of what is wanted; without it the readers might have used the files less."
      - "The blocking flags of the Briefs follow a rule each Requirements reader derived from the word 'material' in
        the design pages; the two readers differ on the workload."
      - "Quotes were turned into spans by a program; the real Intent CC has to produce the spans itself."
    files: validation/intake/
  # Added 2026-11-18, before the run below: one more run, with the engine's own description.
  second_run_2026_11_18:
    why: "The first run attached the generic node types, which name no part of any one engine. The ontology asked
      for is that of the inference engine itself, at system level and at component level. This run attaches
      that: the two-level description of the Muse engine design."
    what_is_run: "Variant C: the request, the target spec, the model, the machine, the system level of the Muse
      design (examples/systems/muse/system.yaml) and its node level (examples/systems/muse/nodes.yaml). The generic
      node types are not attached. The request text is changed in one place: it now says the files describe 'the
      model, the machine, the target the engine is judged on, and the engine itself at two levels: the system as a
      whole and its nodes'. The reader's instructions are word for word those of the first run. One reader plays
      the Intent CC; if the Intent is `ready`, one reader plays the Requirements CC."
    reported:
      - "The same figures as for variants A and B, beside them."
      - "Of the 29 nodes of the Muse design, how many an entry of the Intent IR cites, and in which fields."
      - "Of the sections and the 68 flows of the system level, how many are cited."
      - "For the Brief, when one is written: how many requirements, constraints and unresolved items, which are
        blocking, and whether any requirement is drawn from the system level or the node level."
    limits: "As for the first run. In addition: the request text was written for this run and tells the reader that
      the files describe the engine itself; the Muse description says of itself that it is a proposed design of
      which nothing has been built."
    rule: "Run once. Nothing is changed on the result without the owner's decision."
    results:
      query: "C: request, target spec, model, machine, Muse system level, Muse node level, 53 KB."
      intent: "Valid against the factory's schema; all 114 quotes found word for word. Readiness
        `needs_clarification`, 13 uncertainties, 1 blocking. Entries: context 8, in_scope 7, out_of_scope 6,
        constraints 7, preferences 3, user_targets 6. Target spec: 6 of 6 requirements and 9 of 9 stated fields
        cited; 8 of its 12 lines that are not set."
      blocking_item: "A conflict inside what was attached. The model description says each token uses 8 of 256
        experts per layer. The Muse node `expert-router` says 512 logits and 10 experts
        (examples/systems/muse/nodes.yaml, line 78) and the flow `routed-experts` says 10 expert ids per token
        (examples/systems/muse/system.yaml, line 269). Both lines are in the files as stated. They come from the
        Strata component the Muse node was carried over from as reused."
      engine_description_taken_up: "Node level: 7 of 29 nodes cited, in in_scope (one entry naming the node level as
        a whole), preferences and uncertainties; no node became a constraint or a target. System level: 3 of 68
        flows cited, all by uncertainties; 8 of 15 sections cited (summary, product, targets, components, declares,
        flows, derived_from, coverage). Characters cited: system 1,374 of 25,327; nodes 387 of 17,925."
      other_inconsistencies_the_reader_named: "Non-blocking: flows that still mention drafts although drafting is
        excluded; nodes that mention several cards and an n-gram table although the machine has one GPU and the
        model no such table; a flow that loads every expert into an arena at startup although the summary keeps
        experts on storage; an HTTP front in the design although the target leaves the engine's form unset."
      requirements_pass: "Not run: the Intent is `needs_clarification`, and the method set before the run says the
        Requirements pass is then not run."
      to_be_said_with_the_results:
        - "One reader, one run. A Claude subagent following the design pages, not the factory's Intention Compiler."
        - "The request text of this run tells the reader the files describe the engine itself; that sentence was
          written for the run."
        - "Nothing in the Muse description was corrected after the run."

