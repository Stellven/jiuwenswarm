  - {node_type: device-backend, needed: needed, because: "The type has no needed_when, so every engine has it.", asks: ""}
  - {node_type: secondary-compute, needed: open, because: "Expert weights (50.3 GB) cannot sit in the 12 GB vram and lie in host ram, where cpu0 could compute them, but the files give no bandwidths for ram, the ram-to-vram path or cpu0.", asks: "Is computing cache-missed experts (or other shares) on cpu0 from ram faster than moving them to vram or reading them through gpu0-reads-ram?"}
  - {node_type: model-edit, needed: not_needed, because: "target.yaml asks for a text-in, text-out single-stream engine and states no run-time change to model behaviour.", asks: ""}
  - {node_type: step-execution, needed: needed, because: "The type has no needed_when, so every engine has it.", asks: ""}
  - {node_type: prompt-reading, needed: open, because: "Whether prompts are read by a separate chunked path or by the same step path as decoding is a builder decision the single_stream_text target does not settle.", asks: "Will the engine read prompts through a path of its own rather than as wide steps of the general step path?"}
  - {node_type: media-preparation, needed: not_needed, because: "interface.input.modality is text only.", asks: ""}
