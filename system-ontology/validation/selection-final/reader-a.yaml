  - {node_type: expert-cache, needed: needed, because: "50.3 GB of experts do not fit in the 12 GB vram budget, so only some can be held in fast memory.", asks: ""}
  - {node_type: residency-policy, needed: needed, because: "There is an expert cache in vram (see expert-cache), so which experts stay must be decided.", asks: ""}
  - {node_type: expert-fetch, needed: needed, because: "There is an expert cache in vram, and absent experts must be brought over the ram-to-vram path.", asks: ""}
  - {node_type: expert-dispatch, needed: needed, because: "Selected experts can be in vram, in ram (readable via gpu0-reads-ram) or on ssd0, i.e. in more than one place.", asks: ""}
  - {node_type: row-source, needed: needed, because: "ngram_table is 28.8 GB and ngram_lookup reads it per token, which cannot be held whole in the 12 GB vram budget.", asks: ""}
  - {node_type: storage-reader, needed: open, because: "Weights total about 85 GB against 64 GB of ram, so something is read from ssd0 while running, but the files do not say whether that is experts, n-gram rows or both.", asks: "Which kinds of data (experts, n-gram table rows, state) will be read from ssd0 while the engine runs?"}
  - {node_type: positional-state-store, needed: needed, because: "The type has no needed_when; the model also writes attention_kv, indexer_keys and mtp_kv.", asks: ""}
  - {node_type: recurrent-state-store, needed: needed, because: "shared_blocks write gdn_state, a recurrent state that cannot be cut back, and the model has draft operations whose rejected tokens require going back.", asks: ""}
  - {node_type: state-pool, needed: not_needed, because: "workload is single_stream_text, so several sequences are not in the engine at once.", asks: ""}
  - {node_type: state-tiering, needed: open, because: "The target states no context length and the model gives no per-token state size, so whether state outgrows fast memory is not stated.", asks: "What context length must be served, and how large is the per-token attention, indexer and PLE state?"}
  - {node_type: prefix-reuse, needed: needed, because: "The type has no needed_when, so every engine has it.", asks: ""}
  - {node_type: session-persistence, needed: not_needed, because: "target.yaml offers no saving or restoring of sessions.", asks: ""}
  - {node_type: draft-proposal, needed: needed, because: "The model has an mtp_draft head and a dflash2_draft drafter, each proposing up to 7 tokens.", asks: ""}
  - {node_type: draft-policy, needed: open, because: "Whether the amount and source of drafting (mtp vs dflash2, up to 7) is adjusted while running is a builder decision.", asks: "Will the engine adapt draft length or drafter choice while running, or use a fixed setting?"}
  - {node_type: draft-verification, needed: needed, because: "Tokens are proposed ahead by mtp_draft or dflash2_draft, and the full model must check them.", asks: ""}
  - {node_type: sampling, needed: needed, because: "The type has no needed_when, so every engine has it.", asks: ""}
  - {node_type: output-constraint, needed: not_needed, because: "The target is an offline text engine and states no constrained output, tool format or grammar.", asks: ""}
  - {node_type: output-interpretation, needed: needed, because: "The type has no needed_when, so every engine has it.", asks: ""}
  - {node_type: request-front, needed: needed, because: "The type has no needed_when, so every engine has it.", asks: ""}
  - {node_type: prompt-preparation, needed: needed, because: "The type has no needed_when, so every engine has it.", asks: ""}
  - {node_type: step-scheduler, needed: needed, because: "The type has no needed_when, so every engine has it.", asks: ""}
  - {node_type: sequence-lifecycle, needed: needed, because: "The type has no needed_when, so every engine has it.", asks: ""}
  - {node_type: replica-routing, needed: not_needed, because: "One PC with a single-stream workload; nothing states several whole copies of the engine.", asks: ""}
  - {node_type: engine-supervision, needed: needed, because: "The type has no needed_when, so every engine has it.", asks: ""}
  - {node_type: scoring, needed: not_needed, because: "The target offers text generation only and no scoring.", asks: ""}
  - {node_type: model-partitioning, needed: open, because: "The model must span vram and ram, but whether whole layers or layer shares are computed on cpu0 (spreading the model over two devices) is a builder decision the target leaves open.", asks: "Will any layers or layer shares be assigned to cpu0 for computation, or does gpu0 compute everything?"}
  - {node_type: device-communication, needed: open, because: "It follows the model-partitioning decision: only if the model is split across cpu0 and gpu0 must activations move between them.", asks: "Is the model's computation split across cpu0 and gpu0?"}
  - {node_type: configuration, needed: needed, because: "The type has no needed_when, so every engine has it.", asks: ""}
  - {node_type: resource-governing, needed: open, because: "The vram budget is fixed and the workload is single stream; the files do not say whether host ram is reclaimed by the OS or other processes, or whether power is limited.", asks: "Is the PC shared with other processes that reclaim ram or vram, or is a power or heat limit imposed while running?"}
