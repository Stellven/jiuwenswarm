contradictions:
  - {part: "offline-converter-quantizer", type: "model-conversion", claim: "must: An interrupted or mismatched conversion is never left looking complete.", evidence: "gguf-tools/deepseek4-quantize.c 2042, 2793-2856 opens the final out_path with fopen(\"wb\"), writes header and tensor directory first and calls exit(1) on a size mismatch, leaving a partial file under the final name; only the loader's bounds check (ds4.c 2846 'tensor points outside GGUF file') later rejects it. The Python tools write .partial and rename.", fix: "An interrupted or mismatched conversion is never accepted as complete: it is written under a temporary name until finished, or it is rejected when loaded."}
  - {part: "expert-locality-profiler", type: "calibration", claim: "summary: Measure the model or the machine, offline or at startup", evidence: "Records every routing decision per layer during an ordinary inference run (opt-in by environment) and writes the profile and hotlist at the end; it measures neither offline nor at startup.", fix: "Measure the model or the machine offline, at startup, or during an opt-in profiling run, and record results that other nodes take as fixed input."}
  - {part: "power-throttle", type: "resource-governing", claim: "must: Where it limits duty cycle, the average over the stated window stays at or below the requested level.", evidence: "ds4.c 17963-17994: sleeps work_avg*(100-p)/p after each prefill layer or decoded token, from an exponential average (0.875/0.125) of past work time, not the current sample; no window is stated and when work time rises the duty cycle exceeds the target until the average catches up.", fix: "should: Where it limits duty cycle, idle time is inserted in proportion to measured work so the duty cycle approaches the requested level; relaxed: one engine estimates work from a moving average and states no window."}
  - {part: "request-scheduler", type: "step-scheduler", claim: "must: Every admitted sequence is served, or ended with an explicit error within a stated wait.", evidence: "Unbounded FIFO queue, no overload rejection, no wait limit or timeout; decode has strict priority and prefill is admitted only when no decode is pending, so a queued prompt has no stated bound on its wait (only client disconnect or shutdown ends it).", fix: "Every admitted sequence is eventually served or ended with an explicit error; where the engine bounds the wait, the bound is stated."}
relaxations:
  - {part: "prompt-prefill-driver", type: "prompt-reading", rule: "Where chunk boundaries change stored state, the chunking is part of the key under which that state is reused.", how: "The prefill quantum changes with load (small while any generation is active, larger otherwise) and chunk size fixes compressor-row finalisation, yet disk checkpoints are keyed by a hash of rendered text with model id and quantization only; the engine aligns store boundaries to a fixed multiple instead of keying on the chunking."}
wrong_assignments:
  - {part: "prefill-layer-pagein", assigned: "expert-source", better: "expert-fetch", why: "It does not keep the full set obtainable; it warms the next layer's routed-weight pages ahead of need, best effort, which is expert-fetch's 'best-effort warming ahead of need' form, and its mechanism decision is an expert-fetch choice."}
  - {part: "image-input-encoder", assigned: "modality-encoding", better: "modality-encoding, with also: media-preparation", why: "It also decodes PNG/JPEG, enforces size limits and rejects remote and file sources, which is media-preparation's job; two of its three decisions are not covered without that type."}
  - {part: "network-tensor-parallel", assigned: "model-partitioning", better: "model-partitioning, with also: device-communication", why: "It also owns the RDMA/TCP transport, gate exchange of partial sums and gate timeouts; no other ds4 part carries device-communication between machines."}
  - {part: "pipeline-parallel", assigned: "model-partitioning", better: "model-partitioning, with also: device-communication", why: "It also forwards hidden state between machines, owns worker registration and route discovery and reconnection; no other part carries that transport."}
inventory_errors:
  - {part: "compressed-attention-state", field: "output_effect", recorded: "none (and decision 'Compressed rows optionally stored as F16')", source_shows: "ds4.c 17236-17246: on Apple the persistent compressed KV cache is stored in F16 by build (DS4_GPU_ATTN_COMP_CACHE_F16=1), F32 elsewhere, with F32 staging; storage width differs by platform, so the effect is numeric and the F16 choice is fixed per platform, not optional."}
  - {part: "dense-attention-cache", field: "output_effect", recorded: "none", source_shows: "ds4.c 17248-17250: GLM's persistent compact cache is stored in F16 on all GPU backends while producers keep F32 staging; stored width is reduced, so the effect is numeric."}
  - {part: "disk-kv-checkpoint-store", field: "output_effect", recorded: "numeric (reuse across quantizations brings state computed by another quantization)", source_shows: "ds4_kvstore.c 518-519, 616-643, 852-858: cross-quant reuse is accepted unless reject_different_quant is set; state computed under other routed-expert weights differs by more than last bits, so changes_output."}
  - {part: "offline-converter-quantizer", field: "when_things_go_wrong", recorded: "Merge script verifies shard sizes and checksums and keeps the previous default model (per docs)", source_shows: "gguf-tools/deepseek4-quantize.c 2042, 2793-2856 writes directly to the output path and exits on error leaving a partial file; deepseek41_quantize.py 248-314 and glm53_quantize.py 1113 write .partial (with a journal) and rename on completion. Shard checksum verification belongs to download_model.sh, listed outside the engine."}
