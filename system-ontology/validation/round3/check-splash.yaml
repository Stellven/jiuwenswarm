contradictions:
  - {part: "model-installer", type: "model-conversion", claim: "Offline, turn the published model into the files this engine reads: weights in the engine's layout and precision, and any derived pieces", evidence: "The installer converts no weights and writes no prepared copy; it pins snapshots and publishes an assembly of links plus a digest record. Conversion into kernel layout happens at every start in weight-image-loader (absent: offline weight conversion).", fix: "Offline, obtain, pin and record the published model and any derived pieces the engine reads; weights are put in the engine's layout and precision here when conversion is offline, otherwise at load."}
  - {part: "weight-image-loader", type: "model-loading", claim: "summary: 'At startup, open the model's files ...'", evidence: "Images are rewritten from source again on demand when weight-residency restores weights after an idle release (runs: startup, on_demand).", fix: "At startup, and again whenever released weights are restored, open the model's files, check them and make the weights every token uses readable."}
  - {part: "weight-image-loader", type: "model-loading", claim: "effect_on_output: approximate when weights are quantised or otherwise reduced while loading", evidence: "The draft is quantized from BF16 to 4-bit at load; this changes proposals only, which the full model checks: greedy output is unchanged and sampled output keeps its distribution.", fix: "approximate when weights the full model computes with are quantised while loading; quantising weights used only for proposals is exact under greedy decoding and resampled under sampling."}
  - {part: "ane-ffn-split", type: "secondary-compute", claim: "Compute a share of a layer's work on a second device, from weights that device can read where they lie.", evidence: "The ANE's int8 weights are requantized by the GPU one layer ahead into shared surfaces; the second device does not read them where they lie.", fix: "Compute a share of a layer's work on a second device, from weights it can read where they lie or that are prepared for it ahead of the layer."}
  - {part: "kv-page-pool", type: "state-pool", claim: "effect_on_output: exact", evidence: "The pool stores K/V as INT8 with per-token scales by default (changes_output against --kv-format bf16); its page forms also fix stored precision.", fix: "exact in itself; where the pool also fixes the stored format, approximate when state is stored quantised (or assign the format to positional-state-store)."}
  - {part: "gdn-state-cells", type: "recurrent-state-store", claim: "Hold state that is fixed in size and overwritten as the sequence advances, with the snapshots needed to go back. gives: a snapshot to restore from", evidence: "Verify never advances the cell; acceptance records pending rows and swaps the parity of two cells, and the next step folds the taped rows in. Going back needs no snapshot.", fix: "Hold state that is fixed in size and overwritten as the sequence advances, with what is needed to go back: snapshots, a second copy, or a commit deferred until acceptance is known."}
  - {part: "kv-spill-controller", type: "state-tiering", claim: "effect_on_output: exact when state comes back as it left; rounding when held at another precision", evidence: "A spilled request's output is bounded by the tier's active-KV quota and the request is ended at that bound (Engine.hpp:145-158, 429, 641); no listed case covers ending output.", fix: "add: defines, when the slower tier's capacity bounds how long a sequence may grow and output is ended at that bound."}
relaxations:
  - {part: "prefill-runner", type: "prompt-reading", rule: "Where chunk boundaries change stored state, the chunking is part of the key under which that state is reused.", how: "With bf16 recurrent state, chunk ends and capture points round the state, yet stored composite states are reused by a resumed request whose cold run would have rounded at other boundaries; the key does not include the chunking."}
wrong_assignments:
  - {part: "draft-state", assigned: "draft-proposal", better: "positional-state-store", why: "It owns the draft model's per-position ring K/V and the window it is computed from; positional-state-store names a draft model's per-position state explicitly, while draft-proposal declares no state."}
  - {part: "kv-page-pool", assigned: "state-pool", better: "state-pool, also positional-state-store", why: "Besides handing out and compacting pages it fixes the stored K/V format (INT8 with scales, page forms), which is positional-state-store's choice and the source of its output effect."}
inventory_errors:
  - {part: "image-preparation", field: "output_effect", recorded: "none", source_shows: "server/images.py:77,115 smart_resize resizes every image to a patch-aligned size within max_pixels, so the pixels the model sees are decided here (defines)."}
  - {part: "kv-spill-controller", field: "output_effect", recorded: "none", source_shows: "runtime/engine/Engine.hpp:145-158, 429, 641 the SSD cache's active-KV quota bounds a spilled request's output and ends it at that bound (changes_output)."}
