contradictions:
- part: expert-dispatch
  type: expert-dispatch
  claim: 'effect_on_output level ''approximate'': ''a deliberate change to the computation ... it needs the requester''s permission''
    (case ''approximate when it omits selected blocks'')'
  evidence: The tail skip that omits low-ranked missed experts is on by default on the CUDA serving path (inventory output_effect_when);
    docs/QUANTS.md:158 'STRATA_ROUTE_TAIL_SKIP=7, the default since 0.1.42'. No request asks for it.
  fix: approximate when it omits selected blocks; an engine may enable this by default, in which case the omission is recorded
    with the run's settings and can be turned off
- part: native-weight-loader
  type: model-loading
  claim: 'effect_on_output: exact when weights are used as stored, rounding only when re-encoding changes floating-point width'
  evidence: Choosing the stored GGUF block form over the pack form (both loaded unchanged) switches the head and projections
    to other kernels; output_effect numeric 'when native head or native projections in use'.
  fix: 'add: rounding when it chooses among stored encodings of a tensor, which selects other kernels'
- part: startup-memory-sizing
  type: memory-planning
  claim: 'gives: ''the context length and concurrency the engine can offer'''
  evidence: Context length and batch slot count arrive as engine arguments from launch-argument-resolver; this part only sizes
    the expert cache and prompt buffers from the remainder and never derives either.
  fix: 'gives: the context length and concurrency the engine can offer, or the check that the requested ones fit'
- part: prompt-path
  type: prompt-reading
  claim: 'must: ''The state it leaves is the state of that prompt up to rounding, whatever the chunking.'''
  evidence: 'output_effect_when: approximate when the optional approximate late-layer read is on; the type itself lists that
    approximate case and choice, so the must rule is not kept in that mode.'
  fix: Unless an approximate path the requester turned on is taken, the state it leaves is the state of that prompt up to
    rounding, whatever the chunking.
- part: expert-router
  type: layer-compute
  claim: 'must: ''The sequence of layers and operations the model defines is kept; only the order of accumulation inside one
    operation may vary.'''
  evidence: 'STRATA_ROUTE_PRIOR re-picks the 10 experts with a residency bonus and STRATA_ROUTE_RESIDENT swaps a tail expert
    for a resident one: the model''s selection is changed, which the type''s own choice ''any deliberate change to the model''s
    arithmetic'' allows.'
  fix: Unless a deliberate change the requester turned on is in effect, the sequence of layers and operations the model defines
    is kept; only the order of accumulation inside one operation may vary.
- part: resume-decision
  type: prefix-reuse
  claim: 'effect_on_output: rounding when ''state is stored at reduced width, was produced with other chunk boundaries, or
    batched and unbatched paths round differently'''
  evidence: 'output_effect_when: numeric also when the expert placement differs between the stored state and a cold read (experts
    computed on the CPU or the GPU round differently); no listed case covers it.'
  fix: 'rounding when the stored state was produced under other rounding than a cold read: reduced width, other chunk boundaries,
    another batch path, or computation placed on other devices'
- part: engine-client
  type: engine-supervision
  claim: 'effect_on_output: exact (only case)'
  evidence: Its own choice rewrites a requested top_k outside 1..64 to 64 before sending (serve/server.py:1659), which changes
    the sampled distribution.
  fix: 'exact, unless it rewrites request settings it passes to the engine: defines'
- part: ngram-reader
  type: row-source
  claim: 'state: ''row cache and the token history the row numbers are computed from'''
  evidence: owns_state is empty; the two-token history is advanced by the driver and the window commit and is ple_history
    owned by layer-kernels; the reader is handed the window's tokens and the two before them.
  fix: 'state: row cache; takes: the recent tokens the row numbers are computed from'
- part: draft-policy
  type: draft-policy
  claim: 'must: ''It changes how much is checked, never the rule by which a token is accepted.'''
  evidence: The exact gated acceptance rule runs only without the cost-aware window, without the lookup chain, without DFlash2
    and with windows of at most 8 rows; otherwise the verifier falls back to the older rule and warns the distribution is
    off (draft-verifier decision 3).
  fix: Its per-round choices never change the acceptance rule; a mode of the policy that forces another acceptance rule is
    stated with that mode.
- part: draft-policy
  type: draft-policy
  claim: 'effect_on_output: exact or rounding only'
  evidence: 'output_effect_when: distribution_exact when STRATA_SPEC_PROB=1 with the gated rule; under probabilistic acceptance
    the width and source change the draws but not the distribution.'
  fix: 'add: resampled when acceptance under sampling uses the proposal, so the chosen source and width change the draw but
    not the distribution'
- part: draft-verifier
  type: draft-verification
  claim: 'effect_on_output: exact ''when greedy decoding with exact agreement''; under sampling only resampled or approximate'
  evidence: 'Sampled requests in the default exact-match mode are bit_exact: each row''s draw is keyed by seed and absolute
    position, and a draft is accepted only when it equals that draw.'
  fix: exact when greedy, or when sampling draws each position from a stream keyed independently of the proposal and a proposal
    is accepted only when it equals that draw
- part: run-config-generator
  type: configuration
  claim: 'effect_on_output level ''approximate'' (case ''it turns on a setting that changes output''): ''it needs the requester''s
    permission'''
  evidence: Setup writes 8-bit integer K/V by default for any context above 8192 unless the person chooses otherwise; the
    lossy format is the default, not an opt-in.
  fix: approximate when it turns on a setting that changes output, by default or on request; a default that changes output
    is recorded as such
relaxations:
- part: prompt-path
  type: prompt-reading
  rule: Where chunk boundaries change stored state, the chunking is part of the key under which that state is reused.
  how: 'Resume points and checkpoints change the chunking of the prompt read (resume-decision, checkpoint-chain: numeric),
    but the reuse key is token ids, image keys and the steering flag only.'
- part: speed-calibration
  type: calibration
  rule: A recorded result is used only where its validity key matches the model, machine and build.
  how: A preset is still applied, with a re-check only offered, when the engine's tuning epoch, the driver or the preset's
    age changed.
- part: startup-memory-sizing
  type: memory-planning
  rule: A size the operator fixes by hand is checked against what was measured, or reported as unchecked.
  how: An explicit --expert-cache N is kept as asked; the after-allocation re-read of free memory against the reserve applies
    only to the automatic cache, so an explicit size is checked only by whether the allocation succeeds.
wrong_assignments:
- part: layer-kernels
  assigned: layer-compute
  better: recurrent-state-store (as also)
  why: It alone owns the recurrent state, the convolution/lookup history and the indexer keys (owns_state gdn_state, ple_history,
    indexer_keys); layer-compute has no state, so the second job is uncounted.
- part: engine-command-loop
  assigned: step-scheduler
  better: sequence-lifecycle (as also)
  why: Besides composing windows it owns the live conversation record and the batch slot table, the record of committed tokens
    and places that sequence-lifecycle owns.
- part: host-memory-admission
  assigned: memory-planning
  better: resource-governing (as also)
  why: It also runs on demand and tells the lookup-table reader to give its lock back when the arena or the conversation cache
    needs RAM, which is reclaim while running.
inventory_errors:
- part: prompt-builder
  field: output_effect
  recorded: none
  source_shows: The opt-in effort_position puts a non-default reasoning effort in an injected system turn and the effort sentence
    of the first system message can be replaced (serve/server.py:270, 4745, 5745-5778); a shipped template replaces a missing
    pack template. The prompt changes, so not none.
- part: engine-client
  field: output_effect
  recorded: none
  source_shows: 'keys += top_k={tk if 1 <= tk <= 64 else 64} (serve/server.py:1659): a requested top_k of 0 or above 64 is
    sent as 64, changing sampled output.'
- part: dflash2-drafter
  field: decisions
  recorded: Skip the draft round when the lookup match is at least this many tokens.
  source_shows: The skip is decided by the draft-policy rule skip_draft_for_lookup in include/strata/spec/window_rule.hpp,
    called from the host loop (src/program/generate.cpp:18893-18905, 20899-20913); it belongs to draft-policy.
- part: http-front
  field: decisions
  recorded: five admission and timeout decisions; nothing on who may call
  source_shows: An API key (Bearer or x-api-key), allowed host names and CORS origins gate /v1/* (serve/server.py:7605-7744,
    9906-9911); the who-is-allowed decision is missing.
- part: output-head
  field: output_effect
  recorded: numeric (not established)
  source_shows: On the pack path the mixed activation is quantised to 8-bit q8_K before the vocabulary projection (src/core/layer.cpp:1425);
    that is a reduced activation precision, not last-bit rounding.
