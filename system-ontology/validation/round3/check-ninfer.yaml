contradictions:
  - {part: "draft-head-builder", type: "model-conversion", claim: "effect exact when: it only re-arranges bytes, or changes only pieces used for proposals that the full model checks", evidence: "acceptance under sampling accepts draft i with probability p_i(draft_i) and samples the first rejection from p with the draft removed (include/ninfer/ops/speculative_accept.h 22-44; inventory draft-acceptance output_effect_when); a different draft head gives different proposals and so a different realised token sequence for the same seed", fix: "exact when it only re-arranges bytes, or changes proposal-only pieces under greedy decoding; resampled when it changes proposal-only pieces and acceptance under sampling uses the proposals"}
  - {part: "context-cost-calibrator", type: "calibration", claim: "effect_on_output: exact in itself; rounding only when its results set a split between devices", evidence: "its cost presets decide whether the resource manager restores a checkpoint or recomputes the prefix; the inventory records that a restored prefix was read with other chunk boundaries than a fresh read (context-resource-manager output_effect_when)", fix: "add: rounding when its results choose between restoring stored state and recomputing it"}
  - {part: "offload-mode-switch", type: "residency-policy", claim: "summary: Decide which selectively used weights are kept in fast memory, at startup from a ranking or while running from use.", evidence: "it changes the reusable region while running from the token count of each execution, not from use (inventory not: 'reacts to work size, not to which experts were used'); none of the three forms covers it", fix: "...at startup from a ranking, or while running from use or from the size of the work; add a form 'switched by work size between extra cache and streaming windows'"}
  - {part: "offload-mode-switch", type: "residency-policy", claim: "takes: how often each is used, or a ranking made offline", evidence: "takes the token count of the execution and the planner's layouts and thresholds", fix: "how often each is used, a ranking made offline, or the size of the coming work"}
  - {part: "offload-mode-switch", type: "residency-policy", claim: "state: use counts or the ranking", evidence: "owns the current region mode and refill progress", fix: "use counts, the ranking, or the current role of each region and its refill progress"}
  - {part: "executor", type: "device-backend", claim: "summary: choose the kernel variant for this device and step shape, submit, and retire completed work", evidence: "the executor accepts units into frames, passes them to rank programs and delivers result, commit and retirement events; kernel variants are chosen by registered shape profiles in the ops (layer-compute decisions)", fix: "Submit a step's work to the devices and report results and retirement in order; the kernel variant is chosen here or by the computation"}
  - {part: "vision-encoder", type: "modality-encoding", claim: "state: cache of encoded media", evidence: "keeps features only in a window lease until the matching text spans consume them; no cache of encoded media (src/models/common/vision has no cache)", fix: "encoded media held until consumed, and a cache of it where one exists"}
  - {part: "rank-launcher", type: "engine-supervision", claim: "summary: ... notice when it stalls or fails, and restart it", evidence: "on failure it stops submission and kills the remaining processes; any uncaught error fails all requests and stops the worker; no restart path exists in src", fix: "...notice when it stalls or fails, and restart it or stop it with every request ended"}
relaxations:
  - {part: "context-cost-calibrator", type: "calibration", rule: "A recorded result is used only where its validity key matches the model, machine and build.", how: "the preset key is the hardware class and the model's prefill signature; the CUDA driver and runtime versions are recorded in the report but not part of the key (bench/context_cost/context_cost_bench.cpp 357-497)"}
  - {part: "chunked-prefill", type: "prompt-reading", rule: "Where chunk boundaries change stored state, the chunking is part of the key under which that state is reused.", how: "checkpoints taken at chunk ends or semantic boundaries are reused without chunking in the key; the engine states no bitwise claim between a restored prefix and a fresh read"}
wrong_assignments:
  - {part: "expert-residency-planner", assigned: "residency-policy", better: "memory-planning", why: "it divides the remaining device bytes into fixed region, windows and extra cache, sizes CPU workers and upload slots, and refuses startup when nothing fits; which experts are held follows the priority table, so residency-policy is at most a second job"}
inventory_errors:
  - {part: "draft-head-builder", field: "output_effect", recorded: "none; changes only the acceptance rate", source_shows: "sampled acceptance draws depend on the proposals, so a different head changes the realised tokens under sampling (resampled) (include/ninfer/ops/speculative_accept.h 22-44)"}
  - {part: "mtp-drafter", field: "output_effect", recorded: "none; changes only how many tokens are accepted per round", source_shows: "under sampling the accepted draft and the correction draw depend on the proposal (include/ninfer/ops/speculative_accept.h 22-44); greedy results follow the verify block shape"}
  - {part: "block-drafter", field: "output_effect", recorded: "none; changes acceptance rate only", source_shows: "under sampling acceptance is min(1, p/q) and rejection resamples max(p-q,0), so the drawn tokens depend on q and the proposals (include/ninfer/ops/speculative_accept.h 60-67)"}
  - {part: "http-api", field: "does", recorded: "no mention of caller authorisation", source_shows: "an optional API key is checked as a Bearer or x-api-key header on every route except /health and OPTIONS (src/serve/http_server.cpp 164-191, 358-365)"}
