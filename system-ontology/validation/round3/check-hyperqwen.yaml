contradictions:
- part: calibration-data-capture
  type: calibration
  claim: 'state: the recorded results and the key that says what they are valid for'
  evidence: The capture writes hidden states, token ids and seqs.json (id, src, think, offsets) and Hessians with no record
    of which target checkpoint, quantisation or build produced them (drafter/capture.py:1-40); owns_state lists only resumable
    output and a lock.
  fix: 'state: the recorded results and, where the engine keeps one, the key that says what they are valid for; results without
    a key are valid only by convention'
- part: launch-profile-resolver
  type: configuration
  claim: 'effect_on_output: exact in itself; approximate when it turns on a setting that changes output'
  evidence: Its own choice of drafter and number of draft tokens changes greedy text through block-width rounding and changes
    the draw under sampling, which is rounding/resampled, not a deliberate change to computation or stored precision (inventory
    output_effect_when; context-lookup-proposer and draft-acceptance records).
  fix: 'add: rounding or resampled when it turns on speculation or another setting whose own effect is at that level; keep
    approximate for settings that change computation or stored precision'
- part: correctness-pins
  type: configuration
  claim: 'must: A combination known to give wrong output is refused by default; an operator''s override is explicit and recorded.'
  evidence: 'Most known-bad combinations are not refused but silently replaced: adaptive verify length pinned off, FULL capture
    forced to PIECEWISE, FlashInfer sampler switched off, STICKY limited to one request; only fp16 with a speculator refuses
    to boot. Nothing records that a pin or an override was applied.'
  fix: 'A combination known to give wrong output is not run by default: it is refused or one member is replaced by a safe
    setting; an operator''s override is explicit'
- part: memory-budget-planner
  type: memory-planning
  claim: 'must: The engine does not start serving on a plan that exceeds a hard limit; an estimate found over the limit is
    corrected or refused first.'
  evidence: 'With the pool pinned by bytes (KV_MEM) the plan is not checked: when pinned too full the first real batch OOMs
    on Linux, or under WSL2 the allocation silently spills into system RAM and serving continues 3-28x slower.'
  fix: A computed plan that exceeds a hard limit is corrected or refused before serving; a size fixed by the operator may
    bypass the check only as the should rule records
- part: request-scheduler
  type: step-scheduler
  claim: 'effect_on_output: rounding when which sequences share a step changes the arithmetic of a row'
  evidence: Here the scheduler also cuts prompts into chunks within the per-step token budget, and chunk boundaries change
    rounding (inventory output_effect_when); this engine has no separate prompt-reading part that would carry that case.
  fix: rounding when which sequences share a step, or where a prompt is cut into chunks, changes the arithmetic of a row
- part: full-attention-compute
  type: layer-compute
  claim: 'must: The sequence of layers and operations the model defines is kept; only the order of accumulation inside one
    operation may vary.'
  evidence: Opt-in sparse LSA attention attends to a budgeted subset of positions (exact only below about 4.6k tokens), and
    the int8-QK prefill path quantises Q and K; both change the operation, not only its accumulation order.
  fix: The sequence of layers and operations the model defines is kept; beyond the order of accumulation it changes only through
    an approximation the operator or requester explicitly enabled
- part: linear-gemm
  type: layer-compute
  claim: 'must: The sequence of layers and operations the model defines is kept; only the order of accumulation inside one
    operation may vary.'
  evidence: 'With VLLM_MARLIN_INPUT_DTYPE=int8 the selected layers quantise activations to int8 per token (batch default:
    MLP), reported perplexity +0.9 to +3.7 percent.'
  fix: 'same rewording as for full-attention-compute: changes beyond accumulation order only through an explicitly enabled
    approximation'
- part: image-encoder
  type: modality-encoding
  claim: 'effect_on_output: exact in itself; rounding / approximate by encoder width'
  evidence: This part also enforces a pixel cap of 2048 image tokens and one image per prompt, which decides how an image
    is resized before it reaches the model; the engine has no separate media-preparation part to carry the 'defines' case.
  fix: 'add: defines when the encoding node itself sets the resolution or token count media is reduced to'
- part: draft-acceptance
  type: draft-verification
  claim: 'summary: ...and make every kind of state reflect exactly that prefix; gives: state committed to the accepted prefix'
  evidence: The rejection sampler only reports the accepted count; it does not commit or roll back anything. KV of rejected
    positions is overwritten next step and recurrent state is selected from the per-draft slot by the store using the accepted
    index (inventory 'not').
  fix: 'gives: the accepted tokens and the accepted count by which each kind of state is committed, either by this node or
    by the state''s owner'
- part: stall-watchdog
  type: engine-supervision
  claim: 'summary: ...notice when it stalls or fails, and restart it.'
  evidence: The sentinel only logs one warning per stall episode; nothing restarts the engine or handles in-flight requests.
  fix: notice when it stalls or fails, and report it or restart it
relaxations:
- part: calibration-data-capture
  type: calibration
  rule: A recorded result is used only where its validity key matches the model, machine and build.
  how: 'No validity key exists: captured hidden states, Hessians and self-generated tokens are reused by the GPTQ requantizer
    and the vocabulary builder for whatever target directory they are pointed at; the type''s relaxed note (stale presets,
    compiled-in figures) does not describe this.'
wrong_assignments:
- part: engine-core-loop
  assigned: step-scheduler
  better: engine-supervision
  why: It runs the engine's process loop and the transport from the frontend, calling the scheduler once per step without
    deciding what a step contains, which is exactly what step-scheduler's own 'not' gives to engine supervision; its one decision
    (async scheduling) belongs to request-scheduler.
inventory_errors:
- part: gptq-requantizer
  field: decisions
  recorded: Width of the DFlash2 fc projection
  source_shows: The choice is the bit width of the fc projection (--fc-bits 4|8|16, default int4 GPTQ), not its dimension
    (drafter/quant_dflash2.py:5,9,29,59)
- part: context-lookup-proposer
  field: output_effect
  recorded: none
  source_shows: Its own output_effect_when says greedy text may flip on near ties because block length changes rounding, which
    is the 'numeric' level of the inventory brief (patches/dflash2-lookup-drafting.patch, as cited)
