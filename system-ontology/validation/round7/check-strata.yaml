contradictions:
- part: session-files
  type: session-persistence
  claim: 'effect_on_output: exact when loaded into the model and settings it was written for; approximate when loaded into
    other weights or settings (no rounding level)'
  evidence: The file's configuration identity leaves out the prompt chunk and the expert tier (session-files decisions), so
    a file written under one chunking or expert placement is accepted under another; the restored state then carries the rounding
    of the run that wrote it, which differs from a fresh read by rounding only (prompt-path, checkpoint-chain and resume-decision
    record chunking and placement as numeric).
  fix: 'Add rounding: when it is loaded under settings its identity leaves out that change only rounding, such as the prompt
    chunk or where blocks are computed.'
- part: mtp-drafter
  type: draft-proposal
  claim: 'output_principles: ''A change to pieces used only for proposals is exact under greedy decoding with exact acceptance
    only where ... Otherwise it is rounding, because proposals move the boundaries of checked blocks.'''
  evidence: The default route tail skip omits a missed expert only when every token of the verify window routes it at rank
    7 or lower (src/core/expert_source.cpp:4963-4982; default set in src/program/generate.cpp:12776-12822). The drafts in
    a window therefore decide which experts are omitted for the accepted rows, so under greedy decoding a change to the drafter
    changes output beyond rounding.
  fix: Otherwise it is at least rounding, and approximate where a default omission is decided over all rows of the checked
    block, so that the proposals decide what is omitted for accepted rows.
new_causes:
- part: prompt-path
  type: prompt-reading
  kind: through
  level: rounding
  cause: the share of a chunk's work it hands to a second device is set from running averages of measured times, so the same
    prompt can be split, and rounded, differently from run to run
  evidence: 'prompt-path decisions: the CPU share is the accelerator''s time per expert over the sum of both times, as running
    averages; sharing is switched off when the measured time does not improve. Principle 2 names which device computes, not
    that the choice follows timing. Cannot tell cleanly whether this is the node''s own effect (it decides the share) or through
    the second device that computes it.'
- part: adaptive-tier
  type: residency-policy
  kind: through
  level: approximate
  cause: where an opt-in routing change favours resident blocks, what it keeps resident changes which blocks are selected,
    not only where they are computed
  evidence: 'expert-router decisions: STRATA_ROUTE_PRIOR re-picks the top 10 with a bonus for experts resident in fast memory;
    STRATA_ROUTE_RESIDENT swaps a non-resident tail expert for a resident one. Opt-in, so principle 4 (default omission) does
    not name it; the same holds for the cache size set by startup-memory-sizing.'
- part: prompt-builder
  type: prompt-preparation
  kind: own
  level: defines
  cause: control-token text written inside a message is encoded as plain text, so the tokens differ from encoding the rendered
    text whole with the model's tokenizer
  evidence: 'prompt-builder must_never: only the template''s own control tokens become control tokens; control-token text
    inside a message is encoded as plain text.'
- part: mtp-drafter
  type: draft-proposal
  kind: own
  level: approximate
  cause: under an acceptance rule that does not preserve the distribution, the proposer's own probabilities (a masked, unnormalised
    measure) enter acceptance and shift the output distribution
  evidence: 'draft-verifier decisions: with STRATA_SPEC_PROB=1 the pick gate uses the draft measure; where the gated rule
    is not usable the older rule runs and the engine warns that its distribution is off (src/program/generate.cpp:3152-3175).
    The type''s approximate condition names only how many positions are taken greedily.'
- part: draft-policy
  type: draft-policy
  kind: through
  level: approximate
  cause: under an acceptance rule that does not preserve the distribution, the source and width it chooses each round change
    the distribution of the output
  evidence: Same older acceptance rule (src/program/generate.cpp:3152-3175); the policy chooses source and width per round.
    affects_output_through item 4 names only drafting versus not drafting deciding greedy versus sampled positions.
- part: cpu-expert-pool
  type: secondary-compute
  kind: own
  level: rounding
  cause: its arithmetic for one row depends on how many rows share the job, because grouped kernels carry every token routed
    to an expert
  evidence: 'draft-verifier output_effect_when: numeric with a native IQ pack and experts computed on the CPU, because grouped
    kernels round differently by window width; cpu-expert-pool records a window-invariant arithmetic option. The type''s rounding
    condition names only rounding differently from the main device.'
relaxations:
- part: speed-calibration
  type: calibration
  rule: A recorded result is used only where its validity key matches the model, machine and build.
  how: The calibration record is applied at launch when the model name, context length and image setting equal the configuration's
    (launch-argument-resolver), so the model is identified by name, not by its files; a preset whose driver or tuning epoch
    changed is still applied, with a re-check offered.
- part: output-head
  type: layer-compute
  rule: An approximation that is in effect is stated with the run's settings.
  how: On the pack path the activation is quantised to 8-bit q8_K before the vocabulary projection by default (src/core/layer.cpp:1425;
    avoided only by loading the head natively); no run-time statement of it is recorded, and the run manifest that lists tensor
    formats is off unless a file is named.
