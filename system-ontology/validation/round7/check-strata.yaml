- part: expert-cache
  field: output_effect
  recorded: none; bit_exact when the GPU and CPU expert kernels round identically
  source_shows: Under the default route tail skip a missed expert is omitted only when not resident (src/core/expert_source.cpp:4963-4982;
    default set in src/program/generate.cpp:12776-12822), so what the cache holds changes output beyond rounding, as the correction
    records for adaptive-tier.
- part: mtp-drafter
  field: output_effect_when
  recorded: bit_exact when the verifier's result for a token does not depend on which window it was verified in (and the arithmetic
    conditions hold); otherwise numeric
  source_shows: 'The default tail skip omits a missed expert only when every token of the verify window routes it at rank
    7 or lower (src/core/expert_source.cpp:4963-4982; default set in src/program/generate.cpp:12776-12822, on when batch slots
    are off), so the drafts and the window width decide what is omitted for the accepted rows: approximate on the default
    solo CUDA path, not bit_exact or numeric.'
