# DRAFT 0.7 for review. Generic node types of an inference engine.
#
# Induced from the parts inventories of five engines (validation/inventory/): Strata, ds4, HyperQwen, NInfer, Splash,
# 240 parts and 742 recorded decisions in all. Draft 0.2 was checked against those inventories by independent readers
# (validation/round2/) and drafts 0.3 to 0.6 again
# (validation/round3/ to validation/round6/); this draft answers what they found. A sixth engine is held out (validation/criteria.yaml).
#
# One part of an engine may realise two node types; a node type is a job, not a module boundary.
#
# A node type describes a kind of engine part, independent of any engine and any machine. It states what the part
# promises and not how it is built. It holds no parameter values, no call interfaces and no source references.
#
# Fields
#   summary           the one job
#   not               what is easily mistaken for its job
#   applies_when      the property of the model, machine or service that makes the node necessary; absent when every
#                     engine has it
#   support           present when the type has been seen in one engine only
#   forms             distinct ways engines realise it, when there is more than one
#   takes, gives      what it consumes and produces. Which node it connects to differs between engines and is stated
#                     at system level, not here.
#   state             what it alone keeps consistent
#   effect_on_output  how far the node's own work can make the returned text differ: its arithmetic, the precision
#                     it stores, the content it writes. Each case has its condition. The levels,
#                     from none to most:
#                       exact        the same tokens, bit for bit
#                       rounding     logits differ in their last bits. A greedy token can occasionally flip and a
#                                    sampled draw can differ; quality is not expected to change
#                       resampled    under sampling, the same distribution but a different draw for the same seed
#                       approximate  a deliberate change to the computation or to stored precision. Quality can
#                                    change. It is asked for, or it is a default of the engine that can be turned off
#                       defines      the node decides what the input or the returned output is, by design: the
#                                    template, the sampling settings, a constraint, where output stops
#                     The claim is the set of levels the node's own work reaches. The conditions are the causes
#                     seen in the engines examined, not a closed list.
#   affects_output_through
#                     what the node decides that other nodes' effects depend on. Through them it can reach
#                     their levels. Not a claim and not a closed list; see `output_principles`.
#   rules             what the node guarantees.
#                       must    kept by every engine examined
#                       should  a correctness rule that some engines relax; `relaxed` says how
#   choices           what is left for whoever builds the engine to decide, each with its kind:
#                     sizing | placement | policy | timing | threshold | failure | precedence | format
draft_version: '0.7'
induced_from:
- strata
- ds4
- hyperqwen
- ninfer
- splash
families:
- id: preparation
  title: Preparation
  about: 'What is done before the engine starts serving: converting the model''s files and measuring what later choices
    rest on.'
- id: startup
  title: Startup
  about: Loading the model and dividing the machine's resources before the first request.
- id: computation
  title: Computation
  about: Carrying out the model's arithmetic on the machine's devices.
- id: selective-weights
  title: Selectively used weights
  about: 'For models that use only some of their weights per token (experts, lookup rows): keeping the right ones within
    reach.'
- id: sequence-state
  title: Sequence state
  about: What the engine remembers per sequence, where it is kept, and how it is reused.
- id: speculation
  title: Speculation
  about: Proposing several tokens cheaply and having the full model check them.
- id: token-output
  title: Token output
  about: Turning logits into the tokens and text that are returned.
- id: serving
  title: Serving
  about: Everything between a client request and a step of the engine.
- id: multi-device
  title: Several devices
  about: One model spread over several devices or machines.
- id: operations
  title: Operations
  about: Settings, limits while running, and records of what happened.
output_principles:
- 'Own and indirect effects. `effect_on_output` lists what a node''s own work does: its arithmetic, the precision it stores,
  the content it writes. A node also changes output through other nodes when it decides something their effects depend on:
  how wide a step is, where a prompt is cut, which device computes, what is resident, what stored state survives, which
  setting is on. Such a node inherits the levels of the nodes it acts through. These indirect effects are not a claim of
  the node type; `affects_output_through` names the ones seen.'
- 'Anything that changes how the computation is cut is at least `rounding`: how many rows a step holds, where a prompt is
  cut into chunks, which device computes a block, which kernel variant runs, where a checked block begins and ends.'
- 'Where weights or kernels select activation precision by the width of a step, the amount of stored context or the device,
  the same decisions reach `approximate`. Seen in three engines, by three mechanisms: a permit recorded on the weights at
  conversion, a default of the kernel tier, and a threshold above which a second device takes a share.'
- 'Where one node omits or approximates work by default under a condition, every node that sets that condition reaches `approximate`
  through it. Seen where low-ranked selected blocks are omitted when not resident: the cache size, the residency policy
  and the number of open sequences all decide what is omitted.'
- A change to pieces used only for proposals is `exact` under greedy decoding with exact acceptance only where checked blocks
  are computed exactly as single-token decoding would. Otherwise it is `rounding`, because proposals move the boundaries
  of checked blocks. Under sampling it is `resampled` where acceptance uses the proposal, and `approximate` where the acceptance
  rule does not preserve the distribution.
- Stored state reused in place of recomputation carries the rounding and precision of the step that produced it, not of
  the step that would have recomputed it. This holds for a reused prefix, a restored checkpoint, and a paused sequence whose
  history is replayed.
types:
- id: model-conversion
  family: preparation
  summary: 'Offline, obtain, pin and record the published model and produce the files this engine reads: weights in the
    engine''s layout and precision where conversion is offline, and any derived pieces such as a reduced draft head or a
    corrected chat template.'
  not: It does nothing while the engine serves.
  takes:
  - the published checkpoint, tokenizer and template
  - calibration data, when precision is changed
  gives:
  - the engine's model files
  - a record of what was converted and how
  effect_on_output:
  - effect: exact
    when: it only re-arranges bytes, or changes only pieces used for proposals under greedy decoding where checked blocks
      are computed exactly as single-token decoding would
  - effect: rounding
    when: it re-expresses stored scales or other values in another floating-point form without changing the stored precision,
      or it changes pieces used only for proposals and the proposals move the boundaries of checked blocks
  - effect: resampled
    when: it changes pieces used only for proposals, and acceptance under sampling uses the proposals
  - effect: approximate
    when: it changes the precision or vocabulary of what the full model computes
  - effect: defines
    when: it rewrites the template
  rules:
  - strength: must
    rule: 'An interrupted or mismatched conversion is never accepted as complete: it is written under a temporary name until
      finished, or it is rejected when loaded.'
  choices:
  - kind: format
    what: file layout, alignment and ordering of weights
  - kind: format
    what: precision per kind of weight
  - kind: policy
    what: which derived pieces are built (draft head, shortlist vocabulary, extra copies)
  - kind: policy
    what: whether conversion is one step or resumable stages
  - kind: failure
    what: what happens to a conversion that is interrupted or does not match its source
  - kind: precedence
    what: which source wins when several checkpoints supply the same tensor
  - kind: sizing
    what: 'memory used while converting: whole files or piece by piece'
  - kind: policy
    what: the data a derived piece is selected or fitted from, and what is eligible for it
  - kind: format
    what: which reduced activation precisions each weight permits at run time, recorded with the weight
  - kind: policy
    what: which revision of the published sources is used, and whether it is pinned
  - kind: sizing
    what: the size of a derived piece
  - kind: policy
    what: 'how a derived template is corrected: which inputs it accepts and what each maps to'
  - kind: policy
    what: which optional parts of the published model are included
  - kind: policy
    what: precision per layer as well as per kind of weight
  - kind: format
    what: whether a tensor's stored shape is padded for the kernels
  - kind: timing
    what: the order of writes, and which write marks the conversion complete
  - kind: policy
    what: which source formats and architecture constants a recipe accepts
  - kind: policy
    what: which separately trained pieces are paired with which model
  - kind: policy
    what: whether files are rewritten in place, and how the originals are kept
- id: calibration
  family: preparation
  summary: Measure the model or the machine offline, at startup, or during an opt-in profiling run, and record results that
    other nodes take as fixed input.
  forms:
  - usage statistics of selectively used weights
  - cost or speed fits for a machine
  - statistics for lossy conversion
  - a split ratio between two devices
  takes:
  - the model and a set of prompts, or timings on the machine
  gives:
  - 'recorded data: usage rankings, cost fits, statistics for quantisation, per-machine settings'
  state:
  - the recorded results and, where the engine keeps one, the key that says what they are valid for
  effect_on_output:
  - effect: exact
    when: always, in its own work
  affects_output_through:
  - its results set a split between devices that round differently, or choose between restoring stored state and recomputing
    it
  - its results feed a lossy conversion or a reduced-precision path
  - its results feed the conversion or selection of pieces used only for proposals
  - the settings it measures and chooses decide which selected blocks another node's default omission skips
  rules:
  - strength: should
    rule: A recorded result is used only where its validity key matches the model, machine and build.
    relaxed: Engines apply stale presets or compiled-in figures from other machines, key on the model's shape only, leave
      driver and runtime versions out of the key, or keep no key at all. Such a value should be marked as a default, not
      as measured.
  choices:
  - kind: policy
    what: what is measured and on which prompts
  - kind: policy
    what: the rule that accepts or rejects a measured result
  - kind: timing
    what: offline, at install, or at every start
  - kind: precedence
    what: when a recorded result is trusted over a default or an operator setting
  - kind: failure
    what: what is used when no valid record exists
  - kind: threshold
    what: when a stored record is considered stale
  - kind: sizing
    what: time budget of a measurement run
  - kind: policy
    what: which settings a measurement may choose on its own, by their effect on output
  - kind: policy
    what: the key that states which model, machine and build a result is valid for
  - kind: policy
    what: how measured counts are turned into a ranking
  - kind: policy
    what: the form of the model fitted to the measurements
  - kind: policy
    what: whether a negative result is recorded and reused
  - kind: sizing
    what: how much data a measurement collects
  - kind: threshold
    what: the noise tolerated when a result is accepted
  - kind: policy
    what: which capacities or settings a profile simulates
  - kind: policy
    what: whether a measurement runs the serving path or a slower instrumented path that exposes internal values
  - kind: threshold
    what: the least gain a measured result must predict before the setting it supports is turned on
- id: model-loading
  family: startup
  summary: At startup, and again whenever released weights are restored, open the model's files, check they are something
    this engine can run, and make the weights every token uses readable by the computation.
  not: It does not decide how much memory each consumer gets; memory planning does.
  takes:
  - the engine's model files
  - a placement plan
  gives:
  - resident weights
  - the model's shape and tensor directory
  - where selectively used weights lie in the files
  effect_on_output:
  - effect: exact
    when: weights are used as stored, re-encoded without changing their values, or reduced only for proposals under greedy
      decoding
  - effect: rounding
    when: re-encoding changes floating-point width, or it chooses among stored encodings of a tensor and so selects other
      kernels, or re-encoding into the form a kernel reads moves a rare stored value by one step
  - effect: resampled
    when: it reduces weights used only for proposals, and acceptance under sampling uses the proposals
  - effect: approximate
    when: weights the full model computes with are quantised or otherwise reduced while loading, or it extends the model's
      positional range in a way that changes the computation at every length, or by default it selects a lower-precision
      stored copy of weights the full model computes with
  rules:
  - strength: must
    rule: A file whose declared shape the kernels cannot run is refused, not loaded.
  choices:
  - kind: placement
    what: map the file in place or copy into memory
  - kind: placement
    what: which tensors go to which memory or device
  - kind: format
    what: whether weights are re-encoded at load and how
  - kind: timing
    what: what is loaded at start and what on first use
  - kind: failure
    what: what is done when a file is the wrong version, incomplete or of an unsupported shape
  - kind: sizing
    what: staging buffers and reader threads used while loading
  - kind: format
    what: which stored encoding of a tensor is loaded when the files carry more than one, and which kernels accept it
  - kind: precedence
    what: a load option turned on from what the files carry against an operator value
  - kind: placement
    what: whether resident weights are locked in memory
  - kind: policy
    what: which optional parts of the model are loaded at all
  - kind: policy
    what: whether parts in different precisions may be loaded together
  - kind: policy
    what: reading files through the operating system's cache or around it
  - kind: policy
    what: whether the model's positional range is extended beyond its trained length
  - kind: policy
    what: how file reads are aligned and shared when several destinations need the same bytes
  - kind: policy
    what: how the model's architecture is recognised from its files and matched to what the kernels support
  - kind: policy
    what: which metadata must be present, and which falls back to built-in values
  - kind: policy
    what: which parts are left out at load to be streamed later
- id: memory-planning
  family: startup
  summary: At startup, divide the memory budget among resident weights, per-sequence state, working space, reserves and
    caches, and refuse to start when the minimum does not fit.
  takes:
  - the budget and the operator's limits
  - the model's shape
  - what the machine reports as its capacity or as free
  gives:
  - sizes for caches, state pools and work areas
  - which large parts stay in memory and which are streamed
  - the context length and concurrency the engine can offer, or the check that the requested ones fit
  effect_on_output:
  - effect: exact
    when: always, in its own work
  affects_output_through:
  - what it places where decides which device computes something, or a size it sets, such as the prompt chunk, changes how
    the computation is cut
  - a size it sets decides whether a default approximation of another node is in effect
  - a capacity it sets bounds how many rows share a step
  rules:
  - strength: must
    rule: A computed plan that exceeds a hard limit is corrected or refused before the engine serves.
  - strength: should
    rule: A size the operator fixes by hand is checked against what was measured, or reported as unchecked.
    relaxed: Two engines keep an operator-fixed size without checking it beyond whether the allocation succeeds. One can
      then run out of memory on the first batch, or on one platform spill into system memory and run several times slower
      without an error.
  choices:
  - kind: sizing
    what: the reserve left free
  - kind: sizing
    what: what is priced before caches get the remainder
  - kind: policy
    what: how the remainder is split between cache, state and concurrency
  - kind: failure
    what: the order in which things are given up when memory is short, and when starting is refused
  - kind: timing
    what: whether free memory is read again after allocating
  - kind: precedence
    what: an operator's explicit size against the computed one
  - kind: policy
    what: whether a figure is measured by a trial run or computed
  - kind: policy
    what: whether memories that share one physical capacity are accounted as one budget or separately
  - kind: sizing
    what: capacity planned per device or pooled across devices
  - kind: sizing
    what: workers given to a second compute device, and what is left free
  - kind: policy
    what: a hard limit against a soft figure that may be exceeded with a warning
  - kind: sizing
    what: whether a cache's share is counted in uniform units or in bytes of blocks of different sizes
  - kind: sizing
    what: how cache capacity is divided between layers, and between fixed and reusable regions
  - kind: sizing
    what: staging slots and streaming space, sized from the largest blocks, and what is used when they do not fit
  - kind: policy
    what: which large parts stream instead of staying resident, and whether alternative sets are compared
  - kind: sizing
    what: the least a cache may be and still work
  - kind: failure
    what: whether a failed allocation is retried smaller, and by how much
  - kind: timing
    what: when memory is locked or held back during startup, and when it is released
  - kind: policy
    what: what bounds the context length
  - kind: policy
    what: 'how a figure is measured: after which warm-up and from which counter'
  - kind: failure
    what: what is assumed when a figure cannot be read
- id: graph-capture
  family: startup
  summary: 'Prepare the computation for fast repeated execution: compile kernels, warm up, and record execution graphs for
    the step shapes the engine will run.'
  applies_when: The device benefits from pre-recorded or pre-compiled work, or first-use compilation would stall a request.
  takes:
  - the loaded model
  - the step shapes that can occur
  gives:
  - compiled kernels and recorded graphs ready to replay
  state:
  - compiled kernels and recorded graphs
  effect_on_output:
  - effect: exact
    when: intended
  - effect: rounding
    when: a recorded graph fixes a kernel variant or buffer layout that differs from the unrecorded path
  rules:
  - strength: must
    rule: A recorded graph is not replayed after the addresses or shapes it fixed have changed.
  - strength: should
    rule: A step shape or feature combination a recorded graph mishandles is refused at configuration.
    relaxed: Found as defects after the fact in one engine and then pinned off.
  choices:
  - kind: policy
    what: which step shapes are recorded ahead and which on first use
  - kind: sizing
    what: the memory recorded graphs may take
  - kind: timing
    what: recorded at startup or lazily
  - kind: failure
    what: what is done when recording runs out of memory
  - kind: policy
    what: where a graph must be split so that host work can run between its parts
  - kind: policy
    what: the key that decides whether a stored compiled artifact may be reused
  - kind: policy
    what: which step dimensions compiled kernels may be specialised on
  - kind: sizing
    what: upper bound on the number of recorded layouts
  - kind: policy
    what: whole-step or piecewise recording, per profile
  - kind: sizing
    what: ranges of context length that graphs are recorded for
- id: layer-compute
  family: computation
  summary: 'Compute what the model defines: embedding, attention of every kind the model has, recurrent layers, feed-forward
    blocks, expert selection and the selected experts, and the projection to the vocabulary.'
  takes:
  - the tokens of the step
  - resident weights
  - per-sequence state
  - weights or rows brought in for this step
  gives:
  - updated per-sequence state
  - logits
  - hidden features other nodes ask for
  effect_on_output:
  - effect: exact
    when: as the definition of the model's arithmetic, on one kernel path
  - effect: rounding
    when: kernel, device, batch shape or the order of accumulation inside an operation differs
  - effect: approximate
    when: activations are computed at reduced precision or an operation is approximated, including a reduced activation
      precision selected by how many rows a step holds, whether the weights permit it or the kernels choose it
  rules:
  - strength: must
    rule: Unless an approximation is in effect that was turned on at conversion or at run time, explicitly or as a default
      that can be turned off, the sequence of layers and operations the model defines is kept. Otherwise only the order
      of accumulation inside one operation may vary.
  - strength: should
    rule: An approximation that is in effect is stated with the run's settings.
    relaxed: One engine reduces activation precision for steps of two or more rows by default and reports it only when it
      is turned off. Another takes it from a permit fixed in the converted files, states it nowhere at run time, and offers
      no switch short of converting again.
  choices:
  - kind: format
    what: kernel variant per weight precision
  - kind: policy
    what: which operations are fused
  - kind: policy
    what: activation precision inside kernels
  - kind: policy
    what: any deliberate change to the model's arithmetic (it changes output and needs permission)
  - kind: policy
    what: kernel variant per device class, step shape and stored-state format
  - kind: timing
    what: how independent operations are ordered to overlap with work on another device
  - kind: sizing
    what: working space a kernel may hold, allocated ahead or during steps
  - kind: failure
    what: whether results are checked for non-finite values, and what is done then
  - kind: placement
    what: how a block's computation is divided when the model is split over devices
  - kind: placement
    what: conditions under which a weight may be read from slower memory
  - kind: policy
    what: which rows of a step are carried through every part of the model
  - kind: format
    what: precision and layout in which the computation writes the per-position state it appends
  - kind: format
    what: the order of heads or channels the kernels compute in, where it differs from the published order
- id: device-backend
  family: computation
  summary: 'Drive a device for a step''s work: submit it, report results and retirement in order, and choose the kernel
    variant for the device and step shape where the computation does not.'
  takes:
  - the work of one step
  - what the device is
  gives:
  - submitted commands
  - completion and retirement signals
  state:
  - device buffers and what is in flight
  effect_on_output:
  - effect: exact
    when: one variant per operation
  - effect: rounding
    when: the variant chosen depends on device class, step shape or batch width
  - effect: approximate
    when: the variant it chooses for a device, a step width or the amount of stored context a step reads computes activations
      at reduced precision
  rules:
  - strength: must
    rule: Memory still read by submitted work is not released or reused.
  choices:
  - kind: policy
    what: how a kernel variant is chosen per device and step shape
  - kind: timing
    what: where a step is split so host work can run inside it
  - kind: sizing
    what: scratch and command buffers
  - kind: failure
    what: what is done when a submission fails or does not complete
  - kind: placement
    what: devices driven in the engine's process or through worker processes
  - kind: placement
    what: how the memory a submission may touch is declared to the device and kept resident for it
  - kind: sizing
    what: frames or command buffers in flight
  - kind: policy
    what: kernel variant per stored tensor format
  - kind: policy
    what: whether the device is kept busy through short host steps
- id: secondary-compute
  family: computation
  summary: Compute a share of a layer's work on a second device, from weights it can read where they lie or that are prepared
    for it ahead of the layer.
  applies_when: A second device can compute something sooner than moving its inputs to the main device, or has spare capacity
    the main device lacks.
  forms:
  - selected experts on the CPU
  - a share of a dense block on another accelerator
  takes:
  - the share of work assigned to it
  - weights readable by the second device
  gives:
  - partial results merged into the layer's output
  effect_on_output:
  - effect: exact
    when: the second device rounds exactly as the main one
  - effect: rounding
    when: it rounds differently
  - effect: approximate
    when: it computes at a lower precision than the main device
  rules:
  - strength: must
    rule: Weights handed to it stay readable for the whole of its computation.
  choices:
  - kind: sizing
    what: number of workers
  - kind: policy
    what: how work is cut into jobs
  - kind: threshold
    what: when a share is too small or too large to hand over
  - kind: failure
    what: what is done when it hangs or falls behind
  - kind: timing
    what: how idle workers wait
  - kind: placement
    what: how work is placed across the memory nodes of the second device
  - kind: format
    what: kernel variant per instruction set of the second device
  - kind: policy
    what: whether the calling thread takes jobs itself
  - kind: sizing
    what: the size of the program or job a share uses
  - kind: threshold
    what: when the second device is stopped for lack of gain
- id: model-edit
  family: computation
  summary: Apply a deliberate, optional change to the model's computation at run time, such as adding or removing a direction
    in its activations.
  applies_when: The engine offers run-time changes to the model's behaviour.
  support: one engine so far
  takes:
  - the edit and its strength
  gives:
  - a changed computation
  effect_on_output:
  - effect: approximate
    when: 'always: it is a deliberate change and needs permission'
  rules:
  - strength: must
    rule: An edit is applied only when asked for, and its use is visible in the run's settings.
  choices:
  - kind: policy
    what: which edits are offered and where in the model they apply
  - kind: threshold
    what: the range of strength allowed
  - kind: precedence
    what: a per-request edit against an engine-wide one
  - kind: policy
    what: whether an edited sequence may share a batched step with others
- id: step-execution
  family: computation
  summary: 'Carry one planned step through the model: a decode step, a verify block or a prompt chunk, for one sequence
    or for several sharing the step.'
  takes:
  - the plan of one step
  - per-sequence state
  gives:
  - logits or accepted tokens for each sequence in the step
  - updated state
  effect_on_output:
  - effect: exact
    when: every row's arithmetic is independent of how many rows the step holds
  - effect: rounding
    when: sequences sharing a step, or the number of rows of one sequence's step, change the arithmetic of a row
  - effect: approximate
    when: it runs a variant that omits work or alters selection, or the width of the step selects a reduced activation precision
      that the weights permit or the kernels choose
  rules:
  - strength: must
    rule: A step's results are used only after the work that produces them is complete.
  - strength: must
    rule: A step's memory is reused only after all of its device work has retired.
  choices:
  - kind: policy
    what: one step as a whole, or driven layer by layer
  - kind: sizing
    what: sequences and rows per step
  - kind: threshold
    what: how long a layer may wait for something it needs
  - kind: failure
    what: what is done when a step cannot complete
  - kind: policy
    what: multi-row or per-row kernels for the rows of a step
  - kind: timing
    what: cutting a step into parts so that work on two devices overlaps
  - kind: timing
    what: when side inputs a layer needs are gathered within the step
  - kind: policy
    what: whether proposing runs inside the same step as the token it follows
  - kind: policy
    what: the conditions a sequence must meet to share a batched path, and what is done otherwise
  - kind: policy
    what: which kinds of step are replayed from a recorded graph and which are launched directly
  - kind: timing
    what: how long the host waits for a device signal before it checks for a fault
  - kind: sizing
    what: how many proposed rows are passed on for checking
  - kind: timing
    what: 'how host-side inputs of consecutive steps are kept apart: a barrier before reuse, or one buffer per step in flight'
- id: prompt-reading
  family: computation
  summary: Read a prompt in chunks, faster than token by token, and leave behind the state generation continues from.
  applies_when: The engine reads prompts by a path of its own. Engines that put prompt chunks and decode rows in the same
    step have no separate node.
  takes:
  - prompt tokens
  - the position reading starts from
  gives:
  - per-sequence state up to the end of the prompt
  effect_on_output:
  - effect: exact
    when: it uses the same kernels and state precision as single-token decoding
  - effect: rounding
    when: the chunk path uses other kernels, or chunk boundaries change how state is rounded
  - effect: approximate
    when: it takes an approximate path for part of the prompt, or wide chunks run at a reduced activation precision that
      the weights permit or the kernels choose
  rules:
  - strength: must
    rule: Unless an approximation is in effect that was turned on explicitly or as a default that can be turned off, the
      state it leaves is the state of that prompt up to rounding, whatever the chunking. Where activation precision follows
      the width of a chunk, it is that state up to that precision.
  - strength: should
    rule: Where chunk boundaries change stored state, reuse of that state either keys on the chunking or is declared to
      differ in rounding from a fresh read.
    relaxed: No engine examined keys on the chunking. One aligns stored boundaries to a fixed multiple; the others reuse
      the state without stating the difference.
  choices:
  - kind: sizing
    what: chunk size
  - kind: timing
    what: how it shares the device with generation in progress
  - kind: policy
    what: whether it may borrow memory held by caches
  - kind: policy
    what: whether what it selects counts toward cache usage
  - kind: timing
    what: state snapshots taken on the way
  - kind: failure
    what: what is done when a chunk does not fit
  - kind: policy
    what: how the work of a chunk is shared with a second device, and when sharing is abandoned
  - kind: failure
    what: what state is kept when reading is interrupted or cancelled
  - kind: policy
    what: whether an approximate path may be taken for part of the prompt
  - kind: policy
    what: whether chunks of several sequences are read together, layer by layer
  - kind: sizing
    what: passes over the layers per chunk
- id: media-preparation
  family: computation
  summary: Fetch, decode and prepare input that is not text (images, video, documents) into the form the model's encoder
    takes.
  applies_when: The engine serves input other than text.
  takes:
  - media or references to media from the request
  gives:
  - prepared media, with an identity later nodes can cache on
  state:
  - cache of prepared media
  effect_on_output:
  - effect: exact
    when: in itself
  - effect: defines
    when: 'how media is converted, resized or cut decides the model''s input: text extracted, pages rendered, images scaled'
  rules:
  - strength: must
    rule: Media is not fetched or decoded outside the limits set for size, time and origin.
  choices:
  - kind: threshold
    what: limits on size, time and where media may be fetched from
  - kind: policy
    what: how media is resized, cut or sampled to fit the model
  - kind: policy
    what: caching of prepared media and its key
  - kind: failure
    what: what is done with media that is too large, malformed or of an unsupported kind
  - kind: policy
    what: whether untrusted formats are handled in an isolated process
  - kind: policy
    what: 'which sources of media are accepted: inline data, remote fetch, local files'
- id: modality-encoding
  family: computation
  summary: Run the model's encoder for input that is not text and produce the embeddings the model takes in its place.
  applies_when: The model accepts input other than text and the engine serves it.
  takes:
  - prepared media
  gives:
  - embedding rows placed in the prompt
  state:
  - encoded media held until consumed, and a cache of it where one exists
  effect_on_output:
  - effect: exact
    when: in itself
  - effect: rounding
    when: the encoder runs at another floating-point width
  - effect: approximate
    when: the encoder runs at reduced precision
  - effect: defines
    when: the encoding node itself sets the resolution or the number of embedding rows media is reduced to
  rules:
  - strength: must
    rule: Embeddings are placed at the positions the prompt reserves for them.
  choices:
  - kind: sizing
    what: memory window for the encoder
  - kind: policy
    what: whether encoder weights stay resident
  - kind: policy
    what: caching of encoded media and its key
  - kind: placement
    what: how encoding work is split across devices
  - kind: policy
    what: whether state that contains encoded media may be stored or reused
  - kind: threshold
    what: the largest input the encoder accepts, and how many embedding rows one prompt may carry
  - kind: placement
    what: how encoder weights that are not resident are brought to the device
  - kind: policy
    what: whether the encoder is loaded at all, and whether its working memory is built only when media waits
  - kind: policy
    what: which complete units are encoded in one execution
  - kind: policy
    what: what the cache of encoded media evicts first and what it must keep
- id: expert-source
  family: selective-weights
  summary: Keep every selectively used weight obtainable for the whole run from the slow place where all of them are held.
  applies_when: The model selects a few of many weight blocks per token, and they do not all sit in the memory the computation
    reads.
  takes:
  - where each one lies in the files
  gives:
  - the bytes of any requested one
  effect_on_output:
  - effect: exact
    when: always, in its own work
  affects_output_through:
  - what it makes readable by a device decides which device computes a block
  rules:
  - strength: must
    rule: What it delivers is complete; a partial read is an error, never reported as ready.
  choices:
  - kind: placement
    what: 'where the full set lives: host memory, mapped file, or storage'
  - kind: policy
    what: read through the page cache or around it
  - kind: sizing
    what: memory locked for the full set
  - kind: failure
    what: what is used when the preferred place cannot hold the full set
  - kind: sizing
    what: workers used to fill the full set at startup
  - kind: placement
    what: how much of the full set is made directly readable by a device, and which part first
  - kind: policy
    what: page size of the memory holding the full set, and what is used when large pages cannot be had
  - kind: format
    what: which stored copy or encoding the full set is filled from
  - kind: timing
    what: how long to wait for memory another process is still releasing
  - kind: threshold
    what: when a shortfall is still accepted because reclaimable memory covers it
- id: expert-cache
  family: selective-weights
  summary: Hold as many selectively used weights in fast memory as its budget allows, and answer for any of them whether
    it is there and where.
  not: Which blocks are kept is decided by the residency policy. The cache may still arrange, compact and pin what it holds.
  applies_when: Not all selectively used weights fit in fast memory, or a copy in fast memory is faster to compute from.
  takes:
  - its size
  - incoming weights
  - changes to its contents
  gives:
  - 'for each requested block: its slot, or that it is absent'
  state:
  - which block is in which slot
  effect_on_output:
  - effect: exact
    when: always, in its own work
  affects_output_through:
  - what it holds decides which device computes a block, and the devices round differently
  rules:
  - strength: must
    rule: Every reader of a block is ordered after the arrival of all its bytes, by completion or by the ordering of the
      stream.
  - strength: must
    rule: A slot is not overwritten while a computation may still read it.
  choices:
  - kind: sizing
    what: total size and whether it can grow or shrink while running
  - kind: format
    what: fixed slots or sized per block
  - kind: placement
    what: one region or several with different roles
  - kind: failure
    what: what is done when it is full and nothing can be released
  - kind: policy
    what: the key that identifies a cached block
  - kind: failure
    what: what is done when the cache cannot be allocated at its planned size
  - kind: policy
    what: whether it arranges, compacts or pins what it holds by size
  - kind: sizing
    what: how many uses of cached blocks may be open at once
  - kind: policy
    what: which part is released or regrown first under memory pressure
- id: residency-policy
  family: selective-weights
  summary: 'Decide which selectively used weights are kept in fast memory: at startup from a ranking, or while running from
    use or from the size of the coming work.'
  applies_when: There is a cache of selectively used weights.
  forms:
  - fixed at startup from an offline ranking
  - adjusted while running from use counts
  - a preloaded list
  - regions switched by the size of the coming work between extra cache and streaming space
  takes:
  - how often each is used, a ranking made offline, or the size of the coming work
  gives:
  - what enters and what leaves
  state:
  - the use history it decides from (use counts, or recency lists with remembered evictions), the ranking, or the current
    role of each region
  effect_on_output:
  - effect: exact
    when: always, in its own work
  affects_output_through:
  - what is resident decides which device computes a block
  - where a dispatch omits selected blocks that are not resident, what it keeps resident decides which are omitted
  rules:
  - strength: must
    rule: A change of contents never makes a block unavailable to a computation already started.
  choices:
  - kind: policy
    what: fixed from an offline ranking, or adjusted from use while running
  - kind: policy
    what: the replacement rule
  - kind: timing
    what: on every miss or at intervals
  - kind: threshold
    what: the gain a change must bring, and a limit on changes per round
  - kind: policy
    what: what the cache holds before any request
  - kind: policy
    what: whether a region changes role with load
  - kind: failure
    what: what is done when every candidate for replacement is still in use
  - kind: failure
    what: which ranking is used when no recorded ranking matches the model
  - kind: policy
    what: how use counts age, so that recent use outweighs old use
  - kind: threshold
    what: the least use that qualifies a block to enter
  - kind: policy
    what: whether warming at startup is used at all, per model
  - kind: timing
    what: what event changes the role of a region, such as the size of the coming work
- id: expert-fetch
  family: selective-weights
  summary: Bring absent selectively used weights into fast memory, in an order the computation that follows can rely on.
  applies_when: There is a cache of selectively used weights.
  forms:
  - fetches a computation waits for
  - best-effort warming ahead of need
  takes:
  - requests for absent blocks
  - their bytes from the source
  gives:
  - the blocks in fast memory, and a signal when each is ready
  state:
  - what is staged or in flight
  effect_on_output:
  - effect: exact
    when: blocks arrive as stored
  - effect: rounding
    when: blocks are transformed on the way
  rules:
  - strength: must
    rule: A fetch a computation depends on is complete before that computation starts. Best-effort warming carries no such
      obligation.
  choices:
  - kind: sizing
    what: staging area and how many fetches at once
  - kind: timing
    what: whether it fetches ahead of selection, and from what prediction
  - kind: timing
    what: how fetching overlaps with computation
  - kind: policy
    what: one reader shared with other reads or its own
  - kind: failure
    what: what is done when a read fails or is short
  - kind: precedence
    what: fetches the current computation needs over those made ahead
  - kind: policy
    what: how outstanding reads are ordered and joined
  - kind: policy
    what: 'the mechanism used: explicit read, a hint to the operating system, or touching a mapping'
  - kind: format
    what: blocks copied as stored or transformed on the way
  - kind: policy
    what: copies made one by one or batched
  - kind: sizing
    what: piece size of reads made ahead of need
  - kind: placement
    what: which part of the stored set is warmed ahead, and which is skipped because it is already resident
- id: expert-dispatch
  family: selective-weights
  summary: 'For each layer of each step, decide how every selected block gets computed: from fast memory, after a fetch,
    by another device, or not at all.'
  applies_when: Selected blocks can be in more than one place or computed by more than one device.
  takes:
  - which blocks each token selected
  - what is resident
  gives:
  - a plan for the layer
  - fetch requests
  - use counts
  effect_on_output:
  - effect: exact
    when: every selected block is computed by the same device
  - effect: rounding
    when: blocks are split between devices that round differently, or the split follows which fetches have completed when
      the layer starts, so one request can round differently from run to run
  - effect: approximate
    when: it omits selected blocks
  rules:
  - strength: must
    rule: Every selected block that is not deliberately omitted is computed exactly once in the step that selected it.
  choices:
  - kind: policy
    what: the order in which the ways are tried
  - kind: policy
    what: whether low-ranked selections may be omitted
  - kind: threshold
    what: the share of misses fetched now against left to another device
  - kind: timing
    what: computing resident blocks while absent ones arrive
  - kind: threshold
    what: when computing resident blocks ahead of absent ones is switched on
  - kind: policy
    what: whether the split is decided from a snapshot of what is ready at the start of the layer
  - kind: threshold
    what: the share of selected blocks already in fast memory above which omitting low-ranked selections is off by default,
      and the weight formats for which it is never on
- id: row-source
  family: selective-weights
  summary: Serve the rows of a large table that each token needs, without holding the whole table in fast memory.
  applies_when: The model has a table of which each token reads a few rows.
  takes:
  - the row numbers for the coming tokens, or the recent tokens they are computed from
  - the table on storage
  gives:
  - the rows, before the layer that uses them
  state:
  - 'where the node keeps them: a row cache, and the recent tokens the row numbers are computed from'
  effect_on_output:
  - effect: exact
    when: always, in its own work
  rules:
  - strength: must
    rule: The rows delivered for a token are the rows that token's keys name.
  choices:
  - kind: placement
    what: the table on storage, mapped, or locked in memory
  - kind: sizing
    what: row cache
  - kind: timing
    what: prefetching rows for coming or drafted tokens
  - kind: policy
    what: warming the table in the background and when to stop
  - kind: failure
    what: what is done when a row read fails
  - kind: sizing
    what: reads in flight at once
  - kind: policy
    what: reads through the operating system's cache or around it
  - kind: policy
    what: how row reads for many tokens are batched, deduplicated and ordered
  - kind: precedence
    what: rows needed now over rows fetched ahead
  - kind: threshold
    what: the read speed below which another read mode is used
  - kind: timing
    what: when row reads start relative to the layer that uses them
  - kind: sizing
    what: warming threads, and how often memory pressure is checked
  - kind: placement
    what: the table on storage or divided across devices, by deployment
- id: storage-reader
  family: selective-weights
  summary: Run the engine's reads from storage for every node that needs them, so that reads the current step depends on
    go ahead of reads made ahead of need.
  applies_when: Several kinds of data are read from the same storage while the engine runs.
  support: one engine so far
  takes:
  - read requests from several nodes
  gives:
  - the bytes read, and failures
  state:
  - queued and in-flight reads
  effect_on_output:
  - effect: exact
    when: always, in its own work
  rules:
  - strength: must
    rule: A read the current step waits for is not delayed behind reads made ahead of need.
  - strength: must
    rule: A failed or short read is reported to the node that asked, never passed on as data.
  choices:
  - kind: sizing
    what: number of reader threads
  - kind: precedence
    what: reads the step waits for over reads ahead of need, and reads over writes on one device
  - kind: failure
    what: how a failed read is reported and retried
- id: positional-state-store
  family: sequence-state
  summary: Hold the state a model keeps per position (attention keys and values, and any compressed or indexed form of them),
    in the format chosen for storage. This covers the served model and any secondary model, such as a draft model, that
    keeps state per position.
  not: Handing out, sharing and compacting the pages state lives in is the state pool's job where one exists.
  takes:
  - new state from the computation
  - how much it may hold
  gives:
  - past state to the computation
  state:
  - per-position state of each sequence
  effect_on_output:
  - effect: exact
    when: state is stored as computed
  - effect: rounding
    when: stored at another floating-point width
  - effect: approximate
    when: stored quantised or compressed, or state reused later is held at a staging precision or already converted to the
      stored format, depending on load
  rules:
  - strength: must
    rule: State of a position that is not part of the valid sequence is never read as history.
  choices:
  - kind: format
    what: precision and layout of stored state
  - kind: sizing
    what: page size and growth
  - kind: policy
    what: whether going back is by truncation, and when it is not possible
  - kind: failure
    what: what is done when a sequence outgrows its allowance
  - kind: placement
    what: how many positions stay in fast memory, and the least that must
  - kind: placement
    what: where a secondary model's per-position state is kept
  - kind: timing
    what: when state held in a staging precision is converted to its stored format
  - kind: policy
    what: which positions are kept at higher precision than the stored format
  - kind: failure
    what: what is done with pending writes for memory that has changed owner
  - kind: sizing
    what: a staging area for state not yet in its stored format
  - kind: format
    what: how pages of different sizes are presented to the kernels
  - kind: policy
    what: whether derived per-position state is kept for reuse, or only the inputs it is recomputed from
  - kind: timing
    what: when derived per-position state is rebuilt after a restore
- id: recurrent-state-store
  family: sequence-state
  summary: 'Hold state that is fixed in size and overwritten as the sequence advances, with what is needed to go back: snapshots,
    a second copy, one slot per proposed position, or a commit deferred until acceptance is known.'
  applies_when: The model has state that cannot be cut back to an earlier position, such as recurrent or convolution state.
  takes:
  - state updates from the computation
  gives:
  - current state
  - the means to return to the last accepted position
  state:
  - the recurrent state and what is kept to go back
  effect_on_output:
  - effect: exact
    when: stored as computed
  - effect: rounding
    when: stored at a reduced floating-point width
  rules:
  - strength: must
    rule: After proposed tokens are rejected, the state continues from the last accepted position.
  choices:
  - kind: policy
    what: 'how rejected steps are undone: snapshots, one slot per draft position, or late commit'
  - kind: sizing
    what: how many snapshots are kept
  - kind: format
    what: precision of stored state
  - kind: timing
    what: when a snapshot is taken
  - kind: placement
    what: state held per sequence or drawn from a shared pool
  - kind: timing
    what: when state is copied across a block boundary while a prompt is read
- id: state-pool
  family: sequence-state
  summary: 'Own the memory that sequences'' state shares: lay it out in pages, hand pages out and take them back, track
    who owns each, compact, and let shared pages be read by several sequences.'
  applies_when: Several sequences are in the engine at once and share one backing memory for state.
  takes:
  - requests for pages
  - releases
  gives:
  - pages
  - who may read or write each
  state:
  - ownership, reference counts and the free list
  effect_on_output:
  - effect: exact
    when: in itself
  - effect: approximate
    when: the pool itself fixes a quantised stored format
  affects_output_through:
  - the order in which it reuses freed pages decides which stored state survives for reuse
  rules:
  - strength: must
    rule: A page is never written on behalf of a sequence that no longer owns it.
  choices:
  - kind: sizing
    what: page size and how the pool is split between kinds of state
  - kind: policy
    what: sharing and copy-on-write
  - kind: policy
    what: the order in which free pages are reused
  - kind: failure
    what: what is done when the pool is exhausted
  - kind: sizing
    what: page geometry shared by kinds of state of different sizes
  - kind: policy
    what: whether pages that fall out of the model's view are released before the sequence ends
  - kind: threshold
    what: when fragmented space is compacted and emptied memory returned
  - kind: policy
    what: whether holders of content and in-flight readers of its address are counted separately
  - kind: format
    what: precision and layout of the state the pages hold, where the pool fixes it
  - kind: sizing
    what: 'what the pool is charged for beyond live sequences: batches in flight, speculative scratch, checkpoints'
  - kind: sizing
    what: target size of a contiguous run of pages
- id: state-tiering
  family: sequence-state
  summary: Move per-sequence state out of fast memory to a slower place and back, so that more sequences or longer contexts
    fit, or so that state evicted from fast memory is restored instead of recomputed.
  applies_when: State in fast memory exceeds what fits, for long contexts or many sequences.
  takes:
  - state chosen to leave fast memory
  - requests to bring state back
  gives:
  - state restored where the computation reads it
  state:
  - what is on the slower tier
  effect_on_output:
  - effect: exact
    when: state comes back as it left
  - effect: rounding
    when: it is held at another precision on the slower tier
  - effect: defines
    when: the slower tier's capacity bounds how long a sequence may grow, and output is ended at that bound
  rules:
  - strength: must
    rule: State brought back is the state that left, or the read is reported failed and nothing computed from it is committed.
  choices:
  - kind: placement
    what: 'the slower tier: host memory, storage, another device'
  - kind: policy
    what: what leaves first
  - kind: timing
    what: copying ahead of need
  - kind: sizing
    what: the tier's size and write budget
  - kind: failure
    what: what is done when the tier is full or a read fails
  - kind: policy
    what: which kinds of state the slower tier holds
  - kind: failure
    what: whether the slower tier survives a restart, and when a persisted tier is discarded
  - kind: sizing
    what: the fast-memory cache for state read back
  - kind: policy
    what: which pieces of different kinds of state are kept together so that a restored state is usable
  - kind: sizing
    what: chunking and staging of copies between tiers
  - kind: timing
    what: whether copying to the slower tier yields to work waiting for memory
  - kind: timing
    what: what event moves a sequence's state to the slower tier, and which sequences start there
  - kind: sizing
    what: share of writes in flight per kind of state
  - kind: policy
    what: whether state not in use is dropped when the write budget is spent
- id: prefix-reuse
  family: sequence-state
  summary: Find stored state that a new or resumed request can continue from, and make the sequence hold exactly that state.
  takes:
  - the request's tokens
  - stored state and what it is valid for
  gives:
  - the position reading continues from
  - restored state
  state:
  - the stored states with what each is valid for, and an index of them where one is kept
  effect_on_output:
  - effect: exact
    when: the engine's arithmetic does not depend on how a state was reached
  - effect: rounding
    when: 'the stored state was produced under other rounding than a fresh read: reduced width, other chunk boundaries,
      another batch path, or computation placed on other devices, or where it places a restore point splits the prompt read
      and so changes the chunking of the request that stores it'
  - effect: approximate
    when: state made under other weights or settings is reused, or the stored state was produced at another activation precision
      than a fresh read would use
  rules:
  - strength: should
    rule: Stored state is reused only where the model, the weights' precision, the settings and the prefix match what it
      was made for.
    relaxed: One engine reuses stored state across weight precisions by default, and its key leaves out settings that change
      the stored state, such as a model edit or the activation-precision mode.
  choices:
  - kind: policy
    what: the key that decides whether stored state may be reused
  - kind: policy
    what: where restore points exist when state cannot be truncated
  - kind: sizing
    what: how many are kept and where
  - kind: policy
    what: what is evicted first
  - kind: threshold
    what: when restoring is refused in favour of reading again
  - kind: policy
    what: whether a hit takes the stored state or copies it
  - kind: precedence
    what: which store is used when several hold a match
  - kind: timing
    what: when state is stored for later reuse
  - kind: policy
    what: storing all of a sequence's state or only what changed
  - kind: placement
    what: which device restored state is placed on
  - kind: policy
    what: whether stored state is trimmed to what later steps can still read
  - kind: threshold
    what: memory that must stay free on the tier holding stored state after a store or restore
  - kind: policy
    what: how the memory available to the store is measured, and when a store is refused
  - kind: policy
    what: whether stored prefixes are found through a kept index or by scanning the store
  - kind: policy
    what: whether a request may pin stored state against eviction
  - kind: sizing
    what: the unit in which prefixes are hashed
  - kind: policy
    what: 'what earns stored state its retention: recency, cost to rebuild, or actual reuse'
  - kind: policy
    what: 'how stored state is organised: independent entries, a chain, or a tree whose resident part stays connected'
- id: session-persistence
  family: sequence-state
  summary: Write a sequence's whole state to a file and read it back, on request or when a store of reusable state asks
    for it.
  applies_when: The engine offers saving and restoring sessions.
  takes:
  - a sequence's state
  gives:
  - a file
  - a restored sequence
  effect_on_output:
  - effect: exact
    when: loaded into the model and settings it was written for
  - effect: approximate
    when: loaded into other weights or settings
  rules:
  - strength: should
    rule: A file is loaded only where its recorded identity matches the model and settings.
    relaxed: 'Identity checks are partial in the engines examined: a size and edges fingerprint in one, cross-precision
      loads allowed in another.'
  choices:
  - kind: format
    what: what the file contains and its version
  - kind: failure
    what: what is done with a file that does not match
  - kind: sizing
    what: storage space that must remain free after a write
  - kind: failure
    what: what is given up, and for how long a save is retried, when memory is short
  - kind: policy
    what: in which configurations saving and restoring is offered
  - kind: policy
    what: what forms the identity a file is checked against
- id: draft-proposal
  family: speculation
  summary: Cheaply propose the next few tokens, and when needed their probabilities, for the full model to check.
  not: Deciding whether to draft at all, or skipping the proposer when another source suffices, is the draft policy's job.
  applies_when: 'A cheap source of proposals exists: a draft head of the model, a separate small model, or repetition in
    the text.'
  forms:
  - a draft head of the model
  - a separate draft model
  - lookup of earlier text
  - several sources fused per position
  takes:
  - hidden features or recent tokens
  - how many to propose
  gives:
  - proposed tokens
  - their proposal probabilities, when acceptance needs them
  effect_on_output:
  - effect: exact
    when: greedy decoding with exact acceptance, where checked blocks are computed exactly as single-token decoding would
  - effect: rounding
    when: the number of proposals sets the width of the checked block, or the proposals decide where checked blocks begin
      and end, and block arithmetic differs from single-token decoding
  - effect: resampled
    when: acceptance under sampling uses the proposal
  - effect: approximate
    when: the width of the checked block selects a reduced activation precision that the weights permit or the kernels choose,
      or under an acceptance rule that does not preserve the distribution, how many tokens it proposes decides how many
      positions are taken greedily
  rules:
  - strength: must
    rule: A proposed token is never returned to the client before the full model has accepted it.
  choices:
  - kind: policy
    what: the source of proposals
  - kind: sizing
    what: how many per round
  - kind: threshold
    what: when a chain of proposals stops
  - kind: policy
    what: greedy or sampled proposals
  - kind: policy
    what: how its own state is kept in step after checking
  - kind: policy
    what: the set of tokens proposals are restricted to, and whether a cheaper reduced output head is used
  - kind: sizing
    what: how much context and history the proposer's own state covers
  - kind: placement
    what: where the proposer's own state is kept
  - kind: failure
    what: what the proposer needs before it may propose, and what is done when it cannot cover the context
  - kind: timing
    what: how the proposer's state is built while the prompt is read
  - kind: threshold
    what: how a lookup source matches earlier text, and how far back it searches
  - kind: precedence
    what: how several sources are combined at each position
  - kind: sizing
    what: candidates kept per proposed position
  - kind: policy
    what: whether proposing is offered in modes that require output equal to non-speculative decoding
  - kind: sizing
    what: rows the proposer's recorded graphs hold
  - kind: policy
    what: how the proposed block relates to the block length the proposer was trained on
  - kind: threshold
    what: the shortest match a lookup extends on, and how many tokens it may append
  - kind: policy
    what: whether the number proposed adapts to recent acceptance
- id: draft-policy
  family: speculation
  summary: Decide each round whether to draft, from which source, and how many proposed tokens are sent for checking.
  applies_when: The amount of drafting is adjusted while running.
  takes:
  - acceptance results
  - the cost of a round
  gives:
  - the next round's size and source
  state:
  - 'the signals it decides from: estimates of acceptance and cost, or the current mode and what ends it'
  effect_on_output:
  - effect: exact
    when: always, in its own work
  affects_output_through:
  - the number of rows checked changes rounding; when the decision depends on timing, the result can differ between runs
  - acceptance under sampling uses the proposal, so the source and width it chooses change the draw but not the distribution
  - the number of rows it has checked selects a reduced activation precision that the weights permit or the kernels choose
  - under an acceptance rule that does not preserve the distribution, whether it drafts in a round decides whether that
    round's tokens are taken greedily or sampled
  rules:
  - strength: must
    rule: Its choices within a round never change the rule by which a token is accepted. A mode of the policy that requires
      another acceptance rule is stated with that mode.
  choices:
  - kind: policy
    what: what it optimises
  - kind: threshold
    what: when drafting pauses and resumes
  - kind: timing
    what: how often it re-decides
  - kind: sizing
    what: limits on the round
  - kind: policy
    what: the rule for choosing among sources
  - kind: policy
    what: whether the proposer is skipped when another source suffices
  - kind: policy
    what: decisions per sequence or jointly across sequences sharing a step
  - kind: timing
    what: how fresh the signals it decides from must be
  - kind: policy
    what: whether it departs from its estimate to explore
  - kind: threshold
    what: the probability below which a round ends
  - kind: policy
    what: whether the round's width is chosen from each proposal's probability and the measured cost of each width
  - kind: policy
    what: 'in which modes drafting is offered: single request only, greedy only'
  - kind: timing
    what: whether its estimates persist across requests
  - kind: threshold
    what: how many qualifying steps enter and leave a mode
  - kind: policy
    what: whether its decisions may use measured time or only counts, since decisions from timing make runs differ
  - kind: threshold
    what: a context length below which the larger round is taken whatever the other signals say
- id: draft-verification
  family: speculation
  summary: Decide how many proposed tokens the full model accepts, and see that every kind of state comes to reflect exactly
    that prefix, by committing it or by giving each state's owner the accepted count.
  applies_when: Tokens are proposed ahead.
  forms:
  - acceptance and commit in one part
  - acceptance, then a separate commit after the accepted prefix has been shortened by stop conditions
  takes:
  - the full model's logits for the proposed positions
  - the proposals and, under sampling, their probabilities
  gives:
  - the accepted tokens
  - the accepted count by which each kind of state is committed, here or by the state's owner
  effect_on_output:
  - effect: exact
    when: greedy decoding with exact agreement and the checked block computed by the same kernels and accumulation order
      as single-token decoding, or sampling where each position's draw is keyed independently of the proposal and a proposal
      is accepted only when it equals that draw
  - effect: rounding
    when: the checked block is computed by another path than single-token decoding
  - effect: resampled
    when: sampling with a rule that preserves the distribution
  - effect: approximate
    when: an acceptance rule that does not preserve the distribution, or the checked block runs at a reduced activation
      precision that the weights permit or the kernels choose
  rules:
  - strength: must
    rule: All state read as history reflects the accepted prefix; state of rejected positions may remain only if it is overwritten
      before any read.
  choices:
  - kind: policy
    what: the acceptance rule under sampling
  - kind: policy
    what: how each kind of state is committed or undone
  - kind: timing
    what: commit at once or with the next step
  - kind: policy
    what: who may shorten the accepted prefix afterwards (stop conditions, limits)
  - kind: policy
    what: how the random draws for acceptance and correction are keyed
  - kind: policy
    what: whether the commit runs from a recorded graph or directly
  - kind: policy
    what: 'how a corrected token is evaluated: in the same step or as an ordinary next step'
  - kind: policy
    what: whether a stop or last permitted token is returned without a further check by the full model
  - kind: policy
    what: which step dimensions the acceptance kernels may be specialised on
- id: sampling
  family: token-output
  summary: Turn each position's logits into one token by a chain of steps, with the settings that apply at that position.
  takes:
  - logits
  - the request's sampling settings
  - any mask from an output constraint
  gives:
  - the chosen token
  - its probabilities, when asked
  effect_on_output:
  - effect: exact
    when: it implements the requested chain and random stream as the reference does
  - effect: rounding
    when: the same chain differs only in floating point
  - effect: resampled
    when: under speculation the draw also depends on the proposal
  - effect: defines
    when: its chain, order, defaults, per-position settings or source of randomness are its own
  rules:
  - strength: must
    rule: With a fixed seed, fixed logits and, under speculation, fixed proposals, it returns the same token.
  choices:
  - kind: policy
    what: the chain of steps and their order
  - kind: policy
    what: 'where it runs: with the computation or outside it'
  - kind: policy
    what: the source of randomness and what it is keyed on
  - kind: sizing
    what: limits on candidates considered
  - kind: precedence
    what: default settings against the request's
  - kind: policy
    what: whether settings change per position, for example greedy on structure and sampled on content
  - kind: policy
    what: which tokens penalties count
  - kind: policy
    what: how ties are broken
  - kind: policy
    what: how the draw is formed when speculation needs a residual distribution
  - kind: policy
    what: what is done with accepted proposed tokens when the per-position settings change inside them
  - kind: policy
    what: the kernel used for the sampling arithmetic, and how it changes with the number of rows
  - kind: failure
    what: how non-finite logits are handled
  - kind: policy
    what: the default values of the settings
- id: output-constraint
  family: token-output
  summary: 'Restrict or force which tokens may come next, from a rule outside the model: a grammar, a tool-call format,
    a budget.'
  not: Changing sampling settings per position without forbidding any token is sampling, not a constraint.
  applies_when: The service offers constrained output, or a format that must be enforced.
  takes:
  - the rule
  - the tokens produced so far
  gives:
  - a mask or forced tokens for the next position
  state:
  - per-sequence position in the rule
  effect_on_output:
  - effect: exact
    when: the rule never forbids or forces a token the model would not have produced
  - effect: defines
    when: the rule forbids or forces a token the model would otherwise have produced
  rules:
  - strength: must
    rule: A token the rule forbids is never returned.
  choices:
  - kind: policy
    what: which rules are offered
  - kind: timing
    what: where the mask is computed relative to the step
  - kind: policy
    what: how it applies to proposed tokens that are not yet accepted
  - kind: failure
    what: what is done when the rule leaves no legal token
  - kind: sizing
    what: caching of compiled rules, its key and budget
  - kind: policy
    what: which requests a rule is applied to, and which constraint languages may be combined
- id: output-interpretation
  family: token-output
  summary: 'Turn produced tokens into what is returned: text, the split between reasoning, answer and tool calls, and the
    decision where the output stops.'
  takes:
  - produced tokens
  - the request's stop conditions and limits
  gives:
  - text and structured parts
  - the point at which generation ends
  state:
  - per-request parse position
  effect_on_output:
  - effect: exact
    when: it only labels and divides the generated text
  - effect: defines
    when: it decides where output stops, repairs or drops text, injects tokens, or drives the generation again, or it substitutes
      remembered generated text for the client's resubmitted version of earlier output
  rules:
  - strength: must
    rule: Text is not returned while it could still turn out to be part of a stop sequence.
  choices:
  - kind: policy
    what: stop conditions and their order
  - kind: policy
    what: how tool calls are parsed, repaired or retried
  - kind: threshold
    what: guards against degenerate output
  - kind: policy
    what: how the generation is driven and continued for one request
  - kind: failure
    what: what is returned when parsing fails
  - kind: precedence
    what: which source of a generation setting wins
  - kind: policy
    what: how requests take turns when the engine serves one at a time
  - kind: policy
    what: what happens to held state when output is cut by a stop condition
  - kind: policy
    what: which generation features are used when several requests are served together
  - kind: threshold
    what: a budget on the reasoning part, and what is done when it is reached
  - kind: failure
    what: whether a generation that fails before anything was returned is run again
  - kind: format
    what: reasoning and tool formats per model family
  - kind: timing
    what: keep-alive for a response stream with nothing to send
- id: request-front
  family: serving
  summary: Accept requests over the protocols offered, hold the connection, and return results.
  takes:
  - client requests
  gives:
  - requests for the engine
  - responses to the client
  state:
  - connections, and stored responses where the engine offers them
  effect_on_output:
  - effect: exact
    when: always, in its own work
  rules:
  - strength: must
    rule: A request is accepted only from callers the deployment allows. An engine with no caller check of its own says
      so and relies on where it listens.
  choices:
  - kind: policy
    what: protocols offered
  - kind: policy
    what: who is allowed and how
  - kind: sizing
    what: limits on connections, body size and queue
  - kind: failure
    what: what is done on disconnect, timeout or overload
  - kind: policy
    what: whether earlier responses are stored for later requests to refer to
  - kind: policy
    what: the names a request may use for the served model
  - kind: policy
    what: which per-request controls a caller may set
  - kind: timing
    what: keep-alive for a response stream with nothing to send
  - kind: timing
    what: how often a closed connection is looked for
  - kind: policy
    what: 'what the engine exposes about itself: health, metrics, or nothing'
  - kind: policy
    what: what is exposed by default when no credential is set
  - kind: sizing
    what: limits on stored responses
- id: prompt-preparation
  family: serving
  summary: Turn a request's messages, tools and settings into the exact prompt tokens.
  takes:
  - messages, tools and settings
  gives:
  - prompt tokens and the token limit
  effect_on_output:
  - effect: exact
    when: it applies the model's own template and tokenizer unchanged
  - effect: defines
    when: it corrects the template, injects text, shortens input, sets or shortens the output limit, or tokenizes in pieces
  rules:
  - strength: must
    rule: Token ids come from the model's vocabulary, and the sequence is the tokenizer's output for the whole text or a
      stated joining of pieces at recorded boundaries.
  choices:
  - kind: policy
    what: the template used and how it is corrected
  - kind: policy
    what: what happens when prompt plus output exceed the context
  - kind: sizing
    what: caches of rendered or tokenized prompts
  - kind: policy
    what: keeping the start of the prompt stable so that stored state can be reused
  - kind: precedence
    what: defaults against the request's settings
  - kind: policy
    what: which tokenizer implementation is used, and how it is held to the reference tokenizer's output
  - kind: policy
    what: whether the prompt is tokenized whole or in pieces joined at a reuse boundary
  - kind: threshold
    what: tokens kept free between prompt plus output and the context length
  - kind: policy
    what: what an absent output limit means
  - kind: policy
    what: which earlier content is dropped from history when rendering
  - kind: policy
    what: where restore points may be placed in the prompt
- id: step-scheduler
  family: serving
  summary: 'Run the engine''s loop: decide each cycle what the next step contains, which sequences join it, and what waits.'
  not: Running the process loop without deciding what a step contains is engine supervision. A loop that decides which sequences
    advance in each step is a step scheduler, even when it is also the process loop.
  takes:
  - waiting and running sequences
  - what each needs next
  gives:
  - the plan of the next step
  state:
  - queues of sequences and their turn
  effect_on_output:
  - effect: exact
    when: always, in its own work
  affects_output_through:
  - which sequences share a step, or where it cuts a prompt into chunks, changes the arithmetic of a row
  - the number of rows it puts in a step selects a reduced activation precision that the weights permit or the kernels choose
  - whether a prompt chunk runs alone or shares its step selects another kernel or precision
  - the rows it puts in a chunk decide whether a threshold is reached above which a second device computes part of the work
  rules:
  - strength: must
    rule: Every admitted sequence is eventually served or ended with an explicit error. Where the engine bounds the wait,
      the bound is stated.
  choices:
  - kind: policy
    what: whether prompt reading and generation share a step
  - kind: policy
    what: order and fairness between sequences
  - kind: sizing
    what: sequences and rows per step
  - kind: timing
    what: how a long prompt yields to generation in progress
  - kind: policy
    what: which sequence is paused when resources run short
  - kind: threshold
    what: when a sequence is overdue
  - kind: timing
    what: how long a step waits to gather sequences
  - kind: sizing
    what: limit on waiting work
  - kind: timing
    what: whether the next step is planned while the current one runs
  - kind: timing
    what: how the loop waits when idle, and where housekeeping runs
  - kind: policy
    what: how sequences are grouped to flow through devices a model is split over
  - kind: timing
    what: what is saved on a clean stop
  - kind: timing
    what: when waiting work is reconsidered for admission
  - kind: policy
    what: the order of work within one cycle
  - kind: sizing
    what: the time slice a sequence gets before others are considered
  - kind: policy
    what: 'what admission is counted in: sequences or memory pages'
  - kind: failure
    what: whether a sequence is paused and recomputed when shared memory is full
  - kind: threshold
    what: the fewest sequences for which batching is used
  - kind: policy
    what: whether prompt chunks of several sequences are grouped into one step that runs layer by layer
- id: sequence-lifecycle
  family: serving
  summary: 'Own each sequence''s life in the engine: admit it, give it a place, keep the record of the tokens whose state
    is live, pause and resume it, and release it.'
  takes:
  - a request for the engine
  - what is free
  gives:
  - an admitted sequence with a place
  - its record of committed tokens
  state:
  - per-sequence record and place
  effect_on_output:
  - effect: exact
    when: always, in its own work
  affects_output_through:
  - the place it assigns, alone or shared, changes the arithmetic
  - the place it assigns puts the sequence in steps wide enough to select a reduced activation precision that the weights
    permit or the kernels choose
  - a paused sequence that is released and resumed has its history recomputed by the prompt-reading path, with other cuts,
    kernels or precision than the steps that first produced it
  - how many sequences it keeps open turns on or off a default approximation that must not make one sequence depend on another
  rules:
  - strength: must
    rule: The record of committed tokens matches the state held for the sequence, or the sequence is marked invalid and
      its state is not read until rebuilt.
  choices:
  - kind: policy
    what: 'how a request is matched to a place: a slot or a lane'
  - kind: policy
    what: admission when resources are short
  - kind: policy
    what: 'how a paused sequence is kept: in place, copied out, or released and replayed'
  - kind: sizing
    what: how many sequences at once
  - kind: failure
    what: what is done with a sequence whose state has become invalid
  - kind: policy
    what: the order in which waiting prompts are read, and whether several are read together
  - kind: sizing
    what: a sequence's state allocated up front or grown on demand
  - kind: threshold
    what: how long a sequence may wait for resources before it fails
  - kind: policy
    what: whether a request waits for state another request is producing
  - kind: policy
    what: 'how a sequence is taken back to an earlier position: truncation, restoring a snapshot, or rebuilding from its
      tokens'
  - kind: precedence
    what: which running sequence gives way when resources run short, and which place is repurposed first
  - kind: policy
    what: how a request's coming output is estimated for admission
  - kind: failure
    what: retries on another place after a refusal, and how long a refused place is avoided
  - kind: timing
    what: how long a place is held for an engine that has gone silent
  - kind: policy
    what: when a sequence moves between a shared path and a solo path
- id: replica-routing
  family: serving
  summary: Present several independent copies of the engine as one, and choose which copy serves each request.
  applies_when: Several whole copies of the engine run side by side.
  support: one engine so far
  takes:
  - requests
  - the load and state of each copy
  gives:
  - the copy that serves a request
  state:
  - what each copy is doing and what state it holds
  effect_on_output:
  - effect: exact
    when: always, in its own work
  affects_output_through:
  - copies differ in device or in what they hold
  rules:
  - strength: must
    rule: A request continues on a copy that holds its state, or its state is rebuilt before it continues.
  choices:
  - kind: policy
    what: 'how a request is matched to a copy: least loaded, or the one holding reusable state'
  - kind: placement
    what: whether copies share one host copy of the weights
  - kind: failure
    what: how often a failed copy is restarted and what happens to its requests
  - kind: sizing
    what: how many copies run
  - kind: policy
    what: how it tracks what state each copy holds
- id: engine-supervision
  family: serving
  summary: Start the engine in order, run its process loop and the transport to the serving side, notice when it stalls
    or fails, and report it, restart it, or stop it with every request ended.
  not: Deciding what each step contains is the step scheduler's job, also where one loop does both.
  forms:
  - one engine process
  - one worker process per device or rank, started, watched and stopped together
  takes:
  - start and stop commands
  - liveness signals
  gives:
  - a running engine
  - failure reports
  state:
  - the engine's start stage and health
  effect_on_output:
  - effect: exact
    when: it passes requests on unchanged
  - effect: defines
    when: it rewrites request settings on the way to the engine
  affects_output_through:
  - a start retried with a reduced configuration drops or swaps a setting that has an effect, such as speculation or the
    source of proposals
  - preparing the next step while the current one runs fixes the width of steps differently from planning in turn
  rules:
  - strength: must
    rule: A request is not sent to an engine that has not finished starting.
  choices:
  - kind: policy
    what: the engine in the serving process or in its own
  - kind: timing
    what: the stages of a start and what is retried
  - kind: threshold
    what: when the engine counts as stalled or failed
  - kind: failure
    what: restart, and what happens to requests in flight
  - kind: timing
    what: when an idle engine is unloaded
  - kind: failure
    what: whether a failed start is retried with a reduced configuration, and what is dropped first
  - kind: failure
    what: how a request suspected of causing failures is identified and refused
  - kind: policy
    what: the transport between the serving side and the engine
  - kind: policy
    what: whether request settings are rewritten on the way to the engine, and how values the engine does not support are
      handled
  - kind: policy
    what: whether the stall monitor is independent of the loop it watches
  - kind: policy
    what: where warm-up gets its memory, and whether it may take memory serving will need
  - kind: timing
    what: where the process loop runs housekeeping between steps
  - kind: timing
    what: what is saved on a clean stop, and within what time
  - kind: threshold
    what: after how many failures in what time the engine is not started again, and the wait between restarts
  - kind: failure
    what: which failures are treated as permanent and which as caused by memory
  - kind: sizing
    what: limit on input waiting at the transport
  - kind: format
    what: message encoding of the transport, and whether versions must match
  - kind: timing
    what: whether the process loop prepares the next step while the current one runs on the device
- id: scoring
  family: serving
  summary: Compute the model's probabilities for given text or given options, without generating.
  applies_when: The service offers scoring.
  takes:
  - text or options to score
  gives:
  - log-probabilities
  effect_on_output:
  - effect: exact
  - effect: rounding
    when: the scored sequence is read in steps of another width than generation uses
  - effect: approximate
    when: the width of the scoring steps selects a reduced activation precision that the weights permit or the kernels choose
  - effect: defines
    when: it renders its own prompt around the given text or options, or normalises the returned probabilities over the
      given options only
  rules:
  - strength: must
    rule: A score is computed by the same model and weights as generation.
  - strength: should
    rule: Where kernels or precision depend on the width of a step, the width a score was computed at is stated with it.
    relaxed: One engine returns scores computed in prompt-width steps without saying so.
  choices:
  - kind: policy
    what: whether scoring shares the engine with generation or runs alone
  - kind: sizing
    what: limits on what can be scored
  - kind: policy
    what: which options can be scored in one step
- id: model-partitioning
  family: multi-device
  summary: Decide how one model is split over several devices or machines, and keep the parts in step.
  applies_when: The model is spread over more than one device or machine.
  forms:
  - whole layers on different devices
  - each layer's weights split across devices and partial results combined
  - selectively used weights divided between machines
  - stages of layers in a pipeline
  takes:
  - the model's shape
  - the devices and their memory
  gives:
  - which part of the model each device holds and computes
  state:
  - the partition plan
  effect_on_output:
  - effect: exact
    when: whole layers on different devices at full precision
  - effect: rounding
    when: partial results are combined across devices, or activations cross at another floating-point width
  - effect: approximate
    when: activations cross between devices quantised
  rules:
  - strength: must
    rule: Where a layer is split, every device makes the same selection so that the parts agree.
  - strength: must
    rule: Where layers are staged, every stage advances from the same token prefix.
  choices:
  - kind: policy
    what: split by layers, by parts of each layer, or by selectively used weights
  - kind: sizing
    what: per-device budgets
  - kind: failure
    what: what is done when a device or link is lost
  - kind: policy
    what: which devices may hold a part of the model
  - kind: failure
    what: what the parts must agree on before they run together
  - kind: timing
    what: where the parts synchronise on control events such as cancellation
  - kind: policy
    what: how work outside the layers is divided between the parts
  - kind: format
    what: precision of activations exchanged
  - kind: sizing
    what: how much may be in flight between stages
  - kind: placement
    what: which parts are replicated on every device instead of split
  - kind: policy
    what: which other engine features may be combined with splitting the model, and which are refused
  - kind: policy
    what: how parts are packed onto devices within their budgets
  - kind: policy
    what: for which models and device counts each kind of split is offered
  - kind: policy
    what: 'how speculation is divided: who proposes, who checks, and how a commit is applied across the parts'
  - kind: placement
    what: where auxiliary tables live under each deployment
- id: device-communication
  family: multi-device
  summary: Move activations and partial results between the devices or machines a model is split over.
  applies_when: The model is spread over more than one device or machine.
  takes:
  - partial results
  gives:
  - combined results on each device
  effect_on_output:
  - effect: exact
    when: it only moves data, or combines in the same order as one device would
  - effect: rounding
    when: it combines partial sums in another order
  rules:
  - strength: must
    rule: Data is combined only from the same step on every device.
  choices:
  - kind: policy
    what: the transport
  - kind: sizing
    what: buffers registered for transfer
  - kind: failure
    what: what is done when a transfer fails or a peer falls out of step
  - kind: policy
    what: whether the transport is chosen automatically or fixed by the operator
- id: configuration
  family: operations
  summary: Turn the operator's choices and the machine's facts into one validated set of settings, and refuse combinations
    the engine does not support or that are known to give wrong output.
  takes:
  - operator choices
  - what the machine is
  gives:
  - the settings every other node starts with
  state:
  - the settings of the run
  effect_on_output:
  - effect: exact
    when: always, in its own work
  affects_output_through:
  - it turns on speculation or another setting whose own effect is rounding
  - it turns on a setting whose own effect under sampling is another draw
  - it turns on a setting that changes computation or stored precision, on request or as its default
  - 'it sets the default of a setting whose own effect is to define output: sampling settings, output limits, template options'
  rules:
  - strength: should
    rule: The resolved settings of a run are recorded.
    relaxed: Off by default in one engine.
  - strength: must
    rule: 'A combination known to give wrong output is not run by default: it is refused, or one member is replaced by a
      safe setting. An operator''s override is explicit.'
  choices:
  - kind: precedence
    what: operator values, presets, measured values and defaults
  - kind: policy
    what: which combinations are refused
  - kind: policy
    what: whether an operator value is a hard limit or a target
  - kind: policy
    what: which settings are fixed per machine class
  - kind: policy
    what: rules that derive a setting's default from other settings and machine facts
  - kind: policy
    what: whether and where the resolved settings are recorded
  - kind: policy
    what: which settings that change output are on by default, and in which profile
  - kind: failure
    what: what is assumed when a fact about the machine cannot be read
  - kind: policy
    what: named profiles and what each fixes
  - kind: policy
    what: 'how a known-bad combination is handled: refused, or one member replaced'
  - kind: policy
    what: the conditions under which a recorded calibration is applied
  - kind: policy
    what: how machine facts are mapped to a machine class
  - kind: policy
    what: which settings are left to the engine's own rule
- id: resource-governing
  family: operations
  summary: 'While the engine runs, keep its use of memory or power within limits: admit or refuse what is asked for, and
    take back from holders in a fixed order when the limit tightens.'
  applies_when: 'What the engine may use changes while it runs: the system reclaims memory, sequences come and go, or power
    is limited.'
  forms:
  - 'memory: grants and reclaim among the holders of memory'
  - 'duty cycle: idle time inserted to hold a power or heat level'
  takes:
  - requests for memory
  - what the system reports about pressure
  - for duty cycle, the target level and measured work
  gives:
  - grants and refusals
  - requests to holders to give memory back
  - for duty cycle, inserted idle time
  state:
  - what each holder has and what is reserved
  - for duty cycle, the smoothed measure of work
  effect_on_output:
  - effect: exact
    when: always, in its own work
  affects_output_through:
  - what it reclaims decides whether a sequence's state is later restored or recomputed, or abandons work that is run again
    with another cut
  - its reclaim moves a sequence to a slower tier whose capacity then ends that sequence's output
  rules:
  - strength: must
    rule: A grant of memory never takes the engine over a hard limit. A soft figure is exceeded only by classes of work
      the engine states in advance, or on the operator's explicit choice.
  - strength: should
    rule: Where it limits duty cycle, the average over a stated window stays at or below the requested level.
    relaxed: One engine inserts idle time from a moving average of past work and states no window, so the level is approached,
      not bounded.
  choices:
  - kind: policy
    what: the order in which holders give up memory
  - kind: threshold
    what: the pressure levels that trigger reclaim
  - kind: timing
    what: releasing large holdings when idle and restoring them
  - kind: policy
    what: who may wait for memory and who is refused
  - kind: policy
    what: limiting duty cycle
  - kind: policy
    what: how free memory and pressure are estimated from what the system reports
  - kind: timing
    what: when holders that gave memory back may grow again
  - kind: threshold
    what: the duty cycle allowed and the window it is averaged over
  - kind: precedence
    what: the order in which competing claims for memory are served, and what each class of claim may take
  - kind: timing
    what: how fast released holdings are restored, and when a restore is abandoned
  - kind: policy
    what: how measured work is smoothed when duty cycle is limited
  - kind: policy
    what: whether growth that displaces reclaimable cache is charged at its net change or at its full size
- id: telemetry
  family: operations
  summary: Record what the run chose and what it did, in a form that can be attached to the requirements the engine is judged
    on.
  takes:
  - counters and timings from other nodes
  gives:
  - metrics, logs and traces
  state:
  - counters and histograms
  effect_on_output:
  - effect: exact
    when: always, in its own work
  rules:
  - strength: must
    rule: Recording does not change what the engine computes.
  choices:
  - kind: policy
    what: what is recorded by default and what on request
  - kind: policy
    what: where records go
  - kind: threshold
    what: when something is reported as abnormal
  - kind: format
    what: 'how each reported rate and latency is defined: which clock, interval and sample'
  - kind: sizing
    what: sampling interval and how much history is kept
  - kind: policy
    what: whether reading status may affect the engine's decisions
