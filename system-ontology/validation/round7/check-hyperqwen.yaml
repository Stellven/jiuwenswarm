contradictions: []
new_causes:
  - {part: "prefix-cache", type: "prefix-reuse", kind: "own", level: "approximate", cause: "a hit reads reused positions in the quantised stored format, where a fresh read of the same prompt would still hold the last positions of each chunk at the staging precision; the level of the difference follows how much staged state the store kept", evidence: "kvarn-staging-quantizer: fp16 staging until a 128-token tile fills, retained fp16 sinks 'keep multi-turn reuse closer to unquantised'; prefix-cache output_effect_when. The type's approximate conditions name other weights or settings and another activation precision, not another stored precision. Cannot fully tell whether this is prefix-reuse's own effect or the stored-state node's effect through reuse (output_principles last item speaks of rounding and precision of the producing step, not of a stored format that differs from a fresh read)."}
  - {part: "full-attention-compute", type: "layer-compute", kind: "own", level: "approximate", cause: "a reduced-precision kernel is selected by whether a prompt chunk runs alone in its step (and above a width), so one sequence's precision depends on whether others share the step", evidence: "decision 'int8-QK prefill only for one-request chunks over 16 tokens'; patches/prefill-attn-int8.patch gate. The type's condition names only the number of rows; step-scheduler names the sharing as its through effect, layer-compute does not name it as a cause of its own."}
  - {part: "sampler", type: "sampling", kind: "own", level: "rounding", cause: "the sampling kernel is chosen by the number of rows in the step and by the settings of every request in it, so one request's arithmetic depends on the others in the batch", evidence: "decisions 'one topk when every request's top-k is at most 64' and 'multi-block row softmax for up to 16 rows' (patches/sampler-small-topk-fast-softmax.patch). The type's rounding condition is only 'the same chain differs only in floating point'."}
  - {part: "compile-and-warmup", type: "graph-capture", kind: "own", level: "rounding", cause: "compiled kernels specialised on a step dimension such as batch size run different code, and so may round differently, per value of that dimension", evidence: "decision 'which Triton kernels must not specialise on batch size' (patches/vllm-pr64137-logits-stats-no-specialize.patch, vllm-pr66026-gather-draft-sampled-no-specialize.patch). The type's rounding condition names only a recorded graph fixing a variant that differs from the unrecorded path."}
  - {part: "weight-loader", type: "model-loading", kind: "through", level: "approximate", cause: "while preparing weights it marks, per layer by name, which layers the matrix kernels run with reduced activation precision, from a run-time setting", evidence: "gives linear-gemm 'int8-activation selection per layer'; patches/marlin-int8-layer-select.patch (include/exclude patterns applied in process_weights_after_loading). model-loading has no affects_output_through, and output_principles names a permit recorded at conversion, not a selection applied at load."}
relaxations:
  - {part: "linear-gemm", type: "layer-compute", rule: "An approximation that is in effect is stated with the run's settings.", how: "The batch profile turns int8 activations on by default for the MLP layers (batch/start_qwen.sh:156 INT8_ACT=${INT8_ACT-int8}); the launcher exports the knob without printing it (launcher_common.sh:120-125). Whether vLLM itself logs the W4A8 path was not checked. The relaxed text describes a row-count default and a conversion permit, not a per-profile default chosen by layer name."}
wrong_assignments:
  - {part: "drafter-free-chains", assigned: "draft-policy", better: "draft-policy, also draft-proposal", why: "Besides deciding to skip the drafter, it forms the proposals itself (whole verify blocks of point-mass drafts from the lookup); under draft-policy alone its own effect would be claimed exact, while its proposals set the checked block width and, under sampling, the draw."}
  - {part: "tensor-parallel", assigned: "model-partitioning", better: "model-partitioning, also device-communication", why: "The part also runs the collectives (custom all-reduce) that combine partial results, and its recorded effect, a different reduction order, is device-communication's rounding case; no other part of the inventory does that job."}
inventory_errors:
  - {part: "gptq-requantizer", field: "when_things_go_wrong", recorded: "[] (and must_never [])", source_shows: "The scripts write the variant directory in place with no temporary name: shard by save_file, then the index, then config.json last (drafter/gptq_lm_head.py:73-110, drafter/quant_dflash2.py:93-117); an interrupted run leaves a partial directory that is rejected at load only because config.json is written last or a truncated shard fails its header. The served copy is fetched prebuilt through temp file and rename (prepare/fetch_fast_variant.py:9,22-23). Each script also prints a round-trip error."}
