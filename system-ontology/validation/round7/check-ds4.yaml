contradictions:
  - {part: "pipeline-parallel", type: "device-communication", claim: "effect_on_output: exact when it only moves data, or combines in the same order as one device would; rounding when it combines partial sums in another order", evidence: "Correction (round4), ds4_distributed.c 790-793, 949-955: activations crossing stages can be sent as FP8 E4M3, a lossy reduction (changes_output); f16 is a width change. The moving part's own work reaches approximate, which device-communication does not list (model-partitioning, the part's main type, does).", fix: "Add 'approximate: it sends activations in a lossy reduced format' and widen rounding to 'it combines partial sums in another order, or sends activations at another floating-point width'."}
new_causes:
  - {part: "pipeline-parallel", type: "device-communication", kind: "own", level: "rounding", cause: "activations are sent between devices at a narrower floating-point width than they were computed in", evidence: "inventory decision 'Activation bits on the wire'; correction: f16 on the wire is numeric. device-communication names rounding only for a changed combining order."}
  - {part: "weight-binder", type: "model-loading", kind: "own", level: "rounding", cause: "whether a quantised weight is re-encoded into a wider floating-point copy at load depends on the memory budget left on the device, so which tensors are computed from the re-encoded copy varies with memory", evidence: "ds4.c 3601-3646 and ds4_cuda.cu 5330-5378, 1562-1673: on CUDA, Q8_0 matrices are preloaded as dequantized F16 (or F32) copies while a VRAM budget allows; the rest are read in Q8_0. The type names re-encoding that changes width, not that it is conditional on remaining memory."}
relaxations:
  - {part: "disk-kv-checkpoint-store", type: "prefix-reuse", rule: "Stored state is reused only where the model, the weights' precision, the settings and the prefix match what it was made for.", how: "Checkpoints are keyed by a hash of the rendered text prefix, not the token prefix; the token sequence of the restored state is not checked against how the new request's whole text would tokenize (the suffix is retokenized alone). The relaxed note names cross-precision reuse and missing settings, not a text key."}
wrong_assignments:
  - {part: "gpu-backend", assigned: "device-backend", better: "device-backend, also graph-capture", why: "Per the round6 correction, CUDA decode steps are captured as graphs per layer and island key with a warm pass, replayed later, and fall back to eager encoding on failure (ds4_cuda.cu 1118-1216); that code lives in the backend this part covers, so its graph-capture job has no type in the assignment."}
inventory_errors:
  - {part: "weight-binder", field: "output_effect", recorded: "none (and no decision about re-encoding)", source_shows: "ds4.c 3601-3646 (accelerator_cache_q8_tensors) and ds4_cuda.cu 5330-5378: on CUDA (not ROCm, not with DS4_CUDA_DIRECT_MODEL) 2-D Q8_0 tensors are cached as dequantized F16 or F32 device copies at load within a budget (ds4_cuda.cu 1562-1673); kernels then read the wider copy, so the effect is numeric and depends on available VRAM."}
