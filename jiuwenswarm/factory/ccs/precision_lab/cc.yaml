cc: '2'
id: engine.precision_lab
version: 1.0.1
materials:
  guide:
    path: SKILL.md
  method:
    path: METHOD.md
  sources:
    path: SOURCES.json
  verification:
    path: VERIFICATION-UNITS.json
  component:
    path: COMPONENT.json
  examples:
    path: EXAMPLES.json
  roles:
    path: roles.json
    media_type: application/json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  quantize:
    does: Pack and unpack a custom symmetric INT4 reference tensor.
    takes:
      request: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  evaluate:
    does: Evaluate finite tensor errors against an explicit approximation budget.
    takes:
      request: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  calibrate:
    does: Choose block size from supplied tensor error and payload storage.
    takes:
      request: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  memory_plan:
    does: Calculate reference weight storage and separate approximate KV payload.
    takes:
      request: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
