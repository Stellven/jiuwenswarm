cc: '2'
id: analysis.expert_routing_profile
version: 1.5.1
materials:
  method:
    path: METHOD.md
  source_map:
    path: SOURCE-MAP.md
  helper:
    path: routing_profile.py
  transfer_helper:
    path: routing_transfer.py
  copy_timing_helper:
    path: copy_timing.py
  residency_helper:
    path: residency_counterfactual.py
  trace_rank_helper:
    path: trace_rank.py
  pack_reader_helper:
    path: gguf_pack.py
  tests:
    path: test_routing_profile.py
  transfer_tests:
    path: test_routing_transfer.py
  copy_timing_tests:
    path: test_copy_timing.py
  residency_tests:
    path: test_residency_counterfactual.py
  checksums:
    path: SHA256SUMS
    media_type: text/plain
  analysis:
    path: ANALYSIS.json
    media_type: application/json
  roles:
    path: roles.json
    media_type: application/json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
defs:
  configuration:
    kind: json
    schema:
      type: object
      additionalProperties: false
      required: [layers, experts_per_layer, top_k]
      properties:
        layers: {type: integer, minimum: 1, maximum: 256}
        experts_per_layer: {type: integer, minimum: 1, maximum: 4096}
        top_k:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: {type: integer, minimum: 1, maximum: 4096}
capabilities:
  rank_trace:
    does: Rank routed experts per layer from an LLAMA_MOE_CACHE_TRACE routing trace (a capped_runner serve run with
      trace true) and write the seeded expert cache profile (spark-expert-residency-nominations/1, target
      muse-spark-open, mode 0400) with the payload bytes from the pack's own expert sizes. Also returns the per
      layer and expert hit counts for the prompt and decode phases. Done when the trace matches the pack, every
      layer is routed, every id is in range and the profile was written.
    takes:
      trace:
        kind: text
        description: Path of the routing trace (trace.mct of a serve run).
      pack:
        kind: text
        description: First shard (or directory) of the pack the trace was recorded on.
      profile_out:
        kind: text
        optional: true
        description: Absolute path to write the profile.
      prompt_set_sha256:
        kind: text
        optional: true
        description: Digest of the calibration prompt set; recorded with the hits.
    gives:
      done: json
      checks: json
      profile: json
      summary: json
      hits: json
    needs: [python]
    changes: [workspace.read, workspace.write]
  analyze:
    does: Rank experts from prior Strata counts, then compute subsequent
      route-count coverage and indexed payload bytes across placement sizes.
    takes:
      before: artifact
      after: artifact
      tensor_index: artifact
      configuration: $configuration
    gives:
      report: json
    needs: [python]
    changes: [process.exec]
  verify:
    does: Recompute the report from the pinned input artifacts and check every
      value and selected expert ID.
    takes:
      before: artifact
      after: artifact
      tensor_index: artifact
      configuration: $configuration
      report: json
    gives:
      verified: json
    needs: [python]
    changes: [process.exec]
  compare:
    does: Measure historical rank coverage by recorder phase on a retained
      llama.cpp trace, accounting for unknown phases, losses and submitted copies.
    takes:
      trace: artifact
      ranks: artifact
    gives:
      report: json
    needs: [python]
    changes: [process.exec]
  verify_transfer:
    does: Recompute and verify the exact trace comparison against both pinned inputs.
    takes:
      trace: artifact
      ranks: artifact
      report: json
    gives:
      verified: json
    needs: [python]
    changes: [process.exec]
  time_copies:
    does: Compare the isolated expert-copy replay equivalent with its exact C1
      first-token latency, preserving the memory path and coverage limitations.
    takes:
      transfer: artifact
      replay: artifact
      request: artifact
      activation: artifact
      baseline: artifact
    gives:
      report: json
    needs: [python]
    changes: [process.exec]
  verify_copy_timing:
    does: Recompute and verify the copy timing report with the same input artifacts.
    takes:
      transfer: artifact
      replay: artifact
      request: artifact
      activation: artifact
      baseline: artifact
      report: json
    gives:
      verified: json
    needs: [python]
    changes: [process.exec]
  estimate_residency:
    does: Model upload bytes and calls if a fixed ranked expert set is resident
      for every nonzero prefill group in the recorded path.
    takes:
      trace: artifact
      ranks: artifact
      transfer: artifact
      tensor_index: artifact
      timing: artifact
    gives:
      report: json
    needs: [python]
    changes: [process.exec]
  verify_residency:
    does: Recompute the fixed-residency comparison from the exact input artifacts.
    takes:
      trace: artifact
      ranks: artifact
      transfer: artifact
      tensor_index: artifact
      timing: artifact
      report: json
    gives:
      verified: json
    needs: [python]
    changes: [process.exec]
