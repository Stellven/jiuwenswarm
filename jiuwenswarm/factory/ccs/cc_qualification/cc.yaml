cc: '2'
id: factory.cc_qualification
version: 1.1.0
materials:
  methodology:
    kind: method
    path: METHOD.md
  alignment:
    kind: reference
    path: ALIGNMENT.json
bindings:
  default:
    kind: native
    command: ['{python}', '{bundle}/run.py']
capabilities:
  inspect_package:
    kind: tool
    does: Verify an existing sealed package and read its declared verification units and known local implementation identities; no package execution.
    takes:
      release: json
    gives:
      package: json
    needs: [python]
    changes: [process.exec]
  verify_unit:
    kind: tool
    does: Apply one explicit allowlisted in-process domain invariant to saved task evidence; persist a scoped verification result.
    takes:
      release: json
      unit_id: json
      evidence_id: json
    gives:
      verification: json
      observation_id: json
    needs: [python]
    changes: [process.exec]
  assess_admission:
    kind: tool
    does: Assess selected package capabilities against operator task policy and current verification identities; supplies no grants or runtime/scientific certification.
    takes:
      policy_id: json
      verification_ids: json
    gives:
      eligibility: json
      observation_id: json
    needs: [python]
    changes: [process.exec]
