cc: '2'
id: weights.build_muse_nvfp4_reader
version: 1.2.0
materials:
  guide:
    path: GUIDE.md
  method:
    path: METHOD.md
  validation:
    path: VALIDATION.md
  ontology:
    path: ONTOLOGY.yaml
  source_map:
    path: SOURCE-MAP.md
  checkpoint_reader:
    path: components/checkpoint_reader/component.yaml
  sample_range_header:
    path: samples/range_header.py
  sample_split_stacked:
    path: samples/split_stacked.py
  sample_lazy_expert_tensor:
    path: samples/lazy_expert_tensor.py
  helpers:
    path: helpers/README.md
  helper_scale_inventory:
    path: helpers/scale_inventory.py
  helper_tiny_checkpoint:
    path: helpers/tiny_checkpoint.py
  helper_make_tiny_packs:
    path: helpers/make_tiny_packs.sh
  helper_time_one_expert:
    path: helpers/time_one_expert.py
  converter_verifier:
    path: helpers/converter_rules.py
  runtime_verifier:
    path: helpers/nvfp4_compare.py
  pack_verifier:
    path: helpers/pack_census.py
  roles:
    path: roles.json
    media_type: application/json
defs:
  done:
    kind: json
    description: True when at least one check ran, none failed, the required stage was reached with no check it
      needs skipped, and any inconclusive check was settled by a passing runtime acceptance stage.
    schema:
      type: boolean
  stage_reached:
    kind: json
    description: Highest stage with a passing check where no check of it or of a lower stage failed or was skipped.
    schema:
      type:
      - string
      - 'null'
  not_done_because:
    kind: json
    description: Why done is false (empty when done).
    schema:
      type: array
      items:
        type: string
  checks:
    kind: json
    schema:
      type: array
      items:
        type: object
        required:
        - name
        - status
        - stage
        - detail
        properties:
          name:
            type: string
          status:
            enum:
            - pass
            - fail
            - skipped
            - inconclusive
            - info
          stage:
            enum:
            - fixture
            - native CC execution
            - runtime acceptance
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  inspect_scale_layout:
    does: Read a ModelOpt NVFP4 checkpoint's index and shard headers (never tensor data) and return the
      role-by-role scale inventory - packed weight, block scale, global scale_2 and input scale with dtypes and
      shapes, quantized and excluded layers, layout problems and findings. A helper for the worker; verify_pack
      only cross-checks it against the checkpoint.
    takes:
      index:
        kind: text
        description: Absolute path to model.safetensors.index.json.
      headers:
        kind: json
        optional: true
        description: Absolute paths of shard files, header JSON files (hdr-NNNNN.json) or directories holding them.
        schema:
          type: array
          items:
            type: string
    gives:
      done: $done
      checks: $checks
      stage_reached: $stage_reached
      not_done_because: $not_done_because
      inventory:
        kind: json
        optional: true
        description: Inventory summary (shards, headers read, quantized and excluded layers, roles, findings).
    needs:
    - python
    changes:
    - workspace.read
  scale_inventory:
    does: Read a ModelOpt NVFP4 checkpoint's index and shard headers (never tensor data) and return the
      role-by-role scale inventory - packed weight, block scale, global scale_2 and input scale with dtypes and
      shapes, quantized and excluded layers, layout problems and findings. A helper for the worker; verify_pack
      only cross-checks it against the checkpoint.
    takes:
      index:
        kind: text
        description: Absolute path to model.safetensors.index.json.
      headers:
        kind: json
        optional: true
        description: Absolute paths of shard files, header JSON files (hdr-NNNNN.json) or directories holding them.
        schema:
          type: array
          items:
            type: string
      out:
        kind: text
        optional: true
        description: Write the full inventory JSON here.
    gives:
      done: $done
      checks: $checks
      stage_reached: $stage_reached
      not_done_because: $not_done_because
      inventory:
        kind: json
        optional: true
        description: Inventory summary (shards, headers read, quantized and excluded layers, roles, findings).
    needs:
    - python
    changes:
    - workspace.read
    - workspace.write
  verify:
    does: Gate a converter change that reads the stacked Muse NVFP4 experts. Fixture stage - the bundled good
      diff passes, each planted fault fails its rule and each undecidable one is not passed on this base
      (inconclusive when the fixtures do not apply). Static - only conversion/*.py touched by the change under
      review (an earlier node's change is carried by committing it, by base, by diff_path or by carried_diff),
      the stacked reader reuses the stock _nvfp4_pack inside a lazy tensor and loads no packed weight or block
      scale outside deferred code, gate rows first with scale_2 column 0, up column 1, .scale and .input_scale
      written, nothing requantized. Runtime acceptance (the bar for correctness, required by default) - the
      tree's converter on the tiny NVFP4 checkpoint, then every NVFP4 block bit-exact against the source, every
      .scale equal to its scale_2 column, dequantized weights equal to the checkpoint's own dequantization,
      excluded layers kept. Without a python env or tiny checkpoint that stage fails when required. An
      inconclusive static rule is never a pass without it. Writes only to a scratch directory outside the
      checkout.
    takes:
      checkout:
        kind: text
        description: Root of the owned llama.cpp Git checkout.
      diff_path:
        kind: text
        optional: true
        description: Patch of this node's change against base; omit to check working changes against base.
      base:
        kind: text
        optional: true
        description: Commit the change is judged against (default HEAD). Commit an earlier node's change, then
          base HEAD keeps it out of the review.
      carried_diff:
        kind: text
        optional: true
        description: Patch of an earlier node's uncommitted change in the same checkout; working files equal to
          base plus that patch are carried (exported, not reviewed).
      require_stage:
        kind: text
        optional: true
        description: Stage done requires - fixture, native CC execution or runtime acceptance (default).
      python:
        kind: text
        optional: true
        description: Python of a venv with torch, safetensors, numpy and transformers (default the controller
          interpreter when it has them); without one runtime acceptance fails when required.
      tiny_checkpoint:
        kind: text
        optional: true
        description: Directory of the tiny NVFP4 checkpoint (helpers/tiny_checkpoint.py output nvfp4/).
      tiny_base:
        kind: text
        optional: true
        description: Directory with the real tokenizer files and config.json; the tiny checkpoint is generated
          from it when tiny_checkpoint is not given.
      tiny_config:
        kind: text
        optional: true
        description: Muse Spark config.json to start the tiny config from (default tiny_base/config.json).
      work_dir:
        kind: text
        optional: true
        description: Scratch parent directory outside the checkout (default the system temp directory).
      keep_work:
        kind: json
        optional: true
        schema:
          type: boolean
      mem_cap:
        kind: text
        optional: true
        description: cgroup MemoryMax for the generator and converter (default 16G; none to disable).
      runtime_even_if_static_fails:
        kind: json
        optional: true
        description: Run the runtime checks even when a scope gate failed (calibration of the runtime checks).
        schema:
          type: boolean
    gives:
      done: $done
      checks: $checks
      stage_reached: $stage_reached
      not_done_because: $not_done_because
    needs:
    - python
    changes:
    - workspace.read
    - process.exec
  verify_pack:
    does: Gate a written Muse NVFP4 GGUF pack against the checkpoint itself - the layer plan from the
      checkpoint's safetensors index (an inventory or quantized_layers is only cross-checked; a plan with no
      quantized layer fails), every shard readable, every routed expert weight of a quantized layer NVFP4 (type
      40) with an F32 [n_expert] .scale (and .input_scale where the checkpoint has one), each .scale and
      .input_scale equal value for value to the checkpoint's _weight_scale_2 / _input_scale column (gate 0, up 1,
      down the vector; header plus a small range read), excluded layers at their checkpoint dtype without
      .scale, NVFP4 nowhere else, no unexpected type, total bytes in range. Fails closed. Returns the pack
      manifest (factory.pack-manifest/1; per-file sha256 with hash).
    takes:
      pack:
        kind: text
        description: Absolute path to the first shard or the directory holding the pack.
      source_index:
        kind: text
        description: The checkpoint's model.safetensors.index.json, with its shards beside it (the reference
          for the layer plan, excluded dtypes and scale_2 values).
      inventory:
        kind: text
        optional: true
        description: Scale inventory JSON (scale_inventory out); cross-checked against source_index.
      quantized_layers:
        kind: json
        optional: true
        description: Expected quantized layers; cross-checked against source_index.
        schema:
          type: array
          items:
            type: integer
            minimum: 0
      expect_bytes_range:
        kind: json
        optional: true
        schema:
          type: array
          items:
            type: integer
            minimum: 0
          minItems: 2
          maxItems: 2
      allowed_types:
        kind: json
        optional: true
        schema:
          type: array
          items:
            type: string
      scale_sample_layers:
        kind: json
        optional: true
        description: Quantized layers whose scale vectors are compared with the checkpoint (default all).
        schema:
          type: array
          items:
            type: integer
            minimum: 0
      hash:
        kind: json
        optional: true
        description: sha256 every shard (slow for ~450 GB).
        schema:
          type: boolean
    gives:
      done: $done
      checks: $checks
      stage_reached: $stage_reached
      not_done_because: $not_done_because
      manifest:
        kind: json
        optional: true
    needs:
    - python
    changes:
    - workspace.read
