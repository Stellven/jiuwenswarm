cc: '2'
id: factory.standard_benchmark
version: 1.1.0
materials:
  methodology:
    path: METHOD.md
  roles:
    path: roles.json
    media_type: application/json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  submit:
    does: Submit the operator-frozen ARC correctness and pg512/tg128 native speed
      comparison. Never edits questions, policy, source pins, arm profiles or order.
    takes:
      contract_id: text
      idem_key: text
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  status:
    does: Reconcile the current-task benchmark attempt with the durable GPU queue.
    takes:
      attempt_id: text
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  result:
    does: Independently verify raw evidence and report correctness and speed gates
      for a completed current-task benchmark. Partial execution is inconclusive.
    takes:
      attempt_id: text
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  cancel:
    does: Cancel only this task's benchmark attempt and reconcile its exact owned containers; pending cleanup remains explicit.
    takes:
      attempt_id: text
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
