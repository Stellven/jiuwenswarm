cc: '2'
id: factory.builder
version: 1.1.3
materials:
  methodology:
    path: JOB.md
  verification_units:
    path: VERIFICATION-UNITS.json
  roles:
    path: roles.json
    media_type: application/json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  submit:
    does: Submit a durable build job. For Spark llama-server image delivery, set request.verify_image
      to true to retain a GPU-free, network-isolated version and executable digest check. Inspect
      status and result after submission.
    takes:
      request: json
      idem_key: text
      node_id:
        kind: text
        optional: true
    gives:
      attempt_id: text
      state: text
      jobq_id: json
    needs:
    - python
    changes:
    - process.exec
  status:
    does: Read and reconcile the owned build attempt.
    takes:
      attempt_id: text
    gives:
      attempt_id: text
      task_id: text
      kind: text
      idem_key: text
      fingerprint: text
      request: json
      state: text
      jobq_id: json
      owner: json
      started: json
      ended: json
      resources: json
      result_refs: json
      cleanup_state: text
      history: json
    needs:
    - python
    changes:
    - process.exec
  cancel:
    does: Request cancellation of the owned build attempt.
    takes:
      attempt_id: text
    gives:
      attempt_id: text
      task_id: text
      kind: text
      idem_key: text
      fingerprint: text
      request: json
      state: text
      jobq_id: json
      owner: json
      started: json
      ended: json
      resources: json
      result_refs: json
      cleanup_state: text
      history: json
    needs:
    - python
    changes:
    - process.exec
  result:
    does: Read build result references; submission alone is not success.
    takes:
      attempt_id: text
    gives:
      attempt_id: text
      state: text
      result_refs: json
    needs:
    - python
    changes:
    - process.exec
