cc: '2'
id: factory.methodology_followup
version: 1.1.3
materials:
  methodology:
    path: METHOD.md
  ontology:
    path: ONTOLOGY.json
  component_candidates:
    path: COMPONENT-CANDIDATES.json
  roles:
    path: roles.json
    media_type: application/json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  followup:
    does: Convert report-backed uncertainty into a proposed next input; never submit
      or amend a contract.
    takes:
      evidence_ids:
        kind: json
      hypothesis_id:
        kind: text
        optional: true
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  lab_guided:
    does: Propose a versioned evidence-linked ontology delta and draft child contract, or request missing signals; never execute or admit work.
    takes:
      evidence_ids: json
    gives:
      analysis: json
    needs: [python]
    changes: [process.exec]
