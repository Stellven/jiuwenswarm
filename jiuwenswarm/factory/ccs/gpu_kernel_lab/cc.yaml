cc: '2'
id: engine.gpu_kernel_lab
version: 1.1.1
materials:
  guide:
    path: SKILL.md
  method:
    path: METHOD.md
  sources:
    path: SOURCES.json
  verification:
    path: VERIFICATION-UNITS.json
  component:
    path: COMPONENT.json
  examples:
    path: EXAMPLES.json
  muse_dispatch_fixture:
    path: fixtures/muse_dispatch.cpp
  muse_dispatch_input_pins:
    path: fixtures/muse_dispatch_pins.json
    media_type: application/json
  roles:
    path: roles.json
    media_type: application/json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  evaluate:
    does: Compare route-preserving batched expert matrix-vector output to FP64 CPU
      oracle.
    takes:
      request: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  benchmark:
    does: Execute bundled CUDA kernels and finite shape tile sweep with CPU oracle.
    takes:
      request: json
      gpu:
        kind: handle
        description: Host-bound GPU handle issued only for an exclusive operator-scheduled
          measurement slot.
    gives:
      result: json
    needs:
    - python
    - gpu
    changes:
    - process.exec
    - gpu.use

  trace_dispatch:
    does: Verify the route dispatch for pinned quantized AQBC decode from its source, pack headers and CUDA capture receipts.
    takes:
      request: json
    gives:
      done: json
      decision: json
      checks: json
      dispatch_trace: json
    needs:
    - python
    changes:
    - process.exec

  verify_candidate:
    does: Check pinned conditional candidate fixtures for exact quantized parity, route coverage, fallback, and off-switch behavior.
    takes:
      dispatch_trace: json
      candidate_patch: artifact
      fixture_receipt: artifact
    gives:
      done: json
      checks: json
      fixture_evidence: json
    needs:
    - python
    changes:
    - process.exec
