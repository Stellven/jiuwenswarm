cc: '2'
id: engine.gpu_kernel_lab
version: 1.0.1
materials:
  guide:
    path: SKILL.md
  method:
    path: METHOD.md
  sources:
    path: SOURCES.json
  verification:
    path: VERIFICATION-UNITS.json
  component:
    path: COMPONENT.json
  examples:
    path: EXAMPLES.json
  roles:
    path: roles.json
    media_type: application/json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  evaluate:
    does: Compare route-preserving batched expert matrix-vector output to FP64 CPU
      oracle.
    takes:
      request: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  benchmark:
    does: Execute bundled CUDA kernels and finite shape tile sweep with CPU oracle.
    takes:
      request: json
      gpu:
        kind: handle
        description: Host-bound GPU handle issued only for an exclusive operator-scheduled
          measurement slot.
    gives:
      result: json
    needs:
    - python
    - gpu
    changes:
    - process.exec
    - gpu.use
