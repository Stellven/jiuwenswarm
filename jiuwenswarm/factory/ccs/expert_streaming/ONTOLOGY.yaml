slices:
  expert_weight_readiness:
    purpose: Make selected expert weights available before CPU expert execution under -cmoe.
    regions: [L4.router, L4.selected_expert, L4.expert_execution, M.expert_weight_range, M.read_request, M.readiness, M.page_cache, M.memory_budget]
    quantities: [fill.decode_bytes_read, fill.demand_wait_ns_per_token, prediction.recall_at_k, readiness.ready_bytes_predicted, readiness.missing_bytes_predicted, readiness.duplicate_demand_bytes, decode.ms_per_token]
