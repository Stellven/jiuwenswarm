id: satay.engine-ontology
version: '0.2'
status: provisional
entities:
  engine_revision: Source commit plus any retained patch identity.
  source_tree: Files implementing an engine revision.
  component: A bounded source module implementing a capability.
  build_artifact: Output of a build attempt.
  image: Immutable runtime image id.
  model: Model architecture and weight tensors.
  quantization: Weight representation and block encoding.
  workload: Fixed prompt, decode and configuration inputs; engine request scheduler is distinct from factory job scheduler.
  contract: Versioned correctness and measurement obligations.
  regions:
    L1: startup
    L2: api
    L3: generation_loop
    L4: model_ops
    L4.router: router
    L4.selected_expert: selected_expert
    L4.expert_execution: expert_execution (CPU under -cmoe)
    L5: kernels_runtime
    L5.cpu: cpu
    L5.gpu: gpu
    M: memory_state
    M.expert_weight_range: expert_weight_range
    M.read_request: read_request
    M.readiness: readiness before demand fill
    M.page_cache: page_cache
    M.memory_budget: memory_budget
  observation_point: A named stderr line and field at an engine boundary.
  quantity: A value with unit, phase and region; absence is not zero.
  observation: Measured value with raw evidence provenance.
  assessment: Interpretation under a contract and its limitations.
  claim: A bounded statement supported by observations and assessment.
  capabilities: [expert_streaming.demand_fill, expert_streaming.predictive_read, expert_streaming.readiness_observation, expert_streaming.phase_observation, expert_streaming.worker_naming, expert_streaming.duplicate_read_elimination, expert_streaming.mmap_advice, expert_streaming.router_prefetch]
relations:
  implements: component -> capability
  modifies_region: component -> engine region
  reads_range: read_request -> expert_weight_range
  executes_on: expert_execution -> cpu or gpu (CPU under -cmoe)
  measures: observation_point -> quantity
  built_from: build_artifact or image -> source_tree at engine_revision
  evaluates_under: observation or assessment -> contract and workload
