cc: '2'
id: engine.strata_budget_workbench
version: 1.0.1
materials:
  skill:
    path: SKILL.md
  method:
    path: METHOD.md
  component:
    path: COMPONENT.json
  verification_units:
    path: VERIFICATION-UNITS.json
  examples:
    path: EXAMPLES.json
  sources:
    path: SOURCES.json
  roles:
    path: roles.json
    media_type: application/json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  apply:
    does: Construct one-variable resident expert budget profile without execution.
    takes:
      request: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  verify_startup:
    does: Verify safe native budget admission and complete placement identity.
    takes:
      request: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  summarize_memory:
    does: Summarize cgroup and host memory as separate measurements.
    takes:
      request: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
