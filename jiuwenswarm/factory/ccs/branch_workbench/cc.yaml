cc: '2'
id: factory.branch_workbench
version: 1.0.0
materials:
  methodology:
    kind: method
    path: METHOD.md
  skill:
    kind: skill
    path: SKILL.md
  components:
    kind: component
    path: COMPONENTS.json
  verification:
    kind: reference
    path: VERIFICATION-UNITS.json
  example:
    kind: reference
    path: EXAMPLE.json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  create:
    kind: tool
    does: Create an agent-chosen task branch with bounded CPU/GPU allocation; no execution.
    takes:
      expected_graph_rev:
        kind: json
      decision_rev:
        kind: json
      idem_key:
        kind: text
      node_id:
        kind: text
      hypothesis:
        kind: text
      allocation:
        kind: json
      capabilities:
        kind: json
        optional: true
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  fork:
    kind: tool
    does: Create an alternative with explicit parent lineage; optional continuation
      dependency.
    takes:
      expected_graph_rev:
        kind: json
      decision_rev:
        kind: json
      idem_key:
        kind: text
      node_id:
        kind: text
      parent_id:
        kind: text
      hypothesis:
        kind: text
      allocation:
        kind: json
      continuation:
        kind: json
        optional: true
      capabilities:
        kind: json
        optional: true
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  refine:
    kind: tool
    does: Create a revised hypothesis continuing from a completed parent; preserve
      prior evidence.
    takes:
      expected_graph_rev:
        kind: json
      decision_rev:
        kind: json
      idem_key:
        kind: text
      node_id:
        kind: text
      parent_id:
        kind: text
      hypothesis:
        kind: text
      allocation:
        kind: json
      capabilities:
        kind: json
        optional: true
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  record:
    kind: tool
    does: Attach one current-task reported measurement to a branch; no acceptance.
    takes:
      expected_graph_rev:
        kind: json
      decision_rev:
        kind: json
      idem_key:
        kind: text
      node_id:
        kind: text
      evidence_id:
        kind: text
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  prune:
    kind: tool
    does: Cancel an unpromising branch with an explicit reason; retain consumed allocations.
    takes:
      expected_graph_rev:
        kind: json
      decision_rev:
        kind: json
      idem_key:
        kind: text
      node_id:
        kind: text
      reason:
        kind: text
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  status:
    kind: tool
    does: Read durable branches, lineage, ready frontier and shared resource reservations.
    takes: {}
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  ready:
    kind: tool
    does: Read task branch readiness without choosing or executing a branch.
    takes: {}
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  compare:
    kind: tool
    does: Compare complete reported speed, memory and quality vectors within identical
      scope and key; unknowns remain unknown.
    takes: {}
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  attach:
    kind: tool
    does: Attach current-task qualitative or failure evidence, retain unknown metrics,
      and complete the work record without acceptance.
    takes:
      node_id:
        kind: text
      evidence_ids:
        kind: json
      outcome:
        kind: text
      expected_graph_rev:
        kind: json
      decision_rev:
        kind: json
      idem_key:
        kind: text
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
