cc: '2'
id: factory.expert_prediction
version: 1.0.1
materials:
  method:
    path: METHOD.md
  trace_schema:
    path: TRACE.schema.json
  roles:
    path: roles.json
    media_type: application/json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  evaluate:
    does: Evaluate a bounded expert trace using request-separated temporal holdout,
      frozen frequency and causal last-token baselines. No inference execution or
      speed claim.
    takes:
      artifact_id: text
      k:
        kind: json
        optional: true
        schema:
          type: integer
          minimum: 1
          maximum: 64
    gives:
      analysis: json
      evidence: json
    needs:
    - python
    changes:
    - process.exec
