cc: '2'
id: factory.methodology_diagnosis
version: 1.0.0
materials:
  methodology:
    kind: method
    path: METHOD.md
  ontology:
    kind: reference
    path: ONTOLOGY.json
  component_candidates:
    kind: reference
    path: COMPONENT-CANDIDATES.json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  diagnose:
    kind: tool
    does: Analyze retained experiment reports across inference subsystems; surface uncertainties and inspection candidates.
    takes:
      evidence_ids:
        kind: json
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
