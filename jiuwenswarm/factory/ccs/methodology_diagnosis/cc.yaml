cc: '2'
id: factory.methodology_diagnosis
version: 1.0.1
materials:
  methodology:
    path: METHOD.md
  ontology:
    path: ONTOLOGY.json
  component_candidates:
    path: COMPONENT-CANDIDATES.json
  roles:
    path: roles.json
    media_type: application/json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  diagnose:
    does: Analyze retained experiment reports across inference subsystems; surface
      uncertainties and inspection candidates.
    takes:
      evidence_ids:
        kind: json
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
