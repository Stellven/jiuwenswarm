cc: '2'
id: engine.strata_prefill_workbench
version: 1.1.0
materials:
  method:
    kind: method
    path: METHOD.md
  verification_units:
    kind: reference
    path: VERIFICATION-UNITS.json
  component:
    kind: component
    path: COMPONENT.json
  integration:
    kind: skill
    path: INTEGRATE.md
  job_verification:
    kind: reference
    path: JOB-VERIFICATION.json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  inspect:
    kind: tool
    does: Inspect the current task's frozen prefill scope, workload and obligations
      without model execution.
    takes: {}
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  design:
    kind: tool
    does: Draft a separate screen or confirm prefill contract; no admission, contract
      mutation or performance claim.
    takes:
      base_contract: json
      prompt_ids: json
      tokenizer_files: json
      stage:
        kind: text
        optional: true
        schema:
          enum:
          - screen
          - confirm
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  apply:
    kind: tool
    does: Change only the bounded native prefill chunk in a full-six static profile.
    takes:
      base_profile: json
      chunk_tokens: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  verify_profile:
    kind: tool
    does: Check the requested static profile and chunk value; runtime engagement remains
      unmeasured.
    takes:
      profile: json
      chunk_tokens: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  submit:
    kind: tool
    does: Submit the exact operator-admitted bounded fresh-process prefill campaign
      through host lifecycle and resource guards.
    takes:
      contract_id: text
      idem_key: text
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
    - gpu.use
  status:
    kind: tool
    does: Read and reconcile the current task's owned scoped attempt lifecycle.
    takes:
      attempt_id: text
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  result:
    kind: tool
    does: Independently verify retained raw cells and report a scoped prefill result;
      no full-generation quality acceptance or automatic promotion.
    takes:
      attempt_id: text
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  query:
    kind: tool
    does: Query bounded task-scoped evidence summaries and cursor.
    takes:
      kinds:
        kind: json
        optional: true
      text:
        kind: text
        optional: true
      since:
        kind: json
        optional: true
      limit:
        kind: json
        optional: true
      task_id:
        kind: text
        optional: true
    gives:
      items: json
      cursor: json
    needs:
    - python
    changes:
    - process.exec
  read:
    kind: tool
    does: Read a task-scoped evidence record, with bounded artifact preview.
    takes:
      id: text
      task_id:
        kind: text
        optional: true
    gives:
      record: json
    needs:
    - python
    changes:
    - process.exec
  publish:
    kind: tool
    does: Publish an immutable observation/artifact or compare-and-swap decision revision.
    takes:
      type: text
      record: json
      expected_rev:
        kind: json
        optional: true
    gives:
      record: json
    needs:
    - python
    changes:
    - process.exec
  diagnose:
    kind: tool
    does: Analyze retained experiment reports across inference subsystems; surface
      uncertainties and inspection candidates.
    takes:
      evidence_ids:
        kind: json
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  ablation:
    kind: tool
    does: Design one-variable diagnostic or ABBA work without executing or scoring
      it.
    takes:
      evidence_ids:
        kind: json
      hypothesis_id:
        kind: text
        optional: true
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  followup:
    kind: tool
    does: Convert report-backed uncertainty into a proposed next input; never submit
      or amend a contract.
    takes:
      evidence_ids:
        kind: json
      hypothesis_id:
        kind: text
        optional: true
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  test_scope:
    kind: tool
    does: Choose bounded prefill claim obligations and limits; advice grants no execution.
    takes:
      claim: text
      layer: text
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  qualify_profile:
    kind: tool
    does: Compose a bounded profile change, saved pair evidence, independent unit
      verification and explicit operator-policy assessment; never qualifies runtime
      or performance.
    takes:
      policy_id: text
      base_profile: json
      chunk_tokens: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  loop_status:
    kind: tool
    does: Read durable cycles, pending attempts and remaining operator budgets.
    takes: {}
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  select:
    kind: tool
    does: Record an agent-selected report-backed hypothesis and reserve one bounded
      operator-admitted experiment.
    takes:
      cycle_id:
        kind: text
      evidence_ids:
        kind: json
      hypothesis_id:
        kind: text
      template_id:
        kind: text
      expected_rev:
        kind: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  execute:
    kind: tool
    does: Freeze an exact admitted template into a new child task and submit via the
      existing durable benchmark queue. Replay recovers the same attempt.
    takes:
      cycle_id:
        kind: text
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
    - gpu.use
  collect:
    kind: tool
    does: Reconcile the child benchmark, retain failed or successful evidence and
      expose follow-up proposals for the agent's next decision.
    takes:
      cycle_id:
        kind: text
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  stop:
    kind: tool
    does: Persist stop intent for future experiments without cancelling already queued
      work.
    takes:
      reason:
        kind: text
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
