cc: '2'
id: factory.cc_workflow_lab
version: 1.0.1
materials:
  method:
    path: METHOD.md
  skill:
    path: SKILL.md
  examples:
    path: EXAMPLES.json
  verification:
    path: VERIFICATION-UNITS.json
  fixture:
    path: fixtures/qualification.json
  roles:
    path: roles.json
    media_type: application/json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  analyze_receipts:
    does: Summarize up to 128 supplied CPU invocation observations.
    takes:
      spec: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  design_workflow:
    does: Estimate explicit workflow costs without scheduling or widening authority.
    takes:
      spec: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  benchmark_fixture:
    does: Measure only the finite bundled historical CPU receipt fixture.
    takes:
      spec: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  run_batch:
    does: Run up to 16 package-local analysis operations with a fixed allowlist.
    takes:
      spec: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
