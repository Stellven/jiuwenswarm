cc: '2'
id: analysis.request_fault_io
version: 1.1.1
materials:
  method:
    path: METHOD.md
  source_map:
    path: SOURCE-MAP.md
  helper:
    path: fault_io.py
  calibration_helper:
    path: calibration_intervals.py
  tests:
    path: test_fault_io.py
  calibration_tests:
    path: test_calibration_intervals.py
  checksums:
    path: SHA256SUMS
    media_type: text/plain
  analysis:
    path: ANALYSIS.json
    media_type: application/json
  roles:
    path: roles.json
    media_type: application/json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  analyze:
    does: Quantify observed page faults, file-cache changes and backing-store
      reads before first token and later during a retained request.
    takes:
      counters: artifact
      request: artifact
    gives:
      report: json
    needs: [python]
    changes: [process.exec]
  verify:
    does: Recompute the report from the exact captured window and request
      result, checking each delta, identity and attribution scope.
    takes:
      counters: artifact
      request: artifact
      report: json
    gives:
      verified: json
    needs: [python]
    changes: [process.exec]
  analyze_calibration:
    does: Measure faults and reads during retained A+ calibration decode intervals
      whose progress markers identify the same live server request.
    takes:
      trace: artifact
      engine_log: artifact
    gives:
      report: json
    needs: [python]
    changes: [process.exec]
  verify_calibration:
    does: Recompute calibration interval admission and counter deltas from pinned inputs.
    takes:
      trace: artifact
      engine_log: artifact
      report: json
    gives:
      verified: json
    needs: [python]
    changes: [process.exec]
