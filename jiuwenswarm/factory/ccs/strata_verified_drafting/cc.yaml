cc: '2'
id: engine.strata_verified_drafting
version: 1.0.0
materials:
  component:
    kind: component
    path: COMPONENT.json
  methodology:
    kind: method
    path: METHOD.md
bindings:
  default:
    kind: native
    command: ['{python}', '{bundle}/run.py']
capabilities:
  apply:
    kind: tool
    does: Produce a candidate profile changing only native Strata dspark none/on. Does not submit work or change a contract.
    takes:
      base_profile:
        kind: json
      enabled:
        kind: json
        schema:
          type: boolean
    gives:
      profile: json
      change: json
    needs: [python]
    changes: [process.exec]
