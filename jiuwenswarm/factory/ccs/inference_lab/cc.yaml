cc: '2'
id: factory.inference_lab
version: 1.2.2
materials:
  methodology:
    path: METHOD.md
  scopes:
    path: SCOPES.json
  verification_units:
    path: VERIFICATION-UNITS.json
  job_skill:
    path: SKILL.md
  components:
    path: COMPONENTS.json
  integration:
    path: INTEGRATION.md
  references:
    path: REFERENCES.md
  roles:
    path: roles.json
    media_type: application/json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  inspect_evidence:
    does: Independently verify a collected ledger-owned benchmark child and import
      bounded raw evidence and resource summaries into this parent task; no execution.
    takes:
      cycle_id: text
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  diagnose:
    does: Analyze retained experiment reports across inference subsystems; surface
      uncertainties and inspection candidates.
    takes:
      evidence_ids:
        kind: json
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  ablation:
    does: Design one-variable diagnostic or ABBA work without executing or scoring
      it.
    takes:
      evidence_ids:
        kind: json
      hypothesis_id:
        kind: text
        optional: true
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  followup:
    does: Convert report-backed uncertainty into a proposed next input; never submit
      or amend a contract.
    takes:
      evidence_ids:
        kind: json
      hypothesis_id:
        kind: text
        optional: true
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  cache_protocol:
    does: Describe a bounded out-of-core cache and phase protocol from retained evidence.
    takes:
      evidence_ids:
        kind: json
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  propose:
    does: Record an agent-authored unmeasured hypothesis linked to scoped evidence;
      does not fetch citations or execute experiments.
    takes:
      hypothesis_id:
        kind: json
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
      hypothesis:
        kind: json
    gives:
      proposal: json
      observation_id: json
      replayed: json
    needs:
    - python
    changes:
    - process.exec
  profile_plan:
    does: Propose a fixed native Strata observer run using existing host admission
      and lifecycle; inspect profiler executable availability without launching them.
    takes: {}
    gives:
      analysis: json
      evidence: json
    needs:
    - python
    changes:
    - process.exec
  analyze_profile:
    does: Parse scoped native DS4_PROF or Nsight CSV artifacts into phase bottleneck
      candidates and instrumentation gaps. Never score traced timings.
    takes:
      artifacts:
        kind: json
        description: Map stderr, kernels, cuda_api, os_runtime or memcpy to retained
          current-task artifact IDs.
    gives:
      analysis: json
      evidence: json
    needs:
    - python
    changes:
    - process.exec
  evaluate_prediction:
    does: Evaluate a bounded expert trace using request-separated temporal holdout,
      frozen frequency and causal last-token baselines. No inference execution or
      speed claim.
    takes:
      artifact_id: text
      k:
        kind: json
        optional: true
        schema:
          type: integer
          minimum: 1
          maximum: 64
    gives:
      analysis: json
      evidence: json
    needs:
    - python
    changes:
    - process.exec
  test_scope:
    does: Match a claim and engine layer to a scoped verification plan; advisory only,
      no execution authority.
    takes:
      claim: text
      layer: text
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
  query:
    does: Query bounded task-scoped evidence summaries and cursor.
    takes:
      kinds:
        kind: json
        optional: true
      text:
        kind: text
        optional: true
      since:
        kind: json
        optional: true
      limit:
        kind: json
        optional: true
      task_id:
        kind: text
        optional: true
    gives:
      items: json
      cursor: json
    needs:
    - python
    changes:
    - process.exec
  read:
    does: Read a task-scoped evidence record, with bounded artifact preview.
    takes:
      id: text
      task_id:
        kind: text
        optional: true
    gives:
      record: json
    needs:
    - python
    changes:
    - process.exec
  publish:
    does: Publish an immutable observation/artifact or compare-and-swap decision revision.
    takes:
      type: text
      record: json
      expected_rev:
        kind: json
        optional: true
    gives:
      record: json
    needs:
    - python
    changes:
    - process.exec
  apply_prefill:
    does: Produce a candidate changing only the native Strata positive prefill chunk
      size.
    takes:
      base_profile:
        kind: json
      chunk_tokens:
        kind: json
        schema:
          type: integer
          enum:
          - 256
          - 512
          - 1024
    gives:
      profile: json
      change: json
    needs:
    - python
    changes:
    - process.exec
  apply_drafting:
    does: Produce a candidate profile changing only native Strata dspark none/on.
      Does not submit work or change a contract.
    takes:
      base_profile:
        kind: json
      enabled:
        kind: json
        schema:
          type: boolean
    gives:
      profile: json
      change: json
    needs:
    - python
    changes:
    - process.exec
  status:
    does: Read durable cycles, pending attempts and remaining operator budgets.
    takes: {}
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  select:
    does: Record an agent-selected report-backed hypothesis and reserve one bounded
      operator-admitted experiment.
    takes:
      cycle_id:
        kind: text
      evidence_ids:
        kind: json
      hypothesis_id:
        kind: text
      template_id:
        kind: text
      expected_rev:
        kind: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  execute:
    does: Freeze an exact admitted template into a new child task and submit via the
      existing durable benchmark queue. Replay recovers the same attempt.
    takes:
      cycle_id:
        kind: text
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
    - gpu.use
  collect:
    does: Reconcile the child benchmark, retain failed or successful evidence and
      expose follow-up proposals for the agent's next decision.
    takes:
      cycle_id:
        kind: text
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  stop:
    does: Persist stop intent for future experiments without cancelling already queued
      work.
    takes:
      reason:
        kind: text
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  qualify_prefill:
    does: Evaluate the saved prefill candidate against an explicit operator policy
      and supported verification unit; no new grants or universal qualification.
    takes:
      policy_id:
        kind: text
      base_profile:
        kind: json
      chunk_tokens:
        kind: json
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  lab_submit:
    does: Admit an image object with exactly tag and immutable id, plus a separate
      build_attempt_id, and submit a fixed lab evaluation through the GPU queue. run_config
      may include profile nsys to trace the run with Nsight Systems; the result then
      carries a kernel, CUDA API and OS-runtime breakdown. Traced timing is perturbed
      and is never speed evidence.
    takes:
      image:
        kind: json
        schema:
          type: object
          additionalProperties: false
          required:
          - tag
          - id
          properties:
            tag:
              type: string
            id:
              type: string
              pattern: ^sha256:[a-f0-9]{64}$
      build_attempt_id: text
      contract_id: text
      run_config: json
      idem_key: text
      node_id:
        kind: text
        optional: true
    gives:
      admission: json
      attempt_id: text
      state: text
      jobq_id: json
    needs:
    - python
    changes:
    - process.exec
    - gpu.use
  lab_status:
    does: Read the owned lab attempt from the durable queue.
    takes:
      attempt_id: text
    gives:
      attempt_id: text
      task_id: text
      kind: text
      idem_key: text
      fingerprint: text
      request: json
      state: text
      jobq_id: json
      owner: json
      started: json
      ended: json
      resources: json
      result_refs: json
      cleanup_state: text
      history: json
    needs:
    - python
    changes:
    - process.exec
  lab_result:
    does: Read evaluation and evidence references for the owned lab attempt.
    takes:
      attempt_id: text
    gives:
      attempt_id: text
      state: text
      result_refs: json
      execution_outcome: text
      evaluation: json
      evidence_refs: json
    needs:
    - python
    changes:
    - process.exec
  lab_cancel:
    does: Cancel the owned lab attempt and reap its container.
    takes:
      attempt_id: text
    gives:
      attempt_id: text
      task_id: text
      kind: text
      idem_key: text
      fingerprint: text
      request: json
      state: text
      jobq_id: json
      owner: json
      started: json
      ended: json
      resources: json
      result_refs: json
      cleanup_state: text
      history: json
    needs:
    - python
    changes:
    - process.exec
