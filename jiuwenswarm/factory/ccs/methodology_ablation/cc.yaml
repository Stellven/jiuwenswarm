cc: '2'
id: factory.methodology_ablation
version: 1.0.0
materials:
  methodology:
    kind: method
    path: METHOD.md
  ontology:
    kind: reference
    path: ONTOLOGY.json
  component_candidates:
    kind: reference
    path: COMPONENT-CANDIDATES.json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  ablation:
    kind: tool
    does: Design one-variable diagnostic or ABBA work without executing or scoring it.
    takes:
      evidence_ids:
        kind: json
      hypothesis_id:
        kind: text
        optional: true
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
