cc: '2'
id: factory.methodology_ablation
version: 1.0.1
materials:
  methodology:
    path: METHOD.md
  ontology:
    path: ONTOLOGY.json
  component_candidates:
    path: COMPONENT-CANDIDATES.json
  roles:
    path: roles.json
    media_type: application/json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  ablation:
    does: Design one-variable diagnostic or ABBA work without executing or scoring
      it.
    takes:
      evidence_ids:
        kind: json
      hypothesis_id:
        kind: text
        optional: true
    gives:
      analysis: json
    needs:
    - python
    changes:
    - process.exec
