cc: '2'
id: factory.lab_lifecycle
version: 1.0.0
bindings:
  default:
    kind: native
    command: ['{python}', '{bundle}/run.py']
materials:
  method:
    kind: method
    path: RECOVERY.md
capabilities:
  status:
    kind: tool
    does: Read owned Strata lifecycle and evidence state through host reconciliation.
    takes:
      attempt_id: text
    gives:
      analysis: json
    needs: [python]
    changes: [process.exec]
  recover:
    kind: tool
    does: Reconcile a terminal owned Strata attempt and import partial failure; never terminate active or unrelated work.
    takes:
      attempt_id: text
    gives:
      analysis: json
    needs: [python]
    changes: [process.exec]
