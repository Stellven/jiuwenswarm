cc: '2'
id: engine.size_prefill_batch
version: 1.3.0
materials:
  method:
    path: METHOD.md
  validation:
    path: VALIDATION.md
  ontology:
    path: ONTOLOGY.yaml
  sample_baseline_log:
    path: tests/fixtures/B.server.log
  sample_planned_log:
    path: tests/fixtures/Bub.server.log
  sample_rows:
    path: tests/fixtures/rows.json
    media_type: application/json
  roles:
    path: roles.json
    media_type: application/json
defs:
  done:
    kind: json
    description: True when at least one check ran, none failed and the stage the capability needs was reached.
    schema:
      type: boolean
  stage_reached:
    kind: json
    schema:
      type:
      - string
      - 'null'
  not_done_because:
    kind: json
    schema:
      type: array
      items:
        type: string
  checks:
    kind: json
    schema:
      type: array
      items:
        type: object
        required:
        - name
        - status
        - stage
        - detail
        properties:
          name:
            type: string
          status:
            enum:
            - pass
            - fail
            - skipped
            - inconclusive
            - info
          stage:
            type: string
          detail:
            type: string
  budget:
    kind: json
    description: Device memory budget in MiB for every CUDA0 buffer plus the host compute buffer (on GB10 the
      unified memory left after the OS and page-cache headroom; the contract pins it).
    schema:
      type: number
      exclusiveMinimum: 0
  prompts:
    kind: json
    description: Prompt sizes in tokens the server must prefill (the lab's rendered prompt sizes).
    schema:
      type: array
      minItems: 1
      items:
        type: integer
        minimum: 1
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  plan:
    does: Pick -b/-ub for llama-server so each expected prompt is prefilled in as few micro-batches as the device
      budget allows, using a fresh -lv 4 load log at the current batch. The estimate can use measured KV and
      compute deltas from an optional reference pair at the target layout and context. Otherwise the plan keeps
      the baseline KV size and scales compute linearly. It halves the ubatch to 512 when the estimate exceeds
      the budget.
    takes:
      baseline_log:
        kind: text
        description: Path to (or text of) the fresh llama-server -lv 4 log at the current batch for the target
          model, context, cache and placement flags.
      measured_reference:
        kind: json
        optional: true
        description: Two historical llama-server -lv 4 logs (paths or text) from the same known build, model
          and cache size, at the baseline and candidate micro-batches. The default buffer sizes and layout
          must match the fresh baseline. The measured deltas apply only to the pair's exact candidate batch.
        schema:
          type: object
          required:
          - baseline_log
          - candidate_log
          additionalProperties: false
          properties:
            baseline_log:
              type: string
              minLength: 1
            candidate_log:
              type: string
              minLength: 1
      prompt_tokens: $prompts
      device_budget_mib: $budget
      n_ctx:
        kind: json
        optional: true
        description: Target context size; must not exceed the log's (load the baseline at the target context).
        schema:
          type: integer
          minimum: 1
      fill_moe_cache_headroom_mib:
        kind: json
        optional: true
        description: When set, the rest of the device budget less this headroom goes to the MoE expert cache
          (--moe-cache-mib in the plan args), after the batch is chosen.
        schema:
          type: integer
          minimum: 0
      plan_out:
        kind: text
        optional: true
        description: Absolute path to write the factory.prefill-batch-plan/1 document.
    gives:
      done: $done
      checks: $checks
      stage_reached: $stage_reached
      not_done_because: $not_done_because
      plan:
        kind: json
        description: factory.prefill-batch-plan/1 - batch, ubatch, args, estimate_mib, micro_batches per prompt
          before and after, rationale, and input digests and buffer deltas when using measured_reference.
    needs:
    - python
    changes:
    - workspace.read
  verify:
    does: Check one capped server load with the planned batch and lab rows of the same requests at the default
      and the planned batch - the plan is well formed, every planned prompt fits one micro-batch, the server
      applied the batch, the measured device buffers fit the budget and the plan's estimate, and the greedy
      outputs agree (byte-identical, or at least min_agree_chars of common prefix, since a different
      micro-batch split changes the float summation order of prefill). Done needs runtime acceptance.
    takes:
      plan:
        kind: text
        description: The plan document or a path to it.
      server_log:
        kind: text
        description: Path to (or text of) the -lv 4 log of the load with the planned args.
      device_budget_mib: $budget
      baseline_rows:
        kind: json
        description: Lab rows (request, output_sha256, text_head) at the default batch, or a path to them.
      candidate_rows:
        kind: json
        description: Lab rows of the same requests with the planned batch, or a path to them.
      prompt_tokens:
        kind: json
        optional: true
        description: Prompt sizes to cover (default the plan's).
        schema:
          type: array
          items:
            type: integer
      fill_moe_cache_headroom_mib:
        kind: json
        optional: true
        description: When set, the plan must size the MoE cache and the measured device buffers plus this headroom
          must reach the budget (within 2 GiB); the server's cache must match the plan.
        schema:
          type: integer
          minimum: 0
      min_agree_chars:
        kind: json
        optional: true
        description: Shortest common output prefix accepted when outputs are not byte-identical (default 64).
        schema:
          type: integer
          minimum: 0
    gives:
      done: $done
      checks: $checks
      stage_reached: $stage_reached
      not_done_because: $not_done_because
      measured:
        kind: json
        description: The device buffers, n_batch and n_ubatch the server printed.
    needs:
    - python
    changes:
    - workspace.read
