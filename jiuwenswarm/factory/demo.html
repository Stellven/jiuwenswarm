<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Software factory · 10-minute demo</title>
<style>
:root{color-scheme:dark;font:17px/1.45 system-ui,Arial,sans-serif;background:#101722;color:#e5edf9}*{box-sizing:border-box}body{margin:0;display:flex;flex-direction:column;height:100vh}header,footer{flex-shrink:0}header,footer{padding:12px 24px;background:#192331}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:23px;margin:0;flex:1}button,a,select{font:inherit;color:#e5edf9;background:#26364a;border:1px solid #526176;border-radius:5px;padding:5px 10px}a{display:inline-block;text-decoration:none}button{cursor:pointer}#label{color:#ffc87a;font-weight:700}#progress{width:100%;height:8px;accent-color:#49c59d}main{padding:12px 24px;flex:1;min-height:0;overflow:auto}#explanation{margin:4px 0 12px;font-size:20px}iframe{width:100%;height:calc(100vh - 330px);min-height:220px;border:0;background:#f7f6f2}pre{font:15px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#192331;padding:16px;border-radius:7px;margin:8px 0}#evidence{max-height:59vh;overflow:auto}#provenance{font-size:12px;color:#a7b5c8;overflow-wrap:anywhere}#command{font-size:12px;margin:6px 0}details{margin:8px 0}#backups{display:flex;gap:8px;flex-wrap:wrap}#live pre{max-height:42vh;overflow:auto}#gap{color:#ffa854}#error{color:#ff9da9}footer{position:relative}#offline{color:#ffc87a}
</style>
<header><h1 id="title">Software factory</h1><span id="label"></span><span id="clock">0:00 / 10:00</span><progress id="progress" max="600" value="0"></progress>
<button id="prev">← Previous</button><button id="toggle">Pause</button><button id="next">Next →</button><select id="goto" aria-label="Go to section"></select><button id="invoke">Read-only live view</button><span id="offline"></span></header>
<main><p id="explanation"></p><p id="gap"></p><p id="error"></p><iframe id="frame" title="Local evidence" sandbox="allow-scripts allow-same-origin" hidden></iframe><pre id="evidence"></pre><div id="live"></div><details><summary>Provenance / copied source files</summary><div id="provenance"></div></details></main>
<footer><b>Real end-to-end command — not executed during the talk</b><pre id="command"></pre><details><summary>Backup views (outside timed flow)</summary><div id="backups"></div></details><small>→ / ← advance · space pause/resume · terminal: jiuwenswarm factory demo next / prev / pause / resume / goto N / status / live</small></footer>
<script>
let pack,state,current=0,liveSignature='',busy=false;
const $=id=>document.getElementById(id), fmt=n=>`${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`;
function link(source,label){const a=document.createElement('a');a.href=source.asset;a.target='_blank';a.rel='noopener';a.textContent=label;return a}
async function control(action,section){try{const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,section})});const v=await r.json();if(!r.ok)throw Error(v.error);await poll()}catch(e){$('error').textContent=e.message}}
function render(s){state=s;const section=pack.sections[s.section-1];$('clock').textContent=`${fmt(s.elapsed)} / ${fmt(s.budget)}${s.paused?' · paused':''}`;$('progress').value=s.elapsed;$('progress').max=s.budget;$('toggle').textContent=s.paused?'Resume':'Pause';$('prev').disabled=s.section===1;$('next').disabled=s.section===s.total;
if(current!==s.section){current=s.section;$('title').textContent=`${s.section}/${s.total} · ${section.title}`;$('label').textContent=section.label;$('explanation').textContent=section.explanation;$('evidence').textContent=section.text;$('evidence').hidden=!section.text;$('evidence').scrollTop=0;$('frame').hidden=!section.frame;if(section.frame)$('frame').src=section.frame;else $('frame').removeAttribute('src');$('goto').value=s.section;$('provenance').replaceChildren();for(const source of section.sources){const p=document.createElement('p');p.textContent=JSON.stringify(source);if(source.asset)p.append(' ',link(source,'Open copied source'));$('provenance').append(p)}$('gap').textContent=pack.gaps.length?'Evidence gaps: '+pack.gaps.join('; '):'';}
const signature=JSON.stringify(s.live);if(signature!==liveSignature){liveSignature=signature;$('live').replaceChildren();if(s.live){const b=document.createElement('b');b.textContent=s.live.label+' · '+(s.live.caption||s.live.error||'');const pre=document.createElement('pre');pre.textContent=s.live.output;$('live').append(b,pre)}}}
async function poll(){if(busy)return;busy=true;try{const response=await fetch('/api/state');if(!response.ok)throw Error('Server unavailable');render(await response.json());$('offline').textContent=''}catch(e){$('offline').textContent='Disconnected — presentation clock requires server'}finally{busy=false}}
async function start(){try{pack=await(await fetch('/api/pack')).json();$('command').textContent=pack.end_to_end;for(let i=0;i<pack.sections.length;i++){const o=document.createElement('option');o.value=i+1;o.textContent=`${i+1}. ${pack.sections[i].title} (${pack.sections[i].duration}s)`;$('goto').append(o)}for(const b of pack.backups)$('backups').append(link(b,b.title));await poll();setInterval(poll,250)}catch(e){$('error').textContent=e.message}}
$('next').onclick=()=>control('next');$('prev').onclick=()=>control('prev');$('toggle').onclick=()=>control(state.paused?'resume':'pause');$('goto').onchange=e=>control('goto',Number(e.target.value));$('invoke').onclick=()=>control('live');
function keys(e){if(['SELECT','INPUT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowRight'&&state.section<state.total){e.preventDefault();control('next')}if(e.key==='ArrowLeft'&&state.section>1){e.preventDefault();control('prev')}if(e.code==='Space'){e.preventDefault();control(state.paused?'resume':'pause')}}document.addEventListener('keydown',keys);
// The iframe may have focus during activity exploration; keep talk keys available.
$('frame').onload=()=>{try{$('frame').contentDocument.addEventListener('keydown',keys)}catch(e){}};start();
</script></html>
