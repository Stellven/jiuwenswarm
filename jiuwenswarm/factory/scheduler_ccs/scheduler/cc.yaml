cc: '2'
id: factory.scheduler
version: 1.1.0
materials:
  skill:
    path: SKILL.md
  verification:
    path: VERIFICATION-UNITS.json
  roles:
    path: roles.json
    media_type: application/json
bindings:
  default:
    kind: native
    command:
    - '{python}'
    - '{bundle}/run.py'
capabilities:
  brief:
    does: What the scheduler reads before it finalizes one node - the preliminary node contract with its
      slots and bounds, a draft final contract, accepted upstream outputs, earlier failures, finals and
      refused proposals, the capsules it may bind and the machine state. It carries the whole task contract
      and every node contract, the plan with this node's neighbours, the planner's briefing for this node,
      the admitted finals, accepted checks, cited evidence and capped runs of the done nodes, the operator
      records, halts and refusals of the run, the job queue, and per capsule its cc.yaml, docs, verification
      units, files and where this run bound it before. Large items are cut with a note naming the read.
    takes:
      node_id: text
    gives:
      brief: json
    needs:
    - python
    changes:
    - process.exec
  propose:
    does: Propose the final node contract for one node. Control code admits it only if it is more concrete
      or stricter than the preliminary contract, never weaker, and returns the recorded change or the
      reasons for refusal.
    takes:
      node_id: text
      final: json
      rationale: text
    gives:
      result: json
    needs:
    - python
    changes:
    - process.exec
  capsule:
    does: Read one capsule of the factory catalog - without path, the list of files in its folder; with path,
      one text file from that folder (60000 characters from offset). Read-only; the path must stay inside the
      capsule folder.
    takes:
      id: text
      path:
        kind: text
        optional: true
        description: A file path relative to the capsule folder, with / separators, as the file list gives it.
      offset:
        kind: json
        optional: true
        description: Character offset to read from (default 0); a cut file gives next_offset.
        schema:
          type: integer
          minimum: 0
    gives:
      capsule: json
    needs:
    - python
    changes:
    - process.exec
  evidence:
    does: Read one record of this task in full - an observation (node check, capped run, operator record,
      final contract), an artifact's whole text, an attempt or a decision - 200000 characters from offset.
      Read-only.
    takes:
      id: text
      offset:
        kind: json
        optional: true
        description: Character offset to read from (default 0); a cut record gives next_offset.
        schema:
          type: integer
          minimum: 0
    gives:
      record: json
    needs:
    - python
    changes:
    - process.exec
